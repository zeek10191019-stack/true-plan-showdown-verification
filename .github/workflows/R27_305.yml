         for(const p of side.pokemon){check(p&&Number.isFinite(p.hp)&&Number.isFinite(p.maxhp)&&p.maxhp>0,'HP');sum+=Math.max(0,Math.min(1,p.hp/p.maxhp))}
         return sum/side.pokemon.length}
