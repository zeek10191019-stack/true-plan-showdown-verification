        'use strict';
        /** R27.305 bounded two-turn public-hypothesis research simulator.
         * The caller must supply complete hypothetical p2 teams, not a live opponent object.
         * All internal battle state is from independently CREATED synthetic Showdown Battles.
         * hp-tempo is an uncalibrated utility, not a real Champions win probability.
         */
