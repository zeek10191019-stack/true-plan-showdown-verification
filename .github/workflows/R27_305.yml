        function team(t){check(Array.isArray(t)&&t.length===6,'TEAM_6');for(const p of t)check(p&&typeof p.species==='string'&&p.species.length&&Array.isArray(p.moves)&&p.moves.length>0&&p.moves.length<=4,'TEAM_SET')}
        function preview(p){check(typeof p==='string'&&/^team [1-6]{3}$/.test(p)&&new Set(p.slice(5)).size===3,'PREVIEW')}
        function req(b,i){check(b.sides&&b.sides[i]&&b.sides[i].activeRequest,'REQUEST');return b.sides[i].activeRequest}
        function action(r){const xs=legalPublicActions(r);const mv=xs.find(a=>/^move [1-4]$/.test(a));return mv||xs.find(a=>/^switch [1-6]$/.test(a))||error('NO_RESOLVABLE_ACTION')}
