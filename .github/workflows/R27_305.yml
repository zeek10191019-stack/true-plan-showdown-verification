         check(typeof Battle==='function','BATTLE');check(typeof formatid==='string'&&formatid.length>0,'FORMAT');team(ownTeam);
         check(worldTeams&&typeof worldTeams==='object'&&!Array.isArray(worldTeams),'WORLDS');const names=Object.keys(worldTeams);
         check(names.length>=1&&names.length<=8&&names.every(n=>/^[a-z0-9_-]{1,40}$/i.test(n)),'WORLD_IDS');
         for(const n of names)team(worldTeams[n]);preview(ownPreview);preview(foePreview);
         check(Array.isArray(seeds)&&seeds.length>=1&&seeds.length<=8&&new Set(seeds).size===seeds.length&&seeds.every(s=>Number.isInteger(s)&&s>0&&s<65536),'SEEDS');
         const fixedOwn=clone(ownTeam),fixedWorlds=clone(worldTeams),fixedSeeds=[...seeds];
         const audit={branchCalls:0,simulatedBattles:0,simulatedSecondTurns:0,forcedSwitchRecoveries:0,terminalAfterFirst:0,publicHypothesesOnly:true};
         function oracle({ownAction,opponentAction,worldId}={}){
          check(typeof ownAction==='string'&&/^(?:move [1-4](?: mega| megax| megay)?|switch [1-6])$/.test(ownAction),'OWN_ACTION');
          check(typeof opponentAction==='string'&&/^(?:move [1-4](?: mega| megax| megay)?|switch [1-6])$/.test(opponentAction),'OPP_ACTION');
          check(Object.hasOwn(fixedWorlds,worldId),'WORLD_UNKNOWN');audit.branchCalls++;
