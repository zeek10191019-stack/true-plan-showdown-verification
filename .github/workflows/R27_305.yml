         mk('Pikachu',['thunderbolt','quickattack'],'Static'),
         mk('Charizard',['flamethrower','scratch'],'Blaze','Charizardite X'),
         mk('Venusaur',['vinewhip','tackle'],'Overgrow'),
         mk('Snorlax',['tackle'],'Immunity'),
         mk('Blastoise',['surf'],'Torrent'),
         mk('Alakazam',['psychic'],'Synchronize'),
        ];
        const foe=(first)=>[
         mk('Blastoise',[first,'tackle'],'Torrent'),
         mk('Magikarp',['splash'],'Swift Swim'),
         mk('Eevee',['tackle'],'Run Away'),
         mk('Venusaur',['vinewhip'],'Overgrow'),
         mk('Machamp',['karatechop'],'No Guard'),
