              }
              check(changed,'STUCK_FORCE_SWITCH');
             }
             check(b.ended||b.requestState==='move','PHASE_SECOND');
             if(!b.ended){
              const nextOwn=action(req(b,0)),nextFoe=action(req(b,1));
