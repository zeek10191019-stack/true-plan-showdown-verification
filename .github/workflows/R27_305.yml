             }
            }
            const utility=boundedUtility(b);
            audit.simulatedBattles++;
            return {p:1/fixedSeeds.length,value:+utility.toFixed(8),revisit:ownAction.startsWith('switch ')?1:0};
           }finally{b.destroy()}
          });
         }
         return Object.freeze({oracle,audit,scope:'EXPLICIT_HYPOTHETICAL_TWO_TURN_HP_TEMPO_NOT_CALIBRATED_WIN_PROBABILITY'});
        }
