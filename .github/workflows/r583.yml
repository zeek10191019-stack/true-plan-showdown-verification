name: R583 Per-Frame 79-Field Text Index and One-Tap Archive (No IPA)
"on":
  push:
    branches: [main]
    paths: [.github/workflows/r583.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
      PYTHONOPTIMIZE: "0"
    steps:
      - name: Restore SHA-pinned R582, R580 Python evaluator, R583 strict overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'R583_REPLAY'
          import ast,base64,hashlib,json,lzma,re,textwrap,urllib.request
          from pathlib import Path
          sha=lambda b:hashlib.sha256(b).hexdigest()
          pinned=urllib.request.urlopen("https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/8b5d8586088926bbc12c6f695ee72894f5196082/.github/workflows/r582.yml",timeout=90).read()
          assert len(pinned)==10222 and sha(pinned)=="13e90d17652769b2013c8e6f23ff6cc39b3f332860135c0ffb629757a2f920cb",'R583_PARENT_R582_YAML_INVALID'
          m=re.search(r"python3 - <<'R582_REPLAY'\n(.*?)\n\s+R582_REPLAY",pinned.decode(),re.S)
          assert m,'R583_PARENT_R582_ENTRY_MISSING'
          source=textwrap.dedent(m.group(1));ast.parse(source)
          exec(compile(source,'R583_PINNED_R582_REPLAY','exec'))
          print('PASS_R583_REPLAYED_R582_PARENT')
          # Restore the exact R580 Python evaluator hop (the prior R582 CI omitted it).
          fix580=json.loads(lzma.decompress(base64.b64decode("")))
          for r in fix580:
           p=Path(r['path']);old=p.read_bytes() if p.exists() else b''
           assert (sha(old) if old else None) in (r['old_sha'],r['new_sha']),('BAD_R580_PARENT',r['path'])
           value=base64.b64decode(r['data'])
           assert sha(value)==r['new_sha'] and len(value)==r['len']
           p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(value)
          print('PASS_R583_RESTORED_R580_PYTHON_TOOLS')
          records=json.loads(lzma.decompress(base64.b64decode("")))
          assert len(records)==5
          for r in records:
           p=Path(r['path']);old=p.read_bytes() if p.exists() else b''
           assert (sha(old) if old else None)==r['old_sha'],('R583_WRONG_R582_PARENT',r['path'])
          for r in records:
           p=Path(r['path']);old=p.read_bytes() if p.exists() else b''
           updated=old[:r['prefix']]+base64.b64decode(r['insert'])+old[r['prefix']+r['remove']:]
           assert len(updated)==r['new_len'] and sha(updated)==r['new_sha'],('BAD_R583_PATCH',r['path'])
           p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(updated)
          assert len(list(Path('app/ios/ChampionsOnDevice').glob('*.swift')))==125
          assert 'maximumMembers = 24' in Path('app/ios/ChampionsOnDevice/R548ResearchArchive.swift').read_text()
          assert 'expectedFiles.count<=R548ResearchArchive.maximumMembers' in Path('app/ios/ChampionsOnDevice/R555StoredZIPReadback.swift').read_text()
          print('PASS_R583_ALL_SOURCE_SHA_AND_125_SWIFT_AND_19_MEMBER_CAPACITY')
          R583_REPLAY
      - name: R581 R582 R583 native index regression and Swift source syntax
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse app/ios/ChampionsOnDevice/*.swift
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R581ReadabilityCoverage.swift tests/R581CoverageHarness.swift -o "$RUNNER_TEMP/r581-test"
          "$RUNNER_TEMP/r581-test"
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R582AutoCaptureCoverage.swift tests/R582AutoCaptureCoverageHarness.swift -o "$RUNNER_TEMP/r582-test"
          "$RUNNER_TEMP/r582-test"
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R581ReadabilityCoverage.swift app/ios/ChampionsOnDevice/R583FrameReadabilityIndex.swift tests/R583FrameReadabilityHarness.swift -o "$RUNNER_TEMP/r583-test"
          "$RUNNER_TEMP/r583-test"
          python3 -m unittest discover -s tests -p test_r580_offline_adapter.py
      - name: Apple SDK Vision and iPhoneOS build (NO IPA)
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 tools/run_r571_native.py; then
            echo 'R583_APPLE_COMPILER_OR_OCR_FAILURE'
            for log in reports/xcode_iphoneos_build.log reports/r574_png_replay_compile.log; do
              if [ -f "$log" ]; then
                grep -nE 'error:|fatal error|BUILD FAILED' "$log" | tail -n 70 || true
              fi
            done
            exit 1
          fi
      - name: Certification disclaimer
        if: always()
        run: echo 'R583 indexes provisional OCR texts across max 8 retained PNGs; 79-field visual recognition, ownership, turn, and real-game accuracy are NOT certified. No IPA.'
