name: R737 Short Delivery - Not Device Certified
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/b7.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
    - name: Restore immutable R736 sources and apply R737
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
       set -euo pipefail
       url='https://api.github.com/repos/'
       url+='zeek10191019-stack/'
       url+='true-plan-showdown-verification/'
       url+='actions/artifacts/13729524670/zip'
       curl -fLsS --retry 2 -H "Authorization: Bearer $GH_TOKEN" \
        -H 'Accept: application/vnd.github+json' \
        "$url" -o /tmp/r737-base.zip
       mkdir -p R737Artifacts source
       python3 - <<'PY'
       import base64,lzma,hashlib,json,pathlib,zipfile,io
       root=pathlib.Path('source');out=pathlib.Path('R737Artifacts')
       digest=lambda b:hashlib.sha256(b).hexdigest()
       with zipfile.ZipFile('/tmp/r737-base.zip') as outer:
        assert outer.testzip() is None
        contents=outer.read('R735_ALL_EDITABLE_SOURCE_RECOVERY.zip')
       assert digest(contents)==(
        'e25b15bcb28c1e3f3543972112b95af2789be42be8e4642f97f5eca9c5cff63f'
       )
       with zipfile.ZipFile(io.BytesIO(contents)) as z:
        assert z.testzip() is None and len(z.namelist())==320
        for n in z.namelist():
         p=pathlib.PurePosixPath(n)
         assert not p.is_absolute() and '..' not in p.parts
         f=root.joinpath(*p.parts);f.parent.mkdir(parents=True,exist_ok=True)
