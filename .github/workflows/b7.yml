       )
       q=json.loads(raw)
       assert q['schema']=='trueplan.r737.additive-source-patch.v1'
       names=lambda:sorted(f.relative_to(root).as_posix()
         for f in root.rglob('*') if f.is_file() and '.build' not in f.parts)
       old=set(names());assert len(old)==320
       for name,e in q['replace'].items():
        f=root/name;b=f.read_bytes()
        assert digest(b)==e['old_sha']
        s=e.get('replacement_full',b.decode('utf8'))
        for a,z in e['operations']:
         assert s.count(a)==1
         s=s.replace(a,z,1)
        assert digest(s.encode())==e['new_sha']
        f.write_bytes(s.encode())
       for name,s in q['add'].items():
        f=root/name;assert not f.exists()
        f.parent.mkdir(parents=True,exist_ok=True)
        f.write_text(s,encoding='utf8')
       m=root/'source_manifest.json';h=json.loads(m.read_text())
       for name in h: h[name]=digest((root/name).read_bytes())
       for name in q['add']:h[name]=digest((root/name).read_bytes())
       m.write_text(json.dumps(h,sort_keys=True,
        ensure_ascii=False,indent=2)+'\n')
       assert digest(m.read_bytes())==q['manifest_sha256']
       new=names();assert len(new)==324 and old.issubset(new)
       hashes={n:digest((root/n).read_bytes()) for n in new}
       tree=''.join(n+'\t'+hashes[n]+'\n' for n in new).encode()
       assert digest(tree)==q['final_tree_sha256']
       (out/'R737_SOURCE_HASHES.json').write_text(
        json.dumps(hashes,sort_keys=True,indent=2)+'\n')
       print('R737_324_SHA_MATCH_ZERO_DELETION')
       PY
    - name: Swift regression, iPhoneOS build and full recovery
      shell: bash
      run: |
       set -euo pipefail
       (cd source/R720_PORTABLE_TESTS && swift test -j 2) \
        > R737Artifacts/SwiftTests.log 2>&1 || {
         tail -n 80 R737Artifacts/SwiftTests.log;exit 1;
        }
       grep -Fq 'Executed 167 tests, with 0 failures' \
        R737Artifacts/SwiftTests.log
       swiftc -frontend -parse source/app/ios/ChampionsOnDevice/*.swift
       python3 source/tools/generate_xcode_project.py
       xcodebuild -project source/app/ios/ChampionsOnDeviceResearch.xcodeproj \
        -scheme ChampionsOnDeviceResearch -configuration Debug \
        -sdk iphoneos -destination 'generic/platform=iOS' \
        ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
        -derivedDataPath "$RUNNER_TEMP/r737-app" build \
        > R737Artifacts/iPhoneOS.log 2>&1 || {
         grep -E 'error:|BUILD FAILED' R737Artifacts/iPhoneOS.log || true
         exit 1;
        }
       grep -Fq 'BUILD SUCCEEDED' R737Artifacts/iPhoneOS.log
       python3 - <<'PY'
       import pathlib,hashlib,json,zipfile,plistlib,os
       root=pathlib.Path('source');out=pathlib.Path('R737Artifacts')
       hashes=json.loads((out/'R737_SOURCE_HASHES.json').read_text())
       assert len(hashes)==324
       for name,sha in hashes.items():
        assert hashlib.sha256((root/name).read_bytes()).hexdigest()==sha
       zpath=out/'R737_ALL_EDITABLE_SOURCE_RECOVERY.zip'
       with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED) as z:
        for name in sorted(hashes):z.write(root/name,name)
       with zipfile.ZipFile(zpath) as z:
        assert z.testzip() is None and len(z.namelist())==324
        for name,sha in hashes.items():
         assert hashlib.sha256(z.read(name)).hexdigest()==sha
       base=pathlib.Path(os.environ['RUNNER_TEMP']) / \
        'r737-app/Build/Products/Debug-iphoneos'
       app=base/'ChampionsOnDeviceResearch.app'
       assert (app/'ChampionsOnDeviceResearch').is_file()
       info=plistlib.loads((app/'Info.plist').read_bytes())
       assert info['CFBundleVersion']=='737'
       assert info['CFBundleShortVersionString']=='0.7.37'
       ipa=out/'R737_Unsigned_Research.ipa'
       with zipfile.ZipFile(ipa,'w',compression=zipfile.ZIP_DEFLATED) as z:
        for f in sorted(app.rglob('*')):
         assert not f.is_symlink()
         if f.is_file():
          z.write(f,'Payload/'+app.name+'/'+f.relative_to(app).as_posix())
       with zipfile.ZipFile(ipa) as z:assert z.testzip() is None
       assert ipa.stat().st_size<16_000_000
       (out/'CERTIFICATION.txt').write_text(
        'CI PASS does not certify device OCR speed or 79 fields.\n'
        'R737 retains all 324 files, with 0 deletions.\n')
       print('R737_IPHONEOS_AND_EXACT_SOURCE_PASS')
       PY
