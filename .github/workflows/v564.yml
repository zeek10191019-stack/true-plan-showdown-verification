name: R564 Strict Owner Position Hints - iPhoneOS27 and macOS26 (NO IPA)
"on":
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
      && github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: xcode-27
            role: IOS27_BUILD
          - runner: macos-26-intel
            role: MACOS26_OCR
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      SCREEN_READ_R564_ROLE: ${{ matrix.role }}
    steps:
      - name: Restore exactly pinned R563, apply R564 overlay, verify native regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY564'
          import ast,base64,hashlib,json,lzma,os,re,sys,urllib.request
          from pathlib import Path
          def digest(d):return hashlib.sha256(d).hexdigest()
          repo='https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/'
          refs=[
            ('sr560', '5ccd725fa9ad55d215e2ffa3fb6b79792c610817','sr560.yml',381295,'4f9ba1f4bc57a3691c582eb0140e7d8368a039da31d9ccc1be05d89084437bed'),
            ('g561', '3569f51613e079a45dfcf7b8d044dd343fc844f7','g561.yml',74069,'af039146172ddbdbb44155de3040ab1b489af7185c9b49e6f323d799b3ca98c7'),
            ('v563', '16d71bc8c98aa2477586e783a73e491cc4b21fe2','v563.yml',58220,'a8a83582b5fb5b23c3fe2dda7a3034811df6f983e36edcfe6731630020808dea')]
          refs_data={}
          for key,commit,name,length,expected in refs:
              req=urllib.request.Request(repo+commit+'/.github/workflows/'+name,headers={'User-Agent':'R564-pinned-restore/1'})
              with urllib.request.urlopen(req,timeout=30) as response:data=response.read(length+1)
              assert len(data)==length and digest(data)==expected,('WORKFLOW_SOURCE_DRIFT',key)
              refs_data[key]=data
          pattern=r"stream.write\(\n((?:[ \t]+b'[A-Za-z0-9+/=]+'\n)+)[ \t]+\)"
          parts=re.findall(pattern,refs_data['v563'].decode())
          assert len(parts)==4,'R563_PART_COUNT'
          compressed=base64.b64decode(b''.join(ast.literal_eval('('+p+')') for p in parts),validate=True)
          decoder=lzma.LZMADecompressor();raw=decoder.decompress(compressed,max_length=1000001)
          assert decoder.eof and not decoder.unused_data and len(raw)==132500
          assert digest(raw)=='3cbb4178f9ee0c4885afb098a19b8e6a1f8d25689ba728232e347fda52464041'
          bundle=json.loads(raw);assert set(bundle)=={'source','bootstrap'}
          boot=Path('.r563_bootstrap');boot.mkdir()
          for name,source in bundle['bootstrap'].items():
              assert name in {'runtime_reference_source.py','source_guard_payload.py','r561_reference_source.py','r563_source_overlay.py'}
              (boot/name).write_text(source)
          sys.path.insert(0,str(boot.resolve()))
          import r563_source_overlay,r561_reference_source,source_guard_payload
          r561_reference_source.fetch_workflow=lambda:refs_data['g561']
          source_guard_payload.fetch_workflow=lambda:refs_data['sr560']
          record=r563_source_overlay.restore_current(Path.cwd(),bundle['source'],
              workflow=refs_data['g561'],base_workflow=refs_data['sr560'])
          assert record['identity']['source_tree_sha256']=='c76ff34a682bd218b0f62f76655a434f447121872d4a453ffb5c6f80a202c60c'
          assert record['identity']['source_count']==111 and len(record['files'])==207
