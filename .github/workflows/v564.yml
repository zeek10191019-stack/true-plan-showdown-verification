          PY564
      - name: Run role-specific Apple SDK check
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SCREEN_READ_R564_ROLE" = 'IOS27_BUILD' ]; then
            python3 tools/generate_xcode_project.py
            xcodebuild -project app/ios/ChampionsOnDeviceResearch.xcodeproj \
              -target ChampionsOnDeviceResearch -configuration Debug -sdk iphoneos \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
              CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/r564-build" \
              OBJROOT="$RUNNER_TEMP/r564-objects" SYMROOT="$RUNNER_TEMP/r564-symbols" build
            test -f "$RUNNER_TEMP/r564-build/ChampionsOnDeviceResearch.app/PrivacyInfo.xcprivacy"
            echo 'PASS_R564_IOS27_UNSIGNED_APP_BUILD_NO_IPA'
          elif [ "$SCREEN_READ_R564_ROLE" = 'MACOS26_OCR' ]; then
            python3 tools/run_r564_mac_ocr.py
            echo 'PASS_R564_MACOS26_NATIVE_VISION_SYNTHETIC_NO_GAME_OCR_CERTIFICATION'
          else
            echo 'FAIL_UNEXPECTED_RUNNER_ROLE';exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R564_SOURCE_VERIFICATION_${{ matrix.role }}
          path: r564_gate.json
          retention-days: 3
