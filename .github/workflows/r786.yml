    - name: Enable real video codec regression NO IPA
      id: codecs
      if: always() && steps.patch786.outcome == 'success' && matrix.lane == 'iphoneos-compile'
      run: |
        set -euo pipefail
        if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install ffmpeg
        fi
        ffmpeg -version > R786Proof/Codecs.log
        ffprobe -version >> R786Proof/Codecs.log
    - name: Source preservation and static capture gates
      id: checks
      if: always() && steps.patch786.outcome == 'success' && matrix.lane == 'iphoneos-compile'
      shell: bash
      run: |
        set -euo pipefail
        for script in r761_preflight r742_live_path_audit \
          r743_macos_compat_audit r745_read_path_gate \
          r748_capture_path_gate r780_project_source_parity; do
          python3 "source/tools/$script.py" \
            > "R786Proof/$script.log" 2>&1 || {
              cat "R786Proof/$script.log"; exit 1;
            }
        done
        python3 - <<'PYTIMER'
        from pathlib import Path
        p=Path('source/app/ios/ChampionsOnDevice/CaptureCoordinator.swift')
        matches=[line.strip() for line in p.read_text().splitlines()
                 if 'timer.schedule(deadline:' in line]
        assert len(matches)==1, matches
        probe=('import Foundation\nimport Dispatch\n'
               'func check() {\n'
               'let timer = DispatchSource.makeTimerSource()\n'
               +matches[0]+'\n}\n')
        Path('R786Proof/TimerTypecheck.swift').write_text(probe)
        PYTIMER
        swiftc -typecheck R786Proof/TimerTypecheck.swift \
          > R786Proof/TimerTypecheck.log 2>&1 || {
            cat R786Proof/TimerTypecheck.log; exit 1;
          }
        python3 - <<'PYGATE'
        from pathlib import Path
        app=Path('source/app/ios/ChampionsOnDevice')
        core=Path('source/R720_PORTABLE_TESTS/Sources/R719Core')
        for stem in ('R767QuickEpochExecutionPool',
                     'R766OCRWorkerLivenessLedger',
                     'R765OCRSourceLaneScheduler',
                     'R764CaptureLivenessLedger',
                     'R763CaptureGapLedger',
                     'R762SingleFrameConflictFence'):
         a=(app/(stem+'.swift')).read_bytes()
         b=(core/(stem+'.swift')).read_bytes()
         assert a==b,stem
        capture=(app/'CaptureCoordinator.swift').read_text()
        markers=(
         'r767QuickEpochPool.submit(epoch:quickEpoch',
         'R767_QUICK_RETIRED_BEFORE_VISION',
         'self.r766OCRWorkers.poll(nowMs:nowMs)',
         'r766OCRWorkers.deadline(lane:.quick',
         'r766OCRWorkers.deadline(lane:.detail',
         'r765SourceLanes.submitQuick {',
         'r765SourceLanes.submitDetail {',
         'r765SourceLanes.drainBeforeFinalizing()',
         'r764Liveness.observe(sessionToken:',
         'startR764Watchdog(token:',
         'r764Liveness.poll(sessionToken:',
         'r763GapLedger.observe(epoch:generation',
         'recognition/r763_callback_time_gaps.json')
        for m in markers:assert m in capture,m
        for m in ('recognition/r767_quick_epoch_workers.json',
                  'recognition/r766_physical_vision_workers.json',
                  'recognition/r764_callback_liveness.json'):
