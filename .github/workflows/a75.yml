       assert obj['v']==1 and len(obj['rows'])==9
       root=pathlib.Path('R727Source')
       prior={p.relative_to(root).as_posix()
              for p in root.rglob('*') if p.is_file()}
       assert len(prior)==312
       for name,row in obj['rows'].items():
        assert not name.startswith('/') and '..' not in name.split('/')
        assert (name in prior)==(row['a'] is not None)
        p=root/name
        old=p.read_bytes() if name in prior else b''
        if row['a']:
         assert hashlib.sha256(old).hexdigest()==row['a']
        lines=old.decode('utf-8').splitlines(keepends=True)
        for start,stop,change in reversed(row['d']):
         assert 0<=start<=stop<=len(lines)
         lines[start:stop]=[change]
        new=''.join(lines).encode('utf-8')
        assert hashlib.sha256(new).hexdigest()==row['b'],name
        p.parent.mkdir(parents=True,exist_ok=True)
        p.write_bytes(new)
       now={p.relative_to(root).as_posix()
            for p in root.rglob('*') if p.is_file()}
       assert prior.issubset(now) and len(now)==316
       print('R735_ALL_316_SOURCE_SHA_PASS')
       PY
