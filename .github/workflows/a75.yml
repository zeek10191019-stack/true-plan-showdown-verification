       raw=lzma.decompress(base64.b64decode(''.join(encoded.split())))
       expected_packet_sha=(
        'b0a9213986422e72a02e0eb6719101c53eebfae8c0434fc0d94cd6ae3ae8dbd0'
       )
       assert hashlib.sha256(raw).hexdigest()==expected_packet_sha
       p=json.loads(raw)
       assert p['schema']=='trueplan.r735.no-source-removal.incremental-v1'
       root=pathlib.Path('R727Source')
       def paths():
        return sorted(x.relative_to(root).as_posix() for x in root.rglob('*')
                      if x.is_file() and '.build' not in x.parts)
       before=paths()
       assert len(before)==316 and all(n not in before for n in p['add'])
       for name,patch in p['replace'].items():
        target=root/name
        contents=target.read_bytes()
        assert hashlib.sha256(contents).hexdigest()==patch['old_sha256']
        text=contents.decode('utf-8')
        for old,new in patch['replacements']:
         assert text.count(old)==1,(name,'source patch mismatch')
         text=text.replace(old,new,1)
        data=text.encode('utf-8')
        assert hashlib.sha256(data).hexdigest()==patch['new_sha256']
        target.write_bytes(data)
       for name,content in p['add'].items():
        target=root/name
        assert not target.exists()
        target.parent.mkdir(parents=True,exist_ok=True)
        target.write_text(content,encoding='utf-8')
       # Reconstitute the manifest without embedding 40KB.
       manifest=root/'source_manifest.json'
       m=json.loads(manifest.read_text())
       for name in list(m):
        assert (root/name).is_file()
        m[name]=hashlib.sha256((root/name).read_bytes()).hexdigest()
       key='app/ios/ChampionsOnDevice/R735OCRJournalKey.swift'
       m[key]=hashlib.sha256((root/key).read_bytes()).hexdigest()
       manifest.write_text(json.dumps(m,indent=2,ensure_ascii=False,
                                      sort_keys=True)+'\n')
       after=paths()
       assert len(after)==p['final_count'] and set(before).issubset(after)
       tree=''.join(
        k+'\t'+hashlib.sha256((root/k).read_bytes()).hexdigest()+'\n'
        for k in after).encode()
       assert hashlib.sha256(tree).hexdigest()==p['expected_tree_sha256']
       assert hashlib.sha256(manifest.read_bytes()).hexdigest()==(
        p['source_manifest_sha256'])
       print('R735_ALL_320_FILES_SHA256_PASS_ZERO_DELETIONS')
       PY
    - name: Run all Swift tests and app Swift syntax checks
      shell: bash
      run: |
       set -euo pipefail
       (cd R727Source/R720_PORTABLE_TESTS && \
        swift test -j 2) > R735Artifacts/R735_SWIFT_TESTS.log 2>&1 || {
        tail -n 120 R735Artifacts/R735_SWIFT_TESTS.log; exit 1;
       }
       msg='Executed 153 tests, with 0 failures'
       grep -Fq "$msg" R735Artifacts/R735_SWIFT_TESTS.log
       swiftc -frontend -parse R727Source/app/ios/ChampionsOnDevice/*.swift \
         > R735Artifacts/R735_SWIFT_PARSE.log 2>&1
       echo R735_153_SWIFT_TESTS_AND_239_SYNTAX_PASS
    - name: Build unsigned full iPhoneOS app with R735 source
      shell: bash
      run: |
       set -euo pipefail
       python3 R727Source/tools/generate_xcode_project.py
       project=R727Source/app/ios/ChampionsOnDeviceResearch.xcodeproj
       xcodebuild -project "$project" \
        -scheme ChampionsOnDeviceResearch -configuration Debug \
        -sdk iphoneos -destination 'generic/platform=iOS' \
        -derivedDataPath "$RUNNER_TEMP/r734-derived" \
        ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build \
        > R735Artifacts/R735_IPHONEOS_XCODEBUILD.log 2>&1 || {
         grep -E 'error:|BUILD FAILED' \
          R735Artifacts/R735_IPHONEOS_XCODEBUILD.log | tail -n 100 || true
         exit 1;
        }
       grep -Fq 'BUILD SUCCEEDED' R735Artifacts/R735_IPHONEOS_XCODEBUILD.log
       python3 - <<'PY'
       import os,pathlib,zipfile,json,plistlib
       base=(pathlib.Path(os.environ['RUNNER_TEMP']) /
             'r734-derived/Build/Products/Debug-iphoneos')
       app=base/'ChampionsOnDeviceResearch.app'
       assert app.is_dir() and (app/'ChampionsOnDeviceResearch').is_file()
       info=plistlib.loads((app/'Info.plist').read_bytes())
       assert info['CFBundleVersion']=='735'
       assert info['CFBundleShortVersionString']=='0.7.35'
       log=(pathlib.Path('R735Artifacts/R735_IPHONEOS_XCODEBUILD.log')
            .read_text(errors='replace'))
       for name in (
        'R735OCRJournalKey.swift','R733QuickTextSampler.swift',
        'CaptureCoordinator.swift','R710ContinuousRecorder.swift'
       ):
        assert name in log,('R735_CHANGED_SOURCE_NOT_COMPILED',name)
       ipa=pathlib.Path('R735Artifacts/R735_Unsigned_Research.ipa')
       with zipfile.ZipFile(
        ipa,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6
       ) as z:
        for p in sorted(app.rglob('*')):
         if p.is_file():z.write(p,arcname='Payload/'+str(p.relative_to(base)))
       with zipfile.ZipFile(ipa) as z:assert z.testzip() is None
       assert ipa.stat().st_size<12_000_000
       receipt=pathlib.Path('R735Artifacts/R735_COMPILE_RECEIPT.json')
       receipt.write_text(json.dumps({
        'full_unsigned_iphoneos_compile':'PASS', 'build':'735',
        'swift_tests':'153/153 PASS', 'source_files':320,
        'device_certified_79_fields':0,
        'under_one_second_on_device':'NOT_MEASURED',
        'manual_stop_on_device':'NOT_TESTED',
        'no_regression_on_device':'NOT_CERTIFIED'},indent=2))
       print('R735_FULL_IPHONEOS_BUILD_PASS_NOT_DEVICE_CERTIFIED')
       PY
    - name: Export byte-perfect 320-file full source recovery ZIP
      shell: bash
      run: |
       set -euo pipefail
       python3 - <<'PY'
       import hashlib,json,pathlib,zipfile
       src=pathlib.Path('R727Source');out=pathlib.Path('R735Artifacts')
       files=sorted(p for p in src.rglob('*')
                    if p.is_file() and '.build' not in p.parts)
       assert len(files)==320
       archive=out/'R735_ALL_EDITABLE_SOURCE_RECOVERY.zip'
       with zipfile.ZipFile(
        archive,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9
       ) as z:
        for p in files:z.write(p,str(p.relative_to(src)))
       with zipfile.ZipFile(archive) as z:
        assert z.testzip() is None and len(z.namelist())==320
        for p in files:
         rel=p.relative_to(src).as_posix()
         assert hashlib.sha256(z.read(rel)).digest()==(
          hashlib.sha256(p.read_bytes()).digest())
       print('R735_RECOVERY_ZIP_CRC_AND_SHA_PASS',archive.stat().st_size)
       PY
    - name: Public-only artifact and billing guard
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
       set -euo pipefail
       python3 - <<'PY'
       import pathlib
       size=sum(p.stat().st_size
                for p in pathlib.Path('R735Artifacts').rglob('*')
                if p.is_file())
       assert size<16_000_000,('R735_ARTIFACT_TOO_LARGE',size)
       print('R735_SMALL_ARTIFACT_PASS',size)
       PY
