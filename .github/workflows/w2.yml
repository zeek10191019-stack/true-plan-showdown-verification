jobs:
  build:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            1e63efa4db514cc122f2940a39623d9bc65c554c
      - name: Verify R695 and build IPA
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os,re,base64,lzma,hashlib
          import pathlib,urllib.request,ast
          url=('https://raw.githubusercontent.com/'
            'zeek10191019-stack/'
            'true-plan-showdown-verification/'
            'main/.github/workflows/w1.yml')
          req=urllib.request.Request(url,headers={
            'User-Agent':'R695-Pinned-Builder'})
          with urllib.request.urlopen(
            req,timeout=40) as res:
            old=res.read(20000)
          assert len(old)==9758
          assert hashlib.sha256(old).hexdigest()==(
            '0327ab9a2aed81f4219a6f86d4754955'
            'a22d3ca8a6e6a3d411c00fd21c8a6578')
          m=re.search(rb'(?m)^  R694_PKG: >-\n'
            rb'((?:    [^\n]*\n)+)',old)
          assert m,'R694_PINNED_PACKAGE_MISSING'
          os.environ['R694_PKG']=b''.join(
            m[1].split()).decode('ascii')
          raw=lzma.decompress(base64.b64decode(
            os.environ['R695_PKG']),
            format=lzma.FORMAT_ALONE)
          assert hashlib.sha256(raw).hexdigest()==(
            'b75f2ddf4e4e0d11571ee3d3a9c7d13e'
            '1257de0e3112e517b3fc593677d648dc')
          names=['R695TypedHUDValues.swift',
            'R695Patch.py','R695MakeBuild.py',
            'R695Smoke.swift']
          sizes=[8866, 1626, 2590, 4947]
          assert sum(sizes)==len(raw)
          pos=0
          for name,size in zip(names,sizes):
            folder='tests' if name.endswith(
              'Smoke.swift') else 'tools'
            p=pathlib.Path(folder)/name
            p.parent.mkdir(parents=True,
              exist_ok=True)
            p.write_bytes(raw[pos:pos+size])
            pos+=size
          print('R695_SOURCE_SHA_PASS',flush=True)
          text=old.decode('utf-8')
          marker="          python3 - <<'PYCODE'\n"
          start=text.index(marker)+len(marker)
          end=text.index('\n          PYCODE',start)
          block=text[start:end]
          body='\n'.join(line[10:] for line in
            block.splitlines())
          needle=("['python3','tools/"+
            "R694MakeBuild.py']")
          assert body.count(needle)==1
          body=body.replace(needle,
            "['python3','tools/R695MakeBuild.py']")
          ast.parse(body)
          exec(compile(body,'r694','exec'),{})
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: R695-unsigned-iLoader-IPA
          path: dist/R695*
          if-no-files-found: error
          retention-days: 7
