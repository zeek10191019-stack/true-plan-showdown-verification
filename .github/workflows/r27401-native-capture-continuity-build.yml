          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPO"
          test "${IS_PRIVATE:-unknown}" = 'false'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
