      - name: Run 123 Foundation assertions including 44 new capture telemetry tests
        shell: bash
        run: |
          set -euo pipefail
          swiftc ios/ChampionsOnDevice/OnDeviceConsensus.swift tests/main.swift -o /tmp/r27401-consensus
          /tmp/r27401-consensus
          swiftc ios/ChampionsOnDevice/FramePacket.swift ios/ChampionsOnDevice/FrameWindowGate.swift tests/gate_runner/main.swift -o /tmp/r27401-window
          /tmp/r27401-window
          swiftc ios/ChampionsOnDevice/ObservationFence.swift tests/fence_runner/main.swift -o /tmp/r27401-fence
          /tmp/r27401-fence
          swiftc ios/ChampionsOnDevice/ResearchVoiceGate.swift tests/voice_gate_runner/main.swift -o /tmp/r27401-voice
          /tmp/r27401-voice
          swiftc ios/ChampionsOnDevice/CaptureContinuityAudit.swift tests/continuity_runner/main.swift -o /tmp/r27401-continuity
          /tmp/r27401-continuity
          echo 'FOUNDATION_ASSERTIONS=123_PASS; NO_MOVE_RECOMMENDATIONS'
      - name: Compile unsigned iPhoneOS 27 app including continuity telemetry
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          printf '%s\n' 'import ScreenCaptureKit' 'import Vision' 'import AVFoundation' 'func check() { _ = SCContentSharingPicker.shared; _ = AVSpeechSynthesizer() }' > /tmp/r27401-check.swift
          xcrun --sdk iphoneos swiftc -typecheck -sdk "$sdk" -target arm64-apple-ios27.0 /tmp/r27401-check.swift
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate --spec ios/project.yml --project ios
          if xcodebuild -project ios/ChampionsOnDeviceResearch.xcodeproj -scheme ChampionsOnDeviceResearch \
              -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
              build > /tmp/r27401-build.log 2>&1; then
            echo 'IPHONEOS_UNSIGNED_BUILD=PASS; BACKGROUND_FRAMES_ON_REAL_IPHONE=NOT_CERTIFIED'
          else
            echo 'IPHONEOS_UNSIGNED_BUILD=FAIL'
            grep -E -C 3 'error:|BUILD FAILED|No such module' /tmp/r27401-build.log | head -155 || true
            exit 1
          fi
      - name: Enforce formal certification boundary
        run: |
          echo 'NO_APP_SIGNING; NO_INSTALL; NO_REAL_SCREEN_BACKGROUND_TEST; NO_VOICE_RUNTIME; NO_RECOMMENDATIONS'
