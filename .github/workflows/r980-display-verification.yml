      - name: Replay Lenovo display and archive regressions and build iPhoneOS arm64
        shell: bash
        run: |
          set -euo pipefail
          src=pinned-r793/source
          native="$src/app/ios/ChampionsOnDevice"
          swiftc -parse-as-library "$native/R975FinalMovieSample.swift" "$native/R710EvidenceState.swift" "$native/R733UserControlledCapturePolicy.swift" "$native/R734RecordingFinishPolicy.swift" "$src/tools/tests/r975_movie_sample_check.swift" -o "$RUNNER_TEMP/r975-movie-test"
          "$RUNNER_TEMP/r975-movie-test" | tee "$RUNNER_TEMP/r980-movie-test.log"
          grep -F R978_STOP_CALLBACK_AND_RESUME_CHECK_PASS "$RUNNER_TEMP/r980-movie-test.log"
          archive_files=(R714ChunkedEvidence R730SplitReadback R936ExportJob R689StreamingZIP R548ResearchArchive R551EvidenceIntegrity R555StoredZIPReadback R729EvidenceTransportPolicy R731ArchiveCapacity)
          node "$src/tools/tests/test_r920_pc_display.mjs" "$RUNNER_TEMP/r979-display.swift" | tee "$RUNNER_TEMP/pc-baseline.log"
          grep -F R979_PC_VISIBILITY_AND_PAINT_BUGS_REPRODUCED "$RUNNER_TEMP/pc-baseline.log"
          node "$src/tools/tests/test_r920_pc_display.mjs" | tee "$RUNNER_TEMP/pc-corrected.log"
          grep -F 'R920 browser script measurement regressions passed (18 cases)' "$RUNNER_TEMP/pc-corrected.log"
          swift_sources=()
          for name in "${archive_files[@]}"; do swift_sources+=("$native/$name.swift"); done
          swiftc -O -parse-as-library "${swift_sources[@]}" "$src/tools/tests/r979_archive_check.swift" -o "$RUNNER_TEMP/archive-corrected"
          "$RUNNER_TEMP/archive-corrected" corrected | tee "$RUNNER_TEMP/archive-corrected.log"
          grep -F R979_ARCHIVE_REGRESSION_PASS_3 "$RUNNER_TEMP/archive-corrected.log"
          project="$src/app/ios/ChampionsOnDeviceResearch.xcodeproj"
          xcodebuild -project "$project" -scheme ChampionsOnDeviceResearch -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO -derivedDataPath "$RUNNER_TEMP/r980-build" build > "$RUNNER_TEMP/r975-native.log" 2>&1 || { grep -E -B2 -A2 'error:|BUILD FAILED' "$RUNNER_TEMP/r975-native.log"; exit 1; }
          grep -F 'BUILD SUCCEEDED' "$RUNNER_TEMP/r975-native.log"
          app="$RUNNER_TEMP/r980-build/Build/Products/Release-iphoneos/ChampionsOnDeviceResearch.app"
          test "$(lipo -archs "$app/ChampionsOnDeviceResearch")" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Info.plist")" = 980
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist")" = 0.9.80
      - name: Run integrated export, browser, Swift and PC regressions
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e '
            steps = YAML.load_file(ARGV.fetch(0), aliases: true).fetch("jobs").fetch(ARGV.fetch(1)).fetch("steps")
            puts steps.find { |step| step["name"] == ARGV.fetch(2) }.fetch("run")
          ' "$RUNNER_TEMP/r974-device-test.yml" verify 'Run Swift, Python and browser regressions' > "$RUNNER_TEMP/r975-verify.sh"
          bash "$RUNNER_TEMP/r975-verify.sh"
          grep -F "testR975RetainsLiteralClockAndHUDWithoutPromotingTheActiveState]' passed" "$RUNNER_TEMP/r966-swift.log"
      - name: Validate the IPA and stage the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/r980-package"
          mkdir -p "$work/Payload" "$work/draft-readback"
          app="$RUNNER_TEMP/r980-build/Build/Products/Release-iphoneos/ChampionsOnDeviceResearch.app"
          ditto "$app" "$work/Payload/ChampionsOnDeviceResearch.app"
          cd "$work"
          zip -qry R980_Unsigned_DeviceTest.ipa Payload
          python3 - <<'PY'
          import hashlib, json, os, plistlib, struct, zipfile
          from pathlib import Path

          bundle = Path("Payload/ChampionsOnDeviceResearch.app")
          ipa = Path("R980_Unsigned_DeviceTest.ipa")
          files = {p.as_posix():p for p in bundle.rglob("*") if p.is_file()}
          with zipfile.ZipFile(ipa) as archive:
              assert archive.testzip() is None
              entries = [item.filename for item in archive.infolist() if not item.is_dir()]
              assert len(set(entries)) == len(entries) and set(entries) == set(files)
              assert all(archive.read(name) == files[name].read_bytes() for name in entries)
              info = plistlib.loads(archive.read((bundle / "Info.plist").as_posix()))
          assert (info["CFBundleIdentifier"], info["CFBundleVersion"], info["CFBundleShortVersionString"],
                  info["MinimumOSVersion"], info["DTPlatformName"]) == (
                  "com.zeek10191019.championsresearch", "980", "0.9.80", "27.0", "iphoneos")
          assert info["NSLocalNetworkUsageDescription"] and "screen-capture" in info["UIBackgroundModes"]
          for binary in [bundle / info["CFBundleExecutable"], *bundle.glob("*.dylib")]:
              data = binary.read_bytes()
              magic, cpu, _, kind, commands, command_bytes, *_ = struct.unpack_from("<8I", data)
              assert magic == 0xfeedfacf and cpu == 0x0100000c and kind in (2, 6)
              offset, platforms = 32, []
              for _ in range(commands):
                  command, size = struct.unpack_from("<2I", data, offset)
                  assert size >= 8 and offset + size <= len(data) and command != 29
                  if command == 50:
                      platforms.append(struct.unpack_from("<I", data, offset + 8)[0])
                  offset += size
              assert offset == 32 + command_bytes and platforms == [2]
          report = {
              "build": 980, "version": "0.9.80", "signed": False, "min_ios": "27.0",
              "ipa": {"name": ipa.name, "bytes": ipa.stat().st_size,
                      "sha256": hashlib.sha256(ipa.read_bytes()).hexdigest()},
              "source_workflow_commit": os.environ["GITHUB_SHA"],
              "source_manifest_sha256": "68178c761d313d76908fe8effffe4c2423be4e5fe6d00636b7337b2e30330e3e",
              "passed_regression_run": int(os.environ["GITHUB_RUN_ID"]),
              "packaging_workflow_commit": os.environ["GITHUB_SHA"],
              "packaging_run": int(os.environ["GITHUB_RUN_ID"]),
              "r980_physical_end_to_end_status": "UNVERIFIED",
          }
          Path("VERIFICATION_R980.json").write_text(json.dumps(report, indent=2) + "\n")
          print("R980_IPA_VERIFIED", json.dumps(report))
          PY
          assets=(R980_Unsigned_DeviceTest.ipa VERIFICATION_R980.json)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish > existing.json 2>/dev/null; then
            jq -e --arg commit "$GITHUB_SHA" '.isDraft and .targetCommitish == $commit' existing.json
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease \
              --title 'R980 iPhone実機試験 0.9.80' \
              --notes '未署名のiPhoneOS 27.0以降・arm64用IPA。Lenovoブラウザーのタブ切り替えと読取値更新時の描画応答計測を修正した実機試験版。導入前に現在の方法で署名してください。'
          fi
          for asset in "${assets[@]}"; do
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir draft-readback
            cmp "$asset" "draft-readback/$asset"
          done
  vision:
    name: Original-image Apple Vision regression
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && !github.event.repository.private && github.ref == 'refs/heads/r975-device-regression'
    runs-on: macos-26
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RELEASE_TAG: r980-unsigned-device-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: .github/workflows/r980-display-verification.yml
      - name: Restore verified R979 and apply the R980 corrections
        shell: bash
        run: *restore
      - name: Replay retained Apple Vision fixtures
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e '
            steps = YAML.load_file(ARGV.fetch(0), aliases: true).fetch("jobs").fetch(ARGV.fetch(1)).fetch("steps")
            puts steps.find { |step| step["name"] == ARGV.fetch(2) }.fetch("run")
          ' "$RUNNER_TEMP/r974-device-test.yml" vision 'Replay retained Apple Vision images' > "$RUNNER_TEMP/r975-vision.sh"
          bash "$RUNNER_TEMP/r975-vision.sh"
  publish:
    name: Publish only after both checks pass
    needs: [verify, vision]
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && !github.event.repository.private && github.ref == 'refs/heads/r975-device-regression'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: r980-unsigned-device-test
    steps:
      - name: Verify draft assets and publish the unsigned test IPA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/staged" "$RUNNER_TEMP/public"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish |
            jq -e --arg commit "$GITHUB_SHA" '.isDraft and .targetCommitish == $commit'
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/staged"
          python3 - <<'PYTHON'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "staged"
          report = json.loads((root/"VERIFICATION_R980.json").read_text())
          assert report["build"] == 980 and report["version"] == "0.9.80" and report["signed"] is False
          assert report["source_workflow_commit"] == report["packaging_workflow_commit"] == os.environ["GITHUB_SHA"]
          assert report["passed_regression_run"] == report["packaging_run"] == int(os.environ["GITHUB_RUN_ID"])
          assert report["source_manifest_sha256"] == "68178c761d313d76908fe8effffe4c2423be4e5fe6d00636b7337b2e30330e3e"
          info = report["ipa"]
          assert info["name"] == "R980_Unsigned_DeviceTest.ipa"
          ipa = root/info["name"]
          assert len(ipa.read_bytes()) == info["bytes"]
          assert hashlib.sha256(ipa.read_bytes()).hexdigest() == info["sha256"]
          print("R980_IPA_VERIFIED", json.dumps(report))
          PYTHON
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          for asset in R980_Unsigned_DeviceTest.ipa VERIFICATION_R980.json; do
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$asset"
            curl --fail -sSL --retry 4 --retry-all-errors "$url" -o "$RUNNER_TEMP/public/$asset"
            cmp "$RUNNER_TEMP/staged/$asset" "$RUNNER_TEMP/public/$asset"
            printf 'R980_PUBLIC_READBACK_VERIFIED %s\n' "$url"
          done
