name: R980 Lenovo browser lifecycle
'on':
  push:
    branches: [r975-device-regression]
    paths: [.github/workflows/r980-display-verification.yml]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: r980-unsigned-device-test
  cancel-in-progress: false
jobs:
  verify:
    name: Swift, browser, PC and iPhoneOS regression
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && !github.event.repository.private && github.ref == 'refs/heads/r975-device-regression'
    runs-on: xcode-27
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RELEASE_TAG: r980-unsigned-device-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: .github/workflows/r980-display-verification.yml
      - name: Restore verified R979 and apply the R980 corrections
        shell: bash
        run: &restore |
          set -euo pipefail
          git show 2df1d6741113fcedc90e988aa4c3989bfaef859d:.github/workflows/r979-archive-verification.yml > "$RUNNER_TEMP/r979-baseline.yml"
          echo '7e640e50f87e816cb8f739b26f026d4144bc6baa8ff58adfeab74c40d64dbaef  r979-baseline.yml' | (cd "$RUNNER_TEMP" && shasum -a 256 -c -)
          ruby -ryaml -e '
            steps = YAML.load_file(ARGV.fetch(0), aliases: true).fetch("jobs").fetch("verify").fetch("steps")
            puts steps.find { |step| step["name"] == "Restore verified R978 and apply the R979 corrections" }.fetch("run")
          ' "$RUNNER_TEMP/r979-baseline.yml" > "$RUNNER_TEMP/r979-restore.sh"
          bash "$RUNNER_TEMP/r979-restore.sh"
          cp "pinned-r793/source/app/ios/ChampionsOnDevice/R920QuickPCDisplay.swift" "$RUNNER_TEMP/r979-display.swift"
