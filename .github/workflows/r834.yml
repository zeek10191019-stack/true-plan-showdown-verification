name: R834 D94 Production QUICK real PNG preflight NO IPA
on:
  push:
    branches: [main]
    paths: [.github/workflows/r834.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
        - {runner: macos-26, lane: real-apple-vision}
        - {runner: xcode-27, lane: iphoneos-compile}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 4cc925234f9101a8875744e75049f06e96ce4d90
        path: pinned-r823
        persist-credentials: false
        sparse-checkout: .github/workflows/r823.yml
        sparse-checkout-cone-mode: false
    - uses: actions/checkout@v4
      with:
        ref: 641a9ee8701484fabaf9344db5a0eaab31c422c3
        path: pinned-r821
        persist-credentials: false
        sparse-checkout: .github/workflows/r821.yml
        sparse-checkout-cone-mode: false
    - uses: actions/checkout@v4
      with:
        ref: 46b607b88ddb5569fff0fc042dfdb5f0fb6e06f6
        path: pinned-r819
        persist-credentials: false
        sparse-checkout: .github/workflows/r819.yml
        sparse-checkout-cone-mode: false
    - uses: actions/checkout@v4
      with:
        ref: 37b3e26851c71fcabd65da3299356c1e38c53869
        path: pinned-r793
        persist-credentials: false
        sparse-checkout: |
          .github/workflows/d30.b64
          .github/workflows/r793.yml
        sparse-checkout-cone-mode: false
    - uses: actions/checkout@v4
      with:
        ref: b783a785f97d0b74c9a1d48780dcee9626aef12c
        path: pinned-r833
        persist-credentials: false
        sparse-checkout: .github/workflows/r833.yml
        sparse-checkout-cone-mode: false
    - name: Restore SHA-verified D93 source and apply bounded QUICK delta
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        from pathlib import Path
        import subprocess,json,hashlib,os,base64,lzma
        base=Path.cwd();root=base/'pinned-r793'
        proof=base/'R834Proof';proof.mkdir(exist_ok=True)
        env=os.environ.copy();env['GITHUB_WORKSPACE']=str(root)
        def recipe(rev):
            p=base/f'pinned-r{rev}/.github/workflows/r{rev}.yml'
            rb="require 'yaml';require 'json';puts JSON.generate(YAML.load_file(ARGV.fetch(0)).fetch('jobs').fetch('verify').fetch('steps'))"
            return json.loads(subprocess.check_output(['ruby','-e',rb,str(p)],text=True))
        def run(rev,i,cwd):
            step=recipe(rev)[i];cmd=step['run']
            assert chr(36)+'{{' not in cmd
            log=proof/f'restore_{rev}_{i}.log'
            with log.open('w') as f:
                r=subprocess.run(['bash','-e','-o','pipefail','-c',cmd],cwd=cwd,env=env,stdout=f,stderr=subprocess.STDOUT,timeout=360)
            print('SOURCE_RESTORE',rev,i,r.returncode,flush=True)
            if r.returncode:
                print(log.read_text()[-6000:]);raise SystemExit(r.returncode)
        for i in list(range(1,17))+[21,41,46,52,58,64]:run(819,i,root)
        run(821,3,root);run(823,4,root)
        for i in range(6,12):run(833,i,base)
        src=root/'source';sha=lambda b:hashlib.sha256(b).hexdigest()
        manifest=json.loads((src/'source_manifest.json').read_text())
        def files():
            return {str(p.relative_to(src)):p for p in src.rglob('*') if p.is_file() and not {'.build','.swiftpm','__pycache__'}.intersection(p.parts)}
        def tree(fs):
            return sha(''.join(n+'\t'+sha(fs[n].read_bytes())+'\n' for n in sorted(fs)).encode())
        fs=files()
        assert len(fs)==596 and set(fs)==set(manifest)|{'source_manifest.json'}
        assert all(sha(fs[n].read_bytes())==h for n,h in manifest.items())
        assert tree(fs)=='698401dc110214aae9f4383672a15e9c88d8342beed3a08d74cdfde9fdc3b85d'
        payload=json.loads(lzma.decompress(base64.b64decode('')))
        for n,v in payload.items():
            p=src/n
            assert not Path(n).is_absolute() and '..' not in Path(n).parts
            if v['old'] is None:assert not p.exists()
            else:assert sha(p.read_bytes())==manifest[n]==v['old']
            b=base64.b64decode(v['b64']);assert sha(b)==v['new']
            p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b);manifest[n]=v['new']
        (src/'source_manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
        fs=files()
        assert len(fs)==601 and set(fs)==set(manifest)|{'source_manifest.json'}
        assert all(sha(fs[n].read_bytes())==h for n,h in manifest.items())
        assert tree(fs)=='04be5fed1f3206122a8d70502d1e6628e8eac96d15f3d093c5cb400a2b109ff5'
        for n in ['R733QuickTextSampler.swift','R750RawPixelSampler.swift','R834QuickLatencyPolicy.swift']:
            assert (src/'app/ios/ChampionsOnDevice'/n).read_bytes()==(src/'R720_PORTABLE_TESTS/Sources/R719Core'/n).read_bytes()
        (proof/'SOURCE_TREE_SHA256.txt').write_text(tree(fs)+'\n')
        print('R834_601_MEMBERS_VERIFIED',tree(fs))
        PY
    - name: Full 622 Swift regression and original PNG QUICK timing
      if: matrix.lane == 'real-apple-vision'
      shell: bash
      run: |
        set -euo pipefail
        export R834_PROOF_DIR="$PWD/R834Proof"
        swift test --package-path pinned-r793/source/R720_PORTABLE_TESTS > R834Proof/Swift.log 2>&1 || { tail -n 150 R834Proof/Swift.log; exit 1; }
        grep -F 'Executed 622 tests, with 0 failures' R834Proof/Swift.log
        grep -F 'R834_QUICK_ORIGINAL_PNG_MEASUREMENTS' R834Proof/Swift.log
    - name: iPhoneOS SDK compile NO IPA
      if: matrix.lane == 'iphoneos-compile'
      shell: bash
      run: |
        set -euo pipefail
        python3 pinned-r793/source/tools/generate_xcode_project.py
        xcodebuild -project pinned-r793/source/app/ios/ChampionsOnDeviceResearch.xcodeproj -scheme ChampionsOnDeviceResearch -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO -derivedDataPath "$RUNNER_TEMP/r834_device" build > R834Proof/iPhoneOS.log 2>&1 || { grep -E 'error:|BUILD FAILED' R834Proof/iPhoneOS.log; exit 1; }
        grep -F 'BUILD SUCCEEDED' R834Proof/iPhoneOS.log
    - name: Record scope without paid artifact storage
      if: always()
      shell: bash
      run: |
        if [ -f R834Proof/quick_original_pngs.json ]; then cat R834Proof/quick_original_pngs.json; fi
        if [ -f R834Proof/SOURCE_TREE_SHA256.txt ]; then cat R834Proof/SOURCE_TREE_SHA256.txt; fi
        echo 'R834 NO IPA. macOS original PNG replay is not iPhone capture-to-render certification.' >> "$GITHUB_STEP_SUMMARY"
