name: R638.1 Repair Source Index Native CI
'on':
  push:
    branches: [main]
    paths: [.github/workflows/ci.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: >-
      github.repository ==
      'zeek10191019-stack/true-plan-showdown-verification'
      && github.ref == 'refs/heads/main'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 55
    env:
      PYTHONOPTIMIZE: '0'
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
