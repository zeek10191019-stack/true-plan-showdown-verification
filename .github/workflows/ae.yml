name: R590 Three-Color HUD Pixel and OCR Exact Frame (No IPA)
"on":
  push:
    paths: [.github/workflows/ae.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
      PYTHONOPTIMIZE: "0"
    steps:
      - name: Restore exact R589 and apply R590 SHA-pinned three-file delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'R590_REPLAY'
          import ast,base64,hashlib,json,lzma,re,textwrap,urllib.request
          from pathlib import Path
          H=lambda b:hashlib.sha256(b).hexdigest()
          u="https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/2f10d8ba9f66df22326e1b8e8b8f6bd72d957b5f/.github/workflows/ad.yml"
          raw=urllib.request.urlopen(u,timeout=90).read()
          assert len(raw)==12048 and H(raw)=="e81d5372dbce66c1fd76f8314ca38618825b17ab7e0a19b120729fbdd94662c1","R590_PARENT_R589_YAML_CHANGED"
          m=re.search(r"python3 - <<'R589_REPLAY'\n(.*?)\n\s+R589_REPLAY",raw.decode(),re.S)
          assert m,"R590_PARENT_REPLAY_MISSING"
          source=textwrap.dedent(m.group(1));ast.parse(source)
          exec(compile(source,'PINNED_R589_FROM_AD','exec'))
          rows=json.loads(lzma.decompress(base64.b64decode("")))
          assert len(rows)==3
          updates=[]
          for row in rows:
           p=Path(row['path']);old=p.read_bytes() if p.exists() else b''
           assert (H(old) if old else None)==row['old_sha256'],('R590_WRONG_PARENT',row['path'])
           data=old
           for h in reversed(row['spans']):
            i=h['offset'];n=h['remove'];assert 0<=i<=i+n<=len(data)
            data=data[:i]+base64.b64decode(h['insert'])+data[i+n:]
           assert len(data)==row['new_bytes'] and H(data)==row['new_sha256'],('R590_PATCH_MISMATCH',row['path'])
           updates.append((p,data))
          for p,data in updates:
           p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          assert len(list(Path('app/ios/ChampionsOnDevice').glob('*.swift')))==132
          assert 'historical_hud_color_crosscheck.json' in Path('app/ios/ChampionsOnDevice/CaptureCoordinator.swift').read_text()
          assert 'maximumMembers = 32' in Path('app/ios/ChampionsOnDevice/R548ResearchArchive.swift').read_text()
          print('R590_SOURCE_REPLAY_AND_SHA_3_OF_3_PASS')
          R590_REPLAY
      - name: Swift parse, synthetic three-color OCR correlation and app iPhoneOS build
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse app/ios/ChampionsOnDevice/*.swift
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R590ColorHUDCorroboration.swift tests/R590ColorHUDCorroborationHarness.swift -o "$RUNNER_TEMP/r590-test"
          "$RUNNER_TEMP/r590-test"
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R589PixelHUDProbe.swift tests/R589PixelHUDProbeHarness.swift -o "$RUNNER_TEMP/r589-test"
          "$RUNNER_TEMP/r589-test"
          python3 tools/run_r571_native.py || { for f in reports/xcode_iphoneos_build.log reports/r574_png_replay_compile.log; do [ ! -f "$f" ] || grep -nE 'error:|fatal error|BUILD FAILED' "$f" | tail -n 65 || true; done; exit 1; }
          echo 'R590_APPLE_BUILD_PASS_ONLY; owner/HP/Mega/real-game accuracy NOT certified; NO IPA'
