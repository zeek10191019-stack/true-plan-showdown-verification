jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 8ee148b018faadef59b3cf6040ff21de28ec8c09
    - run: |
        python3 - <<'PYCODE'
        import os,base64,lzma,hashlib,pathlib
        b=lzma.decompress(base64.b85decode(
          ''.join(os.environ['P'].split())),
          format=lzma.FORMAT_ALONE)
        assert hashlib.sha256(b).hexdigest() == (
          'c2d781117e7b2195d60775215011c15f' +
          'a864de9100d5e3a400f21353dbcfdb48')
        names=[
          'app/ios/ChampionsOnDevice/' +
          'R679TypeColorProbe.swift',
          'tests/R679Smoke.swift',
          'tools/r679_patch.py','/tmp/R679CI.sh']
        sizes=[7387, 3759, 1522, 1181]
        pos=0
        for n,z in zip(names,sizes):
          p=pathlib.Path(n)
          assert not p.exists(),n
          p.write_bytes(b[pos:pos+z]);pos+=z
        assert pos==len(b)
        PYCODE
        bash /tmp/R679CI.sh
