name: R563 Separate iPhoneOS27 Build and macOS26 OCR (No IPA)
"on":
  push:
    branches: [main]
    paths: [.github/workflows/v563.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
