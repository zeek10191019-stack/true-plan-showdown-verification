      - name: "Restore pinned R561 reference and verify every R563 input"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'RESTORE_MACOS26'
          import base64,hashlib,json,lzma,sys
          from pathlib import Path
          folder=Path('.r563_overlay');parts=[f'part_{i:04d}' for i in range(4)]
          assert sorted(p.name for p in folder.iterdir())==parts,'R563_PART_SET'
          compressed=base64.b64decode(b''.join((folder/n).read_bytes() for n in parts),validate=True)
          decoder=lzma.LZMADecompressor();data=decoder.decompress(compressed,max_length=1000001)
          assert len(data)==132500 and decoder.eof and not decoder.unused_data,'R563_PAYLOAD_BOUND'
          assert hashlib.sha256(data).hexdigest()=='3cbb4178f9ee0c4885afb098a19b8e6a1f8d25689ba728232e347fda52464041','R563_PAYLOAD_SHA'
          bundle=json.loads(data)
          assert set(bundle)=={'source','bootstrap'} and set(bundle['bootstrap'])==set(['runtime_reference_source.py', 'source_guard_payload.py', 'r561_reference_source.py', 'r563_source_overlay.py']),'R563_BOOTSTRAP_SET'
          bootstrap=folder/'bootstrap';bootstrap.mkdir(exist_ok=False)
          for name,text in bundle['bootstrap'].items():
              assert isinstance(text,str) and len(text)<30000,'R563_BOOTSTRAP_BOUND'
              with (bootstrap/name).open('x') as stream:stream.write(text)
          sys.path.insert(0,str(bootstrap))
          from r563_source_overlay import restore_current
          restore_current(Path.cwd(),bundle['source'])
          print('R563_COMPLETE_INPUT_CLOSURE_VERIFIED; NATIVE_EXECUTION_NOT_YET_PERFORMED')
          RESTORE_MACOS26
      - name: "Run only the declared build or native OCR role"
        shell: bash
        run: |
          set -euo pipefail
          case "$SCREEN_READ_CI_ROLE" in
            IOS27_NATIVE) python3 tools/run_macos_checks.py --source-guard-only ;;
            PORTABLE_OCR) python3 tools/run_macos_checks.py ;;
            *) echo 'UNKNOWN_CI_ROLE'; exit 2 ;;
          esac
      - name: "Return verification evidence after success or failure; no artifacts/cache"
        if: always()
        shell: bash
        run: |
          python3 - <<'RETURN_MACOS26'
          from pathlib import Path
          import base64,hashlib,io,zipfile
          buffer=io.BytesIO()
          with zipfile.ZipFile(buffer,'w',compression=zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(Path('reports').glob('*')):
                  if path.suffix in ('.json','.log') and path.stat().st_size<2000000:archive.write(path,path.name)
          data=buffer.getvalue();encoded=base64.b85encode(data).decode()
          print('R563_REPORT_B85_BEGIN',hashlib.sha256(data).hexdigest(),len(data))
          for i in range(0,len(encoded),500):print('R563_REPORT_B85',encoded[i:i+500])
          print('R563_REPORT_B85_END')
          print('SEPARATE_SDK27_BUILD_AND_MACOS26_NATIVE_OCR_SUBCHECKS_ONLY; IOS_RUNTIME_GAME_DEVICE_UNCERTIFIED; NO_IPA')
          RETURN_MACOS26
