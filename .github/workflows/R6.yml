name: R485
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r485-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false && github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - name: Restore pinned R484, validate mirrored observation evidence, build iOS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request,hashlib,textwrap,subprocess,os,base64,zlib,json
          url='https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/bf67af712a3ab54d786b8bd6fbdf44a0bb8886a8/.github/workflows/R5.yml'
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'R485-Pinned'}),timeout=60) as f:
              b=f.read(9000)
          assert len(b)==6687
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()=='092e50b56a6dec68aee41c9a0c5bcfb9b2d75eeb'
          y=b.decode('utf-8')
          start=y.index('        run: |\n')+len('        run: |\n')
          end=y.index('      - name: Upload R484 IPA',start)
          script=textwrap.dedent(y[start:end])
          assert script.startswith('set -euo pipefail\n') and script.rstrip().endswith('bash "$RUNNER_TEMP/r484_build.sh"')
          base='\n'.join(script.splitlines()[:-1])+'\n'
          subprocess.run(['bash','-e','-o','pipefail'],input=base,text=True,check=True)
          source=Path('ios/ChampionsOnDevice/ResearchUnifiedTelemetryBundle.swift')
          s=source.read_text()
          assert hashlib.sha256(s.encode()).hexdigest()=='0035d617f59dc570b086a91408e8cbe6c2978ea36da741a3f3531582dc266615','FAIL_CLOSED: R484 source mismatch'
          needle,replacement=json.loads(zlib.decompress(base64.b64decode('')))
          assert s.count(needle)==1,'FAIL_CLOSED: patch anchor absent/duplicate'
          s=s.replace(needle,replacement,1)
          assert hashlib.sha256(s.encode()).hexdigest()=='adf5eed9442b593f7c03ebcb3190ec28721e4e0e03ff30f044f95eb7dd780577','FAIL_CLOSED: R485 patched source mismatch'
          source.write_text(s)
          test=zlib.decompress(base64.b64decode(''))
          assert hashlib.sha256(test).hexdigest()=='f2c956bac981815694a57f78d3083ee8db27a351e6e67799bc473437d14d3ac3','FAIL_CLOSED: new test bytes mismatch'
          p=Path(os.environ['RUNNER_TEMP'])/'r485/main.swift';p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(test)
          exe=p.parent/'r485_tests'
          subprocess.run(['swiftc','-O',str(source),str(p),'-o',str(exe)],check=True)
          subprocess.run([str(exe)],check=True)
          for sw in sorted(Path('ios/ChampionsOnDevice').glob('*.swift')):
              subprocess.run(['swiftc','-frontend','-parse',str(sw)],check=True)
          assert len(list(Path('ios/ChampionsOnDevice').glob('*.swift')))==43
          print('R485_SWIFT_PARSE_PASS=43',flush=True)
          build=Path(os.environ['RUNNER_TEMP'])/'r484_build.sh'
          s=build.read_text()
          for a,b in [('r27484','r27485'),('R484','R485'),("'484'","'485'"),("'0.4.84'","'0.4.85'")]:
              assert a in s,'FAIL_CLOSED: build version replacement missing'
              s=s.replace(a,b)
          assert 'dist/R485.ipa' in s and "info['CFBundleVersion']='485'" in s
          build=Path(os.environ['RUNNER_TEMP'])/'r485_build.sh';build.write_text(s)
          subprocess.run(['bash','-n',str(build)],check=True)
          print('R485_MIRROR_PATCH_AND_BUILD_SCRIPT=PASS',flush=True)
          PY
          bash "$RUNNER_TEMP/r485_build.sh"
      - name: Upload R485 IPA
        uses: actions/upload-artifact@v4
        with:
          name: R485_UNSIGNED_IPA
          path: dist/R485.ipa
          if-no-files-found: error
          retention-days: 3
