jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            311a9bbc3988bd06b350382ed515ee7cf6ea18a5
      - name: Verify R683 field bridge
        run: |
          python3 - <<'PY'
          import os,base64,lzma,hashlib,pathlib
          b=lzma.decompress(base64.b64decode(
              os.environ['R683_PKG']),
              format=lzma.FORMAT_ALONE)
          got=hashlib.sha256(b).hexdigest()
          want=('5b6fd2786aa5e437de2619b17817046a'
                '16100035286e1ab12a03b5e1576005d7')
          assert got==want
          parts=[
            (
              'app/ios/ChampionsOnDevice/'
              'R683FieldEvidenceBridge.swift'
            ),
            'tests/R683Smoke.swift',
            'tests/R683ManifestSmoke.swift',
            'tools/R683Patch.py',
          ]
          sizes=[15342, 10936, 357, 1449]
          pos=0
          for name,sz in zip(parts,sizes):
              p=pathlib.Path(name)
              assert not p.exists(),name
              p.parent.mkdir(
                  parents=True,exist_ok=True)
              p.write_bytes(b[pos:pos+sz])
              pos+=sz
          assert pos==len(b)
          PY
          python3 tools/R683Patch.py
          S=app/ios/ChampionsOnDevice
          swiftc -frontend -parse \
            "$S/CaptureCoordinator.swift"
          swiftc "$S/R683FieldEvidenceBridge.swift" \
            tests/R683Smoke.swift -o /tmp/r683
          /tmp/r683
          swiftc "$S/R581ReadabilityCoverage.swift" \
            "$S/R683FieldEvidenceBridge.swift" \
            tests/R683ManifestSmoke.swift \
            -o /tmp/r683manifest
          /tmp/r683manifest
          swiftc "$S/R581ReadabilityCoverage.swift" \
            "$S/R664ReadoutScorecard.swift" \
            tests/R664ReadoutScorecardHarness.swift \
            -o /tmp/r664
          /tmp/r664
          swiftc "$S/R680MegaReferenceSeeds.swift" \
            tests/R680Smoke.swift -o /tmp/r680
          /tmp/r680
