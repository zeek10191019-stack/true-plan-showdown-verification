jobs:
  audit:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            1e63efa4db514cc122f2940a39623d9bc65c554c
      - name: Rebuild R705 and audit journal
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os,base64,lzma,hashlib
          raw=lzma.decompress(base64.b64decode(
            os.environ['R707_PKG']),
            format=lzma.FORMAT_ALONE)
          assert hashlib.sha256(raw).hexdigest()==(
            'b6d5a66d9ebf697d308997a30dd83d75'
            '834b264af1ac35923c5c61bb89c5697a'
          )
          exec(compile(raw,'R707_Audit','exec'),{})
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R707-journal-source-audit
          path: dist/R707_journal_audit/
          if-no-files-found: warn
          retention-days: 7
