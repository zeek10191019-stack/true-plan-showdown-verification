name: R596 Form Catalog Admission Gate (No IPA)
"on":
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
      PYTHONOPTIMIZE: "0"
    steps:
      - name: Restore SHA-pinned R595 exact environment (no reinitialization)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'R596_REPLAY'
          import ast, hashlib, re, textwrap, urllib.request
          from pathlib import Path
          url='https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/9574aa54b8b84fdb6ee2955064c835a9cf86bc7b/.github/workflows/ak.yml'
          raw=urllib.request.urlopen(url, timeout=90).read()
          blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert len(raw)==14641 and blob=='6969344be2a1005f4f6ab740630347b2c7ef4a6b','R596_R595_PARENT_PIN_MISMATCH'
          m=re.search(r"python3 - <<'R595_REPLAY'\n(.*?)\n\s+R595_REPLAY",raw.decode('utf-8'),re.S)
          assert m,'R595_REPLAY_BLOCK_MISSING'
          source=textwrap.dedent(m.group(1))
          ast.parse(source)
          exec(compile(source,'R595_PINNED_REPLAY','exec'))
          assert len(list(Path('app/ios/ChampionsOnDevice').glob('*.swift')))==136,'R595_EXPECTED_136_SWIFT_MISMATCH'
          print('R596_R595_PARENT_RESTORED_AND_PIN_VERIFIED')
          R596_REPLAY
