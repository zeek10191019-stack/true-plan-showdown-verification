              assert (sha(prior) if prior is not None else None)==op['old_sha256'],name
              new=base64.b64decode(op['new_base64'])
              assert sha(new)==op['new_sha256'],name
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(new)
              manifest[name]=op['new_sha256']
