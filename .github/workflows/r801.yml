      - name: Apply R798 original CGImage DETAIL source correction with strict preimage SHA (NO IPA)
        id: patch798
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p R798Proof
          python3 - <<'PYR798SOURCE'
          from pathlib import Path
          import hashlib,json,re
          root=Path('source')
          manifest_path=root/'source_manifest.json'
          manifest=json.loads(manifest_path.read_text())
          sha=lambda b:hashlib.sha256(b).hexdigest()
          expected={
           'app/ios/ChampionsOnDevice/R560VisionExecutor.swift':'527621037735b113e92267259cdd5ff2cd0ad41a66752e76c3157d70fb9bb1a0',
           'app/ios/ChampionsOnDevice/R558FullFrameOCR.swift':'d6ef525877deb8f188bbc3173834ddd487a1d8ec2b9351976e6ad9da38b89350',
           'R720_PORTABLE_TESTS/Tests/R719CoreTests/R792AutomaticVisionInputTests.swift':'c5ff3020ed59052a18272c105d4c8253ef1eb2d0bf842340475d8919c9b0d5f3',
          }
          for path,original in expected.items():
           data=(root/path).read_bytes()
           assert sha(data)==original,(path,'UNEXPECTED_BASE_SOURCE_VERSION',sha(data))
           assert manifest[path]==original,(path,'MANIFEST_PRECHECK_FAILED')
          
          # Keep manual and QUICK mode unchanged. Only bounded automatic accurate detail
          # takes the same original CGImage that was already decoded and SHA-bound.
          p='app/ios/ChampionsOnDevice/R560VisionExecutor.swift'
          t=(root/p).read_text()
          pattern='work: R551EvidenceWork?=nil, deadlineMs:Int?=nil,'
          assert t.count(pattern)==1,'EXECUTOR_SIGNATURE_CHANGED'
          t=t.replace(pattern,'work: R551EvidenceWork?=nil, nativeOriginalImage: CGImage?=nil, deadlineMs:Int?=nil,',1)
          anchor='            configuration.performed=true\n'
          assert t.count(anchor)==1,'EXECUTOR_HANDLER_ANCHOR_CHANGED'
          inputbinding='''            // R798: pixel-verified original image for bounded automatic DETAIL.
                      // QUICK and manual modes continue to use the pre-existing CVPixelBuffer.
                      // Never change or reschedule the physical OCR worker on this path.
                      let r798Handler: VNImageRequestHandler
                      if let original=nativeOriginalImage {
                          guard original.width==CVPixelBufferGetWidth(input.buffer),
                                original.height==CVPixelBufferGetHeight(input.buffer)
                          else {throw NSError(domain:"R798_VISION_GEOMETRY_MISMATCH",code:1)}
                          r798Handler=VNImageRequestHandler(cgImage:original,
                              orientation:.up,options:options)
                      } else {
                          r798Handler=VNImageRequestHandler(cvPixelBuffer:input.buffer,
                              orientation:.up,options:options)
                      }
          '''
          t=t.replace(anchor,anchor+inputbinding,1)
          handler=r'try VNImageRequestHandler\(cvPixelBuffer:input\.buffer,\s*orientation:\.up,options:options\)\.perform\(\[request\]\)'
          t,n=re.subn(handler,'try r798Handler.perform([request])',t)
          assert n==2,('EXECUTOR_OCR_CALL_COUNT_CHANGED',n)
          (root/p).write_text(t)
          
          p='app/ios/ChampionsOnDevice/R558FullFrameOCR.swift'
          t=(root/p).read_text()
          anchor='let execution=try R560VisionExecutor.recognize(input,template:request,work:work,\n'
          assert t.count(anchor)==1,'R558_EXACT_CALL_ANCHOR_CHANGED'
          new='''let execution=try R560VisionExecutor.recognize(input,template:request,work:work,
                      nativeOriginalImage: (!speedPriority && deadlineMs != nil) ? visionRaster : nil,
          '''
          t=t.replace(anchor,new,1)
          (root/p).write_text(t)
          
          p='R720_PORTABLE_TESTS/Tests/R719CoreTests/R792AutomaticVisionInputTests.swift'
          t=(root/p).read_text()
          needle='try VNImageRequestHandler(cvPixelBuffer:prepared.buffer,orientation:.up,options:[:]).perform([request])'
          assert t.count(needle)==1,'R792_TEST_INPUT_ANCHOR_CHANGED'
          replacement='''// Match the R798 bounded automatic DETAIL CGImage input, without altering
                      // the existing six-name, four-PP, three-move and HP assertions.
                      let handler=useOriginal ? VNImageRequestHandler(cgImage:detailRaster,
                          orientation:.up,options:[:]) : VNImageRequestHandler(cvPixelBuffer:prepared.buffer,
                          orientation:.up,options:[:])
                      try handler.perform([request])'''
          t=t.replace(needle,replacement,1)
          (root/p).write_text(t)
          
          # Recompute source_manifest.json (self-excluding); exact path inventory retained.
          for p in expected:
           manifest[p]=sha((root/p).read_bytes())
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          files={str(f.relative_to(root)):f for f in root.rglob('*') if f.is_file()
                 and '__pycache__' not in f.parts and '.build' not in f.parts}
          assert set(files)==set(manifest)|{'source_manifest.json'},'SOURCE_SET_CHANGED'
          assert len(files)==571,('SOURCE_COUNT_CHANGED',len(files))
          for p,h in manifest.items():
           assert sha(files[p].read_bytes())==h,('SOURCE_FILE_HASH_MISMATCH',p)
          tree=sha(''.join(p+'\t'+sha(files[p].read_bytes())+'\n' for p in sorted(files)).encode())
          out=Path('R798Proof');out.mkdir(exist_ok=True)
          (out/'SOURCE_TREE_SHA256.txt').write_text(tree+'\n')
          (out/'SOURCE_INTEGRITY.json').write_text(json.dumps({
           'revision':'R798','base_revision':'R796','source_file_count':len(files),
           'source_tree_sha256':tree,'changed_source_files':sorted(expected),
           'preimage_verified_sha256':expected,
           'postimage_sha256':{p:sha((root/p).read_bytes()) for p in expected},
           'native_CGImage_bounded_accurate_detail_only':True,
           'quick_and_manual_CVPixelBuffer_preserved':True,
           'timeout_6000ms_unchanged':True,
           'physical_worker_count_limit_unchanged':True,
           'ipa_created':False,'device_fields_certified':0},indent=2))
          print('R798 source verified: count=',len(files),'tree=',tree)
          PYR798SOURCE
          test -s R798Proof/SOURCE_TREE_SHA256.txt
          test -s R798Proof/SOURCE_INTEGRITY.json

