      - name: R797 repeat independent HP Vision observations on original PNG (no auto-correction)
        if: always() && matrix.lane == 'real-apple-vision'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p R797Proof
          cat > R797Proof/HP_probe.swift <<'SWIFT_R797'
          import Foundation
          import Vision
          import ImageIO
          import CoreGraphics
          import CryptoKit
          
          struct ProbeFailure: Error { let reason: String }
          let pngPath = "source/tests/fixtures/r761_real_move_panel.png"
          let png = try Data(contentsOf: URL(fileURLWithPath: pngPath))
          let originalHash = SHA256.hash(data: png).map { String(format: "%02x", $0) }.joined()
          guard originalHash == "b394a69fd74f46537915e1803f17fa11348b22041c297bfec8e54f89c5a7df62" else {
              throw ProbeFailure(reason: "UNEXPECTED_SOURCE_IMAGE_SHA")
          }
          guard let src = CGImageSourceCreateWithData(png as CFData, nil),
                let original = CGImageSourceCreateImageAtIndex(src, 0, nil) else {
              throw ProbeFailure(reason: "SOURCE_PNG_DECODE_FAILED")
          }
          guard original.width == 2796 && original.height == 1290 else {
              throw ProbeFailure(reason: "UNEXPECTED_SOURCE_IMAGE_DIMENSIONS")
          }
          // This is a diagnostic crop around the HP HUD, not a certified game ROI.
          // All results remain untrusted OCR text from the same saved test PNG.
          let hpRect = CGRect(x: 410, y: 1120, width: 395, height: 158)
          guard let hpCrop = original.cropping(to: hpRect) else {
              throw ProbeFailure(reason: "HP_ROI_CROP_FAILED")
          }
          func recognize(_ image: CGImage, label: String, trial: Int) throws -> [String:Any] {
              let request = VNRecognizeTextRequest()
              request.recognitionLevel = .accurate
              request.recognitionLanguages = ["ja-JP", "en-US"]
              request.usesLanguageCorrection = false
              let start = ProcessInfo.processInfo.systemUptime
              try VNImageRequestHandler(cgImage: image, orientation: .up, options: [:]).perform([request])
              let ms = (ProcessInfo.processInfo.systemUptime - start) * 1000
              let observed: [[String: Any]] = (request.results ?? []).map { row in
                  let candidates = row.topCandidates(3).map { item -> [String:Any] in
                      ["text":item.string, "confidence":Double(item.confidence)]
                  }
                  return ["text_candidates":candidates,
                          "bbox_normalized":[Double(row.boundingBox.minX),Double(row.boundingBox.minY),
                                             Double(row.boundingBox.width),Double(row.boundingBox.height)]]
              }
              let hpLike = observed.filter { item in
                  guard let first=(item["text_candidates"] as? [[String:Any]])?.first,
                        let text=first["text"] as? String else { return false }
                  return text.contains("/") || text.contains("187") || text.contains("87")
              }
              return ["label":label, "trial":trial, "raster_width":image.width,
                      "raster_height":image.height, "elapsed_ms":ms,
                      "candidate_rows":observed.count,
                      "hp_like_rows":hpLike,
                      "source_png_sha256":originalHash,
                      "untrusted_ocr_only":true]
          }
          var observations: [[String:Any]] = []
          for trial in 1...3 {
              observations.append(try recognize(original, label:"full_source_accurate", trial:trial))
              observations.append(try recognize(hpCrop, label:"hp_crop_accurate", trial:trial))
          }
          let report: [String:Any] = [
              "revision":"R797", "scope":"MAC_NATIVE_VISION_DIAGNOSTIC_NOT_DEVICE",
              "source_png_sha256":originalHash, "source_size":[2796,1290],
              "hp_crop_source_rect":[410,1120,395,158],
              "source_pixel_bytes_unchanged":true,
              "language_correction":false,
              "repeat_count_per_mode":3,
              "method_description":"CGImage original vs local cropped original; does not assert production-parity",
              "runtime_game_hp_certified":false,
              "device_fields_certified":0,
              "readings":observations]
          let result=try JSONSerialization.data(withJSONObject:report,options:[.prettyPrinted,.sortedKeys])
          try result.write(to:URL(fileURLWithPath:"R797Proof/HP_STABILITY.json"))
          print("R797 six independent raw OCR observations saved, no game HP certification")
          SWIFT_R797
          set +e
          swift R797Proof/HP_probe.swift > R797Proof/HP_probe.log 2>&1
          diagnostic_status=$?
          set -e
          printf '%s\n' "$diagnostic_status" > R797Proof/HP_probe.exit
          if [ "$diagnostic_status" -ne 0 ]; then
            tail -80 R797Proof/HP_probe.log
            exit 1
          fi
          test -f R797Proof/HP_STABILITY.json
          python3 - <<'PYR797VALID'
          import json
          from pathlib import Path
          v=json.loads(Path('R797Proof/HP_STABILITY.json').read_text())
          assert v['source_png_sha256']=='b394a69fd74f46537915e1803f17fa11348b22041c297bfec8e54f89c5a7df62'
          assert len(v['readings'])==6
          assert {x['label'] for x in v['readings']}=={'full_source_accurate','hp_crop_accurate'}
          assert v['device_fields_certified']==0
          print('Original real PNG SHA and six OCR diagnostic reads: PASS')
          PYR797VALID

