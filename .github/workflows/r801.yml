          proof=Path('R801Proof');proof.mkdir(exist_ok=True)
          (proof/'SOURCE_TREE_SHA256.txt').write_text(tree+'\n')
          (proof/'SOURCE_INTEGRITY.json').write_text(json.dumps({
            'revision':'R801','source_files':572,'source_tree_sha256':tree,
            'base_tree_sha256':'0f37db5e291ea795cb40f9c1fcfda246bab7d1c5132a39197302a06f2c969142',
            'changed_paths':[o['path'] for o in payload['operations']],
            'device_certified_fields':0,'ipa_created':False,
            'owner_turn_gameplay_certified':False
          },indent=2))
          print('R801_SHA256_BOUND_SOURCE_PASS',tree)
          PYR801SOURCE

