          assert all(sha(files[n].read_bytes())==v for n,v in manifest.items())
          tree=sha(''.join(n+'\t'+sha(files[n].read_bytes())+'\n'
                      for n in sorted(files)).encode())
          assert tree=='ff6ccad4f581499eb2726b4e2f7ea76e1c9e0b356809a553bdcab301502ffa05',('R801_OUTPUT_TREE_DRIFT',tree)
