jobs:
  build:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            1e63efa4db514cc122f2940a39623d9bc65c554c
      - name: Verify R702 and build IPA
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os,re,base64,lzma,hashlib
          import pathlib,urllib.request,ast
          url=('https://raw.githubusercontent.com/'
            'zeek10191019-stack/'
            'true-plan-showdown-verification/'
            'main/.github/workflows/z5.yml')
          req=urllib.request.Request(url,headers={
            'User-Agent':'R702-Pinned-Builder'})
          with urllib.request.urlopen(
            req,timeout=40) as res:
            old=res.read(25000)
          assert len(old)==10427
          assert hashlib.sha256(old).hexdigest()==(
            'ae3b4ae41f07122c8a0cf71ef62ec7a0'
            '318fc715bf255d6d91877655279e4457')
          m=re.search(rb'(?m)^  R701_PKG: >-\n'
            rb'((?:    [^\n]*\n)+)',old)
          assert m,'R701_PINNED_PACKAGE_MISSING'
          os.environ['R701_PKG']=b''.join(
            m[1].split()).decode('ascii')
          raw=lzma.decompress(base64.b64decode(
            os.environ['R702_PKG']),
            format=lzma.FORMAT_ALONE)
          assert hashlib.sha256(raw).hexdigest()==(
            '286fe8a0c6aaecf1545271b898853579'
            'dbed6d10b49bdc25499ebbc31405f84e')
          names=['R702EffectFieldBinding.swift',
            'R702Patch.py','R702MakeBuild.py',
            'R702Smoke.swift']
          sizes=[9082, 1310, 2283, 9039]
          assert sum(sizes)==len(raw)
          pos=0
          for name,size in zip(names,sizes):
            folder='tests' if name.endswith(
              'Smoke.swift') else 'tools'
            p=pathlib.Path(folder)/name
            p.parent.mkdir(parents=True,
              exist_ok=True)
            p.write_bytes(raw[pos:pos+size])
            pos+=size
          print('R702_SOURCE_SHA_PASS',flush=True)
          text=old.decode('utf-8')
          marker="          python3 - <<'PYCODE'\n"
          start=text.index(marker)+len(marker)
          end=text.index('\n          PYCODE',start)
          block=text[start:end]
          body='\n'.join(line[10:] for line in
            block.splitlines())
          needle=("['python3','tools/"+
            "R701MakeBuild.py']")
          assert body.count(needle)==1
          body=body.replace(needle,
            "['python3','tools/R702MakeBuild.py']")
          ast.parse(body)
          exec(compile(body,'r701','exec'),{})
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: R702-unsigned-iLoader-IPA
          path: dist/R702*
          if-no-files-found: error
          retention-days: 7
