name: R27.18 public synthetic 30-turn full replay evidence
'on':
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r2718-public-full-evidence-manual
  cancel-in-progress: false
jobs:
  public_research_only:
    name: Pinned M-C legal six complete research evidence
    if: ${{ github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Fetch and build exact pinned Showdown source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/showdown"
          cd "$RUNNER_TEMP/showdown"
          git init -q
          git remote add origin https://github.com/smogon/pokemon-showdown.git
          git fetch --depth 1 origin aa17ca0fac8bc5605df673bd8774c2d0e91efa43
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = aa17ca0fac8bc5605df673bd8774c2d0e91efa43
          test "$(git rev-parse 'HEAD^{tree}')" = 98c9038b81fa5ed7f1e9818736b701918920501e
          test "$(node --version)" = v22.18.0
          npm ci --no-audit --no-fund
          npm run build
      - name: Verify full pinned public build digest
        shell: bash
        working-directory: ${{ runner.temp }}/showdown
        run: |
          set -euo pipefail
          python3 - <<'PY_DIST'
          import hashlib,pathlib
          dist=pathlib.Path('dist')
          paths=list(dist.rglob('*'))
          assert not any(p.is_symlink() for p in paths)
          files=sorted((p for p in paths if p.is_file()),key=lambda p:p.relative_to(dist).as_posix())
          assert len(files)==1094,len(files)
          h=hashlib.sha256()
          for p in files:
              name=p.relative_to(dist).as_posix().encode()
              h.update(len(name).to_bytes(8,'big'))
              h.update(name)
              h.update(hashlib.sha256(p.read_bytes()).digest())
          assert h.hexdigest()=='3697be28e9736b691f005bc5ad7b56789523fbf4ef04d838fcc91f6cfae9c3df'
          print('DIST_FULL_DIGEST_1094_PASS',h.hexdigest())
          PY_DIST
      - name: Record every turn and validate independent deterministic replay
        shell: bash
        working-directory: ${{ runner.temp }}/showdown
        run: |
          set -euo pipefail
          cat > ./r2718-30turn-evidence.cjs <<'R2718_PROBE'
          #!/usr/bin/env node
          'use strict';
          /**
           * R27.18: PUBLIC RESEARCH ONLY.
           * Deterministic, synthetic, validator-checked six-species Champions M-C 30-turn
           * Showdown proof. Never use private battle models, DB, actual-game logs or teams.
           * The snapshot is omniscient simulator state; never present it as an AI observation.
           */
          const assert = require('node:assert/strict');
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const {Battle, extractChannelMessages} = require('./dist/sim/battle');
          const {Dex} = require('./dist/sim/dex');
          const {State} = require('./dist/sim/state');
          const {TeamValidator} = require('./dist/sim/team-validator');
          
          function stable(x) {
            if (Array.isArray(x)) return x.map(stable);
            if (x && typeof x === 'object')
              return Object.fromEntries(Object.keys(x).sort().map(k => [k, stable(x[k])]));
            return x;
          }
          function hash(x) {
            return crypto.createHash('sha256').update(JSON.stringify(stable(x))).digest('hex');
          }
          function snapshot(b) { return JSON.parse(JSON.stringify(b.toJSON())); }
          function normalizeState(raw) {
            // State.normalize is in-place; preserve original evidence bytes.
            return State.normalize(JSON.parse(JSON.stringify(raw)));
          }
          function normalized(b) { return JSON.stringify(stable(normalizeState(snapshot(b)))); }
          function normalizedTrace(run) {
            // Compare all gameplay fields; normalize ONLY Showdown's wall-clock |t:| events.
            const states=run.snapshots.map(x=>({index:x.index,turn:x.turn,state:normalizeState(x.state)}));
            const steps=run.steps.map((step,i)=>({
              index:step.index,turn_before:step.turn_before,turn_after:step.turn_after,
              choices:step.choices,witnesses:step.witnesses,
              visible:{p1:State.normalizeLog(step.visible.p1),p2:State.normalizeLog(step.visible.p2)},
              pre_sha256:hash(states[i].state),post_sha256:hash(states[i+1].state)
            }));
            return {
              format:run.format,formatId:run.formatId,species:run.species,counters:run.counters,
              snapshots:states,steps,
              omniscient:State.normalizeLog(run.omniscient),
              viewers:{p1:State.normalizeLog(run.viewers.p1),p2:State.normalizeLog(run.viewers.p2)}
            };
          }
          function firstDifference(a,b,path='trace') {
            if(Object.is(a,b))return null;
            if(a===null||b===null||typeof a!=='object'||typeof b!=='object')
              return {path,left:String(a).slice(0,250),right:String(b).slice(0,250)};
            const keys=Array.from(new Set([...Object.keys(a),...Object.keys(b)])).sort();
            for(const k of keys){
              if(!(k in a)||!(k in b))return {path:path+'.'+k,left:k in a,right:k in b};
              const mismatch=firstDifference(a[k],b[k],path+'['+JSON.stringify(k)+']');
              if(mismatch)return mismatch;
            }
            return null;
          }
          function validateVisible(events, proof, expectedTurn) {
            assert(Array.isArray(events));
            assert(events.every(e => typeof e === 'string' && !/[\r\n]/.test(e)));
            assert.equal(events.filter(e => e === '|turn|' + expectedTurn).length, 1,
              'missing or duplicate player-visible turn event');
            const prefix = proof.kind === 'switch'
              ? '|switch|' + proof.actor + 'a: ' + proof.name + '|'
              : '|move|' + proof.actor + 'a: ' + proof.name + '|' + proof.move + '|';
            assert.equal(events.filter(e => e.startsWith(prefix)).length, 1,
              'missing visible move or switch');
          }
          
          function runOnce() {
            assert.equal(typeof extractChannelMessages, 'function');
            const format = Dex.formats.get('gen9championsbssregmc');
            assert(format.exists && format.mod === 'champions');
            const validator = TeamValidator.get(format);
            assert(validator.ruleTable.has('speciesclause'));
            const modDex = Dex.forFormat(format);
            const species = ['Venusaur', 'Charizard', 'Blastoise', 'Gyarados', 'Snorlax', 'Azumarill'];
            const team = () => species.map((s, i) => {
              const record = modDex.species.get(s);
              assert(record.exists && record.abilities['0']);
              return {
                species: s, name: 'Horiz' + (i+1), level: 50,
                ability: record.abilities['0'], item: '', nature: 'Hardy',
                moves: ['protect', 'endure', 'rest'],
                evs: {hp: 0, atk: 0, def: 0, spa: 0, spd: 0, spe: 0}
              };
            });
            const duplicate = team();
            duplicate[1] = {...duplicate[0], name: 'Horiz2'};
            const negative = validator.validateTeam(duplicate);
            assert(Array.isArray(negative) && negative.some(e => /Species Clause/i.test(e)),
              'Species Clause negative control failed');
            for (const [i,t] of [team(),team()].entries())
              assert.equal(validator.validateTeam(t), null, 'invalid synthetic player team '+i);
            const b = new Battle({
              formatid: format.id, seed: '1,2,3,4', strictChoices: true,
              p1: {name:'Synthetic-P1',team:team()},
              p2: {name:'Synthetic-P2',team:team()}
            });
            assert.equal(b.requestState,'teampreview');
            b.makeChoices('team 123','team 123');
            assert.equal(b.requestState,'move');
            const initial = snapshot(b);
            const steps = [];
            const snapshots = [{index:0, turn:b.turn, state:initial}];
            const counters = {
              p1:{protect:0,endure:0,rest:0,switch:0},
              p2:{protect:0,endure:0,rest:0,switch:0}
            };
            const chain = [];
            for(let i=0;i<30;i++) {
              assert.equal(b.ended,false,'battle ended before 30 turns');
              assert.equal(b.requestState,'move');
              const turnBefore = b.turn;
              const beforeChannels = extractChannelMessages(b.log.join('\n'),[1,2]);
              assert(Array.isArray(beforeChannels[1]) && Array.isArray(beforeChannels[2]));
              const lengths = {p1:beforeChannels[1].length,p2:beforeChannels[2].length};
              const choices = {};
              const witnesses = {};
              for(const player of ['p1','p2']) {
                const side = b.getSide(player);
                assert.equal(side.requestState,'move');
                const req = side.activeRequest?.active?.[0];
                assert(Array.isArray(req?.moves));
                const switching = (player==='p1' && i===3) || (player==='p2' && i===9);
                const start = i%3;
                const moveSlot = switching ? null : [start,(start+1)%3,(start+2)%3]
                  .find(x => req.moves[x]?.pp > 0);
                assert(switching || Number.isInteger(moveSlot),'move PP exhausted');
                const active = side.active[0];
                assert(active && /^[A-Za-z0-9-]{1,18}$/.test(active.name));
                if(switching) {
                  const next = side.pokemon[1];
                  assert(next && !next.fainted && next.name !== active.name);
                  choices[player]='switch 2';
                  witnesses[player]={actor:player,kind:'switch',name:next.name,move:null};
                } else {
                  assert.equal(req.moves[moveSlot].id,['protect','endure','rest'][moveSlot]);
                  choices[player]='move '+(moveSlot+1);
                  witnesses[player]={actor:player,kind:'move',name:active.name,
                    move:['Protect','Endure','Rest'][moveSlot],slot:moveSlot,pp:req.moves[moveSlot].pp};
                }
              }
              const pre = snapshot(b);
              const parentBefore = normalized(b);
              const clone = Battle.fromJSON(JSON.stringify(pre));
              assert.equal(normalized(clone),parentBefore,'pre-action clone mismatch');
              clone.makeChoices(choices.p1,choices.p2);
              assert.equal(normalized(b),parentBefore,'clone mutated parent');
              b.makeChoices(choices.p1,choices.p2);
              assert.equal(normalized(clone),normalized(b),'clone replay mismatch at '+i);
              assert.equal(b.turn,turnBefore+1);
              const post = snapshot(b);
              const afterChannels = extractChannelMessages(b.log.join('\n'),[1,2]);
              const visible = {p1:afterChannels[1].slice(lengths.p1),
                p2:afterChannels[2].slice(lengths.p2)};
              for(const player of ['p1','p2']) {
                const w = witnesses[player];
                const side = b.getSide(player);
                assert.equal(side.active[0].name,w.name);
                if(w.kind==='move') {
                  assert.equal(side.activeRequest.active[0].moves[w.slot].pp,w.pp-1,
                    'PP consumption mismatch');
                  counters[player][w.move.toLowerCase()]++;
                } else counters[player].switch++;
                validateVisible(visible.p1,w,b.turn);
                validateVisible(visible.p2,w,b.turn);
              }
              const entry = {
                index:i+1,turn_before:turnBefore,turn_after:b.turn,
                choices, witnesses,visible,
                pre_sha256:hash(pre),post_sha256:hash(post)
              };
              steps.push(entry);
              snapshots.push({index:i+1,turn:b.turn,state:post});
              chain.push(hash({turn:b.turn,choices,visible,
                post_sha256:hash(normalizeState(post))}));
            }
            assert.equal(counters.p1.switch,1);
            assert.equal(counters.p2.switch,1);
            assert.equal(b.ended,false);
            const omniscient=b.log.join('\n');
            const channels=extractChannelMessages(omniscient,[1,2]);
            return {format:format.name,formatId:format.id,species,counters,snapshots,steps,
              omniscient,viewers:{p1:channels[1],p2:channels[2]},
              transition_chain_sha256:hash(chain)};
          }
          
          function main() {
            const a=runOnce();
            const b=runOnce();
            const aHash=hash(a),bHash=hash(b);
            const comparableA=normalizedTrace(a),comparableB=normalizedTrace(b);
            const aNormalizedHash=hash(comparableA),bNormalizedHash=hash(comparableB);
            if(aNormalizedHash!==bNormalizedHash){
              console.error('FIRST_GAMEPLAY_TRACE_DIFFERENCE',JSON.stringify(firstDifference(comparableA,comparableB)));
              assert.fail('NON_TIMESTAMP_DETERMINISM_FAILURE');
            }
            assert.equal(aNormalizedHash,bNormalizedHash);
            assert.equal(a.steps.length,30);
            assert.equal(a.snapshots.length,31);
            for (let i=0;i<30;i++) {
              const prev=a.snapshots[i];
              const next=a.snapshots[i+1];
              const step=a.steps[i];
              assert.equal(prev.index,i);
              assert.equal(next.index,i+1);
              assert.equal(step.index,i+1);
              assert.equal(step.pre_sha256,hash(prev.state));
              assert.equal(step.post_sha256,hash(next.state));
              const restored=Battle.fromJSON(JSON.stringify(prev.state));
              restored.makeChoices(step.choices.p1,step.choices.p2);
              assert.equal(normalized(restored),JSON.stringify(stable(normalizeState(next.state))),
                'archived snapshot replay mismatch at '+(i+1));
            }
            const dest=path.resolve(process.argv[2]||'r2718-evidence');
            fs.mkdirSync(dest,{recursive:true});
            const put=(name,value)=>fs.writeFileSync(path.join(dest,name),value,'utf8');
            const jsonl=items=>items.map(item=>JSON.stringify(item)).join('\n')+'\n';
            put('all-31-state-snapshots.jsonl',jsonl(a.snapshots));
            put('all-30-actions-and-visible-deltas.jsonl',jsonl(a.steps));
            put('complete-omniscient-protocol.log',a.omniscient+'\n');
            put('viewer-p1-events.log',a.viewers.p1.join('\n')+'\n');
            put('viewer-p2-events.log',a.viewers.p2.join('\n')+'\n');
            const receipt={
              schema:'TRUE_PLAN_R2718_COMPLETE_PUBLIC_SYNTHETIC_EVIDENCE_V1',
              status:'PASS_PUBLIC_RESEARCH_ONLY',
              commit:'aa17ca0fac8bc5605df673bd8774c2d0e91efa43',
              format:a.format,species:a.species,turns:30,snapshots:31,
              same_seed_independent_replay:'PASS',
              archived_per_turn_snapshot_replay:'PASS',
              raw_full_trace_sha256:aHash,raw_independent_trace_sha256:bHash,
              normalized_full_trace_sha256:aNormalizedHash,normalized_independent_trace_sha256:bNormalizedHash,
              normalize_only:'Showdown |t:| wall-clock protocol events; preserve all other fields',
              transition_chain_sha256:a.transition_chain_sha256,
              action_counters:a.counters,
              has_omniscient_state:true,
              player_view_channels:['p1','p2'],
              caveat:'omniscient states are NOT player observations; public synthetic simulator ONLY',
              certification:{native33:'0/33',exact34:'0/34',actual_game:'0/30',
                stage15_formal_increment:0,gate:'DENY_FORMAL_CERTIFICATION'}
            };
            put('replay-and-integrity-receipt.json',JSON.stringify(receipt,null,2)+'\n');
            console.log(JSON.stringify(receipt));
          }
          if(require.main===module)main();
          module.exports={runOnce,validateVisible,normalizedTrace,firstDifference};
          R2718_PROBE
          printf '%s  %s\n' 'f897ac004f269a46ccaa5be0d4a9d5e9202f7bb7d31aa69ba6c76fb46a279864' r2718-30turn-evidence.cjs | sha256sum -c -
          node --check ./r2718-30turn-evidence.cjs
          node ./r2718-30turn-evidence.cjs ./r2718-evidence | tee ./r2718-console-receipt.json
          cp ./r2718-30turn-evidence.cjs ./r2718-evidence/
      - name: Audit all files counts hashes and maximum artifact volume
        shell: bash
        working-directory: ${{ runner.temp }}/showdown
        run: |
          set -euo pipefail
          python3 - <<'PY_AUDIT'
          import json,pathlib,hashlib
          p=pathlib.Path('r2718-evidence')
          files={'r2718-30turn-evidence.cjs','all-31-state-snapshots.jsonl',
                 'all-30-actions-and-visible-deltas.jsonl',
                 'complete-omniscient-protocol.log','viewer-p1-events.log',
                 'viewer-p2-events.log','replay-and-integrity-receipt.json'}
          assert {x.name for x in p.iterdir()}==files
          total=sum(x.stat().st_size for x in p.iterdir())
          assert total<=16*1024*1024,('EXCEEDS_16_MIB_ARTIFACT_CAP',total)
          snap=[json.loads(s) for s in (p/'all-31-state-snapshots.jsonl').read_text().splitlines()]
          steps=[json.loads(s) for s in (p/'all-30-actions-and-visible-deltas.jsonl').read_text().splitlines()]
          receipt=json.loads((p/'replay-and-integrity-receipt.json').read_text())
          assert len(snap)==31 and [x['index'] for x in snap]==list(range(31))
          assert len(steps)==30 and [x['index'] for x in steps]==list(range(1,31))
          assert receipt['same_seed_independent_replay']=='PASS'
          assert receipt['archived_per_turn_snapshot_replay']=='PASS'
          assert receipt['certification']=={'native33':'0/33','exact34':'0/34',
                 'actual_game':'0/30','stage15_formal_increment':0,
                 'gate':'DENY_FORMAL_CERTIFICATION'}
          assert hashlib.sha256((p/'r2718-30turn-evidence.cjs').read_bytes()).hexdigest()=='f897ac004f269a46ccaa5be0d4a9d5e9202f7bb7d31aa69ba6c76fb46a279864'
          print('COMPLETE_PUBLIC_EVIDENCE_PASS',len(snap),len(steps),total)
          PY_AUDIT
          (cd ./r2718-evidence && sha256sum *.cjs *.json *.jsonl *.log > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Preserve synthetic evidence for seven days
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: r2718-public-30turn-complete-evidence
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/showdown/r2718-evidence/
