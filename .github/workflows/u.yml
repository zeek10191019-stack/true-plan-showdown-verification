jobs:
  b:
    if: >-
      github.repository ==
      'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 3e080f14d1e2d95fcbeb4479cc0565c75ae9d4c5
    - run: |
        python3 - <<'PY'
        import os,lzma,base64,hashlib,pathlib
        b=lzma.decompress(base64.b85decode(
          ''.join(os.environ['P'].split())),
          format=lzma.FORMAT_ALONE)
        assert hashlib.sha256(b).hexdigest() == (
          '26f904178187cc673a57256142d635f5' +
          '9858c30e03f064475dfdf5bf67ba6dcc')
        names=['app/ios/ChampionsOnDevice/' +
          'R670HUDPixelGlyphs.swift',
          'tests/R670GlyphSmoke.swift',
          'tools/r670_patch.py',
          '/tmp/R670CI.sh']
        sizes=[8951, 1318, 2719, 1521]
        i=0
        for n,z in zip(names,sizes):
          p=pathlib.Path(n)
          p.parent.mkdir(parents=True,exist_ok=True)
          assert not p.exists()
          p.write_bytes(b[i:i+z]);i+=z
        assert i==len(b)
        PY
        bash /tmp/R670CI.sh
