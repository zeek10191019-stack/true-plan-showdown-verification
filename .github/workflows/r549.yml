      - name: Swift Apple SDK typechecks and strict ZIP 13 tests
        shell: bash
        run: |
          set -euo pipefail
          python3 r549/make_fixtures.py
          python3 r549/local_preflight.py
          swiftc -typecheck r549/R549MegaOCR.swift
          swiftc r549/R549ZipReadback.swift r549/R549VerifyHarness.swift -o /tmp/R549ZipReadbackTests
          /tmp/R549ZipReadbackTests r549/fixtures
          echo PASS_R549_ISOLATED_COMPILE_AND_13_ZIP_TESTS
      - name: Reproduce exact R548 and collect real Swift connection points
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY549_PARENT'
          from pathlib import Path
          import hashlib, urllib.request, re, textwrap, json, shutil
          url='https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/main/.github/workflows/r548.yml'
          raw=urllib.request.urlopen(url,timeout=60).read(20000)
          blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert blob=='ce370df369f5b2e3b366235e6ab9a0d6dc85c99a','R548_PARENT_CHANGED'
          m=re.search(rb"          python3 - <<'PY548'\n([\s\S]*?)\n          PY548",raw)
          assert m,'NO_R548_VERIFIED_SCRIPT'
          original=textwrap.dedent(m.group(1).decode())
          exec(compile(original,'R549_PINNED_R548_REPLAY','exec'))
          source=Path('dist/R548.ipa')
          assert source.is_file() and source.stat().st_size>0,'R548_IPA_NOT_REBUILT'
          root=Path('r549/source_evidence');root.mkdir(parents=True,exist_ok=True)
          expected={'R548ResearchArchive.swift':'83c9a32ac0309809c0cc6b8103c786c28f716e821385d4cafc7534e30e300604',
                    'R548MegaSceneProbe.swift':'c4e1aef7305e9c7b4355a424fcb432a1127e8696800b91d0ca66c670d01bb522'}
          found={}
          for name,sha in expected.items():
              matches=[x for x in Path('.').rglob(name) if not ('source_evidence' in x.parts)]
              assert len(matches)==1,(name, [str(x) for x in matches])
              actual=hashlib.sha256(matches[0].read_bytes()).hexdigest()
              assert actual==sha,(name,'R548_SOURCE_HASH_CHANGED',actual)
              shutil.copyfile(matches[0],root/name)
              found[name]={'path':str(matches[0]),'sha256':actual,'lines':len(matches[0].read_text().splitlines())}
          report={'release':'R549_AUDIT_ONLY','baseline':'R548','R548_run':40870434305,
                  'r548_replayed':True,'r548_swift_sources_pinned':True,
                  'r549_swift_typecheck':True,'r549_isolated_zip_tests':13,
                  'r549_zip_hook_integrated':False,'r549_mega_probe_hook_integrated':False,
                  'ipa_build_R549':False,'iphone_gate':'HOLD','sources':found}
          (root/'R549_AUDIT_STATUS.json').write_text(json.dumps(report,indent=2))
          print('PASS_R549_R548_EXACT_SOURCE_EXTRACT',json.dumps(found,ensure_ascii=False))
          PY549_PARENT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R549_ISOLATED_TESTS_AND_R548_SWIFT_SOURCE_AUDIT
          path: |
            r549/*.swift
            r549/*.py
            r549/source_evidence/*
          retention-days: 3
