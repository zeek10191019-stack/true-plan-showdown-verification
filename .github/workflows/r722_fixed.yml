    - name: Restore exact R718 frozen 271-file source with manifest SHA
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python3 - <<'PYCODE'
        import pathlib,re,base64,lzma,json,hashlib,zipfile,os,urllib.request
        # Do NOT checkout the repository: a pre-existing illegal/overlong path
        # causes actions/checkout@v4 to fail on the macOS runner (R720 run).
        # Fetch the immutable, content-addressed Git blob for the exact
        # R718 workflow. This must never silently fall back to another ref.
        repo='zeek10191019-stack/true-plan-showdown-verification'
        git_sha='31afd50a6c6d417496816297f23b66e3ccfb5c30'
        url='https://api.github.com/repos/'+repo+'/git/blobs/'+git_sha
        req=urllib.request.Request(url,headers={
            'Authorization':'Bearer '+os.environ['GH_TOKEN'],
            'Accept':'application/vnd.github+json',
            'User-Agent':'TruePlan-R721-Immutable-Blob-Recovery'})
        with urllib.request.urlopen(req,timeout=45) as response:
            body=json.load(response)
        assert body.get('sha')==git_sha and body.get('encoding')=='base64','R718_GIT_BLOB_PROVENANCE_HOLD'
        legacy_bytes=base64.b64decode(body['content'])
        assert len(legacy_bytes)==494199,('R718_WORKFLOW_BYTES_CHANGED',len(legacy_bytes))
        computed_git_sha=hashlib.sha1(b'blob '+str(len(legacy_bytes)).encode()+b'\0'+legacy_bytes).hexdigest()
        assert computed_git_sha==git_sha,'R718_WORKFLOW_GIT_SHA_MISMATCH'
        txt=legacy_bytes.decode('utf8')
        print('R722_PINNED_R718_BLOB_SHA_PASS',git_sha)
        chunks=re.findall(r"<<'R718_SOURCE'\s*\n(.*?)\n[ \t]*R718_SOURCE[ \t]*$",txt,re.M|re.S)
        assert len(chunks)==24,('WRONG_R718_BASE85_CHUNK_COUNT',len(chunks))
        packed=''.join(''.join(chunk.split()) for chunk in chunks)
        packed=packed.replace('TP718SAFE',chr(36)+chr(123)+chr(123))
        raw=lzma.decompress(base64.b85decode(packed.encode()))
        assert len(raw)==2103770,('WRONG_R718_SOURCE_SIZE',len(raw))
        assert hashlib.sha256(raw).hexdigest()=='a3d9a354df046fd7583382193562dea3006524f59c6af127ecb0a054d8b0e8c4','R718_SOURCE_SHA_HOLD'
        originals=json.loads(raw)
        manifest_path=pathlib.Path('.r720-core/Verification/r718_source_manifest.json')
        manifest_bytes=manifest_path.read_bytes()
        # The original build receipt used a different whitespace representation.
        expected=json.loads(manifest_bytes)
        # The R718 signed receipt hashes 271 tracked files, but the frozen JSON
        # contains 272 files. Keep the extra file; never prune legacy data.
        assert len(expected)==271,('R718_MANIFEST_EXPECTED_271',len(expected))
        tracked=set(expected)
        original_names=set(originals)
        missing=sorted(tracked-original_names)
        extra=sorted(original_names-tracked)
        assert len(originals)==272 and not missing and len(extra)==1,(
            'R718_MANIFEST_COVERAGE_HOLD',len(originals),missing,extra)
        print('R722_SOURCE_SET_PASS',len(tracked),len(originals),'EXTRA',extra)
        for name,data in originals.items():
            item=pathlib.PurePosixPath(name)
            assert not item.is_absolute() and '..' not in item.parts
            if name in expected:
                assert hashlib.sha256(data.encode('utf8')).hexdigest()==expected[name],('R718_INDIVIDUAL_SHA_MISMATCH',name)
        # The full-payload SHA authenticates ALL 272 files, including the extra.
        pathlib.Path('.r720-output').mkdir(exist_ok=True)
        full_index={name:hashlib.sha256(data.encode('utf8')).hexdigest()
                    for name,data in sorted(originals.items())}
        pathlib.Path('.r720-output/R718_ALL_272_SOURCE_SHA256.json').write_text(
            json.dumps(full_index,ensure_ascii=False,indent=2),encoding='utf8')
        pathlib.Path('.r720-output/R718_ORIGINAL_SOURCE_NAMES.json').write_text(
            json.dumps(sorted(originals),ensure_ascii=False,indent=2),encoding='utf8')
        pathlib.Path('.r720-output/R718_EXTRA_SOURCE_INFO.json').write_text(
            json.dumps({'tracked':len(expected),'original_total':len(originals),
                        'extra_sha256':{name:full_index[name] for name in extra}},
                       ensure_ascii=False,indent=2),encoding='utf8')
        destination=pathlib.Path('.r718-build')
        destination.mkdir(exist_ok=True)
        for name,data in originals.items():
            output=destination/name
            output.parent.mkdir(parents=True,exist_ok=True)
            output.write_text(data,encoding='utf8')
        pathlib.Path('.r720-output').mkdir(exist_ok=True)
        # Pure source snapshot, not a substitute for the full runtime data/evidence fullpack.
        with zipfile.ZipFile('.r720-output/R718_EXACT_272_SOURCE_RECOVERY.zip','w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
            for name in sorted(originals): z.write(destination/name,arcname=name)
            z.write(manifest_path,arcname='VERIFICATION/source_manifest.json')
        report={'r718_source_size':len(raw),'r718_sha256':hashlib.sha256(raw).hexdigest(),
                'r718_manifest_files':271,'r718_frozen_total':272,
        'r718_extra_sha256':{name:full_index[name] for name in extra},
        'r715_replay':'NOT_AVAILABLE',
                'r720_new_source_payload_sha256':"9226fffcfbf039b03d5ccac65d73adc21dfb44b9abe38361f114b6767cd7315b",
                'live_device_certified_fields':0}
        pathlib.Path('.r720-output/RECOVERY_RECEIPT.json').write_text(json.dumps(report,indent=2))
        print('R718_ALL_272_FROZEN_AND_271_MANIFEST_SHA_PASS')
        PYCODE
    - name: Overlay additive Swift module into original app source
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYCODE'
        import pathlib,shutil,json
        base=pathlib.Path('.r718-build/app/ios/ChampionsOnDevice')
        assert base.is_dir(),'R718_APP_SOURCE_MISSING'
        overlay=pathlib.Path('.r720-core/Sources/R719Core')
        added=[]
        for src in sorted(overlay.glob('*.swift')):
            dest=base/src.name
            assert not dest.exists(),('SOURCE_NAME_COLLISION',str(dest))
            shutil.copy2(src,dest)
            added.append(dest.name)
        assert len(added)==4,('R720_EXPECTED_FOUR_SWIFT_FILES',added)
        report={
            'stage':'R720_SOURCE_OVERLAY_AND_BUILD_STAGING',
            'baseline':'R718_PINNED_SOURCE_SHA_ALL_272_AND_MANIFEST_271_FILES_PASS',
            'app_sources_overlay':added,
            'producer_wiring':'NOT_YET_CONNECTED_TO_R718_CAPTURECOORDINATOR',
            'independent_live_r715_evidence':'NOT_AVAILABLE',
            'device_certification':'0/79',
            'runtime_owner_gate':'NOT_YET_CERTIFIED',
            'turn':'PENDING_NOT_CERTIFIED',
            'ipa_signed':False
        }
        pathlib.Path('.r720-output/R720_INTEGRATION_SCOPE.json').write_text(json.dumps(report,indent=2))
        print('R720_SWIFT_APP_SOURCES_STAGED',len(added))
        PYCODE
    - name: Run portable Swift 41-test regression
      shell: bash
      run: |
        set -euo pipefail
        swift test -j 2 --package-path .r720-core | tee .r720-output/r720_portable_swift_tests.log
    - name: Typecheck additive Swift core for Apple iPhoneOS
      shell: bash
      run: |
        set -euo pipefail
        xcodebuild -version
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        xcrun swiftc -target arm64-apple-ios17.0 -sdk "$SDK" -typecheck .r720-core/Sources/R719Core/*.swift
        echo R720_IPHONEOS_CORE_TYPECHECK_PASS
    - name: Rebuild R718 app with R720 sources on iPhoneOS
      shell: bash
      run: |
        set -euo pipefail
        python3 .r718-build/tools/build_r718.py > .r720-output/r718_plus_r720_build.log 2>&1 || {
          tail -n 100 .r720-output/r718_plus_r720_build.log; exit 1;
        }
        python3 - <<'PYCODE'
        from pathlib import Path
        p=Path('.r718-build/dist/xcodebuild.log')
        assert p.is_file(),'IPHONEOS_BUILD_LOG_NOT_GENERATED'
        s=p.read_text(errors='replace')
        expected=['R719Core.swift','R719CoreVideoBridge.swift','R719EvidenceZIP.swift','R720CaptureAudit.swift']
        uncompiled=[name for name in expected if name not in s]
        assert not uncompiled,('NEW_SWIFT_FILES_NOT_IN_BUILD_LOG',uncompiled)
        print('R720_FULL_APP_COMPILATION_INPUTS_PRESENT_PASS',len(expected))
        # BUILD PASS does not prove new bridge is called from the production camera pipeline.
        print('R720_LIVE_CAPTURECOORDINATOR_WIRING_STILL_UNVERIFIED')
        PYCODE
    - name: Export source archive and exact runtime integration surfaces
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYCODE'
        import pathlib,json,re,zipfile
        root=pathlib.Path('.r718-build/app/ios/ChampionsOnDevice')
        names=['CaptureCoordinator.swift','R714ChunkedEvidence.swift','R718OwnerTurnEvidenceAudit.swift',
               'R710ContinuousRecorder.swift','R715ArchiveScopeAudit.swift','R715OCRWireAudit.swift']
        # Inspect real source, not guessed interfaces. A bounded extract is included for next-stage wiring.
        site={}
        for name in names:
            p=root/name
            if not p.is_file():continue
            lines=p.read_text(errors='replace').splitlines()
            hits=[]
            for i,line in enumerate(lines):
                if re.search(r'\b(func|init|class|struct|actor|enum)\b|CVPixelBuffer|save|archive|zip',line,re.I):
                    hits.append({'line':i+1,'snippet':line[:220]})
            site[name]={'length':len(lines),'symbols':hits[:300]}
        pathlib.Path('.r720-output/R720_WIRING_SYMBOLS.json').write_text(json.dumps(site,ensure_ascii=False,indent=2))
        with zipfile.ZipFile('.r720-output/R720_CAPTURE_WIRING_SOURCE_EXCERPTS.zip','w',zipfile.ZIP_DEFLATED) as z:
            for name in names:
                p=root/name
                if p.exists(): z.write(p,arcname=name)
        print('R720_EXACT_CAPTURE_WIRING_SURFACES_EXPORTED',len(site))
        PYCODE
    - name: Create complete edit-ready R718 and R720 source ZIP
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYCODE'
        import pathlib,zipfile,hashlib,json
        root=pathlib.Path('.r718-build')
        target=pathlib.Path('.r720-output/R722_FULL_EDITABLE_SOURCE_RECOVERY.zip')
        manifest=json.loads(pathlib.Path('.r720-core/Verification/r718_source_manifest.json').read_text())
        new=['R719Core.swift','R719CoreVideoBridge.swift','R719EvidenceZIP.swift','R720CaptureAudit.swift']
        original_names=json.loads(pathlib.Path('.r720-output/R718_ORIGINAL_SOURCE_NAMES.json').read_text())
        assert len(original_names)==272 and set(manifest).issubset(original_names)
        declared=sorted(set(original_names)|{'app/ios/ChampionsOnDevice/'+x for x in new})
        assert len(declared)==276,('R722_SOURCE_ARCHIVE_SET',len(declared))
        with zipfile.ZipFile(target,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
            for name in declared:
                p=root/name
                assert p.is_file(),('REQUIRED_SOURCE_FILE_MISSING',name)
                z.write(p,arcname=name)
            for p in sorted(pathlib.Path('.r720-core').rglob('*')):
                if p.is_file() and '.build' not in p.parts:
                    z.write(p, pathlib.Path('R720PortableCore')/p.relative_to('.r720-core'))
            for p in sorted(pathlib.Path('.r720-output').glob('*.json')):
                z.write(p,pathlib.Path('AUDIT')/p.name)
        with zipfile.ZipFile(target) as z:
            assert z.testzip() is None,'R720_SOURCE_ZIP_CRC_FAIL'
            count=len(z.infolist())
            assert count>=280,('R722_SOURCE_ZIP_FILE_LOSS',count)
        print('R722_SOURCE_RECOVERY_ZIP_PASS',count,target.stat().st_size)
        PYCODE
    - name: Guard public free-scope artifact storage
      id: budget
      if: success()
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python3 - <<'PYCODE'
        import pathlib,os,json,urllib.request
        root=pathlib.Path('.r720-output')
        # Restrict upload size to avoid consuming unexpectedly large artifact storage.
        size=sum(p.stat().st_size for p in root.rglob('*') if p.is_file())
        assert 0<size<16000000,('R720_ARTIFACT_SIZE_HOLD',size)
        active=0
        for page in range(1,11):
            url=('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+
                '/actions/artifacts?per_page=100&page='+str(page))
            req=urllib.request.Request(url,headers={
                'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                'Accept':'application/vnd.github+json',
                'User-Agent':'TruePlan-R720-Public-FreeGuard'})
            with urllib.request.urlopen(req,timeout=30) as response:
                items=json.load(response).get('artifacts',[])
            active+=sum(x['size_in_bytes'] for x in items if not x.get('expired'))
            if len(items)<100:break
        else: raise RuntimeError('R720_ARTIFACT_STORAGE_INVENTORY_INCOMPLETE')
        assert active+size<400000000,('R720_FREE_ARTIFACT_STORAGE_HOLD',active,size)
        with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('allowed=true\n')
        print('R720_STORAGE_BUDGET_PASS',active,size)
        PYCODE
    - uses: actions/upload-artifact@v4
      if: always() && steps.budget.outputs.allowed == 'true'
      with:
        name: R722-exact-source-and-integration-audit
        path: .r720-output/*
        if-no-files-found: error
    - name: Explicit runtime/real-device certification boundary
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        echo '## R722 checkout-free recovery - NOT field/device certification' >> "$GITHUB_STEP_SUMMARY"
        echo 'R718 all 272 source files are preserved only if R718 pinned SHA and 271 tracked SHA checks pass.' >> "$GITHUB_STEP_SUMMARY"
        echo 'R719/R720 Swift core staged; CaptureCoordinator runtime hookup remains unverified.' >> "$GITHUB_STEP_SUMMARY"
        echo 'R715 original device evidence is unavailable and was NOT replayed.' >> "$GITHUB_STEP_SUMMARY"
        echo '79-field device certification remains 0/79. Signed IPA NOT certified.' >> "$GITHUB_STEP_SUMMARY"
