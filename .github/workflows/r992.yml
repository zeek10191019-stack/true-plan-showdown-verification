name: R992 iPhone readout recovery
'on':
  push:
    branches: [r987-ocr-pc-regression]
    paths: [.github/workflows/r992.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.repository ==
      'zeek10191019-stack/true-plan-showdown-verification' &&
      !github.event.repository.private &&
      github.ref == 'refs/heads/r987-ocr-pc-regression'
    runs-on: xcode-27
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      RELEASE_TAG: r992-unsigned-device-test
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: .github/workflows/r992.yml
    - name: Restore and verify the R992 source
      shell: bash
      run: |
        set -euo pipefail
        base=c0be3902028bac82e43ff57165de356ae0b98d09
        old="$RUNNER_TEMP/base-r991.yml"
        git show "$base:.github/workflows/r991.yml" > "$old"
        python3 - "$old" <<'BASELINE'
        import hashlib, sys
        from pathlib import Path
        expected = ("713a7463913be886a72d098cd309a8b8"
                    "d02ef40aac9672c8db5df36870b53f10")
        actual = hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest()
        assert actual == expected
        BASELINE
        ruby -ryaml -e '
          steps = YAML.load_file(ARGV[0], aliases: true)
            .fetch("jobs").fetch("verify").fetch("steps")
          title = "Restore and verify the R991 source"
          step = steps.find { |s| s["name"] == title }
          puts step.fetch("run")
        ' "$old" > "$RUNNER_TEMP/restore-r991.sh"
        bash "$RUNNER_TEMP/restore-r991.sh"
        python3 - "$RUNNER_TEMP/r992.patch" <<'DELTA'
