        import hashlib, json
        from pathlib import Path
        root = Path("pinned-r793/source")
        target = root / "source_manifest.json"
        files = {
            p.relative_to(root).as_posix():
                hashlib.sha256(p.read_bytes()).hexdigest()
            for p in root.rglob("*") if p.is_file() and p != target
        }
        assert json.loads(target.read_bytes()).keys() <= files.keys()
        data = (json.dumps(files,sort_keys=True,indent=2)+'\n').encode()
        expected = ("81c0afb9c85b7f4e1b079940ebeda812"
                    "3566ed8acf4150b49b7fc810c13ce5ea")
        assert hashlib.sha256(data).hexdigest() == expected
        target.write_bytes(data)
        print("R992_SOURCE_VERIFIED",len(files))
        MANIFEST
    - name: Replay Apple Vision on macOS 26
      shell: bash
      run: |
        set -euo pipefail
        prior="$RUNNER_TEMP/r990-baseline.yml"
        out="$RUNNER_TEMP/r992-vision.sh"
        ruby -ryaml -e '
          steps = YAML.load_file(ARGV[0], aliases: true)
            .fetch("jobs").fetch("vision").fetch("steps")
          step = steps.find { |s| s.fetch("name","").start_with?(ARGV[1]) }
          puts step.fetch("run")
        ' "$prior" "Replay retained Apple Vision" > "$out"
        bash "$RUNNER_TEMP/r992-vision.sh"
  verify:
    needs: vision
    if: >-
      github.repository ==
      'zeek10191019-stack/true-plan-showdown-verification' &&
      !github.event.repository.private &&
      github.ref == 'refs/heads/r987-ocr-pc-regression'
    runs-on: xcode-27
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RELEASE_TAG: r992-unsigned-device-test
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: .github/workflows/r992.yml
    - name: Restore and verify the R992 source
      shell: bash
      run: |
