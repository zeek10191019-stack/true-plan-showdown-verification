    - name: Run Swift, archive and browser regressions
      shell: bash
      run: |
        set -euo pipefail
        prior="$RUNNER_TEMP/r990-baseline.yml"
        extract() {
          ruby -ryaml -e '
            doc = YAML.load_file(ARGV[0], aliases: true)
            steps = doc.fetch("jobs").fetch(ARGV[1]).fetch("steps")
            step = steps.find { |s| s.fetch("name","").start_with?(ARGV[2]) }
            puts step.fetch("run")
          ' "$prior" "$1" "$2" > "$RUNNER_TEMP/r992-check.sh"
        }
        for check in 'Replay storage contention' 'Run integrated export'; do
          extract verify "$check"
          bash "$RUNNER_TEMP/r992-check.sh"
        done
    - name: Build and publish the verified unsigned IPA
      shell: bash
      run: |
        set -euo pipefail
        prior="$RUNNER_TEMP/r990-baseline.yml"
        extract() {
          ruby -ryaml -e '
            doc = YAML.load_file(ARGV[0], aliases: true)
            steps = doc.fetch("jobs").fetch("verify").fetch("steps")
            step = steps.find { |s| s.fetch("name","").start_with?(ARGV[1]) }
            puts step.fetch("run")
          ' "$prior" "$1" > "$RUNNER_TEMP/r992-old-step"
        }
        extract "Build and verify iPhoneOS"
        sed -e 's/990/992/g' -e 's/0\.9\.90/0.9.92/g' \
          "$RUNNER_TEMP/r992-old-step" > "$RUNNER_TEMP/r992-build.sh"
        bash "$RUNNER_TEMP/r992-build.sh"
        extract "Validate the IPA"
        python3 - <<'PACKAGE'
        import os
        from pathlib import Path
        root = Path(os.environ["RUNNER_TEMP"])
        text = (root / "r992-old-step").read_text()
        old = ("a8a6ad98f54a2b98a5079657639b7001"
                    "6558ca763803e24d5d1cbd74a82e70d4")
        new = ("81c0afb9c85b7f4e1b079940ebeda812"
                    "3566ed8acf4150b49b7fc810c13ce5ea")
        assert old in text
        text = text.replace(old,new)
        text = text.replace("R990","R992").replace("r990","r992")
        text = text.replace('"990"','"992"')
        text = text.replace('"build": 990','"build": 992')
        text = text.replace("0.9.90","0.9.92")
        lines = text.splitlines()
        for index,line in enumerate(lines):
            if line.lstrip().startswith("--notes "):
                lines[index] = "    --notes 'Readout recovery for iPhone.'"
        (root / "r992-package.sh").write_text("\n".join(lines) + "\n")
        PACKAGE
        bash "$RUNNER_TEMP/r992-package.sh"
        gh release edit "$RELEASE_TAG" \
          --repo "$GITHUB_REPOSITORY" --draft=false
