       set -euo pipefail
       url='https://api.github.com/repos/'
       url+='zeek10191019-stack/'
       url+='true-plan-showdown-verification/'
       url+='actions/artifacts/13757552664/zip'
       curl -fLsS --retry 2 -H "Authorization: Bearer $GH_TOKEN" \
        -H 'Accept: application/vnd.github+json' \
        "$url" -o /tmp/r742-base.zip
       mkdir -p source R742Artifacts
