        packed.split()))))
       assert pkt['schema']=='trueplan.r742.e1-locked-hunk-delivery.v1'
       assert pkt['base_zip_sha256']==digest(base)
       prior={p.relative_to(root).as_posix():digest(p.read_bytes())
        for p in root.rglob('*') if p.is_file()}
       assert len(prior)==pkt['baseline_count']==350
       for item in pkt['patches']:
        for name in item['paths']:
         f=root/name
         assert f.is_file() and prior[name]==item['prior_sha256']
         lines=f.read_text(encoding='utf-8').splitlines(keepends=True)
         out=[];last=0
         for lo,hi,rep in item['hunks']:
          assert last<=lo<=hi<=len(lines)
          out.extend(lines[last:lo]);out.append(rep);last=hi
         out.extend(lines[last:])
         data=''.join(out).encode('utf-8')
         assert digest(data)==item['sha256']
         f.write_bytes(data)
       for item in pkt['additions']:
        data=item['content'].encode('utf-8')
        assert digest(data)==item['sha256']
        for name in item['paths']:
         f=root/name
         assert not f.exists()
         f.parent.mkdir(parents=True,exist_ok=True)
         f.write_bytes(data)
       manifest={p.relative_to(root).as_posix():digest(p.read_bytes())
        for p in root.rglob('*') if p.is_file()
        and p.name!='source_manifest.json'}
       m=root/'source_manifest.json'
       m.write_text(json.dumps(manifest,indent=2,sort_keys=True,
        ensure_ascii=False)+'\n')
       files=sorted(p for p in root.rglob('*') if p.is_file())
       assert len(files)==pkt['final_count']==363
       assert set(prior).issubset(set(
        p.relative_to(root).as_posix() for p in files))
       checks={p.relative_to(root).as_posix():digest(p.read_bytes())
        for p in files}
       tree=''.join(n+'\t'+checks[n]+'\n' for n in sorted(checks))
       assert digest(tree.encode())==pkt['tree_sha256']
       assert digest(m.read_bytes())==pkt['manifest_sha256']
       (pathlib.Path('R742Artifacts')/'SOURCE_HASHES.json').write_text(
        json.dumps(checks,indent=2,sort_keys=True)+'\n')
       print('R742_SOURCE_363_SHA_PASS_NO_DELETION')
       PYTHON
    - name: Run Swift tests and full unsigned iPhoneOS build
      shell: bash
      run: |
       set -euo pipefail
       (cd source/R720_PORTABLE_TESTS && swift test -j 2) \
        > R742Artifacts/SwiftTests.log 2>&1 || {
         tail -n 100 R742Artifacts/SwiftTests.log;exit 1;
        }
       grep -Fq 'Executed 219 tests, with 0 failures' \
        R742Artifacts/SwiftTests.log
       swiftc -frontend -parse source/app/ios/ChampionsOnDevice/*.swift
       python3 source/tools/r742_live_path_audit.py
       python3 source/tools/generate_xcode_project.py
       xcodebuild -project source/app/ios/ChampionsOnDeviceResearch.xcodeproj \
        -scheme ChampionsOnDeviceResearch -configuration Debug \
        -sdk iphoneos -destination 'generic/platform=iOS' \
        ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
        -derivedDataPath "$RUNNER_TEMP/r742-app" build \
        > R742Artifacts/iPhoneOS.log 2>&1 || {
         grep -E 'error:|BUILD FAILED' R742Artifacts/iPhoneOS.log || true
         exit 1;
        }
       grep -Fq 'BUILD SUCCEEDED' R742Artifacts/iPhoneOS.log
       grep -Fq 'R742QuickVisionBridge.swift' \
        R742Artifacts/iPhoneOS.log
       python3 - <<'PYTHON'
       import hashlib,json,os,pathlib,plistlib,zipfile
       root=pathlib.Path('source');out=pathlib.Path('R742Artifacts')
       sha=json.loads((out/'SOURCE_HASHES.json').read_text())
       assert len(sha)==363
       for name,digest in sha.items():
        assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest
       archive=out/'R742_ALL_EDITABLE_SOURCE_RECOVERY.zip'
       with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED) as z:
        for name in sorted(sha):z.write(root/name,name)
       with zipfile.ZipFile(archive) as z:
        assert z.testzip() is None and len(z.namelist())==363
        for name,digest in sha.items():
         assert hashlib.sha256(z.read(name)).hexdigest()==digest
       derived=pathlib.Path(os.environ['RUNNER_TEMP']) / \
        'r742-app/Build/Products/Debug-iphoneos'
       app=derived/'ChampionsOnDeviceResearch.app'
       assert (app/'ChampionsOnDeviceResearch').is_file()
       info=plistlib.loads((app/'Info.plist').read_bytes())
       assert info['CFBundleVersion']=='742'
       assert info['CFBundleShortVersionString']=='0.7.42'
       ipa=out/'R742_Unsigned_Research.ipa'
       with zipfile.ZipFile(ipa,'w',zipfile.ZIP_DEFLATED) as z:
        for f in sorted(app.rglob('*')):
         assert not f.is_symlink()
         if f.is_file():
          z.write(f,'Payload/'+app.name+'/'+f.relative_to(app).as_posix())
       with zipfile.ZipFile(ipa) as z:assert z.testzip() is None
       assert ipa.stat().st_size<16_000_000
       (out/'CERTIFICATION.txt').write_text(
        'R742 CI only. OCR speed and gameplay fields unverified.\n')
       print('R742_IPHONEOS_BUILD_PASS_NOT_DEVICE_CERTIFIED')
       PYTHON
    - name: Public artifact size guard
      shell: bash
      run: |
       python3 - <<'PYTHON'
       import pathlib
       size=sum(p.stat().st_size for p in 
