'on':
  push:
    branches: [main]
    paths: ['.github/workflows/e2.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
    - name: Restore pinned R741 then apply R742 no-delete delta
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
