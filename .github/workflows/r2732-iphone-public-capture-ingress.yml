name: R27.32 single-iPhone capture ingress synthetic security verification
'on':
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r2732-public-ios-transport-manual
  cancel-in-progress: false
jobs:
  public_ingress_contract_only:
    name: iPhone frame transport research (no game screenshots, no private source)
    if: ${{ github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Restore hash-pinned public test and iOS source-only files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYRESTORE'
          from pathlib import Path
          import base64,hashlib
          root=Path("r2732")
          root.mkdir(exist_ok=True)
          files={"README_R2732.md": "", "ios/ENTITLEMENTS_AND_SETUP.md": "", "ios/FrameSender.swift": "", "ios/LegacyReplayKitHandler_iOS26.swift": "", "ios/ModernScreenCaptureKit_iOS27.swift": "", "relay/r2731-screen-decision-boundary.cjs": "", "relay/r2732-frame-relay.cjs": "", "relay/test_r2732_frame_relay.cjs": "", "relay/test_r2732_r2731_boundary.cjs": ""}
          hashes={"README_R2732.md": "1ad557a8c77b0f954b705837da350066ac1dd158c2325858ba0105ca0071a3ba", "ios/ENTITLEMENTS_AND_SETUP.md": "aa7062ef238a360052ed7a157ed9aeb316674a2feddc45b31d05996fafb9c4fd", "ios/FrameSender.swift": "f40568d4334cc2f531761fd033a9a8845235f7ce782e0e95fd6785f72e62fb60", "ios/LegacyReplayKitHandler_iOS26.swift": "f9679d935f2c2188516d4fd5c901a23399a8bce7cf1555441b0795ce49b0a5a1", "ios/ModernScreenCaptureKit_iOS27.swift": "379066929abcf67bfb20e7de944f4267fac4b6810dcb4f6560a05b30f5462ef3", "relay/r2731-screen-decision-boundary.cjs": "05fe683a2312e888e736c27053f81a39e847c21cc7a4208f09355d03d89bc592", "relay/r2732-frame-relay.cjs": "0e84c792d60999ace2480c355f5edb44e530f3a807a7b58f79eff95fa7a9f35a", "relay/test_r2732_frame_relay.cjs": "5d3079f35abbf63a75100375991d4e1ddf13f5e72ba77851bd5709629a45e93c", "relay/test_r2732_r2731_boundary.cjs": "dfb05a0445b6ab4158ad45bd53751f61163ea9717ca34b9cccba2140ff273d22"}
          for name,b64 in files.items():
              dst=root/name
              dst.parent.mkdir(parents=True,exist_ok=True)
              raw=base64.b64decode(b64)
              assert hashlib.sha256(raw).hexdigest()==hashes[name]
              dst.write_bytes(raw)
          print("R2732_EMBEDDED_SOURCE_HASH_PASS",len(files))
          PYRESTORE
      - name: Run 31 transport and fail-closed regression checks, audit public-only receipt
        shell: bash
        run: |
          set -euo pipefail
          node --check r2732/relay/r2732-frame-relay.cjs
          node --check r2732/relay/test_r2732_frame_relay.cjs
          node --check r2732/relay/test_r2732_r2731_boundary.cjs
          node r2732/relay/test_r2732_frame_relay.cjs | tee r2732/transport-test-log.txt
          node r2732/relay/test_r2732_r2731_boundary.cjs | tee r2732/boundary-test-log.txt
          python3 - <<'PYAUDIT'
          import json,hashlib,pathlib,re
          p=pathlib.Path('r2732')
          text=(p/'transport-test-log.txt').read_text()
          assert text.startswith('R2732_TEST_PASS ')
          stats=json.loads(text.split(' ',1)[1]);assert stats['checked']==29
          c=(p/'boundary-test-log.txt').read_text()
          assert c.startswith('R2732_R2731_INHERITED_FAIL_CLOSED_PASS ')
          assert json.loads(c.split(' ',1)[1])['cases']==2
          receipt={'schema':'TRUE_PLAN_R2732_PUBLIC_CAPTURE_TRANSPORT_PROOF_V1','status':'PASS_SYNTHETIC_TRANSPORT_ONLY',
            'synthetic_transport_tests':29,'r2731_boundary_regression':2,
            'iOS_captured_frames':0,'visual_recognition_certified':False,'actual_ios_sdk_compilation':False,
            'real_time_recommendations':0,'native33':'0/33','exact34':'0/34','actual_game':'0/30','formal':'DENY'}
          (p/'r2732-receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          files=sorted(x for x in p.rglob('*') if x.is_file() and x.name!='SHA256SUMS.txt')
          assert len(files)==12, [(x.as_posix()) for x in files]
          (p/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.relative_to(p).as_posix()+'\n' for f in files))
          print('R2732_PUBLIC_EVIDENCE_PASS',len(files))
          PYAUDIT
          (cd r2732 && sha256sum -c SHA256SUMS.txt)
      - name: Upload public research proof only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: r2732-iphone-public-capture-ingress-proof
          path: r2732/
          retention-days: 7
          if-no-files-found: error
