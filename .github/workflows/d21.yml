    - name: Swift regression and iPhoneOS compile NO IPA
      shell: bash
      run: |
        set -euo pipefail
        (cd source/R720_PORTABLE_TESTS && swift test -j 2) \
         > R760Proof/Swift.log 2>&1 || {
          tail -n 70 R760Proof/Swift.log;exit 1;
         }
        grep -Fq 'Executed 333 tests, with 0 failures' \
         R760Proof/Swift.log
        python3 source/tools/r748_capture_path_gate.py \
         > R760Proof/CapturePath.log
        python3 source/tools/r745_read_path_gate.py \
         > R760Proof/ReadPath.log
        python3 source/tools/r742_live_path_audit.py \
         > R760Proof/LivePath.log
        python3 source/tools/r743_macos_compat_audit.py \
         > R760Proof/MacAudit.log
        python3 -m unittest discover -s source/tools/tests \
         -p 'test_r756*.py' -v > R760Proof/VideoTests.log 2>&1 || {
          tail -n 70 R760Proof/VideoTests.log;exit 1;
         }
        python3 -m unittest discover -s source/tools/tests \
         -p 'test_r757*.py' -v >> R760Proof/VideoTests.log 2>&1 || {
          tail -n 70 R760Proof/VideoTests.log;exit 1;
         }
        swiftc -frontend -parse source/app/ios/ChampionsOnDevice/*.swift
        python3 source/tools/generate_xcode_project.py
        xcodebuild -project source/app/ios/ChampionsOnDeviceResearch.xcodeproj \
         -scheme ChampionsOnDeviceResearch -configuration Debug \
         -sdk iphoneos -destination 'generic/platform=iOS' \
         ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
         -derivedDataPath "$RUNNER_TEMP/r760" build \
         > R760Proof/iPhoneOS.log 2>&1 || {
          grep -E 'error:|BUILD FAILED' R760Proof/iPhoneOS.log || true
          exit 1;
         }
        grep -Fq 'BUILD SUCCEEDED' R760Proof/iPhoneOS.log
    - name: Package source delta diagnostics NO IPA
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYTHON'
        import pathlib,zipfile,hashlib,json
        root=pathlib.Path('source');out=pathlib.Path('R760Proof')
        expected=json.loads((out/'HASHES.json').read_text())
        assert len(expected)==430
        names=[
         'app/ios/ChampionsOnDevice/CaptureCoordinator.swift',
         'app/ios/ChampionsOnDevice/R710ContinuousRecorder.swift',
         'app/ios/ChampionsOnDevice/R760FrameLogAdmission.swift',
         'R720_PORTABLE_TESTS/Sources/R719Core/R760FrameLogAdmission.swift',
         'R720_PORTABLE_TESTS/Tests/R719CoreTests/R760FrameLogAdmissionTests.swift',
         'R760_CHANGELOG.md',
         'source_manifest.json',
        ]
        with zipfile.ZipFile(out/'R760_CHANGESET_ONLY.zip','w',
         zipfile.ZIP_DEFLATED) as z:
         for n in names:
          b=(root/n).read_bytes()
          assert hashlib.sha256(b).hexdigest()==expected[n]
          z.writestr(n,b)
        (out/'STATUS.txt').write_text(
         'R760 430 sources, zero deleted. NO IPA.\n'
         'Frame metadata disk IO is off sample callback.\n'
         'OCR source PNG writes and legacy pairing still need isolation.\n'
         'Capture freezes and OCR completion NOT device certified.\n')
        PYTHON
