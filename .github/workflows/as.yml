              assert not path.is_absolute() and '..' not in path.parts and not path.exists(),('R599_REFUSE_OVERWRITE',name)
              part=data[idx:idx+n];idx+=n
              assert len(part)==n and hashlib.sha256(part).hexdigest()==h,('R599_FILE_HASH_MISMATCH',name)
              staging.append((path,part))
          assert idx==len(data),'R599_TRAILING_PAYLOAD'
          for path,part in staging:
              path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(part)
          print('R599_5_FILE_SHA_PASS_AND_R598_PARENT_PINNED')
          R599_REPLAY
      - name: R599 new contract, regression, source seam inventory, native iOS compilation
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse app/ios/ChampionsOnDevice/*.swift
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R596FormCatalog.swift app/ios/ChampionsOnDevice/R597FormEvidenceBridge.swift app/ios/ChampionsOnDevice/R598OneButtonFormAttachment.swift app/ios/ChampionsOnDevice/R599BoundOneButton.swift tests/R599BoundOneButtonHarness.swift -o "$RUNNER_TEMP/r599"
          R599_STAGE_EXPORT="$RUNNER_TEMP/r599_stage" "$RUNNER_TEMP/r599"
          python3 tools/r599_zip_e2e.py "$RUNNER_TEMP/r599_stage"
          python3 -m unittest discover -s tests -p 'test_r599_source_audit.py' -v
          python3 tools/r599_source_audit.py > "$RUNNER_TEMP/r599_source_seam_inventory.json"
          cat "$RUNNER_TEMP/r599_source_seam_inventory.json"
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R596FormCatalog.swift app/ios/ChampionsOnDevice/R597FormEvidenceBridge.swift app/ios/ChampionsOnDevice/R598OneButtonFormAttachment.swift tests/R598OneButtonFormAttachmentHarness.swift -o "$RUNNER_TEMP/r598"
          "$RUNNER_TEMP/r598"
          python3 -m unittest discover -s tests -p 'test_r598_research_audit.py' -v
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R596FormCatalog.swift app/ios/ChampionsOnDevice/R597FormEvidenceBridge.swift tests/R597FormEvidenceBridgeHarness.swift -o "$RUNNER_TEMP/r597"
