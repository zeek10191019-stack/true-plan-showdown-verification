name: R994 device turn-one regression
'on':
  push:
    branches:
      - r987-ocr-pc-regression
    paths:
      - .github/workflows/r994-device-turn1-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && !github.event.repository.private && github.ref == 'refs/heads/r987-ocr-pc-regression'
    runs-on: macos-26
    timeout-minutes: 32
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: .github/workflows/r994-device-turn1-regression.yml
    - name: Restore the exact R993 source and apply the readout patch
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/r994"
        prior="$RUNNER_TEMP/r994/r993-pinned.yml"
        git show '860362fce99644bf7b244a6af266c2c24da013e1:.github/workflows/r993.yml' > "$prior"
        echo '0c04368d462ae50e0357d7c6672bc380fbc57515615a312ec8784252a21328b1  r993-pinned.yml' | (cd "$RUNNER_TEMP/r994" && shasum -a 256 -c -)
        ruby -ryaml -e '
          steps = YAML.load_file(ARGV[0], aliases: true).fetch("jobs").fetch("vision").fetch("steps")
          puts steps.find { |step| step["name"] == "Restore and verify the R993 source" }.fetch("run")
