          assert receipt['certification']=={'native33':'0/33','exact34':'0/34',
            'actual_game':'0/30','stage15_formal_increment':0,'gate':'DENY_FORMAL_CERTIFICATION'}
          print('R2724_PUBLIC_EVIDENCE_AUDIT_PASS',len(worlds),total)
          PY_AUDIT
          (cd ./r2724-evidence && sha256sum *.cjs *.json > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
