name: R27.24 public Bayesian belief and action forecast research
'on':
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r2724-public-bayes-forecast-manual
  cancel-in-progress: false
jobs:
  public_research_only:
    name: Pinned M-C six-world public Bayes updates and untrained forecasts
    if: ${{ github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Fetch pinned public Showdown and build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/showdown"
          cd "$RUNNER_TEMP/showdown"
          git init -q
          git remote add origin https://github.com/smogon/pokemon-showdown.git
          git fetch --depth 1 origin aa17ca0fac8bc5605df673bd8774c2d0e91efa43
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = aa17ca0fac8bc5605df673bd8774c2d0e91efa43
          test "$(git rev-parse 'HEAD^{tree}')" = 98c9038b81fa5ed7f1e9818736b701918920501e
          test "$(node --version)" = v22.18.0
          npm ci --no-audit --no-fund
          npm run build
      - name: Verify pinned compiled distribution
        shell: bash
        working-directory: ${{ runner.temp }}/showdown
        run: |
          set -euo pipefail
          python3 - <<'PY_DIST'
          from pathlib import Path
          import hashlib
          dist=Path('dist')
          items=list(dist.rglob('*'))
          assert not any(p.is_symlink() for p in items)
          files=sorted((p for p in items if p.is_file()),key=lambda p:p.relative_to(dist).as_posix())
          assert len(files)==1094,len(files)
          h=hashlib.sha256()
          for p in files:
              n=p.relative_to(dist).as_posix().encode()
              h.update(len(n).to_bytes(8,'big'))
              h.update(n)
              h.update(hashlib.sha256(p.read_bytes()).digest())
          assert h.hexdigest()=='3697be28e9736b691f005bc5ad7b56789523fbf4ef04d838fcc91f6cfae9c3df'
          print('R2724_PINNED_DIST_PASS',len(files),h.hexdigest())
          PY_DIST
      - name: Retrieve three exact public parent sources
        shell: bash
        working-directory: ${{ runner.temp }}/showdown
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            'https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/6b0d3daa8c3957821604fcbd410287e0f7f389d1/.github/workflows/r2720-public-faint-forced-switch-terminal.yml' -o './r2720-workflow.yml'
          printf '%s  %s\n' '75dc810599d0d91b747f77bb37e1278f6fa7b782364b537c907591f21454933c' './r2720-workflow.yml' | sha256sum -c -
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            'https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/9992d08f6c53fcf487cea7c14da0e9fd916cb67c/.github/workflows/r2722-public-rng-observation-noninterference.yml' -o './r2722-workflow.yml'
          printf '%s  %s\n' 'e59183d4b3e8e01604d94a05bebb8911114448e69d8e906f0739da0becf187a4' './r2722-workflow.yml' | sha256sum -c -
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            'https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/a376645c3096220eed6e9b30758cfd7713eedc06/.github/workflows/r2723-public-multiturn-belief-boundaries.yml' -o './r2723-workflow.yml'
          printf '%s  %s\n' '5fe1c97be8714313c82392f7901e21debbe036b7b97dadbe32c472654f015b84' './r2723-workflow.yml' | sha256sum -c -
          python3 - <<'PY_PARENT'
          from pathlib import Path
          sources=[
            ('r2720-workflow.yml','r2720-faint-force-switch-win.cjs','R2720_SOURCE'),
            ('r2722-workflow.yml','r2722-rng-observation-boundaries.cjs','R2722_SOURCE'),
            ('r2723-workflow.yml','r2723-multiturn-belief-boundaries.cjs','R2723_SOURCE'),
          ]
          for wf,js,tag in sources:
              contents=Path(wf).read_text()
              marker="          cat > ./"+js+" <<'"+tag+"'\n"
              assert contents.count(marker)==1,(wf,'ambiguous marker')
              block=contents.split(marker,1)[1].split('\n          '+tag+'\n',1)[0]
              source='\n'.join(line[10:] for line in block.split('\n'))+'\n'
              Path(js).write_text(source)
          PY_PARENT
          printf '%s  %s\n' '2886cc68cc71f866bffb775c5c42d51d9d23eebf3136c9dcb399a610e8387f4b' './r2720-faint-force-switch-win.cjs' | sha256sum -c -
          node --check ./r2720-faint-force-switch-win.cjs
          printf '%s  %s\n' '0a4fe39d6e1f3ac1c208171b3c38c9d19a388d618baf1b4bfeab78e1c24b8d7e' './r2722-rng-observation-boundaries.cjs' | sha256sum -c -
          node --check ./r2722-rng-observation-boundaries.cjs
          printf '%s  %s\n' 'fed3b7e13eb09f0ffd2bfcb6fb8497ac39da502781994c56c16dbb846a566c49' './r2723-multiturn-belief-boundaries.cjs' | sha256sum -c -
          node --check ./r2723-multiturn-belief-boundaries.cjs
      - name: Execute six-world public Bayesian updates and action forecasts
        shell: bash
        working-directory: ${{ runner.temp }}/showdown
        run: |
          set -euo pipefail
          cat > ./r2724-bayesian-belief-action-forecast.cjs <<'R2724_SOURCE'
          #!/usr/bin/env node
          'use strict';
          /** R27.24: public-observation-only, hand-parameterized Bayesian baseline. NOT trained/calibrated Battle AI. */
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const crypto=require('node:crypto');
          const {Battle}=require('./dist/sim/battle');
          const {Dex}=require('./dist/sim/dex');
          const {State}=require('./dist/sim/state');
          const {teams}=require('./r2720-faint-force-switch-win.cjs');
          const {viewer}=require('./r2722-rng-observation-boundaries.cjs');
          const {makeVariants,publicContract}=require('./r2723-multiturn-belief-boundaries.cjs');
          const PIN='aa17ca0fac8bc5605df673bd8774c2d0e91efa43';
          const SEED='1,2,3,4';
          const PREFIX=[['move 3','move 2'],['move 4','move 3'],['move 3','move 2'],['move 4','move 3']];
          const MOVES=['swordsdance','willowisp','flamethrower'];
          const ITEMS=['','sitrusberry'];
          const MOVE_PRIOR={swordsdance:0.42,willowisp:0.33,flamethrower:0.25};
          const ITEM_PRIOR={'':0.65,sitrusberry:0.35};
          // Deliberately hand-chosen illustrative action likelihoods, not empirical estimates.
          const COMMON_LIKELIHOOD={
            swordsdance:{'Protect':0.45,'Endure':0.40},
            willowisp:{'Protect':0.25,'Endure':0.35},
            flamethrower:{'Protect':0.35,'Endure':0.25},
          };
          const ACTIONS=['attack','setup','status','defend'];
          const NEXT_ACTION={
            swordsdance:{attack:0.12,setup:0.58,status:0.10,defend:0.20},
            willowisp:{attack:0.12,setup:0.08,status:0.55,defend:0.25},
            flamethrower:{attack:0.62,setup:0.08,status:0.05,defend:0.25},
          };
          const canonical=x=>Array.isArray(x)?x.map(canonical):x&&typeof x==='object'?
            Object.fromEntries(Object.keys(x).sort().map(k=>[k,canonical(x[k])])):x;
          const copy=x=>JSON.parse(JSON.stringify(x));
          const sha=x=>crypto.createHash('sha256').update(JSON.stringify(canonical(x))).digest('hex');
          const rounded=x=>Number(x.toFixed(12));
          function distribution(hypotheses){
            assert(Array.isArray(hypotheses)&&hypotheses.length===6,'six hypotheses required');
            assert(hypotheses.every(x=>Number.isFinite(x.p)&&x.p>=0),'invalid probability');
            assert(Math.abs(hypotheses.reduce((s,x)=>s+x.p,0)-1)<1e-11,'posterior not normalized');
            return hypotheses;
          }
          function initialBelief(){
            return distribution(MOVES.flatMap(move=>ITEMS.map(item=>({
              id:move+'__'+(item||'none'),move,item,p:MOVE_PRIOR[move]*ITEM_PRIOR[item],
            }))));
          }
          function publicMoveEvents(lines){
            assert(Array.isArray(lines)&&lines.every(x=>typeof x==='string'),'invalid public protocol suffix');
            const moves=lines.filter(x=>x.startsWith('|move|p2a: Target4|'));
            assert(moves.length<=1,'more than one target move in one observation delta');
            for(const line of lines){
              if(line.startsWith('|move|p2a: ')&&!line.startsWith('|move|p2a: Target4|')){
                throw Error('unsupported opponent actor in observation scope');
              }
            }
            return moves.map(line=>line.split('|')[3]);
          }
          function moveLikelihood(hiddenMove,publicName,dex){
            const common=COMMON_LIKELIHOOD[hiddenMove][publicName];
            if(common!==undefined)return common;
            const known=dex.moves.get(hiddenMove).name;
            if(known===publicName)return 1;
            if(MOVES.some(id=>dex.moves.get(id).name===publicName))return 0;
            throw Error('unsupported or impossible public move: '+publicName);
          }
          function bayesUpdate(current,publicNames,dex){
            let next=current.map(x=>({...x}));
            for(const name of publicNames){
              const masses=next.map(x=>x.p*moveLikelihood(x.move,name,dex));
              const sum=masses.reduce((a,b)=>a+b,0);
              assert(sum>0&&Number.isFinite(sum),'zero evidence likelihood: '+name);
              next=next.map((h,i)=>({...h,p:masses[i]/sum}));
              distribution(next);
            }
            return next;
          }
          function predictNext(posterior){
            distribution(posterior);
            const out=Object.fromEntries(ACTIONS.map(k=>[k,0]));
            for(const h of posterior)for(const k of ACTIONS)out[k]+=h.p*NEXT_ACTION[h.move][k];
            assert(Math.abs(Object.values(out).reduce((a,b)=>a+b,0)-1)<1e-11);
            return out;
          }
          function summary(posterior){
            distribution(posterior);
            const byMove=Object.fromEntries(MOVES.map(id=>[id,rounded(posterior.filter(h=>h.move===id).reduce((s,h)=>s+h.p,0))]));
            const byItem=Object.fromEntries(['none','sitrusberry'].map(name=>[name,
              rounded(posterior.filter(h=>(h.item||'none')===name).reduce((s,h)=>s+h.p,0))]));
            const prediction=predictNext(posterior);
            return {worlds:posterior.filter(x=>x.p>1e-12).length,
              posterior:posterior.map(x=>({id:x.id,p:rounded(x.p)})),by_move:byMove,by_item:byItem,
              next_action_prediction:Object.fromEntries(ACTIONS.map(k=>[k,rounded(prediction[k])]))};
          }
          class PublicBelief{
            constructor(dex){
              this.dex=dex;this.posterior=initialBelief();this.last=null;this.trace=[];
            }
            observe(input){
              publicContract(input); // Strict top-level whitelist, no omniscient fields.
              const v=copy(input),prior=this.last;
              if(prior){
                assert(v.visible_protocol.length>=prior.visible_protocol.length,'public history truncated');
                assert.deepEqual(v.visible_protocol.slice(0,prior.visible_protocol.length),prior.visible_protocol,
                  'public history changed retroactively');
                assert(v.turn>=prior.turn,'public turn regressed');
              }
              const delta=prior?v.visible_protocol.slice(prior.visible_protocol.length):[];
              const names=publicMoveEvents(delta);
              const updated=bayesUpdate(this.posterior,names,this.dex);
              // Atomic commit after all validation. Never retain caller-owned mutable references.
              this.posterior=updated;this.last=v;
              const record={checkpoint:this.trace.length,turn:v.turn,observation_sha256:sha(v),
                publicly_seen_moves:names,...summary(updated)};
              this.trace.push(record);
              return copy(record);
            }
          }
          function makeBattle(format,t){
            const b=new Battle({formatid:format.id,seed:SEED,strictChoices:true,
              p1:{name:'Public-P1',team:t.p1},p2:{name:'Public-P2',team:t.p2}});
            assert.equal(b.requestState,'teampreview');
            b.makeChoices('team 456','team 456');
            assert.equal(b.requestState,'move');
            assert.equal(b.p2.active[0].name,'Target4');
            return b;
          }
          function runWorld(format,dex,v){
            const b=makeBattle(format,v.teams),belief=new PublicBelief(dex);
            const capture=()=>{
              const input=copy(viewer(b,'p1'));
              const hash=sha(input);
              const result=belief.observe(input);
              assert.equal(sha(input),hash,'public input mutated by inference');
              return result;
            };
            capture();
            for(const choices of PREFIX){
              assert.equal(b.requestState,'move');
              b.makeChoices(...choices);
              capture();
            }
            assert.equal(b.turn,5,'shared-prefix turn count changed');
            const before=belief.trace.at(-1);
            assert.equal(before.worlds,6,'non-revealing actions illegally eliminated candidates');
            assert.equal(before.by_item.none,ITEM_PRIOR['']);
            assert.equal(before.by_item.sitrusberry,ITEM_PRIOR.sitrusberry);
            assert(Math.abs(before.by_move.swordsdance-MOVE_PRIOR.swordsdance)>1e-4,
              'common action likelihoods failed to update move probability');
            const beforePrediction=copy(before.next_action_prediction);
            b.makeChoices('move 3','move 1');
            const reveal=capture();
            assert.equal(reveal.publicly_seen_moves.length,1);
            assert.equal(reveal.publicly_seen_moves[0],dex.moves.get(v.move).name,
              'incorrect publicly announced move');
            assert.equal(reveal.worlds,2,'revealed move did not reduce six hypotheses to two');
            assert.equal(reveal.by_move[v.move],1,'revealed move posterior not one');
            assert.equal(reveal.by_item.none,ITEM_PRIOR[''],'unseen held item was inferred');
            assert.equal(reveal.by_item.sitrusberry,ITEM_PRIOR.sitrusberry);
            assert.deepEqual(belief.trace.map(x=>x.checkpoint),[0,1,2,3,4,5]);
            const hypothetical=NEXT_ACTION[v.move];
            for(const k of ACTIONS)assert(Math.abs(reveal.next_action_prediction[k]-hypothetical[k])<1e-11);
            assert.notDeepEqual(beforePrediction,reveal.next_action_prediction,
              'revealed move did not change forecast');
            return {id:v.id,secret_move_for_offline_audit:v.move,secret_item_for_offline_audit:v.item,
              timeline:belief.trace,pre_reveal_hash:before.observation_sha256,
              pre_reveal_forecast:beforePrediction,post_reveal_forecast:reveal.next_action_prediction};
          }
          function failClosedControls(format,dex,v){
            const b=makeBattle(format,v.teams),obs=copy(viewer(b,'p1'));
            const rejects=(corrupt,pattern)=>{
              const model=new PublicBelief(dex);model.observe(obs);
              const saved=sha({posterior:model.posterior,last:model.last,trace:model.trace});
              assert.throws(()=>model.observe(corrupt),pattern);
              assert.equal(sha({posterior:model.posterior,last:model.last,trace:model.trace}),saved,
                'invalid observation mutated inference state');
            };
            rejects({...obs,prng:b.prng.getSeed()},/shape violation/);
            rejects({...obs,opponent_hidden_item:'sitrusberry'},/shape violation/);
            rejects({...obs,battle:b.toJSON()},/shape violation/);
            rejects({...obs,visible_protocol:['|forged|']},/history changed retroactively/);
            rejects({...obs,visible_protocol:[...obs.visible_protocol,'|move|p2a: Target4|Solar Beam|']},/unsupported or impossible/);
            rejects({...obs,visible_protocol:[...obs.visible_protocol,'|move|p2a: Target4|Protect|','|move|p2a: Target4|Endure|']},/more than one/);
            const model=new PublicBelief(dex),owned=copy(obs);
            model.observe(owned);
            owned.visible_protocol.push('|forged|');
            assert.equal(model.last.visible_protocol.length,obs.visible_protocol.length,'caller mutated internal state');
            return {injected_rng_rejected:true,injected_item_rejected:true,injected_full_battle_rejected:true,
              retroactive_history_rejected:true,unsupported_move_rejected:true,duplicate_move_rejected:true,
              caller_mutation_isolated:true};
          }
          function run(){
            const {format,dex,cases}=makeVariants();
            for(const move of MOVES){
              assert(Math.abs(Object.values(NEXT_ACTION[move]).reduce((s,p)=>s+p,0)-1)<1e-12);
              assert(Object.values(NEXT_ACTION[move]).every(p=>p>0));
              assert(Object.values(COMMON_LIKELIHOOD[move]).every(p=>p>0&&p<=1));
            }
            assert.equal(initialBelief().length,6);
            const a=cases.map(v=>runWorld(format,dex,v));
            const b=cases.map(v=>runWorld(format,dex,v));
            assert.deepEqual(a,b,'same-seed independent belief trace differs');
            const baseline=a[0].timeline.slice(0,5).map(x=>x.observation_sha256);
            for(const world of a){
              assert.deepEqual(world.timeline.slice(0,5).map(x=>x.observation_sha256),baseline,
                'nonpublic hidden variant affected pre-reveal public observation');
              assert.deepEqual(world.timeline.slice(0,5).map(x=>x.posterior),a[0].timeline.slice(0,5).map(x=>x.posterior),
                'nonpublic hidden variant affected pre-reveal posterior');
              assert.deepEqual(world.timeline.slice(0,5).map(x=>x.next_action_prediction),
                a[0].timeline.slice(0,5).map(x=>x.next_action_prediction),
                'nonpublic hidden variant affected pre-reveal action forecast');
              assert(world.timeline.every(x=>Math.abs(Object.values(x.next_action_prediction).reduce((s,p)=>s+p,0)-1)<1e-9));
            }
            for(const move of MOVES){
              const siblings=a.filter(x=>x.secret_move_for_offline_audit===move);
              assert.equal(siblings.length,2);
              assert.deepEqual(siblings[0].timeline[5].posterior,siblings[1].timeline[5].posterior,
                'unrevealed item changed posterior');
              assert.deepEqual(siblings[0].post_reveal_forecast,siblings[1].post_reveal_forecast,
                'unrevealed item changed action prediction');
            }
            assert.equal(new Set(a.map(x=>sha(x.post_reveal_forecast))).size,3,
              'predictions did not distinguish three revealed move categories');
            const negatives=failClosedControls(format,dex,cases[0]);
            const cert={native33:'0/33',exact34:'0/34',actual_game:'0/30',stage15_formal_increment:0,
              gate:'DENY_FORMAL_CERTIFICATION'};
            const receipt={schema:'TRUE_PLAN_R2724_PUBLIC_BAYES_FORECAST_V1',status:'PASS_PUBLIC_SYNTHETIC_ONLY',
              pinned_showdown_commit:PIN,format:format.name,model_kind:'HAND_PARAMETERIZED_UNTRAINED_BAYES_BASELINE',
              hidden_hypotheses:6,shared_prefix_turns:4,public_observation_checkpoints:5,
              posterior_checkpoints_including_reveal:6,observed_worlds:6,
              prior_move_probabilities:MOVE_PRIOR,prior_item_probabilities:ITEM_PRIOR,
              pre_reveal_six_positive_candidates:true,post_reveal_two_positive_candidates:true,
              item_marginal_unchanged:true,pre_reveal_noninterference:true,
              next_action_categories:ACTIONS,distinct_post_reveal_forecasts:3,
              negative_controls_passed:Object.keys(negatives).length,
              independent_same_seed_replay:true,
              limitations:['hand-selected prior and likelihood tables, NOT learned or empirically calibrated',
                'forecasts are illustrative hypothetical action categories, not measured opponent performance',
                '6 scripted legal hidden worlds and one chosen four-turn sequence',
                'only one opponent active actor and one reveal event supported',
                'no general opponent belief engine or strategy optimization certification',
                'not Pokemon Champions native game verification'],certification:cert};
            return {receipt,worlds:a,negative:negatives,model_tables:{move_prior:MOVE_PRIOR,
              item_prior:ITEM_PRIOR,common_move_likelihood:COMMON_LIKELIHOOD,next_action_given_hidden_move:NEXT_ACTION}};
          }
          function main(){
            const r=run(),out=path.resolve(process.argv[2]||'r2724-evidence');
            fs.mkdirSync(out,{recursive:true});
            const put=(name,object)=>fs.writeFileSync(path.join(out,name),JSON.stringify(object,null,2)+'\n');
            put('six-worlds-probabilistic-belief-and-forecast.json',r.worlds);
            put('negative-controls-public-only.json',r.negative);
            put('untrained-priors-likelihoods.json',r.model_tables);
            put('r2724-receipt.json',r.receipt);
            console.log('R2724_PUBLIC_RESULT '+JSON.stringify(r.receipt));
          }
          if(require.main===module)main();
          module.exports={PublicBelief,initialBelief,bayesUpdate,predictNext,publicMoveEvents,run};
          R2724_SOURCE
          printf '%s  %s\n' 'f1594fca082fc9e22b69d0f3ced148e685454879fa68a444a62e1e67e580e733' ./r2724-bayesian-belief-action-forecast.cjs | sha256sum -c -
          node --check ./r2724-bayesian-belief-action-forecast.cjs
          node ./r2724-bayesian-belief-action-forecast.cjs ./r2724-evidence | tee ./r2724-console.log
          cp ./r2720-faint-force-switch-win.cjs ./r2724-evidence/
          cp ./r2722-rng-observation-boundaries.cjs ./r2724-evidence/
          cp ./r2723-multiturn-belief-boundaries.cjs ./r2724-evidence/
          cp ./r2724-bayesian-belief-action-forecast.cjs ./r2724-evidence/
      - name: Audit probabilistic evidence and SHA-256
        shell: bash
        working-directory: ${{ runner.temp }}/showdown
        run: |
          set -euo pipefail
          python3 - <<'PY_AUDIT'
          from pathlib import Path
          import json,hashlib
          p=Path('r2724-evidence')
          expected={'r2720-faint-force-switch-win.cjs','r2722-rng-observation-boundaries.cjs',
            'r2723-multiturn-belief-boundaries.cjs','r2724-bayesian-belief-action-forecast.cjs',
            'six-worlds-probabilistic-belief-and-forecast.json','negative-controls-public-only.json',
            'untrained-priors-likelihoods.json','r2724-receipt.json'}
          assert {x.name for x in p.iterdir()}==expected
          total=sum(x.stat().st_size for x in p.iterdir())
          assert 0<total<=8*1024*1024
          assert hashlib.sha256((p/'r2720-faint-force-switch-win.cjs').read_bytes()).hexdigest()=='2886cc68cc71f866bffb775c5c42d51d9d23eebf3136c9dcb399a610e8387f4b'
          assert hashlib.sha256((p/'r2722-rng-observation-boundaries.cjs').read_bytes()).hexdigest()=='0a4fe39d6e1f3ac1c208171b3c38c9d19a388d618baf1b4bfeab78e1c24b8d7e'
          assert hashlib.sha256((p/'r2723-multiturn-belief-boundaries.cjs').read_bytes()).hexdigest()=='fed3b7e13eb09f0ffd2bfcb6fb8497ac39da502781994c56c16dbb846a566c49'
          assert hashlib.sha256((p/'r2724-bayesian-belief-action-forecast.cjs').read_bytes()).hexdigest()=='f1594fca082fc9e22b69d0f3ced148e685454879fa68a444a62e1e67e580e733'
          receipt=json.loads((p/'r2724-receipt.json').read_text())
          worlds=json.loads((p/'six-worlds-probabilistic-belief-and-forecast.json').read_text())
          negatives=json.loads((p/'negative-controls-public-only.json').read_text())
          model=json.loads((p/'untrained-priors-likelihoods.json').read_text())
