name: R995 recorded battle and readout diagnostics
'on':
  push:
    branches:
      - r987-ocr-pc-regression
    paths:
      - .github/workflows/r995-device-readout-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && !github.event.repository.private && github.ref == 'refs/heads/r987-ocr-pc-regression'
    runs-on: macos-26
    timeout-minutes: 32
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: .github/workflows/r995-device-readout-regression.yml
    - name: Restore the verified R993 and R994 source and apply the R995 fixes
      shell: bash
      run: |
        set -euo pipefail
        artifact="$RUNNER_TEMP/r994"
        mkdir -p "$artifact"
        git show 'da2c77791ce9a3cf918c607422a6a51745962c0f:.github/workflows/r994-device-turn1-regression.yml' > "$artifact/r994-pinned.yml"
        echo 'c6a4d9b3bf2cc266996c81fcac91cd99f473041e07d0fb40d473e80d92c5743d  r994-pinned.yml' | (cd "$artifact" && shasum -a 256 -c -)
        ruby -ryaml -e '
          steps = YAML.load_file(ARGV[0], aliases: true).fetch("jobs").fetch("verify").fetch("steps")
          puts steps.find { |step| step["name"] == "Restore the exact R993 source and apply the readout patch" }.fetch("run")
        ' "$artifact/r994-pinned.yml" > "$artifact/r994-restore.sh"
