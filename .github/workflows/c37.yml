name: R1037 C37 alias regression + foreground transfer UI (NO IPA)
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/c37.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    name: ${{ matrix.job }}
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
        - job: macos-source
          os: xcode-27
        - job: windows-cli
          os: windows-2025
        - job: windows-receiver
          os: windows-2025
        - job: macos-sender
          os: xcode-27
        - job: windows-hud
          os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
    - name: Run C35 with C36 regression and C37 foreground transfer
      shell: bash
      env:
        C33_JOB: ${{ matrix.job }}
        GH_TOKEN: ${{ github.token }}
        PYTHONUTF8: '1'
      run: |
        set -Eeuo pipefail
        if [[ "$RUNNER_OS" == Windows ]]; then PY=python; else PY=python3; fi
        "$PY" - <<'C37_PY'
        import hashlib,urllib.request,pathlib
        url='https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/293d5d4d1c8a10c56258b2b30c0822e12bf137c2/.github/workflows/c35.yml'
        with urllib.request.urlopen(url,timeout=60) as r:raw=r.read(50000)
        assert hashlib.sha256(raw).hexdigest()=='5c9d7b79f6fb76ae93c09b8fe93f34ec7992380ae60690f6f4e174ad2ed6ad2e'
        body=raw.decode().split("        \"$PY\" - <<'C35_PY'\n",1)[1].split('\n        C35_PY',1)[0]
        code='\n'.join(l[8:] for l in body.splitlines())+'\n'
        assert hashlib.sha256(code.encode()).hexdigest()=='eb743291f249fce59193d3cf02a35917c313fbde3df2a3fc66fdeecf68be83d9'
        marker="runner=tmp/'c35-runner.py'";assert code.count(marker)==1
        helper='import pathlib,hashlib,base64,zlib\nq=root/\'c33-patch.py\'\nb=q.read_bytes();assert hashlib.sha256(b).hexdigest()==\'d55fd7398d3402dadec31ea88bc24f99cd82918bab803e0fe96431cec182c703\'\ns=b.decode();marker="pathlib.Path(\'test_c33.py\').write_bytes(test)"\nassert s.count(marker)==1\ns=s.replace(marker,marker+"\\n"+"test=zlib.decompress(base64.b64decode(\'\'));assert h(test)==\'628362bd54c735be1bb535546cb873fe1dcc3c3b3550c9554865d153b49d0011\';pathlib.Path(\'test_c33.py\').write_bytes(test)")\ns=s.replace("\'Ran 4 tests\'","\'Ran 7 tests\'").replace("\'FAILED (failures=3)\'","\'FAILED (failures=6)\'")\nanchor=\'new=zlib.decompress\';assert s.count(anchor)==1\ns=s.replace(anchor,"assert \'fault injection did not execute\' not in r.stderr\\nfor n in (\'alias_head\',\'alias_status\',\'alias_ack\'):assert \'FAIL: test_c36_\'+n in r.stderr\\n"+anchor)\nassert hashlib.sha256(s.encode()).hexdigest()==\'c7bb2d7f9032c09736410901d585205f64196d3dd4bb4c69743b46db63fb7017\'\nq.write_bytes(s.encode())\n'
        insert="anchor='for i,(name,shell,extra,run) in enumerate(rows):';assert code.count(anchor)==1\ncode=code.replace(anchor,"+repr(helper)+"+anchor)\n"
        code=code.replace(marker,insert+marker)
        import os,base64,zlib
        patch=zlib.decompress(base64.b64decode(''));assert hashlib.sha256(patch).hexdigest()=='65cb4ecfd2fa763d5c54d85d04ce7ad0e1b5962cb8b46ee769f8e072ba41526f'
        (pathlib.Path(os.environ['RUNNER_TEMP'])/'c37.py').write_bytes(patch)
        marker="runner=tmp/'c35-runner.py'";assert code.count(marker)==1
        extra="anchor=\"    f=root/('c33-step-'\";assert code.count(anchor)==1\ncode=code.replace(anchor,"+repr('    if job==\'macos-sender\':\n        mark=\'SDK="$(xcrun --sdk iphoneos --show-sdk-path)"\'\n        assert run.count(mark)==1\n        run=run.replace(mark,\'python3 "$RUNNER_TEMP/c37.py" sender .\\n\'+mark)\n    if job==\'macos-source\' and i==13:\n        mark=\'root="$RUNNER_TEMP/c6-objects/pinned-r793/source"\\n\'\n        assert run.count(mark)==1\n        run=run.replace(mark,mark+\'python3 "$RUNNER_TEMP/c37.py" native "$root"\\n\')\n')+"+anchor)\n"
        code=code.replace(marker,extra+marker)
        exec(compile(code,'pinned-c35-bootstrap','exec'))
        C37_PY
  gate:
    needs:
    - verify
    if: always() && github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
    - name: 'Gate: every automated job must pass; no IPA or physical certification'
      shell: bash
      run: |
        set -Eeuo pipefail
        [[ '${{ needs.verify.result }}' == success ]]
        echo C37_AUTOMATED_GATE_PASS_UI_BACKGROUND_PHYSICAL_IPA_HOLD
