name: R940 ZIP verification recovery and verified device-test IPA
'on':
  push:
    branches:
    - r938-export-recovery
    paths:
    - .github/workflows/r940.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: r940-save-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: R940 ${{ matrix.suite }}
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
        - suite: iphone
          runner: xcode-27
        - suite: large
          runner: macos-26
        - suite: full
          runner: macos-26
        - suite: vision
          runner: macos-26
        - suite: sim
          runner: xcode-27
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
    - &id001
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: .github/workflows/r940.yml
    - &id002
      name: Restore the exact verified R939 source
      shell: bash
      run: |
        set -euo pipefail
        git show 6c3f81f9eb9118587e13fac6580784cc60ec7c4f:.github/workflows/r939.yml > "$RUNNER_TEMP/r939-base.yml"
        for n in 1 2; do
          ruby -ryaml -e 'puts YAML.load_file(ARGV[0], aliases: true).fetch("jobs").fetch("verify").fetch("steps").fetch(ARGV[1].to_i).fetch("run")' "$RUNNER_TEMP/r939-base.yml" "$n" > "$RUNNER_TEMP/r939-restore.sh"
          bash "$RUNNER_TEMP/r939-restore.sh"
        done
    - &id003
