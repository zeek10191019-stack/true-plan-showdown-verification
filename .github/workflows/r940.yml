    - name: All existing Swift, Python and 79-field checks
      if: matrix.suite == 'full'
      shell: bash
      run: |
        set -euo pipefail
        ruby -ryaml -e 'puts YAML.load_file(ARGV[0]).fetch("jobs").fetch("verify").fetch("steps").fetch(42).fetch("run").gsub("R918", "R920").gsub("729 tests, with 0 failures", "731 tests, with 0 failures").gsub("VERIFIED\x27,729,0", "VERIFIED\x27,731,0")' pinned-r918/.github/workflows/r918.yml > "$RUNNER_TEMP/r920-full.sh"
        bash "$RUNNER_TEMP/r920-full.sh"
        node pinned-r793/source/tools/tests/test_r920_pc_display.mjs
    - name: Replay real images and test ROI and identity gates
      if: matrix.suite == 'vision'
      shell: bash
      run: |
        export DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
        set -euo pipefail
        for step in 42 43 44; do
          ruby -ryaml -e 'puts YAML.load_file(ARGV[0]).fetch("jobs").fetch("verify").fetch("steps").fetch(ARGV[1].to_i).fetch("run").gsub("R918", "R920").gsub(ARGV[2], ARGV[3])' pinned-r918/.github/workflows/r918_inspection_pixels.yml "$step" '9d741abc9b4f32ebd5df90086c73b1a1387ef2106b4bf5fc6326b8cad6fcfcc2' '2a60e5e05f9d9f4bcc09c3273f758c254994709dd5b96f94a5ba3812c22a90a9' > "$RUNNER_TEMP/r920-replay.sh"
          if [[ "$step" == 43 ]]; then python3 r937-tests/vision_witness.py "$RUNNER_TEMP/r920-replay.sh"; fi
          bash "$RUNNER_TEMP/r920-replay.sh"
        done
    - name: Compile the unsigned iPhoneOS arm64 target
      if: matrix.suite == 'iphone'
      shell: bash
      run: |-
        set -euo pipefail
