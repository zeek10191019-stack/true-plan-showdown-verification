      - name: "Verify all parts and restore pinned source and synthetic fixtures"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'RESTORE_PINNED_SOURCE'
          import base64,hashlib,io,lzma,tarfile
          from pathlib import Path,PurePosixPath
          folder=Path('.screen_read_ci_payload')
          expected=[f'part_{index:04d}.b64' for index in range(19)]
          assert sorted(p.name for p in folder.iterdir())==expected,'PAYLOAD_PART_SET'
          encoded=''.join((folder/name).read_text(encoding='ascii') for name in expected)
          data=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert len(data)==962560,'SOURCE_INPUT_SIZE'
          assert hashlib.sha256(data).hexdigest()=='fc1d8defdbdee4476333db2ade076d9b6171807ec7bb151dc646895cc2b02d5b','SOURCE_INPUT_SHA256'
          root=Path.cwd().resolve()
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:') as archive:
              members=archive.getmembers();seen=set()
              for member in members:
                  path=PurePosixPath(member.name)
                  assert member.name and not path.is_absolute() and '..' not in path.parts,'UNSAFE_SOURCE_PATH'
                  assert path.as_posix()==member.name and '\\' not in member.name,'NONCANONICAL_SOURCE_PATH'
                  target=(root/member.name).resolve()
                  assert target.is_relative_to(root) and target!=root,'SOURCE_PATH_ESCAPE'
                  assert member.isfile() and 0<=member.size<200000,'SOURCE_MEMBER_TYPE_OR_SIZE'
                  assert member.name.casefold() not in seen,'DUPLICATE_SOURCE_PATH'
                  seen.add(member.name.casefold())
              for member in members:
                  target=root/member.name;target.parent.mkdir(parents=True,exist_ok=True)
                  with target.open('xb') as stream:stream.write(archive.extractfile(member).read())
          assert len(list(Path('app/ios/ChampionsOnDevice').glob('*.swift')))==99,'SWIFT_SOURCE_COUNT'
          print('R554_SOURCE_INPUT_SHA256=fc1d8defdbdee4476333db2ade076d9b6171807ec7bb151dc646895cc2b02d5b; NO_PRIVATE_CAPTURES')
          RESTORE_PINNED_SOURCE
      - name: "Run native regressions, independent verifier and iPhoneOS Xcode build"
        shell: bash
        run: |
          python3 tools/run_macos_checks.py
      - name: "Return numerical and compiler evidence through logs (no artifacts/cache)"
        if: always()
        shell: bash
        run: |
          python3 - <<'REPORT_EVIDENCE'
          from pathlib import Path
          import base64,hashlib,io,json,zipfile
          root=Path('reports');blob=io.BytesIO()
          with zipfile.ZipFile(blob,'w',compression=zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.glob('*')):
                  if p.suffix in ('.json','.log') and p.stat().st_size<2000000:
                      z.write(p,p.name)
          data=blob.getvalue();encoded=base64.b85encode(data).decode()
          print('R554_REPORT_B85_BEGIN',hashlib.sha256(data).hexdigest(),len(data))
          for i in range(0,len(encoded),500):print('R554_REPORT_B85',encoded[i:i+500])
          print('R554_REPORT_B85_END')
          p=root/'R554_MACOS_CHECKS.json'
          if p.is_file():print(p.read_text())
          REPORT_EVIDENCE
