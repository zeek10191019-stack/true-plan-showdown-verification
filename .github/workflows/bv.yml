    - name: Run R635 R634 R581 and native Apple contract tests
      shell: bash
      run: |
        set -euo pipefail
        swiftc -parse-as-library \
         app/ios/ChampionsOnDevice/R581ReadabilityCoverage.swift \
         app/ios/ChampionsOnDevice/R634FieldEvidenceRouting.swift \
         app/ios/ChampionsOnDevice/R635LayoutToFields.swift \
         tests/R635LayoutHarness.swift -o "$RUNNER_TEMP/r635"
        "$RUNNER_TEMP/r635"
        swiftc -parse-as-library \
         app/ios/ChampionsOnDevice/R581ReadabilityCoverage.swift \
         app/ios/ChampionsOnDevice/R634FieldEvidenceRouting.swift \
         tests/R634FieldRoutingHarness.swift -o "$RUNNER_TEMP/r634"
        "$RUNNER_TEMP/r634"
        swiftc -parse-as-library \
         app/ios/ChampionsOnDevice/R581ReadabilityCoverage.swift \
         tests/R581CoverageHarness.swift -o "$RUNNER_TEMP/r581"
        "$RUNNER_TEMP/r581"
        swiftc -frontend -parse app/ios/ChampionsOnDevice/*.swift
        python3 tools/run_r571_native.py
    - name: Publish only fully checked isolated R635 source branch
      shell: bash
      run: |
        set -euo pipefail
        branch=r635-layout-field-evidence
        if git ls-remote --exit-code --heads origin \
         "refs/heads/$branch" >/dev/null 2>&1; then
         echo 'Branch already exists. Overwrite forbidden.' >&2
         exit 1
        fi
        git checkout -b "$branch"
        git add -- \
         app/ios/ChampionsOnDevice/R635LayoutToFields.swift \
         app/ios/ChampionsOnDevice/CaptureCoordinator.swift \
         app/ios/ChampionsOnDevice/R576OfflinePNGInspector.swift \
         app/ios/ChampionsOnDevice/R634FieldEvidenceRouting.swift \
         tests/R635LayoutHarness.swift \
         tests/R634FieldRoutingHarness.swift \
         schema fixtures source
        python3 - <<'PYSTAGE'
        import subprocess
        f=set(subprocess.check_output(
         ['git','diff','--cached','--name-only'],text=True).splitlines())
        required={'app/ios/ChampionsOnDevice/R635LayoutToFields.swift',
         'app/ios/ChampionsOnDevice/CaptureCoordinator.swift',
         'app/ios/ChampionsOnDevice/R576OfflinePNGInspector.swift',
         'app/ios/ChampionsOnDevice/R634FieldEvidenceRouting.swift',
         'tests/R635LayoutHarness.swift','tests/R634FieldRoutingHarness.swift'}
        assert required<=f,('MISSING_READER_CODE',required-f)
        assert all(x in required or x.startswith(
         ('schema/','fixtures/','source/')) for x in f), (
         'UNEXPECTED_STAGED_FILE',f-required)
        print('R635_STAGE_SOURCE_AND_PREREQUISITES',len(f))
        PYSTAGE
        git config user.name 'github-actions[bot]'
        git config user.email \
         '41898282+github-actions[bot]@users.noreply.github.com'
        git commit -m 'R635: image bound 79 field and layout evidence wiring'
        git push origin "HEAD:refs/heads/$branch"
