name: R1024 C25 Lenovo R714 resumable recovery (NO IPA)
'on':
  push:
    branches: [main]
    paths: [.github/workflows/r1020-c22-r714-recovery.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-recovery:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Verify exact recovery tool and test interruption and resume on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import base64,hashlib,io,zipfile,pathlib
          raw=base64.b64decode("",validate=True)
          assert hashlib.sha256(raw).hexdigest()=="81fe88f913cc07029859c0e6f5fd72f3a2abac35e7193c10155900122abd08f6"
          root=pathlib.Path("c25-recovery");root.mkdir(exist_ok=False)
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
           assert set(z.namelist())=={'large_resume_test.py', 'test_recover_r714.py', 'test_resume_r714.py', 'recover_r714.py', 'README_JA.txt', 'RECOVER_R714.cmd'} and z.testzip() is None
           for name in z.namelist(): (root/name).write_bytes(z.read(name))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'C25_EXTRACT_FAILED' }
          Set-Location c25-recovery
          @'
          import base64,zlib,hashlib,pathlib,shutil,tempfile,subprocess,sys
          old=zlib.decompress(base64.b64decode(""))
          assert hashlib.sha256(old).hexdigest()=="f2421531bde0cd79dc1034e0181f7c03a094fcb326edfbd59c06e268971a1233"
          with tempfile.TemporaryDirectory() as td:
           d=pathlib.Path(td)
           for name in ('test_recover_r714.py','test_resume_r714.py'):shutil.copyfile(name,d/name)
           (d/'recover_r714.py').write_bytes(old)
           r=subprocess.run([sys.executable,'-m','unittest','-v','test_resume_r714.ResumeTests.test_process_death_after_atomic_publish'],cwd=d,capture_output=True,text=True,encoding='utf-8',errors='replace')
           print(r.stdout,r.stderr)
           assert r.returncode != 0 and 'Output already exists; no overwrite' in r.stderr,'C25_BASELINE_NOT_REPRODUCED'
          print('C25_BASELINE_REPRODUCED')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'C25_BASELINE_FAILED' }
          python -m unittest -v test_recover_r714 test_resume_r714
          if ($LASTEXITCODE -ne 0) { throw 'C25_TEST_FAILED' }
          python large_resume_test.py
          if ($LASTEXITCODE -ne 0) { throw 'C25_LARGE_RESUME_FAILED' }
          $env:TRUEPLAN_CI = '1'
          & cmd.exe /d /c 'RECOVER_R714.cmd --help'
          if ($LASTEXITCODE -ne 0) { throw 'C25_LAUNCHER_FAILED' }
          Write-Output 'C25_RESUME_WINDOWS_SYNTHETIC_PASS_NOT_PHYSICAL_NOT_IPA'
