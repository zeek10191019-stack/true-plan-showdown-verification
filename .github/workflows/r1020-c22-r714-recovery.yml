name: R1020 C22 Lenovo R714 split recovery regression (NO IPA)
on:
  push:
    branches: [main]
    paths: [.github/workflows/r1020-c22-r714-recovery.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-recovery:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Verify embedded recovery tool and test on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import base64,hashlib,io,zipfile,pathlib
          raw=base64.b64decode("",validate=True)
          assert hashlib.sha256(raw).hexdigest()=="fff8bf2328b854dfd9a37d0fcc9da1d89aa20d099bf5fbb98675e00b2b96ed64"
          root=pathlib.Path("c22-recovery");root.mkdir(exist_ok=False)
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
           assert set(z.namelist())=={'RECOVER_R714.cmd', 'recover_r714.py', 'test_recover_r714.py'} and z.testzip() is None
           for name in z.namelist(): (root/name).write_bytes(z.read(name))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'C22_EXTRACT_FAILED' }
          Set-Location c22-recovery
          python -m unittest -v test_recover_r714
          if ($LASTEXITCODE -ne 0) { throw 'C22_TEST_FAILED' }
          $env:TRUEPLAN_CI = '1'
          & cmd.exe /d /c 'RECOVER_R714.cmd --help'
          if ($LASTEXITCODE -ne 0) { throw 'C22_LAUNCHER_FAILED' }
          Write-Output 'C22_SPLIT_RECOVERY_SYNTHETIC_PASS_NOT_PHYSICAL_NOT_IPA'
