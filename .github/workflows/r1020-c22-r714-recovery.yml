name: R1022 C24 Lenovo R714 resumable recovery (NO IPA)
'on':
  push:
    branches: [main]
    paths: [.github/workflows/r1020-c22-r714-recovery.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-recovery:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Verify exact recovery tool and test interruption and resume on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import base64,hashlib,io,zipfile,pathlib
          raw=base64.b64decode("",validate=True)
          assert hashlib.sha256(raw).hexdigest()=="8e152705f2b83b0e88ac16639e9a28b5af7f9a4e6d4c53fcd4f437692097c466"
          root=pathlib.Path("c24-recovery");root.mkdir(exist_ok=False)
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
           assert set(z.namelist())=={'large_resume_test.py', 'test_recover_r714.py', 'test_resume_r714.py', 'recover_r714.py', 'README_JA.txt', 'RECOVER_R714.cmd'} and z.testzip() is None
           for name in z.namelist(): (root/name).write_bytes(z.read(name))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'C24_EXTRACT_FAILED' }
          Set-Location c24-recovery
          python -m unittest -v test_recover_r714 test_resume_r714
          if ($LASTEXITCODE -ne 0) { throw 'C24_TEST_FAILED' }
          python large_resume_test.py
          if ($LASTEXITCODE -ne 0) { throw 'C24_LARGE_RESUME_FAILED' }
          $env:TRUEPLAN_CI = '1'
          & cmd.exe /d /c 'RECOVER_R714.cmd --help'
          if ($LASTEXITCODE -ne 0) { throw 'C24_LAUNCHER_FAILED' }
          Write-Output 'C24_RESUME_WINDOWS_SYNTHETIC_PASS_NOT_PHYSICAL_NOT_IPA'
