          path: pinned-r858
          sparse-checkout: .github/workflows/r858.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 4237051c12961070a892917b0a8fde9a709172f9
          path: pinned-r859
          sparse-checkout: .github/workflows/r859.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Restore exact passing R859 and require committed OCR receipts
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e 'puts YAML.load_file(ARGV[0]).fetch("jobs").fetch("verify").fetch("steps").fetch(17).fetch("run")' pinned-r859/.github/workflows/r859.yml > "$RUNNER_TEMP/restore_r859.sh"
          bash "$RUNNER_TEMP/restore_r859.sh"
          python3 - <<'PYCODE'
          from pathlib import Path
          import json,hashlib,base64,lzma
          s=Path('pinned-r793/source');sha=lambda b:hashlib.sha256(b).hexdigest()
          def disk():return {str(p.relative_to(s)):p for p in s.rglob('*') if p.is_file() and not {'.build','.swiftpm','__pycache__'}.intersection(p.parts)}
          def tree(fs):return sha(''.join(n+'\t'+sha(fs[n].read_bytes())+'\n' for n in sorted(fs)).encode())
          fs=disk();assert len(fs)==655 and tree(fs)=='75506d42e381e86bfc544d09f579a75c747c1bb14c439274c0e6d138d164529d'
          m=json.loads((s/'source_manifest.json').read_text());assert all(sha(fs[n].read_bytes())==h for n,h in m.items())
          d=json.loads(lzma.decompress(base64.b64decode('')))
          for n,v in sorted(d.items(),key=lambda item:'copy' in item[1]):
           p=s/n;assert not Path(n).is_absolute() and '..' not in Path(n).parts
           if v['old'] is None:
            assert not p.exists()
            if 'copy' in v:
             original=s/v['copy'];assert not Path(v['copy']).is_absolute() and '..' not in Path(v['copy']).parts
             assert sha(original.read_bytes())==v['source_sha']
             b=v['prefix'].encode()+original.read_bytes()+v['suffix'].encode()
            else:b=v['text'].encode()
           else:
            assert sha(p.read_bytes())==v['old']==m[n]
            lines=p.read_text().splitlines(keepends=True)
            for i,j,t in reversed(v['edits']):lines[i:j]=[t]
            b=''.join(lines).encode()
           assert sha(b)==v['new'];p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b);m[n]=v['new']
          (s/'source_manifest.json').write_text(json.dumps(m,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          fs=disk();assert len(fs)==658 and set(fs)==set(m)|{'source_manifest.json'}
          assert all(sha(fs[n].read_bytes())==h for n,h in m.items())
          assert tree(fs)=='1ba94539fa012437ef91b574a62ae0308c28c0279cbaab4aeeb54179e8117dfd'
          Path('R834Proof/SOURCE_TREE_SHA256.txt').write_text(tree(fs)+'\n')
          print('R861_SOURCE_658_VERIFIED',tree(fs))
          PYCODE
          python3 pinned-r793/source/tools/r852_preflight_wiring.py
      - name: Full 688 Swift regressions durable receipt failures and strict latency
        if: matrix.lane == 'real-apple-vision'
        shell: bash
        run: |
          set -euo pipefail
          trap 'grep -E "R859_.*ROWS|R854_CAPTURE_STAGE|R858_FULL_PIPELINE_STAGES|R859_ORIGINAL_SPLIT_BOUNDED_STATUS" R834Proof/Swift.log || true' EXIT
          ruby -ryaml -e 'puts YAML.load_file(ARGV[0]).fetch("jobs").fetch("verify").fetch("steps").fetch(8).fetch("run").gsub("652 tests","688 tests")' pinned-r845/.github/workflows/r845.yml > "$RUNNER_TEMP/r861_swift.sh"
          bash "$RUNNER_TEMP/r861_swift.sh"
          
          grep -F "R852_CVPIXELBUFFER_PNG_FSYNC_PIXEL_OCR_STATE_MAIN_MS" R834Proof/Swift.log
          grep -F "R852_31_RETAINED_FRAMES_RELAUNCH_ZIP_READBACK_NO_OCR_PASS" R834Proof/Swift.log
          
          grep -F "R854_LOSSLESS_PNG_REUSED_IMAGE_EXACT_PIXEL_READBACK_PASS" R834Proof/Swift.log
          grep -F "R854_CAPTURE_STAGE" R834Proof/Swift.log
          
          grep -F "R855_FAST_PNG_ICC_ALPHA_STRIDE_IMAGEIO_READBACK_PASS" R834Proof/Swift.log
          
          grep -F "R857_EXPLICIT_SRGB_PREVIOUS_PNG_ALL_PIXELS_EXACT_PASS" R834Proof/Swift.log
          
          grep -F "R859_ORIGINAL_SPLIT_BOUNDED_STATUS" R834Proof/Swift.log
          grep -F "R858_FULL_PIPELINE_STAGES" R834Proof/Swift.log
          
          grep -F "R861_DURABLE_OCR_RECEIPTS_FILE_ROUNDTRIP_PASS" R834Proof/Swift.log
          grep -F "R861_UNWRITTEN_COMPLETION_CANNOT_REACH_CURRENT_HP_PASS" R834Proof/Swift.log
      - name: iPhoneOS production build version 861 NO IPA
        if: matrix.lane == 'iphoneos-compile'
        shell: bash
        run: |
          set -euo pipefail
          python3 pinned-r793/source/tools/generate_xcode_project.py
          xcodebuild -project pinned-r793/source/app/ios/ChampionsOnDeviceResearch.xcodeproj -scheme ChampionsOnDeviceResearch -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO -derivedDataPath "$RUNNER_TEMP/r861_device" build > R834Proof/iPhoneOS.log 2>&1 || { grep -E 'error:|BUILD FAILED' R834Proof/iPhoneOS.log; exit 1; }
          grep -F 'BUILD SUCCEEDED' R834Proof/iPhoneOS.log
          python3 - <<'PY'
          import plistlib,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'r861_device/Build/Products/Debug-iphoneos/ChampionsOnDeviceResearch.app/Info.plist'
          d=plistlib.loads(p.read_bytes());assert d['CFBundleVersion']=='861' and d['CFBundleShortVersionString']=='0.8.61'
          print('R861_BUILT_IDENTITY_VERIFIED',d['CFBundleVersion'],d['CFBundleShortVersionString'])
          PY
      - name: Scope and source receipt
        if: always()
        shell: bash
        run: |
          if [ -f R834Proof/SOURCE_TREE_SHA256.txt ]; then cat R834Proof/SOURCE_TREE_SHA256.txt; fi
          echo 'NO IPA until both lanes pass. Actual iPhone continuity and LCD latency remain unverified.' >> "$GITHUB_STEP_SUMMARY"
