name: R483
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r483-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false && github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - name: Pinned R82 restore plus R483 ROI blocker audit and unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64,hashlib,os,re,subprocess,urllib.request,zlib
          url='https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/7a0b4cd7fc6e2c2c0f4f80bd251c6ce7f359b751/.github/workflows/R82.yml'
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'R483-Pinned'}),timeout=60) as reply:
              carrier=reply.read(18000)
          assert len(carrier)==12058,'FAIL_CLOSED: R82 source size'
          sha=hashlib.sha1(b'blob '+str(len(carrier)).encode()+b'\0'+carrier).hexdigest()
          assert sha=='660c4fb5f9126d89d453c284d19fba9bdb157b88','FAIL_CLOSED: R82 Git blob SHA'
          encoded=re.findall(rb"^            '([A-Za-z0-9+/=]+)'$",carrier,re.M)
          assert len(encoded)>5,'FAIL_CLOSED: missing carrier payload'
          stages=zlib.decompress(base64.b64decode(b''.join(encoded))).split(b'\0')
          assert len(stages)==3,'FAIL_CLOSED: expected three stages'
          sizes=[1754,8297,3050]
          hashes=['cd4212e875a8692d771bba10ddaf1f685f1a5f46b4de2b2bc2007ec3d5b79bda',
                  '520b4536172c93fc3ecd2b814fd67718b96271b72f61b19a729091ecd7f2c87f',
                  'f399bb371aab4aade40bfd9bd0fdb8d75e77883b9c1a8f9cd23d11fd6ec10f2b']
          for idx,b in enumerate(stages):
              assert len(b)==sizes[idx] and hashlib.sha256(b).hexdigest()==hashes[idx], 'FAIL_CLOSED: stage mismatch'
          for idx in (0,1):
              subprocess.run(['bash','-n'],input=stages[idx],check=True)
              subprocess.run(['bash','-e','-o','pipefail'],input=stages[idx],check=True)
              print('R483_BASE_STAGE_PASS='+str(idx+1),flush=True)
          source=Path('ios/ChampionsOnDevice/ResearchUnifiedTelemetryBundle.swift')
          assert hashlib.sha256(source.read_bytes()).hexdigest()=='eb8719822ac255769290b6b2a6cb29370e6788ab1a0462018ef69da8d7be6129','FAIL_CLOSED: R482 Swift base mismatch'
          fragment=zlib.decompress(base64.b64decode('',validate=True))
          assert hashlib.sha256(fragment).hexdigest()=='b1f023063d001b0fd7a4a38096584bfc61b442833f0e4b863066653a79b16805','FAIL_CLOSED: fragment bytes'
          needle='    // Call on the SAME serial capture queue that protects continuity and\n'
          s=source.read_text()
          assert s.count(needle)==1,'FAIL_CLOSED: code insert anchor'
          s=s.replace(needle,fragment.decode()+needle,1)
          old='                "keyed_readings_count": keyed,\n'
          assert s.count(old)==1,'FAIL_CLOSED: record insertion anchor'
          s=s.replace(old,old+'                "roi_binding_blockers": roiBindingBlockers(readings),\n',1)
          assert hashlib.sha256(s.encode()).hexdigest()=='5ee065484868c89d2fc1d7bf0da07d2373eb477fe98fbf052bb460d3f9335578','FAIL_CLOSED: R483 Swift patch SHA'
          source.write_text(s)
          verification=zlib.decompress(base64.b64decode('',validate=True))
          assert hashlib.sha256(verification).hexdigest()=='1a9e7df54acbbae49d23c0cd234958fdd9b76a30ab65588b7bad35beb9023625','FAIL_CLOSED: native test bytes'
          regression=Path(os.environ['RUNNER_TEMP'])/'r483_test.swift'
          regression.write_bytes(verification)
          # Swift compiler expects main.swift when executable source set is present.
          main=Path(os.environ['RUNNER_TEMP'])/'main.swift'
          main.write_bytes(verification)
          for label,actual in [('r483',main),('r482',Path('R482_NATIVE/main.swift'))]:
              assert actual.is_file(), 'FAIL_CLOSED: regression source missing'
              exe=Path(os.environ['RUNNER_TEMP'])/('test_'+label)
              subprocess.run(['swiftc','-O',str(source),str(actual),'-o',str(exe)],check=True)
              subprocess.run([str(exe)],check=True)
          assert len(list(Path('ios/ChampionsOnDevice').glob('*.swift')))==43,'FAIL_CLOSED: Swift source count'
          for file in sorted(Path('ios/ChampionsOnDevice').glob('*.swift')):
              subprocess.run(['swiftc','-frontend','-parse',str(file)],check=True)
          print('R483_SWIFT_PARSE_PASS=43',flush=True)
          build=stages[2].decode()
          for old,new in [('r27482','r27483'),('R482','R483'),("'482'","'483'"),("'0.4.82'","'0.4.83'")]:
              assert old in build,'FAIL_CLOSED: build replacement anchor'
              build=build.replace(old,new)
          assert 'dist/R483.ipa' in build and "info['CFBundleVersion']='483'" in build
          out=Path(os.environ['RUNNER_TEMP'])/'r483_build.sh'
          out.write_text(build)
          subprocess.run(['bash','-n',str(out)],check=True)
          print('R483_SOURCE_AND_SCRIPT_INTEGRITY=PASS',flush=True)
          PYCODE
          bash "$RUNNER_TEMP/r483_build.sh"
      - name: Upload R483 IPA
        uses: actions/upload-artifact@v4
        with:
          name: R483_UNSIGNED_IPA
          path: dist/R483.ipa
          if-no-files-found: error
          retention-days: 3
