      - name: Replay real status, inspection and animation evidence
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_26.3.app/Contents/Developer ]]; then
            export DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
          fi
          xcodebuild -version
          cd pinned-r793/source
          source_package="$PWD/R720_PORTABLE_TESTS"
          focused="$RUNNER_TEMP/r965-vision/R720_PORTABLE_TESTS"
          mkdir -p "$focused/Tests/R719CoreTests" "$RUNNER_TEMP/r965-vision/tests"
          cp "$source_package/Package.swift" "$focused/"
          cp -R "$source_package/Sources" "$focused/"
          cp -R tests/fixtures "$RUNNER_TEMP/r965-vision/tests/"
          for name in R893BattleStatusPanelTests R883InspectionPanelTests R761RealImageRegressionTests R858NumericHUDOCRTests R855FastLosslessPNGTests; do
            cp "$source_package/Tests/R719CoreTests/$name.swift" "$focused/Tests/R719CoreTests/"
          done
          # Rerun just the affected fixture once for the existing host Vision deadline.
          if ! swift test -c release --jobs 4 --package-path "$focused" --filter 'testPhoneStatusFromActualSelectedScreenshotRegions|testRetainedBuild715InspectionAndNonSelectedTransition|testSelectedMovePPStillRecordedWhenNameIsUnreadable|testUnknownSelectedSpeciesKeepsHPAndPPWithoutActiveIdentity|testSelectedCardKeepsExactItemWhenOtherFieldsAreUnread|testSelectedPPFractionNeedsDistinctMatchingContrastReadsAndExistingDigits|testAlternateLiteralRequiresExactSameSlotAndValidPP|testScaledAndRotatedInspectionKeepAllSelectedNumbersBoundToSource|testActualAppleVisionReadsOpponentSandStreamFromRetainedCapture|testActualAppleVisionKnockOffOwnItemHistoryNeedsMatchingOwnCard|testR955RetryTimeoutPreservesFrame3402FirstPassOnly|testR961PreservesConfirmedOwnPairsAndLimitsOptionalRetryOnR959Frames|testFallbackDoesNotSilentlyReplaceADifferentHPReading|testR965RealCommandPPDenominatorCrops|R855FastLosslessPNGTests|testR956ActualSelectionAndDualHUDStayOutOfSingleCardRoute' 2>&1 | tee "$RUNNER_TEMP/r965-vision.log"; then
            test "$(grep -c ' error: .*XCTUnwrap failed' "$RUNNER_TEMP/r965-vision.log")" = 1
            grep -E 'Executed [0-9]+ tests, with 1 failure \(0 unexpected\)' "$RUNNER_TEMP/r965-vision.log"
            grep -E 'R903_PHONE_FIXTURE (own|opponent) R893_STATUS_VISION_HELD timedOut' "$RUNNER_TEMP/r965-vision.log"
            grep -F "testPhoneStatusFromActualSelectedScreenshotRegions]' failed" "$RUNNER_TEMP/r965-vision.log"
            swift test -c release --skip-build --package-path "$focused" \
              --filter 'testPhoneStatusFromActualSelectedScreenshotRegions' 2>&1 | tee -a "$RUNNER_TEMP/r965-vision.log"
          fi


          grep -F "testPhoneStatusFromActualSelectedScreenshotRegions]' passed" "$RUNNER_TEMP/r965-vision.log"
          grep -F "testRetainedBuild715InspectionAndNonSelectedTransition]' passed" "$RUNNER_TEMP/r965-vision.log"
          grep -F "testSelectedMovePPStillRecordedWhenNameIsUnreadable]' passed" "$RUNNER_TEMP/r965-vision.log"
          grep -F "testUnknownSelectedSpeciesKeepsHPAndPPWithoutActiveIdentity]' passed" "$RUNNER_TEMP/r965-vision.log"
          grep -F "testAlternateLiteralRequiresExactSameSlotAndValidPP]' passed" "$RUNNER_TEMP/r965-vision.log"
          grep -F "testScaledAndRotatedInspectionKeepAllSelectedNumbersBoundToSource]' passed" "$RUNNER_TEMP/r965-vision.log"
          grep -F "testActualAppleVisionReadsOpponentSandStreamFromRetainedCapture]' passed" "$RUNNER_TEMP/r965-vision.log"
          grep -F "testActualAppleVisionKnockOffOwnItemHistoryNeedsMatchingOwnCard]' passed" "$RUNNER_TEMP/r965-vision.log"

          grep -F "testSelectedCardKeepsExactItemWhenOtherFieldsAreUnread]' passed" "$RUNNER_TEMP/r965-vision.log"

          grep -F "testSelectedPPFractionNeedsDistinctMatchingContrastReadsAndExistingDigits]' passed" "$RUNNER_TEMP/r965-vision.log"

          grep -F "testR955RetryTimeoutPreservesFrame3402FirstPassOnly]' passed" "$RUNNER_TEMP/r965-vision.log"
          grep -F 'R855_FAST_PNG_ICC_ALPHA_STRIDE_IMAGEIO_READBACK_PASS' "$RUNNER_TEMP/r965-vision.log"

          grep -F "testR956ActualSelectionAndDualHUDStayOutOfSingleCardRoute]' passed" "$RUNNER_TEMP/r965-vision.log"

          grep -F "testR961PreservesConfirmedOwnPairsAndLimitsOptionalRetryOnR959Frames]' passed" "$RUNNER_TEMP/r965-vision.log"

          grep -F "testR964FullSize420fReadbackAndMeasuredPNGStages]' passed" "$RUNNER_TEMP/r965-vision.log"

          grep -F "testR965RealCommandPPDenominatorCrops]' passed" "$RUNNER_TEMP/r965-vision.log"
  publish:
    name: Publish and verify the tested IPA
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    needs: [verify, vision]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: r965-ipa
          path: R965Delivery
      - name: Publish and verify the download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd R965Delivery
          python3 - <<'VERIFY'
          import hashlib,json,os
          from pathlib import Path
          p=Path('R965_Unsigned_DeviceTest.ipa')
          r=json.loads(Path('VERIFICATION_R965.json').read_text())
          assert r['source_commit']==os.environ['GITHUB_SHA'] and r['build']==965
          assert r['ipa_bytes']==p.stat().st_size
          assert r['ipa_sha256']==hashlib.sha256(p.read_bytes()).hexdigest()
          VERIFY
          tag=r965-final-device-test
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft > existing.json 2>/dev/null; then
            test "$(jq -r .isDraft existing.json)" = true
            gh release upload "$tag" R965_Unsigned_DeviceTest.ipa VERIFICATION_R965.json restore_capture.py R965_PC_Capture_Tools.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" R965_Unsigned_DeviceTest.ipa VERIFICATION_R965.json restore_capture.py R965_PC_Capture_Tools.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title 'R965 iPhone 実機テスト 0.9.65' --notes '行動選択画面で、元画像の同じ枠にある最大PPを追加照合。R961実機データ由来の数値回帰試験を追加。'
          fi
          mkdir readback
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.ipa' --dir readback
          cmp R965_Unsigned_DeviceTest.ipa readback/R965_Unsigned_DeviceTest.ipa
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/R965_Unsigned_DeviceTest.ipa"
          curl --fail -sSL --retry 4 --retry-all-errors "$url" -o readback/published.ipa
          cmp R965_Unsigned_DeviceTest.ipa readback/published.ipa
          echo "R965_PUBLIC_READBACK_VERIFIED $url"

          curl --fail -sSL --retry 4 --retry-all-errors "${url%/*}/restore_capture.py" -o readback/restore_capture.py
          cmp restore_capture.py readback/restore_capture.py

          curl --fail -sSL --retry 4 --retry-all-errors "${url%/*}/R965_PC_Capture_Tools.zip" -o readback/R965_PC_Capture_Tools.zip
          cmp R965_PC_Capture_Tools.zip readback/R965_PC_Capture_Tools.zip
