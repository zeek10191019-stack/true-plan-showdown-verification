
name: Showdown pinned M-C build check (public/free)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-build:
    name: Pinned Showdown Node 22.18.0
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check public repository
        shell: bash
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          test "$REPO_PRIVATE" = "false"
          echo "PASS PUBLIC_REPO"

      - name: Checkout pinned Showdown
        uses: actions/checkout@v4
        with:
          repository: smogon/pokemon-showdown
          ref: aa17ca0fac8bc5605df673bd8774c2d0e91efa43
          fetch-depth: 1
          persist-credentials: false
          path: pokemon-showdown

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Verify source, install and build
        working-directory: pokemon-showdown
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "aa17ca0fac8bc5605df673bd8774c2d0e91efa43"
          test "$(git rev-parse HEAD^{tree})" = "98c9038b81fa5ed7f1e9818736b701918920501e"
          echo "PASS PINNED_SOURCE"

          test "$(node -v)" = "v22.18.0"
          echo "PASS NODE_VERSION"

          npm ci --no-audit --no-fund
          echo "PASS NPM_CI"

          npm run build
          echo "PASS NPM_BUILD"

      - name: Verify Champions Mod
        working-directory: pokemon-showdown
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { Dex } = require('./dist/sim');

          const format = Dex.formats.get(
            '[Gen 9 Champions] BSS Reg M-C'
          );

          assert.ok(format.exists);
          assert.equal(format.mod, 'champions');
          assert.ok(format.ruleset.includes('Flat Rules'));
          assert.ok(format.ruleset.includes('VGC Timer'));

          const mod = Dex.forFormat(format);

          assert.equal(mod.gen, 9);
          assert.equal(
            typeof mod.data.Scripts.statModify,
            'function'
          );

          console.log('PASS CHAMPIONS_MOD_LOADED');
          console.log('PASS MC_SINGLES_FORMAT');
          NODE

      - name: Certification boundary
        run: |
          echo "Native33=0/33"
          echo "Exact34=0/34"
          echo "Stage/Gate unchanged"

