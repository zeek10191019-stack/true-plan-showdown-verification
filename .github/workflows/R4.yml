name: R484
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r484-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false && github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - name: Pinned R83 baseline and transport conflict gate IPA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request,hashlib,textwrap,subprocess,os,base64,zlib,json
          url='https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/965588beaa9ee153818a70b23cc89d6609e3b251/.github/workflows/R83.yml'
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'R484-Pinned'}),timeout=60) as f:
              b=f.read(12000)
          assert len(b)==9034
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()=='87ed38b231cf4930ef459c9d798d9f3a7a8ff5d9'
          y=b.decode('utf-8')
          start=y.index('        run: |\n')+len('        run: |\n')
          end=y.index('      - name: Upload R483 IPA',start)
          script=textwrap.dedent(y[start:end])
          assert script.startswith('set -euo pipefail\n') and script.rstrip().endswith('bash "$RUNNER_TEMP/r483_build.sh"')
          base='\n'.join(script.splitlines()[:-1])+'\n'
          subprocess.run(['bash','-e','-o','pipefail'],input=base,text=True,check=True)
          source=Path('ios/ChampionsOnDevice/ResearchUnifiedTelemetryBundle.swift')
          s=source.read_text()
          assert hashlib.sha256(s.encode()).hexdigest()=='5ee065484868c89d2fc1d7bf0da07d2373eb477fe98fbf052bb460d3f9335578','FAIL_CLOSED: R483 source mismatch'
          edits=json.loads(zlib.decompress(base64.b64decode('')).decode())
          assert len(edits)==2
          for needle,updated in edits:
              assert s.count(needle)==1,'FAIL_CLOSED: patch anchor missing or duplicate'
              s=s.replace(needle,updated,1)
          assert hashlib.sha256(s.encode()).hexdigest()=='0035d617f59dc570b086a91408e8cbe6c2978ea36da741a3f3531582dc266615','FAIL_CLOSED: R484 source mismatch'
          source.write_text(s)
          test=zlib.decompress(base64.b64decode(''))
          assert hashlib.sha256(test).hexdigest()=='_SHA','FAIL_CLOSED: tests mismatch'
          main=Path(os.environ['RUNNER_TEMP'])/'r484/main.swift';main.parent.mkdir(parents=True,exist_ok=True);main.write_bytes(test)
          exe=main.parent/'r484_tests'
          subprocess.run(['swiftc','-O',str(source),str(main),'-o',str(exe)],check=True)
          subprocess.run([str(exe)],check=True)
          for sw in sorted(Path('ios/ChampionsOnDevice').glob('*.swift')):
              subprocess.run(['swiftc','-frontend','-parse',str(sw)],check=True)
          assert len(list(Path('ios/ChampionsOnDevice').glob('*.swift')))==43
          print('R484_SWIFT_PARSE_PASS=43',flush=True)
          build=Path(os.environ['RUNNER_TEMP'])/'r483_build.sh'
          s=build.read_text()
          for before,after in [('r27483','r27484'),('R483','R484'),("'483'","'484'"),("'0.4.83'","'0.4.84'")]:
              assert before in s,'FAIL_CLOSED: build version anchor missing'
              s=s.replace(before,after)
          assert 'dist/R484.ipa' in s and "info['CFBundleVersion']='484'" in s
          build=Path(os.environ['RUNNER_TEMP'])/'r484_build.sh';build.write_text(s)
          subprocess.run(['bash','-n',str(build)],check=True)
          print('R484_SOURCE_AND_SCRIPT_INTEGRITY=PASS',flush=True)
          PY
          bash "$RUNNER_TEMP/r484_build.sh"
      - name: Upload R484 IPA
        uses: actions/upload-artifact@v4
        with:
          name: R484_UNSIGNED_IPA
          path: dist/R484.ipa
          if-no-files-found: error
          retention-days: 3
