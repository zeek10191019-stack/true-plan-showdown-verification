name: R988 OCR and PC device verification
'on':
  push:
    branches:
    - r987-ocr-pc-regression
    paths:
    - .github/workflows/r988-ocr-pc-device-test.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    name: Swift, browser, PC and iPhoneOS regression
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && !github.event.repository.private && github.ref == 'refs/heads/r987-ocr-pc-regression'
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RELEASE_TAG: r988-unsigned-device-test
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: .github/workflows/r988-ocr-pc-device-test.yml
    - name: Restore fixed R987 and apply R988
      shell: bash
      run: |
        set -euo pipefail
        git show cb8b0f53c4a5424aa1eeeb3d05cc42f815fd5f30:.github/workflows/r987-ocr-pc-verification.yml > "$RUNNER_TEMP/r987-baseline.yml"
        echo 'c889a5706e170c1cdc22c6176357a64719933eb43e56d8dbeeeb36f1d6ad79b6  r987-baseline.yml' | (cd "$RUNNER_TEMP" && shasum -a 256 -c -)
        ruby -ryaml -e '
          steps = YAML.load_file(ARGV.fetch(0), aliases: true).fetch("jobs").fetch("verify").fetch("steps")
          puts steps.find { |step| step["name"] == "Restore fixed R986 and apply the R987 patch" }.fetch("run")
        ' "$RUNNER_TEMP/r987-baseline.yml" > "$RUNNER_TEMP/r987-restore.sh"
        bash "$RUNNER_TEMP/r987-restore.sh"
