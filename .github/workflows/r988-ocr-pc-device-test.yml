        data = (json.dumps(files, sort_keys=True, indent=2) + '\n').encode()
        assert hashlib.sha256(data).hexdigest() == 'aba39e04ebc4ff162d7dcf0a0ab4f573bad41081ddf06037557063d61ff4ff39'
        manifest.write_bytes(data)
        for name in ("R716SpatialFieldProjection", "R947RetainedDisplayEvidence", "R987BattleReadout"):
