jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 311a9bbc3988bd06b350382ed515ee7cf6ea18a5
    - run: |
        python3 - <<'PYCODE'
        import os,base64,lzma,hashlib,pathlib
        b=lzma.decompress(base64.b85decode(
          ''.join(os.environ['P'].split())),
          format=lzma.FORMAT_ALONE)
        assert hashlib.sha256(b).hexdigest() == (
          '0bc0b3318db9e159c544b1c08b56411c' +
          'aa604054f9db22a368c5ebb93324091a')
        names=[
          'app/ios/ChampionsOnDevice/' +
          'R681MegaSeedOCRHints.swift',
          'tests/R681Smoke.swift',
          'tools/r681_patch.py','/tmp/R681CI.sh']
        sizes=[7878, 5228, 1362, 1181]
        pos=0
        for n,z in zip(names,sizes):
          p=pathlib.Path(n)
          assert not p.exists(),n
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_bytes(b[pos:pos+z]);pos+=z
        assert pos==len(b)
        PYCODE
        bash /tmp/R681CI.sh
