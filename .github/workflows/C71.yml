      id: code
    - name: Fetch immutable C65 release source and apply C70 project-only delta
      shell: bash
      run: |
        set -euo pipefail
        [[ "$GITHUB_REPOSITORY" == 'zeek10191019-stack/true-plan-showdown-verification' ]]
        [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" == false ]]
        archive="R1064_C64_EXACT_SOURCE_${C71_LANE}.zip"
        mkdir "$RUNNER_TEMP/c71-download"
        gh release download "r1064-c65-recovery-${C71_LANE}-46112256040-1" --repo "$GITHUB_REPOSITORY" --pattern "$archive" --dir "$RUNNER_TEMP/c71-download"
        python3 "$RUNNER_TEMP/c71-code/c70/apply_c70.py" "$C71_LANE" "$RUNNER_TEMP/c71-download/$archive" "$RUNNER_TEMP/c71-native"
        python3 "$RUNNER_TEMP/c71-native/tools/r780_project_source_parity.py"
      id: candidate
    - name: Ensure existing native prerequisites without paid services
      shell: bash
      run: |
        set -euo pipefail
        command -v ruby
        command -v node
