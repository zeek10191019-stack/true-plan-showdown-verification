name: R1064 C71 exact C70 native regression and historical fixture recovery NO IPA
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/C71.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: r1064-c71-${{ github.repository }}
  cancel-in-progress: false
jobs:
  regression:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-26
        - xcode-27
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
