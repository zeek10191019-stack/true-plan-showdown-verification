    - name: Swift portable tests (core only)
      shell: bash
      run: |
        set -euo pipefail
        cd .r719-standalone
        swift --version
        swift test -j 2
    - name: iPhoneOS Swift typecheck (core only, not IPA)
      shell: bash
      run: |
        set -euo pipefail
        cd .r719-standalone
        xcodebuild -version
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        xcrun swiftc -target arm64-apple-ios17.0 -sdk "$SDK" -typecheck Sources/R719Core/*.swift
        echo R719_IPHONEOS_CORE_TYPECHECK_PASS
    - name: Independent ZIP cross-check (real Swift ZIP writer)
      shell: bash
      run: |
        set -euo pipefail
        cd .r719-standalone
        swiftc Sources/R719Core/*.swift Tools/R719ZIPProbe.swift -o "$RUNNER_TEMP/r719-zip-probe"
        python3 - <<'PY'
        import tempfile,pathlib,os,hashlib,zipfile,json,subprocess
        with tempfile.TemporaryDirectory() as d:
            root=pathlib.Path(d)/'source';root.mkdir()
            (root/'frames').mkdir()
            (root/'frames'/'raw.bin').write_bytes(os.urandom(1000123))
            (root/'.metadata').write_bytes(b'R719-test-hidden-file')
            target=pathlib.Path(d)/'evidence.zip'
            result=json.loads(subprocess.check_output([os.environ['RUNNER_TEMP']+'/r719-zip-probe',
                    str(root),str(target)],text=True))
            with zipfile.ZipFile(target) as archive:
                assert archive.testzip() is None
                manifest=json.loads(archive.read('R719_EVIDENCE_MANIFEST.json'))
                assert set(archive.namelist())=={'.metadata','frames/raw.bin','R719_EVIDENCE_MANIFEST.json'}
                assert manifest['evidenceFileCount']==2
                for e in manifest['files']:
                    b=archive.read(e['path'])
                    assert b==(root/e['path']).read_bytes()
                    assert hashlib.sha256(b).hexdigest()==e['sha256']
                assert hashlib.sha256(target.read_bytes()).hexdigest()==result['zipSHA256']
            print('R719_INDEPENDENT_EVIDENCE_ZIP_VERIFICATION_PASS')
        PY
    - name: Explicit scope and device certification boundary
      shell: bash
      run: |
        set -euo pipefail
        echo '## R719 PREINTEGRATION ONLY' >> "$GITHUB_STEP_SUMMARY"
        echo 'Swift tests and iPhoneOS core typecheck do NOT certify R718 app integration.' >> "$GITHUB_STEP_SUMMARY"
        echo 'R718 exact-source restoration: NOT TESTED; R715 replay: NOT TESTED.' >> "$GITHUB_STEP_SUMMARY"
        echo '79-field device certification: 0/79.' >> "$GITHUB_STEP_SUMMARY"
        echo 'IPA: NOT BUILT; R718 regression: NOT RUN.' >> "$GITHUB_STEP_SUMMARY"
