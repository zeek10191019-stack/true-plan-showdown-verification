        assert set(rows)==set(expected),'R719_SOURCE_LIST_MISMATCH'
        dest=pathlib.Path('.r719-standalone');dest.mkdir(exist_ok=True)
        for name,value in rows.items():
            n=pathlib.PurePosixPath(name)
            assert not n.is_absolute() and '..' not in n.parts
            data=value.encode('utf8')
            assert hashlib.sha256(data).hexdigest()==expected[name],name
            f=dest/name;f.parent.mkdir(parents=True,exist_ok=True);f.write_bytes(data)
        print('R719_PREINTEGRATION_SOURCE_SHA_PASS',len(rows))
