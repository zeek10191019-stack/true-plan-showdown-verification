jobs:
  build:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            1e63efa4db514cc122f2940a39623d9bc65c554c
      - name: Verify R701 and build IPA
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os,re,base64,lzma,hashlib
          import pathlib,urllib.request,ast
          url=('https://raw.githubusercontent.com/'
            'zeek10191019-stack/'
            'true-plan-showdown-verification/'
            'main/.github/workflows/z4.yml')
          req=urllib.request.Request(url,headers={
            'User-Agent':'R701-Pinned-Builder'})
          with urllib.request.urlopen(
            req,timeout=40) as res:
            old=res.read(25000)
          assert len(old)==10768
          assert hashlib.sha256(old).hexdigest()==(
            '07a5bdf8cefa1fda96f0ee8b06bb0a6c'
            'b7a0e04ea929509dbc1aa47036ee4b73')
          m=re.search(rb'(?m)^  R700_PKG: >-\n'
            rb'((?:    [^\n]*\n)+)',old)
          assert m,'R700_PINNED_PACKAGE_MISSING'
          os.environ['R700_PKG']=b''.join(
            m[1].split()).decode('ascii')
          raw=lzma.decompress(base64.b64decode(
            os.environ['R701_PKG']),
            format=lzma.FORMAT_ALONE)
          assert hashlib.sha256(raw).hexdigest()==(
            'fa35b474771a2392750c4bf904a1eba5'
            '0a7d447ab1fdc23450c0b5efb90e6f5b')
          names=['R701TypedFieldReadout.swift',
            'R701Patch.py','R701MakeBuild.py',
            'R701Smoke.swift']
          sizes=[8375, 1378, 2035, 9580]
          assert sum(sizes)==len(raw)
          pos=0
          for name,size in zip(names,sizes):
            folder='tests' if name.endswith(
              'Smoke.swift') else 'tools'
            p=pathlib.Path(folder)/name
            p.parent.mkdir(parents=True,
              exist_ok=True)
            p.write_bytes(raw[pos:pos+size])
            pos+=size
          print('R701_SOURCE_SHA_PASS',flush=True)
          text=old.decode('utf-8')
          marker="          python3 - <<'PYCODE'\n"
          start=text.index(marker)+len(marker)
          end=text.index('\n          PYCODE',start)
          block=text[start:end]
          body='\n'.join(line[10:] for line in
            block.splitlines())
          needle=("['python3','tools/"+
            "R700MakeBuild.py']")
          assert body.count(needle)==1
          body=body.replace(needle,
            "['python3','tools/R701MakeBuild.py']")
          ast.parse(body)
          exec(compile(body,'r700','exec'),{})
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: R701-unsigned-iLoader-IPA
          path: dist/R701*
          if-no-files-found: error
          retention-days: 7
