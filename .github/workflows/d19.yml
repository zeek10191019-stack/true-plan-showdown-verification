        patch=lzma.decompress(base64.b64decode(
         ''.join(packed.split())))
        assert sha(patch)==(
         '81cfcbc29464e0fc9cde302dec2a8033226e3db4def9b1588d6279e5426517fb'
        )
        for line in patch.decode().splitlines():
         if line.startswith('+++ b/'):
          n=line[6:]
          assert n and not n.startswith('/')
          assert '..' not in pathlib.PurePosixPath(n).parts
          (root/n).parent.mkdir(parents=True,exist_ok=True)
        subprocess.run(['patch','-p1'],input=patch,cwd=root,check=True)
        changed=readtree()
        assert len(changed)==422 and set(before)<=set(changed)
        manifest={n:sha(b) for n,b in changed.items()
         if n!='source_manifest.json'}
        dest=root/'source_manifest.json'
        dest.write_text(json.dumps(manifest,sort_keys=True,
         indent=2,ensure_ascii=False)+'\n')
        assert sha(dest.read_bytes())==(
         '432ebcedc952bd855b5399c8c8dd18a6460dc22ca81baed05a4ba07655b1b0b8'
        )
        current=readtree()
        assert len(current)==422
        assert tree(current)==(
         'fa79a7ffe8a6de221e22329dddbddac9880e9d93de3ad7ac5353403341683173'
        )
        assert all(manifest[n]==sha(current[n]) for n in manifest)
        proof=pathlib.Path('R757Proof')
        (proof/'SOURCE_HASHES.json').write_text(
         json.dumps({n:sha(b) for n,b in current.items()},sort_keys=True))
        print('R757 422/422 BYTE VERIFIED - ZERO DELETION')
        PYTHON
    - name: Run original Swift and iPhoneOS checks NO IPA
      shell: bash
      run: |
        set -euo pipefail
        (cd source/R720_PORTABLE_TESTS && swift test -j 2) \
         > R757Proof/Swift.log 2>&1 || {
          tail -n 70 R757Proof/Swift.log;exit 1;
         }
        grep -Fq 'Executed 324 tests, with 0 failures' \
         R757Proof/Swift.log
        python3 source/tools/r748_capture_path_gate.py
        python3 source/tools/r745_read_path_gate.py \
         > R757Proof/ReadPath.log
        python3 source/tools/r742_live_path_audit.py
        python3 source/tools/r743_macos_compat_audit.py
        python3 -m unittest discover -s source/tools/tests \
         -p 'test_r756*.py' -v > R757Proof/VideoTests.log 2>&1 || {
          tail -n 70 R757Proof/VideoTests.log;exit 1;
         }
        grep -Fq 'Ran 16 tests' R757Proof/VideoTests.log
        python3 -m unittest discover -s source/tools/tests \
         -p 'test_r757*.py' -v > R757Proof/R757Audit.log 2>&1 || {
          tail -n 70 R757Proof/R757Audit.log;exit 1;
         }
        grep -Fq 'Ran 6 tests' R757Proof/R757Audit.log
        swiftc -frontend -parse source/app/ios/ChampionsOnDevice/*.swift
        python3 source/tools/generate_xcode_project.py
        xcodebuild -project source/app/ios/ChampionsOnDeviceResearch.xcodeproj \
         -scheme ChampionsOnDeviceResearch -configuration Debug \
         -sdk iphoneos -destination 'generic/platform=iOS' \
         ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
         -derivedDataPath "$RUNNER_TEMP/r757" build \
         > R757Proof/iPhoneOS.log 2>&1 || {
          grep -E 'error:|BUILD FAILED' R757Proof/iPhoneOS.log || true
          exit 1;
         }
        grep -Fq 'BUILD SUCCEEDED' R757Proof/iPhoneOS.log
    - name: Package R757 only and complete SHA manifest
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYTHON'
        import pathlib,zipfile,hashlib,json
        root=pathlib.Path('source');out=pathlib.Path('R757Proof')
        expected=json.loads((out/'SOURCE_HASHES.json').read_text())
        assert len(expected)==422
        names=[
         'R720_PORTABLE_TESTS/Sources/R719Core/R750HUDPixelAudit.swift',
         'R720_PORTABLE_TESTS/Sources/R719Core/R751HUDBarEvidence.swift',
         'R720_PORTABLE_TESTS/Sources/R719Core/R752HPTextBarLink.swift',
         'R720_PORTABLE_TESTS/Tests/R719CoreTests/R752HPTextBarLinkTests.swift',
         'R757_CHANGELOG.md',
         'app/ios/ChampionsOnDevice/R750HUDPixelAudit.swift',
         'app/ios/ChampionsOnDevice/R751HUDBarEvidence.swift',
         'app/ios/ChampionsOnDevice/R752HPTextBarLink.swift',
         'source_manifest.json',
         'tools/r757_real_one_tap_audit.py',
         'tools/tests/test_r757_real_one_tap_audit.py',
        ]
        with zipfile.ZipFile(out/'R757_CHANGESET_ONLY.zip','w',
          zipfile.ZIP_DEFLATED) as z:
         for n in names:
          b=(root/n).read_bytes()
          assert hashlib.sha256(b).hexdigest()==expected[n]
          z.writestr(n,b)
        (out/'STATUS.txt').write_text(
         'R757 SHA PASS / 422 files preserved / NO IPA.\n'
         'Real game image evidence stays local; 0/79 certified.\n')
        PYTHON
