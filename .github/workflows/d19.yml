name: R757 Base64 Verified Delivery No IPA
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/d19.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
    - name: Restore R756 from pinned e18 workflow, no source deletions
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p R757Proof
        url='https://raw.githubusercontent.com/'
        url+='zeek10191019-stack/'
        url+='true-plan-showdown-verification/'
        url+='main/.github/workflows/e18.yml'
        curl -fLsS --retry 3 "$url" -o /tmp/e18.yml
        expected_e18='9d7bd9dd863a19bddf4d1cc6433f8769'
        expected_e18+='0effef799065b1d6d9a999b8da432c5f'
        actual_e18=$(shasum -a 256 /tmp/e18.yml | cut -d' ' -f1)
        test "$actual_e18" = "$expected_e18"
        python3 - <<'PYTHON'
        from pathlib import Path
        lines=Path('/tmp/e18.yml').read_text().splitlines()
        assert lines[0].startswith('name: R756 ')
        first=next(i for i,s in enumerate(lines)
         if s.startswith('    - name: Swift XCTest'))
        chunks=[]
        for i,s in enumerate(lines[:first]):
         if s.strip()!='run: |':continue
         block=[]
         for raw in lines[i+1:]:
          if raw.strip() and len(raw)-len(raw.lstrip())<=6:break
          block.append(raw)
         nonempty=[len(v)-len(v.lstrip()) for v in block if v.strip()]
         assert nonempty
         indent=min(nonempty)
         chunks.append('\n'.join(v[indent:] if v.strip() else ''
          for v in block))
        assert len(chunks)==7,len(chunks)
        Path('/tmp/restore_r756.sh').write_text(
         '\n'.join(chunks)+'\n')
        PYTHON
        bash /tmp/restore_r756.sh
        python3 - <<'PYTHON'
        import pathlib,hashlib
        root=pathlib.Path('source')
        sha=lambda b:hashlib.sha256(b).hexdigest()
        files={p.relative_to(root).as_posix():p.read_bytes()
         for p in root.rglob('*') if p.is_file()}
        def tree(d):
         return sha(''.join(n+'\t'+sha(d[n])+'\n'
          for n in sorted(d)).encode())
        assert len(files)==419
        assert tree(files)==(
         '7711d6fab6052603a40716790355244ada1a8460485a02f60c52c990c1636eda'
        )
        print('R756 PINNED SHA PASS 419 FILES')
        PYTHON
    - name: Apply verified R757 patch, preserve all earlier functions
      shell: bash
      run: |
