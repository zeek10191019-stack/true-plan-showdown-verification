jobs:
  b:
    if: >-
      github.repository ==
      'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        ref: b89cc8fb3677be84fe230b674ff6469e518a7492
    - run: |
        python3 - <<'PY'
        import os,base64,lzma,hashlib,pathlib
        b=lzma.decompress(base64.b85decode(
          ''.join(os.environ['P'].split())),
          format=lzma.FORMAT_ALONE)
        assert hashlib.sha256(b).hexdigest() == (
          '52bce070420a0d960267f745588cc4fd' +
          'b1945fc72981073c86a9512b716acb82')
        names=[
          'app/ios/ChampionsOnDevice/' +
          'R676FieldOverlayOCR.swift',
          'tests/R676Smoke.swift',
          'tools/r676_patch.py','/tmp/R676CI.sh']
        sizes=[8990, 2264, 701, 1062]
        i=0
        for n,z in zip(names,sizes):
          p=pathlib.Path(n)
          p.parent.mkdir(parents=True,exist_ok=True)
          assert not p.exists(),n
          p.write_bytes(b[i:i+z]);i+=z
        assert i==len(b)
        PY
        bash /tmp/R676CI.sh
