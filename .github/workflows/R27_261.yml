          test('EXTERNAL_POLICY_SELECTS_6_TO_3',()=>{const b=battle();try{const r=stepWithControllers(b,{p1:ctl1,p2:ctl2},publicFoe(b));assert.deepEqual(r.choices,['team 142','team 123']);assert.deepEqual(b.p1.pokemon.map(p=>p.species.name),['Charizard','Pikachu','Blastoise']);return {choices:r.choices,own_selected:b.p1.pokemon.map(p=>p.species.name)};}finally{b.destroy()}});
          test('EXTERNAL_POLICY_TURN_AND_FORCED_SWITCH',()=>{const b=battle();try{stepWithControllers(b,{p1:ctl1,p2:ctl2},publicFoe(b));const m=stepWithControllers(b,{p1:ctl1,p2:ctl2},publicFoe(b));assert.deepEqual(m.choices,['move 1','move 1']);assert.equal(b.requestState,'switch');const s=stepWithControllers(b,{p1:ctl1,p2:ctl2},publicFoe(b));assert.deepEqual(s.choices,['switch 2','switch 2']);assert.equal(b.p1.active[0].species.name,'Pikachu');return {move:m.choices,switch:s.choices,own_active:b.p1.active[0].species.name};}finally{b.destroy()}});
          test('INVALID_PRIVATE_POLICY_CANNOT_ADVANCE_BATTLE',()=>{const b=battle();try{const invalid=makeController({plugin:{id:'illegal',decide:()=> 'team 999'}});const prevLog=b.log.length,prevTurn=b.turn;assert.throws(()=>stepWithControllers(b,{p1:invalid,p2:ctl2},publicFoe(b)),e=>e instanceof UnsupportedState&&e.code==='POLICY_ILLEGAL_ACTION');assert.equal(b.log.length,prevLog);assert.equal(b.turn,prevTurn);assert.equal(b.requestState,'teampreview');return {no_engine_commit:true};}finally{b.destroy()}});
          test('HIDDEN_ENEMY_DATA_INVARIANT',()=>{const b=battle();try{stepWithControllers(b,{p1:ctl1,p2:ctl2},publicFoe(b));const req=b.p1.activeRequest;const pub={species:b.p2.active[0].species.name};const orig=propose({ownRequest:req,publicFoe:pub,plugin:privateMock});const tainted=propose({ownRequest:req,publicFoe:{...pub,privateMove:'spore',privateItem:'Choice Scarf',bench:'secret'},plugin:privateMock});assert.equal(orig.choice,tainted.choice);assert.equal(orig.observationHash,tainted.observationHash);return {choice:orig.choice,observationHash:orig.observationHash};}finally{b.destroy()}});
          test('EXTERNAL_POLICY_FIXED_SEED_REPLAY',()=>{const results=[];for(let i=0;i<2;i++){const b=battle();try{let actions=[];for(let j=0;j<10&&!b.ended;j++){actions.push(stepWithControllers(b,{p1:ctl1,p2:ctl2},publicFoe(b)).choices)}const hash=crypto.createHash('sha256').update(b.log.filter(x=>/^\|(move|switch|turn|faint|win)\|/.test(x)).join('\n')).digest('hex');results.push({actions,hash});}finally{b.destroy()}}assert.deepEqual(results[0],results[1]);return {steps:results[0].actions.length,digest:results[0].hash}});
