name: R581 Complete Read Coverage Inventory - No IPA
"on":
  push:
    branches: [main]
    paths: [.github/workflows/r581.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
      PYTHONOPTIMIZE: "0"
    steps:
      - name: Restore pinned R579 and apply exact R581 coverage delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'R581_REPLAY'
          import ast,base64,hashlib,json,lzma,re,textwrap,urllib.request
          from pathlib import Path
          sha=lambda b:hashlib.sha256(b).hexdigest()
          url="https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/8241f2285e644af7796cadb47cd2ba6912bec5ec/.github/workflows/r579.yml"
          raw=urllib.request.urlopen(url,timeout=90).read()
          assert len(raw)==5558 and hashlib.sha1(b"blob "+str(len(raw)).encode()+bytes([0])+raw).hexdigest()=="8d61c267a32704e5d335cc28a251f5feb2f3affb","R581_R579_PIN_INVALID"
          m=re.search(r"python3 - <<'R579_REPLAY'\n(.*?)\n\s+R579_REPLAY",raw.decode(),re.S)
          assert m,"R581_PARENT_SCRIPT_MISSING"
          parent=textwrap.dedent(m.group(1));ast.parse(parent)
          exec(compile(parent,'R581_R579_PINNED','exec'))
          rows=json.loads(lzma.decompress(base64.b64decode("")))
          assert len(rows)==5 and sorted(r['path'] for r in rows)==sorted(['app/ios/ChampionsOnDevice/R581ReadabilityCoverage.swift', 'app/ios/ChampionsOnDevice/R576OfflinePNGInspector.swift', 'app/ios/ChampionsOnDevice/CaptureCoordinator.swift', 'app/ios/ChampionsOnDevice/ChampionsOnDeviceApp.swift', 'tests/R581CoverageHarness.swift'])
          for r in rows:
           p=Path(r['path']);prior=p.read_bytes() if p.exists() else b''
           assert (sha(prior) if prior else None)==r['old_sha'],('R581_PARENT_MISMATCH',r['path'])
          for r in rows:
           p=Path(r['path']);prior=p.read_bytes() if p.exists() else b''
           b=r['prefix'];removed=r['remove'];data=prior[:b]+base64.b64decode(r['insert'])+prior[b+removed:]
           assert sha(data)==r['new_sha'] and len(data)==r['new_len'],('R581_PATCH_MISMATCH',r['path'])
           p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          assert len(list(Path('app/ios/ChampionsOnDevice').glob('*.swift')))==123
          print('R581_EXACT_SOURCE_REPLAY_AND_ALL_5_PATCHES_PASS')
          R581_REPLAY
      - name: R581 all visual field registry regression and full Swift syntax
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse app/ios/ChampionsOnDevice/*.swift
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R581ReadabilityCoverage.swift tests/R581CoverageHarness.swift -o "$RUNNER_TEMP/r581-coverage"
          "$RUNNER_TEMP/r581-coverage"
      - name: Existing Apple native tests and iPhoneOS compilation
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 tools/run_r571_native.py; then
            echo 'R581 Apple native regression failed'
            for log in reports/xcode_iphoneos_build.log reports/r574_png_replay_compile.log; do
              if [ -f "$log" ]; then
                grep -nE 'error:|fatal error|BUILD FAILED' "$log" | tail -n 65 || true
                tail -n 25 "$log" || true
              fi
            done
            exit 1
          fi
      - name: Device/real-game data deliberately not certified
        if: always()
        run: |
          echo 'R581 field coverage and one-click wired only. NOT 79/79 recognized or real-game tested. No IPA.'
