            --parallel --num-workers 1 --xunit-output "$PWD/R834Proof/Focused.xml" \
            --filter 'testOpaqueP3ColourStrideAndEveryPixelSurvivePNGReadback|testAlphaAndCanonicalReusedImageAgreeWithAnIndependentDecoder|testExplicitCaptureColourKeepsEveryPreviousImageIOOutputPixel|testPhoneStatusFromActualSelectedScreenshotRegions|testActualSwitchPanelPixelsAndAppleVision' \
            > R834Proof/Focused-XUnit.log 2>&1 || { cat R834Proof/Focused-XUnit.log; exit 1; }
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          names={
              'testOpaqueP3ColourStrideAndEveryPixelSurvivePNGReadback',
              'testAlphaAndCanonicalReusedImageAgreeWithAnIndependentDecoder',
              'testExplicitCaptureColourKeepsEveryPreviousImageIOOutputPixel',
              'testPhoneStatusFromActualSelectedScreenshotRegions',
              'testActualSwitchPanelPixelsAndAppleVision',
          }
          root=ET.parse('R834Proof/Focused.xml')
          cases=root.findall('.//testcase')
          observed={c.attrib['name'].split('/')[-1].rstrip('()') for c in cases}
          assert observed==names,(observed,names)
          assert len(cases)==len(names),[c.attrib for c in cases]
          assert all(c.find('failure') is None and c.find('error') is None and c.find('skipped') is None for c in cases)
