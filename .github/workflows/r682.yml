jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            311a9bbc3988bd06b350382ed515ee7cf6ea18a5
      - name: Validate R682 local smoke tests
        run: |
          python3 - <<'PY'
          import base64,lzma,hashlib,os,pathlib
          b=lzma.decompress(base64.b64decode(
              os.environ['R682_PACKAGE']),
              format=lzma.FORMAT_ALONE)
          h=hashlib.sha256(b).hexdigest()
          want=('55c50954aa10bebf0a810284f20b4b9c'
                '7efa1fc083d817266476560e17036185')
          assert h==want
          names=[
              'app/ios/ChampionsOnDevice/'
              'R682FormContrast.swift',
              'tests/R682Smoke.swift']
          sizes=[6714,5165]
          offset=0
          for name,sz in zip(names,sizes):
              target=pathlib.Path(name)
              assert not target.exists()
              target.parent.mkdir(
                  parents=True,exist_ok=True)
              target.write_bytes(b[offset:offset+sz])
              offset+=sz
          assert offset==len(b)
          PY
          S=app/ios/ChampionsOnDevice
          swiftc "$S/R682FormContrast.swift" \
            tests/R682Smoke.swift -o /tmp/r682
          /tmp/r682
          test -f tests/R680Smoke.swift
          swiftc "$S/R680MegaReferenceSeeds.swift" \
            tests/R680Smoke.swift -o /tmp/r680
          /tmp/r680
