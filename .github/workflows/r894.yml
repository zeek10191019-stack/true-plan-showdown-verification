      - name: Full 720 Swift regressions durable receipt failures and strict latency
        shell: bash
        run: |
          set -euo pipefail
          export TRUEPLAN_R893_STATUS_FIXTURES="$RUNNER_TEMP/r894_public_status"
          mkdir -p "$TRUEPLAN_R893_STATUS_FIXTURES"
          cd "$TRUEPLAN_R893_STATUS_FIXTURES"
          curl --fail --silent --show-error --location --retry 3 --max-time 45 'https://pbs.twimg.com/media/HEQyVGJbQAAZCr1?format=jpg&name=large' -o corviknight.jpg
          curl --fail --silent --show-error --location --retry 3 --max-time 45 'https://cdn-ak.f.st-hatena.com/images/fotolife/m/mnk-udn-2005/20260418/20260418010155.jpg' -o slowking.jpg
          curl --fail --silent --show-error --location --retry 3 --max-time 45 'https://assets.games.gg/champions_review_incredible_battles_2ae9e1a5fa.webp' -o whimsicott.webp
          cat > checksums <<'EOF'
          3b646715334e815352c0465604433fce4cda78dd29e58b8ee2a103cf5f1890aa  corviknight.jpg
          be75310620492c1080425305903aa443cf7f0d24ee4826351933cb2a31cb06a9  slowking.jpg
          23663e0ee9a78992d69d7fa4c99330073796ada0b5a5db92711b786275624c3c  whimsicott.webp
          EOF
