jobs:
  verify:
    if: >-
      github.repository ==
      'zeek10191019-stack/true-plan-showdown-verification'
      && github.ref == 'refs/heads/main'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      PYTHONOPTIMIZE: '0'
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
    steps:
    - uses: actions/checkout@v4
      with:
        ref: d88e583c570d9901867938cf628e669d4b4a913f
        persist-credentials: true
    - name: One tap source signal and iPhoneOS build
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os,base64,lzma,hashlib
        from pathlib import Path
        raw=lzma.decompress(base64.b85decode(''.join(
          os.environ['PACK'].split())))
        assert len(raw)==18661
        assert hashlib.sha256(raw).hexdigest()==(
          '917f5ed7538654b7920bdff02d08756b' +
          '1e5ed1a410aef290c2d31efde64150ab')
        names=[
          'app/ios/ChampionsOnDevice/' +
          'R664ReadoutScorecard.swift',
          'tests/R664ReadoutScorecardHarness.swift',
          'tools/r664_patch.py',
          'research/R664_README.md',
          '__TEMP__/r664-run.sh',
        ]
        sizes=[
          7911,
          6247,
          1203,
          1649,
          1651,
        ]
        pos=0
        for name,size in zip(names,sizes):
          chunk=raw[pos:pos+size]
          pos+=size
          assert len(chunk)==size
          p=(Path(os.environ['RUNNER_TEMP'])/
             name.split('/')[-1]) if name.startswith(
             '__TEMP__/') else Path(name)
          assert not p.exists(),name
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_bytes(chunk)
        assert pos==len(raw)
        PY
        bash "$RUNNER_TEMP/r664-run.sh"
