name: R585 Spatial OCR Evidence and One-Tap Archive (No IPA)
"on":
  push:
    branches: [main]
    paths: [.github/workflows/r585.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
      PYTHONOPTIMIZE: "0"
    steps:
      - name: Replay pinned R584 and verify R585 source SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'R585_REPLAY'
          import hashlib,json,base64,lzma,re,textwrap,ast,urllib.request
          from pathlib import Path
          sha=lambda b:hashlib.sha256(b).hexdigest()
          url='https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/97b4b27047ac496126058c3abb7bf8efc95ad93a/.github/workflows/r584.yml'
          raw=urllib.request.urlopen(url,timeout=90).read()
          assert len(raw)==16150 and sha(raw)=='dd707410b9a47650134d5f69043dcd3a8eeb286d85349141ef40dca1849255ee','R585_R584_PIN_MISMATCH'
          m=re.search(r"python3 - <<'R584_REPLAY'\n(.*?)\n\s+R584_REPLAY",raw.decode(),re.S)
          assert m,'R585_R584_REPLAY_MISSING'
          previous=textwrap.dedent(m.group(1));ast.parse(previous)
          exec(compile(previous,'R585_PINNED_R584','exec'))
          print('PASS_R585_PINNED_R584_PARENT_REPLAY')
          rows=json.loads(lzma.decompress(base64.b64decode('')))
          assert len(rows)==3
          for r in rows:
           p=Path(r['path']);old=p.read_bytes() if p.exists() else b''
           assert (sha(old) if old else None)==r['old_sha'],('R585_BAD_PARENT',r['path'])
          for r in rows:
           p=Path(r['path']);old=p.read_bytes() if p.exists() else b''
           updated=old[:r['prefix']]+base64.b64decode(r['insert'])+old[r['prefix']+r['remove']:]
           assert len(updated)==r['new_len'] and sha(updated)==r['new_sha'],('R585_BAD_PATCH',r['path'])
           p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(updated)
          assert len(list(Path('app/ios/ChampionsOnDevice').glob('*.swift')))==127
          assert 'maximumMembers = 24' in Path('app/ios/ChampionsOnDevice/R548ResearchArchive.swift').read_text()
          assert 'historical_spatial_ocr_candidates.json' in Path('app/ios/ChampionsOnDevice/CaptureCoordinator.swift').read_text()
          print('PASS_R585_SOURCE_SHA_3_FILES_AND_127_SWIFT')
          R585_REPLAY
      - name: Swift syntax and native spatial-provenance tests
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse app/ios/ChampionsOnDevice/*.swift
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R581ReadabilityCoverage.swift app/ios/ChampionsOnDevice/R583FrameReadabilityIndex.swift app/ios/ChampionsOnDevice/R585SpatialOCRProjection.swift tests/R585SpatialOCRProjectionHarness.swift -o "$RUNNER_TEMP/r585-tests"
          "$RUNNER_TEMP/r585-tests"
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R581ReadabilityCoverage.swift app/ios/ChampionsOnDevice/R583FrameReadabilityIndex.swift app/ios/ChampionsOnDevice/R584BattleTextEventTimeline.swift tests/R584BattleTextEventTimelineHarness.swift -o "$RUNNER_TEMP/r584-tests"
          "$RUNNER_TEMP/r584-tests"
      - name: Apple iPhoneOS compile and existing Vision regressions (No IPA)
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 tools/run_r571_native.py; then
            echo 'R585_APPLE_NATIVE_BUILD_OR_VISION_REGRESSION_FAILED'
            for log in reports/xcode_iphoneos_build.log reports/r574_png_replay_compile.log; do
              if [ -f "$log" ]; then grep -nE 'error:|fatal error|BUILD FAILED' "$log" | tail -n 70 || true; fi
            done
            exit 1
          fi
      - name: Keep game-image accuracy HOLD
        if: always()
        run: echo 'R585 is offline visual spatial candidate geometry only. Real game accuracy, 79 automatic fields, owners, Mega form and field turns remain UNVERIFIED. NO IPA.'
