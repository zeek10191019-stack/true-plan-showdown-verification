name: R938 iPhone export recovery and device-test IPA
'on':
  push:
    branches:
    - r938-export-recovery
    paths:
    - .github/workflows/r938.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: r938-save-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: R938 ${{ matrix.suite }}
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
        - suite: iphone
          runner: xcode-27
        - suite: large
          runner: macos-26
        - suite: full
          runner: macos-26
        - suite: vision
          runner: macos-26
        - suite: sim
          runner: xcode-27
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
    - &id001
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: .github/workflows/r938.yml
    - &id002
      name: Restore the pinned and verified R937 source
      shell: bash
      run: |
        set -euo pipefail
        git show f30b6dfc3019032857d2b59d1eade0a1b7ba598d:.github/workflows/r937.yml > "$RUNNER_TEMP/r937.yml"
        for n in 1 2; do
          ruby -ryaml -e 'puts YAML.load_file(ARGV[0]).fetch("jobs").fetch("verify").fetch("steps").fetch(ARGV[1].to_i).fetch("run")' "$RUNNER_TEMP/r937.yml" "$n" > "$RUNNER_TEMP/r937-restore.sh"
          bash "$RUNNER_TEMP/r937-restore.sh"
        done
    - &id003
      name: Apply and verify the R938 export recovery delta
      shell: bash
      run: |
        set -euo pipefail
        test "$(cat R834Proof/SOURCE_TREE_SHA256.txt)" = 3e1906ee9c82b54b394eb58145d84f63949cf2829c381286abd23fa96625c4a2
