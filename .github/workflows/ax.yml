               'zeek10191019-stack/true-plan-showdown-verification/'
               '33132fb0b30aa4344e9111893aa39c402060c8dc/'
               '.github/workflows/aw.yml')
          parent=urllib.request.urlopen(url,timeout=90).read()
          digest=hashlib.sha1(b'blob '+str(len(parent)).encode()+b'\0'+parent).hexdigest()
          assert len(parent)==11086 and digest=='40503678fa15b58f9b6fecc52685ba6330abf45f'
          match=re.search(
              r"python3 - <<'R603_REPLAY'\n(.*?)\n\s+R603_REPLAY(?=\n|$)",
              parent.decode(),re.S)
          assert match,'R603_PARENT_SCRIPT_NOT_FOUND'
          source=textwrap.dedent(match.group(1))
          ast.parse(source)
          exec(compile(source,'R603_PINNED_REPLAY','exec'),{})
