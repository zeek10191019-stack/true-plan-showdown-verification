name: R604 Auto - R594 Original Features In One Tap ZIP (No IPA)
"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/ax.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.repository ==
      'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
      && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 55
    env:
      PYTHONOPTIMIZE: "0"
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
    steps:
      - name: Restore pinned R603 and insert exact R594 one tap snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'R604_REPLAY'
          import ast,base64,hashlib,lzma,re,textwrap,urllib.request
          from pathlib import Path
