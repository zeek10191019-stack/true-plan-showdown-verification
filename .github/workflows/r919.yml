                 if p.is_file() and not set(p.parts)&{'.build','.swiftpm','__pycache__'}}
          digest=sha(''.join(f'{name}\t{files[name]}\n' for name in sorted(files)).encode())
          assert len(files)==679 and digest=='a9043c58cff41174bf624eea1dd8e32e3f65926443a40d60db180abca5b3f66e',digest
          assert set(files)==set(manifest)|{'source_manifest.json'}
          assert all(files[name]==expected for name,expected in manifest.items())
