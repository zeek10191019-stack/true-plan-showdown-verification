name: R919 full preflight and real-image replay
on:
  push:
    branches: [r905-preflight]
    paths: [.github/workflows/r919.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r919-preflight
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false && github.ref == 'refs/heads/r905-preflight'
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: full
            runner: macos-26
          - suite: replay
            runner: macos-26-intel
          - suite: iphoneos
            runner: xcode-27
    name: R919 ${{ matrix.suite }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
