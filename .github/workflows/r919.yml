          import hashlib,json
          from pathlib import Path
          root=Path('pinned-r793/source')
          manifest_path=root/'source_manifest.json'
          manifest=json.loads(manifest_path.read_text())
          sha=lambda data:hashlib.sha256(data).hexdigest()
