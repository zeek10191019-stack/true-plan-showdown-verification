      - name: Run R598 Swift and Python safety tests, regressions, source inventory and Apple native build
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse app/ios/ChampionsOnDevice/*.swift
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R596FormCatalog.swift app/ios/ChampionsOnDevice/R597FormEvidenceBridge.swift app/ios/ChampionsOnDevice/R598OneButtonFormAttachment.swift tests/R598OneButtonFormAttachmentHarness.swift -o "$RUNNER_TEMP/r598"
          "$RUNNER_TEMP/r598"
          python3 -m unittest discover -s tests -p 'test_r598_research_audit.py' -v
          python3 tools/r598_extractor_probe.py > "$RUNNER_TEMP/r598_source_inventory.json"
          cat "$RUNNER_TEMP/r598_source_inventory.json"
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R596FormCatalog.swift app/ios/ChampionsOnDevice/R597FormEvidenceBridge.swift tests/R597FormEvidenceBridgeHarness.swift -o "$RUNNER_TEMP/r597"
          "$RUNNER_TEMP/r597"
          python3 -m unittest discover -s tests -p 'test_r597_catalog_audit.py' -v
          python3 tools/run_r571_native.py || { for f in reports/xcode_iphoneos_build.log reports/r574_png_replay_compile.log; do [ ! -f "$f" ] || grep -nE 'error:|fatal error|BUILD FAILED' "$f" | tail -n 65 || true; done; exit 1; }
          echo 'R598 safety tests done; existing one-button invocation NOT wired/certified; R595 real pixel compatibility NOT certified; zero registered game reference PNG; no IPA.'
