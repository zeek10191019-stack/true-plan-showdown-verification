          import hashlib, json
          from pathlib import Path
          root = Path("pinned-r793/source")
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          manifest = root / "source_manifest.json"
          files = {p.relative_to(root).as_posix():sha(p) for p in root.rglob("*") if p.is_file() and p != manifest}
          manifest.write_text(json.dumps(files,sort_keys=True,indent=2)+'\n')
          assert sha(manifest) == 'ddfb1c958129a9d6d796815cafb0713e14743b50d2889c9218b774fd99db1a7e'
          files = {p.relative_to(root).as_posix():sha(p) for p in root.rglob("*") if p.is_file() and p != manifest}
          assert files == json.loads(manifest.read_bytes())
          print("R975_SOURCE_VERIFIED",len(files))
          MANIFEST
      - name: Check MOV sample repair and build arm64
        shell: bash
        run: |
          set -euo pipefail
          src=pinned-r793/source
          swiftc -parse-as-library "$src/app/ios/ChampionsOnDevice/R975FinalMovieSample.swift" "$src/tools/tests/r975_movie_sample_check.swift" -o "$RUNNER_TEMP/r975-movie-test"
          "$RUNNER_TEMP/r975-movie-test"
          project="$src/app/ios/ChampionsOnDeviceResearch.xcodeproj"
          xcodebuild -project "$project" -scheme ChampionsOnDeviceResearch -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO -derivedDataPath "$RUNNER_TEMP/r975-build" build > "$RUNNER_TEMP/r975-native.log" 2>&1 || { grep -E -B2 -A2 'error:|BUILD FAILED' "$RUNNER_TEMP/r975-native.log"; exit 1; }
          grep -F 'BUILD SUCCEEDED' "$RUNNER_TEMP/r975-native.log"
          app="$RUNNER_TEMP/r975-build/Build/Products/Release-iphoneos/ChampionsOnDeviceResearch.app"
          test "$(lipo -archs "$app/ChampionsOnDeviceResearch")" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Info.plist")" = 975
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist")" = 0.9.75
      - name: Run integrated export, browser, Swift and PC regressions
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e '
            steps = YAML.load_file(ARGV.fetch(0), aliases: true).fetch("jobs").fetch(ARGV.fetch(1)).fetch("steps")
            puts steps.find { |step| step["name"] == ARGV.fetch(2) }.fetch("run")
          ' "$RUNNER_TEMP/r974-device-test.yml" verify 'Run Swift, Python and browser regressions' > "$RUNNER_TEMP/r975-verify.sh"
          bash "$RUNNER_TEMP/r975-verify.sh"
          grep -F "testR975RetainsLiteralClockAndHUDWithoutPromotingTheActiveState]' passed" "$RUNNER_TEMP/r966-swift.log"
  vision:
    name: Original-image Apple Vision regression
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && !github.event.repository.private
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: .github/workflows/r975-device-regression.yml
      - name: Restore pinned source and apply R975
        shell: bash
        run: *restore
      - name: Replay retained Apple Vision fixtures
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e '
            steps = YAML.load_file(ARGV.fetch(0), aliases: true).fetch("jobs").fetch(ARGV.fetch(1)).fetch("steps")
            puts steps.find { |step| step["name"] == ARGV.fetch(2) }.fetch("run")
          ' "$RUNNER_TEMP/r974-device-test.yml" vision 'Replay retained Apple Vision images' > "$RUNNER_TEMP/r975-vision.sh"
          bash "$RUNNER_TEMP/r975-vision.sh"
