name: R975 capture and readout regression
'on':
  push:
    branches: [r975-device-regression]
    paths: [.github/workflows/r975-device-regression.yml]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    name: Swift, browser, PC and iPhoneOS regression
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && !github.event.repository.private
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: .github/workflows/r975-device-regression.yml
      - name: Restore pinned source and apply R975
        shell: bash
        run: &restore |
          set -euo pipefail
          git show 87ce46de568640c417f21b0ccc6131c2a5e88b20:.github/workflows/r974-device-test.yml > "$RUNNER_TEMP/r974-device-test.yml"
          echo 'b4d324460efe60a01651bd919470ad97d2e527809d4486bf95df2d49a2bbf0d8  r974-device-test.yml' | (cd "$RUNNER_TEMP" && shasum -a 256 -c -)
          ruby -ryaml -e '
            steps = YAML.load_file(ARGV.fetch(0), aliases: true).fetch("jobs").fetch("verify").fetch("steps")
            puts steps.find { |step| step["name"] == "Restore pinned R973 and verify the R974 source" }.fetch("run")
