      - name: Install pinned image library dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet numpy==2.3.5 opencv-python-headless==4.13.0.92 pillow==12.3.0
      - name: Verify numeric parsing, unknown-screen rejection and inheritance
        shell: bash
        run: |
          set -euo pipefail
          cd r2738-public
          python -m unittest -v test_r2736_public test_r2737_public test_r2738_public 2>&1 | tee public-test.log
          grep -q 'Ran 44 tests' public-test.log
          grep -q '^OK$' public-test.log
          python - <<'CHECK_R2738'
          from r2738_numeric_reader import explicit_multiline_pp
          from r2737_field_reader import safe_ratio
          assert explicit_multiline_pp('12\n/12')=='12/12'
          assert explicit_multiline_pp('12\n12') is None
          assert safe_ratio('1977197') is None
          print('R2738_NO_SLASH_FABRICATION_PASS')
          CHECK_R2738
      - name: Issue public-only synthetic receipt
        shell: bash
        run: |
          set -euo pipefail
          cd r2738-public
          python - <<'RECEIPT_R2738'
          import hashlib,json,pathlib
          files=['r2736_layout_observer.py', 'r2737_field_reader.py', 'r2738_numeric_reader.py', 'test_r2736_public.py', 'test_r2737_public.py', 'test_r2738_public.py']+['public-test.log']
          report={
            'schema':'R2738_PUBLIC_SYNTHETIC_NUMERIC_PROOF_V1',
            'test_count':44,'test_result':'PASS','image_source':'SYNTHETIC_ONLY',
            'real_game_screenshot_files':0,'independent_real_holdout':'NOT_TESTED',
            'real_numeric_accuracy':'NOT_MEASURED_IN_CI',
            'uncertified':True,'recommendation':'WITHHELD','legal_action_request':None,
            'native33':'0/33','exact34':'0/34','actual_game':'0/30','formal':'DENY',
            'sha256':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in files}
          }
          pathlib.Path('r2738-public-receipt.json').write_text(json.dumps(report,indent=2,sort_keys=True))
          print('R2738_RECEIPT_PASS')
          RECEIPT_R2738
      - name: Upload synthetic-only proof
        uses: actions/upload-artifact@v4
        with:
          name: r2738-public-numeric-roi-safety-proof
          path: |
            r2738-public/r2738-public-receipt.json
            r2738-public/public-test.log
          if-no-files-found: error
          retention-days: 7
