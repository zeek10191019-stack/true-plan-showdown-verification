name: R625-R628 Batch - Original PNG HUD Pixel and Sprite Evidence (No IPA)
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/bl.yml
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: trueplan-r625batch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private
      == false && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 55
    env:
      PYTHONOPTIMIZE: '0'
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
