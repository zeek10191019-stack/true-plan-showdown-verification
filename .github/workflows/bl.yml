        parent=urllib.request.urlopen(url,timeout=90).read()
        assert len(parent)==6718,'R6241_PARENT_SIZE_DRIFT'
        assert hashlib.sha256(parent).hexdigest()==(
            'f0c8c924f73aad700243a455b15e18958286c5efec0edbc5c3d4c08f3a473941'
