            part=bundle[pos:pos+size]
            pos+=size
            assert len(part)==size and hashlib.sha256(part).hexdigest()==digest,name
            dest=Path(name)
            assert not dest.exists() and not dest.is_symlink(),name
            dest.parent.mkdir(parents=True,exist_ok=True)
            dest.write_bytes(part)
        assert pos==len(bundle),'EXTRA_SOURCE_BYTES'
        from tools.r625batch_patch import patch
        patch('.')
        assert len(list(Path('app/ios/ChampionsOnDevice').glob('*.swift')))==156
        s=Path('app/ios/ChampionsOnDevice/CaptureCoordinator.swift').read_text()
        assert s.count('R625R628PixelHUDAndSprite.beforeZip(')==1
        assert s.count('R548ResearchArchive.write(')==1
        assert s.count('r625Entries, to: zipURL, work: exportWork')==1
        print('R625_R628_PINNED_SOURCE_AND_ONE_BUTTON_WRITER_SEAM_PASS')
        R628_REPLAY
    - name: Run historical and new Python and Swift regressions
      shell: bash
      run: |
        set -euo pipefail
        export PYTHONPATH=.
        for v in r605 r607 r608 r609 r610 r611batch r613batch r617batch r621batch r625batch; do
          python3 -m unittest discover -s tests -p "test_${v}_*.py" -v
        done
        swiftc -parse-as-library \
           \
          app/ios/ChampionsOnDevice/R610CrossEvidenceCandidate.swift \
          app/ios/ChampionsOnDevice/R611TemporalHUDReview.swift \
          app/ios/ChampionsOnDevice/R612ArchiveEvidenceClosure.swift \
          app/ios/ChampionsOnDevice/R613R616IntegratedReadiness.swift \
          tests/R613BatchHarness.swift -o "$RUNNER_TEMP/r616"
        "$RUNNER_TEMP/r616"
        swiftc -parse-as-library \
           \
          app/ios/ChampionsOnDevice/R617R620RotationReadout.swift \
          tests/R617Harness.swift -o "$RUNNER_TEMP/r620"
        "$RUNNER_TEMP/r620"
        swiftc -parse-as-library \
           \
          app/ios/ChampionsOnDevice/R617R620RotationReadout.swift \
          app/ios/ChampionsOnDevice/R621R624VisualCandidates.swift \
          tests/R621Harness.swift -o "$RUNNER_TEMP/r624"
        "$RUNNER_TEMP/r624"
        swiftc -parse-as-library \
           \
          app/ios/ChampionsOnDevice/R617R620RotationReadout.swift \
          app/ios/ChampionsOnDevice/R621R624VisualCandidates.swift \
          app/ios/ChampionsOnDevice/R625R628PixelHUDAndSprite.swift \
          tests/R625Harness.swift -o "$RUNNER_TEMP/r628"
        "$RUNNER_TEMP/r628"
        echo 'R625_R628_ALL_LOCAL_REGRESSIONS_PASS_NOT_GAME_CERTIFIED'
    - name: Parse Swift and build native iPhoneOS
      shell: bash
      run: |
        set -euo pipefail
        swiftc -frontend -parse app/ios/ChampionsOnDevice/*.swift
        python3 tools/run_r571_native.py || {
          for f in reports/xcode_iphoneos_build.log reports/r574_png_replay_compile.log; do
            test ! -f "$f" || grep -nE 'error:|BUILD FAILED' "$f" | tail -n 65 || true
          done
          exit 1
        }
        echo 'R625_R628_APPLE_NATIVE_PASS__NO_OWNER_HP_MEGA_OR_79_FIELD_CERTIFICATION'
