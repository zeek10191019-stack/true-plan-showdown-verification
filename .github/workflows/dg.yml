          'tools/r658_patch.py',
          'research/R658_README.md',
          '__TEMP__/r658-run.sh',
        ]
        sizes=[
          5587,
          7060,
          4572,
          86,
          2318,
          599,
          1572,
          1652,
        ]
        pos=0
        for name,size in zip(names,sizes):
          chunk=raw[pos:pos+size]
          assert len(chunk)==size and size>0
          pos+=size
          if name.startswith('__TEMP__/'):
            target=Path(os.environ['RUNNER_TEMP'])
            target=target/name.rsplit('/',1)[-1]
          else:
            target=Path(name)
          assert not target.exists(),str(target)
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(chunk)
        assert pos==len(raw)
        PYCODE
        bash "$RUNNER_TEMP/r658-run.sh"
