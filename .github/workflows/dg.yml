          'dda5c4be4e74a793a623e634753a2eb8' +
          'ba6a35cdb15f5401c704964da16c7655')
        names=[
          'app/ios/ChampionsOnDevice/R658MegaTemporalGate.swift',
          'app/ios/ChampionsOnDevice/R658MegaTemporalPanel.swift',
          'tests/R658TemporalHarness.swift',
          'tests/R658PairStub.swift',
