jobs:
  build:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            1e63efa4db514cc122f2940a39623d9bc65c554c
      - name: Restore R705 and apply R708 journal gate
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os,re,base64,lzma,hashlib
          import pathlib,urllib.request,ast
          import plistlib,zipfile,struct
          def checked(url,size,digest):
              req=urllib.request.Request(url,headers={
                'User-Agent':'R708-Journal-Pin'})
              with urllib.request.urlopen(
                  req,timeout=40) as f:
                  data=f.read(size+1)
              assert len(data)==size,'SOURCE_SIZE'
              h=hashlib.sha256(data).hexdigest()
              assert h==digest,'SOURCE_SHA'
              return data
          prefix=('https://raw.githubusercontent.com/'
           'zeek10191019-stack/'
           'true-plan-showdown-verification/'
           'main/.github/workflows/')
          y1=checked(prefix+'y1.yml',9945,
            '6983307d31a1f6247915e5a7723b462'
            '123ac562f17237bc5faa50f6fd425038d')
          z9=checked(prefix+'z9.yml',20253,
            '2439737fbfc4a6960898453e0d92b4c9'
            'e922749f26c59c5e76f4204425b8ac3e')
          for blob,keys in [(y1,('R705_PKG',
             'R705_RUNNER_PKG')),
             (z9,('R703_PKG','R704_PKG'))]:
              for key in keys:
                  pat=(rb'(?m)^  '+key.encode()+
                   rb': >-\n((?:    [^\n]*\n)+)')
                  match=re.search(pat,blob)
                  assert match,('MISSING_PKG',key)
                  os.environ[key]=b''.join(
                    match[1].split()).decode('ascii')
          pkg=lzma.decompress(base64.b64decode(
             os.environ['R708_PKG']),
             format=lzma.FORMAT_ALONE)
          assert hashlib.sha256(pkg).hexdigest()==(
            '2d88120ff5d18f055019a7d4a6542917'
            '45ee4064a4b69b9063f48ac4ae2a683f'
          ),'R708_PACKAGE_SHA'
          names=['R708Patch.py',
                 'tests/R708Smoke.swift',
                 'R708BuildModify.py']
          sizes=[5448, 1686, 1060]
          assert sum(sizes)==len(pkg)
          offset=0
          for name,size in zip(names,sizes):
              item=pathlib.Path(name)
              folder=('tests'
                if name.endswith('.swift')
                else 'tools')
              target=pathlib.Path(folder)/item.name
              target.parent.mkdir(parents=True,
                  exist_ok=True)
              piece=pkg[offset:offset+size]
              target.write_bytes(piece)
              offset+=size
          runner=lzma.decompress(base64.b64decode(
               os.environ['R705_RUNNER_PKG']),
               format=lzma.FORMAT_ALONE)
          assert hashlib.sha256(runner).hexdigest()==(
            '02e5b6c6a5262be5ff2c6e8975762e22'
            '722ecf139e424b3bc5c822fe1ed8aeb9')
          code=runner.decode('utf8')
          marker='path.write_text(fixed)'
          assert code.count(marker)==1
          code=code.replace(marker,
            'fixed=upgrade_r705_builder(fixed)\n'+
            marker,1)
          ast.parse(code)
          context={}
          addition=pathlib.Path(
            'tools/R708BuildModify.py').read_text()
          exec(compile(addition,'R708_BUILDER','exec'),
               context)
          context['__name__']='__main__'
          exec(compile(code,'R708_RUNNER','exec'),
               context)
          ipa=pathlib.Path(
              'dist/R708_Unsigned_OneTap.ipa')
          assert ipa.is_file()
          assert 0<ipa.stat().st_size<300_000_000
          with zipfile.ZipFile(ipa) as z:
              assert z.testzip() is None
              folder=('Payload/'
                'ChampionsOnDeviceResearch.app/')
              info_data=z.read(folder+'Info.plist')
              info=plistlib.loads(info_data)
              assert info['CFBundleVersion']=='708'
              v=info['CFBundleShortVersionString']
              assert v=='0.7.8'
              exe_name=info['CFBundleExecutable']
              exe=z.read(folder+exe_name)
              assert exe[:4]==bytes.fromhex('cffaedfe')
              assert struct.unpack('<I',exe[4:8])[0]==(
                0x0100000c)
          print('R708_IPA_TEST_PASS',flush=True)
          print('R708_IPA_BYTES='+str(
              ipa.stat().st_size),flush=True)
          print('R708_IPA_SHA256='+hashlib.sha256(
              ipa.read_bytes()).hexdigest(),flush=True)
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: R708-unsigned-iLoader-IPA
          path: dist/R708*
          if-no-files-found: error
          retention-days: 7
