# R27.412: conservative app-switcher filtering with bounded volatile preview, using existing R27.410 source.
# Manual-dispatch only. BUILD IS NOT REAL DEVICE CERTIFICATION.
# Source is a public research prototype. Do not add personal screenshots or secrets.
# R27.403 PUBLIC research source only. Unsigned IPA is NOT installable until locally signed on Windows.
# No private Battle AI, MP4s, secrets, Apple credentials, paid runner, or certificates.
name: R27.412 iPhone Frame Selection Unsigned IPA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r27412-iphone-ipa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  iphoneos-unsigned:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event_name == 'workflow_dispatch' && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Require public standard hosted runner and correct repository
        shell: bash
        env:
          REPO_IS_PRIVATE: ${{ github.event.repository.private }}
          EXPECTED_REPO: zeek10191019-stack/true-plan-showdown-verification
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPO"
          test "${REPO_IS_PRIVATE:-unknown}" = false
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          echo 'PUBLIC_STANDARD_RUNNER=PASS; NO_PRIVATE_CODE; NO_SIGNING'
