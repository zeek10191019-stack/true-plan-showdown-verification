# Self-contained public research prototype only. No user screenshots or private DB.
# Standard public runner, no cache/Actions artifact storage/paid APIs/signing.
name: TruePlan R27437 iOS Battle State Candidate Bridge
on:
  push:
    branches: ['codex/r27437-work-all5-20261026']
    paths: ['.github/workflows/R27437_work_all5_ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r27437-work-all5-${{ github.ref }}
  cancel-in-progress: false
jobs:
  iphoneos-unsigned:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/codex/r27437-work-all5-20261026')
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - name: Restore SHA-pinned public source without repository checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,io,zipfile,json
          from pathlib import Path
          data=base64.b64decode('')
          assert hashlib.sha256(data).hexdigest()=='38c95c96ba34b702a74a902f4ea06bf8cbdb3a3b599cc5782c1f81138efcff0b'
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert z.testzip() is None
              for name in z.namelist():
                  assert (Path.cwd()/name).resolve().is_relative_to(Path.cwd())
              z.extractall('.')
          for name,expected in json.loads(Path('PUBLIC_SOURCE_SHA256.json').read_text()).items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==expected,name
          print('PUBLIC_SOURCE_SHA256_CLOSURE_PASS')
          PY
      - name: Native wire tests and parse all Swift sources
        shell: bash
        run: |
          set -euo pipefail
          swiftc ios/ChampionsOnDevice/ResearchBattleWire.swift native_wire_tests/main.swift -o "$RUNNER_TEMP/r27437-wire-tests"
          "$RUNNER_TEMP/r27437-wire-tests"
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          files=list(Path('ios/ChampionsOnDevice').glob('*.swift'))
          for source in files:subprocess.run(['swiftc','-frontend','-parse',str(source)],check=True)
          print('SWIFT_ALL_SOURCE_PARSE_PASS='+str(len(files)))
          PY
      - name: Unsigned iPhoneOS compile and emit verified IPA in logs only
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          test -d "$sdk/System/Library/Frameworks/ScreenCaptureKit.framework"
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate --spec ios/project.yml --project ios
          if xcodebuild -project ios/ChampionsOnDeviceResearch.xcodeproj -scheme ChampionsOnDeviceResearch     -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS'     ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO     -derivedDataPath "$RUNNER_TEMP/r27437-derived" build > "$RUNNER_TEMP/r27437-build.log" 2>&1; then
              echo 'IPHONEOS_R27437_UNSIGNED_BUILD=PASS'
          else
              python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'r27437-build.log'
          lines=p.read_text(errors='replace').splitlines()
          for i,line in enumerate(lines):
              if 'error:' in line or 'BUILD FAILED' in line:print('\n'.join(lines[max(0,i-2):i+3]))
          PY
              exit 1
          fi
          mkdir -p dist
          python3 package_unsigned_ipa.py "$RUNNER_TEMP/r27437-derived/Build/Products/Debug-iphoneos/ChampionsOnDeviceResearch.app" dist
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json
          p=Path('dist/R27_437_Unsigned_ChampionsResearch.ipa')
          data=p.read_bytes()
          assert len(data)<5_000_000
          print('IPA_SHA256='+hashlib.sha256(data).hexdigest())
          print('IPA_BYTES='+str(len(data)))
          print('IPA_BASE64_BEGIN')
          b64=base64.b64encode(data).decode()
          for n in range(0,len(b64),3000):print('IPA_CHUNK_%06d=%s'%(n//3000,b64[n:n+3000]))
          print('IPA_BASE64_END')
          print('FORMAL_UNCHANGED_STAGE1_5_560_NATIVE33_0_EXACT34_0')
          PY
