name: R586 HUD Numeric OCR Region Hypotheses (No IPA)
"on":
  push:
    branches: [main]
    paths: [.github/workflows/r586.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
      PYTHONOPTIMIZE: "0"
    steps:
      - name: Restore exact pinned R585 and SHA-verify R586 changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'R586_REPLAY'
          import hashlib,json,base64,lzma,re,textwrap,ast,urllib.request
          from pathlib import Path
          sha=lambda b:hashlib.sha256(b).hexdigest()
          url='https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/89e0050917bd636d9515b532e7bd141f530b80b2/.github/workflows/r585.yml'
          raw=urllib.request.urlopen(url,timeout=90).read()
          assert len(raw)==12850 and sha(raw)=='0427126b2bba9080563ec0bd5c40d6804f632b6eaa02e3e187714866859e2427','R586_R585_GITHUB_PIN_MISMATCH'
          m=re.search(r"python3 - <<'R585_REPLAY'\n(.*?)\n\s+R585_REPLAY",raw.decode(),re.S)
          assert m,'R586_PARENT_SCRIPT_NOT_FOUND'
          previous=textwrap.dedent(m.group(1));ast.parse(previous)
          exec(compile(previous,'R586_PINNED_R585','exec'))
          print('PASS_R586_PINNED_R585_REPLAY')
          rows=json.loads(lzma.decompress(base64.b64decode('')))
          assert len(rows)==3
          for row in rows:
           p=Path(row['path']);old=p.read_bytes() if p.exists() else b''
           assert (sha(old) if old else None)==row['old_sha'],('R586_BAD_PARENT',row['path'])
          for row in rows:
           p=Path(row['path']);old=p.read_bytes() if p.exists() else b''
           new=old[:row['prefix']]+base64.b64decode(row['insert'])+old[row['prefix']+row['remove']:]
           assert len(new)==row['new_len'] and sha(new)==row['new_sha'],('R586_BAD_PATCH',row['path'])
           p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(new)
          assert len(list(Path('app/ios/ChampionsOnDevice').glob('*.swift')))==128
          assert 'historical_hud_region_hypotheses.json' in Path('app/ios/ChampionsOnDevice/CaptureCoordinator.swift').read_text()
          assert 'maximumMembers = 24' in Path('app/ios/ChampionsOnDevice/R548ResearchArchive.swift').read_text()
          print('PASS_R586_EXACT_SOURCE_SHA_AND_128_SWIFT')
          R586_REPLAY
      - name: Native bounded OCR HUD candidate and provenance tests
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse app/ios/ChampionsOnDevice/*.swift
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R581ReadabilityCoverage.swift app/ios/ChampionsOnDevice/R583FrameReadabilityIndex.swift app/ios/ChampionsOnDevice/R585SpatialOCRProjection.swift app/ios/ChampionsOnDevice/R586HUDSpatialCandidates.swift tests/R586HUDSpatialCandidatesHarness.swift -o "$RUNNER_TEMP/r586-hud"
          "$RUNNER_TEMP/r586-hud"
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R581ReadabilityCoverage.swift app/ios/ChampionsOnDevice/R583FrameReadabilityIndex.swift app/ios/ChampionsOnDevice/R585SpatialOCRProjection.swift tests/R585SpatialOCRProjectionHarness.swift -o "$RUNNER_TEMP/r585-geometry"
          "$RUNNER_TEMP/r585-geometry"
      - name: Apple native Vision and iPhoneOS build (No IPA)
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 tools/run_r571_native.py; then
            echo 'R586_APPLE_NATIVE_BUILD_OR_VISION_REGRESSION_FAILED'
            for log in reports/xcode_iphoneos_build.log reports/r574_png_replay_compile.log; do
              if [ -f "$log" ]; then grep -nE 'error:|fatal error|BUILD FAILED' "$log" | tail -n 70 || true; fi
            done
            exit 1
          fi
      - name: State uncertified game recognition truth
        if: always()
        run: echo 'R586 only makes HUD numeric location hypotheses from historical OCR. Orientation/owner/Mega visual/79-field vision accuracy HOLD. No IPA, no device trial.'
