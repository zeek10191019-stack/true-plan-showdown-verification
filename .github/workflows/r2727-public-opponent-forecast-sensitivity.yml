      - name: Verify R27.27 public results and hard certification limits
        shell: bash
        working-directory: ${{ runner.temp }}/showdown
        run: |
          set -euo pipefail
          python3 - <<'PY_AUDIT'
          import json
          from pathlib import Path
          p=Path('r2727-evidence')
          required={
            'r2727-receipt.json','r2727-search-traces.json',
            'r2727-public-policy.cjs','r2727-public-policy.test.cjs',
            'r2727-evaluation.cjs','r2727-evaluation.test.cjs','r2727-transition-cache.cjs','r2727-transition-cache.test.cjs','r2727-native-integration.cjs'}
          assert {x.name for x in p.iterdir()}==required
          assert sum(x.stat().st_size for x in p.iterdir())<8*1024*1024
          r=json.loads((p/'r2727-receipt.json').read_text())
          traces=json.loads((p/'r2727-search-traces.json').read_text())
          assert r['schema']=='TRUE_PLAN_R2727_PUBLIC_OPPONENT_POLICY_SENSITIVITY_V1'
          assert r['status']=='PASS_PUBLIC_SYNTHETIC_ONLY'
          assert r['search_runs']==18 and r['replayed_runs']==18
          assert len(traces)==6 and all(len(t['runs'])==3 for t in traces)
          assert all([run['alpha'] for run in x['runs']]==[0,.5,1] for x in traces)
          assert r['hidden_item_pairs_identical']==3
          assert r['aggregate_second_turn_nodes']>0
          assert r['aggregate_cache_hits']>0 and r['aggregate_cache_misses']>0
          assert r['certification']=={'native33':'0/33','exact34':'0/34','actual_game':'0/30','formal_increment':0,'gate':'DENY'}
          assert r['stable_variant_count']+r['varying_variant_count']==6
          assert all(all(abs(sum(b['p'] for b in run['root_branches'])-1)<1e-9 for run in t['runs']) for t in traces)
          print('R2727_EVIDENCE_AUDIT_PASS',r['search_runs'],r['aggregate_joint_nodes'])
          PY_AUDIT
          (cd r2727-evidence && sha256sum * > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
