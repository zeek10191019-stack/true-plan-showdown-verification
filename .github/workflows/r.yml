jobs:
  verify:
    if: >-
      github.repository ==
      'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5c87444b8153e06824f72844d683c0f4510b0e9c
      - name: Restore and test R669
        run: |
          python3 - <<'PYCODE'
          import os,hashlib,lzma,base64
          from pathlib import Path
          b=lzma.decompress(base64.b85decode(''.join(
            os.environ['PACK'].split())),
            format=lzma.FORMAT_ALONE)
          assert len(b)==18325
          assert hashlib.sha256(b).hexdigest()==(
            'ea2ae3ddad105db591cace6732f80809' +
            '06ffd28df6e495d0f04e337f1be8c710')
          names=[
            'app/ios/ChampionsOnDevice/' +
              'R669HUDAdjacentText.swift',
            'tests/R669CISmoke.swift',
            'tools/r669_patch.py',
            'research/R669_README.md',
            '__TEMP__/R669CI.sh',
          ]
          sizes=[12097, 2006, 2037, 1023, 1162]
          pos=0
          for name,size in zip(names,sizes):
            part=b[pos:pos+size]
            pos+=size
            assert len(part)==size
            if name.startswith('__TEMP__/'):
              path=(Path(os.environ['RUNNER_TEMP']) /
                name.split('/')[-1])
            else:
              path=Path(name)
            assert not path.exists(),name
            path.parent.mkdir(parents=True,exist_ok=True)
            path.write_bytes(part)
          assert pos==len(b)
          print('R669_RESTORE_FULL_SHA_AND_5_FILES_PASS')
          PYCODE
          bash "$RUNNER_TEMP/R669CI.sh"
