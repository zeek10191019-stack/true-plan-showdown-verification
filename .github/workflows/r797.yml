      - name: Native original-resolution tile geometry and actual PNG Apple Vision
        if: matrix.lane == 'real-apple-vision'
        shell: bash
        run: |
          set -euo pipefail
          export R794_DIAGNOSTIC_DIR="$GITHUB_WORKSPACE/R796Proof"
          cd source/R720_PORTABLE_TESTS
          swift test --filter R794SourceTileDiagnosticsTests > "$GITHUB_WORKSPACE/R796Proof/TileSwift.log" 2>&1 || {
            tail -120 "$GITHUB_WORKSPACE/R796Proof/TileSwift.log"
            exit 1
          }
          cd ../..
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('R796Proof')
          for n in ('R794TileMoveVision.json','R794TileSelectionVision.json'):
              q=json.loads((p/n).read_text())
              assert q['tile_count']==2
              assert q['source_width']==2796 and q['source_height']==1290
              assert q['source_png_unchanged'] and not q['real_device_capture_certified']
              assert q['device_certified_fields']==0
              assert not q['auto_production_tile_ocr_enabled']
              assert len(q['rows'])==len(q['alternatives'])
              assert all(t['pixel_count']<=2_000_000 for t in q['tile_metrics'])
              assert all(t['language_correction']==False for t in q['tile_metrics'])
          m=json.loads((p/'R794TileMoveVision.json').read_text())
          s=json.loads((p/'R794TileSelectionVision.json').read_text())
          comparison={'baseline_revision':'R793','diagnostic_revision':'R794',
              'baseline_full_raster_projected_move_exact':1,
              'baseline_full_raster_selection_exact':4,
              'tile_projected_move_exact':m['projected_move_names_exact'],
              'tile_projected_pp_candidate_count':m['projected_pp_candidate_count'],
              'tile_selection_exact':len(s['selection_names_exact']),
              'no_dictionary_autocorrection':True,
              'device_certified_fields':0,'certification_gate_passed':False,
              'note':'Controlled fixture comparison; production fallback not enabled.'}
          (p/'R794_COMPARISON.json').write_text(json.dumps(comparison,indent=2))
          print(json.dumps(comparison,indent=2))
          PY

      - name: Compare bounded accurate OCR vs full accurate controls on two original real PNGs
        if: matrix.lane == 'real-apple-vision'
        shell: bash
        run: |
          set -euo pipefail
          export R795_TRIAGE_DIR="$GITHUB_WORKSPACE/R796Proof"
          cd source/R720_PORTABLE_TESTS
          swift test --filter R795RecognitionModeTriageTests \
            > "$GITHUB_WORKSPACE/R796Proof/AccurateModeSwift.log" 2>&1 || {
              tail -100 "$GITHUB_WORKSPACE/R796Proof/AccurateModeSwift.log"
              exit 1
            }
          swift test --filter R795CaptureDurationRegressionTests \
            > "$GITHUB_WORKSPACE/R796Proof/DurationSwift.log" 2>&1 || {
              tail -80 "$GITHUB_WORKSPACE/R796Proof/DurationSwift.log"
              exit 1
            }
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path('R796Proof')
          for name in ('R795MoveModeComparison.json','R795SelectionModeComparison.json'):
              assert (p/name).exists(),name
              data=json.loads((p/name).read_text())
              assert data['revision']=='R795'
              assert data['source_png_unchanged']
              assert data['device_certified_fields']==0
              assert not data['accurate_escalation_not_production_enabled']==False
              bounded=data['bounded_accurate']
              assert bounded['width']*bounded['height']<=2_000_000
              tiles=data['two_original_resolution_tiles_accurate']
              assert tiles['tile_count']==2
              assert len(tiles['tile_vision_ms'])==2
              for key in ('bounded_accurate','original_accurate_REFERENCE_ONLY',
                          'two_original_resolution_tiles_accurate'):
                  assert 'result' in data[key],(name,key)
              print(name,'bounded',bounded['result'],
                  'tiles',tiles['result'],'original control',
                  data['original_accurate_REFERENCE_ONLY']['result'])
          a=json.loads((p/'R795MoveModeComparison.json').read_text())
          b=json.loads((p/'R795SelectionModeComparison.json').read_text())
          assert a['original_accurate_REFERENCE_ONLY']['result']['pp_candidate_count']==4
          assert b['original_accurate_REFERENCE_ONLY']['result']['exact_team_count']==6
          (p/'R795_ACC_MODE_CAPTURE_GATE.txt').write_text(
              'R795 real PNG accurate comparison done; no live fallback, no IPA, 0/79 device\n')
          PY

