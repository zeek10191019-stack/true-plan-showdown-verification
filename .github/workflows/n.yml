jobs:
  verify:
    if: >-
      github.repository ==
      'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1520321dcb1e958ac51dbb3c052528d34b78abad
          fetch-depth: 1
      - name: Restore and test R667
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import os,base64,lzma,hashlib
          from pathlib import Path
          raw=lzma.decompress(base64.b85decode(''.join(
            os.environ['PACK'].split())))
          assert len(raw)==18955
          assert hashlib.sha256(raw).hexdigest()==(
            '0731d49d6bb7587ae7970273e194c441' +
            'ff4df2c24189ae95c24a2016d3d858a0')
          names=[
            'app/ios/ChampionsOnDevice/' +
            'R667ExpandedOCRFields.swift',
            'tests/R667ExpandedOCRSmoke.swift',
            'tools/r667_patch.py',
            '__TEMP__/r667-ci.sh',
          ]
          sizes=[
            11116,
            5778,
            890,
            1171,
          ]
          pos=0
          for name,size in zip(names,sizes):
            block=raw[pos:pos+size]
            pos+=size
            assert len(block)==size
            path=(Path(os.environ['RUNNER_TEMP'])/
              name.split('/')[-1]) if name.startswith(
              '__TEMP__/') else Path(name)
            assert not path.exists(),name
            path.parent.mkdir(parents=True,exist_ok=True)
            path.write_bytes(block)
          assert pos==len(raw)
          print('R667_SOURCE_RESTORE_PASS')
          PYCODE
          bash "$RUNNER_TEMP/r667-ci.sh"
