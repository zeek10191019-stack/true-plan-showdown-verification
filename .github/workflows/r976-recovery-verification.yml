name: R976 recovery and live readout
'on':
  push:
    branches: [r975-device-regression]
    paths: [.github/workflows/r976-recovery-verification.yml]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: r976-unsigned-device-test
  cancel-in-progress: false
jobs:
  verify:
    name: Swift, browser, PC and iPhoneOS regression
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && !github.event.repository.private && github.ref == 'refs/heads/r975-device-regression'
    runs-on: xcode-27
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RELEASE_TAG: r976-unsigned-device-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: .github/workflows/r976-recovery-verification.yml
      - name: Restore verified R975 and apply the R976 corrections
        shell: bash
        run: &restore |
          set -euo pipefail
          git show b63603a2f74918c42eb5e15a9a415edfafe01bb2:.github/workflows/r975-device-regression.yml > "$RUNNER_TEMP/r975-baseline.yml"
          echo '71eeb46fd25ec6860c88e94cfc5a8747a0174a880c60746755a7ed787b9e61fa  r975-baseline.yml' | (cd "$RUNNER_TEMP" && shasum -a 256 -c -)
          ruby -ryaml -e '
            steps = YAML.load_file(ARGV.fetch(0), aliases: true).fetch("jobs").fetch("verify").fetch("steps")
            puts steps.find { |step| step["name"] == "Restore pinned source and apply R975" }.fetch("run")
          ' "$RUNNER_TEMP/r975-baseline.yml" > "$RUNNER_TEMP/base-restore.sh"
          bash "$RUNNER_TEMP/base-restore.sh"
          python3 - "$RUNNER_TEMP/r976.patch" <<'PAYLOAD'
