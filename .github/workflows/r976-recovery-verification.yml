          data = (json.dumps(files,sort_keys=True,indent=2)+'\n').encode()
          assert hashlib.sha256(data).hexdigest() == 'b4c9b9c1edbc888c55d9939de64160598e434a596cb8dadfd226c45897dc46a3'
