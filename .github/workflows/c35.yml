name: R1035 C35 fixed shell + transfer pin race (NO IPA)
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/c35.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    name: ${{ matrix.job }}
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
        - job: macos-source
          os: xcode-27
        - job: windows-cli
          os: windows-2025
        - job: windows-receiver
          os: windows-2025
        - job: macos-sender
          os: xcode-27
        - job: windows-hud
          os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
    - name: Run pinned C34 and C35 regression via fixed shell
      shell: bash
      env:
        C33_JOB: ${{ matrix.job }}
        GH_TOKEN: ${{ github.token }}
        PYTHONUTF8: '1'
      run: |
        set -Eeuo pipefail
        if [[ "$RUNNER_OS" == Windows ]]; then PY=python; else PY=python3; fi
        "$PY" - <<'C35_PY'
        import os, pathlib, hashlib, urllib.request, subprocess, sys, base64, zlib
        h=lambda b:hashlib.sha256(b).hexdigest()
        url='https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/c759f0efa78bf51093953d847691a80ea2d2aa5d/.github/workflows/c34.yml'
        with urllib.request.urlopen(url,timeout=60) as response: raw=response.read(100000)
        assert h(raw)=='f2ec8a3dc1c03a8760f6bfe24aed0be33667bd50b769b1c223db594a065106c6'
        body=raw.decode().split('\n      run: |\n',1)[1].split('\n  gate:\n',1)[0]
        code='\n'.join(line[8:] for line in body.splitlines())+'\n'
        assert h(code.encode())=='182974bc8914ce66c1a2183e08bf70d82afe2a36c867e7031a97cddc349ef0f1'
        tmp=pathlib.Path(os.environ['RUNNER_TEMP'])
        patch=zlib.decompress(base64.b64decode(''));assert h(patch)=='1be48c8070fb340a143cde801dbc9ae6f3499419f28e02e36ef0dfc05bc08736'
        (tmp/'c35-stage.py').write_bytes(patch)
        anchor="    f=root/('c33-step-'"
        assert code.count(anchor)==1
        insertion = '    if job==\'macos-sender\':\n        mark=\'swiftc -swift-version 6 R1029TransferClient.swift R1032TransferStage.swift stage_probe.swift -o stage_probe\'\n        assert run.count(mark)==1\n        run=run.replace(mark,\'python3 "$RUNNER_TEMP/c35-stage.py" sender .\\n\'+mark)\n    if job==\'macos-source\' and i==13:\n        run=\'set -Eeuo pipefail\\npython3 "$RUNNER_TEMP/c35-stage.py" native "$RUNNER_TEMP/c6-objects/pinned-r793/source"\\n\'+run\n'
        code=code.replace(anchor,insertion+anchor)
        runner=tmp/'c35-runner.py';runner.write_text(code,encoding='utf-8')
        subprocess.run([sys.executable,str(runner)],check=True)
        C35_PY
  gate:
    needs:
    - verify
    if: always() && github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
    - name: 'Gate: every automated job must pass; no IPA or physical certification'
      shell: bash
      run: |
        set -Eeuo pipefail
        [[ '${{ needs.verify.result }}' == success ]]
        echo C35_AUTOMATED_GATE_PASS_UI_BACKGROUND_PHYSICAL_IPA_HOLD
