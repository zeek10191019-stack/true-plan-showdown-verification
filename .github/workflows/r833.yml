      working-directory: pinned-r793
      run: "set -euo pipefail\npython3 - <<'R826_XCODE_PY'\nfrom pathlib import Path\nimport hashlib,json,subprocess,sys\n\
        root=Path('source');sha=lambda b:hashlib.sha256(b).hexdigest()\nignore={'.build','__pycache__','.swiftpm'}\n\
        def source_sha():\n    manifest=json.loads((root/'source_manifest.json').read_text())\n    fs={str(p.relative_to(root)):p\
        \ for p in root.rglob('*') if p.is_file() and not any(x in p.parts for x in ignore)}\n    assert len(fs)==596\
        \ and set(fs)==set(manifest)|{'source_manifest.json'}\n    assert all(sha(fs[n].read_bytes())==h for\
        \ n,h in manifest.items())\n    return sha(''.join(n+'\\t'+sha(fs[n].read_bytes())+'\\n' for n in sorted(fs)).encode())\n\
        expected=Path('R833Proof/SOURCE_TREE_SHA256.txt').read_text().strip()\nassert source_sha()==expected,'R826_PRE_XCODE_DRIFT'\n\
        subprocess.run([sys.executable,'source/tools/generate_xcode_project.py'],check=True)\nassert source_sha()==expected,'R826_POST_XCODE_DRIFT'\n\
