name: R741 Verified Compact Hunk Delivery - Not Device Certified
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/e1.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
    - name: Restore pinned R740 then apply R741 no-delete delta
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
       set -euo pipefail
       url='https://api.github.com/repos/'
       url+='zeek10191019-stack/'
       url+='true-plan-showdown-verification/'
       url+='actions/artifacts/13745096166/zip'
       curl -fLsS --retry 2 -H "Authorization: Bearer $GH_TOKEN" \
        -H 'Accept: application/vnd.github+json' \
        "$url" -o /tmp/r741-base.zip
       mkdir -p source R741Artifacts
       python3 - <<'PYTHON'
       import base64,hashlib,io,json,lzma,pathlib,zipfile
       root=pathlib.Path('source')
       digest=lambda b:hashlib.sha256(b).hexdigest()
       with zipfile.ZipFile('/tmp/r741-base.zip') as outer:
        assert outer.testzip() is None
        base=outer.read('R740_ALL_EDITABLE_SOURCE_RECOVERY.zip')
       assert digest(base)==(
        '6142eda5826809869256d9dfb0337b6f55322fdb5559fcccc639af1ba636476d')
       with zipfile.ZipFile(io.BytesIO(base)) as z:
        assert z.testzip() is None and len(z.namelist())==345
        for name in z.namelist():
         rel=pathlib.PurePosixPath(name)
         assert not rel.is_absolute() and '..' not in rel.parts
         out=root.joinpath(*rel.parts)
         out.parent.mkdir(parents=True,exist_ok=True)
