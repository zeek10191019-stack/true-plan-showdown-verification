name: R617-R620 Batch - Rotation OCR & Readout Candidates (No IPA)
"on":
  push:
    branches: [main]
    paths: [.github/workflows/bi.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trueplan-r617batch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
      && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 55
    env:
      PYTHONOPTIMIZE: "0"
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
    steps:
      - name: Restore SHA pinned R616 and patch Apple-only fixture variability
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'R617_REPLAY'
          import base64,hashlib,lzma,textwrap,urllib.request
          from pathlib import Path
          url=(
            'https://raw.githubusercontent.com/'
            'zeek10191019-stack/true-plan-showdown-verification/'
            '57ffb50e1fdf9726c424881e3e3524b080ef9efe/'
            '.github/workflows/bh.yml'
          )
          parent=urllib.request.urlopen(url,timeout=90).read()
          assert len(parent)==17001,'R616_PARENT_SIZE_DRIFT'
          assert hashlib.sha256(parent).hexdigest()==(
            '632c9868643b9ff21afb140d76c65c931a064778bedd30c86ff5e78f7563c41d'
          ),'R616_PARENT_SHA_DRIFT'
          data=parent.decode('utf-8')
          begin="          python3 - <<'R613_REPLAY'\n"
          end="\n          R613_REPLAY"
          assert data.count(begin)==1 and data.count(end)==1
          nested=textwrap.dedent(data.split(begin,1)[1].split(end,1)[0])
          exec(compile(nested,'R616_PINNED_REPLAY','exec'),{'__name__':'__main__'})
          root=Path('app/ios/ChampionsOnDevice')
