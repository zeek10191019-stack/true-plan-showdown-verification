          'use strict';
          /** R27.274. Diagnostic-only 2x2 policy composition over PUBLIC observations.
           * We hold benchmark conditions fixed and replace ONE component at a time.
           * This is not a trained improvement, and its H2H is NOT independent holdout.
           */
          const {digest}=require('./paired_benchmark.cjs');
          const VERSION='r27.274.policy-ablation.v1';
          const VARIANTS=Object.freeze([
            Object.freeze({name:'P0T0_BASE',preview:'tactical',turn:'tactical'}),
            Object.freeze({name:'P1T0_PREVIEW_ONLY',preview:'greedy',turn:'tactical'}),
            Object.freeze({name:'P0T1_TURN_ONLY',preview:'tactical',turn:'greedy'}),
            Object.freeze({name:'P1T1_BOTH_DIAGNOSTIC',preview:'greedy',turn:'greedy'}),
          ]);
          const assert=(ok,tag)=>{if(!ok)throw Error(`R27_274_${tag}`)};
          const key=x=>`${x.opponent}|${x.fixture}|${x.seedIndex}|${x.tacticalSide}`;
          function buildComposite(tactical,greedy,variant){
           assert(tactical&&greedy&&typeof tactical.scorePreview==='function'&&typeof tactical.decide==='function'&&typeof greedy.scorePreview==='function'&&typeof greedy.decide==='function','POLICY_MISSING');
           assert(variant&&VARIANTS.some(x=>x.name===variant.name&&x.preview===variant.preview&&x.turn===variant.turn),'UNKNOWN_VARIANT');
           const p=variant.preview==='tactical'?tactical:greedy;
           const t=variant.turn==='tactical'?tactical:greedy;
           return Object.freeze({id:`${VERSION}.${variant.name}`,
             scorePreview(obs){return p.scorePreview(obs)},
             decide(obs,legal){return t.decide(obs,legal)},
           });
          }
          const point=r=>r.result==='win'?1:r.result==='draw'?0.5:r.result==='loss'?0:null;
          function contrasts(results){
           assert(results&&typeof results==='object'&&VARIANTS.every(v=>Array.isArray(results[v.name])),'VARIANT_RECORDS_MISSING');
           const base=results.P0T0_BASE,byVariant={};
           const baseKeys=base.map(key);const distinct=new Set(baseKeys);
           assert(base.length===96&&distinct.size===96,'BASELINE_CONFIG');
           for(const v of VARIANTS){
            const rows=results[v.name],map=new Map(rows.map(r=>[key(r),r]));
            assert(rows.length===base.length&&map.size===base.length&&baseKeys.every(k=>map.has(k)),'CONFIG_DRIFT');
            assert(base.every(r=>map.get(key(r)).seed.join(',')===r.seed.join(',')),'SEED_DRIFT');
            const count={wins:0,losses:0,draws:0,timeouts:0},changes={improved:0,worsened:0,unchanged:0,unscored:0};
            const focus={wins:0,losses:0,draws:0,timeouts:0,baseWins:0,baseLosses:0,improved:0,worsened:0,unchanged:0};
            let score=0,baseScore=0;
            for(const original of base){
             const r=map.get(key(original));
             assert(['win','loss','draw','timeout'].includes(r.result),'BAD_RESULT');
             count[r.result==='win'?'wins':r.result==='loss'?'losses':r.result==='draw'?'draws':'timeouts']++;
             const a=point(r),b=point(original);
             const relation=a===null||b===null?'unscored':a>b?'improved':a<b?'worsened':'unchanged';
             changes[relation]++;
             if(a!==null&&b!==null){score+=a;baseScore+=b}
             if(original.opponent==='greedy-coverage'&&original.fixture==='mirror-b'){
               focus[r.result==='win'?'wins':r.result==='loss'?'losses':r.result==='draw'?'draws':'timeouts']++;
               if(original.result==='win')focus.baseWins++;else if(original.result==='loss')focus.baseLosses++;
               if(relation!=='unscored')focus[relation]++;
             }
            }
            byVariant[v.name]={...count,scorePerScheduled:score/base.length,deltaScorePerScheduled:(score-baseScore)/base.length,
             transitions:changes,focusMirrorBGreedy:focus,resultsDigest:digest(rows)};
           }
           return Object.freeze({version:VERSION,totalVariants:VARIANTS.length,scheduledPerVariant:96,
            totalScheduled:96*VARIANTS.length,byVariant,baselineDigest:byVariant.P0T0_BASE.resultsDigest});
          }
          module.exports={VERSION,VARIANTS,buildComposite,key,point,contrasts};
          R27_274_EOF_0
          printf "%s  %s\n" a509d9e7992b39b25b719ede7ba5a42688e4805445e95070fd5b0ca24713d582 policy_ablation.cjs | sha256sum -c -
