          }
          test('variant with changed plan rejected',()=>assert.throws(()=>buildComposite(tactical,greedy,{...VARIANTS[0],turn:'greedy'}),/UNKNOWN_VARIANT/));
          test('unknown variant rejected',()=>assert.throws(()=>buildComposite(tactical,greedy,{name:'x'}),/UNKNOWN_VARIANT/));
          test('missing policy rejected',()=>assert.throws(()=>buildComposite({},greedy,VARIANTS[0]),/POLICY_MISSING/));
          const plan=schedule({fixtures:['mirror-a','mirror-b','asym-a-b','asym-b-a'],opponents:['greedy-coverage','defensive-pivot'],seedCount:6});
          const mk=(r='win')=>plan.map((p,i)=>({...p,result:r,actionsDigest:String(i)}));
          const ok=Object.fromEntries(VARIANTS.map(v=>[v.name,mk()]));
          test('96 immutable conditions',()=>assert.equal(new Set(plan.map(key)).size,96));
          test('all four 96-matches',()=>assert.equal(contrasts(ok).totalScheduled,384));
          test('all wins has zero deltas',()=>{const x=contrasts(ok);assert(VARIANTS.every(v=>x.byVariant[v.name].deltaScorePerScheduled===0))});
          test('focused baseline 12 matches',()=>assert.equal(contrasts(ok).byVariant.P0T0_BASE.focusMirrorBGreedy.wins,12));
          test('focused isolated improvement',()=>{const o=Object.fromEntries(VARIANTS.map(v=>[v.name,mk()]));const i=o.P0T0_BASE.findIndex(x=>x.fixture==='mirror-b'&&x.opponent==='greedy-coverage');o.P0T0_BASE[i]={...o.P0T0_BASE[i],result:'loss'};const z=contrasts(o).byVariant.P1T0_PREVIEW_ONLY;assert.equal(z.focusMirrorBGreedy.improved,1);assert.equal(z.deltaScorePerScheduled,1/96)});
          test('worsened flagged',()=>{const o=Object.fromEntries(VARIANTS.map(v=>[v.name,mk()]));o.P0T1_TURN_ONLY[2]={...o.P0T1_TURN_ONLY[2],result:'loss'};assert.equal(contrasts(o).byVariant.P0T1_TURN_ONLY.transitions.worsened,1)});
          test('timeout separate and unscored',()=>{const o=Object.fromEntries(VARIANTS.map(v=>[v.name,mk()]));o.P1T1_BOTH_DIAGNOSTIC[2]={...o.P1T1_BOTH_DIAGNOSTIC[2],result:'timeout'};const z=contrasts(o).byVariant.P1T1_BOTH_DIAGNOSTIC;assert.equal(z.timeouts,1);assert.equal(z.transitions.unscored,1)});
          test('missing row rejected',()=>{const o=Object.fromEntries(VARIANTS.map(v=>[v.name,mk()]));o.P1T1_BOTH_DIAGNOSTIC.pop();assert.throws(()=>contrasts(o),/CONFIG_DRIFT/)});
          test('tampered seed rejected',()=>{const o=Object.fromEntries(VARIANTS.map(v=>[v.name,mk()]));o.P1T0_PREVIEW_ONLY[0]={...o.P1T0_PREVIEW_ONLY[0],seed:[0,0,0,0]};assert.throws(()=>contrasts(o),/SEED_DRIFT/)});
          test('unknown outcome rejected',()=>{const o=Object.fromEntries(VARIANTS.map(v=>[v.name,mk()]));o.P1T0_PREVIEW_ONLY[0]={...o.P1T0_PREVIEW_ONLY[0],result:'unknown'};assert.throws(()=>contrasts(o),/BAD_RESULT/)});
          test('duplicated key rejected',()=>{const o=Object.fromEntries(VARIANTS.map(v=>[v.name,mk()]));o.P1T0_PREVIEW_ONLY[0]=o.P1T0_PREVIEW_ONLY[1];assert.throws(()=>contrasts(o),/CONFIG_DRIFT/)});
