name: R594 Actor Appearance Audit aj (No IPA)
"on":
  push:
    paths: [.github/workflows/aj.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
      PYTHONOPTIMIZE: "0"
    steps:
      - name: Restore SHA-pinned R593 and apply R594 exact delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'R594_REPLAY'
          import ast,base64,hashlib,json,lzma,re,textwrap,urllib.request
          from pathlib import Path
          H=lambda b:hashlib.sha256(b).hexdigest()
          url="https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/fc7a6071edd52c4c72da1c202abd88ad3c646b0d/.github/workflows/ah.yml"
          raw=urllib.request.urlopen(url,timeout=90).read()
          blob=hashlib.sha1(b"blob "+str(len(raw)).encode()+bytes([0])+raw).hexdigest()
          assert len(raw)==14059 and blob=="06eef8ad73f6fe67e49cc3d802e6af8505fe0d65","R594_R593_PIN_ERROR"
          match=re.search(r"python3 - <<'R593_REPLAY'\n(.*?)\n\s+R593_REPLAY",raw.decode(),re.S)
          assert match,"R594_R593_PARENT_SCRIPT_MISSING"
          parent=textwrap.dedent(match.group(1));ast.parse(parent)
          exec(compile(parent,'R593_PINNED_REPLAY','exec'))
          delta=json.loads(lzma.decompress(base64.b64decode("")))
          assert delta['schema']=='trueplan.r594.delta.v1' and delta['parent']=='R593'
          assert len(delta['files'])==3
          updates=[]
          for r in delta['files']:
           path=Path(r['path']);before=path.read_bytes() if path.exists() else None
           assert (H(before) if before is not None else None)==r['old_sha256'],('R594_PARENT_MISMATCH',r['path'])
           assert (len(before) if before is not None else None)==r['old_bytes']
           if r['mode']=='new_file':
            assert before is None;data=base64.b64decode(r['data_b64'],validate=True)
           else:
            assert r['mode']=='multi_spans' and before is not None
            data=before
            for edit in reversed(r['edits']):
             k=edit['start'];n=edit['remove'];assert 0<=k<=k+n<=len(before)
             data=data[:k]+base64.b64decode(edit['data_b64'],validate=True)+data[k+n:]
           assert len(data)==r['new_bytes'] and H(data)==r['new_sha256'],('R594_SHA_FAIL',r['path'])
           updates.append((path,data))
          for path,data in updates:
           path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data)
          assert len(list(Path('app/ios/ChampionsOnDevice').glob('*.swift')))==135
          print('R594_PINNED_3_SHA_MATCH_PASS')
          R594_REPLAY
      - name: Swift actor visual comparisons and existing native Apple build
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse app/ios/ChampionsOnDevice/*.swift
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R594ActorAppearance.swift tests/R594ActorAppearanceHarness.swift -o "$RUNNER_TEMP/r594-test"
          "$RUNNER_TEMP/r594-test"
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R593VisualChangeEvidence.swift tests/R593VisualChangeEvidenceHarness.swift -o "$RUNNER_TEMP/r593-test"
          "$RUNNER_TEMP/r593-test"
          python3 tools/run_r571_native.py || { for f in reports/xcode_iphoneos_build.log reports/r574_png_replay_compile.log; do [ ! -f "$f" ] || grep -nE 'error:|fatal error|BUILD FAILED' "$f" | tail -n 65 || true; done; exit 1; }
          echo 'R594 native build tested; species, Mega identity, side, real-game accuracy NOT CERTIFIED; no IPA.'
