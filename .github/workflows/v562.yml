      - name: "Restore pinned R561 reference and verify every R562 input"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'RESTORE_MACOS26'
          import base64,hashlib,json,lzma,sys
          from pathlib import Path
          folder=Path('.r562_overlay');parts=[f'part_{i:04d}' for i in range(4)]
          assert sorted(p.name for p in folder.iterdir())==parts,'R562_PART_SET'
          compressed=base64.b64decode(b''.join((folder/n).read_bytes() for n in parts),validate=True)
          decoder=lzma.LZMADecompressor();data=decoder.decompress(compressed,max_length=1000001)
          assert len(data)==101227 and decoder.eof and not decoder.unused_data,'R562_PAYLOAD_BOUND'
          assert hashlib.sha256(data).hexdigest()=='4dba2be88f4c5a376f99cb2044160c6c308f69b0d42b795e5ca5699c43233c97','R562_PAYLOAD_SHA'
          bundle=json.loads(data)
          assert set(bundle)=={'source','bootstrap'} and set(bundle['bootstrap'])==set(['runtime_reference_source.py', 'source_guard_payload.py', 'r561_reference_source.py', 'r562_source_overlay.py']),'R562_BOOTSTRAP_SET'
          bootstrap=folder/'bootstrap';bootstrap.mkdir(exist_ok=False)
          for name,text in bundle['bootstrap'].items():
              assert isinstance(text,str) and len(text)<30000,'R562_BOOTSTRAP_BOUND'
              with (bootstrap/name).open('x') as stream:stream.write(text)
          sys.path.insert(0,str(bootstrap))
          from r562_source_overlay import restore_current
          restore_current(Path.cwd(),bundle['source'])
          print('R562_COMPLETE_INPUT_CLOSURE_VERIFIED; NATIVE_EXECUTION_NOT_YET_PERFORMED')
          RESTORE_MACOS26
      - name: "Run native clock, evidence, actual macOS26 Vision and iPhoneOS27 cross-build checks"
        shell: bash
        run: |
          python3 tools/run_macos_checks.py
      - name: "Return verification evidence after success or failure; no artifacts/cache"
        if: always()
        shell: bash
        run: |
          python3 - <<'RETURN_MACOS26'
          from pathlib import Path
          import base64,hashlib,io,zipfile
          buffer=io.BytesIO()
          with zipfile.ZipFile(buffer,'w',compression=zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(Path('reports').glob('*')):
                  if path.suffix in ('.json','.log') and path.stat().st_size<2000000:archive.write(path,path.name)
          data=buffer.getvalue();encoded=base64.b85encode(data).decode()
          print('R562_REPORT_B85_BEGIN',hashlib.sha256(data).hexdigest(),len(data))
          for i in range(0,len(encoded),500):print('R562_REPORT_B85',encoded[i:i+500])
          print('R562_REPORT_B85_END')
          print('MACOS26_NATIVE_OCR_AND_IPHONEOS27_CROSS_BUILD_ONLY; IOS_RUNTIME_GAME_DEVICE_UNCERTIFIED; NO_IPA')
          RETURN_MACOS26
