jobs:
  verify:
    if: >-
      github.repository ==
      'zeek10191019-stack/true-plan-showdown-verification'
      && github.ref == 'refs/heads/main'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      PYTHONOPTIMIZE: '0'
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
    steps:
    - uses: actions/checkout@v4
      with:
        ref: f7d141b4ee837062657b2842f70fa4a6c71a167a
        persist-credentials: true
    - name: Two sign motion gate and iPhoneOS build
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os,base64,lzma,hashlib
        from pathlib import Path
        raw=lzma.decompress(base64.b85decode(''.join(
          os.environ['PACK'].split())))
        assert len(raw)==21776
        assert hashlib.sha256(raw).hexdigest()==(
          'd51f34483254f81c83114ea2be0c0a68' +
          '68f581136c29924de658ce38055f9983')
        names=[
          'app/ios/ChampionsOnDevice/' +
          'R663RelativeMotionAudit.swift',
          'tests/R663RelativeMotionHarness.swift',
          'tools/r663_patch.py',
          'research/R663_README.md',
          '__TEMP__/r663-run.sh',
        ]
        sizes=[
          9944,
          6987,
          1666,
          1558,
          1621,
        ]
        pos=0
        for name,size in zip(names,sizes):
          chunk=raw[pos:pos+size]
          pos+=size
          assert len(chunk)==size
          p=(Path(os.environ['RUNNER_TEMP'])/
             name.split('/')[-1]) if name.startswith(
             '__TEMP__/') else Path(name)
          assert not p.exists(),name
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_bytes(chunk)
        assert pos==len(raw)
        PY
        bash "$RUNNER_TEMP/r663-run.sh"
