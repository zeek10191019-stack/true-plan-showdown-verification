# R27.479 COMPACT / iPhone upload single YAML. Not a ZIP delivery.
# R27.478 base is immutable commit+Git blob SHA-1 pinned; patch R27.479 SHA-256 pinned.
# Research only: automatic battle recommendations disabled and no formal Stage/Gate update.
name: R480 iOS build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r27479-mobile-fix-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false && github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - name: Verify and restore immutable successful R27.478 build source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib, re, subprocess, urllib.request
          from pathlib import Path
          url='https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/7d539da78c4b1b41fdbd1b667f833e26dbe24697/.github/workflows/R27478_work_ios.yml'
          request=urllib.request.Request(url,headers={'User-Agent':'TruePlan-R27479-Compact-Immutable-Source','Accept':'text/plain'})
          with urllib.request.urlopen(request,timeout=50) as response:
              body=response.read(200001)
          assert 80000<len(body)<200001,'FAIL_CLOSED: R27478 baseline carrier length'
          sha1=hashlib.sha1(b'blob '+str(len(body)).encode()+b'\0'+body).hexdigest()
          assert sha1=='f2083d689f9b28f09d9939f1469dacdc527da56b','FAIL_CLOSED: pinned R27478 Git blob mismatch'
          source=body.decode('utf-8')
          Path('R27478_PINNED_REFERENCE.yml').write_bytes(body)
          # Only the eight *known* standalone shell steps from R27.478.
          # Never execute YAML of another version, a moving branch or unknown steps.
          expected=[
            'Restore pinned R27465 research source and verify byte closure',
            'Integrate strict HP safety into iOS research app',
            'Add own HP split digit diagnostic (R27.472)',
            'Add observation freshness and provenance fence (R27.473)',
            'Add selected frame continuity monitor (R27.474)',
            'Attach R27.475 raw ScreenCaptureKit callback delivery history',
            'Attach R27.476 sample PTS relative clock audit and diagnostic UI',
            'R27.478 integrate unified audit with pre-epoch archival'
          ]
          parts=re.split(r'(?m)^      - name: ',source)
          sections={}
          for part in parts[1:]:
              name=part.split('\n',1)[0]
              match=re.search(r'(?m)^        run: \|\n',part)
              if match is None: continue
              block=part[match.end():]
              lines=[]
              for line in block.splitlines():
                  if line.startswith('          '): lines.append(line[10:])
                  elif not line.strip(): lines.append('')
                  else: break
              sections[name]='\n'.join(lines)+'\n'
          assert len(sections)==10, 'FAIL_CLOSED: R27478 workflow shell step count'
          assert list(sections)[:8]==expected, 'FAIL_CLOSED: R27478 execution order changed'
          for name in expected:
              code=sections[name]
              assert code.startswith('set -euo pipefail\n')
              subprocess.run(['bash','-n'],input=code,text=True,check=True)
              print('RUN_PINNED_R27478_STEP='+name,flush=True)
              subprocess.run(['bash','-e','-o','pipefail'],input=code,text=True,check=True)
          assert len(list(Path('ios/ChampionsOnDevice').glob('*.swift')))==43, 'FAIL_CLOSED: R27478 source count'
          print('R27479_PINNED_RESTORATION_AND_ALL_PRIOR_INTEGRATIONS=PASS')
          PYCODE
      - name: R27.479 fix capture session provenance and double start
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import base64,hashlib,io,stat,subprocess,sys,zipfile
          from pathlib import Path,PurePosixPath
          data=base64.b64decode('',validate=True)
          assert hashlib.sha256(data).hexdigest()=='29464ce310de776f041bc2f3b14361872726304e1b07d95947bcfad5c031a1ab','FAIL_CLOSED: R27479 patch SHA'
          allowed={'R27479_ADDON/src/ResearchUnifiedTelemetryBundle.swift',
                   'R27479_ADDON/tools/integrate_r27479.py',
                   'R27479_ADDON/tests/main.swift',
                   'R27479_ADDON/tests/test_patch_integration.py'}
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert z.testzip() is None,'FAIL_CLOSED: R27479 patch CRC'
              members=z.infolist()
              assert len(members)==4 and {m.filename for m in members}==allowed,'FAIL_CLOSED: unknown members'
              for m in members:
                  p=PurePosixPath(m.filename)
                  assert not p.is_absolute() and '..' not in p.parts and not stat.S_ISLNK((m.external_attr>>16)&0xffff)
                  assert 0<m.file_size<150000
              z.extractall('.')
          ios=Path('ios/ChampionsOnDevice')
          expected={'CaptureCoordinator.swift':'df8f095df784aad4877effe4ade26fb5b1fe0fd48f9dea19a8cf08005cb62953',
                    'ResearchUnifiedTelemetryBundle.swift':'09a45628d19334c2e777800dfb9090b9780f706481a74b39fbbf925baaaa0a88'}
          assert len(list(ios.glob('*.swift')))==43,'FAIL_CLOSED: R27478 source count'
          for name,digest in expected.items():
              assert hashlib.sha256((ios/name).read_bytes()).hexdigest()==digest,'FAIL_CLOSED: preimage '+name
          subprocess.run([sys.executable,'R27479_ADDON/tools/integrate_r27479.py'],check=True)
          assert len(list(ios.glob('*.swift')))==43
          print('R27479_SOURCE_PATCH_SHA256=29464ce310de776f041bc2f3b14361872726304e1b07d95947bcfad5c031a1ab')
          print('R27479_CAPTURE_SCOPE_SOURCE_PATCH=PASS')
          PYCODE
      - name: Full R27.478 baseline regression and new R27.479 tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib,re,subprocess
          from pathlib import Path
          body=Path('R27478_PINNED_REFERENCE.yml').read_bytes()
          sha1=hashlib.sha1(b'blob '+str(len(body)).encode()+b'\0'+body).hexdigest()
          assert sha1=='f2083d689f9b28f09d9939f1469dacdc527da56b'
          section=body.decode('utf-8').split('      - name: Native tests and Swift parsing\n',1)[1].split('      - name: Build unsigned iPhoneOS app and repair IPA packaging\n',1)[0]
          marker='        run: |\n'
          assert section.count(marker)==1
          script='\n'.join(x[10:] for x in section.split(marker,1)[1].splitlines() if x.startswith('          '))+'\n'
          assert script.startswith('set -euo pipefail\n') and 'R27478_SWIFT_PARSE_PASS=' in script
          subprocess.run(['bash','-n'],input=script,text=True,check=True)
          subprocess.run(['bash','-e','-o','pipefail'],input=script,text=True,check=True)
          PYCODE
          swiftc ios/ChampionsOnDevice/ResearchUnifiedTelemetryBundle.swift R27479_ADDON/tests/main.swift -o "$RUNNER_TEMP/r27479_session"
          "$RUNNER_TEMP/r27479_session" | grep -E 'R27479_CAPTURE_SESSION_NATIVE_ASSERTIONS_PASS=22'
          # The original CI test file references the developer's /mnt/data tree.
          # Patch ONLY test-harness path constants after validating the pinned archive.
          # All production Swift and source SHA checks are unchanged.
          python3 - <<'PYCODE'
          import hashlib
          from pathlib import Path
          p=Path('R27479_ADDON/tests/test_patch_integration.py')
          raw=p.read_text()
          old_constants={
            "BASE=Path('/mnt/data/R27478_WORK/R27478_ADDON')": "BASE=Path.cwd().resolve()/'R27478_ADDON'",
            "PATCH=Path('/mnt/data/R27479_WORK/R27479_ADDON/tools/integrate_r27479.py')": "PATCH=Path.cwd().resolve()/'R27479_ADDON/tools/integrate_r27479.py'",
            "SWIFT=Path('/mnt/data/R27479_WORK/R27479_ADDON/src/ResearchUnifiedTelemetryBundle.swift')": "SWIFT=Path.cwd().resolve()/'R27479_ADDON/src/ResearchUnifiedTelemetryBundle.swift'",
          }
          assert len(old_constants)==3
          for source, replacement in old_constants.items():
              assert raw.count(source)==1, 'FAIL_CLOSED: unexpected test anchor '+source
              raw=raw.replace(source,replacement,1)
          assert '/mnt/data/' not in raw, 'FAIL_CLOSED: residual absolute developer path'
          assert Path('R27478_ADDON/tests/test_patch_integration.py').is_file(), 'FAIL_CLOSED: baseline test unavailable'
          assert Path('R27478_ADDON/tools/integrate_r27478.py').is_file(), 'FAIL_CLOSED: baseline integration unavailable'
          p.write_text(raw)
          print('R27479_PORTABLE_TEST_HARNESS_PATCH=PASS')
          PYCODE
          python3 -m unittest discover -s R27479_ADDON/tests -p 'test_*.py' -q
          echo 'R27479_SESSION_PATCH_TESTS_PASS=12'
          python3 - <<'PYCODE'
          from pathlib import Path
          import subprocess
          files=sorted(Path('ios/ChampionsOnDevice').glob('*.swift'))
          assert len(files)==43, 'FAIL_CLOSED: source files changed'
          for f in files: subprocess.run(['swiftc','-frontend','-parse',str(f)],check=True)
          print('R27479_SWIFT_PARSE_PASS=43')
          PYCODE
      - name: R27.480 enforce predecessor epoch and uptime monotonicity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import base64, hashlib, zlib
          from pathlib import Path
          src=Path('ios/ChampionsOnDevice/ResearchUnifiedTelemetryBundle.swift')
          assert src.is_file(), 'FAIL_CLOSED: R27.479 bundle missing'
          actual=hashlib.sha256(src.read_bytes()).hexdigest()
          assert actual=='ad0a13d620966a9275413906bb15a125b93133159666cbbf28f42d9e5caaaded', 'FAIL_CLOSED: pinned R27.479 source mismatch'
          new=zlib.decompress(base64.b64decode('', validate=True))
          assert hashlib.sha256(new).hexdigest()=='640e58d1e6579b007b1c524773ed0c600cb8ff3aabaf371358c434134d5249b4','FAIL_CLOSED: patch bytes mismatch'
          assert len(new)<15000 and len(list(src.parent.glob('*.swift')))==43, 'FAIL_CLOSED: source count or patch size'
          assert 'captureSessionTag: captureAuditSessionTag' in Path('ios/ChampionsOnDevice/CaptureCoordinator.swift').read_text(),'FAIL_CLOSED: capture scope not installed'
          # Prevent arbitrary modifications: old source must survive byte-for-byte except the exact audited guard.
          old=src.read_text()
          old_start=old.index('        if let prior = previousEpochJSON, let obj = object(prior) {')
          new_text=new.decode('utf-8')
          new_start=new_text.index('        if let prior = previousEpochJSON, let obj = object(prior) {')
          old_end=old.index('        guard JSONSerialization.isValidJSONObject(envelope)',old_start)
          new_end=new_text.index('        guard JSONSerialization.isValidJSONObject(envelope)',new_start)
          assert old[:old_start]==new_text[:new_start] and old[old_end:]==new_text[new_end:], 'FAIL_CLOSED: non-guard source mutation'
          src.write_bytes(new)
          print('R27480_AUDITED_PREDECESSOR_PATCH=PASS')
          PYCODE
          mkdir -p R27480_NATIVE
          python3 - <<'PYCODE'
          import base64,hashlib,zlib
          from pathlib import Path
          b=zlib.decompress(base64.b64decode('',validate=True))
          assert hashlib.sha256(b).hexdigest()=='e27c09014f8459fe2733c2fdc9a0e7259c7c320e0796e4e87af1b4c63f2a224e', 'FAIL_CLOSED: R27.480 native test integrity'
          Path('R27480_NATIVE/main.swift').write_bytes(b)
          PYCODE
          swiftc ios/ChampionsOnDevice/ResearchUnifiedTelemetryBundle.swift R27480_NATIVE/main.swift -o "$RUNNER_TEMP/r27480_native"
          "$RUNNER_TEMP/r27480_native" | grep -E 'R27480_PREDECESSOR_NATIVE_ASSERTIONS_PASS=47'
          python3 - <<'PYCODE'
          import subprocess
          from pathlib import Path
          sources=sorted(Path('ios/ChampionsOnDevice').glob('*.swift'))
          assert len(sources)==43, 'FAIL_CLOSED: unexpected Swift source count'
          for src in sources: subprocess.run(['swiftc','-frontend','-parse',str(src)],check=True)
          print('R27480_SWIFT_PARSE_PASS=43')
          PYCODE
      - name: Build unsigned iPhoneOS app and repair IPA packaging
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          test -d "$sdk/System/Library/Frameworks/ScreenCaptureKit.framework"
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate --spec ios/project.yml --project ios
          if ! xcodebuild -project ios/ChampionsOnDeviceResearch.xcodeproj -scheme ChampionsOnDeviceResearch \
                 -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' \
                 ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
                 -derivedDataPath "$RUNNER_TEMP/r27480-derived" build > "$RUNNER_TEMP/r27479-build.log" 2>&1; then
            grep -E 'error:|BUILD FAILED' "$RUNNER_TEMP/r27479-build.log" | tail -40 || true
            exit 1
          fi
          echo 'R27480_IPHONEOS_UNSIGNED_COMPILE=PASS'
          python3 - <<'PYCODE'
          import hashlib, os, plistlib, subprocess, zipfile
          from pathlib import Path, PurePosixPath
          app=Path(os.environ['RUNNER_TEMP'])/'r27480-derived/Build/Products/Debug-iphoneos/ChampionsOnDeviceResearch.app'
          assert app.is_dir(),'FAIL_CLOSED: compiled app missing'
          plist=app/'Info.plist'
          assert plist.is_file(),'FAIL_CLOSED: missing Info.plist'
          info=plistlib.loads(plist.read_bytes())
          exe_name=info.get('CFBundleExecutable')
          assert isinstance(exe_name,str) and exe_name and '/' not in exe_name and '\\' not in exe_name,'FAIL_CLOSED: invalid executable name'
          exe=app/exe_name
          assert exe.is_file(),'FAIL_CLOSED: missing executable'
          assert 'arm64' in subprocess.check_output(['xcrun','lipo','-archs',str(exe)],text=True).split(),'FAIL_CLOSED: no arm64'
          assert not (app/'_CodeSignature').exists(),'FAIL_CLOSED: signed source not expected'
          info['CFBundleVersion']='480'
          info['CFBundleShortVersionString']='0.4.80'
          plist.write_bytes(plistlib.dumps(info,sort_keys=False))
          assert plistlib.loads(plist.read_bytes())['CFBundleVersion']=='480','FAIL_CLOSED: version write failed'
          ipa=Path('dist/R27_480_Unsigned_ChampionsResearch.ipa')
          ipa.parent.mkdir(parents=True,exist_ok=True)
          entries=sorted(app.rglob('*'))
          assert entries and not any(p.is_symlink() for p in entries),'FAIL_CLOSED: symlink not supported'
          files=[p for p in entries if p.is_file()]
          assert len(files)>1,'FAIL_CLOSED: incomplete app'
          with zipfile.ZipFile(ipa,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in files:
                  z.write(p,arcname=str(PurePosixPath('Payload')/app.name/p.relative_to(app).as_posix()))
          with zipfile.ZipFile(ipa) as z:
              assert z.testzip() is None,'FAIL_CLOSED: IPA CRC'
              plist_bytes=z.read('Payload/ChampionsOnDeviceResearch.app/Info.plist')
              archived_plist=plistlib.loads(plist_bytes)
              assert archived_plist['CFBundleVersion']=='480'
              assert archived_plist['CFBundleShortVersionString']=='0.4.80'
              assert 'Payload/ChampionsOnDeviceResearch.app/'+exe_name in z.namelist()
          size=ipa.stat().st_size
          assert 1000<size<50000000,'FAIL_CLOSED: implausible IPA size'
          print('R27480_IPA_PACKAGING=PASS')
          print('R27480_IPA_SHA256='+hashlib.sha256(ipa.read_bytes()).hexdigest())
          print('R27480_IPA_BYTES='+str(size))
          print('RESEARCH_ONLY_FORMAL_HOLD_STAGE1_5_560_NATIVE33_0_EXACT34_0')
          PYCODE
      - name: Upload downloadable unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: R27480_UNSIGNED_RESEARCH_IPA
          path: dist/R27_480_Unsigned_ChampionsResearch.ipa
          if-no-files-found: error
          retention-days: 3
