          persist-credentials: false
      - name: Restore the preflight-tested tree and build the same unsigned app
        shell: bash
        run: |
          set -euo pipefail
          for step in 36 38 39 40 41 42; do
            ruby -ryaml -e 'puts YAML.load_file(ARGV[0]).fetch("jobs").fetch("iphoneos").fetch("steps").fetch(ARGV[1].to_i).fetch("run")' pinned-release-app/.github/workflows/r914.yml "$step" > "$RUNNER_TEMP/reproduce-preflight.sh"
            if [[ "$step" == 42 ]]; then
              test "$(cat R834Proof/SOURCE_TREE_SHA256.txt)" = '612d34a1744d8fa54b6455350c4b699d482708197b31c90d56aaa0bd0bc90f2e'
            fi
            bash "$RUNNER_TEMP/reproduce-preflight.sh"
          done
      - name: Audit and publish unsigned device test IPA
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p R914Delivery
          R914_APP="$RUNNER_TEMP/r914_device/Build/Products/Release-iphoneos/ChampionsOnDeviceResearch.app"
          export R914_APP
          lipo -archs "$R914_APP/ChampionsOnDeviceResearch" > R914Delivery/architectures.txt
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,plistlib,os
          s=Path('pinned-r793/source');m=json.loads((s/'source_manifest.json').read_text());sha=lambda b:hashlib.sha256(b).hexdigest()
          # The project file is derived by the exact verified generator. All other verified
          # source inputs must remain byte-identical through the native build.
          derived='app/ios/ChampionsOnDeviceResearch.xcodeproj/project.pbxproj'
          assert all(sha((s/n).read_bytes())==h for n,h in m.items() if n!=derived)
          app=Path(os.environ['R914_APP']);d=plistlib.loads((app/'Info.plist').read_bytes())
          assert d['CFBundleVersion']=='914' and d['CFBundleShortVersionString']=='0.9.14'
          assert d['CFBundleIdentifier']=='com.zeek10191019.championsresearch' and d['MinimumOSVersion']=='27.0'
          assert Path('R914Delivery/architectures.txt').read_text().strip()=='arm64'
          # Debug builds may use a small launcher plus NAME.debug.dylib; inspect both
          # native images and every packaged app member, never infer code from file size.
          import struct,subprocess
          exe=app/'ChampionsOnDeviceResearch';images=[exe]+sorted(app.glob('*.dylib'))
          for image in images:
           b=image.read_bytes();assert len(b)>=32 and image.stat().st_mode & 0o111
           magic,cpu,subtype,kind,ncmds,cmdbytes,flags,reserved=struct.unpack('<8I',b[:32])
           assert magic==0xfeedfacf and cpu==0x0100000c
           assert kind==(2 if image==exe else 6)
           pos=32;platforms=[]
           for _ in range(ncmds):
            cmd,size=struct.unpack_from('<2I',b,pos);assert size>=8 and pos+size<=len(b)
            if cmd==0x32:platforms.append(struct.unpack_from('<I',b,pos+8)[0])
            pos+=size
           assert pos==32+cmdbytes and platforms==[2]
           assert subprocess.check_output(['lipo','-archs',str(image)],text=True).strip()=='arm64'
           print('R914_NATIVE_IMAGE_VERIFIED',image.name,len(b),kind,platforms)
          if exe.stat().st_size<100000:
           debug=app/'ChampionsOnDeviceResearch.debug.dylib'
           assert debug in images and debug.stat().st_size>100000
           assert debug.name in subprocess.check_output(['otool','-L',str(exe)],text=True)
          assert d['DTPlatformName']=='iphoneos'
          members={str(p.relative_to(app)):{'bytes':p.stat().st_size,'sha256':sha(p.read_bytes())} for p in sorted(app.rglob('*')) if p.is_file()}
          Path('R914Delivery/app_members.json').write_text(json.dumps(members,sort_keys=True,indent=2)+'\n')
          assert list(app.glob('*.xcprivacy'))
          Path('R914Delivery/generated_project_sha256.txt').write_text(sha((s/derived).read_bytes())+'\n')
          print('R914_BUILT_APP_IDENTITY_INPUTS_ARM64_PRIVACY_VERIFIED',d['CFBundleVersion'],d['CFBundleIdentifier'])
          PY
          mkdir -p "$RUNNER_TEMP/r914_payload/Payload"
          ditto "$R914_APP" "$RUNNER_TEMP/r914_payload/Payload/ChampionsOnDeviceResearch.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/r914_payload/Payload" R914Delivery/R914_Unsigned_DeviceTest.ipa
          python3 - <<'PY'
          from pathlib import Path
          import json,zipfile,hashlib,plistlib,os,datetime,base64,lzma
          out=Path('R914Delivery');ipa=out/'R914_Unsigned_DeviceTest.ipa';sha=lambda b:hashlib.sha256(b).hexdigest();app=Path(os.environ['R914_APP'])
          assert 100000<ipa.stat().st_size<300000000
          with zipfile.ZipFile(ipa) as z:
           assert z.testzip() is None
           prefix='Payload/ChampionsOnDeviceResearch.app/'
           assert all(not n.startswith('/') and '..' not in Path(n).parts for n in z.namelist())
           info=plistlib.loads(z.read(prefix+'Info.plist'));assert info['CFBundleVersion']=='914'
          members=json.loads((out/'app_members.json').read_text())
          with zipfile.ZipFile(ipa) as z:
           actual={entry.filename[len(prefix):] for entry in z.infolist() if not entry.is_dir() and entry.filename.startswith(prefix)}
           assert actual==set(members), (sorted(actual),sorted(members))
           for name,meta in members.items():
            data=z.read(prefix+name);assert len(data)==meta['bytes'] and sha(data)==meta['sha256']
          receipt={
              'schema':'trueplan.device-test-ipa.v1',
              'created_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'version':'0.9.14','build':914,'revision':'R914','diagnostic':'D188',
              'source_commit':os.environ['SOURCE_COMMIT'],'source_files':679,
              'source_tree_sha256':Path('R834Proof/SOURCE_TREE_SHA256.txt').read_text().strip(),
              'ci':os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],
              'preflight_ci':os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['PREFLIGHT_RUN'],
              'focused_vision_ci':os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['FOCUSED_VISION_RUN'],
              'architecture':'arm64','swift_optimization':'-O','configuration':'Release','sdk_platform':'iphoneos','signed_for_installation':False,
              'ipa_filename':ipa.name,'ipa_bytes':ipa.stat().st_size,'ipa_sha256':sha(ipa.read_bytes()),
              'packaged_app_members':len(members),'zip_crc_passed':True,
              'device_accuracy_certified':False,'device_verified_fields':0,
          }
          (out/'VERIFICATION_R914.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          (out/'SHA256SUMS.txt').write_text(receipt['ipa_sha256']+'  '+ipa.name+'\n')
          print('R914_IPA_ARCHIVE_VERIFIED',json.dumps(receipt,sort_keys=True))
          PY
          cat > R914Delivery/DEVICE_TEST_R914.md <<'EOF'
          # R914 iPhone 16 Plus 実機試験
          
          1. PCのiLoaderで未署名IPAを更新導入し、0.9.14／build914を確認します。既存アプリは削除しません。
          2. アプリで「画面共有の収集を開始」を押し、選出画面から対戦を収集します。48.4秒以降も取得が続くか確認します。
          3. 「様子を見る」で自分側と相手側のステータスを開きます。能力ランクが変化した場面や場の効果、交代、自分と相手のメガ、明示ターン、画面の回転と復帰時の画面を可能な範囲で収集します。切替の前後を画面ログ・フレームID・PNGのSHAで照合します。アプリを復帰させ、一度ゲームに戻ってOCRが再開することも確認します。「様子を見る」のHP分数と4技のPPを画面と突き合わせます。
          4. 「収集終了・全情報を保存」。遅着分の反映を待ち、「保存済みの証拠を共有」。分割時は索引と全パートを使用します。
          
          macOSでの実ゲーム画像のOCR再試験、Swift・Pythonの回帰試験、iPhoneOS arm64ビルドが合格しています。iPhone 16 Plusでの連続収集、実表示まで1秒未満、79項目、共有は今回の実機試験で判定します。
          EOF
          tag=r914-device-test
          readback="$RUNNER_TEMP/r914_release_readback"
          mkdir -p "$readback"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish > R914Delivery/existing.json 2>/dev/null; then
            gh release create "$tag" R914Delivery/R914_Unsigned_DeviceTest.ipa R914Delivery/VERIFICATION_R914.json R914Delivery/SHA256SUMS.txt R914Delivery/DEVICE_TEST_R914.md --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" --title 'R914 iPhone 16 Plus device test 0.9.14' --draft --prerelease --notes-file R914Delivery/DEVICE_TEST_R914.md
          else
            jq -e --arg sha "$SOURCE_COMMIT" '.isDraft and .targetCommitish == $sha' R914Delivery/existing.json > /dev/null
            gh release upload "$tag" R914Delivery/R914_Unsigned_DeviceTest.ipa R914Delivery/VERIFICATION_R914.json R914Delivery/SHA256SUMS.txt R914Delivery/DEVICE_TEST_R914.md --repo "$GITHUB_REPOSITORY" --clobber
          fi
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'R914_Unsigned_DeviceTest.ipa' --dir "$readback"
          export R914_READBACK="$readback/R914_Unsigned_DeviceTest.ipa"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,zipfile
          receipt=json.loads(Path('R914Delivery/VERIFICATION_R914.json').read_text())
          ipa=Path(os.environ['R914_READBACK'])
          assert ipa.stat().st_size==receipt['ipa_bytes']
