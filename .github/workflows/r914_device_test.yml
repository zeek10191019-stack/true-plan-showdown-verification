      - name: Require successful preflight for the same commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREFLIGHT_RUN" > "$RUNNER_TEMP/preflight.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREFLIGHT_RUN/jobs" > "$RUNNER_TEMP/preflight-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FOCUSED_VISION_RUN" > "$RUNNER_TEMP/focused.json"
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          temp=Path(os.environ['RUNNER_TEMP'])
          run=json.loads((temp/'preflight.json').read_text())
          jobs=json.loads((temp/'preflight-jobs.json').read_text())['jobs']
          focused=json.loads((temp/'focused.json').read_text())
          sha=os.environ['SOURCE_COMMIT']
          assert run['head_sha']==sha and run['head_branch']=='r905-preflight'
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['path']=='.github/workflows/r914.yml'
          assert {job['name']:job['conclusion'] for job in jobs if job['head_sha']==sha}=={'verify':'success','iphoneos':'success'}
          assert focused['head_branch']=='r905-preflight' and focused['conclusion']=='success'
          assert focused['head_sha']=='866f57e082afb8b2a9b6932a540fbf1281d7c96b'
          assert focused['path'] =='.github/workflows/r914_inspection_pixels.yml'
          print('R914_PINNED_PREFLIGHT_PASS',run['id'],focused['id'],sha)
          PY
