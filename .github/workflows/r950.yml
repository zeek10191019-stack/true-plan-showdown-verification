name: R950 OCR lifecycle and storage recovery
on:
  push:
    branches: [r938-export-recovery]
    paths: [.github/workflows/r950.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verify OCR and build the iPhone app
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: .github/workflows/r950.yml
      - name: Restore R949 and verify R950 source
