      - name: Package and verify the public IPA download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$PWD/R945Delivery"
          app="$RUNNER_TEMP/r945_device/Build/Products/Release-iphoneos/ChampionsOnDeviceResearch.app"
          mkdir -p "$out/Payload"
          cp -R "$app" "$out/Payload/"
          cd "$out"
          zip -qry R945_Unsigned_DeviceTest.ipa Payload
          python3 - <<'IPA'
          import os,zipfile,hashlib,plistlib,subprocess,struct,json
          from pathlib import Path
          ipa=Path("R945_Unsigned_DeviceTest.ipa")
          app=Path("Payload/ChampionsOnDeviceResearch.app")
          with zipfile.ZipFile(ipa) as z:
              assert z.testzip() is None
              assert {i.filename for i in z.infolist() if not i.is_dir()}=={p.as_posix() for p in app.rglob('*') if p.is_file()}
              assert all(z.read(str(p))==p.read_bytes() for p in app.rglob('*') if p.is_file())
              info=plistlib.loads(z.read(str(app/'Info.plist')))
          assert (info['CFBundleShortVersionString'],info['CFBundleVersion'],info['MinimumOSVersion'],info['DTPlatformName'])==('0.9.45','945','27.0','iphoneos')
          assert info['CFBundleIdentifier']=='com.zeek10191019.championsresearch' and info['NSLocalNetworkUsageDescription'] and 'screen-capture' in info['UIBackgroundModes']
          binaries=[app/info['CFBundleExecutable'],*app.glob('*.dylib')]
          for binary in binaries:
              data=binary.read_bytes();magic,cpu,sub,kind,ncmds,cmdbytes,*_=struct.unpack_from('<8I',data)
              assert magic==0xfeedfacf and cpu==0x0100000c and kind in (2,6)
              assert subprocess.check_output(['lipo','-archs',str(binary)],text=True).strip()=='arm64'
              offset=32;platform=[]
              for _ in range(ncmds):
                  c,n=struct.unpack_from('<II',data,offset);assert n>=8 and offset+n<=len(data) and c!=29
                  if c==50:platform.append(struct.unpack_from('<I',data,offset+8)[0])
                  offset+=n
              assert offset==32+cmdbytes and platform==[2]
          sha=hashlib.sha256(ipa.read_bytes()).hexdigest()
          doc=dict(version='0.9.45',build=945,ipa_bytes=ipa.stat().st_size,ipa_sha256=sha,source_tree_sha256='ea157e7ba9f3154e6ff2c41640f3b4ab026204854fa0c9fe4b0a293f5ae98d8d',source_commit=os.environ['GITHUB_SHA'],device_certified_fields=0,iphone16plus_save='UNKNOWN',ci_run=os.environ['GITHUB_RUN_ID'])
          Path('VERIFICATION_R945.json').write_text(json.dumps(doc,indent=2)+'\n');print('R945_IPA_VERIFIED',json.dumps(doc))
          IPA
          tag=r945-device-test
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft > existing.json 2>/dev/null; then
            test "$(jq -r .isDraft existing.json)" = true
            gh release upload "$tag" R945_Unsigned_DeviceTest.ipa VERIFICATION_R945.json --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" R945_Unsigned_DeviceTest.ipa VERIFICATION_R945.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title 'R945 iPhone 実機テスト 0.9.45' --notes 'PCで未署名IPAを取得してiLoaderで上書き。自分のHPの座標補正、OCR証拠保存、終了後に届いたOS通知の記録、79項目の観測状況の診断を更新しました。R937の保存データは従来の復旧経路を使用できます。実機での保存と79項目の読取は要確認です。'
          fi
          mkdir readback
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.ipa' --dir readback
          cmp R945_Unsigned_DeviceTest.ipa readback/R945_Unsigned_DeviceTest.ipa
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/R945_Unsigned_DeviceTest.ipa"
          curl --fail -sSL --retry 4 --retry-all-errors "$url" -o readback/published.ipa
          cmp R945_Unsigned_DeviceTest.ipa readback/published.ipa
          echo "R945_PUBLIC_READBACK_VERIFIED $url"
