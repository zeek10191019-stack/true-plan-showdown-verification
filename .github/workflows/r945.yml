    branches: [r938-export-recovery]
    paths: [.github/workflows/r945.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    name: R945 verification and IPA
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
