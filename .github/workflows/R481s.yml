# Short standalone YAML. R481 unchanged; prior R480 build pinned by immutable commit+Git blob.
name: R481 small iOS
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r481-small-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false && github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - name: Restore pinned R480 successfully tested base
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib, re, subprocess, urllib.request
          from pathlib import Path
          url='https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/e7ecc2b043fb0d7f211372afd2a44242c93a8cc8/.github/workflows/R480.yml'
          req=urllib.request.Request(url,headers={'User-Agent':'TruePlan-R481-Small-Pinned','Accept':'text/plain'})
          with urllib.request.urlopen(req,timeout=60) as res:
              raw=res.read(40000)
          assert len(raw)==31372, 'FAIL_CLOSED: reference length changed'
          h=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert h=='c1d41fc2b0ec34cec4130b9a9d6d99116a5c9c38', 'FAIL_CLOSED: reference immutable blob mismatch'
          source=raw.decode('utf-8')
          Path('R480_PINNED_REFERENCE.yml').write_bytes(raw)
          expected=[
              'Verify and restore immutable successful R27.478 build source',
              'R27.479 fix capture session provenance and double start',
              'Full R27.478 baseline regression and new R27.479 tests',
              'R27.480 enforce predecessor epoch and uptime monotonicity',
          ]
          parts=re.split(r'(?m)^      - name: ',source)
          sections={}
          for part in parts[1:]:
              step=part.split('\n',1)[0]
              match=re.search(r'(?m)^        run: \|\n',part)
              if match is None:continue
              lines=[]
              for line in part[match.end():].splitlines():
                  if line.startswith('          '):lines.append(line[10:])
                  elif not line.strip():lines.append('')
                  else:break
              sections[step]='\n'.join(lines)+'\n'
          assert list(sections)==expected+['Build unsigned iPhoneOS app and repair IPA packaging'], 'FAIL_CLOSED: wrong source step order'
          for step in expected:
              code=sections[step]
              assert code.startswith('set -euo pipefail\n'), 'FAIL_CLOSED: missing shell safety'
              subprocess.run(['bash','-n'],input=code,text=True,check=True)
              print('RUN_PINNED_R480_STEP='+step,flush=True)
              subprocess.run(['bash','-e','-o','pipefail'],input=code,text=True,check=True)
          assert len(list(Path('ios/ChampionsOnDevice').glob('*.swift')))==43,'FAIL_CLOSED: Swift source count'
          print('R481_SHORT_PINNED_R480_RESTORATION=PASS')
          PYCODE
      - name: R481 classify capture anomalies in unified audit JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib,base64,zlib
          from pathlib import Path
          src=Path('ios/ChampionsOnDevice/ResearchUnifiedTelemetryBundle.swift')
          assert len(list(src.parent.glob('*.swift')))==43, 'FAIL_CLOSED: expected 43 Swift sources'
          assert src.is_file() and hashlib.sha256(src.read_bytes()).hexdigest()=='640e58d1e6579b007b1c524773ed0c600cb8ff3aabaf371358c434134d5249b4', 'FAIL_CLOSED: R480 source preimage changed'
          patched=zlib.decompress(base64.b64decode('',validate=True))
          assert len(patched)<15000 and hashlib.sha256(patched).hexdigest()=='441ad93eafae37511c553d404b83af9effedbbd89ec66631c44327d868a8a83a', 'FAIL_CLOSED: R481 source corruption'
          text=patched.decode('utf-8')
          assert 'static func diagnosticTriage(' in text and '"capture_diagnostic_triage": diagnosticTriage(' in text
          assert '"real_time_advice_enabled": false' in text and '"production_enabled": false' in text
          src.write_bytes(patched)
          print('R481_DIAGNOSTIC_SOURCE_SHA256='+hashlib.sha256(src.read_bytes()).hexdigest())
          PYCODE
          mkdir -p R481_NATIVE
          python3 - <<'PYCODE'
          import hashlib,base64,zlib
          from pathlib import Path
          script=zlib.decompress(base64.b64decode('',validate=True))
          assert len(script)<15000 and hashlib.sha256(script).hexdigest()=='e90d02e02c5fb8d4e08f6437b134dc49a06a87438b4b002eeb0d44b6eab47079', 'FAIL_CLOSED: R481 test corruption'
          Path('R481_NATIVE/main.swift').write_bytes(script)
          PYCODE
          swiftc ios/ChampionsOnDevice/ResearchUnifiedTelemetryBundle.swift R481_NATIVE/main.swift -o "$RUNNER_TEMP/r481_test"
          "$RUNNER_TEMP/r481_test" | grep -Fx 'R27481_CAPTURE_DIAGNOSTIC_TRIAGE_ASSERTIONS_PASS=53'
          python3 - <<'PYCODE'
          from pathlib import Path
          import subprocess
          sources=sorted(Path('ios/ChampionsOnDevice').glob('*.swift'))
          assert len(sources)==43,'FAIL_CLOSED: unexpected Swift source count'
          for src in sources: subprocess.run(['swiftc','-frontend','-parse',str(src)],check=True)
          print('R481_SWIFT_PARSE_PASS=43')
          PYCODE
      - name: Build unsigned iPhoneOS app and repair IPA packaging
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          test -d "$sdk/System/Library/Frameworks/ScreenCaptureKit.framework"
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate --spec ios/project.yml --project ios
          if ! xcodebuild -project ios/ChampionsOnDeviceResearch.xcodeproj -scheme ChampionsOnDeviceResearch \
                 -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' \
                 ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
                 -derivedDataPath "$RUNNER_TEMP/r27481-derived" build > "$RUNNER_TEMP/r27479-build.log" 2>&1; then
            grep -E 'error:|BUILD FAILED' "$RUNNER_TEMP/r27479-build.log" | tail -40 || true
            exit 1
          fi
          echo 'R481_IPHONEOS_UNSIGNED_COMPILE=PASS'
          python3 - <<'PYCODE'
          import hashlib, os, plistlib, subprocess, zipfile
          from pathlib import Path, PurePosixPath
          app=Path(os.environ['RUNNER_TEMP'])/'r27481-derived/Build/Products/Debug-iphoneos/ChampionsOnDeviceResearch.app'
          assert app.is_dir(),'FAIL_CLOSED: compiled app missing'
          plist=app/'Info.plist'
          assert plist.is_file(),'FAIL_CLOSED: missing Info.plist'
          info=plistlib.loads(plist.read_bytes())
          exe_name=info.get('CFBundleExecutable')
          assert isinstance(exe_name,str) and exe_name and '/' not in exe_name and '\\' not in exe_name,'FAIL_CLOSED: invalid executable name'
          exe=app/exe_name
          assert exe.is_file(),'FAIL_CLOSED: missing executable'
          assert 'arm64' in subprocess.check_output(['xcrun','lipo','-archs',str(exe)],text=True).split(),'FAIL_CLOSED: no arm64'
          assert not (app/'_CodeSignature').exists(),'FAIL_CLOSED: signed source not expected'
          info['CFBundleVersion']='481'
          info['CFBundleShortVersionString']='0.4.81'
          plist.write_bytes(plistlib.dumps(info,sort_keys=False))
          assert plistlib.loads(plist.read_bytes())['CFBundleVersion']=='481','FAIL_CLOSED: version write failed'
          ipa=Path('dist/R481.ipa')
          ipa.parent.mkdir(parents=True,exist_ok=True)
          entries=sorted(app.rglob('*'))
          assert entries and not any(p.is_symlink() for p in entries),'FAIL_CLOSED: symlink not supported'
          files=[p for p in entries if p.is_file()]
          assert len(files)>1,'FAIL_CLOSED: incomplete app'
          with zipfile.ZipFile(ipa,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in files:
                  z.write(p,arcname=str(PurePosixPath('Payload')/app.name/p.relative_to(app).as_posix()))
          with zipfile.ZipFile(ipa) as z:
              assert z.testzip() is None,'FAIL_CLOSED: IPA CRC'
              plist_bytes=z.read('Payload/ChampionsOnDeviceResearch.app/Info.plist')
              archived_plist=plistlib.loads(plist_bytes)
              assert archived_plist['CFBundleVersion']=='481'
              assert archived_plist['CFBundleShortVersionString']=='0.4.81'
              assert 'Payload/ChampionsOnDeviceResearch.app/'+exe_name in z.namelist()
          size=ipa.stat().st_size
          assert 1000<size<50000000,'FAIL_CLOSED: implausible IPA size'
          print('R481_IPA_PACKAGING=PASS')
          print('R481_IPA_SHA256='+hashlib.sha256(ipa.read_bytes()).hexdigest())
          print('R481_IPA_BYTES='+str(size))
          print('RESEARCH_ONLY_FORMAL_HOLD_STAGE1_5_560_NATIVE33_0_EXACT34_0')
          PYCODE
      - name: Upload downloadable unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: R481_UNSIGNED_IPA
          path: dist/R481.ipa
          if-no-files-found: error
          retention-days: 3
