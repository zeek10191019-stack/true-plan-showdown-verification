# R718 chronology hardening and pixel owner-turn evidence readiness.
# Frozen source embedded; no network dependencies other than GitHub macOS runner.
name: R718 Owner Turn Evidence Safety
'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/r718.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r718-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
