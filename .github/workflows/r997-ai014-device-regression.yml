name: R997 integrated screen capture and OCR regression
'on':
  push:
    branches:
    - r987-ocr-pc-regression
    paths:
    - .github/workflows/r997-ai014-device-regression.yml
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: r997-ai014-ipa
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && !github.event.repository.private
      && github.ref == 'refs/heads/r987-ocr-pc-regression'
    runs-on: macos-26
    timeout-minutes: 42
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFIED_SHA: 5eebfff8d8d43c3cc7432aafbb39dd0724fc3c3c
      VERIFIED_RUN: '45049580448'
      VERIFIED_JOB: '137291516691'
      R995_BUILD_COMMIT: 736cb296fef2136f41dfcdfd86ddf02005ca5952
      RELEASE_TAG: r997-ai014-device-test
      PYTHONDONTWRITEBYTECODE: '1'
    outputs:
      manifest_sha: ${{ steps.tested.outputs.manifest_sha }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: .github/workflows/r997-ai014-device-regression.yml
    - name: Verify and combine the pinned AI014 and R996 source
      shell: bash
      run: |
        set -euo pipefail
        work="$RUNNER_TEMP/r997"
        mkdir -p "$work"
        export AI014_WORKFLOW="$work/ai014-pinned.yml"
        git show '681ccff2494ebe701d40c921720bb6e3ea506c11:.github/workflows/ai014-ios27-build.yml' > "$AI014_WORKFLOW"
        echo '161b5678af05a6ffab2fa5bbe3a86f7d47a2e116c2084941fa2da3793be7a76a  ai014-pinned.yml' | (cd "$work" && shasum -a 256 -c -)
        git show "$R995_BUILD_COMMIT:.github/workflows/r995-ios27-build.yml" > "$work/r995-ios27-pinned.yml"
        echo '40ca155e2c69f840b2bd2d5078c91928ce2755ac9d2be77897f61d5b146cd9f1  r995-ios27-pinned.yml' | (cd "$work" && shasum -a 256 -c -)
        ruby -ryaml -e '
          steps=YAML.load_file(ARGV[0],aliases:true).fetch("jobs").fetch("build").fetch("steps")
          puts steps.find { |step| step["name"] == "Restore the exact source that passed the R995 tests" }.fetch("run")
        ' "$work/r995-ios27-pinned.yml" > "$work/restore-r995.sh"
        bash "$work/restore-r995.sh"
        ruby -ryaml -e '
          steps=YAML.load_file(ENV.fetch("AI014_WORKFLOW"),aliases:true).fetch("jobs").fetch("build").fetch("steps")
          puts steps.find { |step| step["name"] == "Apply and verify the AI014 overlay" }.fetch("run")
        ' > "$work/overlay-ai014.sh"
        bash "$work/overlay-ai014.sh"
        source=pinned-r793/source
        echo 'd323d3ee8a81b77b39082f0fa8647231219aa9f45788f294f0bfe672705f3a8b  source_manifest.json' |
          (cd "$source" && shasum -a 256 -c -)
        python3 - "$work" <<'PAYLOAD'
        import base64,hashlib,sys
        from pathlib import Path
        folder=Path(sys.argv[1])
        files={'r997-ai014-readout.patch': ['ad6b690cd4012d3a241418a65d6c8854e038b31c44df10c8174d3eb75a6634c3', ''], 'R997SelectionTransportTests.swift': ['9490aba6df07bd9f7985c53b14829ae91f72d40e3ed6756601f7ea8c8e92467f', ''], 'r995-selection-fixture.json': ['72e24e4d7ce296024131d8bae3f2eb6caf082ac48903d5a4b7b36e76e1dd089d', ''], 'Info.plist': ['ced32e8f3e3ec94255ecebe023d4b2f0f34d354ad2e10113ed9b38145bfaebda', '']}
        for name,(expected,encoded) in files.items():
            body=base64.b64decode(encoded,validate=True)
            assert hashlib.sha256(body).hexdigest()==expected,name
            (folder/name).write_bytes(body)
        PAYLOAD
        patch -s -p1 -F 0 -N -t -d "$source" < "$work/r997-ai014-readout.patch"
        cp "$work/Info.plist" "$source/app/ios/ChampionsOnDevice/Info.plist"
        python3 - "$source" <<'MANIFEST'
        import hashlib,json,sys
        from pathlib import Path
        source=Path(sys.argv[1])
        manifest=source/'source_manifest.json'
        original=json.loads(manifest.read_bytes())
        current={p.relative_to(source).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in source.rglob('*') if p.is_file() and p!=manifest}
        assert original.keys()==current.keys()
        assert {key:current[key] for key in original if current[key]!=original[key]}=={'app/ios/ChampionsOnDevice/CaptureCoordinator.swift': '7818dce7f0800de4993eaee8fc1ad3b563f589c1273bbf4f66439653dc24e221', 'app/ios/ChampionsOnDevice/R987BattleReadout.swift': '95d5db0723b1f87e7a39846f8f64693cca230252d7dd48ce62ddcea40501cbfc', 'R720_PORTABLE_TESTS/Sources/R719Core/R987BattleReadout.swift': '95d5db0723b1f87e7a39846f8f64693cca230252d7dd48ce62ddcea40501cbfc', 'app/ios/ChampionsOnDevice/Info.plist': 'ced32e8f3e3ec94255ecebe023d4b2f0f34d354ad2e10113ed9b38145bfaebda'}
        assert current['R720_PORTABLE_TESTS/Sources/R719Core/R987BattleReadout.swift']==current['app/ios/ChampionsOnDevice/R987BattleReadout.swift']
        body=(json.dumps(current,sort_keys=True,indent=2)+'\n').encode()
        assert hashlib.sha256(body).hexdigest()=='255a96f2e049ca060b4c5e0cd80dde62bbabc821984483e349ad3c3a3c3eac04',hashlib.sha256(body).hexdigest()
        manifest.write_bytes(body)
        MANIFEST
    - name: Run the existing capture, archive, Vision and browser regressions on the combined source
      shell: bash
      run: |
        set -euo pipefail
        pinned="$RUNNER_TEMP/r997/r995-pinned.yml"
        git show "$VERIFIED_SHA:.github/workflows/r995-device-readout-regression.yml" > "$pinned"
        echo '1dd7ad209b3dedb78d8f94ac1367608be42bbfea1f11700def141bb87e5de9e5  r995-pinned.yml' |
          (cd "$RUNNER_TEMP/r997" && shasum -a 256 -c -)
        set -euo pipefail
        prior="$RUNNER_TEMP/r994/r993-pinned.yml"
        ruby -ryaml -e '
          doc = YAML.load_file(ARGV[0], aliases: true)
          steps = doc.fetch("jobs").fetch(ARGV[1]).fetch("steps")
          puts steps.find { |step| step["name"] == ARGV[2] }.fetch("run")
        ' "$prior" vision 'Replay Apple Vision on macOS 26' > "$RUNNER_TEMP/r994/vision.sh"
        bash "$RUNNER_TEMP/r994/vision.sh"
        ruby -ryaml -e '
          doc = YAML.load_file(ARGV[0], aliases: true)
          steps = doc.fetch("jobs").fetch(ARGV[1]).fetch("steps")
          puts steps.find { |step| step["name"] == ARGV[2] }.fetch("run")
        ' "$prior" verify 'Run Swift, archive and browser regressions' > "$RUNNER_TEMP/r994/legacy.sh"
        bash "$RUNNER_TEMP/r994/legacy.sh"
    - name: Replay the real R995 six-slot case through the Lenovo PC packet and verify expiry
      shell: bash
      run: |
        set -euo pipefail
        artifacts="$RUNNER_TEMP/r994"
        tests="$PWD/pinned-r793/source/R720_PORTABLE_TESTS/Tests/R719CoreTests"
        export R993_REPLAY_FIXTURE="$artifacts/r993-recorded-observations.jsonl"
        test -s "$R993_REPLAY_FIXTURE"
        test ! -e "$tests/R994RecordedReadoutTests.swift"
        test ! -e "$tests/R995ReadoutCoverageTests.swift"
        export R995_SELECTION_FIXTURE="$RUNNER_TEMP/r997/r995-selection-fixture.json"
        test ! -e "$tests/R997SelectionTransportTests.swift"
        cleanup() { rm -f "$tests/R994RecordedReadoutTests.swift" "$tests/R995ReadoutCoverageTests.swift" "$tests/R997SelectionTransportTests.swift"; }
        trap cleanup EXIT
        cp "$RUNNER_TEMP/r997/R997SelectionTransportTests.swift" "$tests/"
        cp "$artifacts/R994RecordedReadoutTests.swift" "$artifacts/R995ReadoutCoverageTests.swift" "$tests/"
        swift test --package-path pinned-r793/source/R720_PORTABLE_TESTS \
          --scratch-path "$RUNNER_TEMP/ai014-swift-tests" --jobs 2 \
          --filter 'R864SelectionSpritesTests|R994RecordedReadoutTests|R995ReadoutCoverageTests|R991NameIndependentReadoutTests|R997SelectionTransportTests' 2>&1 |
          tee "$RUNNER_TEMP/ai014-apple-tests.log"
        for suite in R864SelectionSpritesTests R994RecordedReadoutTests R995ReadoutCoverageTests R991NameIndependentReadoutTests R997SelectionTransportTests; do
          grep -F "Test Suite '$suite' passed" "$RUNNER_TEMP/ai014-apple-tests.log"
        done
    - name: Export the manifest hash after the full regression
      id: tested
      shell: bash
      run: |
        set -euo pipefail
        result="$(shasum -a 256 pinned-r793/source/source_manifest.json | awk '{print $1}')"
        [[ "$result" == "255a96f2e049ca060b4c5e0cd80dde62bbabc821984483e349ad3c3a3c3eac04" ]]
        printf 'manifest_sha=%s\n' "$result" >> "$GITHUB_OUTPUT"
  package:
    needs: verify
    permissions:
      contents: write
      actions: read
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && !github.event.repository.private
      && github.ref == 'refs/heads/r987-ocr-pc-regression'
    runs-on: xcode-27
    timeout-minutes: 42
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFIED_SHA: 5eebfff8d8d43c3cc7432aafbb39dd0724fc3c3c
      VERIFIED_RUN: '45049580448'
      VERIFIED_JOB: '137291516691'
      R995_BUILD_COMMIT: 736cb296fef2136f41dfcdfd86ddf02005ca5952
      RELEASE_TAG: r997-ai014-device-test
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: .github/workflows/r997-ai014-device-regression.yml
    - name: Verify and combine the pinned AI014 and R996 source
      shell: bash
      run: |
        set -euo pipefail
        work="$RUNNER_TEMP/r997"
        mkdir -p "$work"
        export AI014_WORKFLOW="$work/ai014-pinned.yml"
        git show '681ccff2494ebe701d40c921720bb6e3ea506c11:.github/workflows/ai014-ios27-build.yml' > "$AI014_WORKFLOW"
        echo '161b5678af05a6ffab2fa5bbe3a86f7d47a2e116c2084941fa2da3793be7a76a  ai014-pinned.yml' | (cd "$work" && shasum -a 256 -c -)
        git show "$R995_BUILD_COMMIT:.github/workflows/r995-ios27-build.yml" > "$work/r995-ios27-pinned.yml"
        echo '40ca155e2c69f840b2bd2d5078c91928ce2755ac9d2be77897f61d5b146cd9f1  r995-ios27-pinned.yml' | (cd "$work" && shasum -a 256 -c -)
        ruby -ryaml -e '
          steps=YAML.load_file(ARGV[0],aliases:true).fetch("jobs").fetch("build").fetch("steps")
          puts steps.find { |step| step["name"] == "Restore the exact source that passed the R995 tests" }.fetch("run")
        ' "$work/r995-ios27-pinned.yml" > "$work/restore-r995.sh"
        bash "$work/restore-r995.sh"
        ruby -ryaml -e '
          steps=YAML.load_file(ENV.fetch("AI014_WORKFLOW"),aliases:true).fetch("jobs").fetch("build").fetch("steps")
          puts steps.find { |step| step["name"] == "Apply and verify the AI014 overlay" }.fetch("run")
        ' > "$work/overlay-ai014.sh"
        bash "$work/overlay-ai014.sh"
        source=pinned-r793/source
        echo 'd323d3ee8a81b77b39082f0fa8647231219aa9f45788f294f0bfe672705f3a8b  source_manifest.json' |
          (cd "$source" && shasum -a 256 -c -)
        python3 - "$work" <<'PAYLOAD'
        import base64,hashlib,sys
        from pathlib import Path
        folder=Path(sys.argv[1])
        files={'r997-ai014-readout.patch': ['ad6b690cd4012d3a241418a65d6c8854e038b31c44df10c8174d3eb75a6634c3', ''], 'R997SelectionTransportTests.swift': ['9490aba6df07bd9f7985c53b14829ae91f72d40e3ed6756601f7ea8c8e92467f', ''], 'r995-selection-fixture.json': ['72e24e4d7ce296024131d8bae3f2eb6caf082ac48903d5a4b7b36e76e1dd089d', ''], 'Info.plist': ['ced32e8f3e3ec94255ecebe023d4b2f0f34d354ad2e10113ed9b38145bfaebda', '']}
        for name,(expected,encoded) in files.items():
            body=base64.b64decode(encoded,validate=True)
            assert hashlib.sha256(body).hexdigest()==expected,name
            (folder/name).write_bytes(body)
        PAYLOAD
        patch -s -p1 -F 0 -N -t -d "$source" < "$work/r997-ai014-readout.patch"
        cp "$work/Info.plist" "$source/app/ios/ChampionsOnDevice/Info.plist"
        python3 - "$source" <<'MANIFEST'
        import hashlib,json,sys
        from pathlib import Path
        source=Path(sys.argv[1])
        manifest=source/'source_manifest.json'
        original=json.loads(manifest.read_bytes())
        current={p.relative_to(source).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in source.rglob('*') if p.is_file() and p!=manifest}
        assert original.keys()==current.keys()
        assert {key:current[key] for key in original if current[key]!=original[key]}=={'app/ios/ChampionsOnDevice/CaptureCoordinator.swift': '7818dce7f0800de4993eaee8fc1ad3b563f589c1273bbf4f66439653dc24e221', 'app/ios/ChampionsOnDevice/R987BattleReadout.swift': '95d5db0723b1f87e7a39846f8f64693cca230252d7dd48ce62ddcea40501cbfc', 'R720_PORTABLE_TESTS/Sources/R719Core/R987BattleReadout.swift': '95d5db0723b1f87e7a39846f8f64693cca230252d7dd48ce62ddcea40501cbfc', 'app/ios/ChampionsOnDevice/Info.plist': 'ced32e8f3e3ec94255ecebe023d4b2f0f34d354ad2e10113ed9b38145bfaebda'}
        assert current['R720_PORTABLE_TESTS/Sources/R719Core/R987BattleReadout.swift']==current['app/ios/ChampionsOnDevice/R987BattleReadout.swift']
        body=(json.dumps(current,sort_keys=True,indent=2)+'\n').encode()
        assert hashlib.sha256(body).hexdigest()=='255a96f2e049ca060b4c5e0cd80dde62bbabc821984483e349ad3c3a3c3eac04',hashlib.sha256(body).hexdigest()
        manifest.write_bytes(body)
        MANIFEST
    - name: Confirm the tested source and the iPhoneOS SDK
      shell: bash
      env:
        TESTED_MANIFEST: ${{ needs.verify.outputs.manifest_sha }}
      run: |
        set -euo pipefail
        sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
        [[ "${sdk%%.*}" == 27 ]]
        [[ "$TESTED_MANIFEST" =~ ^[0-9a-f]{64}$ ]]
        result="$(shasum -a 256 pinned-r793/source/source_manifest.json | awk '{print $1}')"
        [[ "$result" == "$TESTED_MANIFEST" ]]
    - name: Build and validate the iPhoneOS 27 arm64 IPA
      shell: bash
      run: |
        set -euo pipefail
        root="$PWD/pinned-r793/source"
        build="$RUNNER_TEMP/ai014-build"
        package="$RUNNER_TEMP/ai014-package"
        python3 - "$root" <<'VERIFY_SOURCE'
        import hashlib,json,sys
        from pathlib import Path

        root=Path(sys.argv[1])
        manifest=root/'source_manifest.json'
        files={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
               for p in root.rglob('*') if p.is_file() and p!=manifest}
        assert files==json.loads(manifest.read_bytes()), 'source modified after verification'
        VERIFY_SOURCE
        xcodebuild -project "$root/app/ios/ChampionsOnDeviceResearch.xcodeproj" \
          -scheme ChampionsOnDeviceResearch -configuration Release -sdk iphoneos \
          -destination 'generic/platform=iOS' -derivedDataPath "$build" \
          ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build 2>&1 |
          tee "$RUNNER_TEMP/ai014-native.log"
        grep -F 'BUILD SUCCEEDED' "$RUNNER_TEMP/ai014-native.log"
        app="$build/Build/Products/Release-iphoneos/ChampionsOnDeviceResearch.app"
            echo '255a96f2e049ca060b4c5e0cd80dde62bbabc821984483e349ad3c3a3c3eac04  source_manifest.json' | (cd "$root" && shasum -a 256 -c -)
        mkdir -p "$package/Payload" "$package/readback"
        ditto "$app" "$package/Payload/ChampionsOnDeviceResearch.app"
        cd "$package"
        zip -qry R997_AI014_Unsigned_DeviceTest.ipa Payload
        python3 - "$root/source_manifest.json" <<'PY'
        import hashlib, json, os, plistlib, struct, sys, zipfile
        from pathlib import Path

        app=Path('Payload/ChampionsOnDeviceResearch.app')
        plen=app/'Info.plist'
        params=plistlib.loads(plen.read_bytes())
        assert (params['TPIntegrationBuild'],params['CFBundleIdentifier'],params['CFBundleVersion'],
                params['CFBundleShortVersionString'],params['MinimumOSVersion'],params['DTPlatformName'])==(
                'AI014','com.zeek10191019.championsresearch','997','0.9.97','27.0','iphoneos')
        assert params['NSLocalNetworkUsageDescription'] and 'screen-capture' in params['UIBackgroundModes']
        assert not (app/'embedded.mobileprovision').exists() and not (app/'_CodeSignature').exists()
        for binary in [app/params['CFBundleExecutable'], *app.glob('*.dylib')]:
            data=binary.read_bytes()
            magic,cpu,_,kind,commands,command_bytes,*_=struct.unpack_from('<8I',data)
            assert magic==0xfeedfacf and cpu==0x0100000c and kind in (2,6),binary
            offset,platforms=32,[]
            for _ in range(commands):
                command,size=struct.unpack_from('<2I',data,offset)
                assert size>=8 and offset+size<=len(data) and command!=29,binary
                if command==50:
                    platforms.append(struct.unpack_from('<I',data,offset+8)[0])
                offset+=size
            assert offset==32+command_bytes and platforms==[2],binary

        ipa=Path('R997_AI014_Unsigned_DeviceTest.ipa')
        with zipfile.ZipFile(ipa) as z:
            assert z.testzip() is None
            members=[i.filename for i in z.infolist() if not i.is_dir()]
            expected={str(p):p for p in app.rglob('*') if p.is_file()}
            assert len(members)==len(expected) and set(members)==set(expected)
            assert all(z.read(name)==p.read_bytes() for name,p in expected.items())
        sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
        record={'integration':'AI014','app_build':997,'app_version':'0.9.97','signed':False,
                'native_build':'PASS','apple_regression':'PASS','physical_retest':'PENDING',
                'ipa':{'name':ipa.name,'bytes':ipa.stat().st_size,'sha256':sha(ipa)},
                'source_manifest_sha256':sha(Path(sys.argv[1])),'base_sha':os.environ['VERIFIED_SHA'],
                'workflow_commit':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID'])}
        Path('VERIFICATION_R997_IPA.json').write_text(json.dumps(record,indent=2)+'\n')
        print('AI014_UNSIGNED_IPA_VERIFIED',record)
        PY
    - name: Publish and re-download the verified IPA
      shell: bash
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP/ai014-package"
        if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish |
            jq -e --arg sha "$GITHUB_SHA" '.isDraft and .targetCommitish == $sha'
          gh release upload "$RELEASE_TAG" R997_AI014_Unsigned_DeviceTest.ipa VERIFICATION_R997_IPA.json \
            --repo "$GITHUB_REPOSITORY" --clobber
        else
          gh release create "$RELEASE_TAG" R997_AI014_Unsigned_DeviceTest.ipa VERIFICATION_R997_IPA.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease \
            --title 'R997 画面共有・OCR・Lenovo連携 実機試験' --notes 'Windowsから取得して署名するiPhoneOS 27以降・arm64用IPA。実機試験はこれから行います。'
        fi
        gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir readback
        for name in R997_AI014_Unsigned_DeviceTest.ipa VERIFICATION_R997_IPA.json; do
          cmp "$name" "readback/$name"
        done
        gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
        for name in R997_AI014_Unsigned_DeviceTest.ipa VERIFICATION_R997_IPA.json; do
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$name"
          curl -fsSL --retry 4 --retry-all-errors "$url" -o "readback/public-$name"
          cmp "$name" "readback/public-$name"
          printf 'R997_PUBLIC_READBACK_VERIFIED %s\n' "$url"
        done
