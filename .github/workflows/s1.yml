jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        ref: b48033c23be9a95c1470c5d121246775f19e3d02
    - run: |
        python3 - <<'PYCODE'
        import os,base64,lzma,hashlib,pathlib
        b=lzma.decompress(base64.b85decode(
          ''.join(os.environ['P'].split())),
          format=lzma.FORMAT_ALONE)
        assert hashlib.sha256(b).hexdigest() == (
          '598a5d9072508e6f299c645d715d546a' +
          'c71e98538ca911c7a70f7ad70f760ac0')
        names=[
          'app/ios/ChampionsOnDevice/' +
          'R680MegaReferenceSeeds.swift',
          'tests/R680Smoke.swift',
          'tools/r680_patch.py','/tmp/R680CI.sh']
        sizes=[6677, 3725, 873, 1005]
        pos=0
        for n,z in zip(names,sizes):
          p=pathlib.Path(n)
          assert not p.exists(),n
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_bytes(b[pos:pos+z]);pos+=z
        assert pos==len(b)
        PYCODE
        bash /tmp/R680CI.sh
