          & git -C $repo fetch --no-tags --filter=blob:none --depth=1 origin $commit
          if ($LASTEXITCODE -ne 0) { throw 'FETCH_FAILED' }
          @'
          import subprocess,sys
          from pathlib import Path
          repo,commit,dest=sys.argv[1:]
