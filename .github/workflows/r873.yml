      - name: Verify preflight compile read back and publish on equality
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p R872Delivery
          # Verify the already completed preflight instead of trusting a branch label.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/43920089230" > R872Delivery/preflight_run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/43920089230/jobs" > R872Delivery/preflight_jobs.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('R872Delivery/preflight_run.json').read_text());j=json.loads(Path('R872Delivery/preflight_jobs.json').read_text())['jobs']
          assert r['head_sha']=='2bffcb2f36bc623a835e02171b519d05ffdb52ef' and r['path']=='.github/workflows/r872.yml'
          assert r['status']=='completed' and r['conclusion']=='success'
          assert {(x['id'],x['conclusion']) for x in j}=={(133484725271,'success'),(133484724833,'success')}
          print('R873_PREFLIGHT_RUN_AND_BOTH_JOBS_VERIFIED',r['html_url'])
          PY
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request,os,re
          class LogRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,req,fp,code,msg,headers,newurl):
            if not newurl.startswith('https://'):raise ValueError('non-TLS log redirect')
            follow=super().redirect_request(req,fp,code,msg,headers,newurl)
            if follow is not None:follow.remove_header('Authorization')
            return follow
          opener=urllib.request.build_opener(LogRedirect())
          for job,label in [(133484725271,'mac'),(133484724833,'iphoneos')]:
           req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/jobs/'+str(job)+'/logs',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
           with opener.open(req,timeout=60) as response:data=response.read().decode('utf-8-sig')
           data=re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]','',data)
           data=''.join(c for c in data if c in '\r\n\t' or ord(c)>=32)
           Path('R872Delivery/preflight_'+label+'.log').write_text(data)
           print('PREFLIGHT_LOG_SAVED_WITH_CONTROL_CHARACTERS_REMOVED',job,len(data))
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          mac=Path('R872Delivery/preflight_mac.log').read_text();native=Path('R872Delivery/preflight_iphoneos.log').read_text()
          assert 'R872_SWIFT_TESTS_VERIFIED 700 0' in mac
          assert 'R872_79_ROUTE_GAPS 0' in mac and 'R864_REAL_SELECTION_PIXEL_ESTIMATES_PASS quick_pixel_ms=' in mac
          assert 'R845_REAL_299MB_SPLIT_READBACK_PASS source=299000137 parts=[299000539, 678]' in mac
          assert 'R689_STREAMING_ZIP_Smoke_PASS' in mac and 'R845_79_ROUTE_SCOPE 0 0' in mac
          assert 'R845_TEN_PARTS_READBACK_ELEVEN_REJECT_CORRUPTION_HOLD_SOURCE_PRESERVED_PASS' in mac
          assert 'R872_BUILT_IDENTITY_VERIFIED 872 0.8.72' in native
          source='R872_SOURCE_667_VERIFIED 223687d48eac630396bac33362234c17f057e1859dd6ce7c0d23636e76f6e8e9'
          assert source in mac and source in native
          ms=list({int(x) for x in re.findall(r'R839_ORIGINAL_PNG_SOURCE_FSYNC_PIXEL_OCR_MAIN_PUBLICATION_MS ([0-9]+)',mac)})
          assert len(ms)==1 and 0<ms[0]<1000
          capture=sorted(set(re.findall(r'R852_CVPIXELBUFFER_PNG_FSYNC_PIXEL_OCR_STATE_MAIN_MS ([0-9]+) png_ms=([0-9]+) portrait=(true|false)',mac)))
          assert len(capture)==2 and {x[2] for x in capture}=={'true','false'}
          assert all(0<int(x[0])<1000 for x in capture)
          capture_ms={('portrait' if x[2]=='true' else 'landscape'):int(x[0]) for x in capture}
          assert 'R855_FAST_PNG_ICC_ALPHA_STRIDE_IMAGEIO_READBACK_PASS' in mac
          assert 'R857_EXPLICIT_SRGB_PREVIOUS_PNG_ALL_PIXELS_EXACT_PASS' in mac
          assert 'R852_31_RETAINED_FRAMES_RELAUNCH_ZIP_READBACK_NO_OCR_PASS' in mac
          assert 'R861_DURABLE_OCR_RECEIPTS_FILE_ROUNDTRIP_PASS' in mac
          assert 'R861_UNWRITTEN_COMPLETION_CANNOT_REACH_CURRENT_HP_PASS' in mac
          assert 'R872_DETAIL_QUICK_ORIGINAL_SOURCE_ORDER_PASS' in mac
          
          Path('R872Delivery/preflight_metrics.json').write_text(json.dumps({'swift_tests':700,'failures':0,'mac_source_to_main_ms':ms[0],'mac_capture_buffer_to_main_ms':capture_ms,'source_encoder':'FULL_SIZE_RGB8_OR_RGBA8_SOURCE_ICC_ZLIB_LEVEL_1','scope':'MAC_MAIN_ACTOR_NOT_IPHONE_LCD'},indent=2)+'\n')
          print('R873_PREFLIGHT_LOGS_VERIFIED',ms[0])
          PY
          ruby -ryaml -e 'puts YAML.load_file(ARGV[0]).fetch("jobs").fetch("verify").fetch("steps").fetch(19).fetch("run")' pinned-r872/.github/workflows/r872.yml > "$RUNNER_TEMP/restore_r872.sh"
          bash "$RUNNER_TEMP/restore_r872.sh"
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          s=Path('pinned-r793/source');sha=lambda b:hashlib.sha256(b).hexdigest()
          fs={str(p.relative_to(s)):p for p in s.rglob('*') if p.is_file() and not {'.build','.swiftpm','__pycache__'}.intersection(p.parts)}
          tree=sha(''.join(n+'\t'+sha(fs[n].read_bytes())+'\n' for n in sorted(fs)).encode());assert len(fs)==667 and tree=='223687d48eac630396bac33362234c17f057e1859dd6ce7c0d23636e76f6e8e9'
          m=json.loads((s/'source_manifest.json').read_text());assert set(fs)==set(m)|{'source_manifest.json'} and all(sha(fs[n].read_bytes())==h for n,h in m.items())
          Path('R872Delivery/SOURCE_TREE_SHA256.txt').write_text(tree+'\n');Path('R872Delivery/source_manifest.json').write_bytes((s/'source_manifest.json').read_bytes())
          print('R873_EXACT_PASSING_R872_SOURCE_VERIFIED',len(fs),tree)
          PY
          python3 pinned-r793/source/tools/generate_xcode_project.py
          xcodebuild -project pinned-r793/source/app/ios/ChampionsOnDeviceResearch.xcodeproj -scheme ChampionsOnDeviceResearch -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO -derivedDataPath "$RUNNER_TEMP/r872_device_test" build > R872Delivery/iphoneos_package.log 2>&1 || { grep -E 'error:|BUILD FAILED' R872Delivery/iphoneos_package.log; exit 1; }
          grep -F 'BUILD SUCCEEDED' R872Delivery/iphoneos_package.log
          R872_APP="$RUNNER_TEMP/r872_device_test/Build/Products/Debug-iphoneos/ChampionsOnDeviceResearch.app"
          export R872_APP
          lipo -archs "$R872_APP/ChampionsOnDeviceResearch" > R872Delivery/architectures.txt
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,plistlib,os
          s=Path('pinned-r793/source');m=json.loads((s/'source_manifest.json').read_text());sha=lambda b:hashlib.sha256(b).hexdigest()
          # The project file is derived by the exact verified generator. All other verified
          # source inputs must remain byte-identical through the native build.
          derived='app/ios/ChampionsOnDeviceResearch.xcodeproj/project.pbxproj'
          assert all(sha((s/n).read_bytes())==h for n,h in m.items() if n!=derived)
          app=Path(os.environ['R872_APP']);d=plistlib.loads((app/'Info.plist').read_bytes())
          assert d['CFBundleVersion']=='872' and d['CFBundleShortVersionString']=='0.8.72'
          assert d['CFBundleIdentifier']=='com.zeek10191019.championsresearch' and d['MinimumOSVersion']=='27.0'
          assert Path('R872Delivery/architectures.txt').read_text().strip()=='arm64'
          # Debug builds may use a small launcher plus NAME.debug.dylib; inspect both
          # native images and every packaged app member, never infer code from file size.
          import struct,subprocess
          exe=app/'ChampionsOnDeviceResearch';images=[exe]+sorted(app.glob('*.dylib'))
          for image in images:
           b=image.read_bytes();assert len(b)>=32 and image.stat().st_mode & 0o111
           magic,cpu,subtype,kind,ncmds,cmdbytes,flags,reserved=struct.unpack('<8I',b[:32])
           assert magic==0xfeedfacf and cpu==0x0100000c
           assert kind==(2 if image==exe else 6)
           pos=32;platforms=[]
           for _ in range(ncmds):
            cmd,size=struct.unpack_from('<2I',b,pos);assert size>=8 and pos+size<=len(b)
            if cmd==0x32:platforms.append(struct.unpack_from('<I',b,pos+8)[0])
            pos+=size
           assert pos==32+cmdbytes and platforms==[2]
           assert subprocess.check_output(['lipo','-archs',str(image)],text=True).strip()=='arm64'
           print('R873_NATIVE_IMAGE_VERIFIED',image.name,len(b),kind,platforms)
          if exe.stat().st_size<100000:
           debug=app/'ChampionsOnDeviceResearch.debug.dylib'
           assert debug in images and debug.stat().st_size>100000
           assert debug.name in subprocess.check_output(['otool','-L',str(exe)],text=True)
          assert d['DTPlatformName']=='iphoneos'
          members={str(p.relative_to(app)):{'bytes':p.stat().st_size,'sha256':sha(p.read_bytes())} for p in sorted(app.rglob('*')) if p.is_file()}
          Path('R872Delivery/app_members.json').write_text(json.dumps(members,sort_keys=True,indent=2)+'\n')
          assert list(app.glob('*.xcprivacy'))
          Path('R872Delivery/generated_project_sha256.txt').write_text(sha((s/derived).read_bytes())+'\n')
          print('R873_BUILT_APP_IDENTITY_INPUTS_ARM64_PRIVACY_VERIFIED',d['CFBundleVersion'],d['CFBundleIdentifier'])
          PY
          mkdir -p "$RUNNER_TEMP/r872_payload/Payload"
          ditto "$R872_APP" "$RUNNER_TEMP/r872_payload/Payload/ChampionsOnDeviceResearch.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/r872_payload/Payload" R872Delivery/R872_Unsigned_DeviceTest.ipa
          python3 - <<'PY'
          from pathlib import Path
          import json,zipfile,hashlib,plistlib,os,datetime,base64,lzma
          out=Path('R872Delivery');ipa=out/'R872_Unsigned_DeviceTest.ipa';sha=lambda b:hashlib.sha256(b).hexdigest();app=Path(os.environ['R872_APP'])
          assert 100000<ipa.stat().st_size<300000000
          with zipfile.ZipFile(ipa) as z:
           assert z.testzip() is None
           prefix='Payload/ChampionsOnDeviceResearch.app/'
           assert all(not n.startswith('/') and '..' not in Path(n).parts for n in z.namelist())
           info=plistlib.loads(z.read(prefix+'Info.plist'));assert info['CFBundleVersion']=='872'
          members=json.loads((out/'app_members.json').read_text())
          with zipfile.ZipFile(ipa) as z:
           for name,meta in members.items():
            data=z.read(prefix+name);assert len(data)==meta['bytes'] and sha(data)==meta['sha256']
          metrics=json.loads((out/'preflight_metrics.json').read_text())
          receipt={'schema':'trueplan.r873.test-ipa.v1','created_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'revision':'R872','diagnostic':'D132','source_commit':'2bffcb2f36bc623a835e02171b519d05ffdb52ef','source_files':667,'source_tree_sha256':'223687d48eac630396bac33362234c17f057e1859dd6ce7c0d23636e76f6e8e9','preflight_ci':'https://github.com/zeek10191019-stack/true-plan-showdown-verification/actions/runs/43920089230','packaging_ci':os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],'packaging_commit':os.environ['GITHUB_SHA'],'swift':metrics,'iphoneos_build':'PASS','build_configuration':'Debug arm64 CODE_SIGNING_ALLOWED=NO','ipa_name':ipa.name,'ipa_bytes':ipa.stat().st_size,'ipa_sha256':sha(ipa.read_bytes()),'zip_crc_and_executable_readback':'PASS','all_app_member_readback':'PASS','native_image_members':{name:meta for name,meta in members.items() if name.endswith('.dylib') or name=='ChampionsOnDeviceResearch'},'app_version':'0.8.72','app_build':'872','real_299mb_split_readback':'PASS','ten_part_scaled_readback':'PASS','eleven_part_and_corrupt_part_hold':'PASS','physical_iphone_test':'PENDING','whole_79_field_certified':False,'no_inventoried_live_decoder_count':0,'current_battle_turn':'UNKNOWN_WITHOUT_EXPLICIT_PROOF','visual_form_scope':'CALIBRATED_CAPTURE_EVIDENCE_AND_CHAMPIONS_351_ICON_CATALOG_ESTIMATES','own_real_mega_positive_tested':False,'movie_to_png_unique_alignment_certified':False,'actual_lcd_under_1000ms_certified':False}
          (out/'VERIFICATION_R872.json').write_text(json.dumps(receipt,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          (out/'SHA256SUMS.txt').write_text(receipt['ipa_sha256']+'  '+ipa.name+'\n')
          (out/'DEVICE_TEST_R872.md').write_bytes(lzma.decompress(base64.b64decode('')))
          (out/'SCOPE_R872.md').write_bytes((out/'DEVICE_TEST_R872.md').read_bytes())
          print('R873_IPA_ZIP_CRC_SHA_ARM64_READBACK_PASS',json.dumps(receipt,ensure_ascii=False))
          PY
          cp R872Delivery/DEVICE_TEST_R872.md R872Delivery/RELEASE_NOTES.md
          # Create a draft first; publish only after a fresh asset download matches the IPA.
          gh release create r872-device-test R872Delivery/R872_Unsigned_DeviceTest.ipa R872Delivery/VERIFICATION_R872.json R872Delivery/SHA256SUMS.txt R872Delivery/DEVICE_TEST_R872.md R872Delivery/SCOPE_R872.md R872Delivery/source_manifest.json --repo "$GITHUB_REPOSITORY" --target 2bffcb2f36bc623a835e02171b519d05ffdb52ef --title 'R872 iPhone 16 Plus device test 0.8.72' --draft --prerelease --notes-file R872Delivery/RELEASE_NOTES.md
          mkdir -p "$RUNNER_TEMP/r872_release_readback"
          gh release download r872-device-test --repo "$GITHUB_REPOSITORY" --pattern R872_Unsigned_DeviceTest.ipa --dir "$RUNNER_TEMP/r872_release_readback"
          R872_READBACK="$RUNNER_TEMP/r872_release_readback/R872_Unsigned_DeviceTest.ipa"
          export R872_READBACK
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,zipfile
          r=json.loads(Path('R872Delivery/VERIFICATION_R872.json').read_text());p=Path(os.environ['R872_READBACK'])
          assert p.stat().st_size==r['ipa_bytes'] and hashlib.sha256(p.read_bytes()).hexdigest()==r['ipa_sha256']
          with zipfile.ZipFile(p) as z:assert z.testzip() is None
          print('R873_RELEASE_IPA_FRESH_DOWNLOAD_SHA_CRC_PASS',p.stat().st_size,r['ipa_sha256'])
