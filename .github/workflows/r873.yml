          a=next(x for x in r['assets'] if x['name']=='R872_Unsigned_DeviceTest.ipa');assert a['state']=='uploaded' and a['size']==receipt['ipa_bytes']
          assert set(x['name'] for x in r['assets'])=={'R872_Unsigned_DeviceTest.ipa','VERIFICATION_R872.json','SHA256SUMS.txt','DEVICE_TEST_R872.md','SCOPE_R872.md','source_manifest.json'}
          if a.get('digest'):assert a['digest']=='sha256:'+receipt['ipa_sha256']
          print('R873_PUBLISHED_RELEASE_VERIFIED',r['html_url']);print('R873_IPA_DOWNLOAD',a['browser_download_url'])
