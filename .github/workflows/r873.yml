          python3 - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path('R872Delivery/published_release.json').read_text());receipt=json.loads(Path('R872Delivery/VERIFICATION_R872.json').read_text())
          assert r['draft'] is False and r['prerelease'] is True
