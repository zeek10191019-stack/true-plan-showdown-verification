                            originalRawSHA256:sha,captureUptimeMS:t,sceneHint:"command"),"raw-not-blocked-\(frame)")
                      check(adapter.ocrCompleted(sessionID:"unit-nickname",epoch:1,frameID:frame,
                            originalRawSHA256:sha,candidates:[pair.0:pair.1]),"unicode-candidate-not-blocked-\(frame)")
                      let snapshot=adapter.previewStatus(monotonicMS:t+1)
                      check(snapshot["source_frame_id"] as? Int == frame,"same-raw-\(frame)")
                      check(snapshot["voice_enabled"] as? Bool == false,"no-voice-\(frame)")
                      check(snapshot["production_actions_authorized"] as? Bool == false,"no-brain-action-\(frame)")
                      check(snapshot["certified_current_fields"] as? Int == 0,"no-false-cert-\(frame)")
                  }
                  let n=sample.count
                  check(bridge.stats()["raw_received"] == n,"all-raw-kept")
                  check(bridge.stats()["raw_rejected"] == 0,"raw-rejection-zero")
                  adapter.recordingStopped()
                  check(adapter.previewStatus(monotonicMS:2000)["mode"] as? String == "NO_CAPTURE_FRAME","stop-safe")
                  print("PASS R1008_C9_UNICODE_NICKNAME_RAW_SURVIVAL \(checks)/\(checks)")
              }
          }
          C9_SWIFT
          swiftc "$app/R1001BattleSafetyCore.swift" "$app/R1000CapturePCBridge.swift" \
                 "$app/R1006CaptureHubStatus.swift" "$app/R1007CaptureIntegrationAdapter.swift" \
                 "$RUNNER_TEMP/c9-unicode.swift" -o "$RUNNER_TEMP/c9-unicode-test"
          "$RUNNER_TEMP/c9-unicode-test"
          echo C9_UTF8_TEST_OFFLINE_ONLY_NO_VOICE_OR_IPA
  windows-cli:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Fetch C6 YAML via Git objects without Windows-invalid path checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = Join-Path $env:RUNNER_TEMP 'c6-objects'
          New-Item -ItemType Directory -Force -Path $repo | Out-Null
          & git -C $repo init -q
          if ($LASTEXITCODE -ne 0) { throw 'INIT_FAILED' }
          & git -C $repo remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          & git -C $repo fetch --no-tags --filter=blob:none --depth=1 origin $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'FETCH_FAILED' }
          $workflow = Join-Path $env:RUNNER_TEMP 'c6-self.yml'
          # Do not round-trip Git bytes through PowerShell string arrays:
          # Windows WriteAllLines changes LF to CRLF and falsely trips the size gate.
          @'
          import hashlib,subprocess,sys
          from pathlib import Path
          repo,commit,dest=sys.argv[1:]
          path='.github/workflows/r1009-c11-runtime-wiring-audit.yml'
          raw=subprocess.run(['git','-C',repo,'show',f'{commit}:{path}'],
                             check=True,capture_output=True).stdout
          if not (10000 < len(raw) < 470000):raise SystemExit('WORKFLOW_RAW_SIZE_LIMIT')
          Path(dest).write_bytes(raw)
          assert Path(dest).read_bytes()==raw
          print('C11_WINDOWS_GIT_BYTES_PASS',len(raw),hashlib.sha256(raw).hexdigest())
          '@ | python - $repo $env:GITHUB_SHA $workflow
          if ($LASTEXITCODE -ne 0) { throw 'RAW_WORKFLOW_READ_FAILED' }
          Write-Output 'C11_WINDOWS_NO_CHECKOUT_PASS'
      - name: Offline Lenovo CMD + PowerShell checks (not physical-device certification)
        shell: pwsh
        env:
          BUNDLE_SHA: 'ab2ed826d3f4f0e1eda8fcb8d8b614571f2c4ed0a95606bb91e911b95dad5ef8'
          BUNDLE_FILES_SHA: '4a53e194f540f156de21b863fc2bfc7e92744087b6e88fab482e59caf2769585'
        run: |
          $ErrorActionPreference = 'Stop'
          $workflow = Join-Path $env:RUNNER_TEMP 'c6-self.yml'
          $dest = Join-Path $env:RUNNER_TEMP 'c6-pack'
          @'
          import base64,hashlib,io,json,os,re,sys,tarfile
          from pathlib import Path,PurePosixPath
          workflow=Path(sys.argv[1]);dest=Path(sys.argv[2]);archive_sha=sys.argv[3].lower();fingerprint=sys.argv[4].lower()
          lines=workflow.read_text(encoding='utf-8').splitlines()
          begin='# R1008_C6_TAR_XZ_BEGIN';end='# R1008_C6_TAR_XZ_END'
          if lines.count(begin)!=1 or lines.count(end)!=1:raise SystemExit('PAYLOAD_MARKER_COUNT')
          a=lines.index(begin);b=lines.index(end)
          if not(0<a<b and b-a<7000):raise SystemExit('PAYLOAD_BOUNDS')
          chunks=[s[2:].strip() for s in lines[a+1:b]]
          if any(not s.startswith('# ') for s in lines[a+1:b]):raise SystemExit('NON_COMMENT_PAYLOAD')
          base64_str=''.join(chunks)
          if not (10000<len(base64_str)<500000 and re.fullmatch(r'[A-Za-z0-9+/=]+',base64_str)):
              raise SystemExit('BASE64_INVALID')
          raw=base64.b64decode(base64_str,validate=True)
          if hashlib.sha256(raw).hexdigest()!=archive_sha:raise SystemExit('TAR_XZ_SHA_MISMATCH')
          if not (100000<len(raw)<350000):raise SystemExit('TAR_XZ_SIZE')
          if dest.exists() and any(dest.iterdir()):raise SystemExit('REFUSE_EXISTING_DEST')
          dest.mkdir(parents=True,exist_ok=True)
          found={};total=0
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:xz') as tar:
              entries=tar.getmembers()
              if len(entries)!=138:raise SystemExit('FILE_COUNT_MISMATCH')
              # Validate every name/size/type before writing any file to the working tree.
              for member in entries:
                  p=PurePosixPath(member.name)
                  if (not member.isfile() or p.is_absolute() or '\\' in member.name or '..' in p.parts
                      or member.name in found or len(member.name)>240 or member.size>5_000_000):
                      raise SystemExit('UNSAFE_TAR_ENTRY:'+member.name[:120])
                  total+=member.size
                  if total>5_000_000:raise SystemExit('UNCOMPRESSED_TOO_LARGE')
                  data=tar.extractfile(member).read()
                  if len(data)!=member.size:raise SystemExit('TRUNCATED_ENTRY')
                  found[member.name]=hashlib.sha256(data).hexdigest()
              real_fingerprint=hashlib.sha256(json.dumps(found,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
              if real_fingerprint!=fingerprint:raise SystemExit('CONTENT_MANIFEST_SHA_MISMATCH')
              for member in entries:
                  target=dest.joinpath(*PurePosixPath(member.name).parts)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  with target.open('xb') as fd:fd.write(tar.extractfile(member).read())
          print('C6_C4_SOURCE_SHA256_BUNDLE_PASS',len(found),'files; no symlinks/no traversal')
          '@ | python - $workflow $dest $env:BUNDLE_SHA $env:BUNDLE_FILES_SHA
          if ($LASTEXITCODE -ne 0) { throw 'DECODE_FAILED' }
          Set-Location $dest
          & python VERIFY_C4_PACK.py
          if ($LASTEXITCODE -ne 0) { throw 'SOURCE_MANIFEST_FAILED' }
          $ps1 = Get-Content -LiteralPath 'VERIFY_AND_OPEN_REPLAY.ps1' -Raw
          [scriptblock]::Create($ps1) | Out-Null
          # Original embedded C4 source remains immutable. Create an isolated Windows-only
          # normalized shadow tree AFTER verification; keep historical files untouched.
          $winCI = Join-Path $env:RUNNER_TEMP 'c7-windows-ci'
          @'
          import hashlib,json,shutil,sys
          from pathlib import Path
          original=Path(sys.argv[1]); dest=Path(sys.argv[2])
          if dest.exists():raise SystemExit('REFUSE_EXISTING_CI_COPY')
          shutil.copytree(original,dest,symlinks=False)
          manifest=dest/'R1008_C4_MANIFEST_SHA256.json'
          record=json.loads(manifest.read_text(encoding='utf-8'))
          assert record['revision']=='R1008-C4'
          changed=[]
          for filename in ('TEST_LOCAL.cmd','START_LENOVO_R1006.cmd','START_REPLAY_ONLY.cmd'):
              file=dest/filename
              raw=file.read_bytes()
              canonical=raw.replace(b'\r\n',b'\n').replace(b'\r',b'\n').replace(b'\n',b'\r\n')
              if raw!=canonical:
                  file.write_bytes(canonical)
                  record['source_hashes'][filename]=hashlib.sha256(canonical).hexdigest()
                  changed.append(filename)
              assert file.read_bytes().count(b'\n')==file.read_bytes().count(b'\r\n')
          assert changed==['TEST_LOCAL.cmd','START_LENOVO_R1006.cmd'],changed
          manifest.write_text(json.dumps(record,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          for filename in changed:
              assert original.joinpath(filename).read_bytes()!=dest.joinpath(filename).read_bytes()
          print('C7_WINDOWS_CRLF_SHADOW_COPY_ONLY',changed)
          '@ | python - $dest $winCI
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_CRLF_NORMALIZATION_FAILED' }
          Set-Location $winCI
          & python VERIFY_C4_PACK.py
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_SHADOW_SOURCE_AUDIT_FAILED' }
          $env:TRUEPLAN_CI = '1'
          & cmd.exe /d /c 'TEST_LOCAL.cmd'
          if ($LASTEXITCODE -ne 0) { throw 'LENOVO_CMD_TEST_FAILED' }
          # Ensure no original C4 source hashes changed while running the shadow copy.
          Set-Location $dest
          & python VERIFY_C4_PACK.py
          if ($LASTEXITCODE -ne 0) { throw 'ORIGINAL_C4_EVIDENCE_MUTATED' }
          Write-Output 'C7_WINDOWS_CLI_PASS_NOT_LENOVO_PHYSICAL'
