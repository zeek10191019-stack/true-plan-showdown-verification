                  guard !session.isEmpty, session.utf8.count <= 128,
                        epoch > 0, epoch <= Int64(Int.max),
                        frame > 0, frame <= Int64(Int.max),
                        observedMS >= 0, sha256.utf8.count == 64 else { return }
                  submit { [self] in
                      let e = Int(epoch)
                      guard e >= lastEpoch, !stoppedTokens.contains(session) else { return }
                      // A different session cannot reuse an already-seen generation.
                      // Retired callbacks from a disconnected stream must not re-arm it.
                      guard e > lastEpoch || lastSession.isEmpty || lastSession == session else { return }
                      if let i = identity {
                          guard e > i.epoch || (e == i.epoch && i.session == session) else { return }
                          if e != i.epoch || session != i.session {
                              adapter.recordingStopped()
                              identity = nil
                          }
                      }
                      if identity == nil {
                          guard adapter.recordingStarted(sessionID: session, epoch: e) else { return }
                          identity = (session, e)
                          lastEpoch = e
                          lastSession = session
                      }
                      _ = adapter.preservedFrame(sessionID: session, epoch: e,
                          frameID: Int(frame), originalRawSHA256: sha256,
                          captureUptimeMS: observedMS, sceneHint: "unknown")
                  }
              }
              // Invoke on the quick OCR publication path only. An OCR error or nickname
              // mismatch cannot stop capture, and is never promoted to current authority.
              public func ocrCompleted(session: String, epoch: Int64, frame: Int64,
                                       sha256: String, values: [String:Int64]) {
                  guard !session.isEmpty, epoch > 0, epoch <= Int64(Int.max),
                        frame > 0, frame <= Int64(Int.max), sha256.utf8.count == 64,
                        values.count <= 4096 else { return }
                  // This represents numeric quick OCR candidates, NOT a game turn.
                  let bounded = Dictionary(uniqueKeysWithValues:
                      values.keys.sorted().prefix(128).compactMap { key -> (String,String)? in
                          guard key.utf8.count <= 96, let v = values[key] else { return nil }
                          return ("quick." + key, String(v))
                      })
                  submit { [self] in
                      guard let i = identity, i.session == session, i.epoch == Int(epoch) else { return }
                      _ = adapter.ocrCompleted(sessionID: session, epoch: Int(epoch),
                          frameID: Int(frame), originalRawSHA256: sha256, candidates: bounded)
                  }
              }
              public func captureStopped(session: String) {
                  guard !session.isEmpty, session.utf8.count <= 128 else { return }
                  // Stop invalidation is never dropped due to OCR backpressure.
                  queue.async { [self] in
                      if let i = identity, i.session == session {
                          adapter.recordingStopped()
                          identity = nil
                      }
                      if !stoppedTokens.contains(session) {
                          stoppedTokens.insert(session)
                          closedOrder.append(session)
                          if closedOrder.count > 64 {
                              let old = closedOrder.removeFirst()
                              stoppedTokens.remove(old)
                          }
                      }
                  }
