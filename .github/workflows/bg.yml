name: R611-R612 Batch - Repair R610 And Verify HUD Temporal Evidence (No IPA)
"on":
  push:
    branches: [main]
    paths: [.github/workflows/bg.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trueplan-r611batch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
      && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 55
    env:
      PYTHONOPTIMIZE: "0"
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
    steps:
      - name: Restore pinned R610 and integrate R611 R612
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'R611_BATCH_REPLAY'
          import base64,hashlib,lzma,urllib.request,textwrap
          from pathlib import Path
          url=(
            'https://raw.githubusercontent.com/'
            'zeek10191019-stack/true-plan-showdown-verification/'
            '8397626098825dad3c5e509dd061172734c30104/'
            '.github/workflows/bf.yml'
          )
          parent=urllib.request.urlopen(url,timeout=90).read()
          assert len(parent)==14922,'R610_PARENT_SIZE_DRIFT'
          assert hashlib.sha256(parent).hexdigest()== (
            '16a32947376f967c3695e82bb87e54c6be7874e8c6ee27be93423a2f90c86004'
          ),'R610_PARENT_SHA_DRIFT'
          text=parent.decode('utf-8')
          start="          python3 - <<'R610_REPLAY'\n"
          end="\n          R610_REPLAY"
          assert text.count(start)==1 and text.count(end)==1,'R610_REPLAY_MARKER_DRIFT'
          source=textwrap.dedent(text.split(start,1)[1].split(end,1)[0])
          exec(compile(source,'PINNED_R610_REPLAY','exec'),{'__name__':'__main__'})
          root=Path('app/ios/ChampionsOnDevice')
