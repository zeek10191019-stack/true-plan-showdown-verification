name: R577 Unified PNG OCR and Mega Evidence (No IPA)
"on":
  push:
    branches: [main]
    paths: [.github/workflows/r577.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: xcode-27
            role: IOS27_NATIVE
          - runner: macos-26-intel
            role: PORTABLE_OCR
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      SCREEN_READ_CI_ROLE: ${{ matrix.role }}
      PYTHONOPTIMIZE: "0"
    steps:
      - name: Replay exact R576, apply R577 source with SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'RESTORE_R577'
          import ast,base64,hashlib,json,lzma,re,textwrap,urllib.request
          from pathlib import Path
          sha=lambda b:hashlib.sha256(b).hexdigest()
          url='https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/311742dc0ba9398254a83f5b083dae2e85cb255f/.github/workflows/r576.yml'
          raw=urllib.request.urlopen(url,timeout=120).read()
          assert len(raw)==26402 and sha(raw)=='5b8395bf6dab6550fde6da29359bc702b0249423548e2814aa9e867dfc172a97','R577_PARENT_R576_CHANGED'
          m=re.search(r"python3 - <<'RESTORE_R576'\n(.*?)\n\s+RESTORE_R576",raw.decode(),re.S)
          assert m,'R577_PARENT_SCRIPT_MISSING'
          code=textwrap.dedent(m.group(1));ast.parse(code)
          exec(compile(code,'R576_PINNED_REPLAY','exec'))
          blob=''
          patch=json.loads(lzma.decompress(base64.b64decode(blob,validate=True)))
          assert len(patch)==5
          assert set(patch)==set(['app/ios/ChampionsOnDevice/ChampionsOnDeviceApp.swift', 'app/ios/ChampionsOnDevice/Info.plist', 'app/ios/ChampionsOnDevice/R576OfflinePNGInspector.swift', 'app/ios/ChampionsOnDevice/R577OfflineEvidenceReport.swift', 'tests/R577OfflineEvidenceReportHarness.swift'])
          for name,x in sorted(patch.items()):
            p=Path(name)
            if x['old'] is None:
              assert not p.exists(),('R577_NEW_FILE_ALREADY_EXISTS',name)
              p.parent.mkdir(parents=True,exist_ok=True)
              new=x['text'].encode()
            else:
              prior=p.read_bytes()
              assert sha(prior)==x['old'],('R577_PARENT_HASH_MISMATCH',name)
              lines=prior.decode().splitlines(keepends=True)
              for lo,hi,text in reversed(x['diff']):
                assert 0<=lo<=hi<=len(lines)
                lines[lo:hi]=[text]
              new=''.join(lines).encode()
            assert len(new)==x['size'] and sha(new)==x['new'],('R577_PATCH_HASH_MISMATCH',name)
            p.write_bytes(new)
          assert len(list(Path('app/ios/ChampionsOnDevice').glob('*.swift')))==120
          assert 'offlinePNG.inspectAll()' in Path('app/ios/ChampionsOnDevice/ChampionsOnDeviceApp.swift').read_text()
          assert 'R548MegaSceneProbe.inspect(png,budgetMs:1800)' in Path('app/ios/ChampionsOnDevice/R576OfflinePNGInspector.swift').read_text()
          assert 'R558FullFrameOCR.inspect(decoded:decoded' in Path('app/ios/ChampionsOnDevice/R576OfflinePNGInspector.swift').read_text()
          print('PASS_R577_DIFFERENTIAL_REPLAY_EXACT_SOURCE_SHA')
          RESTORE_R577
      - name: Swift syntax and R577 evidence report native regression
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse app/ios/ChampionsOnDevice/*.swift
          swiftc -O -assert-config Debug -swift-version 5 -parse-as-library app/ios/ChampionsOnDevice/R576OfflinePNGImportGate.swift app/ios/ChampionsOnDevice/R577OfflineEvidenceReport.swift tests/R577OfflineEvidenceReportHarness.swift -o "$RUNNER_TEMP/r577-evidence-test"
          "$RUNNER_TEMP/r577-evidence-test"
      - name: Existing Apple native regression and iPhoneOS build
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/run_r571_native.py
      - name: Scope notice
        if: always()
        run: |
          echo 'R577 screen-reading only; no IPA; no automatic uploads; owner/mega visual/turn/game accuracy remain uncertified'
