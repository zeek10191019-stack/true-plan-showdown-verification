jobs:
  build:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            1e63efa4db514cc122f2940a39623d9bc65c554c
      - name: Verify R694 and build IPA
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os,re,base64,lzma,hashlib
          import pathlib,urllib.request,ast
          url=('https://raw.githubusercontent.com/'
            'zeek10191019-stack/'
            'true-plan-showdown-verification/'
            'main/.github/workflows/w0.yml')
          req=urllib.request.Request(url,headers={
            'User-Agent':'R694-Pinned-Builder'})
          with urllib.request.urlopen(
            req,timeout=40) as res:
            old=res.read(15000)
          assert len(old)==9079
          assert hashlib.sha256(old).hexdigest()==(
            '21082b8c208802b9aa21a2f9c1b6914e'
            '469810ca7206b50d60cb0a89a6b0c44b')
          m=re.search(rb'(?m)^  R693_PKG: >-\n'
            rb'((?:    [^\n]*\n)+)',old)
          assert m,'R693_PINNED_PACKAGE_MISSING'
          os.environ['R693_PKG']=b''.join(
            m[1].split()).decode('ascii')
          raw=lzma.decompress(base64.b64decode(
            os.environ['R694_PKG']),
            format=lzma.FORMAT_ALONE)
          assert hashlib.sha256(raw).hexdigest()==(
            'c763cd6c13adbd47e463adcf8d295783'
            'd37e6b907fa755b821894fbbe05b603c')
          names=['R694TemporalHUDEvidence.swift',
            'R694Patch.py','R694MakeBuild.py',
            'R694Smoke.swift']
          sizes=[7647, 1634, 2298, 4063]
          assert sum(sizes)==len(raw)
          pos=0
          for name,size in zip(names,sizes):
            folder='tests' if name.endswith(
              'Smoke.swift') else 'tools'
            p=pathlib.Path(folder)/name
            p.parent.mkdir(parents=True,
              exist_ok=True)
            p.write_bytes(raw[pos:pos+size])
            pos+=size
          print('R694_SOURCE_SHA_PASS',flush=True)
          text=old.decode('utf-8')
          marker="          python3 - <<'PYCODE'\n"
          start=text.index(marker)+len(marker)
          end=text.index('\n          PYCODE',start)
          block=text[start:end]
          body='\n'.join(line[10:] for line in
            block.splitlines())
          needle=("['python3','tools/"+
            "R693MakeBuild.py']")
          assert body.count(needle)==1
          body=body.replace(needle,
            "['python3','tools/R694MakeBuild.py']")
          ast.parse(body)
          exec(compile(body,'r693','exec'),{})
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: R694-unsigned-iLoader-IPA
          path: dist/R694*
          if-no-files-found: error
          retention-days: 7
