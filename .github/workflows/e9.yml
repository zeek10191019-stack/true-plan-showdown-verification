name: R747 Disk JPEG Mega Evidence Gate - NO IPA
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/e9.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
    - name: Restore SHA pinned R746 and apply lossless R747 changes
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
