      - name: Probe ScreenCaptureKit availability in simulator and device SDKs
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          printf '%s\n' 'import ScreenCaptureKit' 'func check() { _ = SCContentSharingPicker.shared }' > /tmp/r27394-screenkit-probe.swift
          for sdk_name in iphonesimulator iphoneos; do
            sdk_path="$(xcrun --sdk "$sdk_name" --show-sdk-path)"
            if [ "$sdk_name" = iphonesimulator ]; then triple='arm64-apple-ios27.0-simulator'; else triple='arm64-apple-ios27.0'; fi
            echo "----- $sdk_name SDK=$sdk_path -----"
            if [ -d "$sdk_path/System/Library/Frameworks/ScreenCaptureKit.framework" ]; then echo 'FRAMEWORK_DIRECTORY=present'; else echo 'FRAMEWORK_DIRECTORY=absent'; fi
            if xcrun --sdk "$sdk_name" swiftc -typecheck -sdk "$sdk_path" -target "$triple" /tmp/r27394-screenkit-probe.swift > "/tmp/r27394-$sdk_name.log" 2>&1; then
              echo "SDK_PROBE_${sdk_name}=PASS"
              echo PASS > "/tmp/r27394-$sdk_name.status"
            else
              echo "SDK_PROBE_${sdk_name}=FAIL"
              sed -n '1,75p' "/tmp/r27394-$sdk_name.log"
              echo FAIL > "/tmp/r27394-$sdk_name.status"
            fi
          done
