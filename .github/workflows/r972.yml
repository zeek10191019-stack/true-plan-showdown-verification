      - name: Replay the retained image fixtures
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e '
            steps = YAML.load_file(ARGV.fetch(0), aliases: true).fetch("jobs").fetch(ARGV.fetch(1)).fetch("steps")
            puts steps.find { |step| step["name"] == ARGV.fetch(2) }.fetch("run")
          ' "$RUNNER_TEMP/r971.yml" vision 'Replay the retained image fixtures' > "$RUNNER_TEMP/r972-image-tests.sh"
          bash "$RUNNER_TEMP/r972-image-tests.sh"
