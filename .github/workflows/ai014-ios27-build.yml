name: AI014 iPhoneOS 27 device test
'on':
  push:
    branches: [r987-ocr-pc-regression, ai014-ios27-device-build]
    paths: [.github/workflows/ai014-ios27-build.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: ai014-verified-device-build
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && !github.event.repository.private && (github.ref == 'refs/heads/r987-ocr-pc-regression' || github.ref == 'refs/heads/ai014-ios27-device-build')
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFIED_SHA: 5eebfff8d8d43c3cc7432aafbb39dd0724fc3c3c
      VERIFIED_RUN: '45049580448'
      VERIFIED_JOB: '137291516691'
      R995_BUILD_COMMIT: 736cb296fef2136f41dfcdfd86ddf02005ca5952
      RELEASE_TAG: ai014-ios27-device-test
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: .github/workflows/ai014-ios27-build.yml
    - name: Verify Xcode and restore the tested R995 source
      shell: bash
      run: |
        set -euo pipefail
        base="$RUNNER_TEMP/ai014-r995-ios27.yml"
        git show "$R995_BUILD_COMMIT:.github/workflows/r995-ios27-build.yml" > "$base"
        echo '40ca155e2c69f840b2bd2d5078c91928ce2755ac9d2be77897f61d5b146cd9f1  ai014-r995-ios27.yml' |
          (cd "$RUNNER_TEMP" && shasum -a 256 -c -)
        for step in 'Confirm Xcode 27 and the completed R995 regression steps' 'Restore the exact source that passed the R995 tests'; do
          ruby -ryaml -e '
            steps = YAML.load_file(ARGV[0], aliases: true).fetch("jobs").fetch("build").fetch("steps")
            puts steps.find { |step| step.fetch("name","") == ARGV[1] }.fetch("run")
          ' "$base" "$step" > "$RUNNER_TEMP/ai014-restore.sh"
          bash "$RUNNER_TEMP/ai014-restore.sh"
        done
