      - name: "Restore pinned source and verify every R561 input"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'RESTORE_GUARD'
          import base64,hashlib,json,lzma,sys
          from pathlib import Path
          folder=Path('.r561_overlay')
          parts=[f'part_{i:04d}' for i in range(5)]
          assert sorted(p.name for p in folder.iterdir())==parts,'GUARD_PARTS'
          compressed=base64.b64decode(b''.join((folder/n).read_bytes() for n in parts),validate=True)
          decoder=lzma.LZMADecompressor();data=decoder.decompress(compressed,max_length=1000001)
          assert len(data)==190713 and decoder.eof and not decoder.unused_data,'GUARD_PAYLOAD_SIZE'
          assert hashlib.sha256(data).hexdigest()=='47d6416e2e1d5dc32e071daaf284bb5b1abfdfdfff856b8c904f43a881fb738c','GUARD_PAYLOAD_SHA'
          bundle=json.loads(data)
          assert set(bundle)=={'source','bootstrap'} and set(bundle['bootstrap'])=={'runtime_reference_source.py','source_guard_payload.py'},'GUARD_BOOTSTRAP_SET'
          bootstrap=folder/'bootstrap';bootstrap.mkdir(exist_ok=False)
          for name,text in bundle['bootstrap'].items():
              assert isinstance(text,str) and len(text)<30000,'GUARD_BOOTSTRAP_SIZE'
              with (bootstrap/name).open('x') as stream:stream.write(text)
          sys.path.insert(0,str(bootstrap))
          from source_guard_payload import restore_payload
          restore_payload(Path.cwd(),bundle['source'])
          print('R561_EXACT_SOURCE_OVERLAY_VERIFIED; FULL_OCR_CERTIFICATION_NOT_REQUESTED_BY_THIS_SUBGATE')
          RESTORE_GUARD
      - name: "Run source guards, native regressions and iPhoneOS build subchecks"
        shell: bash
        run: |
          python3 tools/run_macos_checks.py --source-guard-only
      - name: "Return subcheck evidence after success or failure; no artifacts/cache"
        if: always()
        shell: bash
        run: |
          python3 - <<'RETURN_GUARD'
          from pathlib import Path
          import base64,hashlib,io,zipfile
          buffer=io.BytesIO()
          with zipfile.ZipFile(buffer,'w',compression=zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(Path('reports').glob('*')):
                  if path.suffix in ('.json','.log') and path.stat().st_size<2000000:archive.write(path,path.name)
          data=buffer.getvalue();encoded=base64.b85encode(data).decode()
          print('R561G_REPORT_B85_BEGIN',hashlib.sha256(data).hexdigest(),len(data))
          for i in range(0,len(encoded),500):print('R561G_REPORT_B85',encoded[i:i+500])
          print('R561G_REPORT_B85_END')
          print('SOURCE_GUARD_EVIDENCE_ONLY; FULL_APP_OCR_GAME_DEVICE_CERTIFICATION_FALSE; NO_IPA')
          RETURN_GUARD
