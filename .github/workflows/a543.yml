3e990a7db81803d7a7bb3da08975d63175afce2103dbd63965ad79f28f00ab9','R543_SOURCE_TREE_CHANGED'\nfor _n543,_d543 in {'CaptureCoordinator.swift': '1a04d170963235de99473b6d01be83414ea4e4a656d810567b8e732824437c13', 'R543SpatialCoverageAudit.swift': 'dfcfc0c25bfff6c378391f8815387b185a3b3b1c29af2fafef65bf86b09356ca'}.items():\n    assert _h543.sha256((files/_n543).read_bytes()).hexdigest()==_d543,'R543_MODIFIED_FILE_CHANGED_'+_n543\nprint('PASS_R543_87_EXACT_SWIFT_SOURCE_AND_SPATIAL_PROVENANCE_GATE',flush=True)\n"
          anchor='assert source.count("expected_input='
          assert builder.count(anchor)==1
          builder=builder.replace(anchor,'extra += '+repr(extra)+'\n'+anchor,1)
          changes = [("target=Path('dist/R542.ipa')", "target=Path('dist/R543.ipa')"), ("info['CFBundleVersion']='542';info['CFBundleShortVersionString']='0.5.42'", "info['CFBundleVersion']='543';info['CFBundleShortVersionString']='0.5.43'"), ("record={'release':'R542'", "record={'release':'R543'"), ("'source_tree_sha256':'9cf5e055a36efd0b04262de9e6b6616b1498ce709902c709816e405451c1b85f'", "'source_tree_sha256':'a3e990a7db81803d7a7bb3da08975d63175afce2103dbd63965ad79f28f00ab9'"), ("Path('dist/R542_BUILD_AUDIT.json')", "Path('dist/R543_BUILD_AUDIT.json')"), ("print('PASS_R542_UNSIGNED_IPA_BUILD'", "print('PASS_R543_UNSIGNED_IPA_BUILD'"), ("assert len(swift)==86,'R542_SWIFT_COUNT'", "assert len(swift)==87,'R543_SWIFT_COUNT'"), ('source=source.replace("\'source_count\':85","\'source_count\':86",1)', 'source=source.replace("\'source_count\':85","\'source_count\':87",1)')]
