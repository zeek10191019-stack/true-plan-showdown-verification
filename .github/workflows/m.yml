jobs:
  verify:
    if: >-
      github.repository ==
      'zeek10191019-stack/true-plan-showdown-verification'
      && github.ref == 'refs/heads/main'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 82ce233dac985dbe8b2eb27b3d47c4f9a6c39323
        persist-credentials: true
    - name: Restore and run R666 reader gates
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYCODE'
        import os,base64,lzma,hashlib
        from pathlib import Path
        raw=lzma.decompress(base64.b85decode(''.join(
          os.environ['PACK'].split())))
        assert len(raw)==13478
        assert hashlib.sha256(raw).hexdigest()==(
          'f0cc6c1e1edb10eef8d2b53a716dfc4e' +
          'b6ec3a072a2246530f941bfa619adbb3')
        names=[
          'app/ios/ChampionsOnDevice/' +
          'R666TypedOCRCandidates.swift',
          'tools/r666_patch.py',
          '__TEMP__/r666-mini-run.sh',
        ]
        sizes=[10115, 1081, 2282]
        pos=0
        for name,size in zip(names,sizes):
          block=raw[pos:pos+size]
          assert len(block)==size
          pos+=size
          path=(Path(os.environ['RUNNER_TEMP'])/
            name.split('/')[-1]) if name.startswith(
            '__TEMP__/') else Path(name)
          assert not path.exists(),name
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_bytes(block)
        assert pos==len(raw)
        print('R666_SOURCE_SHA_RESTORE_PASS')
        PYCODE
        bash "$RUNNER_TEMP/r666-mini-run.sh"
