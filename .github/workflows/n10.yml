jobs:
  build:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            1e63efa4db514cc122f2940a39623d9bc65c554c
      - name: Restore R708 and self-contained R709 patch
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os,re,base64,lzma,hashlib
          import pathlib,urllib.request,ast
          import zipfile,plistlib,struct
          def checked(file,size,digest):
              prefix=(
                'https://raw.githubusercontent.com/'
                'zeek10191019-stack/'
                'true-plan-showdown-verification/'
                'main/.github/workflows/')
              request=urllib.request.Request(
                prefix+file,
                headers={'User-Agent':'R709-Pin'})
              with urllib.request.urlopen(
                    request,timeout=40) as f:
                  data=f.read(size+1)
              assert len(data)==size,(
                'SOURCE_SIZE',file)
              assert (hashlib.sha256(data).hexdigest()
                  ==digest),(

                'SOURCE_SHA',file)
              return data
          n8=checked('n8.yml',9237,
            '6ce4fbb4cf3cfd0a848be80f5574e541'
            '26e55e2b1e62efc2c189c790a749aadd')
          y1=checked('y1.yml',9945,
            '6983307d31a1f6247915e5a7723b4621'
            '23ac562f17237bc5faa50f6fd425038d')
          z9=checked('z9.yml',20253,
            '2439737fbfc4a6960898453e0d92b4c9'
            'e922749f26c59c5e76f4204425b8ac3e')
          for blob,keys in [
              (n8,('R708_PKG',)),
              (y1,('R705_PKG','R705_RUNNER_PKG')),
              (z9,('R703_PKG','R704_PKG'))]:
              for key in keys:
                  pattern=(rb'(?m)^  '+key.encode()+
                     rb': >-\n((?:    [^\n]*\n)+)')
                  match=re.search(pattern,blob)
                  assert match,('MISSING_PKG',key)
                  os.environ[key]=b''.join(
                    match[1].split()).decode('ascii')
          def unpack(key):
              return lzma.decompress(base64.b64decode(
                  os.environ[key]),
                  format=lzma.FORMAT_ALONE)
          # Restore R708 patched code + smoke fixture.
          bundle=unpack('R708_PKG')
          assert hashlib.sha256(bundle).hexdigest()==(
            ('2d88120ff5d18f055019a7d4a6542917'
             '45ee4064a4b69b9063f48ac4ae2a683f'))
          names=['R708Patch.py',
                 'tests/R708Smoke.swift',
                 'R708BuildModify.py']
          sizes=[5448, 1686, 1060]
          assert sum(sizes)==len(bundle)
          offset=0
          for name,size in zip(names,sizes):
              folder=('tests' if
                  name.endswith('.swift')
                else 'tools')
              target=(pathlib.Path(folder)/
                  pathlib.Path(name).name)
              target.parent.mkdir(
                parents=True,exist_ok=True)
              target.write_bytes(
                bundle[offset:offset+size])
              offset+=size
          # Restore SHA-pinned R709 source.
          newer=unpack('R709_PKG')
          assert hashlib.sha256(newer).hexdigest()==(
            ('b0fcf8b130b73b194802d7a16c51abbb'
             'f2f7a49458cd92947e145b6cc38de69b'))
          names=[
            'R709Patch.py',
            'R709PreviewCore.swift',
            'R709PreviewVision.swift',
            'R709BuildModify.py',
            'tests/R709Smoke.swift']
          sizes=[10384, 6093, 3389, 1134, 3476]
          assert sum(sizes)==len(newer)
          offset=0
          for name,size in zip(names,sizes):
              folder=('tests' if
                  name.endswith('.swift')
                else 'tools')
              target=(pathlib.Path(folder)/
                  pathlib.Path(name).name)
              target.parent.mkdir(
                parents=True,exist_ok=True)
              target.write_bytes(
                newer[offset:offset+size])
              offset+=size
          runner=unpack('R705_RUNNER_PKG')
          assert hashlib.sha256(runner).hexdigest()==(
            '02e5b6c6a5262be5ff2c6e8975762e22'
            '722ecf139e424b3bc5c822fe1ed8aeb9')
          code=runner.decode('utf8')
          marker='path.write_text(fixed)'
          assert code.count(marker)==1
          code=code.replace(marker,
            'fixed=upgrade_r705_builder(fixed)\n'+
            marker,1)
          ast.parse(code)
          context={}
          for name in ['R708BuildModify.py',
                       'R709BuildModify.py']:
              helper=pathlib.Path('tools')/name
              exec(compile(helper.read_text(),
                name,'exec'),context)
          context['__name__']='__main__'
          exec(compile(code,'R709_RUNNER','exec'),
            context)
          ipa=pathlib.Path(
            'dist/R709_Unsigned_OneTap.ipa')
          assert ipa.is_file()
          assert 0<ipa.stat().st_size<300000000
          with zipfile.ZipFile(ipa) as z:
              assert z.testzip() is None
              base=('Payload/'
                'ChampionsOnDeviceResearch.app/')
              info=plistlib.loads(
                z.read(base+'Info.plist'))
              assert info['CFBundleVersion']=='709'
              v=info['CFBundleShortVersionString']
              assert v=='0.7.9'
              exe=z.read(
                base+info['CFBundleExecutable'])
              assert exe[:4]==bytes.fromhex('cffaedfe')
              assert struct.unpack('<I',exe[4:8])[0]==(
                0x0100000c)
          print('R709_PREVIEW_BUILD_PASS',flush=True)
          print('R709_IPA_BYTES='+str(
              ipa.stat().st_size),flush=True)
          print('R709_IPA_SHA256='+hashlib.sha256(
              ipa.read_bytes()).hexdigest(),flush=True)
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: R709-repaired-selection-IPA
          path: dist/R709*
          if-no-files-found: error
          retention-days: 7
