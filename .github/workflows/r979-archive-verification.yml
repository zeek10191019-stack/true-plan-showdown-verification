name: R979 archive integrity and reshare
'on':
  push:
    branches: [r975-device-regression]
    paths: [.github/workflows/r979-archive-verification.yml]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: r979-unsigned-device-test
  cancel-in-progress: false
jobs:
  verify:
    name: Swift, browser, PC and iPhoneOS regression
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && !github.event.repository.private && github.ref == 'refs/heads/r975-device-regression'
    runs-on: xcode-27
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RELEASE_TAG: r979-unsigned-device-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: .github/workflows/r979-archive-verification.yml
      - name: Restore verified R978 and apply the R979 corrections
        shell: bash
        run: &restore |
          set -euo pipefail
          git show ab11572f0a2ecb7dfb07a8f8571f00f909142b8e:.github/workflows/r978-lifecycle-verification.yml > "$RUNNER_TEMP/r978-baseline.yml"
          echo 'f3fff35187e2fbf5c0089ff3d99a4277ee6a906deeb725058a9c91ad6a6ea99d  r978-baseline.yml' | (cd "$RUNNER_TEMP" && shasum -a 256 -c -)
          ruby -ryaml -e '
            steps = YAML.load_file(ARGV.fetch(0), aliases: true).fetch("jobs").fetch("verify").fetch("steps")
            puts steps.find { |step| step["name"] == "Restore verified R977 and apply the R978 corrections" }.fetch("run")
          ' "$RUNNER_TEMP/r978-baseline.yml" > "$RUNNER_TEMP/r978-restore.sh"
          bash "$RUNNER_TEMP/r978-restore.sh"
          mkdir -p "$RUNNER_TEMP/r978-archive-baseline"
          for name in R714ChunkedEvidence R730SplitReadback R936ExportJob R689StreamingZIP R548ResearchArchive R551EvidenceIntegrity R555StoredZIPReadback R729EvidenceTransportPolicy R731ArchiveCapacity; do
            cp "pinned-r793/source/app/ios/ChampionsOnDevice/$name.swift" "$RUNNER_TEMP/r978-archive-baseline/"
