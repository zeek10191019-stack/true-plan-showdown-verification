name: R603 Auto - One Tap Readiness and Feature Source Trace (No IPA)
"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/aw.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
