          python3 -m unittest discover -s tests -p 'test_r602_patch.py' -v
          python3 tools/run_r571_native.py || {
            for f in reports/xcode_iphoneos_build.log \
                     reports/r574_png_replay_compile.log; do
              test ! -f "$f" || grep -nE 'error:|BUILD FAILED' "$f" | tail -n 60 || true
            done
            exit 1
