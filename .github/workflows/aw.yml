          set -euo pipefail
          export PYTHONPATH=.
          python3 tools/r603_source_audit.py
          python3 -m unittest discover -s tests -p 'test_r603_*.py' -v
          swiftc -parse-as-library \
            app/ios/ChampionsOnDevice/R603FormReadiness.swift \
            tests/R603FormReadinessHarness.swift \
            -o "$RUNNER_TEMP/r603"
          "$RUNNER_TEMP/r603"
          swiftc -frontend -parse app/ios/ChampionsOnDevice/*.swift
          swiftc -parse-as-library \
            app/ios/ChampionsOnDevice/R596FormCatalog.swift \
            app/ios/ChampionsOnDevice/R597FormEvidenceBridge.swift \
            app/ios/ChampionsOnDevice/R598OneButtonFormAttachment.swift \
            app/ios/ChampionsOnDevice/R599BoundOneButton.swift \
            app/ios/ChampionsOnDevice/R600CollectorHandshake.swift \
            app/ios/ChampionsOnDevice/R602OneTapFormArchive.swift \
            tests/R602OneTapFormArchiveHarness.swift \
            -o "$RUNNER_TEMP/r602"
