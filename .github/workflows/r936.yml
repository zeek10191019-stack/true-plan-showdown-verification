      if: matrix.suite == 'vision'
      shell: bash
      run: |
        export DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
        set -euo pipefail
        for step in 42 43 44; do
          ruby -ryaml -e 'puts YAML.load_file(ARGV[0]).fetch("jobs").fetch("verify").fetch("steps").fetch(ARGV[1].to_i).fetch("run").gsub("R918", "R920").gsub(ARGV[2], ARGV[3])' pinned-r918/.github/workflows/r918_inspection_pixels.yml "$step" '9d741abc9b4f32ebd5df90086c73b1a1387ef2106b4bf5fc6326b8cad6fcfcc2' 'f1ce3016d15f48450789abe4b38ec69f68f452c4c5f7ec948ef322ae39c22e54' > "$RUNNER_TEMP/r920-replay.sh"
