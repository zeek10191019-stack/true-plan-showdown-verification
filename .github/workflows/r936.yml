name: R936 iPhone save recovery, regression and device IPA
'on':
  push:
    branches:
    - main
    - r905-preflight
    paths:
    - .github/workflows/r936.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: r936-save-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: R936 ${{ matrix.suite }}
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
        - suite: iphone
          runner: xcode-27
        - suite: large
          runner: macos-26
        - suite: full
          runner: macos-26
        - suite: vision
          runner: macos-26
        - suite: sim
          runner: xcode-27
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: .github/workflows/r936.yml
    - name: Materialize each pinned workflow from its verified commit
      shell: bash
      run: |-
        set -euo pipefail
        python3 - <<'PINS'
