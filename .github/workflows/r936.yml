    branches:
    - main
    - r905-preflight
    paths:
    - .github/workflows/r936.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: r936-save-${{ github.ref }}
  cancel-in-progress: false
jobs:
