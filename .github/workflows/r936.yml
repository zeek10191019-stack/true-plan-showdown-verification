        patch -s -t -p1 -F 0 -d pinned-r793/source -i "$PWD/r936-tests/R936_SOURCE.patch"
        python3 pinned-r793/source/tools/generate_xcode_project.py
        python3 - <<'VERIFY'
        from pathlib import Path
        import json,hashlib
        root=Path('pinned-r793/source')
        files={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file() and not set(p.parts)&{'.build','.swiftpm','__pycache__'}}
        manifest=json.loads((root/'source_manifest.json').read_text())
        assert {k:v for k,v in files.items() if k!='source_manifest.json'}==manifest
        digest=hashlib.sha256(''.join(k+'\t'+files[k]+'\n' for k in sorted(files)).encode()).hexdigest()
        assert len(files)==683 and digest=='2497c444809160f46cbafad4d9ea6bbda3a5e61f562938e767738de38f5db009',(len(files),digest)
        Path('R834Proof/SOURCE_TREE_SHA256.txt').write_text(digest+'\n')
        print('R936_SOURCE_VERIFIED',len(files),digest)
        VERIFY
    - name: Build the audited arm64 package
      run: |-
        set -euo pipefail
        xcodebuild -project pinned-r793/source/app/ios/ChampionsOnDeviceResearch.xcodeproj -scheme ChampionsOnDeviceResearch -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO -derivedDataPath "$RUNNER_TEMP/r936_device" build > "$RUNNER_TEMP/native.log" 2>&1 || { grep -E -B2 -A2 'error:|BUILD FAILED' "$RUNNER_TEMP/native.log"; exit 1; }
        grep -F 'BUILD SUCCEEDED' "$RUNNER_TEMP/native.log"
        app="$RUNNER_TEMP/r936_device/Build/Products/Release-iphoneos/ChampionsOnDeviceResearch.app"
        test "$(lipo -archs "$app/ChampionsOnDeviceResearch")" = arm64
        test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Info.plist")" = 936
        test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist")" = 0.9.36
        echo R936_IPHONEOS_ARM64_RELEASE_VERIFIED
    - name: Publish and read back the verified device-test IPA
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        set -euo pipefail
        out="$PWD/R936Delivery"
        app="$RUNNER_TEMP/r936_device/Build/Products/Release-iphoneos/ChampionsOnDeviceResearch.app"
        mkdir -p "$out/Payload"
        cp -R "$app" "$out/Payload/"
        cd "$out"
        zip -qry R936_Unsigned_DeviceTest.ipa Payload
        python3 - <<'IPA'
        import os,zipfile,hashlib,plistlib,subprocess,struct,json
        from pathlib import Path
        ipa=Path("R936_Unsigned_DeviceTest.ipa")
        app=Path("Payload/ChampionsOnDeviceResearch.app")
        with zipfile.ZipFile(ipa) as z:
            assert z.testzip() is None
            assert {i.filename for i in z.infolist() if not i.is_dir()}=={p.as_posix() for p in app.rglob('*') if p.is_file()}
            assert all(z.read(str(p))==p.read_bytes() for p in app.rglob('*') if p.is_file())
            info=plistlib.loads(z.read(str(app/'Info.plist')))
        assert (info['CFBundleShortVersionString'],info['CFBundleVersion'],info['MinimumOSVersion'],info['DTPlatformName'])==('0.9.36','936','27.0','iphoneos')
        assert info['CFBundleIdentifier']=='com.zeek10191019.championsresearch' and info['NSLocalNetworkUsageDescription'] and 'screen-capture' in info['UIBackgroundModes']
        binaries=[app/info['CFBundleExecutable'],*app.glob('*.dylib')]
        for binary in binaries:
            data=binary.read_bytes();magic,cpu,sub,kind,ncmds,cmdbytes,*_=struct.unpack_from('<8I',data)
            assert magic==0xfeedfacf and cpu==0x0100000c and kind in (2,6)
            assert subprocess.check_output(['lipo','-archs',str(binary)],text=True).strip()=='arm64'
            offset=32;platform=[]
            for _ in range(ncmds):
                c,n=struct.unpack_from('<II',data,offset);assert n>=8 and offset+n<=len(data) and c!=29
                if c==50:platform.append(struct.unpack_from('<I',data,offset+8)[0])
                offset+=n
            assert offset==32+cmdbytes and platform==[2]
        sha=hashlib.sha256(ipa.read_bytes()).hexdigest()
        doc=dict(version='0.9.36',build=936,ipa_bytes=ipa.stat().st_size,ipa_sha256=sha,source_tree_sha256='2497c444809160f46cbafad4d9ea6bbda3a5e61f562938e767738de38f5db009',source_commit=os.environ['GITHUB_SHA'],device_certified_fields=0,iphone16plus_save='UNKNOWN',ci_run=os.environ['GITHUB_RUN_ID'])
        Path('VERIFICATION_R936.json').write_text(json.dumps(doc,indent=2)+'\n');print('R936_IPA_VERIFIED',json.dumps(doc))
        IPA
        cp ../r936-tests/restore_capture.py .
        cp ../r936-tests/R936_SOURCE.patch .
        tag=r936-save-recovery
        if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft > existing.json 2>/dev/null; then
          test "$(jq -r .isDraft existing.json)" = true
          gh release upload "$tag" R936_Unsigned_DeviceTest.ipa VERIFICATION_R936.json restore_capture.py R936_SOURCE.patch --repo "$GITHUB_REPOSITORY" --clobber
        else
          gh release create "$tag" R936_Unsigned_DeviceTest.ipa VERIFICATION_R936.json restore_capture.py R936_SOURCE.patch --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title 'R936 iPhone 16 Plus 保存・復旧テスト 0.9.36' --notes 'PCで未署名IPAを取得してiLoaderで上書き。前回の収集を保存し、索引と全パートを同じフォルダに保存できます。実機の保存成功と79項目は未認証です。'
        fi
        mkdir readback
        gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.ipa' --dir readback
        cmp R936_Unsigned_DeviceTest.ipa readback/R936_Unsigned_DeviceTest.ipa
        gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
        url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/R936_Unsigned_DeviceTest.ipa"
        curl --fail -sSL --retry 4 --retry-all-errors "$url" -o readback/published.ipa
        cmp R936_Unsigned_DeviceTest.ipa readback/published.ipa
        echo "R936_PUBLIC_READBACK_VERIFIED $url"
