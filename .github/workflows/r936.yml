    - name: All existing Swift, Python and 79-field checks
      if: matrix.suite == 'full'
      shell: bash
      run: |
        set -euo pipefail
        ruby -ryaml -e 'puts YAML.load_file(ARGV[0]).fetch("jobs").fetch("verify").fetch("steps").fetch(42).fetch("run").gsub("R918", "R920").gsub("729 tests, with 0 failures", "731 tests, with 0 failures").gsub("VERIFIED\x27,729,0", "VERIFIED\x27,731,0")' pinned-r918/.github/workflows/r918.yml > "$RUNNER_TEMP/r920-full.sh"
        bash "$RUNNER_TEMP/r920-full.sh"
        node pinned-r793/source/tools/tests/test_r920_pc_display.mjs
    - name: Replay real images and test ROI and identity gates
      if: matrix.suite == 'vision'
      shell: bash
      run: |
        export DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
        set -euo pipefail
        for step in 42 43 44; do
          ruby -ryaml -e 'puts YAML.load_file(ARGV[0]).fetch("jobs").fetch("verify").fetch("steps").fetch(ARGV[1].to_i).fetch("run").gsub("R918", "R920").gsub(ARGV[2], ARGV[3])' pinned-r918/.github/workflows/r918_inspection_pixels.yml "$step" '9d741abc9b4f32ebd5df90086c73b1a1387ef2106b4bf5fc6326b8cad6fcfcc2' '51e78ba1252c8eb2f7eb74b354e38bc392074c44364e2bbe8b9e87a5b1b14edb' > "$RUNNER_TEMP/r920-replay.sh"
          bash "$RUNNER_TEMP/r920-replay.sh"
        done
    - name: Compile the unsigned iPhoneOS arm64 target
      if: matrix.suite == 'iphone'
      shell: bash
      run: |-
        set -euo pipefail
        xcodebuild -project pinned-r793/source/app/ios/ChampionsOnDeviceResearch.xcodeproj -scheme ChampionsOnDeviceResearch -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO -derivedDataPath "$RUNNER_TEMP/r936_device" build > "$RUNNER_TEMP/native.log" 2>&1 || { grep -E -B2 -A2 'error:|BUILD FAILED' "$RUNNER_TEMP/native.log"; exit 1; }
        grep -F 'BUILD SUCCEEDED' "$RUNNER_TEMP/native.log"
        app="$RUNNER_TEMP/r936_device/Build/Products/Release-iphoneos/ChampionsOnDeviceResearch.app"
        test "$(lipo -archs "$app/ChampionsOnDeviceResearch")" = arm64
        test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Info.plist")" = 936
        test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist")" = 0.9.36
        echo R936_IPHONEOS_ARM64_RELEASE_VERIFIED
    - name: Exercise the production ZIP code with 524 MB and forced process exits
      if: matrix.suite == 'large'
      shell: bash
      run: |-
        set -euo pipefail
        command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install ffmpeg
        bash r936-tests/build_driver.sh pinned-r793/source "$RUNNER_TEMP/driver"
        python3 r936-tests/fixture.py "$RUNNER_TEMP/large-case/source"
        python3 r936-tests/run.py "$RUNNER_TEMP/large-case" "$RUNNER_TEMP/driver" pinned-r793/source
    - name: Exercise background, app relaunch, UIKit share cancellation and re-sharing
      if: matrix.suite == 'sim'
      shell: bash
      run: |-
        set -euo pipefail
        command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install ffmpeg
        python3 -u r936-tests/simulator.py
