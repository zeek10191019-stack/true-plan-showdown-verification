name: R972 Package verified unsigned iPhone device test
on:
  push:
    branches: [r938-export-recovery]
    paths: [.github/workflows/r972-device-test.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r972-device-release
  cancel-in-progress: false
jobs:
  package:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && !github.event.repository.private && github.ref == 'refs/heads/r938-export-recovery'
    runs-on: xcode-27
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: .github/workflows/r972-device-test.yml
      - name: Require the successful R972 source and Apple Vision run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_commit=01c1245babf2ce5a037069c7bb12627d97138cf6
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44946464243" > "$RUNNER_TEMP/r972-run.json"
          jq -e --arg commit "$source_commit" '
            .head_sha == $commit and .conclusion == "success" and
            .path == ".github/workflows/r972.yml" and .head_branch == "r938-export-recovery"
          ' "$RUNNER_TEMP/r972-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44946464243/jobs?per_page=20" |
            jq -e '.total_count == 2 and all(.jobs[]; .status == "completed" and .conclusion == "success")'
          git show "$source_commit:.github/workflows/r972.yml" > "$RUNNER_TEMP/r972.yml"
          echo '6b4b1693cf441f4be180dd093006aa734025a2d3fc7ee60d0e30307e0385bf42  r972.yml' |
            (cd "$RUNNER_TEMP" && shasum -a 256 -c -)
      - name: Restore the exact previously tested iPhone source and rebuild arm64
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e '
            steps = YAML.load_file(ARGV.fetch(0), aliases: true).fetch("jobs").fetch("verify").fetch("steps")
            ARGV.drop(1).each { |name| puts steps.find { |step| step["name"] == name }.fetch("run") }
          ' "$RUNNER_TEMP/r972.yml" 'Restore pinned R971 and verify the R972 patch' 'Build iPhoneOS without packaging an IPA' > "$RUNNER_TEMP/rebuild-r972.sh"
          bash "$RUNNER_TEMP/rebuild-r972.sh"
      - name: Test the updated PC tools and stage the release files
