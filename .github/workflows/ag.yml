name: R592 Spatial Pixel OCR HUD Cross-check (No IPA)
"on":
  push:
    paths: [.github/workflows/ag.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
      PYTHONOPTIMIZE: "0"
    steps:
      - name: Restore pinned R591 and apply R592 exact three-file delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'R592_REPLAY'
          import ast,base64,hashlib,json,lzma,re,textwrap,urllib.request
          from pathlib import Path
          H=lambda b:hashlib.sha256(b).hexdigest()
          url="https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/4ee82891a976f1a5447d92d4920d8aadb7e4aec8/.github/workflows/af.yml"
          raw=urllib.request.urlopen(url,timeout=90).read()
          blob=hashlib.sha1(b"blob "+str(len(raw)).encode()+bytes([0])+raw).hexdigest()
          assert len(raw)==9771 and blob=="4b334a7b79334d4651bc3538f253c7b14f27d934","R592_PARENT_AF_WORKFLOW_MISMATCH"
          m=re.search(r"python3 - <<'R591_REPLAY'\n(.*?)\n\s+R591_REPLAY",raw.decode(),re.S)
          assert m,"R592_PARENT_REPLAY_NOT_FOUND"
          parent=textwrap.dedent(m.group(1));ast.parse(parent)
          exec(compile(parent,'PINNED_R591_REPLAY','exec'))
          rows=json.loads(lzma.decompress(base64.b64decode("")))
          assert rows['schema']=='trueplan.r592.delta.v1' and rows['parent']=='R591'
          assert len(rows['files'])==3
          changes=[]
          for r in rows['files']:
           p=Path(r['path']); before=p.read_bytes() if p.exists() else None
           assert (H(before) if before is not None else None)==r['old_sha256'],('WRONG_R591_PARENT',r['path'])
           if before is not None: assert len(before)==r['old_bytes']
           if r['mode']=='single_span':
            i=r['prefix'];n=r['remove']
            assert before is not None and 0<=i<=i+n<=len(before)
            data=before[:i]+base64.b64decode(r['span_b64'],validate=True)+before[i+n:]
           else:
            assert r['mode']=='new_file' and before is None
            data=base64.b64decode(r['new_b64'],validate=True)
           assert len(data)==r['new_bytes'] and H(data)==r['new_sha256'],('R592_PATCH_HASH_FAIL',r['path'])
           changes.append((p,data))
          for p,data in changes:
           p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          assert len(list(Path('app/ios/ChampionsOnDevice').glob('*.swift')))==133
          print('R592_SOURCE_3_FILE_SHA_PASS')
          R592_REPLAY
      - name: Swift parse, spatial OCR-pixel tests and iPhoneOS native build
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse app/ios/ChampionsOnDevice/*.swift
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R590ColorHUDCorroboration.swift app/ios/ChampionsOnDevice/R592HUDSpatialPixelAlignment.swift tests/R592HUDSpatialPixelAlignmentHarness.swift -o "$RUNNER_TEMP/r592-test"
          "$RUNNER_TEMP/r592-test"
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R590ColorHUDCorroboration.swift tests/R590ColorHUDCorroborationHarness.swift -o "$RUNNER_TEMP/r591-test"
          "$RUNNER_TEMP/r591-test"
          python3 tools/run_r571_native.py || { for f in reports/xcode_iphoneos_build.log reports/r574_png_replay_compile.log; do [ ! -f "$f" ] || grep -nE 'error:|fatal error|BUILD FAILED' "$f" | tail -n 65 || true; done; exit 1; }
          echo 'R592_APPLE_BUILD_CHECK_ONLY; real-image recognition accuracy and Mega-form remain UNVERIFIED; NO IPA'
