name: R533 First-Pass OCR Diagnostic IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
      && github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Verify pinned R531 and integrate R532 patch, build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY533'
          import ast,hashlib,textwrap,re,urllib.request
          from pathlib import Path
