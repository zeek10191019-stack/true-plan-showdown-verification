name: R587 Frame-bound HUD Multi-anchor Audit (No IPA)
"on":
  push:
    branches: [main]
    paths: [.github/workflows/r587.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
      PYTHONOPTIMIZE: "0"
    steps:
      - name: Recover pinned R586 and verify exact R587 overlay hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'R587_REPLAY'
          import urllib.request,hashlib,json,base64,lzma,re,textwrap,ast
          from pathlib import Path
          sha=lambda b:hashlib.sha256(b).hexdigest()
          raw=urllib.request.urlopen('https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/7bbc2e5941814d17e9c00d8ca1bdc628be39a8ba/.github/workflows/r586.yml',timeout=90).read()
          assert len(raw)==14608 and sha(raw)=='aeea3cce7c8131bd5f623f7964891f9886097a36b8d30c57e8a20acca8030358','R587_PARENT_R586_WORKFLOW_MISMATCH'
          m=re.search(r"python3 - <<'R586_REPLAY'\n(.*?)\n\s+R586_REPLAY",raw.decode(),re.S)
          assert m,'R587_R586_PARENT_REPLAY_NOT_FOUND'
          source=textwrap.dedent(m.group(1));ast.parse(source)
          exec(compile(source,'PINNED_R586_REPLAY','exec'))
          print('R587_PINNED_R586_REPLAY_PASS')
          rows=json.loads(lzma.decompress(base64.b64decode('')))
          assert len(rows)==3
          for r in rows:
           p=Path(r['path']);old=p.read_bytes() if p.exists() else b''
           assert (sha(old) if old else None)==r['old_sha'],('R587_PARENT_MISMATCH',r['path'])
          for r in rows:
           p=Path(r['path']);old=p.read_bytes() if p.exists() else b''
           b=old[:r['prefix']]+base64.b64decode(r['insert'])+old[r['prefix']+r['remove']:]
           assert sha(b)==r['new_sha'] and len(b)==r['new_len'],('R587_PATCH_INVALID',r['path'])
           p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)
          assert len(list(Path('app/ios/ChampionsOnDevice').glob('*.swift')))==129
          assert 'historical_hud_frame_associations.json' in Path('app/ios/ChampionsOnDevice/CaptureCoordinator.swift').read_text()
          assert 'maximumMembers = 24' in Path('app/ios/ChampionsOnDevice/R548ResearchArchive.swift').read_text()
          print('R587_SOURCE_REBUILD_AND_SHA_PASS')
          R587_REPLAY
      - name: R587 Swift frame-source integrity and multi-anchor regression
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse app/ios/ChampionsOnDevice/*.swift
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R581ReadabilityCoverage.swift app/ios/ChampionsOnDevice/R583FrameReadabilityIndex.swift app/ios/ChampionsOnDevice/R585SpatialOCRProjection.swift app/ios/ChampionsOnDevice/R586HUDSpatialCandidates.swift app/ios/ChampionsOnDevice/R587HUDFrameAssociation.swift tests/R587HUDFrameAssociationHarness.swift -o "$RUNNER_TEMP/r587-test"
          "$RUNNER_TEMP/r587-test"
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R581ReadabilityCoverage.swift app/ios/ChampionsOnDevice/R583FrameReadabilityIndex.swift app/ios/ChampionsOnDevice/R585SpatialOCRProjection.swift app/ios/ChampionsOnDevice/R586HUDSpatialCandidates.swift tests/R586HUDSpatialCandidatesHarness.swift -o "$RUNNER_TEMP/r586-test"
          "$RUNNER_TEMP/r586-test"
      - name: Existing Apple Vision and iPhoneOS app build (No IPA)
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 tools/run_r571_native.py; then
            echo 'R587_APPLE_BUILD_OR_NATIVE_REGRESSION_FAILED'
            for log in reports/xcode_iphoneos_build.log reports/r574_png_replay_compile.log; do
              if [ -f "$log" ]; then grep -nE 'error:|fatal error|BUILD FAILED' "$log" | tail -n 50 || true; fi
            done
            exit 1
          fi
      - name: No unverified battle claims
        if: always()
        run: echo 'R587 is only frame-bound OCR/HUD consistency evidence. No orientation, player ownership, Mega form, actual game accuracy, 79-field coverage or device trial is certified.'
