      - name: Apply R920 changes and verify every source file
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat R834Proof/SOURCE_TREE_SHA256.txt)" = 'aa14b3d45738fc31a1b2836cf46f9602ae19466870c2b9a71b2e833d49050237'
          patch -s -t -p1 -F 0 -d pinned-r793/source -i "$PWD/R834Proof/r920.patch"
          python3 pinned-r793/source/tools/generate_xcode_project.py
          python3 - <<'PY_R920'
          from pathlib import Path
          from hashlib import sha256
          import json
          root=Path('pinned-r793/source')
          manifest_path=root/'source_manifest.json'
          manifest=json.loads(manifest_path.read_text())
          touched=['R720_PORTABLE_TESTS/Sources/R719Core/R733QuickOCRGate.swift', 'R720_PORTABLE_TESTS/Sources/R719Core/R844QuickDisplayLine.swift', 'R720_PORTABLE_TESTS/Tests/R719CoreTests/R733QuickOCRGateTests.swift', 'R720_PORTABLE_TESTS/Tests/R719CoreTests/R844QuickDisplayLineTests.swift', 'app/ios/ChampionsOnDevice/CaptureCoordinator.swift', 'app/ios/ChampionsOnDevice/ChampionsOnDeviceApp.swift', 'app/ios/ChampionsOnDevice/Info.plist', 'app/ios/ChampionsOnDevice/R733QuickOCRGate.swift', 'app/ios/ChampionsOnDevice/R844QuickDisplayLine.swift', 'app/ios/ChampionsOnDevice/R920QuickPCDisplay.swift', 'app/ios/ChampionsOnDeviceResearch.xcodeproj/project.pbxproj', 'tools/r875_native_capture_audit.py', 'tools/tests/test_r875_native_capture_audit.py', 'tools/tests/test_r920_pc_display.mjs']
          for name in touched:
              manifest[name]=sha256((root/name).read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest,sort_keys=True,ensure_ascii=False,indent=2)+'\n')
          files={p.relative_to(root).as_posix():sha256(p.read_bytes()).hexdigest() for p in root.rglob('*')
                 if p.is_file() and not set(p.parts)&{'.build','.swiftpm','__pycache__'}}
          assert set(files)==set(manifest)|{'source_manifest.json'}
          assert all(files[name]==sha for name,sha in manifest.items())
          digest=sha256(''.join(f'{name}\t{files[name]}\n' for name in sorted(files)).encode()).hexdigest()
          assert len(files)==681 and digest=='1973d7f185fcfb0305318c846c83801e48e3c2a3feedb21fc2cc70269cb49ec8',digest
          Path('R834Proof/SOURCE_TREE_SHA256.txt').write_text(digest+'\n')
          print('R920_SOURCE_681_VERIFIED',digest)
          PY_R920
      - name: Run complete Swift, Python, Vision and field-path regression
        if: matrix.suite == 'full'
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e 'puts YAML.load_file(ARGV[0]).fetch("jobs").fetch("verify").fetch("steps").fetch(42).fetch("run").gsub("R918", "R920").gsub("729 tests, with 0 failures", "731 tests, with 0 failures").gsub("VERIFIED\x27,729,0", "VERIFIED\x27,731,0")' pinned-r918/.github/workflows/r918.yml > "$RUNNER_TEMP/r920-full.sh"
          bash "$RUNNER_TEMP/r920-full.sh"
          node pinned-r793/source/tools/tests/test_r920_pc_display.mjs
      - name: Run cold Apple Vision on the pinned real images and verify field routes
        if: matrix.suite == 'replay'
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
        shell: bash
        run: |
          set -euo pipefail
          for step in 42 43 44; do
            ruby -ryaml -e 'puts YAML.load_file(ARGV[0]).fetch("jobs").fetch("verify").fetch("steps").fetch(ARGV[1].to_i).fetch("run").gsub("R918", "R920").gsub(ARGV[2], ARGV[3])' pinned-r918/.github/workflows/r918_inspection_pixels.yml "$step" '9d741abc9b4f32ebd5df90086c73b1a1387ef2106b4bf5fc6326b8cad6fcfcc2' '1973d7f185fcfb0305318c846c83801e48e3c2a3feedb21fc2cc70269cb49ec8' > "$RUNNER_TEMP/r920-replay.sh"
            bash "$RUNNER_TEMP/r920-replay.sh"
          done
      - name: Build the iPhoneOS arm64 production target
        if: matrix.suite == 'iphoneos'
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e 'puts YAML.load_file(ARGV[0]).fetch("jobs").fetch("iphoneos").fetch("steps").fetch(42).fetch("run").gsub("0.9.18", "0.9.20").gsub("918", "920")' pinned-r918/.github/workflows/r918.yml > "$RUNNER_TEMP/r920-build.sh"
          bash "$RUNNER_TEMP/r920-build.sh"
