        python3 r937-tests/run.py "$RUNNER_TEMP/long-case" "$RUNNER_TEMP/driver" pinned-r793/source
    - name: Exercise background, app relaunch, UIKit share cancellation and re-sharing
      if: matrix.suite == 'sim'
      shell: bash
      run: |-
        set -euo pipefail
        tool_dir="$RUNNER_TEMP/r940-video-tools"
        mkdir -p "$tool_dir"
        fetch_media_tool() {
          local name="$1" sha="$2" target="$tool_dir/$1"
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 90 \
            "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/$name-darwin-arm64.gz" -o "$target.gz"
          printf '%s  %s\n' "$sha" "$target.gz" | shasum -a 256 -c -
          gzip -dc "$target.gz" > "$target"
          chmod u+x "$target"
          "$target" -version | sed -n '1p'
        }
        fetch_media_tool ffmpeg 8923876afa8db5585022d7860ec7e589af192f441c56793971276d450ed3bbfa
        fetch_media_tool ffprobe d986a8ec7b030899fe66a8a288ed809a3543338705a3ce178cfb85869c5d80be
        export PATH="$tool_dir:$PATH"
        python3 -u r937-tests/simulator.py
  publish:
    needs:
    - verify
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    name: R941 publish verified IPA
    runs-on: xcode-27
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
    - *id001
    - *id002
    - *id003
    - name: Build the audited arm64 package
      run: |-
        set -euo pipefail
        xcodebuild -project pinned-r793/source/app/ios/ChampionsOnDeviceResearch.xcodeproj -scheme ChampionsOnDeviceResearch -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO -derivedDataPath "$RUNNER_TEMP/r941_device" build > "$RUNNER_TEMP/native.log" 2>&1 || { grep -E -B2 -A2 'error:|BUILD FAILED' "$RUNNER_TEMP/native.log"; exit 1; }
        grep -F 'BUILD SUCCEEDED' "$RUNNER_TEMP/native.log"
        app="$RUNNER_TEMP/r941_device/Build/Products/Release-iphoneos/ChampionsOnDeviceResearch.app"
        test "$(lipo -archs "$app/ChampionsOnDeviceResearch")" = arm64
        test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Info.plist")" = 941
        test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist")" = 0.9.41
        echo R941_IPHONEOS_ARM64_RELEASE_VERIFIED
    - name: Publish and read back the verified device-test IPA
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        set -euo pipefail
        out="$PWD/R941Delivery"
        app="$RUNNER_TEMP/r941_device/Build/Products/Release-iphoneos/ChampionsOnDeviceResearch.app"
        mkdir -p "$out/Payload"
        cp -R "$app" "$out/Payload/"
        cd "$out"
        zip -qry R941_Unsigned_DeviceTest.ipa Payload
        python3 - <<'IPA'
        import os,zipfile,hashlib,plistlib,subprocess,struct,json
        from pathlib import Path
        ipa=Path("R941_Unsigned_DeviceTest.ipa")
        app=Path("Payload/ChampionsOnDeviceResearch.app")
        with zipfile.ZipFile(ipa) as z:
            assert z.testzip() is None
            assert {i.filename for i in z.infolist() if not i.is_dir()}=={p.as_posix() for p in app.rglob('*') if p.is_file()}
            assert all(z.read(str(p))==p.read_bytes() for p in app.rglob('*') if p.is_file())
            info=plistlib.loads(z.read(str(app/'Info.plist')))
        assert (info['CFBundleShortVersionString'],info['CFBundleVersion'],info['MinimumOSVersion'],info['DTPlatformName'])==('0.9.41','941','27.0','iphoneos')
        assert info['CFBundleIdentifier']=='com.zeek10191019.championsresearch' and info['NSLocalNetworkUsageDescription'] and 'screen-capture' in info['UIBackgroundModes']
        binaries=[app/info['CFBundleExecutable'],*app.glob('*.dylib')]
        for binary in binaries:
            data=binary.read_bytes();magic,cpu,sub,kind,ncmds,cmdbytes,*_=struct.unpack_from('<8I',data)
            assert magic==0xfeedfacf and cpu==0x0100000c and kind in (2,6)
            assert subprocess.check_output(['lipo','-archs',str(binary)],text=True).strip()=='arm64'
            offset=32;platform=[]
            for _ in range(ncmds):
                c,n=struct.unpack_from('<II',data,offset);assert n>=8 and offset+n<=len(data) and c!=29
                if c==50:platform.append(struct.unpack_from('<I',data,offset+8)[0])
                offset+=n
            assert offset==32+cmdbytes and platform==[2]
        sha=hashlib.sha256(ipa.read_bytes()).hexdigest()
        doc=dict(version='0.9.41',build=941,ipa_bytes=ipa.stat().st_size,ipa_sha256=sha,source_tree_sha256='8b91e678f54cdf9a54f9f5fc3667738cd1b46929bdc2b479efcad9611d6f5573',source_commit=os.environ['GITHUB_SHA'],device_certified_fields=0,iphone16plus_save='UNKNOWN',ci_run=os.environ['GITHUB_RUN_ID'])
        Path('VERIFICATION_R941.json').write_text(json.dumps(doc,indent=2)+'\n');print('R941_IPA_VERIFIED',json.dumps(doc))
        IPA
        cp ../r937-tests/restore_capture.py .
        cp ../r937-tests/R941_SOURCE.patch .
        tag=r941-device-test
        if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft > existing.json 2>/dev/null; then
          test "$(jq -r .isDraft existing.json)" = true
          gh release upload "$tag" R941_Unsigned_DeviceTest.ipa VERIFICATION_R941.json restore_capture.py R941_SOURCE.patch --repo "$GITHUB_REPOSITORY" --clobber
        else
          gh release create "$tag" R941_Unsigned_DeviceTest.ipa VERIFICATION_R941.json restore_capture.py R941_SOURCE.patch --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title 'R941 iPhone 16 Plus 保存・復旧テスト 0.9.41' --notes 'PCで未署名IPAを取得してiLoaderで上書き。未完成の分割ZIPを再開でき、分割元ファイルの中間コピーは不要です。原本に欠損がある収集は、復旧出力として残存データと欠損一覧を共有できます。実機の保存成功と79項目は未認証です。'
        fi
        mkdir readback
        gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.ipa' --dir readback
        cmp R941_Unsigned_DeviceTest.ipa readback/R941_Unsigned_DeviceTest.ipa
        gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
        url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/R941_Unsigned_DeviceTest.ipa"
        curl --fail -sSL --retry 4 --retry-all-errors "$url" -o readback/published.ipa
        cmp R941_Unsigned_DeviceTest.ipa readback/published.ipa
        echo "R941_PUBLIC_READBACK_VERIFIED $url"
