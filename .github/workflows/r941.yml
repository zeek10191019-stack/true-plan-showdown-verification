name: R941 resumable split export and verified device-test IPA
'on':
  push:
    branches:
    - r938-export-recovery
    paths:
    - .github/workflows/r941.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: r941-save-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: R941 ${{ matrix.suite }}
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
        - suite: iphone
          runner: xcode-27
        - suite: large
          runner: macos-26
        - suite: full
          runner: macos-26
        - suite: vision
          runner: macos-26
        - suite: sim
          runner: xcode-27
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
    - &id001
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: .github/workflows/r941.yml
    - &id002
      name: Restore the exact verified R940 source
      shell: bash
      run: |
        set -euo pipefail
        git show 23d94c7b2a6baadefb3885929ceb54ddec613146:.github/workflows/r940.yml > "$RUNNER_TEMP/r940-base.yml"
        for n in 1 2; do
          ruby -ryaml -e 'puts YAML.load_file(ARGV[0], aliases: true).fetch("jobs").fetch("verify").fetch("steps").fetch(ARGV[1].to_i).fetch("run")' "$RUNNER_TEMP/r940-base.yml" "$n" > "$RUNNER_TEMP/r940-restore.sh"
          bash "$RUNNER_TEMP/r940-restore.sh"
        done
    - &id003
      name: Apply and verify the R941 split recovery fix
      shell: bash
      run: |
