        from pathlib import Path
        import json,hashlib
        root=Path('pinned-r793/source')
        files={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
               for p in root.rglob('*') if p.is_file() and not set(p.parts)&{'.build','.swiftpm','__pycache__'}}
        assert {k:v for k,v in files.items() if k!='source_manifest.json'}==json.loads((root/'source_manifest.json').read_text())
        digest=hashlib.sha256(''.join(k+'\t'+files[k]+'\n' for k in sorted(files)).encode()).hexdigest()
        assert len(files)==683 and digest=='8b91e678f54cdf9a54f9f5fc3667738cd1b46929bdc2b479efcad9611d6f5573',(len(files),digest)
        Path('R834Proof/SOURCE_TREE_SHA256.txt').write_text(digest+'\n')
        print('R941_SOURCE_VERIFIED',len(files),digest)
