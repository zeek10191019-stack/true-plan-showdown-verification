jobs:
  b:
    if: >-
      github.repository ==
      'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        ref: f0e776af66310d1b02a853ed3df77a27429087bf
    - run: |
        python3 - <<'PY'
        import os,base64,lzma,hashlib,pathlib
        b=lzma.decompress(base64.b85decode(
          ''.join(os.environ['P'].split())),
          format=lzma.FORMAT_ALONE)
        assert hashlib.sha256(b).hexdigest() == (
          '4d379ad8865fe55dd74c178ef54a9890' +
          '89e1726f4d3e4d5a019407d296a872a1')
        names=[
          'app/ios/ChampionsOnDevice/' +
          'R674ActorHUDLink.swift',
          'tests/R674Smoke.swift',
          'tools/r674_patch.py','/tmp/R674CI.sh']
        sizes=[4290, 4941, 1313, 1518]
        i=0
        for n,z in zip(names,sizes):
          p=pathlib.Path(n)
          p.parent.mkdir(parents=True,exist_ok=True)
          assert not p.exists(),n
          p.write_bytes(b[i:i+z]);i+=z
        assert i==len(b)
        PY
        bash /tmp/R674CI.sh
