        for n in ['testDelayedFatalCannotStopReplacementRecording',
         'testQueuedLimitAndUnrequestedFinishUseSameOriginFence',
         'testCurrentNoticeSurvivesOCRReadEpochChange',
         'testPickerGapCannotReuseOldRecorderAndCaptureTokens',
         'testNoticeRequiresBothTokensAndActiveTransport',
         'testDelayedMovieResultCannotWriteOldURLIntoNewSession',
         'testDelayedMovieFailureCannotFailReplacementSession',
         'testMissingMovieFailureBelongsToExactNilSnapshotOnly',
         'testUnchangedMovieAcceptedButSameTokenDifferentURLRejected',
         'testInvalidScopesNeverProduceNotificationsOrMovieWork']:
         assert re.search(n+r'.*passed',t),n
        assert 'Executed 549 tests, with 0 failures' in t
        Path('R791Proof/RecordingScopeRegression.json').write_text(json.dumps({
         'scope':'CONTROLLED_SESSION_REPLACEMENT_NOT_DEVICE_CAPTURE',
         'new_swift_tests_passed':10,'immutable_original_notices_and_movie_snapshot':True,
         'historical_device_root_cause_certified':False,'device_certified_fields':0},indent=2))
        PYR791NOTICETESTS
    - name: Production archive integrity and negative cases on Mac
