name: R593 Historical Visual Change Evidence (No IPA)
"on":
  push:
    paths: [.github/workflows/ah.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
      PYTHONOPTIMIZE: "0"
    steps:
      - name: Restore pinned R592 source and apply exact R593 delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'R593_REPLAY'
          import ast,base64,hashlib,json,lzma,re,textwrap,urllib.request
          from pathlib import Path
          H=lambda b:hashlib.sha256(b).hexdigest()
          url="https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/833daa9710d800c2f7ee3a007d95568a17f30d46/.github/workflows/ag.yml"
          raw=urllib.request.urlopen(url,timeout=90).read()
          blob=hashlib.sha1(b"blob "+str(len(raw)).encode()+bytes([0])+raw).hexdigest()
          assert len(raw)==15117 and blob=="c70ee47f9620f4e7bb6da04b5b4e8416036bbd02","R593_R592_PIN_ERROR"
          m=re.search(r"python3 - <<'R592_REPLAY'\n(.*?)\n\s+R592_REPLAY",raw.decode(),re.S)
          assert m,"R593_PARENT_MISSING"
          parent=textwrap.dedent(m.group(1));ast.parse(parent)
          exec(compile(parent,'PINNED_R592_REPLAY','exec'))
          p=json.loads(lzma.decompress(base64.b64decode("")))
          assert p['schema']=='trueplan.r593.delta.v1' and p['parent']=='R592'
          assert len(p['files'])==3
          updates=[]
          for r in p['files']:
           path=Path(r['path']);before=path.read_bytes() if path.exists() else None
           assert (H(before) if before is not None else None)==r['old_sha256'],('R593_WRONG_PARENT',r['path'])
           assert (len(before) if before is not None else None)==r['old_bytes']
           if r['mode']=='new_file':
            assert before is None;data=base64.b64decode(r['data_b64'],validate=True)
           else:
            assert r['mode']=='multi_spans' and before is not None
            data=before
            for edit in reversed(r['edits']):
             k=edit['start'];n=edit['remove'];assert 0<=k<=k+n<=len(before)
             data=data[:k]+base64.b64decode(edit['data_b64'],validate=True)+data[k+n:]
           assert len(data)==r['new_bytes'] and H(data)==r['new_sha256'],('R593_SHA_FAIL',r['path'])
           updates.append((path,data))
          for path,data in updates:
           path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data)
          assert len(list(Path('app/ios/ChampionsOnDevice').glob('*.swift')))==134
          print('R593_PINNED_3_SHA_MATCH_PASS')
          R593_REPLAY
      - name: Swift R593 image-change test and iPhoneOS build
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse app/ios/ChampionsOnDevice/*.swift
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R593VisualChangeEvidence.swift tests/R593VisualChangeEvidenceHarness.swift -o "$RUNNER_TEMP/r593-test"
          "$RUNNER_TEMP/r593-test"
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R590ColorHUDCorroboration.swift app/ios/ChampionsOnDevice/R592HUDSpatialPixelAlignment.swift tests/R592HUDSpatialPixelAlignmentHarness.swift -o "$RUNNER_TEMP/r592-test"
          "$RUNNER_TEMP/r592-test"
          python3 tools/run_r571_native.py || { for f in reports/xcode_iphoneos_build.log reports/r574_png_replay_compile.log; do [ ! -f "$f" ] || grep -nE 'error:|fatal error|BUILD FAILED' "$f" | tail -n 65 || true; done; exit 1; }
          echo 'R593_APPLE_BUILD_TEST_ONLY. Sprite species/Mega/side/real-game accuracy NOT CERTIFIED; NO IPA.'
