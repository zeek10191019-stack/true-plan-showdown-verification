    - name: Run all old and new Python/Swift regression suites
      shell: bash
      run: |
        set -euo pipefail
        export PYTHONPATH=.
        for v in r605 r607 r608 r609 r610 r611batch r613batch r617batch r621batch r625batch r629batch; do
          python3 -m unittest discover -s tests -p "test_${v}_*.py" -v
        done
        swiftc -parse-as-library \
          app/ios/ChampionsOnDevice/R610CrossEvidenceCandidate.swift \
          app/ios/ChampionsOnDevice/R611TemporalHUDReview.swift \
          app/ios/ChampionsOnDevice/R612ArchiveEvidenceClosure.swift \
          app/ios/ChampionsOnDevice/R613R616IntegratedReadiness.swift \
          tests/R613BatchHarness.swift -o "$RUNNER_TEMP/r616"
        "$RUNNER_TEMP/r616"
        swiftc -parse-as-library \
          app/ios/ChampionsOnDevice/R617R620RotationReadout.swift \
          tests/R617Harness.swift -o "$RUNNER_TEMP/r620"
        "$RUNNER_TEMP/r620"
        swiftc -parse-as-library \
          app/ios/ChampionsOnDevice/R617R620RotationReadout.swift \
          app/ios/ChampionsOnDevice/R621R624VisualCandidates.swift \
          tests/R621Harness.swift -o "$RUNNER_TEMP/r624"
        "$RUNNER_TEMP/r624"
        swiftc -parse-as-library \
          app/ios/ChampionsOnDevice/R617R620RotationReadout.swift \
          app/ios/ChampionsOnDevice/R621R624VisualCandidates.swift \
          app/ios/ChampionsOnDevice/R625R628PixelHUDAndSprite.swift \
          app/ios/ChampionsOnDevice/R629R632SlotEvidence.swift \
          tests/R625Harness.swift -o "$RUNNER_TEMP/r628"
        "$RUNNER_TEMP/r628"
        swiftc -parse-as-library \
          app/ios/ChampionsOnDevice/R629R632SlotEvidence.swift \
          tests/R629Harness.swift -o "$RUNNER_TEMP/r632"
        "$RUNNER_TEMP/r632"
        echo 'R629_R632_REGRESSION_PASS_NOT_OWNER_OR_GAME_CERTIFIED'
    - name: Parse full Swift and build iPhoneOS native target
      shell: bash
      run: |
        set -euo pipefail
        swiftc -frontend -parse app/ios/ChampionsOnDevice/*.swift
        python3 tools/run_r571_native.py || {
          for f in reports/xcode_iphoneos_build.log reports/r574_png_replay_compile.log; do
            test ! -f "$f" || grep -nE 'error:|BUILD FAILED' "$f" | tail -n 65 || true
          done
          exit 1
        }
        echo 'R629_R632_APPLE_NATIVE_PASS_NOT_79_FIELDS_OR_MEGA_CERTIFIED'
