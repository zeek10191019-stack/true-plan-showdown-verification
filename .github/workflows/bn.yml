        parent=urllib.request.urlopen(url,timeout=90).read()
        assert len(parent)==20982, 'PARENT_BM_SIZE_DRIFT'
        assert hashlib.sha256(parent).hexdigest() == (
         '10fc9a8cf82fabb8ac777bb563e0393478e70b7f81a6b29af192f5a0f8bf3ea9'), 'PARENT_BM_HASH_DRIFT'
