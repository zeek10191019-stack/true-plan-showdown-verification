        shell: bash
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_26.3.app/Contents/Developer ]]; then
            export DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
          fi
          xcodebuild -version
          cd pinned-r793/source
          source_package="$PWD/R720_PORTABLE_TESTS"
          focused="$RUNNER_TEMP/r959-vision/R720_PORTABLE_TESTS"
          mkdir -p "$focused/Tests/R719CoreTests" "$RUNNER_TEMP/r959-vision/tests"
          cp "$source_package/Package.swift" "$focused/"
          cp -R "$source_package/Sources" "$focused/"
          cp -R tests/fixtures "$RUNNER_TEMP/r959-vision/tests/"
          for name in R893BattleStatusPanelTests R883InspectionPanelTests R761RealImageRegressionTests R858NumericHUDOCRTests R855FastLosslessPNGTests; do
            cp "$source_package/Tests/R719CoreTests/$name.swift" "$focused/Tests/R719CoreTests/"
          done
          swift test -c release --jobs 4 --package-path "$focused" --filter 'testPhoneStatusFromActualSelectedScreenshotRegions|testRetainedBuild715InspectionAndNonSelectedTransition|testSelectedMovePPStillRecordedWhenNameIsUnreadable|testUnknownSelectedSpeciesKeepsHPAndPPWithoutActiveIdentity|testSelectedCardKeepsExactItemWhenOtherFieldsAreUnread|testSelectedPPFractionNeedsDistinctMatchingContrastReadsAndExistingDigits|testAlternateLiteralRequiresExactSameSlotAndValidPP|testScaledAndRotatedInspectionKeepAllSelectedNumbersBoundToSource|testActualAppleVisionReadsOpponentSandStreamFromRetainedCapture|testActualAppleVisionKnockOffOwnItemHistoryNeedsMatchingOwnCard|testR955RetryTimeoutPreservesFrame3402FirstPassOnly|testFallbackDoesNotSilentlyReplaceADifferentHPReading|R855FastLosslessPNGTests|testR956ActualSelectionAndDualHUDStayOutOfSingleCardRoute' 2>&1 | tee "$RUNNER_TEMP/r959-vision.log"


          grep -F "testPhoneStatusFromActualSelectedScreenshotRegions]' passed" "$RUNNER_TEMP/r959-vision.log"
          grep -F "testRetainedBuild715InspectionAndNonSelectedTransition]' passed" "$RUNNER_TEMP/r959-vision.log"
          grep -F "testSelectedMovePPStillRecordedWhenNameIsUnreadable]' passed" "$RUNNER_TEMP/r959-vision.log"
          grep -F "testUnknownSelectedSpeciesKeepsHPAndPPWithoutActiveIdentity]' passed" "$RUNNER_TEMP/r959-vision.log"
          grep -F "testAlternateLiteralRequiresExactSameSlotAndValidPP]' passed" "$RUNNER_TEMP/r959-vision.log"
          grep -F "testScaledAndRotatedInspectionKeepAllSelectedNumbersBoundToSource]' passed" "$RUNNER_TEMP/r959-vision.log"
          grep -F "testActualAppleVisionReadsOpponentSandStreamFromRetainedCapture]' passed" "$RUNNER_TEMP/r959-vision.log"
          grep -F "testActualAppleVisionKnockOffOwnItemHistoryNeedsMatchingOwnCard]' passed" "$RUNNER_TEMP/r959-vision.log"

          grep -F "testSelectedCardKeepsExactItemWhenOtherFieldsAreUnread]' passed" "$RUNNER_TEMP/r959-vision.log"

          grep -F "testSelectedPPFractionNeedsDistinctMatchingContrastReadsAndExistingDigits]' passed" "$RUNNER_TEMP/r959-vision.log"

          grep -F "testR955RetryTimeoutPreservesFrame3402FirstPassOnly]' passed" "$RUNNER_TEMP/r959-vision.log"
          grep -F 'R855_FAST_PNG_ICC_ALPHA_STRIDE_IMAGEIO_READBACK_PASS' "$RUNNER_TEMP/r959-vision.log"

          grep -F "testR956ActualSelectionAndDualHUDStayOutOfSingleCardRoute]' passed" "$RUNNER_TEMP/r959-vision.log"
  publish:
    name: Publish and verify the tested IPA
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    needs: [verify, vision]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: r959-ipa
          path: R959Delivery
      - name: Publish and verify the download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd R959Delivery
          python3 - <<'VERIFY'
          import hashlib,json,os
          from pathlib import Path
          p=Path('R959_Unsigned_DeviceTest.ipa')
          r=json.loads(Path('VERIFICATION_R959.json').read_text())
          assert r['source_commit']==os.environ['GITHUB_SHA'] and r['build']==959
          assert r['ipa_bytes']==p.stat().st_size
          assert r['ipa_sha256']==hashlib.sha256(p.read_bytes()).hexdigest()
          VERIFY
          tag=r959-final-device-test
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft > existing.json 2>/dev/null; then
            test "$(jq -r .isDraft existing.json)" = true
            gh release upload "$tag" R959_Unsigned_DeviceTest.ipa VERIFICATION_R959.json restore_capture.py R959_PC_Capture_Tools.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" R959_Unsigned_DeviceTest.ipa VERIFICATION_R959.json restore_capture.py R959_PC_Capture_Tools.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title 'R959 iPhone 実機テスト 0.9.59' --notes '収集停止と画面切替の直後も、送信済みフレームのPC描画応答を元の録画へ記録。再共有側の不備で初回保存の検証を失わず、必須の計測が欠けた場合はPC検証を保留。'
          fi
          mkdir readback
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.ipa' --dir readback
          cmp R959_Unsigned_DeviceTest.ipa readback/R959_Unsigned_DeviceTest.ipa
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/R959_Unsigned_DeviceTest.ipa"
          curl --fail -sSL --retry 4 --retry-all-errors "$url" -o readback/published.ipa
          cmp R959_Unsigned_DeviceTest.ipa readback/published.ipa
          echo "R959_PUBLIC_READBACK_VERIFIED $url"

          curl --fail -sSL --retry 4 --retry-all-errors "${url%/*}/restore_capture.py" -o readback/restore_capture.py
          cmp restore_capture.py readback/restore_capture.py

          curl --fail -sSL --retry 4 --retry-all-errors "${url%/*}/R959_PC_Capture_Tools.zip" -o readback/R959_PC_Capture_Tools.zip
          cmp R959_PC_Capture_Tools.zip readback/R959_PC_Capture_Tools.zip
