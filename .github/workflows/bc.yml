name: R608 Auto - Original PNG Pixel Geometry Audit (No IPA)
"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/bc.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trueplan-r608-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
      && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 55
    env:
      PYTHONOPTIMIZE: "0"
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
    steps:
      - name: Restore pinned R607.1 and install R608 at exact one-button ZIP seam
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'R608_REPLAY'
          import base64,hashlib,lzma,textwrap,urllib.request
          from pathlib import Path
