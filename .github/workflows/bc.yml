              'https://raw.githubusercontent.com/'
              'zeek10191019-stack/true-plan-showdown-verification/'
              'a36c29084ec3705d24c2cae1eda156aea53066c3/'
              '.github/workflows/bb.yml'
          )
          raw = urllib.request.urlopen(url,timeout=90).read()
          assert len(raw)==4126,'R6071_PARENT_SIZE_DRIFT'
          assert hashlib.sha256(raw).hexdigest()==(
              '98919f6d42084dc46b9c08de0bfe4d6bc3f2b8d71021b6af94b828cca9c4b829'
          ),'R6071_PARENT_HASH_DRIFT'
          start="          python3 - <<'R607_FIX'\n"
          end='\n          R607_FIX'
          txt=raw.decode("utf-8")
          assert txt.count(start)==1 and txt.count(end)==1,'PARENT_REPLAY_DRIFT'
          body=textwrap.dedent(txt.split(start,1)[1].split(end,1)[0])
          exec(compile(body,'R6071_PINNED','exec'),{'__name__':'__main__'})
