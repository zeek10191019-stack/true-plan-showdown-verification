        assert len(names)==478
        for n,h in manifest.items():
            assert sha((src/n).read_bytes())==h,n
        tree=sha(''.join(n+'\t'+sha((src/n).read_bytes())+'\n'
            for n in sorted(names)).encode())
        assert tree==(
         "24725f61dcf3a11e9176d8fa6c2b2462"
         "f179f89cdda1029a2d0c7bf2aa8f1455"),"R768_TREE_SHA_MISMATCH"
