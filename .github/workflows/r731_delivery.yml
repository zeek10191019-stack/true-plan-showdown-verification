       assert hashlib.sha256(raw).hexdigest()==expected,'R731_PATCH_SHA_MISMATCH'
       obj=json.loads(raw)
       assert obj['schema']=='trueplan.r731.multigigabyte-original-archive.v1'
       assert len(obj['files'])==7 and len(obj['previous_sha'])==4 and len(obj['new_files'])==3
       root=pathlib.Path('R727Source')
       before={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
               for p in root.rglob('*') if p.is_file() and '.build' not in p.relative_to(root).parts}
       assert len(before)==300,('R731_BASE_COUNT_MISMATCH',len(before))
       for name,data in obj['files'].items():
        path=pathlib.PurePosixPath(name)
        assert not path.is_absolute() and '..' not in path.parts and str(path)==name
        dst=root/name
        if name in obj['previous_sha']:
         assert before[name]==obj['previous_sha'][name],('R731_PREIMAGE_MISMATCH',name)
        else:
         assert name in obj['new_files'] and not dst.exists()
        dst.parent.mkdir(parents=True,exist_ok=True)
        dst.write_text(data,encoding='utf8')
        assert hashlib.sha256(dst.read_bytes()).hexdigest()==hashlib.sha256(data.encode('utf8')).hexdigest()
       after={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file() and '.build' not in p.relative_to(root).parts}
       assert len(after)==303 and set(before)<=set(after)
       assert {name for name in before if after[name]!=before[name]}==set(obj['previous_sha'])
       assert set(after)-set(before)==set(obj['new_files'])
       print('R731_303_FILES_SHA_VERIFIED_3GB_FULL_ZIP_599MB_PER_PART_POLICY')
       PY
    - name: Run 108 Swift tests and parse all 234 app sources
      shell: bash
      run: |
       set -euo pipefail
       mkdir -p R731Artifacts
       (cd R727Source/R720_PORTABLE_TESTS && swift test -j 2) > R731Artifacts/R731_SWIFT_108_TESTS.log 2>&1 || {
         tail -n 100 R731Artifacts/R731_SWIFT_108_TESTS.log; exit 1;
       }
       grep -Fq 'Executed 108 tests, with 0 failures' R731Artifacts/R731_SWIFT_108_TESTS.log
       python3 - <<'PY'
       import pathlib
       files=list(pathlib.Path('R727Source/app/ios/ChampionsOnDevice').glob('*.swift'))
       assert len(files)==234,len(files)
       print('R731_APP_SOURCE_COUNT_PASS',len(files))
       PY
       swiftc -frontend -parse R727Source/app/ios/ChampionsOnDevice/*.swift
       echo R731_SWIFT_108_PASS_234_APP_SWIFT_PARSE_PASS
    - name: Export full 303-file editable source with per-file SHA and ZIP CRC
      shell: bash
      run: |
       set -euo pipefail
       python3 - <<'PY'
       import pathlib,hashlib,zipfile,json
       src=pathlib.Path('R727Source');out=pathlib.Path('R731Artifacts');out.mkdir(exist_ok=True)
       files=sorted(p for p in src.rglob('*') if p.is_file() and '.build' not in p.relative_to(src).parts)
       assert len(files)==303,('R731_SOURCES_MISSING',len(files))
       zip_path=out/'R731_ALL_EDITABLE_SOURCE_RECOVERY.zip'
       with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
        for p in files:z.write(p,p.relative_to(src).as_posix())
       with zipfile.ZipFile(zip_path) as z:
        assert z.testzip() is None and len(z.namelist())==303
       checksums={p.relative_to(src).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in files}
       (out/'R731_ALL_SOURCE_HASHES.json').write_text(json.dumps(checksums,indent=2,sort_keys=True))
       (out/'R731_SOURCE_RECEIPT.json').write_text(json.dumps({
        'files':303,'swift_app_files':234,'tests':'108/108 PASS',
        'source_sha_count':len(checksums),'archive_bytes':zip_path.stat().st_size,
        'source_zip_sha256':hashlib.sha256(zip_path.read_bytes()).hexdigest(),
        'zip_crc':'PASS','original_source':'R727_CI_SHA_PINNED_SUCCESS',
        'iPhone_device_test':'NOT_RUN','certified_79_fields':0},indent=2))
       print('R731_COMPLETE_SOURCE_ZIP_CRC_PASS',len(files))
       PY
    - name: Compile R731 FULL unsigned iPhoneOS app and package IPA
      shell: bash
      run: |
       set -euo pipefail
       python3 R727Source/tools/generate_xcode_project.py
       xcodebuild -project R727Source/app/ios/ChampionsOnDeviceResearch.xcodeproj \
        -scheme ChampionsOnDeviceResearch -configuration Debug \
        -sdk iphoneos -destination 'generic/platform=iOS' \
        ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
        -derivedDataPath "$RUNNER_TEMP/r731-derived" build \
        > R731Artifacts/R731_IPHONEOS_XCODEBUILD.log 2>&1 || {
        grep -E 'error:|BUILD FAILED' R731Artifacts/R731_IPHONEOS_XCODEBUILD.log | tail -n 100 || true
        exit 1
       }
       grep -Fq 'BUILD SUCCEEDED' R731Artifacts/R731_IPHONEOS_XCODEBUILD.log
       python3 - <<'PY'
       import os,pathlib,plistlib,zipfile,json,hashlib
       log=pathlib.Path('R731Artifacts/R731_IPHONEOS_XCODEBUILD.log').read_text(errors='replace')
       for name in ('CaptureCoordinator.swift','R710ContinuousRecorder.swift',
                    'R727AnalysisPNGPack.swift','R726LiveOCRClosure.swift','R729EvidenceTransportPolicy.swift','R730SplitReadback.swift',
             'R731ArchiveCapacity.swift'):
        assert name in log,('R731_INPUT_NOT_COMPILED',name)
       app=pathlib.Path(os.environ['RUNNER_TEMP'])/'r731-derived/Build/Products/Debug-iphoneos/ChampionsOnDeviceResearch.app'
       assert app.is_dir()
       info=plistlib.loads((app/'Info.plist').read_bytes())
       assert info['CFBundleVersion']=='731' and info['CFBundleShortVersionString']=='0.7.31'
       assert not (app/'embedded.mobileprovision').exists()
       ipa=pathlib.Path('R731Artifacts/R731_Unsigned_Research.ipa')
       with zipfile.ZipFile(ipa,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
        for p in sorted(app.rglob('*')):
         assert not p.is_symlink()
         if p.is_file():z.write(p,arcname='Payload/'+app.name+'/'+p.relative_to(app).as_posix())
       with zipfile.ZipFile(ipa) as z:assert z.testzip() is None
       assert ipa.stat().st_size<9_000_000
       pathlib.Path('R731Artifacts/R731_COMPILE_RECEIPT.json').write_text(json.dumps({
        'iphoneos_unsigned_build':'PASS','app_build':'731','swift_tests':'108/108 PASS',
        'source_files':303,'device_certified_fields':0,'actual_png_pack_test':'NOT_RUN',
        'owner_turn_certified':False,'screen_to_movie_alignment_certified':False},indent=2))
       print('R731_FULL_IPHONEOS_BUILD_PASS_NOT_DEVICE_CERTIFIED')
       PY
    - name: Guard public artifact storage (no paid overage)
      id: budget
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
       set -euo pipefail
       python3 - <<'PY'
       import pathlib,os,urllib.request,json
       root=pathlib.Path('R731Artifacts')
       size=sum(p.stat().st_size for p in root.rglob('*') if p.is_file())
       assert 0<size<16_000_000,('R731_ARTIFACT_SIZE_HOLD',size)
       used=0
       for page in range(1,11):
        url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/artifacts?per_page=100&page='+str(page)
        req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
         'Accept':'application/vnd.github+json','User-Agent':'TruePlan-R731-FreeGuard'})
        with urllib.request.urlopen(req,timeout=30) as response:items=json.load(response).get('artifacts',[])
        used+=sum(x['size_in_bytes'] for x in items if not x.get('expired'))
        if len(items)<100:break
       else:raise RuntimeError('R731_STORAGE_INVENTORY_INCOMPLETE')
       assert used+size<400_000_000,('R731_STORAGE_BUDGET_HOLD',used,size)
       with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('allowed=true\n')
       print('R731_PUBLIC_ARTIFACT_BUDGET_PASS',used,size)
       PY
    - uses: actions/upload-artifact@v4
      if: always() && steps.budget.outputs.allowed == 'true'
      with:
        name: R731-strict-ocr-png-evidence-audit
        path: R731Artifacts/
        if-no-files-found: error
    - name: Explicit device certification boundary
      if: always()
      shell: bash
      run: |
       set -euo pipefail
       {
        echo '## R731: 3GB original evidence archive, 599MB parts (not gameplay proof)'
        echo 'R730 full 300 files retained; 7 SHA-gated R731 source revisions.'
        echo 'A SHA-less OCR completion, missing submission or duplicate PNG fails closed.'
        echo 'Test and full iPhoneOS build results are valid only when each step succeeds.'
        echo 'Original 3-minute iPhone recording and 79-field device performance NOT measured.'
        echo 'Device-certified fields remain 0/79.'
       } >> "$GITHUB_STEP_SUMMARY"
