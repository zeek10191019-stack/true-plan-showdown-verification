       assert obj['schema']=='trueplan.r730.bytewise-split-readback.v1'
       assert len(obj['files'])==6 and len(obj['previous_sha'])==3 and len(obj['new_files'])==3
       root=pathlib.Path('R727Source')
       before={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
               for p in root.rglob('*') if p.is_file()}
       assert len(before)==297,('R730_BASE_FILE_COUNT_MISMATCH',len(before))
       for name,data in obj['files'].items():
        p=pathlib.PurePosixPath(name)
        assert not p.is_absolute() and '..' not in p.parts and str(p)==name
        dst=root/name
        if name in obj['previous_sha']:
         assert before[name]==obj['previous_sha'][name],('R730_PREIMAGE_MISMATCH',name)
        else:
         assert name in obj['new_files'] and not dst.exists()
        dst.parent.mkdir(parents=True,exist_ok=True)
        dst.write_text(data,encoding='utf8')
        assert hashlib.sha256(dst.read_bytes()).hexdigest()==hashlib.sha256(data.encode('utf8')).hexdigest()
       after={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()}
       assert len(after)==300 and set(before)<=set(after)
       assert {n for n in before if after[n]!=before[n]}==set(obj['previous_sha'])
       assert set(after)-set(before)==set(obj['new_files'])
       print('R730_300_SOURCE_FILES_RETAINED_EXACT_PATCH_SHA_PASS')
       PY
