      - name: Source callsites, numeric contract HOLD and native regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/r600_source_trace.py > r600_trace.json
          python3 tools/r601_source_audit.py > r601_audit.json
          python3 - <<'PY'
          import json
          x=json.load(open('r601_audit.json'))
          assert x['swift_files']==141
          assert not x['production_wired']
          assert not x['numerical_parity_certified']
          print('R601_PRODUCTION_GATE_HOLD',x['reason'])
          print('R601_UI_CANDIDATES',x['ui_candidates'][:35])
          print('R601_ARCHIVE_CANDIDATES',x['archive_candidates'][:50])
          print('R601_CALL_EDGES',x['callsite_edges'][:70])
          print('R601_R595_FEATURE_LINES',x['r595_feature_lines'][:85])
          PY
          swiftc -frontend -parse app/ios/ChampionsOnDevice/*.swift
          swiftc -parse-as-library \
            app/ios/ChampionsOnDevice/R596FormCatalog.swift \
            app/ios/ChampionsOnDevice/R597FormEvidenceBridge.swift \
            app/ios/ChampionsOnDevice/R598OneButtonFormAttachment.swift \
            app/ios/ChampionsOnDevice/R599BoundOneButton.swift \
            app/ios/ChampionsOnDevice/R600CollectorHandshake.swift \
            tests/R600CollectorHandshakeHarness.swift \
            -o "$RUNNER_TEMP/r600"
          "$RUNNER_TEMP/r600"
          for t in test_r596_catalog_import.py \
                   test_r597_catalog_audit.py \
                   test_r598_research_audit.py \
                   test_r599_source_audit.py; do
            python3 -m unittest discover -s tests -p "$t" -v
          done
          python3 -m unittest discover -s tests -p 'test_r600_*.py' -v
          python3 tools/run_r571_native.py || {
            for f in reports/xcode_iphoneos_build.log \
                     reports/r574_png_replay_compile.log; do
              test ! -f "$f" || grep -nE 'error:|BUILD FAILED' "$f" | tail -n 50 || true
            done
            exit 1
          }
          echo 'R601 BUILD PASS IS NOT REAL IMAGE OR ONE BUTTON CERTIFICATION'
