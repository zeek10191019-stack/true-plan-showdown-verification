          original=textwrap.dedent(match.group(1))
          ast.parse(original)
          exec(compile(original,'R595_PINNED','exec'),{'__builtins__':__builtins__})
          root=Path('app/ios/ChampionsOnDevice')
          assert len(list(root.glob('*.swift')))==136,'R595_RESTORATION_NOT_EXACT'
          versions={
              'an.yml':'d44731b53f2fb4acd3742b34e46add4ec064b9a5',
              'ao.yml':'07acbef10b67f1c1ce5ab008a854bdf04dc5dca5',
