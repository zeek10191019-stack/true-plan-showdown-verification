jobs:
  build:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            1e63efa4db514cc122f2940a39623d9bc65c554c
      - name: Verify and build R689 IPA
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os,re,base64,lzma,hashlib
          import pathlib,urllib.request,ast
          url=('https://raw.githubusercontent.com/'
            'zeek10191019-stack/'
            'true-plan-showdown-verification/'
            '843c3c9360f7e7209f5a'
            '6834481c50ff59fefc79/'
            '.github/workflows/a8.yml')
          req=urllib.request.Request(url,headers={
            'User-Agent':'R689-Pinned-Build'})
          with urllib.request.urlopen(
            req,timeout=40) as res:
            a8=res.read(18000)
          assert len(a8)==12698
          assert hashlib.sha256(a8).hexdigest()==(
            '0077d67b1867a36a538208cd7fc64aa'
            '3b785d1b9caa4727eecd72313a2250e6e')
          m=re.search(rb'(?m)^  R688_PKG: >-\n'
                      rb'((?:    [^\n]*\n)+)',a8)
          assert m,'PINNED_R688_PACKAGE_MISSING'
          os.environ['R688_PKG']=b''.join(
            m[1].split()).decode('ascii')
          blob=lzma.decompress(base64.b64decode(
            os.environ['R689_PKG']),
            format=lzma.FORMAT_ALONE)
          assert hashlib.sha256(blob).hexdigest()==(
            '9b820209b70b80ea6ccb338a311cdf11'
            'cd5d4427a23b0abcd72e319083f521c3')
          names=['R689FrameJournal.swift',
                 'R689StreamingZIP.swift',
                 'R689Patch.py',
                 'R689MakeBuild.py',
                 'R689StreamingZIPSmoke.swift']
          sizes=[11038, 13923, 3342, 2824, 3473]
          assert sum(sizes)==len(blob)
          pos=0
          for n,size in zip(names,sizes):
            isTest=n.endswith('Smoke.swift')
            folder='tests' if isTest else 'tools'
            target=folder+'/'+n
            p=pathlib.Path(target)
            p.parent.mkdir(
              parents=True,exist_ok=True)
            p.write_bytes(blob[pos:pos+size])
            pos+=size
          print('R689_PINNED_BUNDLE_SHA_PASS',
            flush=True)
          text=a8.decode('utf-8')
          marker="          python3 - <<'PYCODE'\n"
          begin=text.index(marker)+len(marker)
          finish=text.index(
            '\n          PYCODE',begin)
          block=text[begin:finish]
          body='\n'.join(line[10:] for line in
                         block.splitlines())
          needle=("['python3','tools/"
            "R688MakeBuild.py']")
          assert body.count(needle)==1
          body=body.replace(needle,
            "['python3','tools/R689MakeBuild.py']")
          ast.parse(body)
          compiled=compile(body,'r688','exec')
          exec(compiled,{})
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: R689-unsigned-iLoader-IPA
          path: dist/R689*
          if-no-files-found: error
          retention-days: 7
