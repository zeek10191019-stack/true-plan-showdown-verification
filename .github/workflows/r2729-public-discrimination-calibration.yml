          'use strict';
          /** R27.27 research evaluation on pinned Showdown fixture; no real-game certification.
           * Forecast weights conditioned on public reveal; second turn reuses root forecast
           * (does NOT update Bayes posterior from future hypothetical events).
           */
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const {Battle}=require('./dist/sim/battle');
          const {makeVariants}=require('./r2723-multiturn-belief-boundaries.cjs');
