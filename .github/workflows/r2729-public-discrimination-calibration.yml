          'use strict';
          /** R27.27: only public event + public posterior forecast; no hidden opponent state.
           * Research fixture move 1 is a PUBLICLY revealed move, move 2 is Protect.
           * Confidence alpha interpolates neutral uniform (0) and class forecast (1).
           * This is a modeling assumption, not a learned/calibrated opponent policy.
           */
          const assert=require('node:assert/strict');
          const {publicContract}=require('./r2726-search-core.cjs');
          const NAMES=Object.freeze({'Swords Dance':'setup','Will-O-Wisp':'status','Flamethrower':'attack'});
          const EXPECTED=Object.freeze(['attack','setup','status','defend']);
          const uniform=()=>[{choice:'move 1',p:0.5},{choice:'move 2',p:0.5}];
          function forecastValid(f){
           assert(f&&typeof f==='object'&&!Array.isArray(f),'missing class forecast');
           assert.deepEqual(Object.keys(f).sort(),[...EXPECTED].sort(),'forecast class contract');
           assert(EXPECTED.every(k=>typeof f[k]==='number'&&Number.isFinite(f[k])&&f[k]>=0&&f[k]<=1),'forecast contains invalid probability');
           assert(Math.abs(EXPECTED.reduce((s,k)=>s+f[k],0)-1)<1e-8,'forecast not normalized');
          }
          function publicActorAndReveals(observation){
           publicContract(observation);
           let actor=null;
           const revealed=new Map();
           for(const line of observation.visible_protocol){
            const switched=line.match(/^\|(?:switch|drag|replace)\|p2a: ([^|]+)\|/);
            if(switched)actor=switched[1];
            const faint=line.match(/^\|faint\|p2a: ([^|]+)$/);
            if(faint&&actor===faint[1])actor=null;
            const moved=line.match(/^\|move\|p2a: ([^|]+)\|([^|]+)\|/);
            if(moved){
             const prior=revealed.get(moved[1])||new Set();prior.add(moved[2]);revealed.set(moved[1],prior);
            }
           }
           return {actor,knownMoves:[...(revealed.get(actor)||[])]};
          }
          function policy(observation,forecast,alpha){
           forecastValid(forecast);
           assert(typeof alpha==='number'&&Number.isFinite(alpha)&&alpha>=0&&alpha<=1,'invalid confidence');
           const {actor,knownMoves}=publicActorAndReveals(observation);
           if(actor!=='Target4')return uniform(); // No public map for the new opponent; fail safe to neutral.
           const known=knownMoves.filter(x=>Object.hasOwn(NAMES,x));
           assert(known.length<=1,'ambiguous revealed private first move');
           if(!known.length)return uniform();
           const cls=NAMES[known[0]];
           const denominator=forecast[cls]+forecast.defend;
           assert(denominator>0,'zero public mapping probability');
           const raw=forecast[cls]/denominator;
           const p1=(1-alpha)*0.5+alpha*Math.max(0.01,Math.min(0.99,raw));
           return [{choice:'move 1',p:p1},{choice:'move 2',p:1-p1}];
          }
          module.exports={policy,publicActorAndReveals,forecastValid,uniform};
