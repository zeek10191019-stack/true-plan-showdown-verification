          'use strict';
          /** Finite-seed, observation-conditioned belief research for pinned Showdown M-C.
           * No native Pokémon Champions equivalence or win-rate certification.
           */
          const assert=require('node:assert/strict');
          const fs=require('node:fs');const path=require('node:path');
          const {Battle}=require('./dist/sim/battle');
          const {viewer}=require('./r2722-rng-observation-boundaries.cjs');
