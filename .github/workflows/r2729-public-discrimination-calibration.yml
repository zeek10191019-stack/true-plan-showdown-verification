          const {choose,hash}=require('./r2726-search-core.cjs');
          const {legalSecond}=require('./r2726-future-public-legal.cjs');
          const {reveal,transition,continuation}=require('./r2726-native-rollout.cjs');
          const {policy}=require('./r2727-public-policy.cjs');
          const {makeLeaf}=require('./r2727-evaluation.cjs');
          const {makeTransitionCache}=require('./r2727-transition-cache.cjs');
          const CONFIDENCES=Object.freeze([0,0.5,1]);
          const leaf=makeLeaf(Battle);
          const copy=x=>JSON.parse(JSON.stringify(x));
          function evaluateVariant(variant,prepared){
           const seen=prepared[variant.id],posterior=seen.posterior;
           const eligible=posterior.posterior.filter(h=>h.p>0);
           assert.equal(eligible.length,2);
           const mass=eligible.reduce((s,h)=>s+h.p,0);assert(Math.abs(mass-1)<1e-8);
           const particles=eligible.map(h=>({p:h.p/mass,state:prepared[h.id].state}));
           const observation=seen.observation;
           const actions=legalActions(observation).map(x=>x.choice);
           assert.equal(actions.length,6);
           const forecast=posterior.next_action_prediction;
           const baseline=decide(observation,forecast);
           const inputHash=hash(observation),particleHashes=particles.map(p=>hash(p.state));
           const cached=makeTransitionCache(transition,5000);
           const results=CONFIDENCES.map(alpha=>{
            const branches=policy(observation,forecast,alpha);
            const search=choose({observation,particles,actions,
             opponent:(publicObservation,depth)=>{assert(['root','next'].includes(depth));return policy(publicObservation,forecast,alpha);},
             transition:cached.transition,continuation,legalSecond,leaf,maxNodes:12000});
            assert(search.stats.second_turn_nodes>0);
            assert(search.stats.public_information_sets>0);
            assert.equal(search.stats.depth_joint_turns,2);
            assert.equal(search.ranked.length,6);
            return {alpha,root_branches:branches,selected:search.selected,
             ranking:search.ranked,margin:Number((search.ranked[0].value-search.ranked[1].value).toFixed(9)),stats:search.stats};
           });
           assert.equal(hash(observation),inputHash,'public observation mutated');
           assert.deepEqual(particles.map(p=>hash(p.state)),particleHashes,'hidden source state mutated');
           return {variant:variant.id,public_hash:inputHash,posterior:posterior.posterior,
            baseline_one_ply:baseline.selected,model_class_forecast:copy(forecast),runs:results,
            decision_stable_across_confidence:new Set(results.map(r=>r.selected)).size===1,
            cache:cached.stats()};
          }
          function run(){
           const {format,dex,cases}=makeVariants();assert.equal(cases.length,6);
           const prepared=Object.fromEntries(cases.map(v=>[v.id,reveal(format,dex,v)]));
           const once=cases.map(v=>evaluateVariant(v,prepared));
