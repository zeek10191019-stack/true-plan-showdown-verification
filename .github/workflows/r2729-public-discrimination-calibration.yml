          /** R27.27 multi-factor leaf: NOT win probability or learned function. */
          const assert=require('node:assert/strict');
          function scoreFeatures(side){
           assert(side&&Array.isArray(side.pokemon)&&side.pokemon.length===3,'unsupported bring-three state');
           let hp=0,fainted=0,status=0;
           for(const p of side.pokemon){
