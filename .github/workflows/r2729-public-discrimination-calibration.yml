            assert.equal(t.outcomes.length,3);
            const selected=t.outcomes.map(x=>x.selected);
            changes+=new Set(selected).size>1?1:0;
            const scores=t.outcomes.map(x=>{assert(x.ranking.length>=2);
             const margin=x.ranking[0].value-x.ranking[1].value;
             assert(Number.isFinite(margin)&&margin>=0);
             if(margin>0)nonzero++;
             minMargin=Math.min(minMargin,margin);
             return {alpha:x.alpha,selected:x.selected,top2_margin:margin};
            });
            return {variant:t.variant,public_observation_sha256:t.public_observation_sha256,alphas:scores};
           });
           return {parent_receipt_sha256:sha(src),parent_traces_sha256:sha(raw),searches:18,
            variant_changes:changes,positive_margin_run_count:nonzero,minimum_top2_margin:minMargin,rankings};
          }
