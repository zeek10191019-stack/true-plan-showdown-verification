            trainEvents:['event-a','event-a','event-b','event-c','event-a','event-d','event-a','event-c','event-b','event-a'],
            holdoutEvents:['event-a','event-d','event-b','event-c']});
           const stress=discrimination();
           assert.equal(parent.variant_changes,0,'R2728 baseline sensitivity unexpectedly changed');
           assert.equal(stress.grid[0].selected,'move 2');assert.equal(stress.grid.at(-1).selected,'move 1');
           const receipt={schema:'TRUE_PLAN_R2729_DISCRIMINATION_AND_CALIBRATION_V1',
            status:'PASS_PUBLIC_SYNTHETIC_ONLY',parent_r2728_verified:true,
            pinned_commit:'aa17ca0fac8bc5605df673bd8774c2d0e91efa43',
            baseline_18_searches:parent.searches,baseline_alpha_choice_changes:parent.variant_changes,
            controlled_probability_levels:stress.grid.length,controlled_choice_flip:stress.flips_detected,
            independent_expected_utility_oracle_matched:stress.oracle_matched,
            synthetic_opponent_records:112,synthetic_train_records:80,synthetic_holdout_records:32,
            selected_mixing_alpha:calibration.alpha,
            synthetic_heldout_logloss_raw:calibration.holdout.raw.log_loss,
            synthetic_heldout_logloss_calibrated:calibration.holdout.calibrated.log_loss,
            synthetic_heldout_brier_raw:calibration.holdout.raw.brier,
            synthetic_heldout_brier_calibrated:calibration.holdout.calibrated.brier,
            categorical_scenario_toy_only:true,
            hard_stop:{native33:'0/33',exact34:'0/34',actual_game:'0/30',formal_increment:0,gate:'DENY'},
            limitations:['Public Showdown synthetic scripted and toy counterfactuals only',
             'Reuses pinned R27.28 native simulation but discrimination oracle uses synthetic scoring rules',
             'Synthetic train/holdout labels cannot calibrate against human opponents',
             'Four illustrative RNG seeds are NOT sampled with verified real RNG probabilities',
             'No trained general Battle AI and no proven win-rate gain',
             'Native33 Exact34 actual Champions game and FORMAL not certified']};
           fs.mkdirSync(out,{recursive:true});
           const write=(name,x)=>fs.writeFileSync(path.join(out,name),JSON.stringify(x,null,2)+'\n');
           write('r2729-receipt.json',receipt);write('r2729-parent-reanalysis.json',parent);
           write('r2729-controlled-discrimination.json',stress);write('r2729-synthetic-calibration.json',calibration);
           write('r2729-synthetic-scenario-weights.json',seedToy);
           console.log('R2729_PUBLIC_RESULT '+JSON.stringify(receipt));
           return receipt;
          }
          if(require.main===module)run(process.argv[2]||'./r2728-evidence',process.argv[3]||'./r2729-evidence');
          module.exports={run,auditParent};
          R2729_SOURCE_3
          printf '%s  %s\n' '0ee8e5474f1c0849a2f0c6f5238eae892311fbd9abf90f2595d8d141d29d2fa9' './r2729-native-audit.cjs' | sha256sum -c -
          node --check ./r2729-native-audit.cjs
          node ./test_r2729.cjs
          node ./r2729-native-audit.cjs ./r2728-evidence ./r2729-evidence | tee ./r2729-console.log
          cp r2729-calibration.cjs r2729-discrimination.cjs test_r2729.cjs r2729-native-audit.cjs ./r2729-evidence/
      - name: Independently audit R27.29 public synthetic results
        shell: bash
        working-directory: ${{ runner.temp }}/showdown
        run: |
          set -euo pipefail
          cat > ./r2729-evidence/R2729_INDEPENDENT_AUDITOR.py <<'R2729_PY_AUDITOR'
          #!/usr/bin/env python3
          """R27.29 offline independent integrity/metric audit. Strictly synthetic-only."""
          import hashlib, json, math, sys
          from pathlib import Path
          
          def verify(root):
              root=Path(root)
              required={'r2729-receipt.json','r2729-parent-reanalysis.json',
                'r2729-controlled-discrimination.json','r2729-synthetic-calibration.json',
                'r2729-synthetic-scenario-weights.json',
                'r2729-calibration.cjs','r2729-discrimination.cjs','r2729-native-audit.cjs','test_r2729.cjs',
                'R2729_INDEPENDENT_AUDITOR.py','SHA256SUMS.txt'}
              assert {p.name for p in root.iterdir()}==required,'unexpected/missing files'
              assert all(p.is_file() and not p.is_symlink() for p in root.iterdir()),'unsafe artifact member'
              assert sum(p.stat().st_size for p in root.iterdir())<8_000_000,'evidence too large'
              manifest={}
              for line in (root/'SHA256SUMS.txt').read_text().splitlines():
                  dig,name=line.split('  ',1)
                  assert name not in manifest and name in required and name!='SHA256SUMS.txt','manifest unexpected'
                  assert hashlib.sha256((root/name).read_bytes()).hexdigest()==dig,'file hash mismatch '+name
                  manifest[name]=dig
              assert set(manifest)==required-{'SHA256SUMS.txt'},'incomplete manifest'
              load=lambda f:json.loads((root/f).read_text())
              r=load('r2729-receipt.json');p=load('r2729-parent-reanalysis.json')
              d=load('r2729-controlled-discrimination.json');c=load('r2729-synthetic-calibration.json')
              s=load('r2729-synthetic-scenario-weights.json')
              assert r['schema']=='TRUE_PLAN_R2729_DISCRIMINATION_AND_CALIBRATION_V1'
              assert r['status']=='PASS_PUBLIC_SYNTHETIC_ONLY'
              assert r['hard_stop']=={'native33':'0/33','exact34':'0/34','actual_game':'0/30','formal_increment':0,'gate':'DENY'}
              assert r['baseline_18_searches']==p['searches']==18
              assert r['baseline_alpha_choice_changes']==p['variant_changes']==0
              assert len(p['rankings'])==6
              assert p['parent_receipt_sha256']=='6d2815873b0e505450c67f213a4db6b7dc8707c82eef1980de0af957f09ef71e'
              assert p['parent_traces_sha256']=='15900bc48127dd429751b4a415d5f754b8ffcc15de10f94dd7a0abae159acab7'
              assert d['origin']=='SYNTHETIC_ONLY' and len(d['grid'])==5
              assert d['flips_detected'] and d['oracle_matched']
              assert [x['root_attack_probability'] for x in d['grid']]==[.1,.25,.5,.75,.9]
              expected_selections=['move 2','move 2','move 1','move 1','move 1']
              for row,selection in zip(d['grid'],expected_selections):
                  x=row['root_attack_probability']
                  assert row['selected']==selection
                  predicted={'move 1':x*10+(1-x)*(-10)+2,'move 2':x*(-10)+(1-x)*10+2}
                  assert len(row['ranked'])==2
                  for q in row['ranked']:
                      assert math.isclose(q['value'],predicted[q['choice']],abs_tol=1e-8), 'independent expected utility mismatch'
                  assert row['stats']['particles']==8 and row['stats']['second_turn_nodes']>0
              assert c['origin']=='SYNTHETIC_ONLY' and c['split']=={'train':80,'holdout':32,'groups':28}
              assert r['synthetic_opponent_records']==112
              assert c['alpha'] in [0,.25,.5,.75,1]
              # Independently recompute all train and holdout loss metrics, separately from Node implementation.
              profiles=[{'attack':.75,'setup':.10,'status':.10,'defend':.05},
                        {'attack':.10,'setup':.75,'status':.10,'defend':.05},
                        {'attack':.10,'setup':.10,'status':.75,'defend':.05},
                        {'attack':.10,'setup':.10,'status':.05,'defend':.75}]
              cats=['attack','setup','status','defend']
              train=[];holdout=[]
              for group in range(28):
                  i=group%4
                  for j in range(4):
                      label=cats[i] if j in (0,1) else cats[(i+j)%4]
                      (train if group<20 else holdout).append((profiles[i],label))
              def metrics(records,alpha):
                  ll=0;brier=0
                  for forecast,label in records:
                      prob={k:(1-alpha)/4+alpha*forecast[k] for k in cats}
                      ll-=math.log(max(1e-12,prob[label]))
                      brier+=sum((prob[k]-int(k==label))**2 for k in cats)
                  return ll/len(records),brier/len(records)
              grid=[(a,metrics(train,a)[0]) for a in [0,.25,.5,.75,1]]
              chosen=sorted(grid,key=lambda x:(x[1],x[0]))[0][0]
              assert chosen==c['alpha']==r['selected_mixing_alpha'],'train-only alpha mismatch'
              assert len(c['train_curve'])==5
              for item,expected in zip(c['train_curve'],grid):
                  assert item['alpha']==expected[0] and math.isclose(item['log_loss'],expected[1],abs_tol=1e-12)
              for title,a in [('uniform',0),('raw',1),('calibrated',chosen)]:
                  logloss,brier=metrics(holdout,a)
                  assert math.isclose(c['holdout'][title]['log_loss'],logloss,abs_tol=1e-12)
                  assert math.isclose(c['holdout'][title]['brier'],brier,abs_tol=1e-12)
              assert s['origin']=='SYNTHETIC_ONLY'
              assert math.isclose(sum(s['weights'].values()),1,abs_tol=1e-9)
              assert s['train_n']==10 and s['holdout_n']==4
              return {'status':'PASS_PUBLIC_SYNTHETIC_INDEPENDENT_AUDIT_ONLY','files_verified':len(manifest),
                      'controlled_conditions':5,'baseline_reanalyzed_runs':18,
                      'train_count':80,'holdout_count':32,'alpha':chosen,
                      'certification':r['hard_stop']}
          
          if __name__=='__main__':
              try:
                  print('R2729_INDEPENDENT_AUDIT '+json.dumps(verify(sys.argv[1] if len(sys.argv)>1 else 'r2729-evidence'),sort_keys=True))
              except Exception as exc:
                  print('R2729_AUDIT_FAILED '+repr(exc),file=sys.stderr)
                  raise
          R2729_PY_AUDITOR
          (cd ./r2729-evidence && sha256sum *.cjs *.json *.py > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          python3 ./r2729-evidence/R2729_INDEPENDENT_AUDITOR.py ./r2729-evidence
      - name: Upload R27.29 public synthetic evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: r2729-public-discrimination-calibration-proof
          path: ${{ runner.temp }}/showdown/r2729-evidence
          retention-days: 7
          if-no-files-found: error
