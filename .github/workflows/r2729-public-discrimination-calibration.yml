          'use strict';
          /** Research-only bounded transition cache. Full simulator states are NEVER passed
           * to opponent policy; stored only internally for identical deterministic rollouts.
           * The hash includes RNG state, so distinct stochastic states cannot alias.
           */
          const assert=require('node:assert/strict');
          const {hash}=require('./r2726-search-core.cjs');
          const copy=x=>JSON.parse(JSON.stringify(x));
          function makeTransitionCache(transition,limit=5000){
           assert.equal(typeof transition,'function');
           assert(Number.isInteger(limit)&&limit>0&&limit<=50000,'unsafe cache limit');
           const table=new Map();let hits=0,misses=0,evictions=0;
           const wrapped=(state,own,opp)=>{
            assert(state&&typeof state==='object'&&typeof own==='string'&&typeof opp==='string','invalid deterministic transition input');
            const key=hash({state,own,opp});
            if(table.has(key)){hits++;return copy(table.get(key));}
            const result=transition(state,own,opp);
            assert(result&&result.state&&typeof result.terminal==='boolean','invalid simulator result');
            misses++;
            if(table.size>=limit){table.delete(table.keys().next().value);evictions++;}
            table.set(key,copy(result));
            return copy(result);
           };
           return {transition:wrapped,stats:()=>({hits,misses,evictions,entries:table.size,limit})};
          }
          module.exports={makeTransitionCache};
