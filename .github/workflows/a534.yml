          with urllib.request.urlopen(url,timeout=60) as response:
              raw=response.read(30000)
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='82844c7d80e68d58329b0d55463e5806bec1442a','R533_PINNED_BLOB_CHANGED'
