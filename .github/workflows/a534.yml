276f82b16a430f4ea7459bca828ffa6bcd8e57aae6bfc221\', \'CaptureCoordinator.swift\': \'50bcacfae3253a58b769ce7fd511a888c1660a2931054b9dfa2f6c01ea11e9a4\', \'TP532FirstPassDiagnostics.swift\': \'fa8b98fde6abb05e8d1c997e17422e643d432d40d83e39247a1e3749e3a1edcc\'}\\nfor fname,fsha in expected_r534.items():\\n    assert hashlib.sha256((files/fname).read_bytes()).hexdigest()==fsha, \'R534_SWIFT_HASH_CHANGED_\'+fname\\nassert len(list(files.glob(\'*.swift\')))==83, \'R534_WRONG_FILE_COUNT\'\\nprint(\'PASS_R534_83_EXACT_SWIFT_SOURCES\',flush=True)\\n"\nanchor="swift=sorted(files.glob(\'*.swift\'))"\nassert code.count(anchor)==1,\'R534_SWIFT_INJECTION_ANCHOR_CHANGED\'\ncode=code.replace(anchor,r534_insert+\'\\n\'+anchor,1)\ncode=code.replace(\'R533\',\'R534\').replace(\'r27533\',\'r27534\')\ncode=code.replace("\'533\'","\'534\'").replace("\'0.5.33\'","\'0.5.34\'")\nassert \'dist/R534.ipa\' in code,\'R534_TARGET_CHANGED\'\nassert "info.get(\'CFBundleVersion\')==\'534\'" in code,\'R534_BUILD_VERSION_CHANGED\'\nassert "info.get(\'CFBundleShortVersionString\')==\'0.5.34\'" in code,\'R534_SHORT_VERSION_CHANGED\'\nassert "assert len(swift)==83,\'R534_SWIFT_COUNT\'" in code,\'R534_SWIFT_COUNT_CONTRACT_CHANGED\'\nmanifest_anchor="\'r532_patch_sha256\':\'db0396f4c0e3344bbcb6404701da29f9e3a1c11dbd1fceab6c45a9df402b0b3c\'"\nassert code.count(manifest_anchor)==1,\'R534_BUILD_AUDIT_ANCHOR_CHANGED\'\ncode=code.replace(manifest_anchor,manifest_anchor+",\'r534_patch_sha256\':\'88629c1cb65f810c17e75eb1e3752fbd99bb6727040a2fa83f6732ccfb85ce0b\'",1)\nast.parse(code)\nprint(\'PASS_R534_PREBUILD_INJECTION\',flush=True)\n'
