          assert m,'R533_BUILDER_NOT_FOUND'
          source=textwrap.dedent(m.group(1).decode())
          old="exec(compile(source,'R533_REPRODUCIBLE_BUILD_WRAPPER','exec'))"
          assert source.count(old)==1,'R533_EXEC_ANCHOR_CHANGED'
          oldInner="exec(compile(code,'R533_VERIFIED_BUILD','exec'))"
