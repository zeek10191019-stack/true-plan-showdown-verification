name: R534 Automatic OCR Single-Pass IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
      && github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Verify pinned R533 and integrate tested R534 optimization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY534'
