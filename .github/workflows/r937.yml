      shell: bash
      run: |-
        set -euo pipefail
        command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install ffmpeg
        bash r937-tests/build_driver.sh pinned-r793/source "$RUNNER_TEMP/driver"
