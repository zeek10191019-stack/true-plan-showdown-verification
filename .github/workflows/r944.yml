      - name: Test shared evidence, tampering, and existing capacity boundaries
        shell: bash
        run: |
          set -euo pipefail
          cd pinned-r793/source
          python3 tools/r745_read_path_gate.py
          python3 tools/r852_preflight_wiring.py
          python3 -m unittest discover -s tools/tests -p 'test_r875_native_capture_audit.py'
          python3 -m unittest discover -s tools/tests -p 'test_r76?_*.py'
          node tools/tests/test_r920_pc_display.mjs
          source_package="$PWD/R720_PORTABLE_TESTS"
          focused="$RUNNER_TEMP/r944-focused"
          mkdir -p "$focused/Sources/R719Core" "$focused/Tests/R719CoreTests"
          cp "$source_package/Package.swift" "$focused/"
          for name in R719Core R727AnalysisPNGPack R731ArchiveCapacity R735OCRJournalKey R738SubmittedSourceAudit R742QuickSourcePackAudit; do
            cp "$source_package/Sources/R719Core/$name.swift" "$focused/Sources/R719Core/"
          done
          for name in R742QuickSourcePackAuditTests R761AggregatePNGBudgetTests; do
            cp "$source_package/Tests/R719CoreTests/$name.swift" "$focused/Tests/R719CoreTests/"
          done
          swift test --jobs 3 --package-path "$focused" 2>&1 | tee "$RUNNER_TEMP/r944-swift.log"
          grep -Eq 'Executed 6 tests, with 0 failures' "$RUNNER_TEMP/r944-swift.log"
      - name: Compile the iOS target on the pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project pinned-r793/source/app/ios/ChampionsOnDeviceResearch.xcodeproj -scheme ChampionsOnDeviceResearch -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO -derivedDataPath "$RUNNER_TEMP/r944_device" build > "$RUNNER_TEMP/native.log" 2>&1 || { grep -E -B2 -A2 'error:|BUILD FAILED' "$RUNNER_TEMP/native.log"; exit 1; }
          grep -F 'BUILD SUCCEEDED' "$RUNNER_TEMP/native.log"
          app="$RUNNER_TEMP/r944_device/Build/Products/Release-iphoneos/ChampionsOnDeviceResearch.app"
          test "$(lipo -archs "$app/ChampionsOnDeviceResearch")" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Info.plist")" = 942
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist")" = 0.9.42
          echo R944_IPHONEOS_SOURCE_BUILDS
