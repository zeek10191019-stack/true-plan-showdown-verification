          dest=Path('r1002');dest.mkdir(exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(blob)) as z:
              assert set(z.namelist())==set(['R1001BattleSafetyCore.swift', 'R1000CapturePCBridge.swift', 'R1002UncertifiedBoundaryTests.swift', 'R1002ObservationJSONExport.swift', 'CONTRACT_V1.schema.json'])
              assert z.testzip() is None
              for name in z.namelist():
                  assert '/' not in name and '\\' not in name and name not in ('.','..')
                  (dest/name).write_bytes(z.read(name))
          print('R1002 fixture integrity OK:',len(list(dest.iterdir())))
