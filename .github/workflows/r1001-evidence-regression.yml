# R1001 standalone regression; automatically runs when THIS workflow is changed on main.
# Also allows manual workflow_dispatch. Does not build or release an iPhone IPA.
# Tests use R999 ai024-pc-pairing source baseline, NOT R998.
# Public repository + standard Ubuntu runner only; no paid services / artifacts.
name: R1001 R998.1 iPhone-Lenovo fail-closed regression
'on':
  push:
    branches:
      - main
    paths:
      - '.github/workflows/r1001-evidence-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r1001-evidence-regression
  cancel-in-progress: false
jobs:
  standalone-regression:
    # Safeguard if this repository ever changes visibility: do not start a paid runner.
    if: ${{ github.event.repository.private == false && github.repository == 'zeek10191019-stack/true-plan-showdown-verification' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai024-pc-pairing
          persist-credentials: false
      - name: Enforce R999 AI024 pairing baseline (not older R998)
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .github/workflows/ai024-pc-pairing.yml
          grep -Fq 'R998_COMMIT:' .github/workflows/ai024-pc-pairing.yml
          grep -Fq 'R999_AI024_Unsigned_DeviceTest.ipa' .github/workflows/ai024-pc-pairing.yml
          echo 'PASS: existing R999 AI024 pairing source workflow present'
