              assert set(z.namelist()) == set(['R1001BattleSafetyCore.swift', 'R1000CapturePCBridge.swift', 'R1001NoVerifierFailClosedTests.swift', 'R1001SimulatedWitnessTests.swift', 'R1000CapturePCBridgeTests.swift', 'R1000BridgeConcurrencyTests.swift', 'R999HUDGeometry.swift', 'R999HUDGeometryTests.swift', 'R1000LenovoViewerTests.js', 'R1000_PC_EVIDENCE.json', 'R1000_LENOVO_REPLAY.html', 'R1001_FIXTURE_ASSERTIONS.py', 'RUN_GITHUB_R1001.sh']), 'unexpected file inventory'
              for name in z.namelist():
                  assert '/' not in name and '\\' not in name and name not in ('.','..')
                  (root/name).write_bytes(z.read(name))
          print('R1001 VERIFIED_FILES',len(list(root.iterdir())))
