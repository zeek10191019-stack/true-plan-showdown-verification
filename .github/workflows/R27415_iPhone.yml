# Source is a public research prototype. Do not add personal screenshots or secrets.
# R27.403 PUBLIC research source only. Unsigned IPA is NOT installable until locally signed on Windows.
# No private Battle AI, MP4s, secrets, Apple credentials, paid runner, or certificates.
