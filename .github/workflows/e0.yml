name: R740 Proven Base64 Delivery - Not Device Certified
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/e0.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
    - name: Restore SHA pinned R739 and apply R740 additive patch
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
       set -euo pipefail
       url='https://api.github.com/repos/'
       url+='zeek10191019-stack/'
       url+='true-plan-showdown-verification/'
       url+='actions/artifacts/13739360739/zip'
       curl -fLsS --retry 2 -H "Authorization: Bearer $GH_TOKEN" \
        -H 'Accept: application/vnd.github+json' \
        "$url" -o /tmp/r740-base.zip
       mkdir -p source R740Artifacts
       python3 - <<'PYTHON'
       import base64,hashlib,io,json,lzma,pathlib,zipfile
       root=pathlib.Path('source')
       digest=lambda b:hashlib.sha256(b).hexdigest()
