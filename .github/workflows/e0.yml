       yhO34Macds1Z7D9DgG4bXPGDmwN5uWaTas0PoueQt1UCe0cdJyjRUEuufNyo3LHd
       rQQA/IYPNynR6msZCKmXKGVkFYHN3dobl+9y9MAB+nsep9i/PgWZHuLlz1avnY1n
       e4LorGYCz6Bpstim2FDZUb9DoM289BscJ+KExwxGRV++6Rzic2H0Kfs9SAM1yAAA
       GZHdwdgFbQ4AAftBmcIBAL+R65KxxGf7AgAAAAAEWVo=
       '''
       pkt=json.loads(lzma.decompress(base64.b64decode(''.join(
        packed.split()))))
       assert pkt['schema']=='r740.safe-lineage-only.v1'
       assert len([p for p in root.rglob('*') if p.is_file()])==341
       for name,item in pkt['modified'].items():
        f=root/name
        assert f.is_file() and digest(f.read_bytes())==item['before_sha']
        data=base64.b64decode(item['content_base64'],validate=True)
        assert digest(data)==item['after_sha']
        f.write_bytes(data)
       for name,item in pkt['added'].items():
        f=root/name
        assert not f.exists()
        f.parent.mkdir(parents=True,exist_ok=True)
        data=base64.b64decode(item['content_base64'],validate=True)
        assert digest(data)==item['after_sha']
        f.write_bytes(data)
       manifest={p.relative_to(root).as_posix():digest(p.read_bytes())
        for p in root.rglob('*') if p.is_file()
        and p.name!='source_manifest.json'}
       m=root/'source_manifest.json'
       m.write_text(json.dumps(manifest,indent=2,sort_keys=True,
         ensure_ascii=False)+'\n')
       files=sorted(p for p in root.rglob('*') if p.is_file())
       assert len(files)==345
       names=[p.relative_to(root).as_posix() for p in files]
       checks={n:digest(f.read_bytes()) for n,f in zip(names,files)}
       tree=''.join(n+'\t'+checks[n]+'\n' for n in names).encode()
       assert digest(tree)==pkt['tree_sha']
       assert digest((root/'source_manifest.json').read_bytes())==(
        pkt['manifest_sha'])
       (pathlib.Path('R740Artifacts')/'SOURCE_HASHES.json').write_text(
        json.dumps(checks,indent=2,sort_keys=True)+'\n')
       print('R740_345_FILES_SHA_PASS_NO_DELETION')
       PYTHON
    - name: Swift tests iPhoneOS compile and independent source archive
      shell: bash
      run: |
       set -euo pipefail
       (cd source/R720_PORTABLE_TESTS && swift test -j 2) \
        > R740Artifacts/SwiftTests.log 2>&1 || {
         tail -n 100 R740Artifacts/SwiftTests.log;exit 1;
        }
       grep -Fq 'Executed 197 tests, with 0 failures' \
        R740Artifacts/SwiftTests.log
       swiftc -frontend -parse source/app/ios/ChampionsOnDevice/*.swift
       python3 source/tools/generate_xcode_project.py
       xcodebuild -project source/app/ios/ChampionsOnDeviceResearch.xcodeproj \
        -scheme ChampionsOnDeviceResearch -configuration Debug \
        -sdk iphoneos -destination 'generic/platform=iOS' \
        ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
        -derivedDataPath "$RUNNER_TEMP/r740-app" build \
        > R740Artifacts/iPhoneOS.log 2>&1 || {
         grep -E 'error:|BUILD FAILED' R740Artifacts/iPhoneOS.log || true
         exit 1;
        }
       grep -Fq 'BUILD SUCCEEDED' R740Artifacts/iPhoneOS.log
       python3 - <<'PYTHON'
       import hashlib,json,os,pathlib,plistlib,zipfile
       root=pathlib.Path('source');out=pathlib.Path('R740Artifacts')
       sha=json.loads((out/'SOURCE_HASHES.json').read_text())
       assert len(sha)==345
       for name,digest in sha.items():
        assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest
       archive=out/'R740_ALL_EDITABLE_SOURCE_RECOVERY.zip'
       with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED) as z:
        for name in sorted(sha):z.write(root/name,name)
       with zipfile.ZipFile(archive) as z:
        assert z.testzip() is None and len(z.namelist())==345
        for name,digest in sha.items():
         assert hashlib.sha256(z.read(name)).hexdigest()==digest
       derived=pathlib.Path(os.environ['RUNNER_TEMP']) / \
        'r740-app/Build/Products/Debug-iphoneos'
       app=derived/'ChampionsOnDeviceResearch.app'
       assert (app/'ChampionsOnDeviceResearch').is_file()
       info=plistlib.loads((app/'Info.plist').read_bytes())
       assert info['CFBundleVersion']=='740'
       assert info['CFBundleShortVersionString']=='0.7.40'
       ipa=out/'R740_Unsigned_Research.ipa'
       with zipfile.ZipFile(ipa,'w',zipfile.ZIP_DEFLATED) as z:
        for f in sorted(app.rglob('*')):
         assert not f.is_symlink()
         if f.is_file():
          z.write(f,'Payload/'+app.name+'/'+f.relative_to(app).as_posix())
       with zipfile.ZipFile(ipa) as z:assert z.testzip() is None
       assert ipa.stat().st_size<16_000_000
       (out/'CERTIFICATION.txt').write_text(
        'R740 CI only. OCR speed and 79 fields not device certified.\n')
       print('R740_FULL_IPHONEOS_COMPILE_PASS_NOT_DEVICE_CERTIFIED')
       PYTHON
    - name: Bound public-only artifact budget
      shell: bash
      run: |
       python3 - <<'PYTHON'
       import pathlib
       root=pathlib.Path('R740Artifacts')
       size=sum(p.stat().st_size for p in root.rglob('*') if p.is_file())
       assert size<16_000_000,('ARTIFACT_SIZE_HOLD',size)
       print('R740_PUBLIC_ARTIFACT_BUDGET_PASS',size)
       PYTHON
    - name: Upload unsigned IPA and complete source
      uses: actions/upload-artifact@v4
      with:
        name: R740-independent-keyed-ocr-bridge
        path: R740Artifacts/
        retention-days: 3
        if-no-files-found: error
