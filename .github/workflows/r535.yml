                  addition = """# R535 secure one-tap full evidence integration.
          r535_payload=PAYLOAD_TOKEN
          r535_patch=lzma.decompress(base64.b85decode(''.join(r535_payload.split())))
          assert hashlib.sha256(r535_patch).hexdigest()==PATCH_SHA_TOKEN,'R535_PATCH_SHA_CHANGED'
          assert len(list(files.glob('*.swift')))==83,'R535_EXPECTED_83_PREVIOUS_SOURCE_FILES'
          r535_file=Path('r535_one_file.patch')
          r535_file.write_bytes(r535_patch)
          subprocess.run(['git','apply','--check',str(r535_file.resolve())],cwd='ios',check=True)
          subprocess.run(['git','apply',str(r535_file.resolve())],cwd='ios',check=True)
          for name,digest in HASHES_TOKEN.items():
              assert hashlib.sha256((files/name).read_bytes()).hexdigest()==digest,'R535_FILE_SHA_MISMATCH_'+name
          assert len(list(files.glob('*.swift')))==85,'R535_EXPECTED_85_SOURCE_FILES'
          print('PASS_R535_ONE_FILE_EVIDENCE_85_EXACT_SOURCES',flush=True)
          """
                  import json
                  knownHashes={'CaptureCoordinator.swift': '4a155c3b9ffb2136ed6f5b5457a35bc5ddf5b21b8134b9819187de16e3ebfc8d', 'ChampionsOnDeviceApp.swift': 'eae46e90af29e37d787e86661e20bd24b5e1b43fb0af619b7693eb5b6b4e16d6', 'R535UnifiedEvidenceGate.swift': 'e74d2f0e453e2cc9f9cebd17530be4c8075cc7e0f604d99084ec335cb922486e', 'R535EvidenceShareView.swift': '585888a9507f43f5a8d5422c797fc73f07a0aed032e94f4be9d83f6befd454ab'}
                  addition=addition.replace('PAYLOAD_TOKEN',repr(payload)).replace('PATCH_SHA_TOKEN',repr(hashlib.sha256(patch).hexdigest())).replace('HASHES_TOKEN',repr(knownHashes))
                  anchor="swift=sorted(files.glob('*.swift'))"
                  assert code.count(anchor)==1
                  code=code.replace(anchor,addition+'\n'+anchor,1)
                  assert code.count("assert len(swift)==83,'R534_SWIFT_COUNT'")==1
                  code=code.replace("assert len(swift)==83,'R534_SWIFT_COUNT'","assert len(swift)==85,'R535_SWIFT_COUNT'",1)
                  assert code.count("'ios_build_certified':False")==1
                  code=code.replace("'ios_build_certified':False","'r535_patch_sha256':"+repr(hashlib.sha256(patch).hexdigest())+",'one_file_evidence_output_implemented':True,'ios_build_certified':False",1)
                  code=code.replace('R534','R535').replace('r27534','r27535').replace("'534'","'535'").replace("'0.5.34'","'0.5.35'")
                  assert hashlib.sha256(code.encode()).hexdigest()==finalSHA,'R535_BUILD_PATCH_NOT_EXACT'
                  applied[0]+=1
              return original(code,filename,mode,*args,**kwargs)
          builtins.compile=compile_with_r535
          try:
              exec(original(runner,'R534_PINNED_WRAPPER','exec'))
          finally:
              builtins.compile=original
          assert applied[0]==1,'R535_BUILD_PATCH_NEVER_APPLIED'
