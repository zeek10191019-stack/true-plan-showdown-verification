name: R1029 C30 paired R714 transfer prototype (NO IPA)
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/r1029-c30-transfer.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c30-transfer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-receiver:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Verify Windows receiver and C27 recovery regression
        shell: pwsh
        run: |
          @'
          import base64,hashlib,io,json,pathlib,zipfile
          raw=base64.b64decode("",validate=True)
          assert hashlib.sha256(raw).hexdigest()=="724959023b25edc236861a4a53ac251491538c0af371553ab2b3a9c20e2a7be8"
          root=pathlib.Path('c30');root.mkdir(exist_ok=False)
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None
              m=json.loads(z.read('SHA256_MANIFEST.json'))
              assert set(z.namelist())==set(m)|{'SHA256_MANIFEST.json'}
              for name,digest in m.items():
                  assert pathlib.PurePosixPath(name).name==name
                  data=z.read(name);assert hashlib.sha256(data).hexdigest()==digest
                  (root/name).write_bytes(data)
          print('C30_EXACT_SOURCE_BUNDLE_PASS',len(m))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'C30_EXTRACT_FAILED' }
          Set-Location c30
          python -m unittest -v test_transfer_receiver test_recover_r714 test_resume_r714
          if ($LASTEXITCODE -ne 0) { throw 'C30_WINDOWS_TEST_FAILED' }
          python large_resume_test.py
          if ($LASTEXITCODE -ne 0) { throw 'C30_LARGE_RECOVERY_FAILED' }
          python -m py_compile transfer_launcher.py transfer_receiver.py
          if ($LASTEXITCODE -ne 0) { throw 'C30_LAUNCHER_FAILED' }
          Write-Output 'C30_WINDOWS_RECEIVER_PASS_NOT_PHYSICAL_NOT_IPA'
  macos-sender:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Verify Swift sender, real HTTP transfer and iPhoneOS compile of unregistered transport module
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_EXTRACT'
          import base64,hashlib,io,json,pathlib,zipfile
          raw=base64.b64decode("",validate=True)
          assert hashlib.sha256(raw).hexdigest()=="724959023b25edc236861a4a53ac251491538c0af371553ab2b3a9c20e2a7be8"
          root=pathlib.Path('c30');root.mkdir(exist_ok=False)
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None
              m=json.loads(z.read('SHA256_MANIFEST.json'))
              assert set(z.namelist())==set(m)|{'SHA256_MANIFEST.json'}
              for name,digest in m.items():
                  assert pathlib.PurePosixPath(name).name==name
                  data=z.read(name);assert hashlib.sha256(data).hexdigest()==digest
                  (root/name).write_bytes(data)
          print('C30_EXACT_SOURCE_BUNDLE_PASS',len(m))
          PY_EXTRACT
          cd c30
          swiftc -swift-version 6 R1029TransferClient.swift transfer_probe.swift -o transfer_probe
          python3 swift_http_e2e.py ./transfer_probe --bytes 530733825
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos swiftc -swift-version 6 -typecheck -target arm64-apple-ios18.0 -sdk "$SDK" R1029TransferClient.swift
          echo 'C30_IPHONEOS_TRANSPORT_MODULE_TYPECHECK_PASS_NOT_PRODUCT_BUILD_NOT_DEVICE_NOT_IPA'
