name: R1064 C64 exact lineage final native build and Vision revisions (NO IPA)
'on':
  push:
    branches: [main]
    paths:
    - .github/workflows/c64.yml
    - .github/workflows/c64.ymL
    - .github/workflows/c64.yMl
    - .github/workflows/c64.yML
    - .github/workflows/c64.Yml
    - .github/workflows/c64.YmL
    - .github/workflows/c64.YMl
    - .github/workflows/c64.YML
    - .github/workflows/C64.yml
    - .github/workflows/C64.ymL
    - .github/workflows/C64.yMl
    - .github/workflows/C64.yML
    - .github/workflows/C64.Yml
    - .github/workflows/C64.YmL
    - .github/workflows/C64.YMl
    - .github/workflows/C64.YML
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: r1064-c64-portable-${{ github.repository }}
  cancel-in-progress: false
jobs:
  portable:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    name: exact-portable (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, xcode-27]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      C33_JOB: macos-source
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
      C61_LANE: ${{ matrix.os }}
    steps:
    - name: Recover exact pinned C60 diagnostic steps and candidate audit code
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 - <<'C61_PY'
        import pathlib,os,zlib,base64,hashlib
        root=pathlib.Path(os.environ['RUNNER_TEMP'])/'c61-code';root.mkdir(exist_ok=False)
        payload={'c61_patch.py': ('', '91cc8dec158a8cb270c1689146bb965d2a9545e38a18673cc436a3ba1af08069'), 'c61_suite_audit.py': ('', '1eb0befebba79999e67812f38f9f99316ab1ceb08321d488dab8ad7be209049a'), 'pinned_c60_steps.py': ('', 'f6a62865929085e325b75f35c00e468978aa4fd582282c65b2cdc809e9fda64e'), 'c62_isolate.py': ('', 'ff5248e29fd2d6eeb59119a9f7940fc906e8a1d3c24863960b1862d8218ef90b'), 'C62ExplicitVisionProbe.swift': ('', 'cb01a3ad4d86b1b9d96e33bc25aff2dc0f328e632f1e9ed2b10d45599eb964ac'), 'c62_vision_audit.py': ('', '866c04a25482d498d843367c0c30588cd43eb54ff14346c5e2331589c36f18fd'), 'c63_xcodebuild.py': ('', '4d4f5df42188da632b8146dc9078a869d62c8650d39a2ee40676df864c1e942a'), 'c63_strict_suite.py': ('', 'fa930980207f446bd8bc72f1273bd1ccca32ff45ddd7bfcc42ad8d5c68d92337'), 'verify_r893_fixtures.py': ('', '34385a265936e1128436115e312367ccdc225bc9725e49cd12b71522ac66a8e1'), 'C64RevisionVisionProbe.swift': ('', '5f100bcc0e400241682d873bf7a4bf974e791840192005dadd4ae1b3b8232b56'), 'c64_revision_audit.py': ('', 'ad6b975bbfc65213df67030a74c24d3afc4af0bb8f4ef53fee77a20b3db02037'), 'c63_lineage.py': ('', '1939ec65bb622893ea3f004fd49728d352cea5f1c8b02aed1ae365afba39eab6')}
        for name,(packed,digest) in payload.items():
            assert pathlib.PurePosixPath(name).name==name
            raw=zlib.decompress(base64.b64decode(packed,validate=True));assert hashlib.sha256(raw).hexdigest()==digest
            (root/name).write_bytes(raw)
        C61_PY
        python3 "$RUNNER_TEMP/c61-code/pinned_c60_steps.py"
        bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/c61-pinned/prepare.sh"
    - name: Restore and verify native prerequisite without miscertifying macOS 26
      shell: bash
      run: |
        set -Eeuo pipefail
        log="$RUNNER_TEMP/c61-bootstrap.log"
        mkdir "$RUNNER_TEMP/c63-bin"
        cp "$RUNNER_TEMP/c61-code/c63_xcodebuild.py" "$RUNNER_TEMP/c63-bin/xcodebuild"
        chmod 700 "$RUNNER_TEMP/c63-bin/xcodebuild"
        export PATH="$RUNNER_TEMP/c63-bin:$PATH"
        set +e
        bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/c61-pinned/bootstrap.sh" 2>&1 | tee "$log"
        status=("${PIPESTATUS[@]}")
        set -e
        [[ "${status[1]}" == 0 ]]
        if [[ "$C61_LANE" == macos-26 ]]; then
          if [[ "${status[0]}" != 0 ]]; then
            grep -Fx 'C12_XCODE27_REQUIRED' "$log"
            grep -Fx 'C6_R999_PINNED_SOURCE_RESTORED_NOT_PRODUCT_RELEASE' "$log"
            grep -Fx 'C33_STEP_PASS macos-source 6' "$log"
            ! grep -Fx 'C33_STEP_PASS macos-source 7' "$log"
            echo C61_NATIVE_BUILD_BLOCKED_XCODE27_REQUIRED_PORTABLE_DIAGNOSTIC_ONLY
          else
            echo C61_BOOTSTRAP_PASS_PORTABLE_DIAGNOSTIC_ONLY
          fi
        else
          [[ "${status[0]}" == 0 ]]
          test -s "$RUNNER_TEMP/c63-native-build-routing.json"
          grep -Fx 'C11_NATIVE_IPHONEOS_ARM64_BUILD_PASS_NOT_DEVICE_TEST_NO_IPA' "$log"
          echo C63_PINNED_NATIVE_COMPILE_ROUTED_AND_PASSED
        fi
        test -s "$RUNNER_TEMP/c6-objects/pinned-r793/source/source_manifest.json"
    - name: Apply exact C59 PNG source overlay without changing products further
      shell: bash
      run: |
        set -Eeuo pipefail
        bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/c61-pinned/overlay.sh"
    - name: C56 independent Vision capability diagnosis retained
      shell: bash
      run: |
        set -Eeuo pipefail
        bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/c61-pinned/vision.sh"
    - name: Inventory original native tree and isolate only SHA-verified registered files
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 "$RUNNER_TEMP/c61-code/c62_isolate.py" "$RUNNER_TEMP/c6-objects/pinned-r793/source" "$RUNNER_TEMP/c62-portable-source" "$RUNNER_TEMP/c62-tree-receipt.json"
    - name: Verify exact C63 pre-test source lineage against both independent pins
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 "$RUNNER_TEMP/c61-code/c63_lineage.py" "$RUNNER_TEMP/c6-objects/pinned-r793/source" "$C61_LANE"
    - name: Apply unchanged C61 test-only candidate to entire isolated verified source tree
      id: candidate
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 "$RUNNER_TEMP/c61-code/c61_patch.py" "$RUNNER_TEMP/c62-portable-source"
    - name: Recover exact R893 real image fixtures and require original SHA-256
      id: fixtures
      shell: bash
      run: |
        set -Eeuo pipefail
        fixtures="$RUNNER_TEMP/r893_public_status"
        mkdir "$fixtures"
        curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 3 --max-time 45 --max-filesize 30000000 'https://pbs.twimg.com/media/HEQyVGJbQAAZCr1?format=jpg&name=large' -o "$fixtures/corviknight.jpg"
        curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 3 --max-time 45 --max-filesize 30000000 'https://cdn-ak.f.st-hatena.com/images/fotolife/m/mnk-udn-2005/20260418/20260418010155.jpg' -o "$fixtures/slowking.jpg"
        curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 3 --max-time 45 --max-filesize 30000000 'https://assets.games.gg/champions_review_incredible_battles_2ae9e1a5fa.webp' -o "$fixtures/whimsicott.webp"
        python3 "$RUNNER_TEMP/c61-code/verify_r893_fixtures.py" "$fixtures"
        echo "TRUEPLAN_R893_STATUS_FIXTURES=$fixtures" >> "$GITHUB_ENV"
    - name: Execute exact full portable XCTest suite with zero skips required
      if: "!cancelled() && steps.candidate.outcome == 'success'"
      shell: bash
      run: |
        set -Eeuo pipefail
        package="$RUNNER_TEMP/c62-portable-source/R720_PORTABLE_TESTS"
        log="$RUNNER_TEMP/c61-portable.log"
        set +e
        swift test --package-path "$package" --scratch-path "$RUNNER_TEMP/c61-swift-build" 2>&1 | tee "$log"
        status=("${PIPESTATUS[@]}")
        set -e
        [[ "${status[1]}" == 0 ]]
        python3 "$RUNNER_TEMP/c61-code/c63_strict_suite.py" "$log" "${status[0]}" "$RUNNER_TEMP/r893_public_status"
    - name: Independently diagnose explicit Vision CPU and software-context modes
      if: '!cancelled()'
      shell: bash
      run: |
        set -Eeuo pipefail
        swiftc -framework Vision -framework CoreML -framework CoreImage -framework CoreGraphics -framework CoreText "$RUNNER_TEMP/c61-code/C62ExplicitVisionProbe.swift" -o "$RUNNER_TEMP/c62-vision-probe"
        "$RUNNER_TEMP/c62-vision-probe" | tee "$RUNNER_TEMP/c62-explicit-vision.log"
        python3 "$RUNNER_TEMP/c61-code/c62_vision_audit.py" "$RUNNER_TEMP/c62-explicit-vision.log"
    - name: Diagnose every supported Vision revision without altering the product or tests
      if: '!cancelled()'
      shell: bash
      run: |
        set -Eeuo pipefail
        swiftc -framework Vision -framework CoreML -framework CoreImage -framework CoreGraphics -framework CoreText "$RUNNER_TEMP/c61-code/C64RevisionVisionProbe.swift" -o "$RUNNER_TEMP/c64-revision-probe"
        "$RUNNER_TEMP/c64-revision-probe" | tee "$RUNNER_TEMP/c64-revision-vision.log"
        python3 "$RUNNER_TEMP/c61-code/c64_revision_audit.py" "$RUNNER_TEMP/c64-revision-vision.log"
    - name: Compile final exact C59-overlay iPhoneOS sources without signing or exporting
      if: "!cancelled() && matrix.os == 'xcode-27'"
      shell: bash
      run: |
        set -Eeuo pipefail
        root="$RUNNER_TEMP/c6-objects/pinned-r793/source"
        python3 "$RUNNER_TEMP/c61-code/c63_lineage.py" "$root" "$C61_LANE"
        dest="$RUNNER_TEMP/c64-final-native"
        mkdir "$dest"
        /usr/bin/xcodebuild -project "$root/app/ios/ChampionsOnDeviceResearch.xcodeproj" -target ChampionsOnDeviceResearch -configuration Debug -sdk iphoneos -arch arm64 CODE_SIGNING_ALLOWED=NO SYMROOT="$dest/products" OBJROOT="$dest/intermediates" DSTROOT="$dest/install" SHARED_PRECOMPS_DIR="$dest/precompiled" build > "$dest/build.log" 2>&1 || { grep -E 'error:|BUILD FAILED' "$dest/build.log" | tail -n 65 || true; exit 1; }
        grep -Fq '** BUILD SUCCEEDED **' "$dest/build.log"
        python3 "$RUNNER_TEMP/c61-code/c63_lineage.py" "$root" "$C61_LANE"
        echo C64_FINAL_OVERLAY_IPHONEOS_ARM64_COMPILE_PASS_NOT_DEVICE_NOT_IPA
    - name: Retain original native-tree integrity gate independently of portable execution
      if: '!cancelled()'
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 - "$RUNNER_TEMP/c62-tree-receipt.json" <<'C62_GATE_PY'
        import pathlib,json,sys
        receipt=json.loads(pathlib.Path(sys.argv[1]).read_text())
        assert receipt['projection_verified'] is True
        assert receipt['physical_certified'] is False and receipt['ipa_authorized'] is False
        assert receipt['full_matrix_certified'] is False and receipt['certified_79_fields']==0
        if not receipt['native_tree_clean']:
            print('C62_NATIVE_TREE_HOLD_UNREGISTERED_OR_CHANGED_SOURCE_OR_BUILD_OUTPUT',flush=True)
            raise SystemExit(1)
        assert not any(receipt['original_diff'].values())
        print('C62_ORIGINAL_TREE_INTEGRITY_PASS_ONLY_NOT_NATIVE_RELEASE')
        C62_GATE_PY
  diagnostic-gate:
    needs: [portable]
    if: always() && github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
    - name: Keep diagnostic separate from full C60 matrix and physical certification
      shell: bash
      run: |
        set -Eeuo pipefail
        [[ '${{ needs.portable.result }}' == success ]]
        echo C64_PORTABLE_792_ZERO_SKIP_LANES_PASS_ONLY_FULL_C60_MATRIX_AND_DEVICE_79_IPA_REMAIN_REQUIRED
