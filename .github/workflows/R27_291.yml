          function ensure(x,code){if(!x)throw Error('R27_288_'+code)}
          function isPairCycle(history, proposed){
           if(!Array.isArray(history)||history.length<3||typeof proposed!=='string'||!/^switch [1-6]$/.test(proposed))return false;
           const x=history.slice(-3);return x.every(t=>/^switch [1-6]$/.test(t)) &&
             x[0]===x[2] && x[1]===proposed && x[0]!==x[1];
          }
          function attackingLegal(obs,legal,publicDex){
           if(obs?.phase!=='move'||!Array.isArray(obs.active)||!obs.active[0]||!Array.isArray(legal))return [];
           return legal.filter(cmd=>{
            const m=cmd.match(/^move (\d+)(?: (?:mega|megax|megay))?$/);if(!m)return false;
            const id=obs.active[0].moves?.[+m[1]-1]?.id;if(!id)return false;
            const meta=readMove(publicDex,id);
            return meta.category!=='Status'&&meta.basePower>0;
           });
          }
          function createAntiSwitchCyclePolicy({tactical,publicDex,telemetry}={}){
           ensure(tactical&&typeof tactical.decide==='function'&&typeof tactical.scorePreview==='function','BASE_INTERFACE');
           ensure(publicDex&&typeof publicDex.getMove==='function','PUBLIC_DEX_REQUIRED');
           const audit=telemetry||{opportunities:0,interventions:0,abstentions:0,forcedSwitchPreserved:0};
           let history=[];
           function decide(obs,legal){
            ensure(obs&&typeof obs==='object'&&Array.isArray(legal)&&legal.length>0,'INPUT_INVALID');
            if(obs.phase==='preview'){history=[];return tactical.decide(obs,legal)}
            if(obs.phase==='switch'){history=[];audit.forcedSwitchPreserved++;return tactical.decide(obs,legal)}
            if(obs.phase!=='move'){return tactical.decide(obs,legal)}
            const base=tactical.decide(obs,legal);
            ensure(legal.includes(base),'BASE_ILLEGAL_ACTION');
