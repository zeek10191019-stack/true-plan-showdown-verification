            check(a&&b&&d,'RECORD_MISSING');
            const ctx=contextByFixtureSide[c.fixture+'|'+c.tacticalSide];check(ctx,'CONTEXT_MISSING');
            const actFull=!!ctx.oldActivated,actGated=!!ctx.gatedActivated;
            if(actFull)data.activation.full++;if(actGated)data.activation.restrained++;
            const fixture=data.byFixture[c.fixture]??={full:{improved:0,worsened:0,unchanged:0,unscored:0},restrained:{improved:0,worsened:0,unchanged:0,unscored:0},baselineTimeouts:0};
            for(const [name,v] of [['full',b],['restrained',d]]){
             const x=point(a.result),y=point(v.result);const rel=x===null||y===null?'unscored':y>x?'improved':y<x?'worsened':'unchanged';
             data[name][rel]++;fixture[name][rel]++;
            }
            if(a.result==='timeout'){data.timeouts.push({id,fixture:c.fixture,opponent:c.opponent,side:c.tacticalSide,seedIndex:c.seedIndex,baseSteps:a.steps,baseTurn:a.turn,fullResult:b.result,restrainedResult:d.result});fixture.baselineTimeouts++}
           }
           check(data.full.improved+data.full.worsened+data.full.unchanged+data.full.unscored===144,'FULL_COUNT');
           check(data.restrained.improved+data.restrained.worsened+data.restrained.unchanged+data.restrained.unscored===144,'GATED_COUNT');
           const baseFull=compare(base,full,plan),baseGate=compare(base,restrained,plan);
           return Object.freeze({...data,summary:{baseline:baseFull.baseline,full:baseFull.candidate,restrained:baseGate.candidate},digest:digest({full:data.full,restrained:data.restrained,activation:data.activation,byFixture:data.byFixture,timeouts:data.timeouts})});
          }
          function extension(records){check(Array.isArray(records),'EXTENSION_INPUT');const result={attempted:records.length,ended:0,stillTimeout:0,resolvedWins:0,resolvedLosses:0,draws:0,details:[]};
           for(const x of records){check(x.originalResult==='timeout','NOT_ORIGINAL_TIMEOUT');check(['win','loss','draw','timeout'].includes(x.extendedResult),'UNKNOWN_EXTENDED_RESULT');
            if(x.extendedResult==='timeout')result.stillTimeout++;else{result.ended++;if(x.extendedResult==='win')result.resolvedWins++;if(x.extendedResult==='loss')result.resolvedLosses++;if(x.extendedResult==='draw')result.draws++}
            result.details.push(Object.freeze({...x}));}
           return Object.freeze(result);
          }
          module.exports={diagnostic,extension};
