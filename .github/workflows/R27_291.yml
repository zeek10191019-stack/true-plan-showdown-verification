          /** Post-reveal I/J development diagnostic; never independent holdout. */
          const {key,point,compare}=require('./sealed_evaluation.cjs');
          const {digest}=require('./paired_benchmark.cjs');
          function check(x,label){if(!x)throw Error('R27_284_'+label)}
          function diagnostic(plan,base,full,restrained,contextByFixtureSide){
           check(Array.isArray(plan)&&plan.length===144&&base.length===144&&full.length===144&&restrained.length===144,'BAD_RECORDS');
           const data={full:{improved:0,worsened:0,unchanged:0,unscored:0},restrained:{improved:0,worsened:0,unchanged:0,unscored:0},activation:{full:0,restrained:0},byFixture:{},timeouts:[]};
