          function ranks(scores){guard(Array.isArray(scores)&&scores.length===6&&scores.every(Number.isFinite),'INVALID_PREVIEW_SCORES');return [0,1,2,3,4,5].sort((a,b)=>scores[b]-scores[a]||a-b).slice(0,3)}
          function stats(obs,indices,publicDex){
           guard(obs?.phase==='preview'&&Array.isArray(obs.own)&&obs.own.length===6,'PREVIEW_REQUIRED');
           guard(Array.isArray(indices)&&indices.length===3&&new Set(indices).size===3&&indices.every(i=>Number.isInteger(i)&&i>=0&&i<6),'TRIO_INVALID');
           const selected=indices.map(i=>obs.own[i]);
           const species=selected.map(x=>readSpecies(publicDex,String(x.details||'').split(',')[0].trim()));
           let sharedWeakness=0, typeImmunities=0;
           for(const attacking of ATTACK_TYPES){
            let vulnerable=0;
            for(const mon of species){if(effectiveness(publicDex,attacking,mon.types)>=2)vulnerable++}
            sharedWeakness+=Math.max(0,vulnerable-1);
            if(species.some(mon=>effectiveness(publicDex,attacking,mon.types)===0))typeImmunities++;
           }
           const coverage=new Set();
           for(const mon of selected)for(const id of (mon.moves||[])){
            const m=readMove(publicDex,id);if(m.basePower>0)coverage.add(m.type);
