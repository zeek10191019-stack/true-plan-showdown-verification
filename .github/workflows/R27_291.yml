      - name: R27.269 paired mirrored policy H2H benchmark (48 games)
        shell: bash
        working-directory: pokemon-showdown
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'aa17ca0fac8bc5605df673bd8774c2d0e91efa43'
          test "$(node -v)" = 'v22.18.0'
          cat > paired_benchmark.cjs <<'R27_269_FILE_0_EOF'
          'use strict';
          /**
           * R27.269 controlled mirror-roster, paired-side Showdown policy comparison.
           * Pure orchestration with injected battle/step; no access to private AI weights.
           * A run is evidence only when executed against pinned public Showdown.
           */
          const crypto=require('node:crypto');
          const VERSION='r27.269.paired-h2h.v1';
          const digest=x=>crypto.createHash('sha256').update(JSON.stringify(x)).digest('hex');
          const freezeValue=x=>Object.freeze(x);
          function assert(condition,code){if(!condition)throw Error(`R27_269_${code}`)}
          function deterministicSeed(fixture,index){
            assert(typeof fixture==='string'&&fixture.length>0&&Number.isInteger(index)&&index>=0&&index<100000,'BAD_SEED_KEY');
            const d=crypto.createHash('sha256').update(`${VERSION}|${fixture}|${index}`).digest();
            return [0,2,4,6].map(i=>d.readUInt16BE(i));
          }
          function schedule({fixtures,seedCount=8}){
            assert(Array.isArray(fixtures)&&fixtures.length>=1&&fixtures.length<=8&&fixtures.every(x=>typeof x==='string'&&x.length>0)&&new Set(fixtures).size===fixtures.length,'BAD_FIXTURES');
            assert(Number.isInteger(seedCount)&&seedCount>=2&&seedCount<=64,'BAD_SEED_COUNT');
            const result=[];
            for(const fixture of fixtures)for(let i=0;i<seedCount;i++){
              const seed=deterministicSeed(fixture,i);
              for(const tacticalSide of [0,1])result.push(freezeValue({fixture,seedIndex:i,seed:freezeValue([...seed]),tacticalSide}));
            }
            assert(result.length===fixtures.length*seedCount*2,'PAIRING_INCOMPLETE');
            return freezeValue(result);
          }
          function wilson(successes,n,z=1.959963984540054){
            if(n===0)return null;
            assert(Number.isInteger(successes)&&Number.isInteger(n)&&n>0&&successes>=0&&successes<=n,'BAD_WILSON');
            const p=successes/n,k=z*z,denom=1+k/n;
            const ctr=(p+k/(2*n))/denom;
            const half=z*Math.sqrt((p*(1-p)+k/(4*n))/n)/denom;
            return [Math.max(0,ctr-half),Math.min(1,ctr+half)];
          }
          function analyze(records,fixtureNames,seedCount){
            const completed=records.filter(r=>r.result!=='timeout');
            const wins=records.filter(r=>r.result==='win').length,losses=records.filter(r=>r.result==='loss').length,draws=records.filter(r=>r.result==='draw').length,timeouts=records.filter(r=>r.result==='timeout').length;
            assert(records.length===fixtureNames.length*seedCount*2,'BAD_RESULT_COUNT');
            const pairs=[];
            for(const fixture of fixtureNames)for(let i=0;i<seedCount;i++){
              const found=records.filter(x=>x.fixture===fixture&&x.seedIndex===i);
              assert(found.length===2&&found.some(x=>x.tacticalSide===0)&&found.some(x=>x.tacticalSide===1),'MISSING_PAIRED_SIDE');
              const score=found.map(x=>x.result==='win'?1:x.result==='loss'?0:x.result==='draw'?0.5:null);
              pairs.push({fixture,seedIndex:i,tacticalMatchPoints:score.includes(null)?null:score[0]+score[1],results:found.map(x=>x.result)});
            }
            const decisive=wins+losses;
            const aggregate={matches:records.length,completed:completed.length,wins,losses,draws,timeouts,
              tacticalScorePerScheduled:(wins+draws*.5)/records.length,
              tacticalScorePerCompleted:completed.length?(wins+draws*.5)/completed.length:null,
              decisiveWinRate:decisive?wins/decisive:null,
              decisiveWinWilson95:wilson(wins,decisive),
              meanPairedNet:pairs.every(p=>p.tacticalMatchPoints!==null)?pairs.reduce((s,p)=>s+(p.tacticalMatchPoints-1),0)/pairs.length:null,
              pairedSeeds:pairs.length,configDigest:digest({fixtureNames,seedCount,version:VERSION})};
            return {aggregate,pairs};
          }
          function runOne(config,{makeBattle,step,makePublicProvider,controllers,maxSteps=80}){
            assert(config&&[0,1].includes(config.tacticalSide),'BAD_CONFIG');
            assert(typeof makeBattle==='function'&&typeof step==='function'&&typeof makePublicProvider==='function'&&controllers?.tactical&&controllers?.baseline,'BAD_DEPENDENCY');
            assert(Number.isInteger(maxSteps)&&maxSteps>=4&&maxSteps<=400,'BAD_MAX_STEPS');
            let battle,commands=[],stepCount=0;
            try{
              battle=makeBattle(config);
              assert(battle&&typeof battle.destroy==='function'&&typeof battle.ended==='boolean','BAD_BATTLE');
              while(!battle.ended&&stepCount<maxSteps){
                const cs=config.tacticalSide===0?{p1:controllers.tactical,p2:controllers.baseline}:{p1:controllers.baseline,p2:controllers.tactical};
                const r=step(battle,cs,makePublicProvider(battle));
                assert(r&&Array.isArray(r.choices)&&r.choices.length===2&&r.choices.every(x=>typeof x==='string'),'BAD_STEP_OUTPUT');
                commands.push({phase:r.phase,actions:r.choices});
                stepCount++;
              }
              const sideName='Tactical'; // battle p1/p2 names change with tacticalSide in makeBattle
              const result=!battle.ended?'timeout':!battle.winner?'draw':battle.winner===sideName?'win':
                battle.winner==='Tactical'||battle.winner==='Baseline'?'loss':null;
              assert(result!==null,'UNEXPECTED_WINNER');
              return freezeValue({...config,result,steps:stepCount,turn:Number.isFinite(battle.turn)?battle.turn:null,
                actionsDigest:digest(commands),tacticalActions:commands.map(c=>c.actions[config.tacticalSide]),
                baselineActions:commands.map(c=>c.actions[1-config.tacticalSide])});
            } finally{if(battle)battle.destroy()}
          }
          function benchmark({fixtures,seedCount=8,maxSteps=80,...deps}){
            const plan=schedule({fixtures,seedCount});
            const results=plan.map(c=>runOne(c,{...deps,maxSteps}));
            return {version:VERSION,scope:'pinned_public_showdown_small_mirror_roster_baseline_comparison',
              metadata:{fixtures:[...fixtures],seedCount,maxSteps,perFixtureSeeds:seedCount,sideSwaps:true,
                noEarlyStop:true,seedDerivation:'sha256_first4_uint16',total:plan.length},
              ...analyze(results,fixtures,seedCount),records:results.map(x=>({...x,tacticalActions:undefined,baselineActions:undefined}))};
          }
          module.exports={VERSION,deterministicSeed,schedule,runOne,benchmark,analyze,wilson,digest};
          R27_269_FILE_0_EOF
          cat > test_paired_benchmark.cjs <<'R27_269_FILE_1_EOF'
          'use strict';
          const assert=require('node:assert/strict');
          const x=require('./paired_benchmark.cjs');
          let pass=0;function test(name,fn){try{fn();pass++;console.log('R27_269_UNIT '+JSON.stringify({name,status:'PASS'}));}catch(e){console.error('R27_269_UNIT '+JSON.stringify({name,status:'FAIL',error:String(e.stack||e)}));process.exitCode=1}}
          const fixture='mirror-a';
          test('pair plan 2 sides per seed',()=>{const plan=x.schedule({fixtures:[fixture],seedCount:4});assert.equal(plan.length,8);for(let i=0;i<8;i+=2){assert.equal(plan[i].tacticalSide,0);assert.equal(plan[i+1].tacticalSide,1);assert.deepEqual(plan[i].seed,plan[i+1].seed)}});
          test('seed deterministic repeatable',()=>assert.deepEqual(x.deterministicSeed(fixture,3),x.deterministicSeed(fixture,3)));
          test('different seed index',()=>assert.notDeepEqual(x.deterministicSeed(fixture,3),x.deterministicSeed(fixture,4)));
          test('different fixture produces different seed',()=>assert.notDeepEqual(x.deterministicSeed(fixture,3),x.deterministicSeed('mirror-b',3)));
          test('seed uint16 bounds',()=>x.schedule({fixtures:[fixture],seedCount:5}).forEach(c=>c.seed.forEach(n=>assert(n>=0&&n<=65535))));
          test('duplicated fixture fails',()=>assert.throws(()=>x.schedule({fixtures:[fixture,fixture]}),/BAD_FIXTURES/));
          test('invalid count fails',()=>assert.throws(()=>x.schedule({fixtures:[fixture],seedCount:0}),/BAD_SEED_COUNT/));
          test('nil confidence interval when zero decisive',()=>assert.equal(x.wilson(0,0),null));
          test('wilson full success confidence limited',()=>{const r=x.wilson(10,10);assert(r[0]>0&&r[0]<1&&r[1]<=1)});
          test('wilson mixed contains sample p',()=>{const a=x.wilson(6,10);assert(a[0]<0.6&&a[1]>0.6)});
          const c={fixture,seedIndex:0,seed:[1,2,3,4],tacticalSide:0};
          const fake=(outcome)=>({makeBattle(config){return {winner:'',ended:false,turn:0,destroy(){this.destroyed=true},_config:config,log:[],outcome}},step(b){b.turn++;b.ended=true;b.winner=b.outcome==='draw'?'':b.outcome==='win'?'Tactical':'Baseline';return{phase:'move',choices:['move 1','move 2']}},makePublicProvider:()=>()=>({species:null}),controllers:{tactical:{},baseline:{}}});
          test('fake tactical win',()=>{const r=x.runOne(c,fake('win'));assert.equal(r.result,'win');assert.equal(r.steps,1)});
          test('fake tactical loss',()=>assert.equal(x.runOne(c,fake('loss')).result,'loss'));
          test('fake tie',()=>assert.equal(x.runOne(c,fake('draw')).result,'draw'));
          test('fake timeout is not a draw',()=>{const b=fake('draw');b.step=()=>({phase:'move',choices:['move 1','move 2']});const r=x.runOne(c,{...b,maxSteps:4});assert.equal(r.result,'timeout');assert.equal(r.steps,4)});
          test('wrong winner fails closed',()=>{const b=fake('win');b.step=v=>{v.winner='Private';v.ended=true;return {choices:['move 1','move 1']}};assert.throws(()=>x.runOne(c,b),/UNEXPECTED_WINNER/)});
          test('bad step output fails closed',()=>{const b=fake('win');b.step=()=>({choices:['move 1']});assert.throws(()=>x.runOne(c,b),/BAD_STEP_OUTPUT/)});
          test('destroy called on error',()=>{let destroyed=0;const b=fake('win');b.makeBattle=()=>({ended:false,turn:0,destroy(){destroyed++}});b.step=()=>{throw Error('boom')};assert.throws(()=>x.runOne(c,b),/boom/);assert.equal(destroyed,1)});
          test('paired aggregation wins and losses',()=>{const records=[{fixture,seedIndex:0,tacticalSide:0,result:'win'},{fixture,seedIndex:0,tacticalSide:1,result:'loss'},{fixture,seedIndex:1,tacticalSide:0,result:'win'},{fixture,seedIndex:1,tacticalSide:1,result:'win'}];const a=x.analyze(records,[fixture],2);assert.equal(a.aggregate.matches,4);assert.equal(a.aggregate.wins,3);assert.equal(a.aggregate.meanPairedNet,.5)});
          test('timeouts not silently draws',()=>{const rec=[{fixture,seedIndex:0,tacticalSide:0,result:'timeout'},{fixture,seedIndex:0,tacticalSide:1,result:'win'},{fixture,seedIndex:1,tacticalSide:0,result:'draw'},{fixture,seedIndex:1,tacticalSide:1,result:'loss'}];const a=x.analyze(rec,[fixture],2);assert.equal(a.aggregate.timeouts,1);assert.equal(a.aggregate.meanPairedNet,null);assert.equal(a.aggregate.completed,3)});
          test('missing swapped side rejected',()=>{const r=[{fixture,seedIndex:0,tacticalSide:0,result:'win'},{fixture,seedIndex:0,tacticalSide:0,result:'win'},{fixture,seedIndex:1,tacticalSide:0,result:'win'},{fixture,seedIndex:1,tacticalSide:1,result:'win'}];assert.throws(()=>x.analyze(r,[fixture],2),/MISSING_PAIRED_SIDE/)});
          test('benchmark includes complete plan and data',()=>{const d=fake('win');const out=x.benchmark({fixtures:[fixture],seedCount:2,maxSteps:6,...d});assert.equal(out.records.length,4);assert.equal(out.aggregate.wins,4);assert.equal(out.aggregate.pairedSeeds,2);assert.equal(out.metadata.total,4)});
          test('no private opponent fields in recorded row',()=>{const d=fake('win');const out=x.benchmark({fixtures:[fixture],seedCount:2,...d});assert(out.records.every(r=>!Object.hasOwn(r,'opponentMoves')&&!Object.hasOwn(r,'opponentItem')))});
          console.log('R27_269_UNIT_SUMMARY '+JSON.stringify({pass,total:22}));if(pass!==22)process.exitCode=1;
          R27_269_FILE_1_EOF
          cat > test_paired_showdown.cjs <<'R27_269_FILE_2_EOF'
          'use strict';
          /** Pinned Showdown matchup benchmark, two PREDECLARED symmetric demo rosters. */
          const assert=require('node:assert/strict');
          const {Battle,Dex}=require('./dist/sim');
          const {makeController,stepWithControllers}=require('./private_policy_bridge.cjs');
          const {publicFoeBySideFromStreams}=require('./public_protocol_projection.cjs');
          const {createPublicTacticalPolicy,fromShowdownPublicDex}=require('./public_tactical_policy.cjs');
          const {benchmark,digest}=require('./paired_benchmark.cjs');
          const FORMAT='[Gen 9 Champions] BSS Reg M-C';
          const format=Dex.formats.get(FORMAT);
          assert(format.exists&&format.mod==='champions','Champions BSS M-C must be present in pinned public source');
          const evs={hp:0,atk:0,def:0,spa:0,spd:0,spe:0};
          const mon=(species,moves,ability)=>({species,moves,ability,item:'',nature:'Hardy',level:50,evs});
          const rosters=Object.freeze({
            'mirror-alpha':[
              mon('Charizard',['flamethrower','scratch'],'Blaze'),
              mon('Blastoise',['surf','tackle'],'Torrent'),
              mon('Venusaur',['vinewhip','tackle'],'Overgrow'),
              mon('Pikachu',['thunderbolt','quickattack'],'Static'),
              mon('Snorlax',['tackle'],'Immunity'),
              mon('Alakazam',['psychic','recover'],'Synchronize')],
            'mirror-beta':[
              mon('Garchomp',['tackle'],'Rough Skin'),
              mon('Machamp',['karatechop'],'No Guard'),
              mon('Lapras',['surf'],'Water Absorb'),
              mon('Eevee',['tackle','quickattack'],'Run Away'),
              mon('Venusaur',['vinewhip','tackle'],'Overgrow'),
              mon('Charizard',['flamethrower','scratch'],'Blaze')],
          });
          const tactical=makeController({plugin:createPublicTacticalPolicy({publicDex:fromShowdownPublicDex(Dex)})});
          const baseline=makeController({plugin:Object.freeze({id:'first-legal-baseline.v1',scorePreview:()=>[100,90,80,70,60,50],decide:(_obs,legal)=>legal[0]})});
          const allow=/^\|(switch|drag|replace|detailschange|\-formechange|faint)\|/;
          function publicProvider(b){
            // Simulated player-facing ALLOWLIST projection from the engine log;
            // not independently verified public-client provenance.
            const events=b.log.filter(x=>allow.test(x));
            return publicFoeBySideFromStreams({
              p1:{source:'PUBLIC_CLIENT_PROTOCOL',events},
              p2:{source:'PUBLIC_CLIENT_PROTOCOL',events},
            });
          }
          function makeBattle(config){
            const team=rosters[config.fixture];
            assert(Array.isArray(team)&&team.length===6,'Fixture missing');
            const p1=config.tacticalSide===0?'Tactical':'Baseline';
            const p2=config.tacticalSide===1?'Tactical':'Baseline';
            return new Battle({formatid:format.id,strictChoices:true,seed:[...config.seed],
              p1:{name:p1,team},p2:{name:p2,team}});
          }
          function simulate(){
            return benchmark({fixtures:Object.keys(rosters),seedCount:12,maxSteps:96,
              makeBattle,step:stepWithControllers,makePublicProvider:publicProvider,controllers:{tactical,baseline}});
          }
          const a=simulate();
          // The exact same frozen fixtures / seeds must produce identical metrics and traces.
          // Check one deterministic pair to avoid duplicating all tournament compute.
          const {runOne}=require('./paired_benchmark.cjs');
          const first=a.records[0];
          const replay=runOne({fixture:first.fixture,seedIndex:first.seedIndex,seed:first.seed,tacticalSide:first.tacticalSide},
            {makeBattle,step:stepWithControllers,makePublicProvider:publicProvider,controllers:{tactical,baseline},maxSteps:96});
          assert.equal(first.actionsDigest,replay.actionsDigest,'Same seed replay diverged');
          assert.equal(first.result,replay.result,'Same seed outcome diverged');
          const checks={pairSides:a.aggregate.pairedSeeds===24,total:a.aggregate.matches===48,noneAborted:true,
            noEarlyStop:a.metadata.noEarlyStop,traceReplay:true,fixturesFrozen:2};
          assert(Object.values(checks).every(Boolean));
          for(const r of a.records){
            console.log('R27_269_MATCH '+JSON.stringify({fixture:r.fixture,seedIndex:r.seedIndex,tacticalSide:r.tacticalSide,
              seed:r.seed,result:r.result,steps:r.steps,turn:r.turn,actionsDigest:r.actionsDigest}));
          }
          const out={revision:'R27.269',scope:'public pinned Showdown; toy mirrored rosters, first-legal baseline; NOT real Champions or human skill claim',
            githubPin:'aa17ca0fac8bc5605df673bd8774c2d0e91efa43',
            ...a.metadata,aggregate:a.aggregate,checks,resultsDigest:digest(a.records),
            limitations:['tiny hand-picked synthetic rosters','first-legal weak baseline','no real-game data or private-policy weights',
              'opponent public log projection from allowlisted simulator log, not actual client provenance',
