          const VERSION='r27.291.switch-pressure-stress.v1';
          function createPublicSwitchPressurePolicy({tactical}={}){
           if(!tactical||typeof tactical.decide!=='function'||typeof tactical.scorePreview!=='function')throw Error('R27_291_STRESS_TACTICAL_REQUIRED');
           let previous=null;
           function decide(obs,legal){
            if(!obs||!Array.isArray(legal)||!legal.length)throw Error('R27_291_STRESS_REQUEST_INVALID');
            if(obs.phase==='preview'){previous=null;return tactical.decide(obs,legal)}
            if(obs.phase==='wait')return tactical.decide(obs,legal);
            // No special handling of forced switches beyond returning an exact legal action.
            const switchOptions=legal.filter(x=>/^switch [1-6]$/.test(x));
            if(switchOptions.length&&obs.phase==='move'){
             const eligible=switchOptions.filter(x=>x!==previous);
             const choice=(eligible.length?eligible:switchOptions)[0];previous=choice;return choice;
            }
            const out=tactical.decide(obs,legal);
            if(!legal.includes(out))throw Error('R27_291_STRESS_ILLEGAL');
            if(!/^switch [1-6]$/.test(out))previous=null;
            return out;
           }
           return Object.freeze({id:VERSION,scorePreview:obs=>tactical.scorePreview(obs),decide});
          }
          module.exports={VERSION,createPublicSwitchPressurePolicy};
