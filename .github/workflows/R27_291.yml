      - name: R27.271 public heuristic challengers and asymmetric paired H2H (96 games)
        shell: bash
        working-directory: pokemon-showdown
        run: |
          set -euo pipefail
          cat > public_challenger_policy.cjs <<'R27_271_FILE_0_EOF'
          'use strict';
          /** R27.271: non-trivial, public-information-only benchmark opponents.
           * Not trained / not a verified human-strength policy. Competes under identical
           * bridge and legal-action contract with R27.266 tactical heuristic.
           */
          const {UnsupportedState}=require('./battle_api.cjs');
          const {readMove,readSpecies,hpFraction,scoreAttack,effectiveness}=require('./public_tactical_policy.cjs');
          const VERSION='r27.271.public-challengers.v1';
          const STYLES=Object.freeze(['greedy-coverage','defensive-pivot']);
          function ensure(ok,code){if(!ok)throw new UnsupportedState('CHALLENGER_'+code)}
          const nameOf=x=>String(x?.details||'').split(',')[0].trim();
          function coverage(mon,publicDex,foe){
            const species=readSpecies(publicDex,nameOf(mon));
            let best=0;
            for(const id of mon.moves||[]){const m=readMove(publicDex,id);if(m.basePower>0)best=Math.max(best,scoreAttack({monSpecies:species,move:m,foeSpecies:foe,publicDex,ownHp:hpFraction(mon.condition)}));}
            return best;
          }
          function risk(monSpecies,foe,publicDex){
            if(!foe)return 1;
            // Relative defensive prior for known foe types ONLY. Not opponent move prediction.
            return Math.max(...foe.types.map(t=>effectiveness(publicDex,t,monSpecies.types)));
          }
          function createChallengerPolicy({publicDex,style}){
            ensure(STYLES.includes(style),'INVALID_STYLE');
            ensure(publicDex && typeof publicDex.getMove==='function','PUBLIC_DEX_REQUIRED');
            const policy={
              id:`${VERSION}.${style}`,
              scorePreview(obs){
                ensure(obs?.phase==='preview'&&obs.own?.length===6,'PREVIEW_SCHEMA');
                return obs.own.map((mon,i)=>{
                  const spec=readSpecies(publicDex,nameOf(mon));
                  const distinct=new Set((mon.moves||[]).map(k=>readMove(publicDex,k)).filter(m=>m.basePower>0).map(m=>m.type));
                  const h=hpFraction(mon.condition);
                  return (spec.baseStats.atk+spec.baseStats.spa)*.18+spec.baseStats.spe*.22+distinct.size*14+(h??1)*7-i*.001;
                });
              },
              decide(obs,legal){
                ensure(obs && Array.isArray(legal)&&legal.length>0&&legal.length<=36&&new Set(legal).size===legal.length,'ILLEGAL_INPUT');
                if(obs.phase==='preview'||obs.phase==='wait')return legal[0];
                ensure(obs.phase==='move'||obs.phase==='switch','UNSUPPORTED_PHASE');
                const foe=obs.foe?.species?readSpecies(publicDex,obs.foe.species):null;
                const actor=obs.own.find(m=>m.active);
                ensure(actor || obs.phase==='switch','ACTIVE_REQUIRED');
                const actorSpec=actor?readSpecies(publicDex,nameOf(actor)):null;
                const activeHp=actor?hpFraction(actor.condition):null;
                let best=null;
                for(let i=0;i<legal.length;i++){
                  const cmd=legal[i],move=cmd.match(/^move (\d+)(?: (mega|megax|megay))?$/),sw=cmd.match(/^switch (\d+)$/);
                  let v;
                  if(move && obs.phase==='move'){
                    const id=obs.active?.[0]?.moves?.[Number(move[1])-1]?.id;
                    ensure(id,'MOVE_NOT_FOUND');
                    const m=readMove(publicDex,id);
                    v=scoreAttack({monSpecies:actorSpec,move:m,foeSpecies:foe,publicDex,ownHp:activeHp});
                    if(style==='defensive-pivot'){
                      const foeRisk=risk(actorSpec,foe,publicDex);
