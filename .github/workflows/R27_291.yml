          /** R27.280 pure preview rank diagnostics. PUBLIC declared species-only fixture.
           * No battle object, hidden opponent set, trainer metadata, past holdout or outcomes.
           * Research-only scores are NOT game damage and never certify battle strength.
           */
          const {UnsupportedState}=require('./battle_api.cjs');
          const {ranks}=require('./conditional_preview_policy.cjs');
          const {features,SOURCE}=require('./matchup_preview_policy.cjs');
          const {readSpecies}=require('./public_tactical_policy.cjs');
          const VERSION='r27.280.preview-rank-diagnostic.v1';
          const POLICY=Object.freeze({minLead:8,minFloorRatio:0.9,maxAddedSharedWeakness:0});
          function guard(v,tag){if(!v)throw new UnsupportedState('R27_280_'+tag)}
          function allTrios(){const out=[];for(let i=0;i<6;i++)for(let j=i+1;j<6;j++)for(let k=j+1;k<6;k++)out.push(Object.freeze([i,j,k]));return Object.freeze(out)}
          const TRIOS=allTrios();
          function key(indices){return [...indices].sort((a,b)=>a-b).join('');}
          function decisionAudit(obs,tactical,dex){
           guard(obs?.phase==='preview'&&Array.isArray(obs.own)&&obs.own.length===6,'SIX_PREVIEW_REQUIRED');
           guard(obs.foe?.previewSource===SOURCE&&Array.isArray(obs.foe.previewSpecies)&&obs.foe.previewSpecies.length===6,'PUBLIC_DECLARED_FOE_REQUIRED');
           guard(typeof tactical?.scorePreview==='function','TACTICAL_MISSING');
           guard(dex?.getSpecies&&dex?.getMove&&dex?.multiplier,'DEX_MISSING');
           // Check species existence before any scoring (do not silently infer unknown foe types).
           for(const name of obs.foe.previewSpecies)readSpecies(dex,name);
           const scores=tactical.scorePreview(obs);const base=ranks(scores);const baseKey=key(base);
           const rows=TRIOS.map(indices=>{
            const x=features(obs,indices,dex);
            guard(Object.values(x).every(v=>typeof v!=='number'||Number.isFinite(v)),'INVALID_SCORE');
            return Object.freeze({key:key(indices),indices,score:x.score,attackAverage:x.avg,attackFloor:x.floor,defenseRisk:x.risk,offensiveTypes:x.offensiveTypes,sharedWeakness:x.sharedWeakness});
           });
           guard(new Set(rows.map(x=>x.key)).size===20,'NON_UNIQUE_20');
           const ranked=Object.freeze([...rows].sort((a,b)=>b.score-a.score||a.key.localeCompare(b.key)));
           const baseline=rows.find(r=>r.key===baseKey);guard(baseline,'BASE_NOT_RANKED');
           const eligible=ranked.filter(r=>r.score-baseline.score>=POLICY.minLead&&r.attackFloor>=baseline.attackFloor*POLICY.minFloorRatio&&r.sharedWeakness<=baseline.sharedWeakness+POLICY.maxAddedSharedWeakness);
           const elected=eligible.length?eligible[0]:baseline;
           const breakdown=Object.freeze({attackAverageWeight:0.58,attackFloorWeight:0.42,defenseRiskWeight:-12,sharedWeaknessWeight:-2});
           return Object.freeze({version:VERSION,baseline,top:ranked[0],ranked,baselineRank:ranked.findIndex(x=>x.key===baseKey)+1,elected,activated:elected.key!==baseKey,scoreGap:ranked[0].score-baseline.score,eligibilityCount:eligible.length,thresholds:POLICY,breakdown,publicProvenance:SOURCE});
          }
          function selectionScoresFromIndices(indices){
           guard(Array.isArray(indices)&&indices.length===3&&new Set(indices).size===3&&indices.every(i=>Number.isInteger(i)&&i>=0&&i<6),'INVALID_SELECTION');
           const scores=Array(6).fill(0);indices.forEach((i,rank)=>scores[i]=1000-rank);return scores;
          }
          function createExhaustivePreviewResearchPolicy({tactical,publicDex,telemetry=null}){
           guard(typeof tactical?.scorePreview==='function'&&typeof tactical?.decide==='function','TACTICAL_INTERFACE');
           guard(publicDex?.getSpecies&&publicDex?.getMove&&publicDex?.multiplier,'PUBLIC_DEX_INTERFACE');
           guard(telemetry===null||typeof telemetry==='function','TELEMETRY_INVALID');
           return Object.freeze({id:VERSION,scorePreview(obs){
            const tacticalScores=tactical.scorePreview(obs);
            if(obs?.phase!=='preview'||obs.foe?.previewSource!==SOURCE||!Array.isArray(obs.foe.previewSpecies))return tacticalScores;
            const record=decisionAudit(obs,tactical,publicDex);
            if(telemetry)telemetry(Object.freeze({baselineKey:record.baseline.key,electedKey:record.elected.key,activated:record.activated,baselineRank:record.baselineRank,scoreGap:record.scoreGap,eligible:record.eligibilityCount}));
            if(!record.activated)return tacticalScores;
            // Preserve tactical lead order wherever included, deterministic tie order otherwise.
            const old=ranks(tacticalScores);const placement=i=>old.includes(i)?old.indexOf(i):6;
            const chosen=[...record.elected.indices].sort((a,b)=>placement(a)-placement(b)||a-b);
            return selectionScoresFromIndices(chosen);
           },decide(obs,legal){return tactical.decide(obs,legal)}});
          }
          module.exports={VERSION,POLICY,TRIOS,key,decisionAudit,selectionScoresFromIndices,createExhaustivePreviewResearchPolicy};
