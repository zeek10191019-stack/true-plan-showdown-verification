            const actionTotals={tactical:{moves:totalActions('tacticalActionCounts','moves'),switches:totalActions('tacticalActionCounts','switches')},challenger:{moves:totalActions('challengerActionCounts','moves'),switches:totalActions('challengerActionCounts','switches')}};
