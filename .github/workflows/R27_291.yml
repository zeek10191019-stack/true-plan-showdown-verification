      - name: R27.284 diagnose exposed I-J regressions and test new K-L with frozen restraint gate
        shell: bash
        run: |
          set -euo pipefail
          cd pokemon-showdown
          export R27_284_KL_PLAN_SHA256=e442a3d95895cb18e66e4ce828c0c501d8ed5661cd6ba5a9e3cd728c5c115f47
          echo R27_284_RESEARCH_ONLY=TRUE
          cat > restraint_preview_policy.cjs <<'R27_284_FILE_0_END'
          'use strict';
          /** R27.284 development-derived restraint gate. Freeze before new K/L test. */
          const {decisionAudit,selectionScoresFromIndices}=require('./preview_rank_diagnostic.cjs');
          const {ranks}=require('./conditional_preview_policy.cjs');
          const {SOURCE}=require('./public_preview_contract.cjs');
          const {UnsupportedState}=require('./battle_api.cjs');
          const VERSION='r27.284.development-restraint.v1';
          // These constraints were chosen AFTER public I/J results. I/J is development, NEVER independent holdout.
          const GATE=Object.freeze({minBaselineRank:8,minLead:30});
          function guard(x,code){if(!x)throw new UnsupportedState('R27_284_'+code)}
          function eligible(info){
           guard(info&&typeof info==='object','AUDIT_REQUIRED');
           guard(Number.isInteger(info.baselineRank)&&Number.isFinite(info.scoreGap)&&typeof info.activated==='boolean','BAD_AUDIT');
           return info.activated&&info.baselineRank>=GATE.minBaselineRank&&info.scoreGap>=GATE.minLead;
          }
          function previewChoice(info,oldScores){
           guard(Array.isArray(oldScores)&&oldScores.length===6&&oldScores.every(Number.isFinite),'SCORES_INVALID');
           if(!eligible(info))return [...oldScores];
           const old=ranks(oldScores), placement=i=>old.includes(i)?old.indexOf(i):6;
           const indices=[...info.elected.indices].sort((a,b)=>placement(a)-placement(b)||a-b);
           return selectionScoresFromIndices(indices);
          }
          function createRestrainedPreviewPolicy({tactical,publicDex,telemetry=null}){
           guard(typeof tactical?.scorePreview==='function'&&typeof tactical?.decide==='function','TACTICAL_INTERFACE');
           guard(publicDex?.getSpecies&&publicDex?.getMove&&publicDex?.multiplier,'PUBLIC_DEX_INTERFACE');
           guard(telemetry===null||typeof telemetry==='function','TELEMETRY_INTERFACE');
           return Object.freeze({id:VERSION,scorePreview(obs){
            const base=tactical.scorePreview(obs);
            if(obs?.phase!=='preview'||obs.foe?.previewSource!==SOURCE||!Array.isArray(obs.foe?.previewSpecies))return base;
            const info=decisionAudit(obs,tactical,publicDex);
            const allow=eligible(info);
            if(telemetry)telemetry(Object.freeze({activated:allow,rank:info.baselineRank,gap:info.scoreGap,baseline:info.baseline.key,elected:allow?info.elected.key:info.baseline.key}));
            return allow?previewChoice(info,base):base;
           },decide(obs,legal){return tactical.decide(obs,legal)}});
          }
          module.exports={VERSION,GATE,eligible,previewChoice,createRestrainedPreviewPolicy};
          R27_284_FILE_0_END
          printf '%s  %s\n' e1afecf617031bf2aae83668ae54b9a029139dcc67774f7cec54eec40600fd22 restraint_preview_policy.cjs | sha256sum -c -
          node --check restraint_preview_policy.cjs
          cat > test_restraint_preview.cjs <<'R27_284_FILE_1_END'
          'use strict';
          const assert=require('node:assert/strict');
          const {VERSION,GATE,eligible,previewChoice,createRestrainedPreviewPolicy}=require('./restraint_preview_policy.cjs');
          let n=0;function test(name,fn){fn();n++;console.log('R27_284_RESTRAINT_UNIT '+JSON.stringify({name,status:'PASS'}))}
          const fake=(rank,gap,active=true)=>({baselineRank:rank,scoreGap:gap,activated:active,elected:{indices:[1,2,5]}});
          const scores=[99,10,30,2,90,80];
          test('version',()=>assert.match(VERSION,/r27\.284/));
          test('frozen thresholds',()=>assert(Object.isFrozen(GATE)));
          test('gate explicit rank',()=>assert.equal(GATE.minBaselineRank,8));
          test('gate explicit lead',()=>assert.equal(GATE.minLead,30));
          test('rank below 8 rejected',()=>assert(!eligible(fake(7,40))));
          test('rank 8 accepted',()=>assert(eligible(fake(8,30))));
          test('rank 9 accepted',()=>assert(eligible(fake(9,45))));
          test('lead less than 30 rejected',()=>assert(!eligible(fake(10,29.99))));
          test('lead 30 accepted',()=>assert(eligible(fake(10,30))));
          test('inactive rejected',()=>assert(!eligible(fake(10,40,false))));
          test('bad rank rejected',()=>assert.throws(()=>eligible(fake(8.5,40)),/BAD_AUDIT/));
          test('bad gap rejected',()=>assert.throws(()=>eligible(fake(9,NaN)),/BAD_AUDIT/));
          test('empty audit rejected',()=>assert.throws(()=>eligible(null),/AUDIT_REQUIRED/));
          test('candidate blocked untouched',()=>assert.deepEqual(previewChoice(fake(3,50),scores),scores));
          test('candidate not mutate original',()=>{const a=[...scores];previewChoice(fake(9,50),scores);assert.deepEqual(scores,a)});
          test('candidate scores remain six',()=>assert.equal(previewChoice(fake(9,50),scores).length,6));
          test('candidate only chosen 1,2,5',()=>{const x=previewChoice(fake(9,50),scores);assert.deepEqual(x.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]).slice(0,3).map(x=>x[1]).sort(),[1,2,5])});
          test('candidate retain previous order of shared mons',()=>{const x=previewChoice(fake(9,50),scores);assert.equal(x[5],1000);assert.equal(x[1],999);assert.equal(x[2],998)});
          test('invalid scores rejected',()=>assert.throws(()=>previewChoice(fake(9,50),[1,2]),/SCORES_INVALID/));
