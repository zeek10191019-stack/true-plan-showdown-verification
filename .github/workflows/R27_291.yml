            }
            if(/^switch [1-6]$/.test(base))history.push(base);else history=[];
            if(history.length>3)history.shift();
            return base;
           }
           return Object.freeze({id:VERSION,scorePreview:obs=>tactical.scorePreview(obs),decide});
