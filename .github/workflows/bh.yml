name: R613-R616 Batch - Calibrated Evidence Readiness And Archive Guard (No IPA)
"on":
  push:
    branches: [main]
    paths: [.github/workflows/bh.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trueplan-r613batch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
      && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 55
    env:
      PYTHONOPTIMIZE: "0"
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
    steps:
      - name: Restore immutable R612 plus R613-R616 guarded sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'R613_REPLAY'
          import base64,hashlib,lzma,textwrap,urllib.request
          from pathlib import Path
          url=(
            'https://raw.githubusercontent.com/'
            'zeek10191019-stack/true-plan-showdown-verification/'
            'fb7b57282019ea01fcfb6fff6f98bfcd603f3bf9/'
            '.github/workflows/bg.yml'
          )
          raw=urllib.request.urlopen(url,timeout=90).read()
          assert len(raw)==16314,'R612_PARENT_LENGTH_DRIFT'
          assert hashlib.sha256(raw).hexdigest()==(
            '58edc894cb4eb87928125d0b989a90224f86a62419c6742adacc748effa0366c'
          ),'R612_PARENT_SHA_DRIFT'
          t=raw.decode('utf-8')
          begin="          python3 - <<'R611_BATCH_REPLAY'\n"
          end="\n          R611_BATCH_REPLAY"
          assert t.count(begin)==1 and t.count(end)==1,'R612_MARKER_DRIFT'
          source=textwrap.dedent(t.split(begin,1)[1].split(end,1)[0])
          exec(compile(source,'R612_PINNED_REPLAY','exec'),{'__name__':'__main__'})
          root=Path('app/ios/ChampionsOnDevice')
