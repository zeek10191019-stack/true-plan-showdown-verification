jobs:
  verify:
    if: >-
      github.repository ==
      'zeek10191019-stack/true-plan-showdown-verification'
      && github.ref == 'refs/heads/main'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      R659_PARENT_SHA: 9b57d2e86b0dde061e82da348c9c8fe871373ee8
      PYTHONOPTIMIZE: '0'
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 9b57d2e86b0dde061e82da348c9c8fe871373ee8
        persist-credentials: true
    - name: Verify R659 and save research branch
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os,base64,lzma,hashlib
        from pathlib import Path
        d=lzma.decompress(base64.b85decode(''.join(
          os.environ['PACK'].split())))
        assert len(d)==19198
        assert hashlib.sha256(d).hexdigest()==(
          '3f5264a137066f5da942bab3680dcb2f'+
          '03b46c3ae2b17280245e0d10c129e5ff')
        root='app/ios/ChampionsOnDevice/'
        files=[
          root+'R659TemporalInputGate.swift',
          root+'R659AutoVisionTimeline.swift',
          'tests/R659InputGateHarness.swift',
          'tests/R659AutoVisionHarness.swift',
          'tools/r659_patch.py',
          'research/R659_README.md',
          '__TEMP__/r659-run.sh']
        sizes=[1904,6194,2712,2396,2340,2165,1487]
        off=0
        for name,n in zip(files,sizes):
          part=d[off:off+n];off+=n
          assert len(part)==n
          p=(Path(os.environ['RUNNER_TEMP'])/
             name.split('/')[-1]) if name.startswith(
             '__TEMP__/') else Path(name)
          assert not p.exists(),name
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_bytes(part)
        assert off==len(d)
        PY
        bash "$RUNNER_TEMP/r659-run.sh"
