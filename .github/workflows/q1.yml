jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        ref: daee51d243b72efa647075c9dad97dab077dfd4e
    - run: |
        python3 - <<'PY'
        import os,base64,lzma,hashlib,pathlib
        b=lzma.decompress(base64.b85decode(
          ''.join(os.environ['P'].split())),
          format=lzma.FORMAT_ALONE)
        assert hashlib.sha256(b).hexdigest() == (
          '2302de37f3f3442a7f76fafcbb31909b'+
          'bb2a690b6124923cd74d00c3c10621c4')
        names=[
          'app/ios/ChampionsOnDevice/' +
          'R678MoveTypeOCR.swift',
          'tests/R678Smoke.swift',
          'tools/r678_patch.py','/tmp/R678CI.sh']
        sizes=[7756, 4073, 1328, 1428]
        i=0
        for n,z in zip(names,sizes):
          p=pathlib.Path(n)
          assert not p.exists(),n
          p.write_bytes(b[i:i+z]);i+=z
        assert i==len(b)
        PY
        bash /tmp/R678CI.sh
