          assert set(patch['changes'])==set(['app/ios/ChampionsOnDevice/Info.plist', 'app/ios/ChampionsOnDevice/R565SourceEvidenceFence.swift', 'app/ios/ChampionsOnDevice/R567EvidenceGroupFence.swift', 'tests/R567EvidenceGroupHarness.swift', 'tools/run_macos_checks.py', 'tools/run_r564_mac_ocr.py'])
          for name,data in patch['changes'].items():
              path=Path(name)
              previous=path.read_bytes() if path.exists() else None
              assert (sha(previous) if previous is not None else None)==data['prior_sha256'],('R567_BASE_CHANGED',name)
              body=base64.b64decode(data['base64'],validate=True)
              assert sha(body)==data['new_sha256'],('R567_PATCH_CHANGED',name)
              path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(body)
          src=Path('app/ios/ChampionsOnDevice')
          sources=sorted(src.glob('*.swift'))
          assert len(sources)==115,('R567_SOURCE_COUNT',len(sources))
          tree=sha(''.join(p.name+sha(p.read_bytes()) for p in sources).encode())
          assert tree=='646ce990e257a292704ad37d9d8b147d2b3a772afcaf0bafef6184cf9ad1b04d','R567_SOURCE_TREE_CHANGED'
          info=plistlib.loads((src/'Info.plist').read_bytes())
          assert info['CFBundleVersion']=='567' and info['CFBundleShortVersionString']=='0.5.67'
          subprocess.run(['swiftc','-frontend','-parse',*[str(p) for p in sources]],check=True)
          components=[str(src/n) for n in ['R552StateValues.swift','R553LayoutReading.swift','R566RoleTextFence.swift','R567EvidenceGroupFence.swift','R565SourceEvidenceFence.swift']]
          for harness,indicator in [('R567EvidenceGroupHarness.swift','PASS_R567_ALL_26_TESTS'),
            ('R565SourceEvidenceHarness.swift','PASS_R565_ALL_18_TESTS'),
            ('R566RoleTextHarness.swift','PASS_R566_27_TESTS')]:
              target='/tmp/r567_'+harness.split('.')[0]
              subprocess.run(['swiftc',*components,'tests/'+harness,'-o',target],check=True)
              proc=subprocess.run([target],text=True,capture_output=True,check=True)
              assert indicator in proc.stdout,('R567_HARNESS_OUTPUT_MISSING',harness)
              print(indicator,flush=True)
          report={'release':'R567','parent':'R566','R566_success_run':41116072785,
           'swift_files':115,'source_tree_sha256':tree,'new_regressions':26,
           'legacy_regressions':45,'status':'LOCAL_AND_RUNNER_SWIFT_REGRESSIONS_PASS',
           'ios_build':'PENDING','macos_vision':'PENDING',
           'owner_certified':False,'device_accuracy_certified':False,
           'game_live_proof':False,'final_ipa_created':False}
          Path('R567_CI_REPORT.json').write_text(json.dumps(report,indent=2))
          print('PASS_R567_PINNED_REPLAY_PATCH_AND_REGRESSION',tree,flush=True)
          PY567
      - name: Apple SDK iPhoneOS build or native macOS OCR
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SCREEN_READ_R567_ROLE" = 'IOS27_BUILD' ]; then
            python3 tools/generate_xcode_project.py
            xcodebuild -project app/ios/ChampionsOnDeviceResearch.xcodeproj \
              -target ChampionsOnDeviceResearch -configuration Debug -sdk iphoneos \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
              CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/r567-build" \
              OBJROOT="$RUNNER_TEMP/r567-objects" SYMROOT="$RUNNER_TEMP/r567-symbols" build
            test -f "$RUNNER_TEMP/r567-build/ChampionsOnDeviceResearch.app/PrivacyInfo.xcprivacy"
            echo PASS_R567_IOS27_APP_BUILD_ONLY_NO_IPA
          elif [ "$SCREEN_READ_R567_ROLE" = 'MACOS26_OCR' ]; then
            python3 tools/run_r564_mac_ocr.py
            echo PASS_R567_MACOS26_VISION_NO_GAME_DEVICE_CLAIM
          else
            echo FAIL_R567_ROLE_UNKNOWN; exit 2
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R567_SCREEN_READ_REPORT_${{ matrix.role }}
          path: R567_CI_REPORT.json
          retention-days: 3
