name: R567 PP Split OCR Evidence Group Integrity - No IPA
"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/v567.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: xcode-27
            role: IOS27_BUILD
          - runner: macos-26-intel
            role: MACOS26_OCR
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      SCREEN_READ_R567_ROLE: ${{ matrix.role }}
    steps:
      - name: Pinned R566 replay, R567 group guard and all regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY567'
          import hashlib,base64,json,lzma,urllib.request,re,textwrap,ast,subprocess,plistlib
          from pathlib import Path
          sha=lambda b:hashlib.sha256(b).hexdigest()
          url='https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/dbc20493de89943704bfab9650b180e699f84a58/.github/workflows/v566.yml'
          raw=urllib.request.urlopen(url,timeout=90).read()
          assert len(raw)==20907 and sha(raw)=='5e1c3d4766e083d15787818438425795b3ea27a399deb39b1e1259fabefb9e1c','R567_PARENT_WORKFLOW_CHANGED'
          m=re.search(r"python3 - <<'PY566'\n(.*?)\n\s+PY566",raw.decode(),re.S)
          assert m,'R567_PARENT_PY566_MISSING'
