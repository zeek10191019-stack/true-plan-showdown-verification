          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          test -d "$sdk/System/Library/Frameworks/ScreenCaptureKit.framework"
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate --spec ios/project.yml --project ios
          if xcodebuild -project ios/ChampionsOnDeviceResearch.xcodeproj \
             -scheme ChampionsOnDeviceResearch -configuration Debug \
             -sdk iphoneos -destination 'generic/platform=iOS' \
             ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
             -derivedDataPath "$RUNNER_TEMP/r27403-derived" build > /tmp/r27402-compile.log 2>&1; then
