          done
          swift test -c release --jobs 4 --package-path "$focused" --filter 'testPhoneStatusFromActualSelectedScreenshotRegions|testRetainedBuild715InspectionAndNonSelectedTransition|testSelectedMovePPStillRecordedWhenNameIsUnreadable|testUnknownSelectedSpeciesKeepsHPAndPPWithoutActiveIdentity|testSelectedCardKeepsExactItemWhenOtherFieldsAreUnread|testSelectedPPFractionNeedsDistinctMatchingContrastReadsAndExistingDigits|testAlternateLiteralRequiresExactSameSlotAndValidPP|testScaledAndRotatedInspectionKeepAllSelectedNumbersBoundToSource|testActualAppleVisionReadsOpponentSandStreamFromRetainedCapture|testActualAppleVisionKnockOffOwnItemHistoryNeedsMatchingOwnCard|testR955RetryTimeoutPreservesFrame3402FirstPassOnly|testFallbackDoesNotSilentlyReplaceADifferentHPReading|R855FastLosslessPNGTests|testR956ActualSelectionAndDualHUDStayOutOfSingleCardRoute' 2>&1 | tee "$RUNNER_TEMP/r956-vision.log"


          grep -F "testPhoneStatusFromActualSelectedScreenshotRegions]' passed" "$RUNNER_TEMP/r956-vision.log"
          grep -F "testRetainedBuild715InspectionAndNonSelectedTransition]' passed" "$RUNNER_TEMP/r956-vision.log"
          grep -F "testSelectedMovePPStillRecordedWhenNameIsUnreadable]' passed" "$RUNNER_TEMP/r956-vision.log"
          grep -F "testUnknownSelectedSpeciesKeepsHPAndPPWithoutActiveIdentity]' passed" "$RUNNER_TEMP/r956-vision.log"
          grep -F "testAlternateLiteralRequiresExactSameSlotAndValidPP]' passed" "$RUNNER_TEMP/r956-vision.log"
          grep -F "testScaledAndRotatedInspectionKeepAllSelectedNumbersBoundToSource]' passed" "$RUNNER_TEMP/r956-vision.log"
          grep -F "testActualAppleVisionReadsOpponentSandStreamFromRetainedCapture]' passed" "$RUNNER_TEMP/r956-vision.log"
          grep -F "testActualAppleVisionKnockOffOwnItemHistoryNeedsMatchingOwnCard]' passed" "$RUNNER_TEMP/r956-vision.log"

          grep -F "testSelectedCardKeepsExactItemWhenOtherFieldsAreUnread]' passed" "$RUNNER_TEMP/r956-vision.log"

          grep -F "testSelectedPPFractionNeedsDistinctMatchingContrastReadsAndExistingDigits]' passed" "$RUNNER_TEMP/r956-vision.log"

          grep -F "testR955RetryTimeoutPreservesFrame3402FirstPassOnly]' passed" "$RUNNER_TEMP/r956-vision.log"
          grep -F 'R855_FAST_PNG_ICC_ALPHA_STRIDE_IMAGEIO_READBACK_PASS' "$RUNNER_TEMP/r956-vision.log"

          grep -F "testR956ActualSelectionAndDualHUDStayOutOfSingleCardRoute]' passed" "$RUNNER_TEMP/r956-vision.log"
  publish:
    name: Publish and verify the tested IPA
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    needs: [verify, vision]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: r956-ipa
          path: R956Delivery
      - name: Publish and verify the download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd R956Delivery
          python3 - <<'VERIFY'
          import hashlib,json,os
          from pathlib import Path
          p=Path('R956_Unsigned_DeviceTest.ipa')
          r=json.loads(Path('VERIFICATION_R956.json').read_text())
          assert r['source_commit']==os.environ['GITHUB_SHA'] and r['build']==956
          assert r['ipa_bytes']==p.stat().st_size
          assert r['ipa_sha256']==hashlib.sha256(p.read_bytes()).hexdigest()
          VERIFY
          tag=r956-device-test
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft > existing.json 2>/dev/null; then
            test "$(jq -r .isDraft existing.json)" = true
            gh release upload "$tag" R956_Unsigned_DeviceTest.ipa VERIFICATION_R956.json restore_capture.py R956_PC_Capture_Tools.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" R956_Unsigned_DeviceTest.ipa VERIFICATION_R956.json restore_capture.py R956_PC_Capture_Tools.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title 'R956 iPhone 実機テスト 0.9.56' --notes '相手側のHP欄が隠れた実機場面に対応。原本画像と一致する自分側のカード形状、HP現在値・最大値の両方を確認したときに、自分のHPを表示。PC用の分割ZIP復元・検証ツールを同梱。'
          fi
          mkdir readback
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.ipa' --dir readback
          cmp R956_Unsigned_DeviceTest.ipa readback/R956_Unsigned_DeviceTest.ipa
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/R956_Unsigned_DeviceTest.ipa"
          curl --fail -sSL --retry 4 --retry-all-errors "$url" -o readback/published.ipa
          cmp R956_Unsigned_DeviceTest.ipa readback/published.ipa
          echo "R956_PUBLIC_READBACK_VERIFIED $url"

          curl --fail -sSL --retry 4 --retry-all-errors "${url%/*}/restore_capture.py" -o readback/restore_capture.py
          cmp restore_capture.py readback/restore_capture.py

          curl --fail -sSL --retry 4 --retry-all-errors "${url%/*}/R956_PC_Capture_Tools.zip" -o readback/R956_PC_Capture_Tools.zip
          cmp R956_PC_Capture_Tools.zip readback/R956_PC_Capture_Tools.zip
