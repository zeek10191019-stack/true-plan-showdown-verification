          raw=urllib.request.urlopen(url,timeout=90).read()
          assert len(raw)==4288,'R6081_PARENT_SIZE_MISMATCH'
          assert hashlib.sha256(raw).hexdigest()==(
              '0e4c40a9858e4033ab47a66e6d17521694491c9e2e2adb32ac04b9c6af6f5412'
