name: R584 Historical Battle Text Event Mentions (No IPA)
"on":
  push:
    branches: [main]
    paths: [.github/workflows/r584.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
      PYTHONOPTIMIZE: "0"
    steps:
      - name: Replay pinned R583 and verify every R584 source SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'R584_REPLAY'
          import ast,base64,hashlib,json,lzma,re,textwrap,urllib.request
          from pathlib import Path
          sha=lambda d:hashlib.sha256(d).hexdigest()
          url="https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/ca15cf91ca307efc785c49dc0b4c5d84a7cc37ee/.github/workflows/r583.yml"
          raw=urllib.request.urlopen(url,timeout=90).read()
          assert len(raw)==37080 and sha(raw)=="c328dbc09351410ed1ec62cedac7f94a17e658462b3572910114899068d1ba3b",'R584_PINNED_R583_YAML_MISMATCH'
          m=re.search(r"python3 - <<'R583_REPLAY'\n(.*?)\n\s+R583_REPLAY",raw.decode(),re.S)
          assert m,'R584_R583_PARENT_ENTRY_MISSING'
          code=textwrap.dedent(m.group(1));ast.parse(code)
          exec(compile(code,'R584_R583_PINNED_PARENT','exec'))
          print('PASS_R584_REPLAY_EXACT_R583_SOURCE')
          rows=json.loads(lzma.decompress(base64.b64decode("")))
          assert len(rows)==3
          for r in rows:
           p=Path(r['path']);old=p.read_bytes() if p.exists() else b''
           assert (sha(old) if old else None)==r['old_sha'],('R584_WRONG_R583_PARENT',r['path'])
          for r in rows:
           p=Path(r['path']);old=p.read_bytes() if p.exists() else b''
           value=old[:r['prefix']]+base64.b64decode(r['insert'])+old[r['prefix']+r['remove']:]
           assert sha(value)==r['new_sha'] and len(value)==r['new_len'],('R584_BAD_OVERLAY',r['path'])
           p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(value)
          assert len(list(Path('app/ios/ChampionsOnDevice').glob('*.swift')))==126
          assert 'maximumMembers = 24' in Path('app/ios/ChampionsOnDevice/R548ResearchArchive.swift').read_text()
          assert 'historical_text_event_mentions.json' in Path('app/ios/ChampionsOnDevice/CaptureCoordinator.swift').read_text()
          print('PASS_R584_3_PATCH_SHA_AND_126_SWIFT_AND_20_MEMBER_ARCHIVE')
          R584_REPLAY
      - name: Swift parse and exact independent event/coverage tests
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse app/ios/ChampionsOnDevice/*.swift
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R581ReadabilityCoverage.swift app/ios/ChampionsOnDevice/R583FrameReadabilityIndex.swift app/ios/ChampionsOnDevice/R584BattleTextEventTimeline.swift tests/R584BattleTextEventTimelineHarness.swift -o "$RUNNER_TEMP/r584-test"
          "$RUNNER_TEMP/r584-test"
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R581ReadabilityCoverage.swift app/ios/ChampionsOnDevice/R583FrameReadabilityIndex.swift tests/R583FrameReadabilityHarness.swift -o "$RUNNER_TEMP/r583-test"
          "$RUNNER_TEMP/r583-test"
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R582AutoCaptureCoverage.swift tests/R582AutoCaptureCoverageHarness.swift -o "$RUNNER_TEMP/r582-test"
          "$RUNNER_TEMP/r582-test"
          python3 -m unittest discover -s tests -p test_r580_offline_adapter.py
      - name: Existing Apple Vision and iPhoneOS build (No IPA)
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 tools/run_r571_native.py; then
            echo 'R584_APPLE_NATIVE_BUILD_OR_OCR_FAILURE'
            for log in reports/xcode_iphoneos_build.log reports/r574_png_replay_compile.log; do
              if [ -f "$log" ]; then
                grep -nE 'error:|fatal error|BUILD FAILED' "$log" | tail -n 60 || true
              fi
            done
            exit 1
          fi
      - name: Scope and no device certification
        if: always()
        run: |
          echo 'R584: historical OCR mentions ONLY. No owner, actual turn, action execution, Mega visual form, full 79-field reading, device or real-game accuracy certification. No IPA.'
