name: "R27.35 Public Synthetic Visual OCR Gate (No Real Screens)"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public_synthetic_only:
    if: ${{ github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event_name == 'workflow_dispatch' && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Prepare open-source local-only OCR packages
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y --no-install-recommends ffmpeg tesseract-ocr tesseract-ocr-eng tesseract-ocr-jpn python3-pil fonts-dejavu-core
          /usr/bin/python3 -c "from PIL import Image; print('PIL_OK')"
          tesseract --list-langs
          ffmpeg -version | head -1
          node --version
