      - name: Execute R27.35 synthetic pixels and inherited HMAC safety
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}/r2735-source"
          /usr/bin/python3 test_r2735_vision.py 2>&1 | tee r2735-vision-test.log
          node test_r2732_frame_relay.cjs | tee r2732-regression.log
          node test_r2735_integration.cjs | tee r2735-integration.log
          grep -q 'Ran 40 tests' r2735-vision-test.log
          grep -Eq '^OK( \(skipped=[0-9]+\))?$' r2735-vision-test.log
          grep -q 'R2732_TEST_PASS' r2732-regression.log
          grep -q 'R2735_INTEGRATION_PASS' r2735-integration.log
      - name: Emit machine-verifiable no-private-screenshot proof
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}/r2735-source"
