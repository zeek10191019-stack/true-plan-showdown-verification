      - name: Install pinned open-source image libraries
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet numpy==2.3.5 opencv-python-headless==4.13.0.92 pillow==12.3.0
      - name: Execute inherited and viewport synthetic safety tests
        shell: bash
        env:
          R2739_ROOT: ${{ runner.temp }}/r2739-public
        run: |
          set -euo pipefail
          cd "$R2739_ROOT"
          python -m unittest -v test_r2736_public test_r2737_public test_r2738_public test_r2739_public 2>&1 | tee public-test.log
          grep -q 'Ran 72 tests' public-test.log
          grep -qx 'OK' public-test.log
          test "$(grep -c ' ... ok' public-test.log)" -eq 72
          ! grep -Eq '(FAILED|skipped=|ERROR)' public-test.log
          echo R2739_ALL_72_SYNTHETIC_TESTS_PASS
      - name: Write synthetic research receipt and hashed manifest
        shell: bash
        env:
          R2739_ROOT: ${{ runner.temp }}/r2739-public
        run: |
          set -euo pipefail
          cd "$R2739_ROOT"
          python - <<'PY_RECEIPT'
          from pathlib import Path
          import json,hashlib
          names=['r2736_layout_observer.py', 'r2737_field_reader.py', 'r2738_numeric_reader.py', 'r2739_viewport.py', 'test_r2736_public.py', 'test_r2737_public.py', 'test_r2738_public.py', 'test_r2739_public.py']+['public-test.log']
          receipt={'schema':'R2739_PUBLIC_SYNTHETIC_GEOMETRY_RECEIPT_V1',
                   'test_result':'PASS','test_count':72,
                   'test_components':{'r2736_r2737_r2738_inherited':44,'r2739_viewport_new':28},
                   'real_champions_pixel_frames':0,'real_stream_frames':0,
                   'independent_holdout':'NOT_TESTED',
                   'geometry_live_certified':False,
                   'private_data_uploaded':False,'numeric_ocr_runtime_certified':False,
                   'recommendation':'WITHHELD','legal_action_request':None,
                   'native33':'0/33','exact34':'0/34','actual_game':'0/30','formal':'DENY',
                   'sha256':{n:hashlib.sha256(Path(n).read_bytes()).hexdigest() for n in names}}
          Path('r2739-public-receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2))
          print('R2739_PUBLIC_RECEIPT_CREATED')
          PY_RECEIPT
      - name: Upload PUBLIC research evidence only
        uses: actions/upload-artifact@v4
        with:
          name: r2739-public-synthetic-viewport-safety-proof
          path: |
            ${{ runner.temp }}/r2739-public/public-test.log
            ${{ runner.temp }}/r2739-public/r2739-public-receipt.json
          retention-days: 7
          if-no-files-found: error
