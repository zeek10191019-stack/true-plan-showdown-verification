name: R986 verified iPhone storage resume
'on':
  push:
    branches: [r975-device-regression]
    paths: [.github/workflows/r986-storage-resume-verification.yml]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: r986-unsigned-device-test
  cancel-in-progress: true
jobs:
  verify:
    name: Swift, browser, PC and iPhoneOS regression
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && !github.event.repository.private && github.ref == 'refs/heads/r975-device-regression'
    runs-on: xcode-27
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RELEASE_TAG: r986-unsigned-device-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: .github/workflows/r986-storage-resume-verification.yml
      - name: Restore verified R984 and apply the R986 corrections
        shell: bash
        run: &restore |
          set -euo pipefail
          git show 79f40c89e0c2afcd5d32d9c6ef419cd6f16ceb9b:.github/workflows/r984-save-resume-verification.yml > "$RUNNER_TEMP/r984-baseline.yml"
          echo '11fd6f9855f60cceaf957d0f598048518330dbaa2c069ebf64d247c3b161f713  r984-baseline.yml' | (cd "$RUNNER_TEMP" && shasum -a 256 -c -)
          ruby -ryaml -e '
            steps = YAML.load_file(ARGV.fetch(0), aliases: true).fetch("jobs").fetch("verify").fetch("steps")
            puts steps.find { |step| step["name"] == "Restore verified R983 and apply the R984 corrections" }.fetch("run")
          ' "$RUNNER_TEMP/r984-baseline.yml" > "$RUNNER_TEMP/r984-restore.sh"
          bash "$RUNNER_TEMP/r984-restore.sh"
