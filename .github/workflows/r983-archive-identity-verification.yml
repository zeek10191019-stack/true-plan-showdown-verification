name: R983 verified archive identity
'on':
  push:
    branches: [r975-device-regression]
    paths: [.github/workflows/r983-archive-identity-verification.yml]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: r983-unsigned-device-test
  cancel-in-progress: true
jobs:
  verify:
    name: Swift, browser, PC and iPhoneOS regression
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && !github.event.repository.private && github.ref == 'refs/heads/r975-device-regression'
    runs-on: xcode-27
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RELEASE_TAG: r983-unsigned-device-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: .github/workflows/r983-archive-identity-verification.yml
      - name: Restore verified R982 and apply the R983 corrections
        shell: bash
        run: &restore |
          set -euo pipefail
          git show 5725b6b19d380384cd37e815bfa2195421832354:.github/workflows/r982-capture-resume-verification.yml > "$RUNNER_TEMP/r982-baseline.yml"
          echo '88174987ab12e7434cb634e8777f0c09f761b95773aa8ae78431550d098dc278  r982-baseline.yml' | (cd "$RUNNER_TEMP" && shasum -a 256 -c -)
          ruby -ryaml -e '
            steps = YAML.load_file(ARGV.fetch(0), aliases: true).fetch("jobs").fetch("verify").fetch("steps")
            puts steps.find { |step| step["name"] == "Restore verified R981 and apply the R982 corrections" }.fetch("run")
          ' "$RUNNER_TEMP/r982-baseline.yml" > "$RUNNER_TEMP/r982-restore.sh"
          bash "$RUNNER_TEMP/r982-restore.sh"
          mkdir -p "$RUNNER_TEMP/r982-archive-source"
