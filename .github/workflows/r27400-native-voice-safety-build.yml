# R27.400 - public Swift research only, no private Battle AI, videos, user identifiers or signing.
name: R27.400 iPhone Manual Voice Safety Build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r27400-native-voice-${{ github.ref }}
  cancel-in-progress: false
jobs:
