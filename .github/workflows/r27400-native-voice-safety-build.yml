      - name: ScreenCaptureKit and AVSpeechSynthesizer iPhoneOS unsigned compile
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          test -d "$sdk/System/Library/Frameworks/ScreenCaptureKit.framework"
          printf '%s\n' 'import ScreenCaptureKit' 'import AVFoundation' 'func check() { _ = SCContentSharingPicker.shared; _ = AVSpeechSynthesizer() }' > /tmp/r27400-import.swift
          xcrun --sdk iphoneos swiftc -typecheck -sdk "$sdk" -target arm64-apple-ios27.0 /tmp/r27400-import.swift
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate --spec ios/project.yml --project ios
          if xcodebuild -project ios/ChampionsOnDeviceResearch.xcodeproj \
             -scheme ChampionsOnDeviceResearch -configuration Debug \
             -sdk iphoneos -destination 'generic/platform=iOS' \
             ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
             build > /tmp/r27400-build.log 2>&1; then
            echo 'IPHONEOS_UNSIGNED_BUILD=PASS; MANUAL_VOICE_RUNTIME=NOT_TESTED'
