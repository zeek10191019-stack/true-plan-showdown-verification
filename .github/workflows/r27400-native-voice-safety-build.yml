          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPO"
          test "${REPO_PRIVATE:-unknown}" = false
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          echo 'PUBLIC_STANDARD_RUNNER=PASS; NO_SIGNING; NO_IPHONE_INSTALL'
