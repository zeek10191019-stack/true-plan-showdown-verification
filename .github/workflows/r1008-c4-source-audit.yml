name: R1008 C4 pinned source recovery and offline regression (NO IPA)
'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/r1008-c4-source-audit.yml'
      - '.github/workflows/R1008_C4_CONTINUATION_FULL.zip'
  workflow_dispatch:
    inputs:
      export_source:
        description: 'Export pinned source artifact? OFF by default; requires storage/cost approval.'
        type: boolean
        default: false
        required: false
permissions:
  contents: read
concurrency:
  group: r1008-c4-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-and-source:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Pin a real repository worktree with full Git history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select a supported Python 3.12 runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify uploaded C4 ZIP and test offline Lenovo and iPhone adapters
        shell: bash
        run: |
          set -Eeuo pipefail
          zipfile="$GITHUB_WORKSPACE/.github/workflows/R1008_C4_CONTINUATION_FULL.zip"
          test -s "$zipfile"
          mkdir -p "$RUNNER_TEMP/r1008-c4-pack"
          python3 - "$zipfile" "$RUNNER_TEMP/r1008-c4-pack" <<'PY'
          import sys,zipfile
          from pathlib import Path,PurePosixPath
          zpath=Path(sys.argv[1]); dest=Path(sys.argv[2])
          with zipfile.ZipFile(zpath) as z:
              if z.testzip() is not None: raise SystemExit('ZIP_CRC_FAILED')
              for entry in z.infolist():
                  p=PurePosixPath(entry.filename)
                  if p.is_absolute() or '..' in p.parts or (entry.external_attr >> 16) & 0o170000 == 0o120000:
                      raise SystemExit('UNSAFE_ZIP_PATH')
              z.extractall(dest)
          PY
          cd "$RUNNER_TEMP/r1008-c4-pack"
          python3 VERIFY_C4_PACK.py
          bash RUN_ALL_LOCAL_TESTS.sh
      - name: Restore SHA-pinned R999 AI024 source and apply C4 add-only safety adapter
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          bash "$RUNNER_TEMP/r1008-c4-pack/R1008_C4_RESTORE_R999_ON_MACOS.sh" "$RUNNER_TEMP/r1008-c4-pack"
          test -s "$RUNNER_TEMP/r1008-c4-source-discovery.json"
      - name: Optional source export (disabled on push; NOT a release)
        if: github.event_name == 'workflow_dispatch' && inputs.export_source == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: R1008_C4_R999_SOURCE_FOR_REVIEW_NOT_AN_IPA
          path: |
            pinned-r793/source/
            ${{ runner.temp }}/r1008-c4-source-discovery.json
            ${{ runner.temp }}/r1008-c4-r999-base-report.json
            ${{ runner.temp }}/r1008-c4-r999-overlay-report.json
          retention-days: 1
          if-no-files-found: error
  windows-hosted-cli:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout C4 uploaded sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Windows cmd.exe and PowerShell syntax QA (no GUI and no audio)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:GITHUB_WORKSPACE '.github/workflows/R1008_C4_CONTINUATION_FULL.zip'
          $dest = Join-Path $env:RUNNER_TEMP 'r1008-c4-win'
          Expand-Archive -LiteralPath $archive -DestinationPath $dest -Force
          Set-Location $dest
          python VERIFY_C4_PACK.py
          $script = Get-Content -LiteralPath 'VERIFY_AND_OPEN_REPLAY.ps1' -Raw
          [scriptblock]::Create($script) | Out-Null
          $env:TRUEPLAN_CI = '1'
          & cmd.exe /d /c 'TEST_LOCAL.cmd'
          if ($LASTEXITCODE -ne 0) { throw "WINDOWS_PYTHON_SMOKE_FAILED:$LASTEXITCODE" }
          Write-Output 'WINDOWS_HOSTED_CMD_POWERSHELL_SMOKE_PASS (NOT PHYSICAL LENOVO)'
