    - name: Swift XCTest and iPhoneOS build NO IPA
      shell: bash
      run: |
       set -euo pipefail
       (cd source/R720_PORTABLE_TESTS && swift test -j 2) \
        > R751Proof/Swift.log 2>&1 || {
         tail -n 70 R751Proof/Swift.log;exit 1;
        }
       grep -Fq 'Executed 274 tests, with 0 failures' \
        R751Proof/Swift.log
       python3 source/tools/r748_capture_path_gate.py
       python3 source/tools/r745_read_path_gate.py \
        > R751Proof/ReadPath.log
       python3 source/tools/r742_live_path_audit.py
       python3 source/tools/r743_macos_compat_audit.py
       swiftc -frontend -parse source/app/ios/ChampionsOnDevice/*.swift
       python3 source/tools/generate_xcode_project.py
       xcodebuild -project source/app/ios/ChampionsOnDeviceResearch.xcodeproj \
        -scheme ChampionsOnDeviceResearch -configuration Debug \
        -sdk iphoneos -destination 'generic/platform=iOS' \
        ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
        -derivedDataPath "$RUNNER_TEMP/r751" build \
        > R751Proof/iPhoneOS.log 2>&1 || {
         grep -E 'error:|BUILD FAILED' R751Proof/iPhoneOS.log || true
         exit 1;
        }
       grep -Fq 'BUILD SUCCEEDED' R751Proof/iPhoneOS.log
       python3 - <<'PYTHON'
       import pathlib,zipfile,hashlib,json
       root=pathlib.Path('source');out=pathlib.Path('R751Proof')
       changed=[
        'R720_PORTABLE_TESTS/Sources/R719Core/R751HUDBarEvidence.swift',
        'R720_PORTABLE_TESTS/Tests/R719CoreTests/R751HUDBarEvidenceTests.swift',
        'R751_CHANGELOG.md',
        'app/ios/ChampionsOnDevice/R714CaptureAudit.swift',
        'app/ios/ChampionsOnDevice/R750RawPixelSampler.swift',
        'app/ios/ChampionsOnDevice/R751HUDBarEvidence.swift',
        'source_manifest.json',
       ]
       expected=json.loads((out/'SOURCE_HASHES.json').read_text())
       assert len(expected)==400
       zpath=out/'R751_CHANGESET_ONLY.zip'
       with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED) as z:
        for n in changed:
         b=(root/n).read_bytes()
         assert hashlib.sha256(b).hexdigest()==expected[n]
         z.writestr(n,b)
       with zipfile.ZipFile(zpath) as z:
        assert z.testzip() is None and len(z.namelist())==len(changed)
       (out/'STATUS.txt').write_text(
        'R751 Mac Swift/Xcode compile and regression audit ONLY.\n'
        'NO IPA. Real iPhone game-value recognition remains uncertified.\n')
       print('R751_DIFF_ONLY_SHA_PASS',len(changed))
       PYTHON
    - name: Upload source and diagnostics only NO IPA
      uses: actions/upload-artifact@v4
      with:
        name: R751-aspect-bar-audit-NO-IPA
        path: R751Proof/
        retention-days: 3
        if-no-files-found: error
