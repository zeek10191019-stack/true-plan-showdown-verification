      uses: actions/upload-artifact@v4
      with:
        name: R832-${{ matrix.lane }}-NO-IPA
        path: |-
          pinned-r793/R826Proof/
          pinned-r793/R829Proof/
          pinned-r793/R830Proof/
          pinned-r793/R831Proof/
          pinned-r793/R832Proof/
        if-no-files-found: error
        retention-days: 7
    - name: R832 fail-closed certification 618 tests and native SDK build
      shell: bash
      env:
        R826_LANE: ${{ matrix.lane }}
      run: |
        set -euo pipefail
        cd pinned-r793
        test -s R826Proof/R826_PATCH_REPORT.json
        test -s R826Proof/SOURCE_TREE_SHA256.txt
        test -s R829Proof/SOURCE_TREE_SHA256.txt
        test -s R829Proof/R829_PATCH_REPORT.json
        test -s R830Proof/SOURCE_TREE_SHA256.txt
        test -s R830Proof/R830_PATCH_REPORT.json
        test -s R831Proof/R831_PATCH_REPORT.json
        test -s R831Proof/SOURCE_TREE_SHA256.txt
        test -s R832Proof/R832_PATCH_REPORT.json
        test -s R832Proof/SOURCE_TREE_SHA256.txt
        python3 - <<'R826_GATE_PY'
        import json
        from pathlib import Path
        r=json.loads(Path('R826Proof/R826_PATCH_REPORT.json').read_text())
        assert r['source_file_count']==596
        assert r['production_files_changed']==1
        assert r['test_cases_added']==2 and r['old_test_cases_retained']
        assert r['live_device_79_fields_certified']==0
        assert not r['owner_turn_certified'] and not r['ipa_created']
        p=json.loads(Path('R829Proof/R829_PATCH_REPORT.json').read_text())
        assert p['source_files']==596 and p['added_regression_tests']==3
        assert p['production_files_changed']==1 and p['test_files_changed']==1
        assert p['game_fields_certified']==0 and not p['ipa_created']
        assert p['prior_tree_sha256']==Path('R826Proof/SOURCE_TREE_SHA256.txt').read_text().strip()
        assert p['final_tree_sha256']==Path('R829Proof/SOURCE_TREE_SHA256.txt').read_text().strip()
        q=json.loads(Path('R830Proof/R830_PATCH_REPORT.json').read_text())
        assert q['source_files']==596 and q['added_regression_tests']==4
        assert q['existing_regression_count']==605 and q['expected_total_regression_count']==609
        assert q['production_files_changed']==1 and q['test_files_changed']==1
        assert q['parent_tree_sha256']==Path('R829Proof/SOURCE_TREE_SHA256.txt').read_text().strip()
        assert q['final_tree_sha256']==Path('R830Proof/SOURCE_TREE_SHA256.txt').read_text().strip()
        assert q['certified_live_game_values']==0 and not q['independent_owner_turn_certified'] and not q['ipa_created']
        r=json.loads(Path('R831Proof/R831_PATCH_REPORT.json').read_text())
        assert r['files_verified']==596 and r['expected_total_tests']==614
        assert r['changed_production_files']==2 and r['changed_portable_source_mirrors']==2
        assert r['changed_test_files']==1 and r['added_regression_tests']==5
        assert r['parent_tree_sha256']==Path('R830Proof/SOURCE_TREE_SHA256.txt').read_text().strip()
        assert r['final_tree_sha256']==Path('R831Proof/SOURCE_TREE_SHA256.txt').read_text().strip()
        assert r['device_79_fields_certified']==0 and not r['independent_owner_turn_certified']
        assert not r['battle_advice_authorized'] and not r['ipa_created']
        t=json.loads(Path('R832Proof/R832_PATCH_REPORT.json').read_text())
        assert t['source_file_count']==596 and t['expected_total_tests']==618
        assert t['added_regression_tests']==4 and t['changed_production_files']==1
        assert t['changed_portable_source_mirrors']==1 and t['changed_test_files']==1
        assert t['parent_tree_sha256']==Path('R831Proof/SOURCE_TREE_SHA256.txt').read_text().strip()
        assert t['final_tree_sha256']==Path('R832Proof/SOURCE_TREE_SHA256.txt').read_text().strip()
