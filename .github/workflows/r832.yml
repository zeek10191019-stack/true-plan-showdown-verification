        assert t['same_source_candidate_counts_reconciled_with_r749']
        assert t['quick_detail_cross_lane_turn_disagreement_held']
        assert t['independent_gameplay_79_certified']==0 and not t['owner_turn_gameplay_certified']
        assert not t['ipa_created']
        print('R832_PATCH_SCOPE_79_FIELD_AND_TURN_JOIN_GATES_PASS')
        R826_GATE_PY
        if [ "$R826_LANE" = real-apple-vision ]; then
         test "$(cat R826Proof/Swift.exit)" = 0
         grep -F 'Executed 618 tests, with 0 failures' R826Proof/Swift.log
