        data=zlib.decompress(base64.b85decode(encoded))
        assert len(data)==266646
        assert hashlib.sha256(data).hexdigest()==(
          '98df2618ff8abad72e4ff8380266db67' +
          '5772128ed54121598feda23dad9c472e')
        names=[
          'research/R651_MEGA_CHAMPIONS_ASSET_INDEX.json',
          'research/r651_asset_guard.py',
          'research/r651_selftest.py',
          'research/R651_README.md',
        ]
        sizes=[256701, 3985, 1932, 4028]
        offset=0
        for name,size in zip(names,sizes):
          block=data[offset:offset+size]
          assert len(block)==size
          offset+=size
          path=Path(name)
          assert not path.exists(),name
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_bytes(block)
        assert offset==len(data)
