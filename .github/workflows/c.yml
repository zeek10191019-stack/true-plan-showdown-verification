jobs:
  build:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            1e63efa4db514cc122f2940a39623d9bc65c554c
      - name: R686 one-button image capture build
        shell: bash
        run: |
          python3 - <<'PY'
          import os,base64,lzma,hashlib,pathlib
          raw=lzma.decompress(base64.b64decode(
              os.environ['R686_PKG']),
              format=lzma.FORMAT_ALONE)
          expected=(
            '80b3b92b798956a0cb9353873a8886c1'
            '1a0d8804e38de48fbb6776eecee15b9c')
          assert hashlib.sha256(raw).hexdigest()==(
            expected)
          names=[
            'tools/R686Build.py',
            'tools/R686Patch.py',
            'app/ios/ChampionsOnDevice/' +
            'R686JournalCore.swift',
            'app/ios/ChampionsOnDevice/' +
            'R686FrameJournal.swift',
            'tests/R686JournalCoreTests.swift',
            'tests/R686ScorecardRegression.swift',
          ]
          sizes=[
            4070,
            5921,
            3987,
            6499,
            1522,
            2587,
          ]
          assert sum(sizes)==len(raw)
          pos=0
          for name,size in zip(names,sizes):
            p=pathlib.Path(name)
            assert not p.exists(),name
            p.parent.mkdir(
              parents=True,exist_ok=True)
            p.write_bytes(raw[pos:pos+size])
            pos+=size
          assert pos==len(raw)
          print('R686_PACKAGE_SHA_PASS')
          PY
          python3 tools/R686Build.py
      - uses: actions/upload-artifact@v4
        with:
          name: R686-reviewed-iLoader-IPA
          path: dist/R686*
          if-no-files-found: error
          retention-days: 7
