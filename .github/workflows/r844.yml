name: R844 D104 Stop finalization late export fresh display preflight NO IPA
on:
  push:
    branches: [main]
    paths: [.github/workflows/r844.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            lane: real-apple-vision
          - runner: xcode-27
            lane: iphoneos-compile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4cc925234f9101a8875744e75049f06e96ce4d90
          path: pinned-r823
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/r823.yml
      - uses: actions/checkout@v4
        with:
          ref: 641a9ee8701484fabaf9344db5a0eaab31c422c3
          path: pinned-r821
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/r821.yml
      - uses: actions/checkout@v4
        with:
          ref: 46b607b88ddb5569fff0fc042dfdb5f0fb6e06f6
          path: pinned-r819
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/r819.yml
      - uses: actions/checkout@v4
        with:
          ref: 37b3e26851c71fcabd65da3299356c1e38c53869
          path: pinned-r793
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/r793.yml
            .github/workflows/d30.b64
      - uses: actions/checkout@v4
        with:
          ref: b783a785f97d0b74c9a1d48780dcee9626aef12c
          path: pinned-r833
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/r833.yml
      - uses: actions/checkout@v4
        with:
          ref: 73b62dff5e71b7889e90b7be1e1ba311e6205ec2
          path: pinned-r843
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/r843.yml
      - name: Restore exact R843 and apply verified R844 delta
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e 'puts YAML.load_file(ARGV[0]).fetch("jobs").fetch("verify").fetch("steps").fetch(5).fetch("run")' pinned-r843/.github/workflows/r843.yml > "$RUNNER_TEMP/restore_r843.sh"
          bash "$RUNNER_TEMP/restore_r843.sh"
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,base64,lzma
          src=Path('pinned-r793/source');proof=Path('R834Proof')
          sha=lambda b:hashlib.sha256(b).hexdigest()
          def files():
           return {str(p.relative_to(src)):p for p in src.rglob('*') if p.is_file() and not {'.build','.swiftpm','__pycache__'}.intersection(p.parts)}
          def tree(fs):
           return sha(''.join(n+'\t'+sha(fs[n].read_bytes())+'\n' for n in sorted(fs)).encode())
          fs=files();assert len(fs)==614 and tree(fs)=='224ad57a5990ae00c7ee165bd888ebbbeba3deb72bebdc6991a6a481bae96f95'
          manifest=json.loads((src/'source_manifest.json').read_text())
          assert all(sha((src/n).read_bytes())==h for n,h in manifest.items())
          delta=json.loads(lzma.decompress(base64.b64decode('')))
          for n,v in delta.items():
           p=src/n;assert not Path(n).is_absolute() and '..' not in Path(n).parts
           if v['old'] is None:
            assert not p.exists();b=v['text'].encode()
           else:
            assert sha(p.read_bytes())==v['old']==manifest[n]
            lines=p.read_text().splitlines(keepends=True)
            for i,j,t in reversed(v['edits']):lines[i:j]=[t]
            b=''.join(lines).encode()
           assert sha(b)==v['new'];p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b);manifest[n]=v['new']
          (src/'source_manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          fs=files();assert len(fs)==620 and set(fs)==set(manifest)|{'source_manifest.json'}
          assert all(sha(fs[n].read_bytes())==h for n,h in manifest.items())
          assert tree(fs)=='99f2dcfd1632f8835623547c20da318d65e7eb799781584cbfc6128d152eca9c'
          for n in ['R844QuickDisplayLine.swift','R844LateExportFence.swift']:
           assert (src/'app/ios/ChampionsOnDevice'/n).read_bytes()==(src/'R720_PORTABLE_TESTS/Sources/R719Core'/n).read_bytes()
          (proof/'SOURCE_TREE_SHA256.txt').write_text(tree(fs)+'\n')
          print('R844 SOURCE VERIFIED',len(fs),tree(fs))
          PY
      - name: Full 642 Swift regression and original PNG QUICK timing
        if: matrix.lane == 'real-apple-vision'
        shell: bash
        run: |
          set -euo pipefail
          export R834_PROOF_DIR="$PWD/R834Proof"
          swift test --package-path pinned-r793/source/R720_PORTABLE_TESTS > R834Proof/Swift.log 2>&1 || { tail -n 150 R834Proof/Swift.log; exit 1; }
          grep -F 'Executed 642 tests, with 0 failures' R834Proof/Swift.log
          grep -F 'R834_QUICK_ORIGINAL_PNG_MEASUREMENTS' R834Proof/Swift.log
          grep -F 'R836_REAL_NUMERIC_GOLDEN' R834Proof/Swift.log
          grep -F 'R837_REAL_SOURCE_TO_FRAME_STATE' R834Proof/Swift.log
          grep -F 'R839_ORIGINAL_PNG_SOURCE_FSYNC_PIXEL_OCR_MAIN_PUBLICATION_MS' R834Proof/Swift.log
          swiftc -O pinned-r793/source/app/ios/ChampionsOnDevice/R731ArchiveCapacity.swift pinned-r793/source/app/ios/ChampionsOnDevice/R689StreamingZIP.swift pinned-r793/source/tests/R689StreamingZIPSmoke.swift -o R834Proof/archive_smoke
          R834Proof/archive_smoke
      - name: iPhoneOS SDK compile NO IPA
        if: matrix.lane == 'iphoneos-compile'
        shell: bash
        run: |
          set -euo pipefail
          python3 pinned-r793/source/tools/generate_xcode_project.py
          xcodebuild -project pinned-r793/source/app/ios/ChampionsOnDeviceResearch.xcodeproj -scheme ChampionsOnDeviceResearch -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO -derivedDataPath "$RUNNER_TEMP/r844_device" build > R834Proof/iPhoneOS.log 2>&1 || { grep -E 'error:|BUILD FAILED' R834Proof/iPhoneOS.log; exit 1; }
          grep -F 'BUILD SUCCEEDED' R834Proof/iPhoneOS.log
      - name: Record scope without paid artifact storage
        if: always()
        shell: bash
        run: |
          if [ -f R834Proof/quick_original_pngs.json ]; then cat R834Proof/quick_original_pngs.json; fi
          if [ -f R834Proof/SOURCE_TREE_SHA256.txt ]; then cat R834Proof/SOURCE_TREE_SHA256.txt; fi
          echo 'R844 NO IPA. Mac replay is not iPhone capture-to-render certification.' >> "$GITHUB_STEP_SUMMARY"
