jobs:
  build:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            1e63efa4db514cc122f2940a39623d9bc65c554c
      - name: Verify R693 and build IPA
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os,re,base64,lzma,hashlib
          import pathlib,urllib.request,ast
          url=('https://raw.githubusercontent.com/'
            'zeek10191019-stack/'
            'true-plan-showdown-verification/'
            'acdc5b252ca9d7ddf37e46480f8a67'
            'ee63ba2851/.github/workflows/k.yml')
          req=urllib.request.Request(url,headers={
            'User-Agent':'R693-Pinned-Builder'})
          with urllib.request.urlopen(
            req,timeout=40) as res:
            k=res.read(12000)
          assert len(k)==10180
          assert hashlib.sha256(k).hexdigest()==(
            '9941ae64d09e8941b4993518becfda9'
            'a31535b6cced1df9c2402a8d9865492b9')
          m=re.search(rb'(?m)^  R692_PKG: >-\n'
             rb'((?:    [^\n]*\n)+)',k)
          assert m,'R692_PINNED_PACKAGE_MISSING'
          os.environ['R692_PKG']=b''.join(
            m[1].split()).decode('ascii')
          raw=lzma.decompress(base64.b64decode(
            os.environ['R693_PKG']),
            format=lzma.FORMAT_ALONE)
          assert hashlib.sha256(raw).hexdigest()==(
            'c3ceefc7ebb3b5bcc701a9c41d5c822b'
            'ddf33b1ddf06d128a201def552cb9547')
          names=['R693HUDLayoutEvidence.swift',
            'R693Patch.py','R693MakeBuild.py',
            'R693Smoke.swift']
          sizes=[5925, 2115, 1986, 3313]
          assert sum(sizes)==len(raw)
          pos=0
          for name,size in zip(names,sizes):
            isTest=name.endswith('Smoke.swift')
            folder='tests' if isTest else 'tools'
            p=pathlib.Path(folder)/name
            p.parent.mkdir(
              parents=True,exist_ok=True)
            p.write_bytes(raw[pos:pos+size])
            pos+=size
          print('R693_SOURCE_SHA_PASS',flush=True)
          text=k.decode('utf-8')
          marker="          python3 - <<'PYCODE'\n"
          start=text.index(marker)+len(marker)
          end=text.index('\n          PYCODE',start)
          block=text[start:end]
          body='\n'.join(line[10:] for line in
            block.splitlines())
          needle=("['python3','tools/"+
            "R692MakeBuild.py']")
          assert body.count(needle)==1
          body=body.replace(needle,
            "['python3','tools/R693MakeBuild.py']")
          ast.parse(body)
          exec(compile(body,'r692','exec'),{})
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: R693-unsigned-iLoader-IPA
          path: dist/R693*
          if-no-files-found: error
          retention-days: 7
