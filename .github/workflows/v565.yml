      - name: R565 Apple SDK build or native Vision OCR
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SCREEN_READ_R565_ROLE" = 'IOS27_BUILD' ]; then
            python3 tools/generate_xcode_project.py
            xcodebuild -project app/ios/ChampionsOnDeviceResearch.xcodeproj \
              -target ChampionsOnDeviceResearch -configuration Debug -sdk iphoneos \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
              CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/r565-build" \
              OBJROOT="$RUNNER_TEMP/r565-objects" SYMROOT="$RUNNER_TEMP/r565-symbols" build
            test -f "$RUNNER_TEMP/r565-build/ChampionsOnDeviceResearch.app/PrivacyInfo.xcprivacy"
            echo 'PASS_R565_IOS27_UNSIGNED_BUILD_NO_IPA'
          elif [ "$SCREEN_READ_R565_ROLE" = 'MACOS26_OCR' ]; then
            python3 tools/run_r564_mac_ocr.py
            echo 'PASS_R565_MACOS26_VISION_SYNTHETIC_NO_GAME_ACCURACY_CERTIFICATION'
          else
            echo 'FAIL_BAD_ROLE'; exit 2
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R565_CHECK_REPORT_${{ matrix.role }}
          path: R565_CI_REPORT.json
          retention-days: 3
