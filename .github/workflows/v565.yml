name: R565 Source Evidence Owner Hint Fence (NO IPA)
"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/v565.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: xcode-27
            role: IOS27_BUILD
          - runner: macos-26-intel
            role: MACOS26_OCR
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      SCREEN_READ_R565_ROLE: ${{ matrix.role }}
    steps:
      - name: Exact R564 pinned replay and R565 source-bound OCR regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY565'
          import urllib.request,base64,lzma,hashlib,json,ast,re,textwrap,subprocess,plistlib
          from pathlib import Path
          sha=lambda b:hashlib.sha256(b).hexdigest()
          url=('https://raw.githubusercontent.com/zeek10191019-stack/'
               'true-plan-showdown-verification/a9410b1c5177667c19994d1735d14b072a722dc8/'
               '.github/workflows/v564.yml')
          raw=urllib.request.urlopen(url,timeout=60).read()
          assert len(raw)==26960 and sha(raw)=='8505fcf136d5616b930122292711aad80d1947a0a6318dc62411a621c1adb730','R565_PARENT_V564_YAML_CHANGED'
          source=raw.decode()
          match=re.search(r"python3 - <<'PY564'\n(.*?)\n\s+PY564",source,re.S)
          assert match,'R565_PARENT_SCRIPT_MISSING'
          parent=textwrap.dedent(match.group(1))
          ast.parse(parent)
