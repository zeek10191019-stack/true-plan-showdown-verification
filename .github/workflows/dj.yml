jobs:
  verify:
    if: >-
      github.repository ==
      'zeek10191019-stack/true-plan-showdown-verification'
      && github.ref == 'refs/heads/main'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      R660_PARENT_SHA: 1dacc904544e6fac2e4c452420dcdbb947ba2396
      PYTHONOPTIMIZE: '0'
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 1dacc904544e6fac2e4c452420dcdbb947ba2396
        persist-credentials: true
    - name: Camera translation safety and Apple CI
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os,base64,lzma,hashlib
        from pathlib import Path
        data=lzma.decompress(base64.b85decode(''.join(
          os.environ['PACK'].split())))
        assert len(data)==19268
        assert hashlib.sha256(data).hexdigest()==(
          '3628e29799092cd6addf56d0f3e5e2da' +
          '3c4f32d1846087a5bcc98aaf651d21ec')
        files=[
          'app/ios/ChampionsOnDevice/R660CameraMotionGate.swift',
          'app/ios/ChampionsOnDevice/' +
          'R660CameraMotionRegistration.swift',
          'tests/R660CameraMotionGateHarness.swift',
          'tests/R660CameraRegistrationHarness.swift',
          'tools/r660_patch.py',
          'research/R660_README.md',
          '__TEMP__/r660-run.sh',
        ]
        sizes=[
          2200,
          5534,
          2944,
          3599,
          1477,
          1888,
          1626,
        ]
        offset=0
        for name,size in zip(files,sizes):
          chunk=data[offset:offset+size]
          offset+=size
          assert len(chunk)==size and size>0
          p=(Path(os.environ['RUNNER_TEMP'])/
             name.split('/')[-1]) if name.startswith(
             '__TEMP__/') else Path(name)
          assert not p.exists(),name
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_bytes(chunk)
        assert offset==len(data)
        PY
        bash "$RUNNER_TEMP/r660-run.sh"
