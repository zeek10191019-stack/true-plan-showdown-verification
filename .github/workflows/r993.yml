        print("R993_SOURCE_VERIFIED", len(files))
        MANIFEST
    - name: Run Swift, archive and browser regressions
      shell: bash
      run: |
        set -euo pipefail
        prior="$RUNNER_TEMP/r990-baseline.yml"
        extract() {
          ruby -ryaml -e '
            doc = YAML.load_file(ARGV[0], aliases: true)
            steps = doc.fetch("jobs").fetch(ARGV[1]).fetch("steps")
            step = steps.find { |s| s.fetch("name","").start_with?(ARGV[2]) }
            puts step.fetch("run")
          ' "$prior" "$1" "$2" > "$RUNNER_TEMP/r993-check.sh"
        }
        for check in 'Replay storage contention' 'Run integrated export'; do
          extract verify "$check"
          bash "$RUNNER_TEMP/r993-check.sh"
        done
        grep -F "testNextCommandDropsPreviousHPAndResumesWithKnownRosterSlot]' passed" "$RUNNER_TEMP/r966-swift.log"
        grep -F "testAmbiguousOwnSlotIsNotGuessedAndSwitchDropsFormerHP]' passed" "$RUNNER_TEMP/r966-swift.log"
    - name: Build and publish the verified unsigned IPA
      shell: bash
      run: |
        set -euo pipefail
        prior="$RUNNER_TEMP/r990-baseline.yml"
        extract() {
          ruby -ryaml -e '
            doc = YAML.load_file(ARGV[0], aliases: true)
            steps = doc.fetch("jobs").fetch("verify").fetch("steps")
            step = steps.find { |s| s.fetch("name","").start_with?(ARGV[1]) }
            puts step.fetch("run")
          ' "$prior" "$1" > "$RUNNER_TEMP/r993-old-step"
        }
        extract "Build and verify iPhoneOS"
