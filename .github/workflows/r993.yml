name: R993 iPhone turn binding and Lenovo display
'on':
  push:
    branches:
    - r993-device-readout-fix
    - r987-ocr-pc-regression
    paths:
    - .github/workflows/r993.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  vision:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && !github.event.repository.private
      && (github.ref == 'refs/heads/r993-device-readout-fix' || github.ref == 'refs/heads/r987-ocr-pc-regression')
    runs-on: macos-26
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: .github/workflows/r993.yml
    - name: Restore and verify the R993 source
      shell: bash
      run: |
        set -euo pipefail
        prior="$RUNNER_TEMP/r992-pinned.yml"
        git show "5b7dd38a7254dd66121cf43013e43e76f702a79b:.github/workflows/r992.yml" > "$prior"
        echo 'f1e01f526040ccfd102adec3eb5a492098aeda29d5620be760153e05b083c030  r992-pinned.yml' | (cd "$RUNNER_TEMP" && shasum -a 256 -c -)
        ruby -ryaml -e '
          steps = YAML.load_file(ARGV[0], aliases: true).fetch("jobs").fetch("vision").fetch("steps")
          puts steps.find { |step| step["name"] == "Restore and verify the R992 source" }.fetch("run")
