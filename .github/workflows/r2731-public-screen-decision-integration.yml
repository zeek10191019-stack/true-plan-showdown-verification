        run: |
          set -euo pipefail
          cat > ./r2728-multiseed-infoset.cjs <<'R2728_INFOSET'
          'use strict';
          /** R27.28 research-only: weighted RNG scenarios and observation-conditioned
           * posterior over hypotheses. No private true-world input is given to policy.
           * Probability of observed public information sets is computed by propagating
           * prior hypothesis weight x RNG weight x opponent action probability.
           */
          const assert=require('node:assert/strict');
          const {hash,publicContract}=require('./r2726-search-core.cjs');
          const copy=x=>JSON.parse(JSON.stringify(x));
          const tol=1e-8;
          function distribution(a){
           assert(Array.isArray(a)&&a.length>0,'empty distribution');
           assert(a.every(x=>x&&Number.isFinite(x.p)&&x.p>0),'invalid mass');
           assert(Math.abs(a.reduce((v,x)=>v+x.p,0)-1)<tol,'distribution not normalized');
          }
          function validateMoves(a){assert(Array.isArray(a)&&a.length>0,'missing legal actions');
           assert(a.every(x=>typeof x==='string'&&/^(?:move|switch) [1-6]$/.test(x)),'invalid action');
           assert.equal(new Set(a).size,a.length,'duplicate legal actions');}
          function expandSeeds({observation,hypotheses,seeds,reseed,publicView}){
           publicContract(observation);distribution(hypotheses);
           assert(Array.isArray(seeds)&&seeds.length>=2&&seeds.length<=8,'invalid RNG scenario set');
           assert.equal(new Set(seeds).size,seeds.length,'duplicate RNG seed');
           assert(seeds.every(x=>typeof x==='string'&&/^\d+,\d+,\d+,\d+$/.test(x)),'unsupported RNG seed');
           assert.equal(typeof reseed,'function');assert.equal(typeof publicView,'function');
           const pHash=hash(observation),before=hypotheses.map(x=>hash(x.state));
           const particles=[];
           for(const h of hypotheses){
            assert(typeof h.id==='string'&&h.id.length&&h.state,'bad hypothesis');
            for(const seed of seeds){
             const state=reseed(copy(h.state),seed);
             publicContract(publicView(state));
             assert.equal(hash(publicView(state)),pHash,'reseeding altered root public observation');
             particles.push({id:h.id,seed,p:h.p/seeds.length,state});
            }
           }
           assert.equal(hash(observation),pHash,'input mutated');
           assert.deepEqual(hypotheses.map(x=>hash(x.state)),before,'source hypotheses mutated');
           distribution(particles);
           return particles;
          }
          function posteriorFromMembers(members,priorIds){
           assert(Array.isArray(priorIds)&&priorIds.length>0&&new Set(priorIds).size===priorIds.length,'invalid hypothesis catalog');
           const by=Object.fromEntries(priorIds.map(id=>[id,0]));
           let mass=0;
           for(const member of members){
            assert(Object.hasOwn(by,member.id),'world outside declared hypotheses');
            assert(Number.isFinite(member.weight)&&member.weight>0,'bad branch weight');
            by[member.id]+=member.weight;mass+=member.weight;
           }
           assert(mass>0,'empty information set');
           const posterior=priorIds.map(id=>({id,p:by[id]/mass}));
           assert(Math.abs(posterior.reduce((a,b)=>a+b.p,0)-1)<tol);
           return {posterior,observation_probability:mass};
          }
          function search({observation,particles,actions,rootPolicy,futurePolicy,transition,continuation,legalSecond,leaf,maxNodes=50000}){
           publicContract(observation);distribution(particles);validateMoves(actions);
           for(const k of ['rootPolicy','futurePolicy','transition','continuation','legalSecond','leaf']) assert.equal(typeof ({rootPolicy,futurePolicy,transition,continuation,legalSecond,leaf})[k],'function',k+' missing');
           const ids=[...new Set(particles.map(p=>p.id))];
           assert(ids.every(x=>typeof x==='string'&&x),'missing hypothesis id');
           assert(Number.isInteger(maxNodes)&&maxNodes>0&&maxNodes<=200000,'invalid node cap');
           const frozen={observation:hash(observation),particles:particles.map(x=>hash(x.state))};
           let joint=0,second=0,groups=0,terminals=0,switches=0,updated=0,publicOnly=true;
           const likelihoods=rootPolicy(copy(observation));distribution(likelihoods);
           assert(likelihoods.every(x=>typeof x.choice==='string'),'bad opponent choice');
           assert.equal(new Set(likelihoods.map(x=>x.choice)).size,likelihoods.length);
           const prior=posteriorFromMembers(particles.map(x=>({id:x.id,weight:x.p})),ids).posterior;
           const ranked=[];
           const forecastLog=[];
           for(const own of actions){
            let value=0;const infosets=new Map();
            for(const particle of particles){
             for(const b of likelihoods){
              assert(++joint<=maxNodes,'node budget exceeded');
              const result=transition(particle.state,own,b.choice);
              assert(result&&result.state&&typeof result.terminal==='boolean','malformed transition');
              const weight=particle.p*b.p;
              if(result.switchOccurred)switches++;
              if(result.terminal){const v=leaf(result.state);assert(Number.isFinite(v));value+=weight*v;terminals++;continue;}
              const future=continuation(result.state);publicContract(future);
              assert.equal(future.phase,'move','forced switch must be resolved');
              assert(future.turn>observation.turn,'next turn did not advance');
              assert(future.visible_protocol.length>=observation.visible_protocol.length,'history truncation');
              assert.deepEqual(future.visible_protocol.slice(0,observation.visible_protocol.length),observation.visible_protocol,'retroactive public event edit');
              const key=hash(future);
              if(!infosets.has(key))infosets.set(key,{observation:future,members:[]});
              else assert.deepEqual(infosets.get(key).observation,future,'information set hash collision');
              infosets.get(key).members.push({id:particle.id,weight,state:result.state});
             }
            }
            groups+=infosets.size;
            for(const info of infosets.values()){
             const current=posteriorFromMembers(info.members,ids);
             const options=legalSecond(copy(info.observation));validateMoves(options);
             // Future policy has public observation and posterior probabilities ONLY.
             const choices=futurePolicy(copy(info.observation),copy(current.posterior));distribution(choices);
             assert.equal(new Set(choices.map(x=>x.choice)).size,choices.length);
             const distance=current.posterior.reduce((s,x,i)=>s+Math.abs(x.p-prior[i].p),0);
             if(distance>1e-10)updated++;
             let optimal=-Infinity,optimalAction=null;
             for(const secondOwn of options){
              let utility=0;
              for(const member of info.members){
               for(const enemy of choices){
                assert(++joint<=maxNodes,'node budget exceeded');
                const result=transition(member.state,secondOwn,enemy.choice);
                assert(result&&result.state&&typeof result.terminal==='boolean');
                const v=leaf(result.state);assert(Number.isFinite(v));
                utility+=member.weight*enemy.p*v;second++;
                if(result.switchOccurred)switches++;
                if(result.terminal)terminals++;
               }
              }
              if(utility>optimal+1e-10 || (Math.abs(utility-optimal)<=1e-10&&(optimalAction===null||secondOwn<optimalAction))){optimal=utility;optimalAction=secondOwn;}
             }
             assert(optimalAction!==null);
             value+=optimal;
             forecastLog.push({root_action:own,public_hash:hash(info.observation),posterior:current.posterior,
              public_probability:Number(current.observation_probability.toFixed(12)),second_action:optimalAction,
              future_opponent_probabilities:choices,posterior_changed:distance>1e-10});
            }
            ranked.push({choice:own,value:Number(value.toFixed(9)),future_public_groups:infosets.size});
           }
           assert.equal(hash(observation),frozen.observation,'root modified');
           assert.deepEqual(particles.map(x=>hash(x.state)),frozen.particles,'private particles modified');
           ranked.sort((a,b)=>b.value-a.value||a.choice.localeCompare(b.choice));
           return {selected:ranked[0].choice,ranked,information_sets:forecastLog,
            stats:{joint_nodes:joint,second_turn_nodes:second,public_information_sets:groups,
             posterior_changed_groups:updated,terminal_branches:terminals,forced_switch_branches:switches,
             particles:particles.length,hypotheses:ids.length,depth_joint_turns:2,public_information_only:publicOnly},
            limitations:'Finite seed scenarios, fixed fixture, uncalibrated policies; not exact chance distribution or Champions certification'};
          }
          module.exports={distribution,validateMoves,expandSeeds,posteriorFromMembers,search};
          R2728_INFOSET
          printf '%s  %s\n' '763e269de6553c1e496274b6774595a827d80682ad73d3882837f412c5f585b4' './r2728-multiseed-infoset.cjs' | sha256sum -c -
          node --check ./r2728-multiseed-infoset.cjs
