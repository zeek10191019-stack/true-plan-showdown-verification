           const forceLegal=legalActions(forced).map(x=>x.choice);
           assert.deepEqual(forceLegal,['switch 2','switch 3']);
           assert.equal(oracleAccepted(f,'p2',forceLegal),2);
           const mutate=(mod)=>{const o=copy(normal);mod(o);return legalActions(o).map(x=>x.choice)};
           const cases=[
