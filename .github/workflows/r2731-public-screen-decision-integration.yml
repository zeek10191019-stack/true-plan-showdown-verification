      - name: R27.30 public-next-action log evaluation and strict quarantine tests
        shell: bash
        working-directory: ${{ runner.temp }}/showdown
        run: |
          set -euo pipefail
          cat > ./r2730-public-evaluation.cjs <<'R2730_EVAL'
          'use strict';
          /** R27.30 strict observation-to-next-move evaluator. Does not retrieve replays.
           * Distinguishes PUBLIC_REPLAY_UNVERIFIED from PINNED_SHOWDOWN_SCRIPTED.
           */
          const assert=require('node:assert/strict');
          const crypto=require('node:crypto');
          const CATS=Object.freeze(['attack','setup','status','defend']);
          const SYN='PINNED_SHOWDOWN_SCRIPTED';
          const PUBLIC='PUBLIC_REPLAY_UNVERIFIED';
          const MOVE_CLASS=Object.freeze({
            'Swords Dance':'setup','Quiver Dance':'setup',
            'Will-O-Wisp':'status','Thunder Wave':'status','Toxic':'status',
            'Flamethrower':'attack','Rock Slide':'attack','Smack Down':'attack','Bite':'attack',
            'Protect':'defend','Endure':'defend','Rest':'defend',
          });
          const sha=s=>crypto.createHash('sha256').update(typeof s==='string'?s:JSON.stringify(s)).digest('hex');
          const stable=x=>Array.isArray(x)?x.map(stable):x&&typeof x==='object'?Object.fromEntries(Object.keys(x).sort().map(k=>[k,stable(x[k])])):x;
          function exactShape(x,keys,label){
           assert(x&&typeof x==='object'&&!Array.isArray(x),label+' must be object');
           assert.deepEqual(Object.keys(x).sort(),keys.slice().sort(),label+' shape rejected');
          }
          function validateProvenance(meta){
           exactShape(meta,['kind','source_id','source_uri','format_id','ingest_verified'], 'source metadata');
           assert(typeof meta.source_id==='string'&&/^[A-Za-z0-9_-]{3,90}$/.test(meta.source_id),'invalid source ID');
           assert(meta.format_id==='gen9championsbssregmc','out of scope game format');
           assert(meta.ingest_verified===true||meta.ingest_verified===false,'bad verification flag');
           if(meta.kind===SYN){
            assert(meta.source_uri===null&&meta.ingest_verified===true,'synthetic source invalid');
            return {scorable:true,origin:'SYNTHETIC_SIMULATOR_ONLY'};
           }
           if(meta.kind===PUBLIC){
            assert(meta.ingest_verified===false,'unverified public logs cannot be certified');
            assert(typeof meta.source_uri==='string','public replay URL missing');
            const url=new URL(meta.source_uri);
            assert(url.protocol==='https:'&&url.hostname==='replay.pokemonshowdown.com', 'public source host rejected');
            assert(/^\/[A-Za-z0-9-]{8,120}(?:\.log)?$/.test(url.pathname),'replay URL path rejected');
            assert(!url.username&&!url.password&&!url.search&&!url.hash&&!url.port,'unexpected URL fields');
            return {scorable:false,origin:'PUBLIC_REPLAY_QUARANTINED_NOT_INGESTED'};
           }
           throw Error('unknown origin category');
          }
          function checkPublic(obs){
           exactShape(obs,['phase','turn','own_request','visible_protocol'],'public observation');
           assert(['move','switch'].includes(obs.phase),'invalid phase');
           assert(Number.isInteger(obs.turn)&&obs.turn>=1,'bad turn');
           assert(Array.isArray(obs.visible_protocol)&&obs.visible_protocol.every(x=>typeof x==='string'&&x.length<4000),'bad protocol');
           for(const x of obs.visible_protocol){
            assert(!/^\|(?:split|request|seed|inputlog|sentchoice|queryresponse|debug|private|omniscient)(?:\||$)/i.test(x),'private or unsupported protocol channel');
            assert(!/[\u0000\u0001\u0002]/.test(x),'control chars');
           }
           assert(obs.own_request&&typeof obs.own_request==='object','missing player-owned request');
           return sha(JSON.stringify(stable(obs)));
          }
          function extractNextLabel(before,after,side='p2'){
           assert(side==='p2'||side==='p1','bad side');
           checkPublic(before);checkPublic(after);
           const first=before.visible_protocol,second=after.visible_protocol;
           assert(second.length>=first.length,'history truncated');
           assert.deepEqual(second.slice(0,first.length),first,'public history modified');
           assert(after.turn>=before.turn,'turn regressed');
           const delta=second.slice(first.length);
           const moves=delta.filter(s=>s.startsWith('|move|'+side+'a: '));
           assert(moves.length===1,'need exactly one revealed opponent action');
           const segments=moves[0].split('|');
           assert(segments.length>=5&&segments[3],'malformed public move event');
           const move=segments[3], label=MOVE_CLASS[move];
           assert(label,'unmapped move: quarantined rather than guessed: '+move);
           return {move,label,delta_length:delta.length};
          }
          function validateForecast(f){
           exactShape(f,CATS,'forecast');
           assert(CATS.every(k=>typeof f[k]==='number'&&Number.isFinite(f[k])&&f[k]>=0&&f[k]<=1),'probability range');
           assert(Math.abs(CATS.reduce((s,k)=>s+f[k],0)-1)<1e-8,'forecast not normalized');
           return true;
          }
          function buildRow({before,after,forecast,provenance,episode,side='p2'}){
           assert(validateProvenance(provenance).scorable,'quarantined replay cannot become evidence');
           validateForecast(forecast);
           assert(typeof episode==='string'&&/^[A-Za-z0-9_-]+$/.test(episode),'bad episode');
           const move=extractNextLabel(before,after,side);
           const context_sha=checkPublic(before);
           return {id:sha(episode+'|'+before.turn+'|'+context_sha+'|'+move.move),episode,
            origin:SYN,turn:before.turn,public_context_sha256:context_sha,
            public_next_sha256:checkPublic(after),revealed_move:move.move,
            label:move.label,forecast:{...forecast},observable_event_count:move.delta_length};
          }
          function metric(rows){
           assert(Array.isArray(rows)&&rows.length>0,'missing scoring rows');
           let nll=0,brier=0,top1=0,unll=0,ubrier=0;
           for(const row of rows){
            assert(row.origin===SYN,'unverified real replay in evaluation');
            validateForecast(row.forecast);assert(CATS.includes(row.label),'unknown class');
            nll-=Math.log(Math.max(row.forecast[row.label],1e-12));
            unll-=Math.log(.25);
            brier+=CATS.reduce((s,k)=>s+(row.forecast[k]-(k===row.label?1:0))**2,0);
            ubrier+=CATS.reduce((s,k)=>s+(.25-(k===row.label?1:0))**2,0);
            const top=CATS.reduce((a,k)=>row.forecast[k]>row.forecast[a]?k:a,CATS[0]);
            top1+=Number(top===row.label);
           }
           return {n:rows.length,log_loss:nll/rows.length,brier:brier/rows.length,
            top1_accuracy:top1/rows.length,uniform_log_loss:unll/rows.length,uniform_brier:ubrier/rows.length};
          }
          function evaluateEpisodes(rows){
           assert(Array.isArray(rows)&&rows.length>0,'empty episodes');
           const ids=new Set(),groups=new Set(),contextPairs=new Map(),contexts=new Set();
           for(const row of rows){
            assert(!ids.has(row.id),'duplicate row identity');ids.add(row.id);
            assert(row.origin===SYN,'real replays have not been independently verified');
            groups.add(row.episode);contexts.add(row.public_context_sha256);
            const key=row.public_context_sha256+'|'+row.label;
            if(contextPairs.has(key)){
             const prior=contextPairs.get(key);
             assert.deepEqual(row.forecast,prior.forecast,'identical visible context has divergent forecasts');
            }else contextPairs.set(key,row);
           }
           const unique=[...contextPairs.values()];
           return {origin:'PINNED_SHOWDOWN_SCRIPTED_ONLY',episodes:groups.size,rows:rows.length,
            distinct_public_contexts:contexts.size,distinct_public_context_label_pairs:unique.length,
            raw:metric(rows),deduplicated:metric(unique),
            no_human_opponent_accuracy_claim:true,model_frozen_before_outcome:true,
            labels_public_reveal_only:true};
          }
          function splitGuard(rows){
           assert(rows.length>1,'insufficient split rows');
           let lastTrain=-Infinity,firstHoldout=Infinity;const groupSplit=new Map(),contextSplit=new Map();
           for(const r of rows){
            exactShape(r,['id','group','time','split','public_context_sha256'],'split record');
            assert(r.split==='train'||r.split==='holdout','invalid split');
            assert(Number.isInteger(r.time)&&r.time>=0,'invalid time');
            assert(typeof r.group==='string'&&r.group.length>0,'missing game group');
            assert(typeof r.id==='string'&&r.id.length>0,'missing row id');
            if(r.split==='train')lastTrain=Math.max(lastTrain,r.time);else firstHoldout=Math.min(firstHoldout,r.time);
            for(const [map,key] of [[groupSplit,r.group],[contextSplit,r.public_context_sha256]]){
             assert(typeof key==='string'&&key.length>0,'empty group or hash');
             if(map.has(key))assert.equal(map.get(key),r.split,'cross-split leakage');else map.set(key,r.split);
            }
           }
           assert(Number.isFinite(lastTrain)&&Number.isFinite(firstHoldout),'train/holdout incomplete');
           assert(lastTrain<firstHoldout,'chronological leakage');
           return {groups:groupSplit.size,distinct_contexts:contextSplit.size,train_last:lastTrain,holdout_first:firstHoldout};
          }
          module.exports={SYN,PUBLIC,CATS,MOVE_CLASS,sha,stable,validateProvenance,checkPublic,extractNextLabel,validateForecast,buildRow,metric,evaluateEpisodes,splitGuard};
          R2730_EVAL
