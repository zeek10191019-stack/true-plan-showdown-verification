           return {receipt:{schema:'TRUE_PLAN_R2726_PUBLIC_TWO_JOINT_TURN_INFOSET_EXPECTIMAX_V2',
            status:'PASS_PUBLIC_SYNTHETIC_ONLY',format:format.name,pinned_commit:'aa17ca0fac8bc5605df673bd8774c2d0e91efa43',
