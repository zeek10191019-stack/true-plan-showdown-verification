          'use strict';
          /** Public Showdown synthetic fixture ingestion. Never authenticates a human replay. */
          const assert=require('node:assert/strict');
          const fs=require('node:fs');const path=require('node:path');
          const {Battle}=require('./dist/sim/battle');
          const {Dex}=require('./dist/sim/dex');
          const {makeVariants}=require('./r2723-multiturn-belief-boundaries.cjs');
          const {viewer}=require('./r2722-rng-observation-boundaries.cjs');
          const {PublicBelief}=require('./r2724-bayesian-belief-action-forecast.cjs');
          const {runOnce}=require('./r2720-faint-force-switch-win.cjs');
          const {legalActions,decide}=require('./r2725-baseline-decision-core.cjs');
          const {SYN,PUBLIC,buildRow,evaluateEpisodes,validateProvenance,sha,checkPublic}=require('./r2730-public-evaluation.cjs');
          const copy=x=>JSON.parse(JSON.stringify(x));
          const PREFIX=[['move 3','move 2'],['move 4','move 3'],['move 3','move 2'],['move 4','move 3'],['move 3','move 1']];
          const SEED='1,2,3,4';
          function episode(format,dex,v){
           const b=new Battle({formatid:format.id,seed:SEED,strictChoices:true,
            p1:{name:'Public-P1',team:v.teams.p1},p2:{name:'Public-P2',team:v.teams.p2}});
           assert.equal(b.requestState,'teampreview');b.makeChoices('team 456','team 456');
           assert.equal(b.requestState,'move');
           const belief=new PublicBelief(dex),out=[];
           const provenance={kind:SYN,source_id:'synthetic-'+v.id,source_uri:null,format_id:format.id,ingest_verified:true};
           for(const [a,c] of PREFIX){
