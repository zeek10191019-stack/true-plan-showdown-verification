             rootPolicy:obs=>policy(obs,forecast(post.posterior),alpha),
             futurePolicy:(publicObs,newPosterior)=>{
              const complete=post.posterior.map(x=>newPosterior.find(y=>y.id===x.id)||{id:x.id,p:0});
