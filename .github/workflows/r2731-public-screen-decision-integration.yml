          const b64='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIHWP4z8DwHwAFgAI/ScLttAAAAABJRU5ErkJggg==';
          const pixels=Buffer.from(b64,'base64');
          let checks=0;
          function okay(fn){fn();checks++}
          function bad(code,fn){assert.throws(fn,e=>e.code===code,code);checks++}
          const copy=x=>structuredClone(x);
          const now=1770000000000;
          const frame=(id='frame0001',t=now-500)=>({frame_id:id,captured_at_ms:t,data:Buffer.from(pixels),mime:'image/png',sha256:sha256(pixels),source_id:'synthetic001',origin:'SYNTHETIC_RENDER_FIXTURE'});
          const obs=(forceSwitch=false)=>({own_request:forceSwitch?{forceSwitch:[true],side:{pokemon:[]}}:{active:[{moves:[{move:'A',pp:1}]}],side:{pokemon:[]}},visible_protocol:['|turn|1']});
          const perception=(f,o=obs(),phase='move')=>({frame_id:f.frame_id,frame_sha256:f.sha256,recognized_by:'SYNTHETIC_ORACLE_TEST',phase,confidence:{phase:1,own_actor:1,legal_request:1},observation:o,unknown_critical:false,observed_at_ms:f.captured_at_ms+100});
          const forecast={attack:.25,setup:.25,status:.25,defend:.25};
          function engine({legalActions=(x)=>x.own_request.forceSwitch?[{choice:'switch 2'}]:[{choice:'move 1'}],decide=()=>({selected:'move 1'}),clock=()=>now}={}){return new ScreenDecisionBoundary({legalActions,decide,clock})}
          const ready=(e,f=frame(),p=perception(f))=>e.evaluate(f,p,forecast,now+3000);
          okay(()=>{let r=ready(engine());assert.equal(r.selected,'move 1');assert.equal(r.recommendation_only,true);assert.equal(r.real_screen_perception_certified,false)});
          okay(()=>{let f=frame('frame0002');let r=ready(engine({decide:()=>({selected:'switch 2'}) ,legalActions:()=>[{choice:'switch 2'}]}),f,perception(f,obs(true),'switch'));assert.equal(r.phase,'switch')});
          bad('REPLAY_OR_OUT_OF_ORDER_FRAME',()=>{let e=engine();ready(e);ready(e)});
          bad('REPLAY_OR_OUT_OF_ORDER_FRAME',()=>{let e=engine();ready(e,frame('frame0003',now-250));ready(e,frame('frame0004',now-500))});
          bad('STALE_FRAME',()=>ready(engine(),frame('frame0005',now-2200)));
          bad('FUTURE_FRAME',()=>ready(engine(),frame('frame0006',now+101)));
          bad('BAD_MAGIC',()=>{let f=frame('frame0007');f.data[0]=0;f.sha256=sha256(f.data);ready(engine(),f)});
          bad('FRAME_HASH_MISMATCH',()=>{let f=frame('frame0008');f.sha256='x';ready(engine(),f)});
          bad('PERCEPTION_FRAME_MISMATCH',()=>{let f=frame('frame0009'),p=perception(f);p.frame_sha256='x';ready(engine(),f,p)});
          bad('INSUFFICIENT_CONFIDENCE',()=>{let f=frame('frame0010'),p=perception(f);p.confidence.legal_request=.5;ready(engine(),f,p)});
          bad('CRITICAL_UNKNOWNS',()=>{let f=frame('frame0011'),p=perception(f);p.unknown_critical=true;ready(engine(),f,p)});
          bad('PHASE_INCONSISTENT',()=>{let f=frame('frame0012'),p=perception(f);p.phase='switch';ready(engine(),f,p)});
          bad('PRIVILEGED_FIELD_REJECTED:rng',()=>{let f=frame('frame0013'),p=perception(f);p.observation.rng='hidden';ready(engine(),f,p)});
          bad('PRIVILEGED_FIELD_REJECTED:true_item',()=>{let f=frame('frame0014'),p=perception(f);p.observation.opponent={true_item:'hidden'};ready(engine(),f,p)});
          bad('NO_PUBLIC_REQUEST',()=>{let f=frame('frame0015'),p=perception(f);delete p.observation.own_request;ready(engine(),f,p)});
          bad('BAD_FORECAST',()=>{let f=frame('frame0016');engine().evaluate(f,perception(f),{attack:1,setup:1,status:0,defend:0},now+3000)});
          bad('PROPOSED_ILLEGAL_ACTION',()=>ready(engine({decide:()=>({selected:'switch 6'})})));
          bad('PROVIDER_MUTATED_OBSERVATION',()=>ready(engine({decide:(o)=>{o.visible_protocol.push('fraud');return {selected:'move 1'}}})));
          bad('DEADLINE_UNSAFE',()=>{let f=frame('frame0017');engine().evaluate(f,perception(f),forecast,now+499)});
          bad('DECISION_DEADLINE_EXCEEDED',()=>{let f=frame('frame0018');let ticks=0;engine({clock:()=>now+(ticks++===0?0:2900)}).evaluate(f,perception(f),forecast,now+3000)});
          bad('UNVALIDATED_VISUAL_RECOGNIZER',()=>{let f=frame('frame0019'),p=perception(f);p.recognized_by='GENERIC_OCR';ready(engine(),f,p)});
          bad('REAL_FRAME_REQUIRES_INDEPENDENT_VISUAL_CERTIFICATION',()=>{let f=frame('frame0020');f.origin='REAL_CAPTURE';ready(engine(),f,perception(f))});
          bad('OBSERVATION_TIMESTAMP_INVALID',()=>{let f=frame('frame0021'),p=perception(f);p.observed_at_ms=f.captured_at_ms-1;ready(engine(),f,p)});
          console.log(JSON.stringify({status:'LOCAL_UNIT_PASS',checks,synthetic_only:true,real_screen_gate:'BLOCKED',native33:'0/33',exact34:'0/34',formal:'DENY'}));
          R2731_TEST
          cat > ./r2731-native-vertical.cjs <<'R2731_NATIVE'
          'use strict';
          /** R27.31: pinned Showdown native request -> synthetic frame-tagged observation ->
           * existing legal/decide -> native Showdown choice oracle. This proves an
           * integration contract, NOT visual pixel recognition or real Champions parity.
           */
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const {Battle}=require('./dist/sim/battle');
          const {makeVariants}=require('./r2723-multiturn-belief-boundaries.cjs');
          const {viewer}=require('./r2722-rng-observation-boundaries.cjs');
          const {runOnce}=require('./r2720-faint-force-switch-win.cjs');
          const {legalActions,decide}=require('./r2725-baseline-decision-core.cjs');
          const {ScreenDecisionBoundary,sha256}=require('./r2731-screen-decision-boundary.cjs');
          const SEED='1,2,3,4';
          const PIX=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIHWP4z8DwHwAFgAI/ScLttAAAAABJRU5ErkJggg==','base64');
          const FORECAST=Object.freeze({attack:.25,setup:.25,status:.25,defend:.25});
          const NOW=1770000000000;
          const copy=x=>JSON.parse(JSON.stringify(x));
          function packet(tag,obs,phase){
           const f={frame_id:'frame_'+tag,captured_at_ms:NOW-500,data:Buffer.from(PIX),mime:'image/png',sha256:sha256(PIX),source_id:'pinned_fixture',origin:'SYNTHETIC_RENDER_FIXTURE'};
           const p={frame_id:f.frame_id,frame_sha256:f.sha256,recognized_by:'SYNTHETIC_ORACLE_TEST',phase,confidence:{phase:1,own_actor:1,legal_request:1},observation:copy(obs),unknown_critical:false,observed_at_ms:NOW-400};
           return {f,p};
          }
          function proveOracle(b,side,selected){
           const clone=Battle.fromJSON(JSON.stringify(b.toJSON()));
           assert.equal(clone.getSide(side).choose(selected),true,'native Showdown rejected decision');
           assert(!clone.getSide(side).choice.error,'native Showdown choice error');
           return true;
          }
          function run(output){
           const {format,cases}=makeVariants();
           assert.equal(format.id,'gen9championsbssregmc');
           const traces=[];
           for(let i=0;i<cases.length;i++){
            const v=cases[i];
            const b=new Battle({formatid:format.id,seed:SEED,strictChoices:true,p1:{name:'Public-P1',team:v.teams.p1},p2:{name:'Public-P2',team:v.teams.p2}});
            assert.equal(b.requestState,'teampreview');
            b.makeChoices('team 456','team 456');
            assert.equal(b.requestState,'move');
            const obs=copy(viewer(b,'p1'));
            const {f,p}=packet(String(i).padStart(4,'0'),obs,'move');
            const boundary=new ScreenDecisionBoundary({legalActions,decide,clock:()=>NOW});
            const out=boundary.evaluate(f,p,FORECAST,NOW+3000);
            assert.equal(out.phase,'move');
            assert.equal(out.legal_choices.length,6);
            assert.equal(proveOracle(b,'p1',out.selected),true);
            assert.equal(out.recommendation_only,true);
            traces.push({world_id:v.id,origin:'PINNED_SHOWDOWN_SCRIPTED_PLUS_SYNTHETIC_FRAME_NOT_PIXELS',selected:out.selected,legal_count:out.legal_choices.length,public_observation_sha256:out.public_observation_sha256,frame_sha256:out.frame_sha256,oracle_native_choice_accepted:true,real_screen:out.real_screen_perception_certified});
           }
           const forced=Battle.fromJSON(JSON.stringify(runOnce().states[1].state));
           assert.equal(forced.requestState,'switch');
           const forcedObs=copy(viewer(forced,'p2'));
           const {f,p}=packet('forced0001',forcedObs,'switch');
           const boundary=new ScreenDecisionBoundary({legalActions,decide,clock:()=>NOW});
           const out=boundary.evaluate(f,p,FORECAST,NOW+3000);
           assert.equal(out.phase,'switch');
           assert.equal(out.legal_choices.length,2);
           proveOracle(forced,'p2',out.selected);
           traces.push({world_id:'forced_switch',origin:'PINNED_SHOWDOWN_SCRIPTED_PLUS_SYNTHETIC_FRAME_NOT_PIXELS',selected:out.selected,legal_count:out.legal_choices.length,public_observation_sha256:out.public_observation_sha256,frame_sha256:out.frame_sha256,oracle_native_choice_accepted:true,real_screen:false});
           for(let j=1;j<traces.length-1;j++){
            assert.equal(traces[j].public_observation_sha256,traces[0].public_observation_sha256,'hidden fixture divergence in public decision entry');
            assert.equal(traces[j].selected,traces[0].selected,'hidden fixture changed public decision');
           }
           const report={schema:'TRUE_PLAN_R2731_NATIVE_PUBLIC_OBSERVATION_TO_DECISION_BOUNDARY_V1',
            status:'PASS_PINNED_SHOWDOWN_SYNTHETIC_INPUT_ONLY',
            pinned_commit:'aa17ca0fac8bc5605df673bd8774c2d0e91efa43',
            research_worlds:6,native_oracle_decisions_accepted:7,move_phase_decisions:6,forced_switch_decisions:1,
            hidden_variant_public_decision_noninterference:true,
            frame_source:'SYNTHETIC_ONE_PIXEL_IMAGE_ASSOCIATED_WITH_SHOWDOWN_ORACLE_PUBLIC_OBSERVATION',
            actual_frame_to_battle_observation_implemented:false,
            actual_capture_input_certified:false,actual_live_latency_measured:false,
            does_not_establish_pixel_recognition_or_model_strength:true,
            single_existing_legal_action_provider:'r2725-baseline-decision-core.cjs',
            hard_stop:{native33:'0/33',exact34:'0/34',actual_game:'0/30',formal_increment:0,gate:'DENY'}};
           if(output){fs.mkdirSync(output,{recursive:true});const put=(name,data)=>fs.writeFileSync(path.join(output,name),JSON.stringify(data,null,2)+'\n');put('r2731-receipt.json',report);put('r2731-native-public-choice-traces.json',traces);}
           return {report,traces};
          }
          if(require.main===module){const r=run(process.argv[2]||'r2731-evidence');console.log('R2731_RESULT '+JSON.stringify(r.report));}
          module.exports={run};
          R2731_NATIVE
          printf '%s  %s\n' 05fe683a2312e888e736c27053f81a39e847c21cc7a4208f09355d03d89bc592 r2731-screen-decision-boundary.cjs | sha256sum -c -
          printf '%s  %s\n' 587d5e851b07e903885537323753cef7822f24f2b74649de1f0e6d021540d655 test_r2731_boundary.cjs | sha256sum -c -
          printf '%s  %s\n' a76ea31050afe985d44cfafdfff661578f1ce6ce00dcd2658fc38eba8d9d946a r2731-native-vertical.cjs | sha256sum -c -
          node --check r2731-screen-decision-boundary.cjs
          node --check test_r2731_boundary.cjs
          node --check r2731-native-vertical.cjs
          node test_r2731_boundary.cjs | tee r2731-unit.log
          node r2731-native-vertical.cjs ./r2731-evidence | tee r2731-native.log
          cp r2731-screen-decision-boundary.cjs test_r2731_boundary.cjs r2731-native-vertical.cjs ./r2731-evidence/
      - name: Audit R27.31 public synthetic frame boundary and certification hard stop
        shell: bash
        working-directory: ${{ runner.temp }}/showdown
        run: |
          set -euo pipefail
          python3 - <<'PY_R2731_AUDIT'
          import json
          from pathlib import Path
          p=Path('r2731-evidence')
          required={'r2731-screen-decision-boundary.cjs','test_r2731_boundary.cjs','r2731-native-vertical.cjs','r2731-receipt.json','r2731-native-public-choice-traces.json'}
          assert {x.name for x in p.iterdir()}==required
          receipt=json.loads((p/'r2731-receipt.json').read_text())
          traces=json.loads((p/'r2731-native-public-choice-traces.json').read_text())
          assert receipt['status']=='PASS_PINNED_SHOWDOWN_SYNTHETIC_INPUT_ONLY'
          assert receipt['research_worlds']==6 and len(traces)==7
          assert receipt['native_oracle_decisions_accepted']==7
          assert receipt['actual_frame_to_battle_observation_implemented'] is False
          assert receipt['actual_capture_input_certified'] is False
          assert receipt['actual_live_latency_measured'] is False
          assert all(t['oracle_native_choice_accepted'] for t in traces)
          assert all(not t['real_screen'] for t in traces)
          assert receipt['hard_stop']=={'native33':'0/33','exact34':'0/34','actual_game':'0/30','formal_increment':0,'gate':'DENY'}
          assert receipt['single_existing_legal_action_provider']=='r2725-baseline-decision-core.cjs'
          print('R2731_SYNTHETIC_VERTICAL_BOUNDARY_AUDIT_PASS')
          PY_R2731_AUDIT
          (cd r2731-evidence && sha256sum * > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Upload R27.31 public research boundary evidence
