           exact(perception,['frame_id','frame_sha256','recognized_by','phase','confidence','observation','unknown_critical','observed_at_ms']);
           if(perception.frame_id!==frame.frame_id||perception.frame_sha256!==frame.sha256)reject('PERCEPTION_FRAME_MISMATCH');
           if(perception.recognized_by!=='SYNTHETIC_ORACLE_TEST')reject('UNVALIDATED_VISUAL_RECOGNIZER');
