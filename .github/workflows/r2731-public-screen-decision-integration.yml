                  manifest[name]=dig
              assert set(manifest)==required-{'SHA256SUMS.txt'},'incomplete manifest'
              load=lambda f:json.loads((root/f).read_text())
              r=load('r2729-receipt.json');p=load('r2729-parent-reanalysis.json')
              d=load('r2729-controlled-discrimination.json');c=load('r2729-synthetic-calibration.json')
              s=load('r2729-synthetic-scenario-weights.json')
              assert r['schema']=='TRUE_PLAN_R2729_DISCRIMINATION_AND_CALIBRATION_V1'
              assert r['status']=='PASS_PUBLIC_SYNTHETIC_ONLY'
              assert r['hard_stop']=={'native33':'0/33','exact34':'0/34','actual_game':'0/30','formal_increment':0,'gate':'DENY'}
              assert r['baseline_18_searches']==p['searches']==18
              assert r['baseline_alpha_choice_changes']==p['variant_changes']==0
              assert len(p['rankings'])==6
              assert p['parent_receipt_sha256']=='6d2815873b0e505450c67f213a4db6b7dc8707c82eef1980de0af957f09ef71e'
              assert p['parent_traces_sha256']=='15900bc48127dd429751b4a415d5f754b8ffcc15de10f94dd7a0abae159acab7'
              assert d['origin']=='SYNTHETIC_ONLY' and len(d['grid'])==5
              assert d['flips_detected'] and d['oracle_matched']
              assert [x['root_attack_probability'] for x in d['grid']]==[.1,.25,.5,.75,.9]
              expected_selections=['move 2','move 2','move 1','move 1','move 1']
              for row,selection in zip(d['grid'],expected_selections):
                  x=row['root_attack_probability']
                  assert row['selected']==selection
                  predicted={'move 1':x*10+(1-x)*(-10)+2,'move 2':x*(-10)+(1-x)*10+2}
                  assert len(row['ranked'])==2
                  for q in row['ranked']:
                      assert math.isclose(q['value'],predicted[q['choice']],abs_tol=1e-8), 'independent expected utility mismatch'
                  assert row['stats']['particles']==8 and row['stats']['second_turn_nodes']>0
              assert c['origin']=='SYNTHETIC_ONLY' and c['split']=={'train':80,'holdout':32,'groups':28}
              assert r['synthetic_opponent_records']==112
              assert c['alpha'] in [0,.25,.5,.75,1]
              # Independently recompute all train and holdout loss metrics, separately from Node implementation.
              profiles=[{'attack':.75,'setup':.10,'status':.10,'defend':.05},
                        {'attack':.10,'setup':.75,'status':.10,'defend':.05},
                        {'attack':.10,'setup':.10,'status':.75,'defend':.05},
                        {'attack':.10,'setup':.10,'status':.05,'defend':.75}]
              cats=['attack','setup','status','defend']
              train=[];holdout=[]
              for group in range(28):
                  i=group%4
                  for j in range(4):
                      label=cats[i] if j in (0,1) else cats[(i+j)%4]
                      (train if group<20 else holdout).append((profiles[i],label))
              def metrics(records,alpha):
                  ll=0;brier=0
                  for forecast,label in records:
                      prob={k:(1-alpha)/4+alpha*forecast[k] for k in cats}
                      ll-=math.log(max(1e-12,prob[label]))
                      brier+=sum((prob[k]-int(k==label))**2 for k in cats)
                  return ll/len(records),brier/len(records)
              grid=[(a,metrics(train,a)[0]) for a in [0,.25,.5,.75,1]]
              chosen=sorted(grid,key=lambda x:(x[1],x[0]))[0][0]
              assert chosen==c['alpha']==r['selected_mixing_alpha'],'train-only alpha mismatch'
