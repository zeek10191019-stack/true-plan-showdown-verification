            if(!Object.values(forecast).every(z=>Number.isFinite(z)&&z>=0&&z<=1)||Math.abs(Object.values(forecast).reduce((a,b)=>a+b,0)-1)>1e-9)reject('BAD_FORECAST');
            const legal=this.legalActions(obs);
            if(!Array.isArray(legal)||!legal.every(a=>a&&typeof a.choice==='string'))reject('INVALID_PROVIDER_LEGAL_ACTIONS');
            if(!legal.length)reject('NO_LEGAL_ACTIONS');
            const proposed=this.decide(obs,Object.freeze({...forecast}));
            if(hashObject(obs)!==beforeHash)reject('PROVIDER_MUTATED_OBSERVATION');
            if(!proposed||typeof proposed.selected!=='string'||!legal.some(a=>a.choice===proposed.selected))reject('PROPOSED_ILLEGAL_ACTION');
            if(this.clock()>deadlineMs-250)reject('DECISION_DEADLINE_EXCEEDED');
            this.seen.add(frame.frame_id);this.lastTimestamp=frame.captured_at_ms;
            return Object.freeze({status:'PASS_SYNTHETIC_BOUNDARY_ONLY',source:'SYNTHETIC_RENDER_FIXTURE',phase:x.phase,frame_id:frame.frame_id,frame_sha256:frame.sha256,public_observation_sha256:beforeHash,selected:proposed.selected,legal_choices:legal.map(a=>a.choice),recommendation_only:true,never_auto_execute:true,real_screen_perception_certified:false,native33:'0/33',exact34:'0/34',real_game:'0/30',formal:'DENY'});
           }
          }
          module.exports={ScreenDecisionBoundary,sha256,hashObject,validateFrame,validatePerception};
          R2731_BOUNDARY
          cat > ./test_r2731_boundary.cjs <<'R2731_TEST'
          'use strict';
          const assert=require('node:assert/strict');
