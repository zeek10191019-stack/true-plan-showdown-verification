            out.push(buildRow({before:prior,after,forecast,provenance,episode:v.id}));
           }
           return out;
          }
          function oracleAccepted(b,who,choices){
           let checked=0;
           for(const item of choices){
            const clone=Battle.fromJSON(JSON.stringify(b.toJSON()));
            assert.equal(clone.getSide(who).choose(item),true,'Showdown rejected '+item);
            assert(!clone.getSide(who).choice.error,'Showdown choice error '+item);
            checked++;
           }
