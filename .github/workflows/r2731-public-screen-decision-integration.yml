           const fc={attack:.25,setup:.25,status:.25,defend:.25};
           const normalLegal=legalActions(normal).map(x=>x.choice);
           assert.deepEqual(normalLegal,['move 1','move 2','move 3','move 4','switch 2','switch 3']);
