           if(typeof frame.source_id!=='string'||!/^[-A-Za-z0-9_]{4,80}$/.test(frame.source_id))reject('BAD_SOURCE_ID');
           if(!Number.isSafeInteger(frame.captured_at_ms))reject('BAD_TIMESTAMP');
           if(frame.captured_at_ms>now+100)reject('FUTURE_FRAME');
           if(now-frame.captured_at_ms>2000)reject('STALE_FRAME');
           if(!Buffer.isBuffer(frame.data)||frame.data.length<16||frame.data.length>MAX_FRAME_BYTES)reject('BAD_FRAME_BYTES');
           if(!['image/png','image/jpeg'].includes(frame.mime))reject('BAD_FRAME_MIME');
