name: R27.31 phase1 public screen-decision boundary (synthetic only)
'on':
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r2731-phase1-screen-boundary-manual
  cancel-in-progress: false
jobs:
  public_research_only:
    name: Pinned Showdown phase1 synthetic input and decision contract
    if: ${{ github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Fetch pinned public source and build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/showdown"
          cd "$RUNNER_TEMP/showdown"
          git init -q
          git remote add origin https://github.com/smogon/pokemon-showdown.git
          git fetch --depth 1 origin aa17ca0fac8bc5605df673bd8774c2d0e91efa43
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = aa17ca0fac8bc5605df673bd8774c2d0e91efa43
          test "$(git rev-parse 'HEAD^{tree}')" = 98c9038b81fa5ed7f1e9818736b701918920501e
          test "$(node --version)" = v22.18.0
          npm ci --no-audit --no-fund
          npm run build
      - name: Verify pinned distribution bytewise
        shell: bash
        working-directory: ${{ runner.temp }}/showdown
        run: |
          set -euo pipefail
          python3 - <<'PY_DIST'
          from pathlib import Path
          import hashlib
          dist=Path('dist')
          items=list(dist.rglob('*'))
          assert not any(p.is_symlink() for p in items)
          files=sorted((p for p in items if p.is_file()),key=lambda p:p.relative_to(dist).as_posix())
          assert len(files)==1094,len(files)
          h=hashlib.sha256()
          for p in files:
            n=p.relative_to(dist).as_posix().encode()
            h.update(len(n).to_bytes(8,'big')); h.update(n)
            h.update(hashlib.sha256(p.read_bytes()).digest())
          assert h.hexdigest()=='3697be28e9736b691f005bc5ad7b56789523fbf4ef04d838fcc91f6cfae9c3df'
          print('R2726_PINNED_DIST_PASS',len(files),h.hexdigest())
          PY_DIST
      - name: Restore publicly audited pinned source modules
        shell: bash
        working-directory: ${{ runner.temp }}/showdown
        run: |
          set -euo pipefail
          fetch() { curl --fail --location --silent --show-error --retry 3 --retry-delay 2 "$1" -o "$2"; }
          fetch 'https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/6b0d3daa8c3957821604fcbd410287e0f7f389d1/.github/workflows/r2720-public-faint-forced-switch-terminal.yml' r2720.yml
          fetch 'https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/9992d08f6c53fcf487cea7c14da0e9fd916cb67c/.github/workflows/r2722-public-rng-observation-noninterference.yml' r2722.yml
          fetch 'https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/a376645c3096220eed6e9b30758cfd7713eedc06/.github/workflows/r2723-public-multiturn-belief-boundaries.yml' r2723.yml
          fetch 'https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/7080a2a37bb3a325e848ea2a910525b3e5ec56bf/.github/workflows/r2724-public-bayes-belief-action-prediction.yml' r2724.yml
          fetch 'https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/main/.github/workflows/r2725-public-baseline-legal-decision.yml' r2725.yml
          # Pin R27.25 to the exact audited Git blob, even though retrieved via main.
          test "$(git hash-object r2725.yml)" = 795ba67d33ae97ae817290b07fe627a463506068
          printf '%s  %s\n' \
            75dc810599d0d91b747f77bb37e1278f6fa7b782364b537c907591f21454933c r2720.yml \
            e59183d4b3e8e01604d94a05bebb8911114448e69d8e906f0739da0becf187a4 r2722.yml \
            5fe1c97be8714313c82392f7901e21debbe036b7b97dadbe32c472654f015b84 r2723.yml \
            e50c3eafc6523a81a236d8f9a2210353f43b29207b482c594a7c0c5b01bc7d83 r2724.yml | sha256sum -c -
          python3 - <<'PY_EXTRACT'
          from pathlib import Path
          mapping=[
            ('r2720.yml','r2720-faint-force-switch-win.cjs','R2720_SOURCE','2886cc68cc71f866bffb775c5c42d51d9d23eebf3136c9dcb399a610e8387f4b'),
            ('r2722.yml','r2722-rng-observation-boundaries.cjs','R2722_SOURCE','0a4fe39d6e1f3ac1c208171b3c38c9d19a388d618baf1b4bfeab78e1c24b8d7e'),
            ('r2723.yml','r2723-multiturn-belief-boundaries.cjs','R2723_SOURCE','fed3b7e13eb09f0ffd2bfcb6fb8497ac39da502781994c56c16dbb846a566c49'),
            ('r2724.yml','r2724-bayesian-belief-action-forecast.cjs','R2724_SOURCE','7291d1fc69850a06ff58e06b5ffb48576e116f106acea3abc1b618947bbf8e44'),
            ('r2725.yml','r2725-baseline-decision-core.cjs','R2725_CORE','bbfd2bf654709c41184ad69fa1d33deb6bdacbac301a824ad054a25cb9d2ff63')]
          import hashlib
          for source,dest,tag,expected in mapping:
            contents=Path(source).read_text()
            marker="          cat > ./"+dest+" <<'"+tag+"'\n"
            assert contents.count(marker)==1,source
            block=contents.split(marker,1)[1].split('\n          '+tag+'\n',1)[0]
            code='\n'.join(line[10:] for line in block.split('\n'))+'\n'
            assert hashlib.sha256(code.encode()).hexdigest()==expected,(source,dest)
            Path(dest).write_text(code)
          PY_EXTRACT
      - name: Build and execute R27.26 corrected information-set expectimax
        shell: bash
        working-directory: ${{ runner.temp }}/showdown
        run: |
          set -euo pipefail
          cat > ./r2726-search-core.cjs <<'R2726_SEARCH'
          'use strict';
          /** Two-joint-turn public-information-set contingent expectimax.
           * Future action maximization is performed ONCE per publicly distinguishable
           * information set, not separately per hidden Showdown particle. Results are
           * synthetic deterministic rollouts and are not calibrated win probabilities.
           */
          const assert=require('node:assert/strict');
          const crypto=require('node:crypto');
          const canonical=x=>Array.isArray(x)?x.map(canonical):x&&typeof x==='object'?Object.fromEntries(Object.keys(x).sort().map(k=>[k,canonical(x[k])])):x;
          const hash=x=>crypto.createHash('sha256').update(JSON.stringify(canonical(x))).digest('hex');
          const near=(a,b)=>Math.abs(a-b)<=1e-8;
          const ALLOWED=['phase','turn','own_request','visible_protocol'];
          function publicContract(o){
           assert(o&&typeof o==='object'&&!Array.isArray(o),'public observation missing');
           assert.deepEqual(Object.keys(o).sort(),[...ALLOWED].sort(),'public-only root/continuation contract');
           assert(['move','switch'].includes(o.phase),'unsupported public phase');
           assert(Number.isInteger(o.turn)&&o.turn>0,'invalid public turn');
           assert(Array.isArray(o.visible_protocol)&&o.visible_protocol.every(x=>typeof x==='string'),'invalid public protocol');
           assert(o.own_request&&typeof o.own_request==='object'&&!Array.isArray(o.own_request),'own request absent');
           const forbidden=/^(?:prng|rng|battle|state|omniscient|opponent_hidden_.*|opponent_secret_.*|full_state)$/i;
           function checkNested(x){
            if(!x||typeof x!=='object')return;
            for(const [k,v] of Object.entries(x)){
             assert(!forbidden.test(k),'non-public nested field: '+k);
             if(v&&typeof v==='object')checkNested(v);
            }
           }
           checkNested(o.own_request);
           return true;
          }
          function actionsValid(actions){
           assert(Array.isArray(actions)&&actions.length>0,'no legal actions');
           assert(actions.every(x=>typeof x==='string'&&/^(?:move|switch) [1-6]$/.test(x)),'unsupported legal action string');
           assert.equal(new Set(actions).size,actions.length,'duplicate action');
          }
          function probability(branches){
           assert(Array.isArray(branches)&&branches.length>0,'opponent branches missing');
           assert(branches.every(x=>x&&typeof x.choice==='string'&&x.choice&&Number.isFinite(x.p)&&x.p>0),'bad opponent probability');
           assert(near(branches.reduce((s,x)=>s+x.p,0),1),'opponent branches not normalized');
           assert.equal(new Set(branches.map(x=>x.choice)).size,branches.length,'duplicate opponent choice');
          }
          function choose({observation,particles,actions,opponent,transition,leaf,continuation,legalSecond,maxNodes=10000}){
           publicContract(observation); actionsValid(actions);
           assert(Array.isArray(particles)&&particles.length>0,'no belief particles');
           assert(particles.every(p=>p&&Number.isFinite(p.p)&&p.p>0&&p.state),'bad weighted particle');
           assert(near(particles.reduce((s,p)=>s+p.p,0),1),'particle weights not normalized');
           for(const f of [opponent,transition,leaf,continuation,legalSecond])assert.equal(typeof f,'function','missing search callback');
           assert(Number.isInteger(maxNodes)&&maxNodes>=actions.length*particles.length,'node budget too small');
           const rootHash=hash(observation),sourceHashes=particles.map(p=>hash(p.state));
           let joint=0,second=0,terminals=0,switches=0,groupsCount=0,contingent=0;
           const results=[];
           const rootOpponent=opponent(observation,'root'); // Only public input. Never pass secret particle to policy.
           probability(rootOpponent);
           for(const root of actions){
            let expected=0;
            const infosets=new Map();
            for(const p of particles){
             for(const b of rootOpponent){
              assert(++joint<=maxNodes,'node budget exceeded: fail closed');
              const step=transition(p.state,root,b.choice);
              assert(step&&step.state&&typeof step.terminal==='boolean','bad native transition');
              const weight=p.p*b.p;
              if(step.switchOccurred)switches++;
              if(step.terminal){
               const value=leaf(step.state);assert(Number.isFinite(value),'invalid terminal utility');
               expected+=weight*value;terminals++;
              } else {
               const next=continuation(step.state);
               publicContract(next);
               assert.equal(next.phase,'move','forced switch unresolved before next search action');
               assert(next.turn>observation.turn,'future turn did not advance');
               // Particles with the same PUBLIC observation must share a single future action.
               const key=hash(next);
               if(!infosets.has(key))infosets.set(key,{observation:next,members:[]});
               else assert.deepEqual(infosets.get(key).observation,next,'information-set hash collision');
               infosets.get(key).members.push({state:step.state,weight});
              }
             }
            }
            groupsCount+=infosets.size;
            for(const {observation:next,members} of infosets.values()){
             const options=legalSecond(next);actionsValid(options);
             const branches=opponent(next,'next');probability(branches);
             let best=-Infinity,bestChoice=null;
             for(const own of options){
              let weighted=0;
              for(const m of members){
               for(const b of branches){
                assert(++joint<=maxNodes,'node budget exceeded: fail closed');
                const step=transition(m.state,own,b.choice);
                assert(step&&step.state&&typeof step.terminal==='boolean','bad second transition');
                const u=leaf(step.state);assert(Number.isFinite(u),'invalid future utility');
                weighted+=m.weight*b.p*u;
                second++;
                if(step.terminal)terminals++;
                if(step.switchOccurred)switches++;
               }
              }
              if(weighted>best+1e-10 || (near(weighted,best)&& (bestChoice===null||own<bestChoice))){best=weighted;bestChoice=own;}
             }
             assert(bestChoice!==null,'future policy missing');
             expected+=best;contingent++;
            }
            results.push({choice:root,value:Number(expected.toFixed(9)),public_followup_groups:infosets.size});
           }
           assert.equal(hash(observation),rootHash,'root observation mutated');
           for(let i=0;i<particles.length;i++)assert.equal(hash(particles[i].state),sourceHashes[i],'belief particle mutated');
           results.sort((a,b)=>b.value-a.value||a.choice.localeCompare(b.choice));
           return {selected:results[0].choice,ranked:results,
            stats:{joint_nodes:joint,second_turn_nodes:second,terminal_branches:terminals,
             switch_branches:switches,public_information_sets:groupsCount,
             contingent_second_turn_decisions:contingent,depth_joint_turns:2,particles:particles.length},
            model:'UNCALIBRATED_PUBLIC_INFORMATION_SET_CONTINGENT_EXPECTIMAX_TWO_TURNS'};
          }
          module.exports={choose,probability,hash,publicContract};
          R2726_SEARCH
          cat > ./test_r2726_core.cjs <<'R2726_TEST'
          'use strict';
          const assert=require('node:assert/strict');
          const {choose,hash}=require('./r2726-search-core.cjs');
          const obs={phase:'move',turn:1,own_request:{request:'PUBLIC_FIXTURE'},visible_protocol:['|turn|1']};
          const altObs={phase:'move',turn:2,own_request:{request:'PUBLIC_FIXTURE'},visible_protocol:['|turn|1','|turn|2']};
          const particles=[{p:.5,state:{world:'a',score:0}},{p:.5,state:{world:'b',score:0}}];
          // Root 1 has a secret-state tempting second move: omniscient planning falsely scores it 55.
          // Correct PUBLIC-information-set planning scores it 10 and prefers root 2 (score 12).
          let transitions=0;
          const transition=(s,own,opp)=>{
           transitions++;const t={...s};
           if(own==='move 1')return {state:{...t,stage:2},terminal:false,switchOccurred:false};
           if(own==='switch 2')return {state:{...t,score:12},terminal:true,switchOccurred:true};
           if(own==='move 2')return {state:{...t,score:10},terminal:true,switchOccurred:false};
           if(own==='move 3')return {state:{...t,score:t.world==='a'?100:-100},terminal:true,switchOccurred:false};
           throw Error('unhandled '+own);
          };
          const publicContinuation=()=>altObs;
          const opts=()=>['move 2','move 3'];
          const base={observation:obs,particles,actions:['move 1','switch 2'],
           opponent:(o,depth)=>{assert(o&&o.visible_protocol);assert(['root','next'].includes(depth));return [{choice:'move 1',p:1}];},
           transition,continuation:publicContinuation,legalSecond:opts,leaf:s=>s.score};
          const correct=choose(base),replay=choose(base);
          assert.deepEqual(correct,replay);
          assert.equal(correct.selected,'switch 2');
          assert.equal(correct.ranked.find(x=>x.choice==='move 1').value,10);
          assert.equal(correct.ranked.find(x=>x.choice==='switch 2').value,12);
          assert(correct.stats.second_turn_nodes>=4);
          assert(correct.stats.switch_branches>0);
          assert.equal(correct.stats.public_information_sets,1);
          assert.equal(particles[0].state.score,0);
          // Revealing a distinguishable observation makes a different continuation legal.
          const revealed={...base,continuation:s=>({...altObs,visible_protocol:[...altObs.visible_protocol,'|public|'+s.world]})};
          const adaptive=choose(revealed);
          assert.equal(adaptive.selected,'move 1');
          assert.equal(adaptive.ranked.find(x=>x.choice==='move 1').value,55);
          assert.equal(adaptive.stats.public_information_sets,2);
          // Rejected non-public input and misleading probability or transition contracts.
          assert.throws(()=>choose({...base,observation:{...obs,opponent_item:'private'}}),/public-only/);
          assert.throws(()=>choose({...base,observation:{...obs,own_request:{...obs.own_request,battle:{secret:'a'}}}}),/non-public nested/);
          assert.throws(()=>choose({...base,particles:[{p:.6,state:particles[0].state}]}),/not normalized/);
          assert.throws(()=>choose({...base,opponent:()=>[{choice:'move 1',p:.9}]}),/not normalized/);
          assert.throws(()=>choose({...base,maxNodes:1}),/budget/);
          assert.throws(()=>choose({...base,continuation:()=>({...altObs,prng:'SECRET'})}),/public-only/);
          assert.throws(()=>choose({...base,legalSecond:()=>['move 1','move 1']}),/duplicate/);
          assert.throws(()=>choose({...base,transition:()=>({state:{},terminal:'no'})}),/bad native transition/);
          assert.equal(hash(base.observation),hash(obs));
          console.log('R2726_HARDENED_LOCAL_PASS',JSON.stringify({replays:2,deterministic:correct.selected,adaptive:adaptive.selected,
           guarded_information_sets:true,negative_controls:8,transitions}));
          R2726_TEST
          cat > ./r2726-future-public-legal.cjs <<'R2726_LEGAL'
          'use strict';
          const assert=require('node:assert/strict');
          /** R27.26-only fixture extension for second-turn choices. It consumes strictly the
           * owner's PUBLIC Showdown request, including party HP and current active moves;
           * it never reads the omniscient Battle state to construct the action set.
           */
          function legalSecond(obs){
           assert.deepEqual(Object.keys(obs).sort(),['own_request','phase','turn','visible_protocol'].sort());
           assert.equal(obs.phase,'move','only settled move phase supported');
           const req=obs.own_request;
           assert(req&&req.side?.id==='p1','wrong owner request');
           assert(Array.isArray(req.side.pokemon)&&req.side.pokemon.length===3,'need three owner mons');
           assert.equal(req.side.pokemon.filter(p=>p.active===true).length,1,'exactly one active mon');
           assert(Array.isArray(req.active)&&req.active.length===1,'expected one active request');
           const act=req.active[0];
           assert(!act.maybeTrapped,'ambiguous trapping: fail closed');
           for(const k of ['canMegaEvo','canMegaEvoX','canMegaEvoY','canDynamax','canTerastallize','canZMove']){
            assert(!act[k],'unsupported battle mechanic in fixture: '+k);
           }
           assert(Array.isArray(act.moves)&&act.moves.length===4,'four-move synthetic fixture only');
           const choices=[];
           for(let i=0;i<act.moves.length;i++){
            const m=act.moves[i];
            assert(m&&typeof m.id==='string'&&Number.isInteger(m.pp)&&m.pp>=0,'invalid public move request');
            assert(typeof m.disabled==='boolean','ambiguous public disabled flag');
            if(m.pp>0&&!m.disabled)choices.push('move '+(i+1));
           }
           if(!act.trapped)for(let i=0;i<req.side.pokemon.length;i++){
            const p=req.side.pokemon[i];
            assert(p&&typeof p.condition==='string','invalid public party status');
            if(p.active||/\bfnt\b/.test(p.condition)||/^0(?:\/0)?(?:\s|$)/.test(p.condition))continue;
            choices.push('switch '+(i+1));
           }
           assert(choices.length>0&&new Set(choices).size===choices.length,'no unambiguous legal second actions');
           return choices;
          }
          module.exports={legalSecond};
          R2726_LEGAL
          cat > ./test_r2726_legal.cjs <<'R2726_LEGAL_TEST'
          'use strict';
          const assert=require('node:assert/strict');
          const {legalSecond}=require('./r2726-future-public-legal.cjs');
          const dup=x=>JSON.parse(JSON.stringify(x));
          const obs={phase:'move',turn:2,visible_protocol:['|turn|2'],own_request:{
            side:{id:'p1',pokemon:[{active:true,condition:'145/190'},{active:false,condition:'170/170'},{active:false,condition:'175/175'}]},
            active:[{moves:[
             {id:'bite',pp:15,disabled:false},{id:'thunderwave',pp:18,disabled:false},
             {id:'protect',pp:9,disabled:false},{id:'endure',pp:11,disabled:false}
            ]}]
           }};
          assert.deepEqual(legalSecond(obs),['move 1','move 2','move 3','move 4','switch 2','switch 3']);
          const trapped=dup(obs);trapped.own_request.active[0].trapped=true;
          assert.deepEqual(legalSecond(trapped),['move 1','move 2','move 3','move 4']);
          const maybe=dup(obs);maybe.own_request.active[0].maybeTrapped=true;
          assert.throws(()=>legalSecond(maybe),/ambiguous trapping/);
          const faint=dup(obs);faint.own_request.side.pokemon[1].condition='0 fnt';
          assert.deepEqual(legalSecond(faint),['move 1','move 2','move 3','move 4','switch 3']);
          const pp=dup(obs);pp.own_request.active[0].moves[1].pp=0;
          assert.deepEqual(legalSecond(pp),['move 1','move 3','move 4','switch 2','switch 3']);
          const disable=dup(obs);disable.own_request.active[0].moves[0].disabled=true;
          assert.deepEqual(legalSecond(disable),['move 2','move 3','move 4','switch 2','switch 3']);
          for(const m of ['canMegaEvo','canDynamax','canTerastallize','canZMove']){
           const x=dup(obs);x.own_request.active[0][m]=true;
           assert.throws(()=>legalSecond(x),/unsupported battle mechanic/);
          }
          const hidden=dup(obs);hidden.opponent_secret_item='';assert.throws(()=>legalSecond(hidden));
          const noRequest=dup(obs);delete noRequest.own_request.active;assert.throws(()=>legalSecond(noRequest));
          assert.equal(JSON.stringify(obs),JSON.stringify(dup(obs)));
          console.log('R2726_FUTURE_PUBLIC_LEGAL_LOCAL_PASS',JSON.stringify({normal:6,trap:4,faint:5,pp:5,disabled:5,negative_controls:7}));
          R2726_LEGAL_TEST
          cat > ./r2726-native-rollout.cjs <<'R2726_NATIVE'
          'use strict';
          /** Pinned Showdown research-only, two-joint-turn forward rollout with explicit hidden-world marginalization.
           * Research-grade behavior fixture, not a Champions physics or policy certification.
           */
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const {Battle}=require('./dist/sim/battle');
          const {viewer}=require('./r2722-rng-observation-boundaries.cjs');
          const {makeVariants}=require('./r2723-multiturn-belief-boundaries.cjs');
          const {PublicBelief}=require('./r2724-bayesian-belief-action-forecast.cjs');
          const {legalActions,decide}=require('./r2725-baseline-decision-core.cjs');
          const {choose,hash}=require('./r2726-search-core.cjs');
          const {legalSecond}=require('./r2726-future-public-legal.cjs');
          const PREFIX=[['move 3','move 2'],['move 4','move 3'],['move 3','move 2'],['move 4','move 3']];
          const PUBLIC_OPPONENT=Object.freeze([{choice:'move 1',p:0.5},{choice:'move 2',p:0.5}]);
          const copy=x=>JSON.parse(JSON.stringify(x));
          function fresh(format,w){
           const b=new Battle({formatid:format.id,seed:'1,2,3,4',strictChoices:true,
            p1:{name:'Public-P1',team:w.teams.p1},p2:{name:'Public-P2',team:w.teams.p2}});
           assert.equal(b.requestState,'teampreview');b.makeChoices('team 456','team 456');
           assert.equal(b.requestState,'move');return b;
          }
          function reveal(format,dex,w){
           const b=fresh(format,w),belief=new PublicBelief(dex);
           belief.observe(copy(viewer(b,'p1')));
           for(const step of PREFIX){b.makeChoices(...step);belief.observe(copy(viewer(b,'p1')));}
           assert.equal(b.requestState,'move');
           b.makeChoices('move 3','move 1');
           assert.equal(b.requestState,'move','unexpected post-reveal phase');
           const obs=copy(viewer(b,'p1'));
           const posterior=belief.observe(obs);
           return {state:copy(b.toJSON()),observation:obs,posterior};
          }
          function choiceForSide(b,who){
           const side=b.getSide(who),req=side.activeRequest;
           if(b.requestState==='switch'){
            if(side.requestState!=='switch')return '';
            assert.deepEqual(req.forceSwitch,[true],'unsupported multi-active forced switch');
            const idx=side.pokemon.findIndex(p=>!p.isActive&&!p.fainted&&p.hp>0);
            assert(idx>=0,'no viable replacement');return 'switch '+(idx+1);
           }
           if(b.requestState==='move'){
            assert.equal(side.requestState,'move');
            const moves=req?.active?.[0]?.moves;
            assert(Array.isArray(moves),'move request missing');
            const idx=moves.findIndex(m=>m&&m.pp>0&&m.disabled===false);
            assert(idx>=0,'no supported PP move');return 'move '+(idx+1);
           }
           throw Error('unsupported continuation phase: '+b.requestState);
          }
          function settleSwitches(b){
           let count=0;
           while(!b.ended&&b.requestState==='switch'){
            assert(++count<=3,'forced-switch loop');
            const p1=choiceForSide(b,'p1'),p2=choiceForSide(b,'p2');
            assert(p1||p2,'empty forced-switch action');
            b.makeChoices(p1,p2);
           }
           if(!b.ended)assert.equal(b.requestState,'move','unresolved phase after forced switch');
           return count;
          }
          function transition(s,own,opp){
           const b=Battle.fromJSON(JSON.stringify(s));
           assert.equal(b.requestState,'move','root/next transition must begin in move phase');
           const beforeTurn=b.turn;
           b.makeChoices(own,opp);
           const forced=settleSwitches(b);
           assert(b.ended||b.turn>beforeTurn,'turn did not progress');
           return {state:copy(b.toJSON()),terminal:b.ended,switchOccurred:forced>0};
          }
          function leaf(s){
           const b=Battle.fromJSON(JSON.stringify(s));
           if(b.ended){if(b.winner==='Public-P1')return 100;
            if(b.winner==='Public-P2')return -100;return 0;}
           function squad(side){
            assert.equal(side.pokemon.length,3,'expected bring-three fixture');
            return side.pokemon.reduce((sum,p)=>sum+(p.fainted||p.hp<=0?-1:(p.hp/p.maxhp)),0);
           }
           const diff=squad(b.p1)-squad(b.p2);
           const boost=side=>side.active[0]&&side.active[0].boosts?side.active[0].boosts: {};
           const boostSum=side=>['atk','spa','spe'].reduce((v,k)=>v+(boost(side)[k]||0),0);
           return 10*diff+0.3*(boostSum(b.p1)-boostSum(b.p2));
          }
          function continuation(s){
           const b=Battle.fromJSON(JSON.stringify(s));
           assert.equal(b.requestState,'move','unresolved forced switch');
           return copy(viewer(b,'p1'));
          }
          function decideOne(v,format,dex,cases,worldByID){
           const seen=reveal(format,dex,v),post=seen.posterior;
           const ids=post.posterior.filter(x=>x.p>0).map(x=>x.id);
           assert.equal(ids.length,2,'post reveal must retain 2 hidden-item worlds');
           const total=post.posterior.reduce((s,x)=>s+x.p,0);
           assert(Math.abs(total-1)<1e-8);
           const particles=post.posterior.filter(x=>x.p>0).map(h=>({p:h.p/total,state:worldByID[h.id].state}));
           const obs=seen.observation,actions=legalActions(obs).map(x=>x.choice);
           const baseline=decide(obs,post.next_action_prediction);
           assert.deepEqual(baseline.legal_choices,actions);
           const before=particles.map(x=>hash(x.state));
           const search=choose({observation:obs,particles,actions,
            opponent:(_publicObs,_depth)=>PUBLIC_OPPONENT,
            transition,continuation,legalSecond,leaf,maxNodes:12000});
           assert.deepEqual(particles.map(x=>hash(x.state)),before,'search changed source worlds');
           assert.equal(search.ranked.length,6);
           assert(search.stats.second_turn_nodes>0,'no second-turn nodes evaluated');
           assert(search.stats.public_information_sets>0,'future public observations were not grouped');
           assert(search.stats.contingent_second_turn_decisions>0,'no contingent public policy chosen');
           return {variant:v.id,public_hash:hash(obs),belief:post.posterior,baseline_selected:baseline.selected,
            search_selected:search.selected,search_ranked:search.ranked,stats:search.stats};
          }
          function run(){
           const {format,dex,cases}=makeVariants();
           const prepared=Object.fromEntries(cases.map(w=>[w.id,reveal(format,dex,w)]));
           const once=cases.map(v=>decideOne(v,format,dex,cases,prepared));
           const twice=cases.map(v=>decideOne(v,format,dex,cases,prepared));
           assert.deepEqual(once,twice,'same-seed search replay mismatch');
