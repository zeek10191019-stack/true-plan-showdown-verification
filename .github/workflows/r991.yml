name: R991 iPhone device verification
'on':
  push:
    branches: [r987-ocr-pc-regression]
    paths: [.github/workflows/r991.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.repository ==
      'zeek10191019-stack/true-plan-showdown-verification' &&
      !github.event.repository.private &&
      github.ref == 'refs/heads/r987-ocr-pc-regression'
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: .github/workflows/r991.yml
    - name: Restore and verify the R991 source
      shell: bash
      run: |
        set -euo pipefail
        base=802477a5f875bb5123fa55bfe22031ad7beaf06a
        path=.github/workflows/r990-ocr-pc-device-test.yml
        prior="$RUNNER_TEMP/r990-baseline.yml"
        git show "$base:$path" > "$prior"
        python3 - "$prior" <<'BASE'
        import hashlib, sys
        from pathlib import Path
        expected = ("94d5bfbb097dfcc537e6c28784edb5e0"
                    "fb126d817321f54f47629e39b6ed40f9")
        actual = hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest()
        assert actual == expected
        BASE
        ruby -ryaml -e '
          doc = YAML.load_file(ARGV[0], aliases: true)
          steps = doc.fetch("jobs").fetch("verify").fetch("steps")
          puts steps.find { |s| s["name"] == ARGV[1] }.fetch("run")
        ' "$prior" 'Restore fixed R989 and apply R990' \
          > "$RUNNER_TEMP/restore-r990"
        bash "$RUNNER_TEMP/restore-r990"
