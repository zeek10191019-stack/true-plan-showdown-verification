        python3 - <<'MANIFEST'
        import hashlib, json
        from pathlib import Path
        root = Path("pinned-r793/source")
        target = root / "source_manifest.json"
        files = {
            p.relative_to(root).as_posix():
                hashlib.sha256(p.read_bytes()).hexdigest()
            for p in root.rglob("*") if p.is_file() and p != target
        }
        assert json.loads(target.read_bytes()).keys() <= files.keys()
        data = (json.dumps(files, sort_keys=True, indent=2) + '\n').encode()
        expected = ("ed69d81db69eaa11502bed47236afcad"
                    "ad7996729b8bffbe2b94f0fde5199034")
        assert hashlib.sha256(data).hexdigest() == expected
        target.write_bytes(data)
        for name in ("R987BattleReadout", "R866SpriteMatcher"):
            a = root / "app/ios/ChampionsOnDevice" / (name + ".swift")
            core = root / "R720_PORTABLE_TESTS/Sources/R719Core"
            b = core / (name + ".swift")
            assert a.read_bytes() == b.read_bytes()
        print("R991_SOURCE_VERIFIED", len(files))
        MANIFEST
    - name: Run Swift, browser, archive and Apple Vision regressions
      shell: bash
      run: |
        set -euo pipefail
        prior="$RUNNER_TEMP/r990-baseline.yml"
        run_prior() {
          ruby -ryaml -e '
            doc = YAML.load_file(ARGV[0], aliases: true)
            steps = doc.fetch("jobs").fetch(ARGV[1]).fetch("steps")
            puts steps.find { |s| s["name"].start_with?(ARGV[2]) }.fetch("run")
          ' "$prior" "$1" "$2" > "$RUNNER_TEMP/r991-check.sh"
          bash "$RUNNER_TEMP/r991-check.sh"
        }
        run_prior verify "Replay storage contention"
        run_prior verify "Run integrated export"
        run_prior vision "Replay retained Apple Vision"
    - name: Build and validate the unsigned iPhone IPA
      shell: bash
      run: |
        set -euo pipefail
        prior="$RUNNER_TEMP/r990-baseline.yml"
        extract() {
          ruby -ryaml -e '
            doc = YAML.load_file(ARGV[0], aliases: true)
            steps = doc.fetch("jobs").fetch("verify").fetch("steps")
            puts steps.find { |s| s["name"].start_with?(ARGV[1]) }.fetch("run")
          ' "$prior" "$1" > "$RUNNER_TEMP/r991-native-step"
        }
        extract "Build and verify iPhoneOS"
        sed 's/990/991/g' "$RUNNER_TEMP/r991-native-step" \
          > "$RUNNER_TEMP/r991-build"
        bash "$RUNNER_TEMP/r991-build"
        extract "Validate the IPA"
        python3 - <<'PACKAGE'
        import os
        from pathlib import Path
        root = Path(os.environ["RUNNER_TEMP"])
        source = root / "r991-native-step"
        text = source.read_text().split("\nassets=",1)[0]
        assert text != source.read_text()
        old = ("a8a6ad98f54a2b98a5079657639b7001"
                    "6558ca763803e24d5d1cbd74a82e70d4")
        new = ("ed69d81db69eaa11502bed47236afcad"
                    "ad7996729b8bffbe2b94f0fde5199034")
        text = text.replace(old,new)
        assert new in text
        text = text.replace("r990","r991").replace("R990","R991")
        text = text.replace('"990"','"991"')
        text = text.replace('"build": 990','"build": 991')
        text = text.replace("0.9.90","0.9.91")
        (root / "r991-package.sh").write_text(text + "\n")
        PACKAGE
        bash "$RUNNER_TEMP/r991-package.sh"
    - uses: actions/upload-artifact@v4
      with:
        name: R991-iPhone-unsigned
        path: |
          ${{ runner.temp }}/r991-package/R991_Unsigned_DeviceTest.ipa
          ${{ runner.temp }}/r991-package/VERIFICATION_R991.json
        if-no-files-found: error
