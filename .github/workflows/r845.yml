                      }
                  }
          '''+needle);p.write_text(t)
           p=folder/'R716SpatialFieldProjection.swift';t=p.read_text();old='''                if (scene=="battle-log" || scene=="battle-command") &&
                              exactMatch(norm,#"^ターン[0-9]{1,3}$"#) && y<0.15 {
                              typed.append(("battle.turn",String(norm.dropFirst(3)),"TURN_LOG_LABEL_CANDIDATE"))
