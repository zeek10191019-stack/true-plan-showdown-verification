          both('R845VisualForm.swift',r'''import Foundation
          
          /// Appearance estimates for two Tyranitar HUD references. Names cannot assert
          /// Mega. Unknown species, ambiguous matches and missing cards remain unknown.
          /// Developer-reviewed pixels are not user/device accuracy certification.
          enum R845VisualForm {
              static let references:[(String,[UInt8])] = [
                  ("BASE",Array(Data(base64Encoded:"@@BASE@@")!)),
                  ("MEGA",Array(Data(base64Encoded:"@@MEGA@@")!))]
              static func distance(_ a:[UInt8],_ b:[UInt8])->Double? {
                  guard a.count==192,b.count==192 else{return nil}
                  let cells=(0..<64).filter{!($0/8<3 && $0%8>=6)} // Exclude status badge.
                  var sum=0
                  for cell in cells {for c in 0..<3 {sum+=abs(Int(a[cell*3+c])-Int(b[cell*3+c]))}}
                  return Double(sum)/Double(cells.count*3)
              }
              static func classify(_ descriptor:[UInt8],side:String,profileMatched:Bool)->[String:Any] {
                  var r:[String:Any]=["schema":"trueplan.r845.visual-form-estimate.v1","display_side":side,
                      "status":"HOLD_VISUAL_FORM_UNKNOWN","knowledge_state":"UNKNOWN","value":NSNull(),
                      "reference_species_count":1,"user_label_reviewed":false,"device_accuracy_certified":false,
                      "individual_id":NSNull(),"mega_event_confirmed":false,
                      "battle_advice_authorized":false,"name_only_promotion":false]
                  guard ["own","opponent"].contains(side),profileMatched,descriptor.count==192 else{return r}
                  let ranked=references.compactMap {name,reference -> (String,Double)? in
                      distance(descriptor,reference).map{(name,$0)}
                  }.sorted{$0.1<$1.1}
                  guard ranked.count==2 else{return r}
                  r["distances"]=ranked.map{["reference":$0.0,"mean_rgb_error":$0.1] as [String:Any]}
                  let margin=ranked[1].1-ranked[0].1;r["margin"]=margin
                  guard ranked[0].1<=16,margin>=7 else {
                      r["status"]=ranked[0].1>16 ? "HOLD_NO_CLOSE_VISUAL_REFERENCE":"HOLD_COMPETING_VISUAL_REFERENCES"
                      return r
                  }
                  r["status"]="VISUAL_REFERENCE_FORM_ESTIMATE";r["knowledge_state"]="ESTIMATED"
                  r["value"]=["species":"TYRANITAR","form":ranked[0].0]
                  r["basis"]="HUD_ICON_RGB_REFERENCE_MATCH_NOT_NAME_OR_LOG"
                  r["reference_source"]=ranked[0].0=="MEGA" ? "R715_ORIGINAL_PNG_FRAME_8_4162":"R732_ORIGINAL_PNG_MOVE_PANEL"
                  return r
              }
          }
          '''.replace('@@BASE@@',f['base']).replace('@@MEGA@@',f['mega']))
          both('R845HUDFormSampler.swift',r'''#if canImport(Vision) && canImport(CoreImage) && canImport(ImageIO)
          import Foundation
          import CoreGraphics
          
          /// Tiny original-pixel crops on the existing bounded QUICK worker. No extra OCR.
          enum R845HUDFormSampler {
              static func inspect(_ source:CGImage,profileMatched:Bool)->[[String:Any]] {
                  let portrait=source.height>source.width
                  let width=portrait ? source.height:source.width,height=portrait ? source.width:source.height
                  let rois:[(String,Double,Double,Double,Double)]=[
                      ("own",0.083,0.858,0.047,0.105),("opponent",0.755,0.040,0.047,0.105)]
                  return rois.map {side,x,y,w,h in
                      guard profileMatched else{return R845VisualForm.classify([],side:side,profileMatched:false)}
                      let left=Int(floor(x*Double(width))),top=Int(floor(y*Double(height)))
                      let right=Int(ceil((x+w)*Double(width))),bottom=Int(ceil((y+h)*Double(height)))
                      guard let crop=R836NumericHUDOCR.cropFromOriginal(source,portrait:portrait,
                          x:left,y:top,width:right-left,height:bottom-top) else {
                          return R845VisualForm.classify([],side:side,profileMatched:false)
                      }
                      var rgba=[UInt8](repeating:0,count:256)
                      let ok=rgba.withUnsafeMutableBytes {data -> Bool in
                          guard let c=CGContext(data:data.baseAddress,width:8,height:8,
                              bitsPerComponent:8,bytesPerRow:32,space:CGColorSpaceCreateDeviceRGB(),
                              bitmapInfo:CGImageAlphaInfo.premultipliedLast.rawValue | CGBitmapInfo.byteOrder32Big.rawValue)
                              else{return false}
                          c.interpolationQuality = .high
                          c.draw(crop,in:CGRect(x:0,y:0,width:8,height:8));return true
                      }
                      var rgb=[UInt8]()
                      if ok {for i in stride(from:0,to:rgba.count,by:4){rgb.append(contentsOf:rgba[i..<(i+3)])}}
                      var result=R845VisualForm.classify(rgb,side:side,profileMatched:ok)
                      result["source_display_roi"]=["x":left,"y":top,"width":right-left,"height":bottom-top]
                      return result
                  }
              }
          }
          #endif
          ''')
