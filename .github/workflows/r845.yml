              }
          }
          #if canImport(Vision) && canImport(CoreImage) && canImport(CryptoKit)
          @preconcurrency import Vision
          import CoreImage
          import ImageIO
          import CryptoKit
          final class R845ApplePixelHistoryTests:XCTestCase {
              func testProductionSamplerOnOriginalNormalSpriteAndSelection()throws {
                  let dir=R761RealImageRegressionTests.fixtureDirectory
                  for name in ["r761_real_move_panel.png","r761_real_selection.png"] {
                      let data=try Data(contentsOf:dir.appendingPathComponent(name))
                      let r=R750RawPixelSampler.inspectPNG(data,sha:R719SHA256.hash(data),epoch:1,frame:1,observedMs:1)
                      let forms=try XCTUnwrap(r["r845_visual_form_estimates"] as? [[String:Any]])
                      print("R845_REAL_PIXEL_FORMS "+String(decoding:try JSONSerialization.data(withJSONObject:forms,options:[.sortedKeys]),as:UTF8.self))
                      if name.contains("move_panel") {
                          XCTAssertEqual((forms[1]["value"] as? [String:String])?["form"],"BASE")
                          XCTAssertTrue(forms[0]["value"] is NSNull)
                      } else {XCTAssertTrue(forms.allSatisfy{$0["value"] is NSNull})}
                  }
