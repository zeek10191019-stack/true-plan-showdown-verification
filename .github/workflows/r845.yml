           t=t.replace('(retrospective ? "RETROSPECTIVE_REFERENCE_MATCHER_ONLY" :','(limitedVisual ? "LIMITED_LIVE_VISUAL_ESTIMATE_ONE_SPECIES_TWO_FORMS" :')
           p.write_text(t)
          p=native/'Info.plist';p.write_text(p.read_text().replace('<string>0.7.93</string>','<string>0.8.45</string>').replace('<string>793</string>','<string>845</string>'))
          f['scope']={'own_mega_real_positive':'NOT_PRESENT_IN_AVAILABLE_RECORDINGS','all_forms_coverage':False,
           'labels_reviewed_by_user':False,'movie_capture_alignment_certified':False,'turn_crop_display_xyxy':[590,10,710,40],
           'descriptor':'8x8 RGB BOX; upper right status badge excluded',
           'holdouts':'R711 original MOV decode at 76/96 seconds; R715 original PNG frame 8/4220',
           'mega_log':'R715 frame 8/3925 actual prior OCR: 相手のバンギラスは / メガバンギラスにメガシンカした！; not a current actor proof'}
          (s/'tests/fixtures/r845_real_visual_history.json').write_text(json.dumps(f,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')
          
          tests=s/'R720_PORTABLE_TESTS/Tests/R719CoreTests'
          (tests/'R845VisualHistoryTests.swift').write_text(r'''import Foundation
          import XCTest
          @testable import R719Core
          final class R845VisualHistoryTests:XCTestCase {
              func fixture()throws->[String:Any] {
                  try JSONSerialization.jsonObject(with:Data(contentsOf:R761RealImageRegressionTests.fixtureDirectory
                      .appendingPathComponent("r845_real_visual_history.json"))) as! [String:Any]
              }
              func descriptor(_ name:String)throws->[UInt8] {
                  Array(Data(base64Encoded:try fixture()[name] as! String)!)
              }
              func testNormalAndMegaUseAppearanceAndKeepSpeciesUnchanged()throws {
                  for (name,form) in [("base","BASE"),("mega","MEGA")] {
                      let r=R845VisualForm.classify(try descriptor(name),side:"opponent",profileMatched:true)
                      XCTAssertEqual(r["knowledge_state"] as? String,"ESTIMATED")
                      XCTAssertEqual((r["value"] as? [String:String])?["species"],"TYRANITAR")
                      XCTAssertEqual((r["value"] as? [String:String])?["form"],form)
                      XCTAssertEqual(r["mega_event_confirmed"] as? Bool,false)
                      XCTAssertEqual(r["device_accuracy_certified"] as? Bool,false)
                  }
              }
              func testOtherRecordedFramesSeparateMegaAndNormal()throws {
                  for name in ["holdout76","holdout96","holdout4220"] {
                      let r=R845VisualForm.classify(try descriptor(name),side:"opponent",profileMatched:true)
                      XCTAssertEqual((r["value"] as? [String:String])?["form"],"MEGA",name)
                  }
              }
              func testUnrelatedSpriteSelectionMissingPaletteAndAmbiguityAreHeld()throws {
                  for name in ["ownToucan","selection"] {
                      XCTAssertTrue(R845VisualForm.classify(try descriptor(name),side:"own",profileMatched:true)["value"] is NSNull)
                  }
                  let a=try descriptor("base"),b=try descriptor("mega")
                  let average=zip(a,b).map{UInt8((Int($0)+Int($1))/2)}
                  XCTAssertTrue(R845VisualForm.classify(average,side:"opponent",profileMatched:true)["value"] is NSNull)
                  XCTAssertTrue(R845VisualForm.classify(a,side:"own",profileMatched:false)["value"] is NSNull)
                  XCTAssertTrue(R845VisualForm.classify(a,side:"UNKNOWN",profileMatched:true)["value"] is NSNull)
              }
              func testBothSidePolicyIsNotAnUnseenOwnMegaRecording()throws {
                  for side in ["own","opponent"] {
                      let r=R845VisualForm.classify(try descriptor("mega"),side:side,profileMatched:true)
                      XCTAssertEqual(r["display_side"] as? String,side)
                      XCTAssertEqual((r["value"] as? [String:String])?["form"],"MEGA")
                      XCTAssertEqual(r["user_label_reviewed"] as? Bool,false)
                  }
                  let scope=try fixture()["scope"] as! [String:Any]
                  XCTAssertEqual(scope["own_mega_real_positive"] as? String,"NOT_PRESENT_IN_AVAILABLE_RECORDINGS")
                  XCTAssertEqual(scope["all_forms_coverage"] as? Bool,false)
              }
              func row(_ text:String,_ x:Double,_ y:Double,_ w:Double=0.2)->[String:Any] {
                  ["raw_text":text,"confidence":1.0,"source_frame_id":3925,"source_epoch":8,
                   "source_image_sha256":String(repeating:"a",count:64),
                   "roi_rect":["x":Int(x*1290),"y":Int(y*596),"width":Int(w*1290),"height":24]]
              }
              func testSelectedHistoryTurnIsNotCurrentTurn() {
                  // Annotation geometry reproduces the visible R715 selected history header
                  // and previously recorded Japanese OCR. This is not fresh full-frame OCR.
                  let rows=[row("ターン 1",0.46,0.02,0.10),row("COMMAND 35",0.69,0.02),
                            row("相手の バンギラスは",0.386,0.25),row("メガバンギラスに メガシンカした！",0.386,0.29)]
                  let r=R716SpatialFieldProjection.project(rows:rows,width:1290,height:596,
                      frame:3925,epoch:8,imageSHA:String(repeating:"a",count:64),sourceVerified:false)
                  XCTAssertEqual(r.scene,"battle-log")
                  XCTAssertFalse(r.candidates.contains{$0["field_key"] as? String=="battle.turn"})
                  XCTAssertTrue(r.candidates.contains{$0["candidate_value"] as? String=="SELECTED_HISTORY_TURN:1"})
                  XCTAssertTrue(r.candidates.contains{$0["field_key"] as? String=="battle.mega_history"})
                  XCTAssertTrue(r.candidates.allSatisfy{$0["turn_certified"] as? Bool==false})
              }
              func testWeatherCountdownAndOffHeaderTurnStayHeld() {
                  let rows=[row("ターン1",0.46,0.5),row("COMMAND 35",0.69,0.02),
                      row("メガシンカした！",0.386,0.29),row("5/5",0.37,0.06)]
