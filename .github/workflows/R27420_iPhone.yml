          test "$(find r27420-dist -maxdepth 1 -name '*.ipa' -type f | wc -l | tr -d ' ')" = 1
          test "$(stat -f%z r27420-dist/R27_420_Unsigned_ChampionsResearch.ipa)" -lt 20000000
          (cd r27420-dist && shasum -a 256 -c R27_420_Unsigned_ChampionsResearch.ipa.sha256)
          echo 'IPA_SIGNING=NOT_PERFORMED; DEVICE_INSTALL=NOT_TESTED; NO_APPLE_CREDENTIALS'
