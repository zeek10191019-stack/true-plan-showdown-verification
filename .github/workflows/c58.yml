            probe(sources,store/'c45_probe.swift',store/'c45_fixture.py',marker='C45_PASS 19/19')
            probe(sources,root/'job_probe.swift',store/'c45_legacy_e2e.py',(pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'c32-source',),marker='C45_LEGACY_HTTP_REAL_LOOPBACK_PASS 12 SHA_MATCH')
            probe(sources,store/'cancel_probe.swift',store/'cancel_test.py',marker='C38_FAILURES=0 TOTAL=11')
            print('C52_CANDIDATE_SWIFT_REGRESSIONS_PASS_NOT_DEVICE',flush=True)
        elif os.environ['C52_JOB']=='macos-source':
            product=base/'c6-objects/pinned-r793/source';manifest=product/'source_manifest.json';before=json.loads(manifest.read_bytes())
            def actual():
                result={}
                for n in before:
                    p=product/n;assert p.resolve().is_relative_to(product.resolve()) and p.is_file(),n;result[n]=sha(p.read_bytes())
                return result
            assert actual()==before
            run([sys.executable,'field_execution_audit.py',product,base/'c49-portable-swift-test.log',root/'field-execution-leads.json'])
            rel='app/ios/ChampionsOnDevice/R1032TransferStage.swift';p=product/rel;raw=p.read_bytes();old=(root/'old.swift').read_bytes();assert raw.count(old)==1,'C52 pinned journal absent'
            patched=raw.replace(old,(root/'R1040BackgroundJournal.swift').read_bytes());p.write_bytes(patched);expected=dict(before);expected[rel]=sha(patched);assert actual()==expected
            manifest.write_text(json.dumps(expected,sort_keys=True,indent=2)+'\n')
            run(['swiftc','-frontend','-parse',p]);log=root/'native-build.log'
            with log.open('wb') as f:
                result=subprocess.run(['xcodebuild','-project',str(product/'app/ios/ChampionsOnDeviceResearch.xcodeproj'),'-target','ChampionsOnDeviceResearch','-configuration','Debug','-sdk','iphoneos','-arch','arm64','CODE_SIGNING_ALLOWED=NO','SYMROOT='+str(root/'build'),'build'],stdout=f,stderr=subprocess.STDOUT)
            t=log.read_text(errors='replace')
            if result.returncode or '** BUILD SUCCEEDED **' not in t:
                print('\n'.join(l for l in t.splitlines() if 'error:' in l or 'BUILD FAILED' in l)[-20000:]);raise SystemExit(1)
            assert actual()==expected
            print('C52_NATIVE_JOURNAL_CONTRACT_BUILD_PASS_NOT_DEVICE_NO_IPA',sha(patched),flush=True)
        else:raise AssertionError('unexpected job')
