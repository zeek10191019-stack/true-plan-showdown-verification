      if: '!cancelled() && (matrix.job == ''windows-receiver'' || matrix.job == ''macos-sender'')'
      env:
        C58_JOB: ${{ matrix.job }}
      shell: bash
      run: |
        set -Eeuo pipefail
        if [[ "$RUNNER_OS" == Windows ]]; then PY=python; else PY=python3; fi
        "$PY" - <<'C58_PY'
        import pathlib,os,sys,hashlib,shutil,subprocess,base64,zlib
        base=pathlib.Path(os.environ['RUNNER_TEMP']); root=base/'c58-dns';root.mkdir(exist_ok=False)
        source=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'c32-source'
        old=base/'c43'
        original=(old/'r1041_tls_receiver.py').read_bytes();assert hashlib.sha256(original).hexdigest()=='570570486294a0ac57d000855c031d0380b00fd2b6cdc074197572eb8bfbe2a6'
