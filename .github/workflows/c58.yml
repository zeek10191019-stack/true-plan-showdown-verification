       if keyword.lower()==\\\'location\\\':raise ConnectionAbortedError(\\\'Redirect header forbidden\\\')\\n                return super().send_header(keyword,value)\\n        self.RequestHandlerClass=NoRedirect\\n    def process_request(self,request,address):\\n        if not self._tls_slots.acquire(blocking=False):\\n            self.shutdown_request(request);return\\n        try:super().process_request(request,address)\\n        except BaseException:\\n            self._tls_slots.release();raise\\n    def process_request_thread(self,request,address):\\n        secure=None\\n        try:\\n            request.settimeout(5)\\n            secure=self._tls_context.wrap_socket(request,server_side=True)\\n            secure.settimeout(45)\\n            super().process_request_thread(secure,address)\\n        except (OSError,ssl.SSLError):\\n            # Drop a plaintext connection or failed TLS handshake, never send an HTTP fallback.\\n            self.shutdown_request(secure if secure is not None else request)\\n        finally:self._tls_slots.release()\\n    def handle_error(self,request,address):\\n        # Existing receiver suppresses sensitive request data; do not print raw headers or exceptions.\\n        pass\\n\\ndef tls_context(cert:Path,key:Path):\\n    cert=Path(cert);key=Path(key)\\n    if not cert.is_file() or not key.is_file() or cert.is_symlink() or key.is_symlink():raise ValueError(\\\'Regular certificate and key required\\\')\\n    if os.name!=\\\'nt\\\' and stat.S_IMODE(key.stat().st_mode)&0o077:raise PermissionError(\\\'Private key permissions too broad\\\')\\n    ctx=ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER);ctx.minimum_version=ssl.TLSVersion.TLSv1_2\\n    ctx.load_cert_chain(str(cert),str(key));return ctx\\n\\ndef secured_receiver(receiver_class, address, transfer, cert, key):\\n    if not issubclass(receiver_class,ThreadingHTTPServer):raise TypeError(\\\'Existing threaded receiver required\\\')\\n    cls=type(\\\'R1041TLSReceiver\\\',(TLSOnlyMixin,receiver_class),{})\\n    return cls(address,transfer,tls_context=tls_context(cert,key))\\n\'\n    assert hashlib.sha256(candidate).hexdigest()==\'75f3d80c435fed192c81d3c02ac0207b1230fcaee3ef13f01970172f9df2092c\'\n    (root/\'r1041_tls_receiver.py\').write_bytes(candidate)\n'
