            print('C51_ALL_PRIOR_STEPS_RETAINED_AND_TLS_REGRESSION_PASS_NOT_DEVICE',flush=True)
            run('shutdown_noop_probe.py',(root/'c50_shutdown_probe.py',),count=9,marker='C50_REAL_TLS_PENDING_DRAIN_PASS_NOT_DEVICE')
            run('shutdown_noop_probe.py',(root/'c51_header_deadline_probe.py',),count=9,marker='C51_REAL_TLS_ABSOLUTE_HEADER_DEADLINE_PASS_NOT_DEVICE')
