          assert len(files)==691 and digest=='95c0e880a4ffe57315246edeefd00fb2f594e43eb9466af583a762058d92379c',(len(files),digest)
          print('R948_SOURCE_VERIFIED',len(files),digest)
          VERIFY
      - name: Replay real status, inspection and animation evidence
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_26.3.app/Contents/Developer ]]; then
            export DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
          fi
          xcodebuild -version
          cd pinned-r793/source
          source_package="$PWD/R720_PORTABLE_TESTS"
          focused="$RUNNER_TEMP/r948-vision/R720_PORTABLE_TESTS"
          mkdir -p "$focused/Tests/R719CoreTests" "$RUNNER_TEMP/r948-vision/tests"
          cp "$source_package/Package.swift" "$focused/"
          cp -R "$source_package/Sources" "$focused/"
          cp -R tests/fixtures "$RUNNER_TEMP/r948-vision/tests/"
          for name in R893BattleStatusPanelTests R883InspectionPanelTests R761RealImageRegressionTests; do
            cp "$source_package/Tests/R719CoreTests/$name.swift" "$focused/Tests/R719CoreTests/"
          done
          swift test -c release --jobs 4 --package-path "$focused" --filter 'testPhoneStatusFromActualSelectedScreenshotRegions|testRetainedBuild715InspectionAndNonSelectedTransition|testScaledAndRotatedInspectionKeepAllSelectedNumbersBoundToSource|testActualAppleVisionReadsOpponentSandStreamFromRetainedCapture|testActualAppleVisionKnockOffOwnItemHistoryNeedsMatchingOwnCard' 2>&1 | tee "$RUNNER_TEMP/r948-vision.log"
          grep -F "testPhoneStatusFromActualSelectedScreenshotRegions]' passed" "$RUNNER_TEMP/r948-vision.log"

          grep -F "R947_RETAINED_ABILITY_TAB_FIELDS_REACH_JOURNAL" "$RUNNER_TEMP/r948-vision.log"

          grep -F 'R948_RETAINED_MOVE_RESOLUTION ' "$RUNNER_TEMP/r948-vision.log"
          grep -F 'R948_RETAINED_ITEM_RESOLUTION ' "$RUNNER_TEMP/r948-vision.log"
  publish:
    name: Publish and verify the tested IPA
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    needs: [verify, vision]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: r948-ipa
          path: R948Delivery
      - name: Publish and verify the download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd R948Delivery
          python3 - <<'VERIFY'
          import hashlib,json,os
          from pathlib import Path
          p=Path('R948_Unsigned_DeviceTest.ipa')
          r=json.loads(Path('VERIFICATION_R948.json').read_text())
          assert r['source_commit']==os.environ['GITHUB_SHA'] and r['build']==948
          assert r['ipa_bytes']==p.stat().st_size
          assert r['ipa_sha256']==hashlib.sha256(p.read_bytes()).hexdigest()
          VERIFY
          tag=r948-device-test
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft > existing.json 2>/dev/null; then
            test "$(jq -r .isDraft existing.json)" = true
            gh release upload "$tag" R948_Unsigned_DeviceTest.ipa VERIFICATION_R948.json --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" R948_Unsigned_DeviceTest.ipa VERIFICATION_R948.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title 'R948 iPhone 実機テスト 0.9.48' --notes '保存済みのiPhone画像を使い、技と持ち物の濁点・半濁点の読み取りを見直しました。読み取れた項目、部分読み取り、未読の診断を改善しました。79項目のiPhone実機認証は未完了です。'
          fi
          mkdir readback
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.ipa' --dir readback
          cmp R948_Unsigned_DeviceTest.ipa readback/R948_Unsigned_DeviceTest.ipa
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/R948_Unsigned_DeviceTest.ipa"
          curl --fail -sSL --retry 4 --retry-all-errors "$url" -o readback/published.ipa
          cmp R948_Unsigned_DeviceTest.ipa readback/published.ipa
          echo "R948_PUBLIC_READBACK_VERIFIED $url"
