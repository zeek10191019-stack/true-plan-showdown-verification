      - name: Test retained-log projection and storage regression
        shell: bash
        run: |
          set -euo pipefail
          cd pinned-r793/source
          python3 tools/r745_read_path_gate.py
          python3 tools/r852_preflight_wiring.py
          node tools/tests/test_r920_pc_display.mjs
          source_package="$PWD/R720_PORTABLE_TESTS"
          focused="$RUNNER_TEMP/r948-test/R720_PORTABLE_TESTS"
          mkdir -p "$focused/Tests/R719CoreTests" "$RUNNER_TEMP/r948-test/tests"
          cp "$source_package/Package.swift" "$focused/"
          cp -R "$source_package/Sources" "$focused/"
          cp -R tests/fixtures "$RUNNER_TEMP/r948-test/tests/"
          for name in R837FrameHPRecognitionTests R893BattleStatusPanelTests R946OCRDiagnosticsTests R946StoredCapturesTests R761RealImageRegressionTests R769SplitHUDValueFusionTests R771MovePanelSlotGateTests R734RecordingFinishTests R729EvidenceTransportPolicyTests R742QuickSourcePackAuditTests R761AggregatePNGBudgetTests; do
            cp "$source_package/Tests/R719CoreTests/$name.swift" "$focused/Tests/R719CoreTests/"
          done
          swift test --jobs 4 --package-path "$focused" --skip 'R761MacRealVisionTests|testPhoneStatusFromActualSelectedScreenshotRegions' 2>&1 | tee "$RUNNER_TEMP/r948-swift.log"
          grep -Eq 'Executed [1-9][0-9]+ tests, with 0 failures' "$RUNNER_TEMP/r948-swift.log"
          grep -F 'testListsOldAndCurrentCapturesAndDeletesOnlyTheRequestedCapture' "$RUNNER_TEMP/r948-swift.log"
          grep -F 'R947_RETAINED_MEGA_AND_ITEM_REACH_HISTORICAL_JOURNAL' "$RUNNER_TEMP/r948-swift.log"
          projector="$RUNNER_TEMP/r809_projector"
          swiftc -parse-as-library -o "$projector" tools/r809_replay_79_projector.swift   "$source_package"/Sources/R719Core/{R553OCRAlternatives,R716SpatialFieldProjection,R742ExtendedTextRoutes,R744SceneAnchorFusion,R762SingleFrameConflictFence,R769SplitHUDValueFusion,R771MovePanelSlotGate,R772MoveNameAlternativeReview,R773MoveLexiconReview,R781OCRConfidenceEvidence,R866ReferenceCatalog}.swift
          R809_SWIFT_PROJECTOR="$projector" PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/tests -p 'test_*.py'

          grep -F "testHeldItemKanaMarkNeedsSameCellLiteralSupport]' passed" "$RUNNER_TEMP/r948-swift.log"
          grep -F "testSelectedMoveReadsRequireActualKanaCropForPromotion]' passed" "$RUNNER_TEMP/r948-swift.log"
      - name: Build the iPhone app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project pinned-r793/source/app/ios/ChampionsOnDeviceResearch.xcodeproj -scheme ChampionsOnDeviceResearch -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO -derivedDataPath "$RUNNER_TEMP/r948_device" build > "$RUNNER_TEMP/native.log" 2>&1 || { grep -E -B2 -A2 'error:|BUILD FAILED' "$RUNNER_TEMP/native.log"; exit 1; }
          grep -F 'BUILD SUCCEEDED' "$RUNNER_TEMP/native.log"
          app="$RUNNER_TEMP/r948_device/Build/Products/Release-iphoneos/ChampionsOnDeviceResearch.app"
          test "$(lipo -archs "$app/ChampionsOnDeviceResearch")" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Info.plist")" = 948
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist")" = 0.9.48
          echo R948_IPHONEOS_SOURCE_BUILDS
      - name: Verify and package the unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          out="$PWD/R948Delivery"
          app="$RUNNER_TEMP/r948_device/Build/Products/Release-iphoneos/ChampionsOnDeviceResearch.app"
          mkdir -p "$out/Payload"
          cp -R "$app" "$out/Payload/"
          cd "$out"
          zip -qry R948_Unsigned_DeviceTest.ipa Payload
          python3 - <<'IPA'
          import os,zipfile,hashlib,plistlib,subprocess,struct,json
          from pathlib import Path
          ipa=Path("R948_Unsigned_DeviceTest.ipa")
          app=Path("Payload/ChampionsOnDeviceResearch.app")
          with zipfile.ZipFile(ipa) as z:
              assert z.testzip() is None
              assert {i.filename for i in z.infolist() if not i.is_dir()}=={p.as_posix() for p in app.rglob('*') if p.is_file()}
              assert all(z.read(str(p))==p.read_bytes() for p in app.rglob('*') if p.is_file())
              info=plistlib.loads(z.read(str(app/'Info.plist')))
          assert (info['CFBundleShortVersionString'],info['CFBundleVersion'],info['MinimumOSVersion'],info['DTPlatformName'])==('0.9.48','948','27.0','iphoneos')
          assert info['CFBundleIdentifier']=='com.zeek10191019.championsresearch' and info['NSLocalNetworkUsageDescription'] and 'screen-capture' in info['UIBackgroundModes']
          binaries=[app/info['CFBundleExecutable'],*app.glob('*.dylib')]
          for binary in binaries:
              data=binary.read_bytes();magic,cpu,sub,kind,ncmds,cmdbytes,*_=struct.unpack_from('<8I',data)
              assert magic==0xfeedfacf and cpu==0x0100000c and kind in (2,6)
              assert subprocess.check_output(['lipo','-archs',str(binary)],text=True).strip()=='arm64'
              offset=32;platform=[]
              for _ in range(ncmds):
                  c,n=struct.unpack_from('<II',data,offset);assert n>=8 and offset+n<=len(data) and c!=29
                  if c==50:platform.append(struct.unpack_from('<I',data,offset+8)[0])
                  offset+=n
              assert offset==32+cmdbytes and platform==[2]
          sha=hashlib.sha256(ipa.read_bytes()).hexdigest()
          doc=dict(version='0.9.48',build=948,ipa_bytes=ipa.stat().st_size,ipa_sha256=sha,source_tree_sha256='b052f18e0d76a69dc2c4e8ff3e2179592a388a504ad2ad146d3410f8731fc244',source_commit=os.environ['GITHUB_SHA'],device_certified_fields=0,iphone16plus_save='UNKNOWN',ci_run=os.environ['GITHUB_RUN_ID'])
          Path('VERIFICATION_R948.json').write_text(json.dumps(doc,indent=2)+'\n');print('R948_IPA_VERIFIED',json.dumps(doc))
          IPA
      - uses: actions/upload-artifact@v4
        with:
          name: r948-ipa
          path: R948Delivery/*
          if-no-files-found: error
          retention-days: 2
