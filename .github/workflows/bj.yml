name: R621-R624 Batch - Frame Bound Visual HUD and Mega Word Candidates (No IPA)
"on":
  push:
    branches: [main]
    paths: [.github/workflows/bj.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trueplan-r621batch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
      && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 55
    env:
      PYTHONOPTIMIZE: "0"
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
    steps:
      - name: Replay pinned R620, verify R621-R624 bundle, and patch actual ZIP writer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'R621_REPLAY'
          import base64,hashlib,lzma,textwrap,urllib.request
          from pathlib import Path
          url=(
            'https://raw.githubusercontent.com/'
            'zeek10191019-stack/true-plan-showdown-verification/'
            'c42c10245ea1f3c225d09b8c764cf024d78bad41/'
            '.github/workflows/bi.yml'
          )
          parent=urllib.request.urlopen(url,timeout=90).read()
          assert len(parent)==16428,'R620_PARENT_SIZE_DRIFT'
          assert hashlib.sha256(parent).hexdigest()==(
            'adab2cdd31282d6d02209f2987dd32148fe79c89c66082785afd6278bc4a60dc'
          ),'R620_PARENT_SHA_DRIFT'
          data=parent.decode('utf-8')
          start="          python3 - <<'R617_REPLAY'\n"
          end="\n          R617_REPLAY"
          assert data.count(start)==1 and data.count(end)==1
          nested=textwrap.dedent(data.split(start,1)[1].split(end,1)[0])
          exec(compile(nested,'R620_PINNED_REPLAY','exec'),{'__name__':'__main__'})
