      - name: Apple SDK iPhoneOS build or macOS Vision OCR regression
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SCREEN_READ_R568_ROLE" = 'IOS27_BUILD' ]; then
            python3 tools/generate_xcode_project.py
            xcodebuild -project app/ios/ChampionsOnDeviceResearch.xcodeproj \
              -target ChampionsOnDeviceResearch -configuration Debug -sdk iphoneos \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
              CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/r568-build" \
              OBJROOT="$RUNNER_TEMP/r568-objects" SYMROOT="$RUNNER_TEMP/r568-symbols" build
            test -f "$RUNNER_TEMP/r568-build/ChampionsOnDeviceResearch.app/PrivacyInfo.xcprivacy"
            echo 'PASS_R568_IOS27_APP_BUILD_ONLY_NO_IPA'
          elif [ "$SCREEN_READ_R568_ROLE" = 'MACOS26_OCR' ]; then
            python3 tools/run_r564_mac_ocr.py
            echo 'PASS_R568_MACOS26_SYNTHETIC_VISION_NO_GAME_CERTIFICATION'
          else
            echo FAIL_R568_UNKNOWN_ROLE; exit 2
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R568_SCREEN_READ_REPORT_${{ matrix.role }}
          path: R568_CI_REPORT.json
          retention-days: 3
