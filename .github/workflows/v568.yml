name: R568 OCR Observation Identity and Role Collision Gate - NO IPA
"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/v568.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: xcode-27
            role: IOS27_BUILD
          - runner: macos-26-intel
            role: MACOS26_OCR
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      SCREEN_READ_R568_ROLE: ${{ matrix.role }}
    steps:
      - name: Replay pinned R567 and verify R568 observation identity code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY568'
          import hashlib,base64,json,lzma,urllib.request,re,textwrap,ast,subprocess,plistlib
          from pathlib import Path
          sha=lambda b:hashlib.sha256(b).hexdigest()
          url='https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/949cdd14a3d2e678a248e58a12bb15ee1bed93b2/.github/workflows/v567.yml'
          raw=urllib.request.urlopen(url,timeout=90).read()
          assert len(raw)==27758 and sha(raw)=='e778a8bf88be23a3fe1ba7f0ad37981b08d87260de33a61c7b220a9978ae7a3e','R568_PARENT_WORKFLOW_CHANGED'
          m=re.search(r"python3 - <<'PY567'\n(.*?)\n\s+PY567",raw.decode(),re.S)
          assert m,'R568_PARENT_CODE_MISSING'
          parent=textwrap.dedent(m.group(1));ast.parse(parent)
