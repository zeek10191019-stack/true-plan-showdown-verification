          R809_SWIFT_PROJECTOR="$projector" PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/tests -p 'test_*.py'

          grep -F "testHeldItemKanaMarkNeedsSameCellLiteralSupport]' passed" "$RUNNER_TEMP/r955-swift.log"
          grep -F "testSelectedMoveReadsRequireActualKanaCropForPromotion]' passed" "$RUNNER_TEMP/r955-swift.log"

          grep -F "testLateOnlyJournalSeparatesTimeoutHoldReturnAndCompletion]' passed" "$RUNNER_TEMP/r955-swift.log"
          grep -F "testReopensSealedOutputWithoutCaptureOriginalAndRejectsDamagedParts]' passed" "$RUNNER_TEMP/r955-swift.log"

          grep -F "testCorruptCatalogAndNotesAreRecoverableWithoutChangingOriginals]' passed" "$RUNNER_TEMP/r955-swift.log"

          grep -F "testSharesSealedSplitSetWithNoFullArchiveOrSplitAudit]' passed" "$RUNNER_TEMP/r955-swift.log"

          grep -F "testSourceFrameCoverageSeparatesRecentAttemptsFromOlderCandidatePayloads]' passed" "$RUNNER_TEMP/r955-swift.log"

          grep -F "testR954ReplaysRetainedAnimationAndTurnHeaderReceipts]' passed" "$RUNNER_TEMP/r955-swift.log"
          grep -F "testR954StatusOnSelectedOpponentCardRequiresLiteralInItsOwnRegion]' passed" "$RUNNER_TEMP/r955-swift.log"

          grep -F "testR955ReplaysSixOwnSelectionSlotsFromFrame435]' passed" "$RUNNER_TEMP/r955-swift.log"
      - name: Build the iPhone app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project pinned-r793/source/app/ios/ChampionsOnDeviceResearch.xcodeproj -scheme ChampionsOnDeviceResearch -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO -derivedDataPath "$RUNNER_TEMP/r955_device" build > "$RUNNER_TEMP/native.log" 2>&1 || { grep -E -B2 -A2 'error:|BUILD FAILED' "$RUNNER_TEMP/native.log"; exit 1; }
          grep -F 'BUILD SUCCEEDED' "$RUNNER_TEMP/native.log"
          app="$RUNNER_TEMP/r955_device/Build/Products/Release-iphoneos/ChampionsOnDeviceResearch.app"
          test "$(lipo -archs "$app/ChampionsOnDeviceResearch")" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Info.plist")" = 955
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist")" = 0.9.55
          echo R955_IPHONEOS_SOURCE_BUILDS
      - name: Verify and package the unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          out="$PWD/R955Delivery"
          app="$RUNNER_TEMP/r955_device/Build/Products/Release-iphoneos/ChampionsOnDeviceResearch.app"
          mkdir -p "$out/Payload"
          cp -R "$app" "$out/Payload/"
          cp pinned-r793/source/tools/restore_capture.py "$out/restore_capture.py"
          cd "$out"
          zip -jq R955_PC_Capture_Tools.zip restore_capture.py "$GITHUB_WORKSPACE"/pinned-r793/source/tools/{verify_collection,r810_evidence_export_audit,r875_native_capture_audit}.py
          mkdir pc-check
          unzip -q R955_PC_Capture_Tools.zip -d pc-check
          PYTHONDONTWRITEBYTECODE=1 python3 pc-check/verify_collection.py --help
          PYTHONDONTWRITEBYTECODE=1 python3 pc-check/restore_capture.py --help
          rm -rf pc-check
          zip -qry R955_Unsigned_DeviceTest.ipa Payload
          python3 - <<'IPA'
          import os,zipfile,hashlib,plistlib,subprocess,struct,json
          from pathlib import Path
          ipa=Path("R955_Unsigned_DeviceTest.ipa")
          app=Path("Payload/ChampionsOnDeviceResearch.app")
          with zipfile.ZipFile(ipa) as z:
              assert z.testzip() is None
              assert {i.filename for i in z.infolist() if not i.is_dir()}=={p.as_posix() for p in app.rglob('*') if p.is_file()}
              assert all(z.read(str(p))==p.read_bytes() for p in app.rglob('*') if p.is_file())
              info=plistlib.loads(z.read(str(app/'Info.plist')))
          assert (info['CFBundleShortVersionString'],info['CFBundleVersion'],info['MinimumOSVersion'],info['DTPlatformName'])==('0.9.55','955','27.0','iphoneos')
          assert info['CFBundleIdentifier']=='com.zeek10191019.championsresearch' and info['NSLocalNetworkUsageDescription'] and 'screen-capture' in info['UIBackgroundModes']
          binaries=[app/info['CFBundleExecutable'],*app.glob('*.dylib')]
          for binary in binaries:
              data=binary.read_bytes();magic,cpu,sub,kind,ncmds,cmdbytes,*_=struct.unpack_from('<8I',data)
              assert magic==0xfeedfacf and cpu==0x0100000c and kind in (2,6)
              assert subprocess.check_output(['lipo','-archs',str(binary)],text=True).strip()=='arm64'
              offset=32;platform=[]
              for _ in range(ncmds):
                  c,n=struct.unpack_from('<II',data,offset);assert n>=8 and offset+n<=len(data) and c!=29
                  if c==50:platform.append(struct.unpack_from('<I',data,offset+8)[0])
                  offset+=n
              assert offset==32+cmdbytes and platform==[2]
          sha=hashlib.sha256(ipa.read_bytes()).hexdigest()
          doc=dict(version='0.9.55',build=955,ipa_bytes=ipa.stat().st_size,ipa_sha256=sha,source_tree_sha256='4a6d54a6ffaf88047618a6d80c0cdf11d91d44dc250ab774922692d34c053b11',source_commit=os.environ['GITHUB_SHA'],device_certified_fields=0,iphone16plus_save='UNKNOWN',ci_run=os.environ['GITHUB_RUN_ID'])
          Path('VERIFICATION_R955.json').write_text(json.dumps(doc,indent=2)+'\n');print('R955_IPA_VERIFIED',json.dumps(doc))
          IPA
      - uses: actions/upload-artifact@v4
        with:
          name: r955-ipa
          path: R955Delivery/*
          if-no-files-found: error
          retention-days: 2
