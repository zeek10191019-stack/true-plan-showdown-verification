          grep -F 'R855_FAST_PNG_ICC_ALPHA_STRIDE_IMAGEIO_READBACK_PASS' "$RUNNER_TEMP/r955-vision.log"
  publish:
    name: Publish and verify the tested IPA
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    needs: [verify, vision]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: r955-ipa
          path: R955Delivery
      - name: Publish and verify the download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd R955Delivery
          python3 - <<'VERIFY'
          import hashlib,json,os
          from pathlib import Path
          p=Path('R955_Unsigned_DeviceTest.ipa')
          r=json.loads(Path('VERIFICATION_R955.json').read_text())
          assert r['source_commit']==os.environ['GITHUB_SHA'] and r['build']==955
          assert r['ipa_bytes']==p.stat().st_size
          assert r['ipa_sha256']==hashlib.sha256(p.read_bytes()).hexdigest()
          VERIFY
          tag=r955-device-test
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft > existing.json 2>/dev/null; then
            test "$(jq -r .isDraft existing.json)" = true
            gh release upload "$tag" R955_Unsigned_DeviceTest.ipa VERIFICATION_R955.json restore_capture.py R955_PC_Capture_Tools.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" R955_Unsigned_DeviceTest.ipa VERIFICATION_R955.json restore_capture.py R955_PC_Capture_Tools.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title 'R955 iPhone 実機テスト 0.9.55' --notes 'R953実機の一次OCRで認識したHPを、追加OCRの期限超過時にも証拠付きで保持。選出画面の自分の6体を保存。DETAIL入力の重複PNGデコードを削減し、詳細タイミングを記録。PC用の復元・検証ツールを同梱。'
          fi
          mkdir readback
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.ipa' --dir readback
          cmp R955_Unsigned_DeviceTest.ipa readback/R955_Unsigned_DeviceTest.ipa
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/R955_Unsigned_DeviceTest.ipa"
          curl --fail -sSL --retry 4 --retry-all-errors "$url" -o readback/published.ipa
          cmp R955_Unsigned_DeviceTest.ipa readback/published.ipa
          echo "R955_PUBLIC_READBACK_VERIFIED $url"

          curl --fail -sSL --retry 4 --retry-all-errors "${url%/*}/restore_capture.py" -o readback/restore_capture.py
          cmp restore_capture.py readback/restore_capture.py

          curl --fail -sSL --retry 4 --retry-all-errors "${url%/*}/R955_PC_Capture_Tools.zip" -o readback/R955_PC_Capture_Tools.zip
          cmp R955_PC_Capture_Tools.zip readback/R955_PC_Capture_Tools.zip
