      - uses: actions/checkout@v4
        with:
          ref: d86b8efc6901897e02c5520c1afd690b6297cddf
          path: pinned-r855
          sparse-checkout: .github/workflows/r855.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Diagnose actual capture image and compare explicit output colour
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e 'puts YAML.load_file(ARGV[0]).fetch("jobs").fetch("verify").fetch("steps").fetch(14).fetch("run")' pinned-r855/.github/workflows/r855.yml > "$RUNNER_TEMP/restore_r855.sh"
          bash "$RUNNER_TEMP/restore_r855.sh"
          cat > "$RUNNER_TEMP/main.swift" <<'SWIFT'
          import Foundation
          import CoreGraphics
          import CoreVideo
          import CoreImage
          import ImageIO
          
          let png=try Data(contentsOf:URL(fileURLWithPath:"pinned-r793/source/tests/fixtures/r761_real_move_panel.png"))
          let decoder=CGImageSourceCreateWithData(png as CFData,nil)!
          let original=CGImageSourceCreateImageAtIndex(decoder,0,nil)!
          var candidate:CVPixelBuffer?
          precondition(CVPixelBufferCreate(kCFAllocatorDefault,original.width,original.height,kCVPixelFormatType_32BGRA,
              [kCVPixelBufferCGImageCompatibilityKey:true,kCVPixelBufferCGBitmapContextCompatibilityKey:true] as CFDictionary,&candidate)==kCVReturnSuccess)
          let buffer=candidate!
          CVPixelBufferLockBaseAddress(buffer,[])
          let canvas=CGContext(data:CVPixelBufferGetBaseAddress(buffer),width:original.width,height:original.height,
              bitsPerComponent:8,bytesPerRow:CVPixelBufferGetBytesPerRow(buffer),space:CGColorSpaceCreateDeviceRGB(),
              bitmapInfo:CGBitmapInfo.byteOrder32Little.rawValue | CGImageAlphaInfo.premultipliedFirst.rawValue)!
          canvas.draw(original,in:CGRect(x:0,y:0,width:original.width,height:original.height))
          CVPixelBufferUnlockBaseAddress(buffer,[])
          let context=CIContext(options:[.useSoftwareRenderer:false]),input=CIImage(cvPixelBuffer:buffer)
          let bounds=CGRect(x:0,y:0,width:original.width,height:original.height)
          let image=context.createCGImage(input,from:bounds)!
          func metadata(_ label:String,_ image:CGImage) {
              let space=image.colorSpace!
              let canvas=CGContext(data:nil,width:17,height:9,bitsPerComponent:8,bytesPerRow:17*4,space:space,
                  bitmapInfo:CGImageAlphaInfo.premultipliedLast.rawValue | CGBitmapInfo.byteOrder32Big.rawValue)
              print("R856_META",label,"space=",String(describing:space.name),"model=",space.model.rawValue,
                  "bpc=",image.bitsPerComponent,"bpp=",image.bitsPerPixel,"alpha=",image.alphaInfo.rawValue,
                  "icc_bytes=",space.copyICCData().map{CFDataGetLength($0)} ?? -1,"canvas8=",canvas != nil)
          }
          func raster(_ image:CGImage)->Data {
              var bytes=Data(count:image.width*image.height*4)
              bytes.withUnsafeMutableBytes { raw in
                  let canvas=CGContext(data:raw.baseAddress,width:image.width,height:image.height,bitsPerComponent:8,
                      bytesPerRow:image.width*4,space:CGColorSpace(name:CGColorSpace.sRGB)!,
                      bitmapInfo:CGImageAlphaInfo.premultipliedLast.rawValue | CGBitmapInfo.byteOrder32Big.rawValue)!
                  canvas.setBlendMode(.copy);canvas.draw(image,in:CGRect(x:0,y:0,width:image.width,height:image.height))
              }
              return bytes
          }
          metadata("FIXTURE",original);metadata("DEFAULT_CI_CAPTURE",image)
          let baseline=R852CapturePNGEncoder.encode(buffer,context:context)!
          print("R856_BASELINE",baseline.encodingMethod,"PNG_BIT_DEPTH",baseline.png[24],"PNG_BYTES",baseline.png.count)
          let standard=context.createCGImage(input,from:bounds,format:.RGBA8,colorSpace:CGColorSpace(name:CGColorSpace.sRGB)!)!
          metadata("EXPLICIT_RGBA8_SRGB",standard)
          let start=ProcessInfo.processInfo.systemUptime
          let fast=R855FastLosslessPNG.encode(standard)
          print("R856_FAST_EXPLICIT",fast != nil,"MS",Int((ProcessInfo.processInfo.systemUptime-start)*1000),"BYTES",fast?.png.count ?? -1)
          let oldDecoder=CGImageSourceCreateWithData(baseline.png as CFData,nil)!
          let oldPNG=CGImageSourceCreateImageAtIndex(oldDecoder,0,nil)!
          metadata("PREVIOUS_IMAGEIO_PNG",oldPNG)
          let before=raster(oldPNG),after=raster(standard)
          var changed=0,largest=0
          before.withUnsafeBytes { a in after.withUnsafeBytes { b in
              let av=a.bindMemory(to:UInt8.self),bv=b.bindMemory(to:UInt8.self)
              for i in 0..<av.count {let delta=abs(Int(av[i])-Int(bv[i]));if delta>0{changed+=1;largest=max(largest,delta)}}
          }}
          print("R856_RGBA8_SRGB_VERSUS_PREVIOUS_PNG",before==after,"CHANGED_COMPONENTS",changed,"MAX_DELTA",largest)
          if let fast {
              let source=CGImageSourceCreateWithData(fast.png as CFData,nil)!,decoded=CGImageSourceCreateImageAtIndex(source,0,nil)!
              print("R856_FAST_PNG_DECODER_MATCH",raster(decoded)==raster(fast.image),"BIT_DEPTH",fast.png[24])
          }
          print("R856_DIAGNOSTIC_ONLY_NO_IPA_NO_SPEED_CERTIFICATION")
          SWIFT
          swiftc -O pinned-r793/source/app/ios/ChampionsOnDevice/R852CapturePNGEncoder.swift pinned-r793/source/app/ios/ChampionsOnDevice/R855FastLosslessPNG.swift "$RUNNER_TEMP/main.swift" -o "$RUNNER_TEMP/r856_diagnostic"
          "$RUNNER_TEMP/r856_diagnostic"
