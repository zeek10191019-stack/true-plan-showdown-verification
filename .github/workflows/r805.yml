    - name: R797 repeat independent HP Vision observations on original PNG (no auto-correction)
      if: always() && matrix.lane == 'real-apple-vision'
      shell: bash
      run: "set -euo pipefail\nmkdir -p R797Proof\ncat > R797Proof/HP_probe.swift <<'SWIFT_R797'\nimport Foundation\n\
        import Vision\nimport ImageIO\nimport CoreGraphics\nimport CryptoKit\n\nstruct ProbeFailure: Error { let\
        \ reason: String }\nlet pngPath = \"source/tests/fixtures/r761_real_move_panel.png\"\nlet png = try Data(contentsOf:\
        \ URL(fileURLWithPath: pngPath))\nlet originalHash = SHA256.hash(data: png).map { String(format: \"%02x\"\
        , $0) }.joined()\nguard originalHash == \"b394a69fd74f46537915e1803f17fa11348b22041c297bfec8e54f89c5a7df62\"\
        \ else {\n    throw ProbeFailure(reason: \"UNEXPECTED_SOURCE_IMAGE_SHA\")\n}\nguard let src = CGImageSourceCreateWithData(png\
        \ as CFData, nil),\n      let original = CGImageSourceCreateImageAtIndex(src, 0, nil) else {\n    throw\
        \ ProbeFailure(reason: \"SOURCE_PNG_DECODE_FAILED\")\n}\nguard original.width == 2796 && original.height\
        \ == 1290 else {\n    throw ProbeFailure(reason: \"UNEXPECTED_SOURCE_IMAGE_DIMENSIONS\")\n}\n// This is\
        \ a diagnostic crop around the HP HUD, not a certified game ROI.\n// All results remain untrusted OCR text\
        \ from the same saved test PNG.\nlet hpRect = CGRect(x: 410, y: 1120, width: 395, height: 158)\nguard let\
        \ hpCrop = original.cropping(to: hpRect) else {\n    throw ProbeFailure(reason: \"HP_ROI_CROP_FAILED\")\n\
        }\nfunc recognize(_ image: CGImage, label: String, trial: Int) throws -> [String:Any] {\n    let request\
        \ = VNRecognizeTextRequest()\n    request.recognitionLevel = .accurate\n    request.recognitionLanguages\
        \ = [\"ja-JP\", \"en-US\"]\n    request.usesLanguageCorrection = false\n    let start = ProcessInfo.processInfo.systemUptime\n\
        \    try VNImageRequestHandler(cgImage: image, orientation: .up, options: [:]).perform([request])\n    let\
        \ ms = (ProcessInfo.processInfo.systemUptime - start) * 1000\n    let observed: [[String: Any]] = (request.results\
        \ ?? []).map { row in\n        let candidates = row.topCandidates(3).map { item -> [String:Any] in\n   \
        \         [\"text\":item.string, \"confidence\":Double(item.confidence)]\n        }\n        return [\"\
        text_candidates\":candidates,\n                \"bbox_normalized\":[Double(row.boundingBox.minX),Double(row.boundingBox.minY),\n\
        \                                   Double(row.boundingBox.width),Double(row.boundingBox.height)]]\n   \
        \ }\n    let hpLike = observed.filter { item in\n        guard let first=(item[\"text_candidates\"] as?\
        \ [[String:Any]])?.first,\n              let text=first[\"text\"] as? String else { return false }\n   \
        \     return text.contains(\"/\") || text.contains(\"187\") || text.contains(\"87\")\n    }\n    return\
        \ [\"label\":label, \"trial\":trial, \"raster_width\":image.width,\n            \"raster_height\":image.height,\
        \ \"elapsed_ms\":ms,\n            \"candidate_rows\":observed.count,\n            \"hp_like_rows\":hpLike,\n\
        \            \"source_png_sha256\":originalHash,\n            \"untrusted_ocr_only\":true]\n}\nvar observations:\
        \ [[String:Any]] = []\nfor trial in 1...3 {\n    observations.append(try recognize(original, label:\"full_source_accurate\"\
        , trial:trial))\n    observations.append(try recognize(hpCrop, label:\"hp_crop_accurate\", trial:trial))\n\
        }\nlet report: [String:Any] = [\n    \"revision\":\"R797\", \"scope\":\"MAC_NATIVE_VISION_DIAGNOSTIC_NOT_DEVICE\"\
        ,\n    \"source_png_sha256\":originalHash, \"source_size\":[2796,1290],\n    \"hp_crop_source_rect\":[410,1120,395,158],\n\
        \    \"source_pixel_bytes_unchanged\":true,\n    \"language_correction\":false,\n    \"repeat_count_per_mode\"\
        :3,\n    \"method_description\":\"CGImage original vs local cropped original; does not assert production-parity\"\
        ,\n    \"runtime_game_hp_certified\":false,\n    \"device_fields_certified\":0,\n    \"readings\":observations]\n\
        let result=try JSONSerialization.data(withJSONObject:report,options:[.prettyPrinted,.sortedKeys])\ntry result.write(to:URL(fileURLWithPath:\"\
        R797Proof/HP_STABILITY.json\"))\nprint(\"R797 six independent raw OCR observations saved, no game HP certification\"\
        )\nSWIFT_R797\nset +e\nswift R797Proof/HP_probe.swift > R797Proof/HP_probe.log 2>&1\ndiagnostic_status=$?\n\
        set -e\nprintf '%s\\n' \"$diagnostic_status\" > R797Proof/HP_probe.exit\nif [ \"$diagnostic_status\" -ne\
        \ 0 ]; then\n  tail -80 R797Proof/HP_probe.log\n  exit 1\nfi\ntest -f R797Proof/HP_STABILITY.json\npython3\
        \ - <<'PYR797VALID'\nimport json\nfrom pathlib import Path\nv=json.loads(Path('R797Proof/HP_STABILITY.json').read_text())\n\
        assert v['source_png_sha256']=='b394a69fd74f46537915e1803f17fa11348b22041c297bfec8e54f89c5a7df62'\nassert\
        \ len(v['readings'])==6\nassert {x['label'] for x in v['readings']}=={'full_source_accurate','hp_crop_accurate'}\n\
        assert v['device_fields_certified']==0\nprint('Original real PNG SHA and six OCR diagnostic reads: PASS')\n\
        PYR797VALID\n"
