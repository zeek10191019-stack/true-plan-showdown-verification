name: R597 Screen Form Evidence Bridge Audit (No IPA)
"on":
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      PYTHONOPTIMIZE: "0"
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
    steps:
      - name: Restore SHA-pinned R596 workflow and exact R595 parent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'R597_PARENT_REPLAY'
          import ast,hashlib,re,textwrap,urllib.request
          from pathlib import Path
          url='https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/d44731b53f2fb4acd3742b34e46add4ec064b9a5/.github/workflows/an.yml'
          raw=urllib.request.urlopen(url,timeout=90).read()
          git_blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert len(raw)==17075 and git_blob=='4b3880df46b8151341e52181bcebee8dfe841e46','R597_R596_PARENT_PIN_INVALID'
          for marker in ('R596_REPLAY','R596_DELTA'):
              m=re.search(r"python3 - <<'"+marker+r"'\n(.*?)\n\s+"+marker,raw.decode(),re.S)
              assert m,('PARENT_BLOCK_MISSING',marker)
              code=textwrap.dedent(m.group(1))
              ast.parse(code)
              exec(compile(code,marker+'_PINNED','exec'))
          assert len(list(Path('app/ios/ChampionsOnDevice').glob('*.swift')))==137
          print('R597_R596_PARENT_PIN_AND_FOUR_DELTA_FILES_PASS')
          R597_PARENT_REPLAY
