name: R1008 C5 source and Lenovo-iPhone audit (checkout-free, NO IPA)
'on':
  # Auto-run ONLY this C5 workflow on upload to main. Note: unrelated legacy
  # workflows in this repository may also respond to any main-branch push.
  push:
    branches: [main]
    paths:
      - '.github/workflows/r1008-c5-selfcontained-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r1008-c5-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos-source-restoration:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Guard public-repo and runner toolchains; never checkout long filename
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == 'zeek10191019-stack/true-plan-showdown-verification' ]]
          [[ '${{ github.event.repository.private }}' == 'false' ]]
          for tool in git ruby python3 swiftc; do command -v "$tool"; done
          echo "C5_CHECKOUT_FREE_SAFE_START"
      - name: Read only this workflow from Git objects; no working-tree checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          repo="$RUNNER_TEMP/c5-git"
          mkdir -p "$repo"
          git -C "$repo" init -q
          git -C "$repo" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$repo" fetch -q --no-tags --filter=blob:none --depth=1 origin "$GITHUB_SHA"
          [[ "$(git -C "$repo" rev-parse FETCH_HEAD)" == "$GITHUB_SHA" ]]
          git -C "$repo" show "$GITHUB_SHA:.github/workflows/r1008-c5-selfcontained-audit.yml" > "$RUNNER_TEMP/r1008-c5-self.yml"
          test -s "$RUNNER_TEMP/r1008-c5-self.yml"
          echo "C5_BLOB_READ_WITHOUT_CHECKOUT_OK"
      - name: Unpack embedded SHA-pinned C4 full archive with ZIP traversal protection
        shell: bash
        env:
          EXPECTED_ZIP_SHA: 312ff6f5e2d73a503a8487ae13f6a464d4d1f5cb9437cd64a322539bd7bc5a1e
        run: |
          set -Eeuo pipefail
          python3 - "$RUNNER_TEMP/r1008-c5-self.yml" "$RUNNER_TEMP/r1008-c5-pack" "$EXPECTED_ZIP_SHA" <<'PY'
          import base64,hashlib,io,re,sys,zipfile
          from pathlib import Path,PurePosixPath
          workflow=Path(sys.argv[1]); dest=Path(sys.argv[2]); expected=sys.argv[3].lower()
          lines=workflow.read_text(encoding='utf-8').splitlines()
          begin='# R1008_C5_BUNDLE_BASE64_BEGIN'; end='# R1008_C5_BUNDLE_BASE64_END'
          assert lines.count(begin)==1 and lines.count(end)==1, 'MISSING_OR_DUPLICATED_MARKERS'
          a=lines.index(begin); b=lines.index(end)
          assert a<b and 0<b-a<16000, 'UNEXPECTED_PAYLOAD_BOUNDS'
          encoded=''.join(line[2:].strip() for line in lines[a+1:b] if line.startswith('# '))
          assert len(encoded)>10000 and re.fullmatch(r'[A-Za-z0-9+/=]+',encoded)
          raw=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(raw).hexdigest()==expected, 'EMBEDDED_ZIP_SHA_MISMATCH'
          dest.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None, 'ZIP_CRC_FAILED'
              for member in z.infolist():
                  p=PurePosixPath(member.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in member.filename, 'UNSAFE_ZIP_PATH'
                  mode=member.external_attr>>16
                  assert mode & 0o170000 != 0o120000, 'UNSAFE_SYMLINK'
              z.extractall(dest)
          print('C5_EMBEDDED_C4_SHA256_PASS',len(raw),'bytes')
          PY
          cd "$RUNNER_TEMP/r1008-c5-pack"
          python3 VERIFY_C4_PACK.py
          python3 R1008_C4_REPRODUCE_PREVIOUS_FAILURE.py
          echo 'C5_C4_ARCHIVE_AND_FAILURE_REPRO_PASS'
      - name: Run comprehensive existing Lenovo and iPhone offline regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/r1008-c5-pack"
          bash RUN_ALL_LOCAL_TESTS.sh
          echo 'C5_OFFLINE_REGRESSION_PASS'
      - name: Obtain source history without checkout and restore R999 AI024
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          repo="$RUNNER_TEMP/c5-git"
          git -C "$repo" fetch -q --no-tags --filter=blob:none origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/ai024-pc-pairing:refs/remotes/origin/ai024-pc-pairing'
          git -C "$repo" cat-file -e '32f1b2014d6be23e169e50e5de52466ed1212ab3^{commit}'
          export GITHUB_WORKSPACE="$repo"
          bash "$RUNNER_TEMP/r1008-c5-pack/R1008_C4_RESTORE_R999_ON_MACOS.sh" "$RUNNER_TEMP/r1008-c5-pack"
          test -s "$RUNNER_TEMP/r1008-c4-source-discovery.json"
          echo 'C5_R999_SOURCE_RESTORED_AND_DISCOVERED'
      - name: Parse restored iPhone Swift and verify fail-closed release Gate (NO IPA)
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/c5-git/pinned-r793/source"
          swiftc -frontend -parse "$root/app/ios/ChampionsOnDevice/CaptureCoordinator.swift" \
            "$root/app/ios/ChampionsOnDevice/R920QuickPCDisplay.swift" \
            "$root/app/ios/ChampionsOnDevice/R1001BattleSafetyCore.swift" \
            "$root/app/ios/ChampionsOnDevice/R1000CapturePCBridge.swift" \
            "$root/app/ios/ChampionsOnDevice/R1006CaptureHubStatus.swift" \
            "$root/app/ios/ChampionsOnDevice/R1007CaptureIntegrationAdapter.swift"
          python3 - "$RUNNER_TEMP/r1008-c4-source-discovery.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert data['r999_restored_source']
          assert not data['production_capture_hooks_wired']
          assert not data['xcode_target_registered']
          assert not data['native_iphoneos_build_passed']
          assert not data['ipa_approved']
          print('C5_PARSE_ONLY_NOT_INTEGRATED_NO_IPA')
          PY
  windows-hosted-clis:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Fetch only workflow blob without checkout (Windows illegal path workaround)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = Join-Path $env:RUNNER_TEMP 'c5-git'
          New-Item -ItemType Directory -Force -Path $repo | Out-Null
          & git -C $repo init -q
          if ($LASTEXITCODE -ne 0) { throw 'GIT_INIT_FAILED' }
          & git -C $repo remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          & git -C $repo fetch -q --no-tags --filter=blob:none --depth=1 origin $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'GIT_FETCH_FAILED' }
          $workflow = Join-Path $env:RUNNER_TEMP 'r1008-c5-self.yml'
          $lines = & git -C $repo show "${env:GITHUB_SHA}:.github/workflows/r1008-c5-selfcontained-audit.yml"
          if ($LASTEXITCODE -ne 0) { throw 'GIT_SHOW_FAILED' }
          [System.IO.File]::WriteAllLines($workflow, [string[]]$lines, [Text.UTF8Encoding]::new($false))
          Write-Output 'C5_WINDOWS_CHECKOUT_FREE_OK'
      - name: Decode embedded offline pack and verify Lenovo CMD and PowerShell
        shell: pwsh
        env:
          EXPECTED_ZIP_SHA: 312ff6f5e2d73a503a8487ae13f6a464d4d1f5cb9437cd64a322539bd7bc5a1e
        run: |
          $ErrorActionPreference = 'Stop'
          $workflow = Join-Path $env:RUNNER_TEMP 'r1008-c5-self.yml'
          $dest = Join-Path $env:RUNNER_TEMP 'r1008-c5-pack'
          @'
          import base64,hashlib,io,re,sys,zipfile
          from pathlib import Path,PurePosixPath
          workflow=Path(sys.argv[1]); dest=Path(sys.argv[2]); expected=sys.argv[3].lower()
          lines=workflow.read_text(encoding='utf-8').splitlines()
          begin='# R1008_C5_BUNDLE_BASE64_BEGIN'; end='# R1008_C5_BUNDLE_BASE64_END'
          assert lines.count(begin)==1 and lines.count(end)==1, 'MISSING_OR_DUPLICATED_MARKERS'
          a=lines.index(begin); b=lines.index(end)
          assert a<b and 0<b-a<16000, 'UNEXPECTED_PAYLOAD_BOUNDS'
          encoded=''.join(line[2:].strip() for line in lines[a+1:b] if line.startswith('# '))
          assert len(encoded)>10000 and re.fullmatch(r'[A-Za-z0-9+/=]+',encoded)
          raw=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(raw).hexdigest()==expected, 'EMBEDDED_ZIP_SHA_MISMATCH'
          dest.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None, 'ZIP_CRC_FAILED'
              for member in z.infolist():
                  p=PurePosixPath(member.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in member.filename, 'UNSAFE_ZIP_PATH'
                  mode=member.external_attr>>16
                  assert mode & 0o170000 != 0o120000, 'UNSAFE_SYMLINK'
              z.extractall(dest)
          print('C5_EMBEDDED_C4_SHA256_PASS',len(raw),'bytes')
          '@ | python - $workflow $dest $env:EXPECTED_ZIP_SHA
          if ($LASTEXITCODE -ne 0) { throw "PACK_EXTRACT_FAILED:$LASTEXITCODE" }
          Set-Location $dest
          & python VERIFY_C4_PACK.py
          if ($LASTEXITCODE -ne 0) { throw 'MANIFEST_BAD' }
          $script = Get-Content -LiteralPath 'VERIFY_AND_OPEN_REPLAY.ps1' -Raw
          [scriptblock]::Create($script) | Out-Null
          $env:TRUEPLAN_CI = '1'
          & cmd.exe /d /c 'TEST_LOCAL.cmd'
          if ($LASTEXITCODE -ne 0) { throw "CMD_REGRESSION_FAILED:$LASTEXITCODE" }
          Write-Output 'C5_WINDOWS_CMD_POWERSHELL_SAFE_SMOKE_PASS_NOT_LENOVO_PHYSICAL'
# This workflow does NOT upload artifacts, package/release IPA, run Xcode builds,
