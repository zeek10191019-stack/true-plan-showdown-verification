# R27.465: public research app only. Manual trigger; no paid API, no signing.
# WARNING: public YAML embeds full Swift source. Review source before uploading.
name: R27465 Champions Research iPhoneOS gender OCR candidate build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r27465-ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false && github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - name: Verify and unpack bundled research source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import base64,hashlib,io,json,zipfile
          from pathlib import Path
          source=base64.b64decode('')
          assert hashlib.sha256(source).hexdigest()=='9c00cc7728ccb18ecab2e19dbc0d76db4185e1c8a67d15fb037500aad17e8089'
          with zipfile.ZipFile(io.BytesIO(source)) as z:
              assert z.testzip() is None
              for member in z.infolist():
                  p=Path(member.filename)
                  assert not p.is_absolute() and all(part not in ('..','') for part in p.parts)
              z.extractall('.')
          manifest=json.loads(Path('PUBLIC_SOURCE_SHA256.json').read_text())
          for filename, expected in manifest.items():
              actual=hashlib.sha256(Path(filename).read_bytes()).hexdigest()
              assert actual==expected,filename
          print('R27465_SHA256_SOURCE_CLOSURE=PASS, files='+str(len(manifest)))
          PYCODE
      - name: Native tests and Swift parse
        shell: bash
        run: |
          set -euo pipefail
          swiftc ios/ChampionsOnDevice/ResearchBattleWire.swift native_wire_tests/main.swift -o "$RUNNER_TEMP/wire"
          "$RUNNER_TEMP/wire" | grep -E 'SWIFT_RESEARCH_ASSERTIONS_PASS='
          swiftc ios/ChampionsOnDevice/FrameEvidenceExportGate.swift native_evidence_tests/main.swift -o "$RUNNER_TEMP/evidence"
          "$RUNNER_TEMP/evidence"
          swiftc ios/ChampionsOnDevice/ResearchBattleWire.swift ios/ChampionsOnDevice/ResearchOwnerGate.swift ios/ChampionsOnDevice/ResearchMoveCandidates.swift ios/ChampionsOnDevice/ResearchScreenClassifier.swift ios/ChampionsOnDevice/ResearchNameAndGenderCandidates.swift ios/ChampionsOnDevice/ResearchHPCandidateConsensus.swift native_regression_tests/main.swift -o "$RUNNER_TEMP/regression"
          "$RUNNER_TEMP/regression"
          swiftc ios/ChampionsOnDevice/ResearchBattleWire.swift ios/ChampionsOnDevice/ResearchOwnerGate.swift ios/ChampionsOnDevice/ResearchScreenClassifier.swift ios/ChampionsOnDevice/ResearchNameAndGenderCandidates.swift ios/ChampionsOnDevice/ResearchGenderGlyphProbe.swift native_gender_tests/main.swift -o "$RUNNER_TEMP/gender"
          "$RUNNER_TEMP/gender"
          swiftc ios/ChampionsOnDevice/FrameEvidenceExportGate.swift native_export_budget_tests/main.swift -o "$RUNNER_TEMP/exportbudget"
          "$RUNNER_TEMP/exportbudget"
          python3 - <<'PYCODE'
          from pathlib import Path
          import subprocess
          files=sorted(Path('ios/ChampionsOnDevice').glob('*.swift'))
          assert len(files)==35,len(files)
          for f in files:
              subprocess.run(['swiftc','-frontend','-parse',str(f)],check=True)
          print('R27465_SWIFT_PARSE_PASS='+str(len(files)))
          PYCODE
      - name: Xcode unsigned iPhoneOS build and restore IPA in logs
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          test -d "$sdk/System/Library/Frameworks/ScreenCaptureKit.framework"
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate --spec ios/project.yml --project ios
          if ! xcodebuild -project ios/ChampionsOnDeviceResearch.xcodeproj -scheme ChampionsOnDeviceResearch \
                 -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' \
                 ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
                 -derivedDataPath "$RUNNER_TEMP/r27465-derived" build > "$RUNNER_TEMP/r27465-build.log" 2>&1; then
            grep -E 'error:|BUILD FAILED' "$RUNNER_TEMP/r27465-build.log" | tail -30 || true
            exit 1
          fi
          echo 'R27465_IPHONEOS_UNSIGNED_COMPILE=PASS'
          mkdir -p dist
          python3 package_unsigned_ipa.py "$RUNNER_TEMP/r27465-derived/Build/Products/Debug-iphoneos/ChampionsOnDeviceResearch.app" dist
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64,hashlib,plistlib,zipfile
          p=Path('dist/R27_465_Unsigned_ChampionsResearch.ipa')
          blob=p.read_bytes()
          assert 1_000<len(blob)<5_000_000
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              plist=plistlib.loads(z.read('Payload/ChampionsOnDeviceResearch.app/Info.plist'))
              assert plist['CFBundleVersion']=='465'
              assert plist['CFBundleShortVersionString']=='0.4.65'
          print('R27465_IPA_SHA256='+hashlib.sha256(blob).hexdigest())
          print('R27465_IPA_BYTES='+str(len(blob)))
          print('R27465_IPA_BASE64_BEGIN')
          encoded=base64.b64encode(blob).decode()
          for i in range(0,len(encoded),3000):
              print('R27465_IPA_CHUNK_%06d=%s'%(i//3000,encoded[i:i+3000]))
          print('R27465_IPA_BASE64_END')
          print('RESEARCH_ONLY_FORMAL_HOLD_STAGE1_5_560_NATIVE33_0_EXACT34_0')
          PYCODE
