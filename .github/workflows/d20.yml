        eaq5sMPdFqb+hW2ByoPaBCuhQoM5fxtMw/zf44ZUv37biFPjZcdvVT//yntMVIEJ/YyvqdES
        UG2jQWWY1kFDirhPFGURXTRcTi+gw+XSxfCMeJXaqxUAAAAAV9wkm87TjhwAAcU0l/wBAHQn
        g1OxxGf7AgAAAAAEWVo=
        '''
        patch=lzma.decompress(base64.b64decode(
         ''.join(packed.split())))
        assert sha(patch)==(
         'a138848616aaad7dadb7b7d16d66cbee'
         '6a76ca15f0d8d7990f377d75f49b8c37')
        assert tree(before)==(
         'fa79a7ffe8a6de221e22329dddbddac9'
         '880e9d93de3ad7ac5353403341683173')
        import subprocess
        subprocess.run(['patch','-p1'],cwd=root,input=patch,check=True)
        manifest={n:sha(b) for n,b in scan().items()
         if n!='source_manifest.json'}
        dest=root/'source_manifest.json'
        dest.write_text(json.dumps(manifest,sort_keys=True,
         indent=2,ensure_ascii=False)+'\n')
        assert sha(dest.read_bytes())==(
         '54c720d3eb248f7650c3d37f8c561e26'
         '26c84f9722026073c0376418dbf2a6a1')
        after=scan()
        assert len(after)==426 and set(before)<=set(after)
        assert tree(after)==(
         '7406ab5f355a581edd5f0fe778295f49'
         'd8e52ac67aeeac291157ccd06f075617')
        (pathlib.Path('R759Proof')/'HASHES.json').write_text(
         json.dumps({n:sha(b) for n,b in after.items()},sort_keys=True))
        print('R759 426/426 FILE SHA PASS ZERO DELETIONS')
        PYTHON
