    - name: Package source delta diagnostics and no IPA
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYTHON'
        import pathlib,zipfile,hashlib,json
        root=pathlib.Path('source');out=pathlib.Path('R759Proof')
        expected=json.loads((out/'HASHES.json').read_text())
        assert len(expected)==426
        names=[
         'app/ios/ChampionsOnDevice/CaptureCoordinator.swift',
         'app/ios/ChampionsOnDevice/R686FrameJournal.swift',
         'app/ios/ChampionsOnDevice/R759PNGEncodeGate.swift',
         'R720_PORTABLE_TESTS/Sources/R719Core/R759PNGEncodeGate.swift',
         'R720_PORTABLE_TESTS/Tests/R719CoreTests/R759PNGEncodeGateTests.swift',
         'R759_CHANGELOG.md',
         'source_manifest.json',
        ]
        with zipfile.ZipFile(out/'R759_CHANGESET_ONLY.zip','w',
         zipfile.ZIP_DEFLATED) as z:
         for n in names:
          b=(root/n).read_bytes()
          assert hashlib.sha256(b).hexdigest()==expected[n]
          z.writestr(n,b)
        (out/'STATUS.txt').write_text(
         'R759 426 source files retained. NO IPA.\n'
         'Capture PNG off callback. Device freeze NOT certified fixed.\n'
         'Video, live OCR and 79-field device verification still required.\n')
