name: R759 Asynchronous Capture PNG and Journal NO IPA
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/d20.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
    - name: Restore SHA-pinned R757 source with prior d19 procedure
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p R759Proof
        url='https://raw.githubusercontent.com/'
        url+='zeek10191019-stack/'
        url+='true-plan-showdown-verification/'
        url+='main/.github/workflows/d19.yml'
        curl -fLsS --retry 3 "$url" -o /tmp/r759_pinned_d19.yml
        expected='dfdc3e5edce84387a6b7e6fb283a81e9'
        expected+='fcd472599faf6c2e7668cbf3076b4ecb'
        actual=$(shasum -a 256 /tmp/r759_pinned_d19.yml | cut -d' ' -f1)
        test "$actual" = "$expected"
        python3 - <<'PYTHON'
        from pathlib import Path
        lines=Path('/tmp/r759_pinned_d19.yml').read_text().splitlines()
        assert lines[0].startswith('name: R757 Base64 Verified')
        stop=next(i for i,line in enumerate(lines)
         if line.startswith('    - name: Run original Swift'))
        runs=[]
        for i,line in enumerate(lines[:stop]):
         if line.strip()!='run: |':continue
         block=[]
         for raw in lines[i+1:]:
          if raw.strip() and len(raw)-len(raw.lstrip())<=6:break
          block.append(raw)
         nonempty=[len(x)-len(x.lstrip()) for x in block if x.strip()]
         assert nonempty
         indent=min(nonempty)
         runs.append('\n'.join(x[indent:] if x.strip() else ''
          for x in block))
        assert len(runs)==2,len(runs)
        Path('/tmp/r759_restore_r757.sh').write_text(
         '\n'.join(runs)+'\n')
        PYTHON
        bash /tmp/r759_restore_r757.sh
        python3 - <<'PYTHON'
        import pathlib,hashlib
        root=pathlib.Path('source')
        sha=lambda b:hashlib.sha256(b).hexdigest()
        files={p.relative_to(root).as_posix():p.read_bytes()
         for p in root.rglob('*') if p.is_file()}
        actual=sha(''.join(n+'\t'+sha(files[n])+'\n'
         for n in sorted(files)).encode())
        expected=(
         'fa79a7ffe8a6de221e22329dddbdd'
         'ac9880e9d93de3ad7ac5353403341683173')
        assert len(files)==422 and actual==expected
        print('R757 422 FILE PINNED RESTORE PASS')
        PYTHON
    - name: Apply R759 only SHA-verified delta NO IPA
