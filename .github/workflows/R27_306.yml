        \  return Object.freeze({choice:ranked.best,legal,ranked:ranked.ranked,scope:'PINNED_SHOWDOWN_PUBLIC_REQUEST_HYPOTHETICAL_ORACLE'});\n}\nmodule.exports={legalPublicActions,publicPreviewChoice,rankPublicActions};\n\
        R27303_BRIDGE_EOF\nprintf '%s  %s\\n' 'e53598c89511a3c3eab927adc8b4ccb243130e086ae197a5404d12fd2cdd72c9' 'research/public_action_bridge.cjs' | sha256sum -c\
        \ -\ncat > research/test_r27303_unit.cjs <<'R27303_UNIT_EOF'\n'use strict';\nconst assert=require('node:assert/strict');\nconst {legalPublicActions,publicPreviewChoice,rankPublicActions}=require('./public_action_bridge.cjs');\n\
        const roster=[\n  {active:true,condition:'100/100'},{active:false,condition:'120/120'},\n  {active:false,condition:'0 fnt'},{active:false,condition:'42/100'}\n\
        ];\nconst request={active:[{moves:[{id:'flamethrower',pp:10,disabled:false},{id:'scratch',pp:30,disabled:false}]}],side:{pokemon:roster}};\nlet n=0;function\
