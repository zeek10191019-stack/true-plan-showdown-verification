name: R27.306 Pinned Two-Turn Policy Sensitivity and Forced Replacement
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  public-joint-action-probe:
    if: ${{ github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Set pinned Node.js 22.18.0
      uses: actions/setup-node@v4
      with:
        node-version: 22.18.0
    - name: Pinned public one-ply and bounded two-turn explicit hypothesis smoke
      shell: bash
      run: "set -euo pipefail\nmkdir -p research\ncat > research/joint_action_ranker.cjs <<'R27302_JOINT_ACTION_RANKER_CJS_EOF'\n'use strict';\n/** R27.299 research\
        \ contract. No physics claims: a caller-supplied hypothetical\n * PUBLIC-STATE oracle generates outcomes for each (own, opponent, belief world).\n * This\
        \ module NEVER constructs hidden sets or reads simulator battle internals.\n */\nconst VERSION='r27.299.joint-action-ranking.contract.v1';\nconst EPS=1e-9;\n\
        function ensure(x,code){if(!x)throw Error('R27299_RANK_'+code);}\nfunction probSet(xs,label){\n ensure(Array.isArray(xs)&&xs.length>0&&xs.length<=64,label+'_LENGTH');\n\
        \ let seen=new Set(),sum=0;\n xs.forEach(x=>{ensure(x&&typeof x.id==='string'&&x.id.length>0&&!seen.has(x.id),label+'_ID');seen.add(x.id);\n  ensure(typeof\
        \ x.p==='number'&&Number.isFinite(x.p)&&x.p>=0&&x.p<=1,label+'_P');sum+=x.p;});\n ensure(Math.abs(sum-1)<=EPS,label+'_SUM');return xs;\n}\nfunction sanitizedPublicObservation(obs){\n\
        \ ensure(obs&&typeof obs==='object'&&!Array.isArray(obs),'OBS');\n const allowed=new Set(['v','phase','turn','own','active','foe','forceSwitch','maxChosenTeamSize','publicHistory']);\n\
        \ ensure(Object.keys(obs).every(k=>allowed.has(k)),'OBS_UNDECLARED_FIELD');\n const foe=obs.foe||{};\n ensure(typeof foe==='object'&&Object.keys(foe).every(k=>['species','condition','status','visibleMoves','publicTypes'].includes(k)),'FOE_PRIVATE_FIELD');\n\
        \ const o=JSON.parse(JSON.stringify(obs));\n if(o.foe&&o.foe.visibleMoves){ensure(Array.isArray(o.foe.visibleMoves),'FOE_VISIBLE_MOVES');}\n return o;\n}\n\
        function rankJointActions({observation,ownLegal,opponentActions,worlds,oracle,riskWeight=0,revisitWeight=0}={}){\n const publicObs=sanitizedPublicObservation(observation);\n\
        \ ensure(Array.isArray(ownLegal)&&ownLegal.length>0&&ownLegal.length<=36&&ownLegal.every(x=>typeof x==='string'&&x.length>0),'LEGAL');\n ensure(new Set(ownLegal).size===ownLegal.length,'DUPLICATE_ACTION');\n\
        \ ensure(typeof oracle==='function','ORACLE');\n ensure([riskWeight,revisitWeight].every(x=>Number.isFinite(x)&&x>=0&&x<=10),'PENALTY');\n probSet(opponentActions,'OPP');probSet(worlds,'WORLD');\n\
        \ const rows=ownLegal.map((a,index)=>{\n  let mean=0,worst=1,revisit=0;\n  for(const world of worlds)for(const opp of opponentActions){\n   const branches=oracle({observation:publicObs,ownAction:a,opponentAction:opp.id,worldId:world.id});\n\
        \   ensure(Array.isArray(branches)&&branches.length>0&&branches.length<=128,'BRANCHES');\n   let branchProb=0;\n   for(const b of branches){\n    ensure(b&&Number.isFinite(b.p)&&b.p>=0&&b.p<=1,'BRANCH_P');\n\
        \    ensure(Number.isFinite(b.value)&&b.value>=0&&b.value<=1,'VALUE');\n    ensure(Number.isFinite(b.revisit)&&b.revisit>=0&&b.revisit<=1,'REVISIT');\n  \
        \  const w=world.p*opp.p*b.p;mean+=w*b.value;revisit+=w*b.revisit;if(w>0)worst=Math.min(worst,b.value);branchProb+=b.p;\n   }\n   ensure(Math.abs(branchProb-1)<=EPS,'BRANCH_SUM');\n\
        \  }\n  const score=mean-riskWeight*(1-worst)-revisitWeight*revisit;\n  return {action:a,mean:+mean.toFixed(8),worst:+worst.toFixed(8),revisit:+revisit.toFixed(8),score:+score.toFixed(8),index};\n\
        \ });\n rows.sort((a,b)=>b.score-a.score||a.index-b.index);\n return Object.freeze({version:VERSION,ranked:rows.map(({index,...rest})=>Object.freeze(rest)),best:rows[0].action,mode:'HYPOTHETICAL_PUBLIC_ONLY_NOT_CERTIFIED'});\n\
        }\nmodule.exports={VERSION,rankJointActions};\nR27302_JOINT_ACTION_RANKER_CJS_EOF\nprintf '%s  %s\\n' '86966ae94a6d480c27bbb7b908663435fce27999d956836e98a4652821d0754b'\
        \ 'research/joint_action_ranker.cjs' | sha256sum -c -\ncat > research/public_joint_bridge.cjs <<'R27302_PUBLIC_JOINT_BRIDGE_CJS_EOF'\n'use strict';\n/** R27.302:\
        \ public own request -> legal move subset -> hypothesis-only ranker.\n * This is an interface/security integration, NOT a real damage/turn oracle.\n * Switch\
        \ actions and mega commands are intentionally excluded until fully validated.\n */\nconst {rankJointActions}=require('./joint_action_ranker.cjs');\nfunction\
        \ fail(code){throw Error('R27302_'+code)}\nfunction availableMoves(req){\n if(!req||typeof req!=='object'||req.wait||req.forceSwitch)fail('UNSUPPORTED_REQUEST');\n\
        \ if(!Array.isArray(req.active)||req.active.length!==1||!Array.isArray(req.active[0]?.moves))fail('ACTIVE_MOVE_REQUEST_REQUIRED');\n const moves=req.active[0].moves;\n\
        \ if(moves.length<1||moves.length>4)fail('MOVE_LENGTH');\n const legal=[];\n for(let i=0;i<moves.length;i++){\n  const m=moves[i];\n  if(!m||typeof m.id!=='string'||!m.id||!Number.isInteger(m.pp)||m.pp<0||typeof\
        \ m.disabled!=='boolean')fail('BAD_PUBLIC_MOVE');\n  if(!m.disabled&&m.pp>0)legal.push('move '+(i+1));\n }\n if(!legal.length)fail('NO_AVAILABLE_MOVE');\n\
        \ return Object.freeze(legal);\n}\nfunction rankPublicMoves({ownRequest,publicFoe,turn=1,opponentActions,worlds,oracle,riskWeight=0,revisitWeight=0}={}){\n\
        \ if(!publicFoe||typeof publicFoe.species!=='string'||!publicFoe.species)fail('NO_REVEALED_FOE');\n if(Object.keys(publicFoe).some(k=>!['species','condition','status','visibleMoves','publicTypes'].includes(k)))fail('PRIVATE_FOE_FIELD');\n\
        \ const ownLegal=availableMoves(ownRequest);\n const observation={v:1,phase:'move',turn,foe:JSON.parse(JSON.stringify(publicFoe))};\n const ranked=rankJointActions({observation,ownLegal,opponentActions,worlds,oracle,riskWeight,revisitWeight});\n\
        \ if(!ownLegal.includes(ranked.best))fail('NONLEGAL_CHOICE');\n return Object.freeze({choice:ranked.best,ranked:ranked.ranked,legal:ownLegal,scope:'RESEARCH_PUBLIC_REQUEST_ONLY_NO_PHYSICS'});\n\
        }\nmodule.exports={availableMoves,rankPublicMoves};\nR27302_PUBLIC_JOINT_BRIDGE_CJS_EOF\nprintf '%s  %s\\n' '99d2f19da73fef8f0223d87bab233b146be342068fa038ecd8f507cadd4ff7ce'\
        \ 'research/public_joint_bridge.cjs' | sha256sum -c -\ncat > research/test_r27302_unit.cjs <<'R27302_TEST_R27302_UNIT_CJS_EOF'\n'use strict';\nconst assert=require('node:assert/strict');\n\
        const {availableMoves,rankPublicMoves}=require('./public_joint_bridge.cjs');\nlet n=0;const check=(name,f)=>{f();n++;console.log('R27302_UNIT '+JSON.stringify({name,status:'PASS'}))};\n\
        const req={active:[{moves:[{id:'thunderbolt',pp:15,disabled:false},{id:'quickattack',pp:30,disabled:false}]}]};\nconst ctx={ownRequest:req,publicFoe:{species:'Golem'},opponentActions:[{id:'attack',p:.7},{id:'switch',p:.3}],worlds:[{id:'unrevealed',p:1}],oracle:({ownAction,opponentAction})=>[{p:1,value:ownAction==='move\
        \ 2'?.55:opponentAction==='attack'?.1:.8,revisit:0}]};\ncheck('public legal moves',()=>assert.deepEqual([...availableMoves(req)],['move 1','move 2']));\n\
        check('ranking from public request',()=>assert.equal(rankPublicMoves(ctx).choice,'move 2'));\ncheck('visible counterplay can change choice',()=>assert.equal(rankPublicMoves({...ctx,opponentActions:[{id:'attack',p:.1},{id:'switch',p:.9}]}).choice,'move\
        \ 1'));\ncheck('disabled move excluded',()=>assert.deepEqual([...availableMoves({active:[{moves:[{id:'thunderbolt',pp:15,disabled:true},{id:'quickattack',pp:30,disabled:false}]}]})],['move\
        \ 2']));\ncheck('zero PP move excluded',()=>assert.deepEqual([...availableMoves({active:[{moves:[{id:'thunderbolt',pp:0,disabled:false},{id:'quickattack',pp:30,disabled:false}]}]})],['move\
        \ 2']));\ncheck('unknown switch not invented',()=>assert(rankPublicMoves(ctx).legal.every(x=>/^move [1-4]$/.test(x))));\ncheck('hidden opponent item fails\
        \ closed',()=>assert.throws(()=>rankPublicMoves({...ctx,publicFoe:{species:'Golem',item:'Choice Band'}}),/PRIVATE_FOE_FIELD/));\ncheck('unsupported forced\
        \ switch fails closed',()=>assert.throws(()=>availableMoves({...req,forceSwitch:true}),/UNSUPPORTED_REQUEST/));\ncheck('no available move fails closed',()=>assert.throws(()=>availableMoves({active:[{moves:[{id:'tackle',pp:0,disabled:false}]}]}),/NO_AVAILABLE_MOVE/));\n\
        check('invalid PP fails closed',()=>assert.throws(()=>availableMoves({active:[{moves:[{id:'tackle',pp:-1,disabled:false}]}]}),/BAD_PUBLIC_MOVE/));\ncheck('invalid\
        \ opponent belief fails closed',()=>assert.throws(()=>rankPublicMoves({...ctx,opponentActions:[{id:'attack',p:.5}]}),/OPP_SUM/));\ncheck('determinism',()=>assert.deepEqual(rankPublicMoves(ctx),rankPublicMoves(ctx)));\n\
        console.log('R27302_UNIT_SUMMARY '+JSON.stringify({passed:n,total:12}));\nR27302_TEST_R27302_UNIT_CJS_EOF\nprintf '%s  %s\\n' '478a69138b1053900bd8fe3ea9a030b5075c23649c1b8b26c6f1cc30908b4503'\
        \ 'research/test_r27302_unit.cjs' | sha256sum -c -\ncat > research/test_r27302_pinned.cjs <<'R27302_TEST_R27302_PINNED_CJS_EOF'\n'use strict';\n/** R27.302:\
        \ inspect ONE authentic pinned Champions format PUBLIC request. */\nconst assert=require('node:assert/strict');\nconst {Battle,Dex}=require('./dist/sim');\n\
        const {rankPublicMoves,availableMoves}=require('./public_joint_bridge.cjs');\nconst fmt=Dex.formats.get('[Gen 9 Champions] BSS Reg M-C');\nassert(fmt.exists&&fmt.mod==='champions','R27302_PINNED_FORMAT_REQUIRED');\n\
        const evs={hp:0,atk:0,def:0,spa:0,spd:0,spe:0};\nconst mk=(species,moves,ability,item='')=>({species,moves,ability,item,nature:'Hardy',level:50,evs});\nconst\
        \ own=[mk('Charizard',['flamethrower','scratch'],'Blaze'),mk('Blastoise',['surf','tackle'],'Torrent'),mk('Venusaur',['vinewhip','tackle'],'Overgrow'),mk('Pikachu',['thunderbolt','quickattack'],'Static'),mk('Snorlax',['tackle'],'Immunity'),mk('Alakazam',['psychic','recover'],'Synchronize')];\n\
