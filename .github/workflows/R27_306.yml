        test('ranker rejects fabricated move action',()=>assert(!legalPublicActions(request).includes('move 9')));\nconsole.log('R27303_UNIT_SUMMARY '+JSON.stringify({passed:n,total:21}));\n\
        R27303_UNIT_EOF\nprintf '%s  %s\\n' '14d6bcc1b3b2db48c1fe0eb49d2f31f5777bc310a71c0756a7b78f2a38fcb21f' 'research/test_r27303_unit.cjs' | sha256sum -c -\n\
        cat > research/test_r27303_pinned.cjs <<'R27303_PINNED_EOF'\n'use strict';\n/** Fixed public Champions-Showdown test. Chooses only via own activeRequest.\
