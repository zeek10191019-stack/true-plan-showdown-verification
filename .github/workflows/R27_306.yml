        \ // Real simulator must accept the selected legal move, without reading private opponent set.\n b.choose('p1',result.choice);b.choose('p2','move 1');\n assert(b.turn>1,'R27302_PINNED_SIM_NOT_ADVANCED');\n\
        \ console.log('R27302_PINNED_SMOKE '+JSON.stringify({status:'PASS',realFormat:fmt.name,publicFoe:species,publicLegal:ownLegal,illustrativeChoice:result.choice,turn:b.turn,scope:'public\
        \ request + hypothetical branch values; not engine-based outcomes or strength proof'}));\n console.log('R27302_GATE '+JSON.stringify({production:'R27.266_UNMODIFIED',native33:'0/33',exact34:'0/34',acceptance:'0/8',FORMAL:'DENY',W_X:'CONSUMED_EXPOSED',championsRealCertified:false}));\n\
        }finally{b.destroy()}\nR27302_TEST_R27302_PINNED_CJS_EOF\nprintf '%s  %s\\n' '33bdc32f70d7e8d3049e84c2d3c4915ddf24398a767d22f3512e0398c96e2820' 'research/test_r27302_pinned.cjs'\
        \ | sha256sum -c -\n(cd research && node test_r27302_unit.cjs)\ncat > research/public_action_bridge.cjs <<'R27303_BRIDGE_EOF'\n'use strict';\n/** Public-own-request\
        \ legal-action enumerator and joint action ranker.\n * Pinned Showdown research adapter; not Champions real-mechanics certification.\n * No direct enemy Battle/Side/Pokemon\
        \ field access. No Tera/Z/Dynamax actions.\n */\nconst {rankJointActions}=require('./joint_action_ranker.cjs');\nfunction reject(code){throw Error('R27303_'+code)}\n\
        function ownRoster(req){\n  const pokemon=req?.side?.pokemon;\n  if(!Array.isArray(pokemon)||pokemon.length<1||pokemon.length>6)reject('OWN_ROSTER_REQUIRED');\n\
        \  pokemon.forEach((p,i)=>{\n    if(!p||typeof p!=='object'||!Number.isInteger(i)||typeof p.condition!=='string'||typeof p.active!=='boolean')reject('OWN_ENTRY_INVALID');\n\
        \  });\n  return pokemon;\n}\nfunction healthy(p){return !p.condition.includes(' fnt')&&!/^\\s*0(?:\\/\\d+)?\\s*$/.test(p.condition)&&!/^\\s*0 fnt/.test(p.condition)}\n\
        function switchChoices(req){\n  const roster=ownRoster(req);\n  return roster.flatMap((p,i)=>(!p.active&&healthy(p))?['switch '+(i+1)]:[]);\n}\nfunction legalPublicActions(req){\n\
        \  if(!req||typeof req!=='object'||req.wait===true||req.teamPreview===true)reject('PHASE_UNSUPPORTED');\n  if(req.forceSwitch){\n    if(!Array.isArray(req.forceSwitch)||req.forceSwitch.length!==1||req.forceSwitch[0]!==true)reject('FORCE_FORMAT_UNSUPPORTED');\n\
        \    const sw=switchChoices(req);if(!sw.length)reject('FORCED_NO_TARGET');return Object.freeze(sw);\n  }\n  if(!Array.isArray(req.active)||req.active.length!==1)reject('SINGLES_MOVE_ONLY');\n\
        \  const act=req.active[0];\n  if(!act||!Array.isArray(act.moves)||act.moves.length<1||act.moves.length>4)reject('MOVE_ARRAY');\n  const legal=[];\n  for(let\
        \ i=0;i<act.moves.length;i++){\n    const m=act.moves[i];\n    if(!m||typeof m.id!=='string'||!m.id)reject('MOVE_ID');\n    if(m.disabled!==undefined&&typeof\
        \ m.disabled!=='boolean')reject('DISABLED_FORMAT');\n    if(m.pp!==undefined&&(!Number.isInteger(m.pp)||m.pp<0))reject('PP_FORMAT');\n    const special=['struggle','recharge'].includes(m.id);\n\
        \    if(m.pp===undefined&&!special)reject('PP_UNKNOWN');\n    if(m.disabled===true||(!special&&m.pp===0))continue;\n    const choice='move '+(i+1);\n    legal.push(choice);\n\
        \    // Mega is a separate voluntary command ONLY when the public active request explicitly permits it.\n    if(act.canMegaEvo===true)legal.push(choice+'\
        \ mega');\n    if(act.canMegaEvoX===true)legal.push(choice+' megax');\n    if(act.canMegaEvoY===true)legal.push(choice+' megay');\n  }\n  if(act.trapped!==true&&act.maybeTrapped!==true)legal.push(...switchChoices(req));\n\
        \  if(!legal.length)reject('NO_ACTION');\n  return Object.freeze(legal);\n}\nfunction publicPreviewChoice(req,indices){\n  if(!req||req.teamPreview!==true)reject('NOT_PREVIEW');\n\
        \  const roster=ownRoster(req);\n  const n=req.maxChosenTeamSize;\n  if(!Number.isInteger(n)||n<1||n>roster.length)reject('PREVIEW_SIZE_REQUIRED');\n  if(!Array.isArray(indices)||indices.length!==n||new\
        \ Set(indices).size!==n||indices.some(i=>!Number.isInteger(i)||i<1||i>roster.length))reject('PREVIEW_INDICES');\n  return 'team '+indices.join('');\n}\nfunction\
        \ rankPublicActions({ownRequest,publicFoe,turn,opponentActions,worlds,oracle,riskWeight=0,revisitWeight=0}={}){\n  const legal=legalPublicActions(ownRequest);\n\
        \  if(!publicFoe||typeof publicFoe.species!=='string'||!publicFoe.species)reject('PUBLIC_FOE_REQUIRED');\n  const req={v:1,phase:ownRequest.forceSwitch?'forceSwitch':'move',turn,foe:JSON.parse(JSON.stringify(publicFoe))};\n\
