jobs:
  build:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            1e63efa4db514cc122f2940a39623d9bc65c554c
      - name: Build and test one-tap IPA
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,lzma,os,pathlib
          s=os.environ['R685_PKG']
          raw=lzma.decompress(base64.b64decode(s),
            format=lzma.FORMAT_ALONE)
          expected=(
            '209a4a248dfac0ffd7ab7e53e714ce3d'
            '3af0681d4a9d689e1dd7c03b564728fd')
          assert hashlib.sha256(raw).hexdigest()==(
           expected)
          names=[
           'tools/R685Build.py',
           'app/ios/ChampionsOnDevice/'
           'R685OneTapCoverageAudit.swift',
           'tests/R685CoverageSmoke.swift']
          lengths=[8986, 5501, 4763]
          assert sum(lengths)==len(raw)
          pos=0
          for name,n in zip(names,lengths):
           p=pathlib.Path(name)
           assert not p.exists(),name
           p.parent.mkdir(parents=True,exist_ok=True)
           p.write_bytes(raw[pos:pos+n])
           pos+=n
          assert pos==len(raw)
          print('R685_PACKED_SOURCES_SHA_PASS')
          PY
          python3 tools/R685Build.py
      - uses: actions/upload-artifact@v4
        with:
          name: R685-reviewed-iLoader-IPA
          path: dist/R685*
          if-no-files-found: error
          retention-days: 7
