jobs:
  b:
    if: >-
      github.repository ==
      'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 83214c26aaa1b0eda8691a7266f64ab421a9de13
    - run: |
        python3 - <<'PY'
        import os,base64,lzma,hashlib,pathlib
        b=lzma.decompress(base64.b85decode(
          ''.join(os.environ['P'].split())),
          format=lzma.FORMAT_ALONE)
        assert hashlib.sha256(b).hexdigest() == (
          'e93ce2bfeda0df075508b6cd2d04153d'+
          '476ae36862cc7bec123a68d79f8172b5')
        names=[
          'app/ios/ChampionsOnDevice/' +
          'R677TurnTimerOCR.swift',
          'tests/R677Smoke.swift',
          'tools/r677_patch.py','/tmp/R677CI.sh']
        sizes=[7424, 3529, 642, 1319]
        i=0
        for n,z in zip(names,sizes):
          p=pathlib.Path(n)
          p.parent.mkdir(parents=True,exist_ok=True)
          assert not p.exists(),n
          p.write_bytes(b[i:i+z]);i+=z
        assert i==len(b)
        PY
        bash /tmp/R677CI.sh
