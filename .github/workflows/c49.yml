name: R1049 C49 pinned full regression and GUI safety (NO IPA)
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/c49.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    name: ${{ matrix.job }}
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
        - job: macos-source
          os: xcode-27
        - job: windows-cli
          os: windows-2025
        - job: windows-receiver
          os: windows-2025
        - job: macos-sender
          os: xcode-27
        - job: windows-hud
          os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
    - name: Prepare SHA-pinned C46 steps and exact C47 tests
      shell: bash
      run: |
        set -Eeuo pipefail
        if [[ "$RUNNER_OS" == Windows ]]; then PY=python; else PY=python3; fi
        "$PY" - <<'C47_LITE_PY'
