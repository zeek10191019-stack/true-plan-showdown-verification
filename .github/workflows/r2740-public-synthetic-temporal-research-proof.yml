      - name: Install pinned public synthetic image dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet numpy==2.3.5 opencv-python-headless==4.13.0.92 pillow==12.3.0
      - name: Run inherited 72 and new 25 PUBLIC tests
        shell: bash
        run: |
          set -euo pipefail
          cd r2740-public
          python -m unittest discover -v -p 'test_r273?_public.py' 2>&1 | tee inherited-tests.log
          python -m unittest discover -v -p 'test_r2740_temporal_guard.py' 2>&1 | tee r2740-tests.log
          python - <<'R2740_RECEIPT'
          import hashlib,json,pathlib
          paths=sorted(pathlib.Path('.').glob('r273*.py'))+sorted(pathlib.Path('.').glob('r274*.py'))+sorted(pathlib.Path('.').glob('test_*.py'))+[pathlib.Path('inherited-tests.log'),pathlib.Path('r2740-tests.log')]
          receipt={'schema':'R2740_PUBLIC_SYNTHETIC_RESEARCH_V1',
            'origin':'PUBLIC_SYNTHETIC_ONLY','r2736_through_r2739_test_count':72,
            'r2740_test_count':25,'total_public_tests':97,'test_result':'PASS',
            'actual_champions_screenshot_pixels':0,'actual_live_broadcast_frames':0,
            'unseen_real_game_holdout':'NOT_MEASURED','real_ocr_accuracy':'NOT_MEASURED',
            'action_suggestions':'WITHHELD','native33':'0/33','exact34':'0/34',
            'real_battles':'0/30','formal':'DENY',
            'sha256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}}
          pathlib.Path('public-receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2))
          print('R2740_PUBLIC_RECEIPT_PASS')
          R2740_RECEIPT
      - name: Upload synthetic test proof (no private pixels)
        uses: actions/upload-artifact@v4
        with:
          name: r2740-public-synthetic-temporal-proof
          path: |
            r2740-public/public-receipt.json
            r2740-public/inherited-tests.log
            r2740-public/r2740-tests.log
          if-no-files-found: error
          retention-days: 7
