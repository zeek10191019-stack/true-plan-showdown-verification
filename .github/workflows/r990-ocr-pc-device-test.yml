        import hashlib, json
        from pathlib import Path
        root = Path("pinned-r793/source")
        manifest = root / "source_manifest.json"
        files = {p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob("*") if p.is_file() and p != manifest}
        data = (json.dumps(files, sort_keys=True, indent=2) + '\n').encode()
        assert hashlib.sha256(data).hexdigest() == 'a8a6ad98f54a2b98a5079657639b70016558ca763803e24d5d1cbd74a82e70d4'
        manifest.write_bytes(data)
        for name in ("R716SpatialFieldProjection", "R947RetainedDisplayEvidence", "R987BattleReadout", "R920PCPaintReceipts"):
            assert files[f"app/ios/ChampionsOnDevice/{name}.swift"] == files[f"R720_PORTABLE_TESTS/Sources/R719Core/{name}.swift"]
        print("R990_SOURCE_VERIFIED", len(files))
        MANIFEST
    - name: Replay storage contention, save resume, archive identity, split retry and queue ordering
      shell: bash
      run: |
        set -euo pipefail
        src=pinned-r793/source
        native="$src/app/ios/ChampionsOnDevice"
        swiftc -parse-as-library "$native/R975FinalMovieSample.swift" "$native/R710EvidenceState.swift" "$native/R733UserControlledCapturePolicy.swift" "$native/R734RecordingFinishPolicy.swift" "$src/tools/tests/r975_movie_sample_check.swift" -o "$RUNNER_TEMP/r975-movie-test"
        "$RUNNER_TEMP/r975-movie-test" | tee "$RUNNER_TEMP/r983-movie-test.log"
        grep -F R978_STOP_CALLBACK_AND_RESUME_CHECK_PASS "$RUNNER_TEMP/r983-movie-test.log"
        archive_files=(R714ChunkedEvidence R730SplitReadback R936ExportJob R689StreamingZIP R548ResearchArchive R551EvidenceIntegrity R555StoredZIPReadback R729EvidenceTransportPolicy R731ArchiveCapacity)
        node "$src/tools/tests/test_r920_pc_display.mjs" "$RUNNER_TEMP/r979-display.swift" | tee "$RUNNER_TEMP/pc-baseline.log"
        grep -F R979_PC_VISIBILITY_AND_PAINT_BUGS_REPRODUCED "$RUNNER_TEMP/pc-baseline.log"
        node "$src/tools/tests/test_r920_pc_display.mjs" | tee "$RUNNER_TEMP/pc-corrected.log"
        grep -F 'R920 browser script measurement regressions passed (18 cases)' "$RUNNER_TEMP/pc-corrected.log"
        swift_sources=()
        for name in "${archive_files[@]}"; do swift_sources+=("$native/$name.swift"); done
        swiftc -O -parse-as-library "${swift_sources[@]}" "$src/tools/tests/r979_archive_check.swift" -o "$RUNNER_TEMP/archive-corrected"
        "$RUNNER_TEMP/archive-corrected" corrected | tee "$RUNNER_TEMP/archive-corrected.log"
        grep -F R979_ARCHIVE_REGRESSION_PASS_3 "$RUNNER_TEMP/archive-corrected.log"
        for mode in baseline corrected; do
          resume_sources=()
          for name in "${archive_files[@]}"; do
            if [ "$mode" = baseline ] && [ "$name" = R714ChunkedEvidence ]; then
              resume_sources+=("$RUNNER_TEMP/r980-chunked.swift")
            else
              resume_sources+=("$native/$name.swift")
            fi
          done
          swiftc -O -parse-as-library "${resume_sources[@]}" "$src/tools/tests/r981_split_resume_check.swift" -o "$RUNNER_TEMP/split-$mode"
          "$RUNNER_TEMP/split-$mode" "$mode" | tee "$RUNNER_TEMP/split-$mode.log"
        done
        grep -F R980_SPLIT_RETRY_FAILURES_REPRODUCED_2 "$RUNNER_TEMP/split-baseline.log"
        grep -F R981_SPLIT_RESUME_REGRESSIONS_PASSED_3 "$RUNNER_TEMP/split-corrected.log"
        python3 - "$RUNNER_TEMP/r981-ocr-queue.swift" "$native/R852JournalQueue.swift" "$RUNNER_TEMP" <<'INSTRUMENT'
        import sys
        from pathlib import Path
        out = Path(sys.argv[3])
        for mode, source in zip(("baseline", "corrected"), sys.argv[1:3]):
            code = Path(source).read_text()
            dispatch = "        queue.async { [self] in"
            drain = "func drain() {"
            assert code.count(dispatch) == code.count(drain) == 1
            code = code.replace(dispatch, "        R982QueueProbe.beforeDispatch()\n" + dispatch)
            code = code.replace(drain, drain + " R982QueueProbe.drainEntered.signal();")
            (out / f"queue-{mode}.swift").write_text(code)
        INSTRUMENT
        for mode in baseline corrected; do
          swiftc -parse-as-library "$RUNNER_TEMP/queue-$mode.swift" "$src/tools/tests/r982_capture_queue_check.swift" -o "$RUNNER_TEMP/queue-$mode"
          "$RUNNER_TEMP/queue-$mode" "$mode" | tee "$RUNNER_TEMP/queue-$mode.log"
        done
        grep -F R981_JOURNAL_DRAIN_OVERTAKE_REPRODUCED "$RUNNER_TEMP/queue-baseline.log"
        grep -F R982_JOURNAL_DRAIN_ORDER_VERIFIED "$RUNNER_TEMP/queue-corrected.log"
        for mode in baseline corrected; do
          archive_sources=()
          for name in "${archive_files[@]}"; do
            original="$RUNNER_TEMP/r982-archive-source/$name.swift"
            if [ "$mode" = baseline ] && [ -f "$original" ]; then
              archive_sources+=("$original")
            else
              archive_sources+=("$native/$name.swift")
            fi
          done
          swiftc -O -parse-as-library "${archive_sources[@]}" "$src/tools/tests/r983_archive_snapshot_check.swift" -o "$RUNNER_TEMP/archive-snapshot-$mode"
          "$RUNNER_TEMP/archive-snapshot-$mode" "$mode" | tee "$RUNNER_TEMP/archive-snapshot-$mode.log"
        done
        grep -F R982_REPLACED_ARCHIVE_ACCEPTANCE_REPRODUCED_6 "$RUNNER_TEMP/archive-snapshot-baseline.log"
        grep -F R983_ARCHIVE_FILE_IDENTITY_REGRESSION_PASS_6 "$RUNNER_TEMP/archive-snapshot-corrected.log"
        python3 "$src/tools/tests/r986_storage_resume_check.py" "$RUNNER_TEMP/r984-CaptureCoordinator.swift" "$native/CaptureCoordinator.swift" | tee "$RUNNER_TEMP/r986-storage-resume.log"
        grep -F R984_STORAGE_RESUME_DEFECTS_REPRODUCED_4 "$RUNNER_TEMP/r986-storage-resume.log"
        grep -F R986_STORAGE_RESUME_REGRESSION_PASS_6 "$RUNNER_TEMP/r986-storage-resume.log"
        python3 "$src/tools/tests/r984_save_resume_check.py" \
          "$RUNNER_TEMP/r983-CaptureCoordinator.swift" "$native/CaptureCoordinator.swift" | tee "$RUNNER_TEMP/r984-save-resume.log"
        grep -F R983_SAVE_RESUME_DEFECTS_REPRODUCED_7 "$RUNNER_TEMP/r984-save-resume.log"
        grep -F R984_SAVE_RESUME_REGRESSION_PASS_12 "$RUNNER_TEMP/r984-save-resume.log"
        grep -F "R990 browser-clock render receipt survives reordering and retry" "$RUNNER_TEMP/pc-corrected.log"
    - name: Run integrated export, browser, Swift and PC regressions
      shell: bash
      run: |
        set -euo pipefail
        ruby -ryaml -e '
          steps = YAML.load_file(ARGV.fetch(0), aliases: true).fetch("jobs").fetch(ARGV.fetch(1)).fetch("steps")
          puts steps.find { |step| step["name"] == ARGV.fetch(2) }.fetch("run")
        ' "$RUNNER_TEMP/r974-device-test.yml" verify 'Run Swift, Python and browser regressions' > "$RUNNER_TEMP/r975-verify.sh"
        cp pinned-r793/source/tools/tests/r984_completion_resume_check.py "$RUNNER_TEMP/test-save-resume.py"
        bash "$RUNNER_TEMP/r975-verify.sh"
        grep -F "testR975RetainsLiteralClockAndHUDWithoutPromotingTheActiveState]' passed" "$RUNNER_TEMP/r966-swift.log"
        grep -F "testR954ReplaysRetainedAnimationAndTurnHeaderReceipts]' passed" "$RUNNER_TEMP/r966-swift.log"
        grep -F "testRetainedOpponentMegaLogNeedsBothLinesAndKeepsCurrentFormUnknown]' passed" "$RUNNER_TEMP/r966-swift.log"
        echo R990_MEGA_ANIMATION_AND_HISTORY_REGRESSIONS_PASS
    - name: Build and verify iPhoneOS arm64
      shell: bash
      run: |
        set -euo pipefail
        src="$GITHUB_WORKSPACE/pinned-r793/source"
        project="$src/app/ios/ChampionsOnDeviceResearch.xcodeproj"
        xcodebuild -project "$project" -scheme ChampionsOnDeviceResearch -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO -derivedDataPath "$RUNNER_TEMP/r990-build" build > "$RUNNER_TEMP/r990-native.log" 2>&1 || { grep -E -B2 -A2 'error:|BUILD FAILED' "$RUNNER_TEMP/r990-native.log"; exit 1; }
        grep -F 'BUILD SUCCEEDED' "$RUNNER_TEMP/r990-native.log"
        app="$RUNNER_TEMP/r990-build/Build/Products/Release-iphoneos/ChampionsOnDeviceResearch.app"
        test "$(lipo -archs "$app/ChampionsOnDeviceResearch")" = arm64
        test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Info.plist")" = 990
        test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist")" = 0.9.90
    - name: Validate the IPA and stage the draft release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        work="$RUNNER_TEMP/r990-package"
        mkdir -p "$work/Payload" "$work/draft-readback"
        app="$RUNNER_TEMP/r990-build/Build/Products/Release-iphoneos/ChampionsOnDeviceResearch.app"
        ditto "$app" "$work/Payload/ChampionsOnDeviceResearch.app"
        cd "$work"
        zip -qry R990_Unsigned_DeviceTest.ipa Payload
        python3 - <<'PY'
        import hashlib, json, os, plistlib, struct, zipfile
        from pathlib import Path

        bundle = Path("Payload/ChampionsOnDeviceResearch.app")
        ipa = Path("R990_Unsigned_DeviceTest.ipa")
        files = {p.as_posix():p for p in bundle.rglob("*") if p.is_file()}
        with zipfile.ZipFile(ipa) as archive:
            assert archive.testzip() is None
            entries = [item.filename for item in archive.infolist() if not item.is_dir()]
            assert len(set(entries)) == len(entries) and set(entries) == set(files)
            assert all(archive.read(name) == files[name].read_bytes() for name in entries)
            info = plistlib.loads(archive.read((bundle / "Info.plist").as_posix()))
        assert (info["CFBundleIdentifier"], info["CFBundleVersion"], info["CFBundleShortVersionString"],
                info["MinimumOSVersion"], info["DTPlatformName"]) == (
                "com.zeek10191019.championsresearch", "990", "0.9.90", "27.0", "iphoneos")
        assert info["NSLocalNetworkUsageDescription"] and "screen-capture" in info["UIBackgroundModes"]
        for binary in [bundle / info["CFBundleExecutable"], *bundle.glob("*.dylib")]:
            data = binary.read_bytes()
            magic, cpu, _, kind, commands, command_bytes, *_ = struct.unpack_from("<8I", data)
            assert magic == 0xfeedfacf and cpu == 0x0100000c and kind in (2, 6)
            offset, platforms = 32, []
            for _ in range(commands):
                command, size = struct.unpack_from("<2I", data, offset)
                assert size >= 8 and offset + size <= len(data) and command != 29
                if command == 50:
                    platforms.append(struct.unpack_from("<I", data, offset + 8)[0])
                offset += size
            assert offset == 32 + command_bytes and platforms == [2]
        report = {
            "build": 990, "version": "0.9.90", "signed": False, "min_ios": "27.0",
            "ipa": {"name": ipa.name, "bytes": ipa.stat().st_size,
                    "sha256": hashlib.sha256(ipa.read_bytes()).hexdigest()},
            "source_workflow_commit": os.environ["GITHUB_SHA"],
            "source_manifest_sha256": "a8a6ad98f54a2b98a5079657639b70016558ca763803e24d5d1cbd74a82e70d4",
            "passed_regression_run": int(os.environ["GITHUB_RUN_ID"]),
            "packaging_workflow_commit": os.environ["GITHUB_SHA"],
            "packaging_run": int(os.environ["GITHUB_RUN_ID"]),
            "r990_physical_end_to_end_status": "UNVERIFIED",
        }
        Path("VERIFICATION_R990.json").write_text(json.dumps(report, indent=2) + "\n")
        print("R990_IPA_VERIFIED", json.dumps(report))
        PY
        assets=(R990_Unsigned_DeviceTest.ipa VERIFICATION_R990.json)
        if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish > existing.json 2>/dev/null; then
          jq -e --arg commit "$GITHUB_SHA" '.isDraft and .targetCommitish == $commit' existing.json
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
        else
          gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease \
            --title 'R990 iPhone実機試験 0.9.90' \
            --notes '未署名のiPhoneOS 27.0以降・arm64用実機試験IPA。R986実機ログで見つかった盤面・PC表示の修正と技使用の登録漏れとPC描画計測の修正を収録。導入前に現在の方法で署名してください。'
        fi
        for asset in "${assets[@]}"; do
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir draft-readback
          cmp "$asset" "draft-readback/$asset"
        done
    permissions:
      contents: write
