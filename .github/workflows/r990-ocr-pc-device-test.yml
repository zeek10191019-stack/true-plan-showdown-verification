name: R990 OCR and PC device verification
'on':
  push:
    branches:
    - r987-ocr-pc-regression
    paths:
    - .github/workflows/r990-ocr-pc-device-test.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    name: Swift, browser, PC and iPhoneOS regression
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && !github.event.repository.private && github.ref == 'refs/heads/r987-ocr-pc-regression'
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RELEASE_TAG: r990-unsigned-device-test
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: .github/workflows/r990-ocr-pc-device-test.yml
    - name: Restore fixed R989 and apply R990
      shell: bash
      run: |
        set -euo pipefail
        git show c41caa7799210a6609d34aa3f4d67aa944ff9f22:.github/workflows/r989-ocr-pc-device-test.yml > "$RUNNER_TEMP/r989-baseline.yml"
        echo 'c8a6f17732c32ac31a4c834f444895e1ba4259c6bfe0c3aa0e340ff7c699d643  r989-baseline.yml' | (cd "$RUNNER_TEMP" && shasum -a 256 -c -)
        ruby -ryaml -e '
          steps = YAML.load_file(ARGV.fetch(0), aliases: true).fetch("jobs").fetch("verify").fetch("steps")
          puts steps.find { |step| step["name"] == "Restore fixed R988 and apply R989" }.fetch("run")
        ' "$RUNNER_TEMP/r989-baseline.yml" > "$RUNNER_TEMP/r989-restore.sh"
        bash "$RUNNER_TEMP/r989-restore.sh"
        python3 - "$RUNNER_TEMP/r990.patch" <<'PAYLOAD'
