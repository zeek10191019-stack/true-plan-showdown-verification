# R716 source-bound display candidate build; public repository only.
# A push changing r716.yml starts this workflow automatically, no other push triggers it.
name: R716 Spatial OCR Candidate Bridge
'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/r716.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r716-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
    - name: Initialize frozen R716 source packet
      shell: bash
      run: |
        set -euo pipefail
        : > "$RUNNER_TEMP/r716-payload.b85"
