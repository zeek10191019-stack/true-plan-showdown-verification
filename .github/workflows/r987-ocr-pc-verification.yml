# Verify fixed R987 source on the public standard runners
name: R987 device OCR, PC, and storage verification
'on':
  push:
    branches:
    - r987-ocr-pc-regression
    paths:
    - .github/workflows/r987-ocr-pc-verification.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    name: Swift, browser, PC and iPhoneOS regression
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && !github.event.repository.private && github.ref == 'refs/heads/r987-ocr-pc-regression'
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: .github/workflows/r987-ocr-pc-verification.yml
    - name: Restore fixed R986 and apply the R987 patch
      shell: bash
      run: |
        set -euo pipefail
        git show cb3c55b692f761d10440e50ea776ff3cddb6aae4:.github/workflows/r986-storage-resume-verification.yml > "$RUNNER_TEMP/r986-baseline.yml"
        echo 'cdd4525b7e44ee1dc3992f7dc713de0ba91b7054978cb60fa60f7499f3b2986e  r986-baseline.yml' | (cd "$RUNNER_TEMP" && shasum -a 256 -c -)
        ruby -ryaml -e '
          steps = YAML.load_file(ARGV.fetch(0), aliases: true).fetch("jobs").fetch("verify").fetch("steps")
          puts steps.find { |step| step["name"] == "Restore verified R984 and apply the R986 corrections" }.fetch("run")
        ' "$RUNNER_TEMP/r986-baseline.yml" > "$RUNNER_TEMP/r986-restore.sh"
        bash "$RUNNER_TEMP/r986-restore.sh"
