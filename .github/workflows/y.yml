jobs:
  b:
    if: >-
      github.repository ==
      'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        ref: b5afab6751b3a5d05a6fda380ad8dc5d1c37d046
    - run: |
        python3 - <<'PY2'
        import os,lzma,base64,hashlib,pathlib
        b=lzma.decompress(base64.b64decode(
          ''.join(os.environ['P'].split())),
          format=lzma.FORMAT_ALONE)
        assert hashlib.sha256(b).hexdigest() == (
          'eacde16c5329cf6a63edca11ed2e634a' +
          '4fa46ebf3e0f0bb3b70433b12b0ff6f8')
        names=['app/ios/ChampionsOnDevice/' +
          'R671StatusGlyphMatcher.swift',
          'tests/R671GlyphSmoke.swift',
          'tools/r671_patch.py','/tmp/R671CI.sh']
        sizes=[7266, 2663, 1746, 1003]
        i=0
        for n,z in zip(names,sizes):
          p=pathlib.Path(n)
          p.parent.mkdir(parents=True,exist_ok=True)
          assert not p.exists(), n
          p.write_bytes(b[i:i+z]);i+=z
        assert i==len(b)
        PY2
        bash /tmp/R671CI.sh
