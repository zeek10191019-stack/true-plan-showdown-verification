name: R588 Offline OCR Evidence Verification
"on":
  push:
    paths: [.github/workflows/ac.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      PYTHONOPTIMIZE: "0"
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
    steps:
      - name: Restore pinned source, run Swift checks and iPhoneOS build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,hashlib,re,textwrap,ast,lzma,base64,json
          from pathlib import Path
          S=lambda b:hashlib.sha256(b).hexdigest()
          u='https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/d6ec56446026d0e9abe98355f8b356af7527928d/.github/workflows/r587.yml'
          w=urllib.request.urlopen(u,timeout=90).read()
          assert len(w)==15015 and S(w)=='2740b803c9c28040846bdcd774b47a3760cc5ae676c4ffdc544426bf3d8b26a0','R587_PIN_ERROR'
          m=re.search(r"python3 - <<'R587_REPLAY'\n(.*?)\n\s+R587_REPLAY",w.decode(),re.S)
          assert m,'R587_SCRIPT_MISSING'
          exec(compile(textwrap.dedent(m.group(1)),'PINNED_R587','exec'))
          changes=json.loads(lzma.decompress(base64.b64decode('')))
          assert len(changes)==3
          pending=[]
          for x in changes:
           p=Path(x['path']); o=p.read_bytes() if p.exists() else b''
           assert (S(o) if o else None)==x['old_sha'],('WRONG_PARENT',str(p))
           i=x['prefix']; n=x['remove'];assert 0<=i<=i+n<=len(o)
           b=o[:i]+base64.b64decode(x['insert'])+o[i+n:]
           assert S(b)==x['new_sha'] and len(b)==x['new_len'],('PATCH_CORRUPT',str(p))
           pending.append((p,b))
          for p,b in pending:
           p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)
          assert len(list(Path('app/ios/ChampionsOnDevice').glob('*.swift')))==130
          assert 'historical_ocr_rotation_consensus.json' in Path('app/ios/ChampionsOnDevice/CaptureCoordinator.swift').read_text()
          print('R588_PINNED_SOURCE_AND_PATCH_SHA_PASS')
          PY
          swiftc -frontend -parse app/ios/ChampionsOnDevice/*.swift
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R581ReadabilityCoverage.swift app/ios/ChampionsOnDevice/R583FrameReadabilityIndex.swift app/ios/ChampionsOnDevice/R585SpatialOCRProjection.swift app/ios/ChampionsOnDevice/R586HUDSpatialCandidates.swift app/ios/ChampionsOnDevice/R587HUDFrameAssociation.swift app/ios/ChampionsOnDevice/R588OrientationEvidence.swift tests/R588OrientationEvidenceHarness.swift -o "$RUNNER_TEMP/r588-check"
          "$RUNNER_TEMP/r588-check"
          python3 tools/run_r571_native.py || { for f in reports/xcode_iphoneos_build.log reports/r574_png_replay_compile.log; do [ ! -f "$f" ] || grep -nE 'error:|fatal error|BUILD FAILED' "$f" | tail -n 50 || true; done; exit 1; }
