      - name: Native original-resolution tile geometry and actual PNG Apple Vision
        if: matrix.lane == 'real-apple-vision'
        shell: bash
        run: |
          set -euo pipefail
          export R794_DIAGNOSTIC_DIR="$GITHUB_WORKSPACE/R794Proof"
          cd source/R720_PORTABLE_TESTS
          swift test --filter R794SourceTileDiagnosticsTests > "$GITHUB_WORKSPACE/R794Proof/TileSwift.log" 2>&1 || {
            tail -120 "$GITHUB_WORKSPACE/R794Proof/TileSwift.log"
            exit 1
          }
          cd ../..
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('R794Proof')
          for n in ('R794TileMoveVision.json','R794TileSelectionVision.json'):
              q=json.loads((p/n).read_text())
              assert q['tile_count']==2
              assert q['source_width']==2796 and q['source_height']==1290
              assert q['source_png_unchanged'] and not q['real_device_capture_certified']
              assert q['device_certified_fields']==0
              assert not q['auto_production_tile_ocr_enabled']
              assert len(q['rows'])==len(q['alternatives'])
              assert all(t['pixel_count']<=2_000_000 for t in q['tile_metrics'])
              assert all(t['language_correction']==False for t in q['tile_metrics'])
          m=json.loads((p/'R794TileMoveVision.json').read_text())
          s=json.loads((p/'R794TileSelectionVision.json').read_text())
          comparison={'baseline_revision':'R793','diagnostic_revision':'R794',
              'baseline_full_raster_projected_move_exact':1,
              'baseline_full_raster_selection_exact':4,
              'tile_projected_move_exact':m['projected_move_names_exact'],
              'tile_projected_pp_candidate_count':m['projected_pp_candidate_count'],
              'tile_selection_exact':len(s['selection_names_exact']),
              'no_dictionary_autocorrection':True,
              'device_certified_fields':0,'certification_gate_passed':False,
              'note':'Controlled fixture comparison; production fallback not enabled.'}
          (p/'R794_COMPARISON.json').write_text(json.dumps(comparison,indent=2))
          print(json.dumps(comparison,indent=2))
          PY

      - name: Full Mac Swift existing regression - preserve failures
        if: always() && matrix.lane == 'real-apple-vision'
        shell: bash
        run: |
          set -uo pipefail
          export R794_DIAGNOSTIC_DIR="$GITHUB_WORKSPACE/R794Proof"
          export R792_AUTOMATIC_OCR_DIR="$GITHUB_WORKSPACE/R794Proof"
          export R761_FIELD_AUDIT_OUTPUT="$GITHUB_WORKSPACE/R794Proof/FieldSafety.json"
          export R761_APPLE_VISION_OUTPUT="$GITHUB_WORKSPACE/R794Proof/RealAppleVision.json"
          cd source/R720_PORTABLE_TESTS
          swift test > "$GITHUB_WORKSPACE/R794Proof/Swift.log" 2>&1
          result=$?
          printf '%s\n' "$result" > "$GITHUB_WORKSPACE/R794Proof/FullSwift.exit"
          echo "Full suite exit=$result (R792 baselines NOT relaxed)"
          exit 0

      - name: Python static regression and source preservation (iPhoneOS lane)
        if: matrix.lane == 'iphoneos-compile'
        shell: bash
        run: |
          set -euo pipefail
          for script in r761_preflight r742_live_path_audit \
            r743_macos_compat_audit r745_read_path_gate \
            r748_capture_path_gate r780_project_source_parity; do
            python3 "source/tools/$script.py" > "R794Proof/$script.log"
          done
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install ffmpeg
          fi
          python3 -m unittest discover -s source/tools/tests -p 'test_*.py' \
            > R794Proof/Python.log 2>&1 || {
            tail -120 R794Proof/Python.log
            exit 1
          }
          python3 - <<'PY'
          from pathlib import Path
          p=Path('R794Proof/Python.log').read_text()
          assert 'Ran 65 tests' in p, 'LEGACY_TEST_COUNT_CHANGED'
          assert p.rstrip().endswith('OK'),'PYTHON_REGRESSION_NOT_OK'
          assert 'skipped=' not in p,'NO_SKIPS_ALLOWED'
          src=Path('source')
          a=src/'app/ios/ChampionsOnDevice/R792AutomaticVisionInput.swift'
          b=src/'R720_PORTABLE_TESTS/Sources/R719Core/R792AutomaticVisionInput.swift'
          assert a.read_bytes()==b.read_bytes()
          for text in ('sourceTileRects','sourceTileImages','rects.count<=4'):
            assert text in a.read_text()
          print('65 Python tests no skip + mirrored R794 tiles')
          PY

      - name: iPhoneOS real xcodebuild (NO IPA)
        if: matrix.lane == 'iphoneos-compile'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess,sys
          root=Path('source')
          sha=lambda b:hashlib.sha256(b).hexdigest()
          def verified():
              files={str(p.relative_to(root)):p for p in root.rglob('*') if p.is_file()
                  and '__pycache__' not in p.parts}
              manifest=json.loads((root/'source_manifest.json').read_text())
              assert set(files)==set(manifest)|{'source_manifest.json'}
              assert all(sha(files[n].read_bytes())==h for n,h in manifest.items())
              return sha(''.join(n+'\t'+sha(files[n].read_bytes())+'\n'
                  for n in sorted(files)).encode())
          assert verified()=='19f75d0296ef6166966833f8ae087b4c80502b37f243cb4842ed2997975379b0'
          subprocess.run([sys.executable,'source/tools/generate_xcode_project.py'],check=True)
          assert verified()=='19f75d0296ef6166966833f8ae087b4c80502b37f243cb4842ed2997975379b0','PROJECT_GENERATOR_SOURCE_DRIFT'
          PY
          xcodebuild -project source/app/ios/ChampionsOnDeviceResearch.xcodeproj \
            -scheme ChampionsOnDeviceResearch -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath "$RUNNER_TEMP/r794" build \
            > R794Proof/iPhoneOS.log 2>&1 || {
              grep -E 'error:|BUILD FAILED' R794Proof/iPhoneOS.log || true
              exit 1
            }
          grep -F 'BUILD SUCCEEDED' R794Proof/iPhoneOS.log

      - name: Preserve measured diagnostic status (no device certification)
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,json
          p=Path('R794Proof');p.mkdir(exist_ok=True)
          lane='${{ matrix.lane }}'
          data={'revision':'R794','lane':lane,'ipa_created':False,
              'device_certified_fields':0,'device_180s_certified':False,
              'full_mac_ocr_gate_certified':False,
              'source_integrity_checked':(p/'SOURCE_INTEGRITY.json').is_file(),
              'tile_diagnostic_saved':all((p/n).is_file() for n in
                 ('R794TileMoveVision.json','R794TileSelectionVision.json')),
              'full_swift_exit':(p/'FullSwift.exit').read_text().strip()
                   if (p/'FullSwift.exit').exists() else None,
              'source_changes_awaiting_apple_validation':True}
          (p/'GATE.json').write_text(json.dumps(data,indent=2))
          print(json.dumps(data,indent=2))
          PY

      - name: Upload delta-only evidence even on failure (NO IPA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R794-${{ matrix.lane }}-NO-IPA
          path: R794Proof/
          retention-days: 3
          if-no-files-found: error

      - name: Final strict gate - do not downgrade R792 or R793 assertions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f R794Proof/SOURCE_INTEGRITY.json
          if [ '${{ matrix.lane }}' = 'real-apple-vision' ]; then
            test -f R794Proof/R794TileMoveVision.json
            test -f R794Proof/R794TileSelectionVision.json
            test -f R794Proof/FullSwift.exit
            test "$(cat R794Proof/FullSwift.exit)" = 0
          else
            grep -F 'BUILD SUCCEEDED' R794Proof/iPhoneOS.log
            grep -F 'Ran 65 tests' R794Proof/Python.log
            grep -E '^OK$' R794Proof/Python.log
          fi
