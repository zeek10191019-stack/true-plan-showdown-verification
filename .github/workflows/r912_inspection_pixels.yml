      - name: Verify the R912 candidate source and record the Vision environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat R834Proof/SOURCE_TREE_SHA256.txt)" = 2a27622533ed88366af38547e8227c21d6b0e5dd8a9c7051cc36538acb2ff0a7
          test -x "$DEVELOPER_DIR/Toolchains/XcodeDefault.xctoolchain/usr/bin/swift"
          sw_vers
          xcodebuild -version
          swift --version
      - name: Run pinned real-image tests from individual macOS XCTest processes
        shell: bash
        run: |
          set -euo pipefail
          src=pinned-r793/source/R720_PORTABLE_TESTS
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib,json
          root=Path('pinned-r793/source')
          manifest=json.loads((root/'source_manifest.json').read_text())
          package=root/'R720_PORTABLE_TESTS'
          names=('R761RealImageRegressionTests.swift','R883InspectionPanelTests.swift')
          for name in names:
              path=package/'Tests/R719CoreTests'/name
              assert hashlib.sha256(path.read_bytes()).hexdigest()==manifest[path.relative_to(root).as_posix()]
          # Scope this CI checkout's target to two pinned test files.
          # The Swift production target, published source and fixtures stay exact.
          plan=package/'Package.swift'
          original=plan.read_text()
          needle='.testTarget(name: "R719CoreTests", dependencies: ["R719Core"])'
          assert original.count(needle)==1
          plan.write_text(original.replace(needle,
              '.testTarget(name: "R719CoreTests", dependencies: ["R719Core"], sources: '+json.dumps(names)+')'))
          PYCODE
          for case_name in testRetainedBuild715InspectionAndNonSelectedTransition testScaledAndRotatedInspectionKeepAllSelectedNumbersBoundToSource testActualAppleVisionKnockOffOwnItemHistoryNeedsMatchingOwnCard; do
            swift test -c release --jobs 3 --package-path "$src" --scratch-path "$RUNNER_TEMP/r907-focused-build" --filter "$case_name" 2>&1 | tee "R834Proof/$case_name.log"
            python3 - "$case_name" <<'PYCODE'
          import re,sys
          from pathlib import Path
          case=sys.argv[1]
          log=(Path('R834Proof')/(case+'.log')).read_text()
          rows=[line for line in log.splitlines() if line.startswith('Test Case ') and ' passed ' in line]
          assert len(rows)==1 and ' '+case+']' in rows[0],rows
          assert re.search(r'Executed 1 test, with 0 failures',log),log[-3500:]
          assert 'R907_INSPECTION_VISION_HELD' not in log
          if case=='testRetainedBuild715InspectionAndNonSelectedTransition':
              assert 'R911_PIXEL_NUMERIC_RETURNED elapsed_ms=' in log
              assert log.count('R911_PIXEL_NUMERIC_ACCEPTED ')==9
          if case=='testScaledAndRotatedInspectionKeepAllSelectedNumbersBoundToSource':
              assert 'R912_RETAINED_RESIZED_AND_PORTRAIT_NUMBERS_PASS' in log
          print('R912_D183_EXACT_FOCUSED_VISION_PASS',case)
          PYCODE
          done
