name: R560 Shared Engine iOS27 Simulator and macOS26 ARM (No IPA)
"on":
  push:
    branches: [main]
    paths: [.github/workflows/d560s.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
