      - name: "Verify diagnostic inputs before writing"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'RESTORE_DIAGNOSTIC'
          import base64,hashlib,json,lzma
          from pathlib import Path
          folder=Path('.r560s_payload')
          names=[f'part_{i:04d}' for i in range(3)]
          assert sorted(p.name for p in folder.iterdir())==names,'DIAGNOSTIC_PART_SET'
          compressed=base64.b64decode(b''.join((folder/name).read_bytes() for name in names),validate=True)
          decoder=lzma.LZMADecompressor()
          data=decoder.decompress(compressed,max_length=2000001)
          assert len(data)==60513 and decoder.eof and not decoder.unused_data,'DIAGNOSTIC_PAYLOAD_SIZE'
          assert hashlib.sha256(data).hexdigest()=='ed1f02badb266bed633fe5643d21184b36ddc80868220b7007d243c7912244d7','DIAGNOSTIC_PAYLOAD_SHA'
          inputs=json.loads(data)
          assert sorted(inputs)==['R560PlatformHarness.swift', 'fixed_hp.png', 'run_platform_probe.py', 'run_runtime_diagnostic.py', 'runtime_reference_source.py', 'verify_platform_probe.py'],'DIAGNOSTIC_FILE_SET'
          values={}
          for name,item in inputs.items():
              value=base64.b64decode(item['data'],validate=True)
              assert len(value)<200000 and hashlib.sha256(value).hexdigest()==item['sha256'],'DIAGNOSTIC_FILE_SHA'
              values[name]=value
          destination=Path('diagnostics');destination.mkdir(exist_ok=False)
          for name,value in values.items():
              with (destination/name).open('xb') as stream:stream.write(value)
          reports=destination/'reports';reports.mkdir()
          metadata={'scope':'SHARED_ENGINE_PLATFORM_CHECK_ONLY','native_CI_certified':False,
           'files':{name:{'sha256':inputs[name]['sha256'],'bytes':len(value)} for name,value in values.items()}}
          (reports/'R560S_INPUTS.json').write_text(json.dumps(metadata,indent=2)+'\n')
          print('FIXED_PUBLIC_DIAGNOSTIC_INPUTS_VERIFIED; NOT_APP_CERTIFICATION')
          RESTORE_DIAGNOSTIC
      - name: "Verify frozen shared engine and four literals on the target platform"
        shell: bash
        run: |
          python3 diagnostics/run_platform_probe.py
      - name: "Return evidence even after a diagnostic failure; no artifacts/cache"
        if: always()
        shell: bash
        run: |
          python3 - <<'DIAGNOSTIC_REPORT'
          from pathlib import Path
          import base64,hashlib,io,zipfile
          folder=Path('diagnostics/reports');buffer=io.BytesIO()
          with zipfile.ZipFile(buffer,'w',compression=zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(folder.glob('*')):
                  if path.suffix in ('.json','.log') and path.stat().st_size<2000000:
                      archive.write(path,path.name)
          data=buffer.getvalue();text=base64.b85encode(data).decode()
          print('R560D_REPORT_B85_BEGIN',hashlib.sha256(data).hexdigest(),len(data))
          for i in range(0,len(text),500):print('R560D_REPORT_B85',text[i:i+500])
          print('R560D_REPORT_B85_END')
          print('DIAGNOSTIC_EVIDENCE_RETURNED; THIS_IS_NOT_A_R560_APP_CI_PASS')
          DIAGNOSTIC_REPORT
