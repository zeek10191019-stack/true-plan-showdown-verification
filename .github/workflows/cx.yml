          'research/mega_m_c_81_registry.json',
          os.environ['RUNNER_TEMP']+'/r649-run.sh']
        sizes=[7529, 3199, 1245, 15345, 2512]
        pos=0
        for name,n in zip(names,sizes):
          data=raw[pos:pos+n];pos+=n
          path=Path(name)
          assert len(data)==n and not path.exists(),name
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_bytes(data)
        assert pos==len(raw)
