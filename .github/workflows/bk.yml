name: R624.1 Batch - Repair R621 Writer Fixture and Native Regression (No IPA)
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/bk.yml
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: trueplan-r6241-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
      && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 55
    env:
      PYTHONOPTIMIZE: '0'
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
    steps:
    - name: Restore exact R624 source and fix only regression fixture indentation
      shell: bash
      run: |-
        set -euo pipefail
        python3 - <<'R6241_REPLAY'
        import base64,hashlib,lzma,textwrap,urllib.request
        from pathlib import Path
        url=(
            'https://raw.githubusercontent.com/'
            'zeek10191019-stack/true-plan-showdown-verification/'
            'b09ca4d1cbf9b2059c23bebc141facd63424af2a/'
            '.github/workflows/bj.yml'
        )
        raw=urllib.request.urlopen(url,timeout=90).read()
        assert len(raw)==16530,'R624_PARENT_SIZE_DRIFT'
        assert hashlib.sha256(raw).hexdigest()==(
            'bc508c44b216464f7eba383dae8c107af289785d20f1f4330aac63352d97c347'
        ),'R624_PARENT_SHA_DRIFT'
        s=raw.decode('utf-8')
        start="          python3 - <<'R621_REPLAY'\n"
        end="\n          R621_REPLAY"
        assert s.count(start)==1 and s.count(end)==1,'PARENT_REPLAY_ANCHOR_NOT_UNIQUE'
        nested=textwrap.dedent(s.split(start,1)[1].split(end,1)[0])
        exec(compile(nested,'R624_PINNED_SOURCE_REPLAY','exec'),{'__name__':'__main__'})
        assert len(list(Path('app/ios/ChampionsOnDevice').glob('*.swift')))==155
        file=Path('tests/test_r621batch_patch.py')
        old=file.read_bytes()
        assert len(old)==2347,'R624_ORIGINAL_TEST_SIZE_DRIFT'
        assert hashlib.sha256(old).hexdigest()==(
            'd103e5481ef1d7ad6c91766d35f34b9d8ff30fd5c8b01fcd47e62154f91d97f7'
        )
        encoded=''.join([
            '{Wp48S^xk9=GL@E0stWa8~^|S5YJf5;0tU7q+I|sn@VT6Qap3~=Xh;r%NdN8%fSR=u{mC*)y?99Tf6Rg@ZXV^',
            'wRjZQgL<e~NJYiD*`POOuoce)Z0=g4IqCyCdDxT#b_g~YHhq{`Rv4aupEMCEeLSI^8rKnuRng0LhQHr4aMpbJ',
            'O8fTiThsP#MC>af;YVJ*fa9EPf-ynLXyX-+*AfU)zHZoOq1%*7dY$M9z&i?rX{(Y%3hnpYw*0R-@spGqu%@_`',
            '{<}y%B>TsJoz}S^{L5bCOCx`wMN~gIYEN(LsE+uc6^M*Ihu|2%Kt*e1^Q;sRro#{7S|$&q@}r;5!R#`}z8-*g',
            '$9R}ei6CdFDW88HuA=$g@Uo0ilo4df6nfbuEefgC*Mfvfkh22~Ous6HCR451Z!NSWq`zW~EUOF@OPf_b&a6&~',
            'Cbbs+vyLSDIo~ug7Eq7F48Hx6M4GP%HnKSYO_gd*IR{E7zhjL{eJMbIP!@T4Qp5ZLEC(@$>8;6!?^J4}5P?r_',
            'xKy+Zn-(lAb-`)QY9Yj{?b9sJ8h*F_%-NDdE{j*5i#h*Pz13K@dryUVQ&N1|i-4W|nXLibgQ=ZgBG;I}=`$>|',
            'Gxkf;UN(zrl8g~PAwQPFK7rHV>fA-74Rms$R4SEe{&VF0RTHaxzqb^&s0?XZPzHF_jhdZhotXC;Ac9CMq}08C',
            '8Mi}n0BwKdQ8RzD`kYeris8!cG@AHKxgMUpI<4)4CQy_}8b9A;>MQ>iJV>4sfTPMguT#|hogNcsD9~j+FTscp',
            '0rHDy%h?PStN<Kh%fsf3TGz$P(S{|o)h=1=9T??lFb&bAX$*ZUT>cd2bAU?V1$P`QuI{6m<FS0Xb<@zkM=+=N',
            'tBt%FXD&aY{A$tQ-)N(Al&n)g1WM6*-174|v3=6BYD;(Hq#C_%q#2`R8~C^o>PlmBzSSQUT~J(uoT%z@(D7(i',
            'kMh$ETWEF&VU_rM^^5dD@_*EMtwuUVEY*lNPWvx7PCuAUR|NQ-em-*Mz-W?lj|jl0Tu8U%GA}^CMwNl9o(jR5',
            'WLTokR7wuk4GPs8V*hFpF}n8~;yCPSs4F2AmWB(`leTA&iJ&jh-8d<0FF)X>RX8TiX|KTeMGf6bRx7{LHxVKe',
            'B}19v{e}uT!0{|k7e)-k2UBTD_|)-g8rF$y=Q>>JVU9GU+dX3+)(pSY`og^;{lSY?#d56W`=>Rn^ZK5-H&Im8',
            'GOj2%!VYS3%IQq~*Qb?8ma;L6M?3=2pMk{%T%D+GEH)@pTgk-xk{rEW1k+G-ColKFc-VCU%>&fb#82N`VgIy)',
            'tANlZx6Ln-X(0IIpIeZt1pU5&y{D7llt9$3uK`lW0|BwmutOO7_Lm_35GjxC?n--`Mp4>9C9f8KNV5iVQf-6b',
            's)<!hX`ps2rfOia%K_{j)fxLB6LiU!euKLh4wuHs`L{OIT?HOiFpTWq_&}xBv32Sa{3dHOU0vk<Ue&CR;X#n3',
            'm|)PpOc`$%4lyk$*1yI@W7uPVnBV}_s_mTTD))-CRN5oL=C3QCzUR53u0(IkTgMP{q+FynPoHz#K^p)7c+{~M',
            'R+QLc00F=W?G^w4KkgIbvBYQl0ssI200dcD',
        ])
        new=lzma.decompress(base64.b85decode(encoded))
        assert len(new)==2925 and hashlib.sha256(new).hexdigest()==(
            'a654e5d56ec8dd84d73b20ad4cb70e1a3a443171e2ebba24598db0fa1d7fe7ee'
        )
        # Only the fixture's writer reversal block is allowed to change.
        start=b'   if path==TARGET:\n'
        end=b'   elif path==MODULE:'
        assert old.count(start)==new.count(start)==1
        assert old.count(end)==new.count(end)==1
        assert old.split(start,1)[0]==new.split(start,1)[0]
        assert old.split(end,1)[1]==new.split(end,1)[1]
        assert b'R621_WRITER_BLOCK_NOT_UNIQUE' in new
        assert b'data.count(NEW_WRITER)==1' not in new
        file.write_bytes(new)
        assert file.read_bytes()==new
        print('R6241_PINNED_R624_SOURCE_REPLAY_TEST_FIX_ONLY_PASS')
        R6241_REPLAY
    - name: Run all Python and Swift regression suites
      shell: bash
      run: |
        set -euo pipefail
        export PYTHONPATH=.
        # Regression suite: includes negative tests, tamper rejection, and patched writer fixture.
        for v in r605 r607 r608 r609 r610 r611batch r613batch r617batch r621batch; do
          python3 -m unittest discover -s tests -p "test_${v}_*.py" -v
        done
        swiftc -parse-as-library \
          app/ios/ChampionsOnDevice/R610CrossEvidenceCandidate.swift \
          app/ios/ChampionsOnDevice/R611TemporalHUDReview.swift \
          app/ios/ChampionsOnDevice/R612ArchiveEvidenceClosure.swift \
          app/ios/ChampionsOnDevice/R613R616IntegratedReadiness.swift \
          tests/R613BatchHarness.swift -o "$RUNNER_TEMP/r616"
        "$RUNNER_TEMP/r616"
        swiftc -parse-as-library \
          app/ios/ChampionsOnDevice/R617R620RotationReadout.swift \
          tests/R617Harness.swift -o "$RUNNER_TEMP/r620"
        "$RUNNER_TEMP/r620"
        swiftc -parse-as-library \
          app/ios/ChampionsOnDevice/R617R620RotationReadout.swift \
          app/ios/ChampionsOnDevice/R621R624VisualCandidates.swift \
          tests/R621Harness.swift -o "$RUNNER_TEMP/r624"
        "$RUNNER_TEMP/r624"
        echo 'R6241_FULL_REGRESSION_PASS_NOT_GAME_CERTIFIED'
    - name: Parse Swift and build native iPhoneOS
      shell: bash
      run: |
        set -euo pipefail
        swiftc -frontend -parse app/ios/ChampionsOnDevice/*.swift
        python3 tools/run_r571_native.py || {
          for f in reports/xcode_iphoneos_build.log reports/r574_png_replay_compile.log; do
            test ! -f "$f" || grep -nE 'error:|BUILD FAILED' "$f" | tail -n 65 || true
          done
          exit 1
        }
        echo 'R6241_NATIVE_BUILD_PASS_NOT_79_FIELD_OR_MEGA_CERTIFIED'
