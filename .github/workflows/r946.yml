      - name: Read real selected status screenshots with Apple Vision
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_26.3.app/Contents/Developer ]]; then
            export DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
          fi
          xcodebuild -version
          cd pinned-r793/source
          source_package="$PWD/R720_PORTABLE_TESTS"
          focused="$RUNNER_TEMP/r946-vision/R720_PORTABLE_TESTS"
          mkdir -p "$focused/Tests/R719CoreTests" "$RUNNER_TEMP/r946-vision/tests"
          cp "$source_package/Package.swift" "$focused/"
          cp -R "$source_package/Sources" "$focused/"
          cp -R tests/fixtures "$RUNNER_TEMP/r946-vision/tests/"
          for name in R893BattleStatusPanelTests R761RealImageRegressionTests; do
            cp "$source_package/Tests/R719CoreTests/$name.swift" "$focused/Tests/R719CoreTests/"
          done
          swift test -c release --jobs 4 --package-path "$focused" --filter 'testPhoneStatusFromActualSelectedScreenshotRegions' 2>&1 | tee "$RUNNER_TEMP/r946-vision.log"
          grep -F "testPhoneStatusFromActualSelectedScreenshotRegions]' passed" "$RUNNER_TEMP/r946-vision.log"
