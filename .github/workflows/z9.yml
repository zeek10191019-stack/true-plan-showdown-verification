jobs:
  build:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            1e63efa4db514cc122f2940a39623d9bc65c554c
      - name: Verify R704 and build IPA
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os,re,base64,lzma,hashlib
          import pathlib,urllib.request,ast
          url=('https://raw.githubusercontent.com/'
            'zeek10191019-stack/'
            'true-plan-showdown-verification/'
            'main/.github/workflows/z6.yml')
          req=urllib.request.Request(url,headers={
            'User-Agent':'R703-Pinned-Builder'})
          with urllib.request.urlopen(
            req,timeout=40) as res:
            old=res.read(25000)
          assert len(old)==11456
          assert hashlib.sha256(old).hexdigest()==(
            '9ede9a4542371d599cc3fab0cdf870d3'
            '6231cd4ac7799a302982ffd01f347d62')
          m=re.search(rb'(?m)^  R702_PKG: >-\n'
            rb'((?:    [^\n]*\n)+)',old)
          assert m,'R702_PINNED_PACKAGE_MISSING'
          os.environ['R702_PKG']=b''.join(
            m[1].split()).decode('ascii')
          raw=lzma.decompress(base64.b64decode(
            os.environ['R703_PKG']),
            format=lzma.FORMAT_ALONE)
          assert hashlib.sha256(raw).hexdigest()==(
            'fc47a5ef3d67030062ebb2cbee74e919'
            '15b92951ee81189f859f646e7e736066')
          names=['R703OneTapFieldReadiness.swift',
            'R703Patch.py','R703MakeBuild.py',
            'R703Smoke.swift']
          sizes=[9559, 1291, 2407, 7073]
          assert sum(sizes)==len(raw)
          pos=0
          for name,size in zip(names,sizes):
            folder='tests' if name.endswith(
              'Smoke.swift') else 'tools'
            p=pathlib.Path(folder)/name
            p.parent.mkdir(parents=True,
              exist_ok=True)
            p.write_bytes(raw[pos:pos+size])
            pos+=size
          # Repair Python-rewriter escape depth.
          path=pathlib.Path('tools/R703MakeBuild.py')
          script=path.read_text()
          digest=hashlib.sha256
          h=digest(script.encode()).hexdigest()
          assert h==(
            '60b35e8c51e1be43e80e43a3196a1dfb'
            '51cba67ca11c99419936f2469c4dc872')
          slash=chr(92)
          bad='rep(marker,marker+r"'+slash*2+'n'
          good='rep(marker,marker+r"'+slash*4+'n'
          assert script.count(bad)==1
          fixed=script.replace(bad,good,1)
          ast.parse(fixed)
          h=digest(fixed.encode()).hexdigest()
          assert h==(
            'a02429a75d4a5d2c3e0acdfc4d9bf01d'
            'ec73ceb47306f08f2a9b0565c4dce7e2')
          r704=lzma.decompress(base64.b64decode(
            os.environ['R704_PKG']),
            format=lzma.FORMAT_ALONE)
          assert hashlib.sha256(r704).hexdigest()==(
            'c0a73fcbe7176a7f7a1104ddb180df1a'
            '78dbedf7a6c89e4e0af231aa304925d6')
          names=['R704ExplicitDurationOCR.swift',
            'R704Patch.py','R704Smoke.swift']
          sizes=[7716, 1389, 4340]
          assert sum(sizes)==len(r704)
          pos=0
          for name,size in zip(names,sizes):
            folder='tests' if name.endswith(
              'Smoke.swift') else 'tools'
            f=pathlib.Path(folder)/name
            f.parent.mkdir(parents=True,
              exist_ok=True)
            f.write_bytes(r704[pos:pos+size])
            pos+=size
          target=next(line for line in
            fixed.splitlines() if line.startswith(
            'rep(marker,marker+r'))
          assert "R703Patch.py" in target
          addition=chr(92)*4+(
            "n    run('python3',"
            "'tools/R704Patch.py')")
          fixed=fixed.replace(target,
            target[:-2]+addition+'")',1)
          changes=[
            ("'692','703'","'692','704'"),
            ("'0.6.92','0.7.3'",
             "'0.6.92','0.7.4'"),
            ('R703_Unsigned_OneTap.ipa',
             'R704_Unsigned_OneTap.ipa'),
            ("'R692.0','R703.0'",
             "'R692.0','R704.0'"),
            ('R703_UNSIGNED_IPA_PACKAGE_PASS',
             'R704_UNSIGNED_IPA_PACKAGE_PASS'),
            ('R703_IPA_SHA256=',
             'R704_IPA_SHA256='),
            ('R703_READINESS_CI_PASS',
             'R704_DURATION_CI_PASS'),
            ('R703_LOCAL_ONLY','R704_LOCAL_ONLY')
          ]
          for a,b in changes:
            assert fixed.count(a)==1,(a,'DRIFT')
            fixed=fixed.replace(a,b,1)
          needle=("subprocess.run(["
            "'/tmp/r703_smoke_bin'],check=True)''')")
          assert fixed.count(needle)==1
          extra=(
            "subprocess.run(["
            "'/tmp/r703_smoke_bin'],check=True)\n"
            "with subprocess.Popen([\n"
            "    'swiftc','-O',\n"
            "    'tools/"
            "R704ExplicitDurationOCR.swift',\n"
            "    'tests/R704Smoke.swift',\n"
            "    '-o','/tmp/r704_smoke_bin'\n"
            "]) as proc:\n"
            "    assert proc.wait()==0,"
            "'R704_SWIFT_COMPILE_FAILED'\n"
            "subprocess.run(["
            "'/tmp/r704_smoke_bin'],check=True)''')"
          )
          fixed=fixed.replace(needle,extra,1)
          ast.parse(fixed)
          assert hashlib.sha256(
            fixed.encode()).hexdigest()==(
            '97bcd353342a5cff9defaffc1834fc18'
            'f9090da491d93b2f1b759957966dd546')
          print(
            'R704_SOURCE_AND_PATCH_PASS',flush=True)
          path.write_text(fixed)
          print('R7031_ESCAPE_PASS',flush=True)
          print('R703_SOURCE_SHA_PASS',flush=True)
          text=old.decode('utf-8')
          marker="          python3 - <<'PYCODE'\n"
          start=text.index(marker)+len(marker)
          end=text.index('\n          PYCODE',start)
          block=text[start:end]
          body='\n'.join(line[10:] for line in
            block.splitlines())
          needle=("['python3','tools/"+
            "R702MakeBuild.py']")
          assert body.count(needle)==1
          body=body.replace(needle,
            "['python3','tools/R703MakeBuild.py']")
          ast.parse(body)
          exec(compile(body,'r702','exec'),{})
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: R704-unsigned-iLoader-IPA
          path: dist/R704*
          if-no-files-found: error
          retention-days: 7
