name: R748 Live OCR Integrity Gate - NO IPA
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/e10.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
