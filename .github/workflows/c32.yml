name: R1032 C32 non-brain integrated regression (NO IPA)
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/c32.yml
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: c32-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos-source:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
    - name: Fetch exact C29 workflow by immutable commit and SHA-256
      shell: bash
      run: |
        set -Eeuo pipefail
        [[ "$GITHUB_REPOSITORY" == 'zeek10191019-stack/true-plan-showdown-verification' ]]
        [[ '${{ github.event.repository.private }}' == 'false' ]]
        for command in git python3 ruby swiftc; do command -v "$command"; done
        repo="$RUNNER_TEMP/c6-objects"; mkdir -p "$repo"
        git -C "$repo" init -q
        git -C "$repo" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
        git -C "$repo" fetch --no-tags --filter=blob:none --depth=1 origin "a64ec7549a54bab80e329eda705467afe556f94a"
        [[ "$(git -C "$repo" rev-parse FETCH_HEAD)" == "a64ec7549a54bab80e329eda705467afe556f94a" ]]
        git -C "$repo" show "a64ec7549a54bab80e329eda705467afe556f94a:.github/workflows/r1009-c11-runtime-wiring-audit.yml" > "$RUNNER_TEMP/c6-self.yml"
        python3 - "$RUNNER_TEMP/c6-self.yml" <<'PY'
        from pathlib import Path
        import sys
        raw=Path(sys.argv[1]).read_bytes()
        assert len(raw)<490000, 'GITHUB_500KB_WORKFLOW_LIMIT'
        import hashlib
        assert hashlib.sha256(raw).hexdigest()=='48cc1b55c56bb2a17943cad8e0ce49482704f9db098fda49e7bd992848fccf27'
        print('C6_YAML_SIZE_OK',len(raw))
        PY
    - name: Verify SHA-pinned embedded full C4 source and prior failure evidence
      shell: bash
      env:
        BUNDLE_SHA: ab2ed826d3f4f0e1eda8fcb8d8b614571f2c4ed0a95606bb91e911b95dad5ef8
        BUNDLE_FILES_SHA: 4a53e194f540f156de21b863fc2bfc7e92744087b6e88fab482e59caf2769585
      run: |
        set -Eeuo pipefail
        python3 - "$RUNNER_TEMP/c6-self.yml" "$RUNNER_TEMP/c6-pack" "$BUNDLE_SHA" "$BUNDLE_FILES_SHA" <<'PY'
        import base64,hashlib,io,json,os,re,sys,tarfile
        from pathlib import Path,PurePosixPath
        workflow=Path(sys.argv[1]);dest=Path(sys.argv[2]);archive_sha=sys.argv[3].lower();fingerprint=sys.argv[4].lower()
        lines=workflow.read_text(encoding='utf-8').splitlines()
        begin='# R1008_C6_TAR_XZ_BEGIN';end='# R1008_C6_TAR_XZ_END'
        if lines.count(begin)!=1 or lines.count(end)!=1:raise SystemExit('PAYLOAD_MARKER_COUNT')
        a=lines.index(begin);b=lines.index(end)
        if not(0<a<b and b-a<7000):raise SystemExit('PAYLOAD_BOUNDS')
        chunks=[s[2:].strip() for s in lines[a+1:b]]
        if any(not s.startswith('# ') for s in lines[a+1:b]):raise SystemExit('NON_COMMENT_PAYLOAD')
        base64_str=''.join(chunks)
        if not (10000<len(base64_str)<500000 and re.fullmatch(r'[A-Za-z0-9+/=]+',base64_str)):
            raise SystemExit('BASE64_INVALID')
        raw=base64.b64decode(base64_str,validate=True)
        if hashlib.sha256(raw).hexdigest()!=archive_sha:raise SystemExit('TAR_XZ_SHA_MISMATCH')
        if not (100000<len(raw)<350000):raise SystemExit('TAR_XZ_SIZE')
        if dest.exists() and any(dest.iterdir()):raise SystemExit('REFUSE_EXISTING_DEST')
        dest.mkdir(parents=True,exist_ok=True)
        found={};total=0
        with tarfile.open(fileobj=io.BytesIO(raw),mode='r:xz') as tar:
            entries=tar.getmembers()
            if len(entries)!=138:raise SystemExit('FILE_COUNT_MISMATCH')
            for member in entries:
                p=PurePosixPath(member.name)
                if (not member.isfile() or p.is_absolute() or '\\' in member.name or '..' in p.parts
                    or member.name in found or len(member.name)>240 or member.size>5_000_000):
                    raise SystemExit('UNSAFE_TAR_ENTRY:'+member.name[:120])
                total+=member.size
                if total>5_000_000:raise SystemExit('UNCOMPRESSED_TOO_LARGE')
                data=tar.extractfile(member).read()
                if len(data)!=member.size:raise SystemExit('TRUNCATED_ENTRY')
                found[member.name]=hashlib.sha256(data).hexdigest()
            real_fingerprint=hashlib.sha256(json.dumps(found,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
            if real_fingerprint!=fingerprint:raise SystemExit('CONTENT_MANIFEST_SHA_MISMATCH')
            for member in entries:
                target=dest.joinpath(*PurePosixPath(member.name).parts)
                target.parent.mkdir(parents=True,exist_ok=True)
                with target.open('xb') as fd:fd.write(tar.extractfile(member).read())
        print('C6_C4_SOURCE_SHA256_BUNDLE_PASS',len(found),'files; no symlinks/no traversal')
        PY
        cd "$RUNNER_TEMP/c6-pack"
        python3 VERIFY_C4_PACK.py
        python3 R1008_C4_REPRODUCE_PREVIOUS_FAILURE.py
        echo C6_ARCHIVE_AND_PREVIOUS_FAILURE_REGRESSION_PASS
    - name: Run Lenovo + iPhone adapters, OCR, backpressure, DOM, persistence
      shell: bash
      run: |
        set -Eeuo pipefail
        cd "$RUNNER_TEMP/c6-pack"
        bash RUN_ALL_LOCAL_TESTS.sh
        echo C6_OFFLINE_REGRESSION_PASS
    - name: Fetch historical commits without checkout and restore pinned R999
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        repo="$RUNNER_TEMP/c6-objects"
        git -C "$repo" fetch --unshallow --no-tags --filter=blob:none origin \
          '+refs/heads/main:refs/remotes/origin/main' \
          '+refs/heads/ai024-pc-pairing:refs/remotes/origin/ai024-pc-pairing'
        git -C "$repo" cat-file -e '32f1b2014d6be23e169e50e5de52466ed1212ab3^{commit}'
        export GITHUB_WORKSPACE="$repo"
        bash "$RUNNER_TEMP/c6-pack/R1008_C4_RESTORE_R999_ON_MACOS.sh" "$RUNNER_TEMP/c6-pack"
        test -s "$RUNNER_TEMP/r1008-c4-source-discovery.json"
        echo C6_R999_PINNED_SOURCE_RESTORED_NOT_PRODUCT_RELEASE
    - name: Syntax-parse product Swift and deny premature IPA
      shell: bash
      run: |
        set -Eeuo pipefail
        root="$RUNNER_TEMP/c6-objects/pinned-r793/source"
        swiftc -frontend -parse \
          "$root/app/ios/ChampionsOnDevice/CaptureCoordinator.swift" \
          "$root/app/ios/ChampionsOnDevice/R920QuickPCDisplay.swift" \
          "$root/app/ios/ChampionsOnDevice/R1001BattleSafetyCore.swift" \
          "$root/app/ios/ChampionsOnDevice/R1000CapturePCBridge.swift" \
          "$root/app/ios/ChampionsOnDevice/R1006CaptureHubStatus.swift" \
          "$root/app/ios/ChampionsOnDevice/R1007CaptureIntegrationAdapter.swift"
        python3 - "$RUNNER_TEMP/r1008-c4-source-discovery.json" <<'PY'
        import json,sys
        report=json.load(open(sys.argv[1]))
        assert report['r999_restored_source']
        assert not any(report[k] for k in ('production_capture_hooks_wired','xcode_target_registered','native_iphoneos_build_passed','ipa_approved'))
        print('C6_NOT_WIRED_XCODE_BUILD_NOT_RUN_HOLD_IPA')
        print('C6_COORDINATOR_FUNCTIONS',report['capture_coordinator_function_names'])
        PY
    - name: Map R999 product integration seam without modifying source or brain
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 - "$RUNNER_TEMP/c6-objects/pinned-r793/source" <<'PY'
        import re,sys,json,hashlib
        from pathlib import Path
        root=Path(sys.argv[1]); ios=root/'app/ios/ChampionsOnDevice'
        coordinator=ios/'CaptureCoordinator.swift'
        text=coordinator.read_text(encoding='utf-8')
        lines=text.splitlines()
        expected='25db5578aa2d9ce76bba2890ce9385f8d1c5aee27adbb8bdf2d465d03cbe5d9a'
        assert hashlib.sha256(coordinator.read_bytes()).hexdigest()==expected
        print('C7_R999_COORDINATOR_EXACT_SHA_PASS',len(lines),'lines')
        names=('processR759PreparedPNG','processR761LegacyPNG','r837PublishQuick',
               'r920TogglePCDisplay','stream','stop','r936Begin','r936Pause')
        indexed={}
        for name in names:
            hits=[i for i,line in enumerate(lines) if re.search(r'\bfunc\s+'+re.escape(name)+r'\s*\(',line)]
            indexed[name]=[n+1 for n in hits]
            print('C7_SEAM',name,'line',indexed[name])
            for i in hits[:1]:
                for n in range(i,min(i+7,len(lines))):
                    print('C7_SOURCE',n+1,lines[n][:220])
        assert indexed['processR759PreparedPNG'] and indexed['r920TogglePCDisplay']
        proj=root/'app/ios/ChampionsOnDeviceResearch.xcodeproj/project.pbxproj'
        pt=proj.read_text(encoding='utf-8')
        print('C7_XCODE_MEMBERSHIP',json.dumps({
            'project_sha256':hashlib.sha256(proj.read_bytes()).hexdigest(),
            'adapter_file_in_project':'R1007CaptureIntegrationAdapter.swift' in pt,
            'capture_bridge_file_in_project':'R1000CapturePCBridge.swift' in pt,
            'sync_root_group':'PBXFileSystemSynchronizedRootGroup' in pt
        },ensure_ascii=False))
        print('C7_PRODUCT_UNWIRED_NATIVE_BUILD_UNCERTIFIED_HOLD_IPA')
        PY
    - name: C8 inspect exact RAW preservation and OCR completion seams (READ ONLY)
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 - "$RUNNER_TEMP/c6-objects/pinned-r793/source" <<'PY'
        import hashlib,re,sys,json
        from pathlib import Path
        root=Path(sys.argv[1]);path=root/'app/ios/ChampionsOnDevice/CaptureCoordinator.swift'
        text=path.read_text();lines=text.splitlines()
        assert hashlib.sha256(path.read_bytes()).hexdigest()=='25db5578aa2d9ce76bba2890ce9385f8d1c5aee27adbb8bdf2d465d03cbe5d9a'
        slices=[('raw_save',1565,1660),('quick_publication',765,838),
                ('legacy_ocr',2660,2715),('stream_start',1465,1530),('stop',4630,4685)]
        for title,start,end in slices:
            print('C8_SEAM_BEGIN',title,start,end)
            for i in range(start-1,min(end,len(lines))):
                print('C8_SOURCE',i+1,lines[i][:250])
            print('C8_SEAM_END',title)
        for token in ('r760RecorderToken','preserved','R852CapturePNGEncoder','writeReceipt','r837PublishQuick'):
            hits=[i+1 for i,line in enumerate(lines) if token in line]
            print('C8_USAGE',token,json.dumps(hits[:40]),'total',len(hits))
        print('C8_FULL_CAPTURE_HOOKS_UNWIRED_HOLD_IPA')
        PY
    - name: C10 register four Swift files from inline and markerless PBX objects (no runtime hooks)
      shell: bash
      run: |
        set -Eeuo pipefail
        root="$RUNNER_TEMP/c6-objects/pinned-r793/source"
        test -s "$root/source_manifest.json"
        python3 - "$root" <<'READONLY'
        import re,hashlib,sys
        from pathlib import Path
        root=Path(sys.argv[1]);p=root/'app/ios/ChampionsOnDeviceResearch.xcodeproj/project.pbxproj'
        s=p.read_text();print('C10_REAL_PROJECT_SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
        print('C10_PBX_SECTION_MARKERS',len(re.findall(r'Begin PBXBuildFile section',s)))
        print('C10_PBX_OBJECT_ISA_COUNTS',{k:len(re.findall(r'isa\s*=\s*'+k+r'\s*;',s)) for k in ('PBXGroup','PBXNativeTarget','PBXSourcesBuildPhase','PBXBuildFile','PBXFileReference')})
        print('C10_PBX_TARGET_NAME_CANDIDATES',[x for x in re.findall(r'(?m)^\s*name\s*=\s*([^;]+);',s) if 'Champion' in x][:10])
        READONLY
        cat > "$RUNNER_TEMP/c10-register.py" <<'C10_PY'
        #!/usr/bin/env python3
        """C10: Fail-closed, newline-and-marker-independent PBX/OpenStep object registration.

        R999's actual project omitted the 'Begin PBXBuildFile section' marker, so
        C8's section-dependent registrar correctly stopped. C9 searches the *objects*
        dictionary by balanced braces instead. It never mutates CaptureCoordinator or
        battle AI. R999 base and overlay are SHA pinned before any changes.
        """
        import argparse
        import hashlib
        import json
        import os
        import re
        import tempfile
        import subprocess
        from pathlib import Path

        PINNED_PBX_SHA256 = '57ed49d85bb123cf8b728c588cc6a9a4d861c3f74cadb5a7108086f674170d44'
        PINNED_COORDINATOR_SHA256 = '25db5578aa2d9ce76bba2890ce9385f8d1c5aee27adbb8bdf2d465d03cbe5d9a'
        ADDON_HASHES = {
            'R1001BattleSafetyCore.swift':'17b89494a8983458773d37b911d4ed6a06aa071e6147d5b3f4034f54a45fddc6',
            'R1000CapturePCBridge.swift':'f3ed0d94af38ab9508f434f223a8081c441a7b237329a77531ce31fbd73bbb5c',
            'R1006CaptureHubStatus.swift':'95529fe0390b7fc65ad2bf1ba61b98aa44744d70457144721f14e3bbeed198a6',
            'R1007CaptureIntegrationAdapter.swift':'f25beb6fb10b2ae16b32e79cc3a8b558a6afcb9ea42bd80d6df27fab361bd18f',
        }
        TARGET = 'ChampionsOnDeviceResearch'


        def sha(data):return hashlib.sha256(data).hexdigest()

        def rid(kind,name):return sha(('trueplan:R1008-C10:'+kind+':'+name).encode())[:24].upper()


        def close_at(text, opening, left='{', right='}'):
            """Scan an OpenStep dictionary/list, ignoring quoted literals and comments."""
            if text[opening] != left:raise ValueError('INVALID_OPENING')
            depth=1;quote=False;escaped=False;block_comment=False;line_comment=False
            i=opening+1
            while i<len(text):
                c=text[i];n=text[i+1] if i+1<len(text) else ''
                if block_comment:
                    if c=='*' and n=='/':block_comment=False;i+=2;continue
                    i+=1;continue
                if line_comment:
                    if c in '\r\n':line_comment=False
                    i+=1;continue
                if quote:
                    if escaped:escaped=False
                    elif c=='\\':escaped=True
                    elif c=='"':quote=False
                    i+=1;continue
                if c=='/' and n=='*':block_comment=True;i+=2;continue
                if c=='/' and n=='/':line_comment=True;i+=2;continue
                if c=='"':quote=True;i+=1;continue
                if c==left:depth+=1
                elif c==right:
                    depth-=1
                    if depth==0:return i
                    if depth<0:raise ValueError('UNBALANCED')
                i+=1
            raise ValueError('UNCLOSED_'+left)


        def lexical_mask(text):
            result=list(text)
            i=0
            n=len(text)
            while i<n:
                a=text[i];b=text[i+1] if i+1<n else ''
                if a=='"':
                    j=i+1;escaped=False
                    while j<n:
                        c=text[j]
                        if escaped:escaped=False
                        elif c=='\\':escaped=True
                        elif c=='"':j+=1;break
                        j+=1
                    else:raise ValueError('UNTERMINATED_QUOTE')
                    for k in range(i,j):
                        if text[k] not in '\r\n':result[k]=' '
                    i=j;continue
                if a=='/' and b=='*':
                    end=text.find('*/',i+2)
                    if end<0:raise ValueError('UNTERMINATED_COMMENT')
                    j=end+2
                    for k in range(i,j):
                        if text[k] not in '\r\n':result[k]=' '
                    i=j;continue
                if a=='/' and b=='/':
                    end=text.find('\n',i+2)
                    j=end if end>=0 else n
                    for k in range(i,j):
                        if text[k] not in '\r\n':result[k]=' '
                    i=j;continue
                i+=1
            return ''.join(result)

        HDR=re.compile(r'\b([A-F0-9]{24})\s*=\s*\{')

        def read_objects(text):
            mask=lexical_mask(text)
            header=text.index('\n')+1
            top=re.search(r'\{',mask[header:])
            if top is None:raise ValueError('PROJECT_ROOT_MISSING')
            top_at=header+top.start()
            top_end=close_at(text,top_at)
            if text[top_end+1:].strip():raise ValueError('PROJECT_TRAILING_CONTENT')
            markers=[m for m in re.finditer(r'\bobjects\s*=\s*\{',mask)
                     if top_at<m.start()<top_end]
            if len(markers)!=1:raise ValueError('OBJECTS_ROOT_NOT_UNIQUE')
            opening=markers[0].end()-1
            closing=close_at(text,opening)
            if closing>top_end:raise ValueError('OBJECTS_OUTSIDE_ROOT')
            pos=opening+1
            collected={}
            while True:
                found=HDR.search(mask,pos,closing)
                if found is None:break
                obj_id=found.group(1)
                if obj_id in collected:raise ValueError('DUPLICATE_OBJECT:'+obj_id)
                start=found.end()-1;end=close_at(text,start)
                if end>=closing:raise ValueError('OBJECT_OUTSIDE_ROOT')
                collected[obj_id]={'id':obj_id,'body':text[start+1:end],
                                   'start':found.start(),'end':end,
                                   'opening':start,'closing':end}
                pos=end+1
            if len(collected)<3:raise ValueError('TOO_FEW_XCODE_OBJECTS')
            return collected,closing


        def prop_value(body,key):
            hit=list(re.finditer(r'(?m)(?:^|\n)[ \t]*'+re.escape(key)+r'[ \t]*=[ \t]*("(?:[^"\\]|\\.)*"|[^;\r\n]*?)[ \t]*;',body))
            if not hit:
                hit=list(re.finditer(r'\b'+re.escape(key)+r'[ \t]*=[ \t]*("(?:[^"\\]|\\.)*"|[^;\r\n]*?)[ \t]*;',body))
            if len(hit)!=1:raise ValueError('PROPERTY_NOT_UNIQUE:'+key)
            return hit[0].group(1).strip().strip('"')


        def field_list(body,key):
            hit=list(re.finditer(r'(?m)(?:^|\n)[ \t]*'+re.escape(key)+r'[ \t]*=[ \t]*\(',body))
            if not hit:hit=list(re.finditer(r'\b'+re.escape(key)+r'[ \t]*=[ \t]*\(',body))
            if len(hit)!=1:raise ValueError('LIST_NOT_UNIQUE:'+key)
            opening=hit[0].end()-1;ending=close_at(body,opening,'(',')')
            return body[opening+1:ending],opening,ending


        def matching_id_list(body,key):
            value,_,_=field_list(body,key)
            return set(re.findall(r'\b[A-F0-9]{24}\b',re.sub(r'/\*.*?\*/',' ',value,flags=re.S)))


        def register(text):
            if not text.startswith('// !$*UTF8*$!'):raise ValueError('NOT_XCODE_PBXPROJ')
            if 'PBXFileSystemSynchronizedRootGroup' in text:raise ValueError('SYNCHRONIZED_GROUP_UNSUPPORTED')
            for fn in ADDON_HASHES:
                if fn in text:raise ValueError('ALREADY_REFERENCED_OR_NAME_COLLISION:'+fn)
            objects,root_end=read_objects(text)
            def by_isa(name):return [o for o in objects.values() if re.search(r'\bisa\s*=\s*'+re.escape(name)+r'\s*;',o['body'])]
            targets=[o for o in by_isa('PBXNativeTarget') if prop_value(o['body'],'name')==TARGET]
            if len(targets)!=1:raise ValueError('APP_TARGET_NOT_UNIQUE')
            target=targets[0]
            phase_ids=matching_id_list(target['body'],'buildPhases')
            phases=[o for o in by_isa('PBXSourcesBuildPhase') if o['id'] in phase_ids]
            if len(phases)!=1:raise ValueError('SOURCES_PHASE_NOT_UNIQUE')
            phase=phases[0]
            file_refs=[o for o in by_isa('PBXFileReference')
                       if re.search(r'\bpath\s*=\s*"?CaptureCoordinator\.swift"?\s*;',o['body'])]
            if len(file_refs)!=1:raise ValueError('CAPTURE_FILE_REF_NOT_UNIQUE')
            capture_ref=file_refs[0]['id']
            groups=[o for o in by_isa('PBXGroup') if capture_ref in matching_id_list(o['body'],'children')]
            if len(groups)!=1:raise ValueError('CAPTURE_GROUP_NOT_UNIQUE')
            group=groups[0]
            group_value,_,group_list_end=field_list(group['body'],'children')
            phase_value,_,phase_list_end=field_list(phase['body'],'files')
            refs=[];builds=[];group_lines=[];phase_lines=[]
            for fn in ADDON_HASHES:
                ref=rid('ref',fn);build=rid('build',fn)
                if ref in objects or build in objects or ref in text or build in text:
                    raise ValueError('DETERMINISTIC_ID_COLLISION')
                refs.append(f'\t\t{ref} /* {fn} */ = {{isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = {fn}; sourceTree = "<group>"; }};')
                builds.append(f'\t\t{build} /* {fn} in Sources */ = {{isa = PBXBuildFile; fileRef = {ref} /* {fn} */; }};')
                group_lines.append(f'\t\t\t\t{ref} /* {fn} */,')
                phase_lines.append(f'\t\t\t\t{build} /* {fn} in Sources */,')
            # Inline OpenStep arrays may omit the final comma. Ignore comments.
            def insertion(value, lines):
                tail=lexical_mask(value).strip()
                return (',' if tail and not tail.endswith(',') else '')+'\n'+'\n'.join(lines)+'\n'
            changes=[
                (group['opening']+1+group_list_end,insertion(group_value,group_lines)),
                (phase['opening']+1+phase_list_end,insertion(phase_value,phase_lines)),
                (root_end,'\n'+'\n'.join(refs+builds)+'\n')
            ]
            if len({p for p,_ in changes})!=3:raise ValueError('OVERLAPPING_INSERTION')
            new=text
            for offset,data in sorted(changes,reverse=True):new=new[:offset]+data+new[offset:]
            obj2,_=read_objects(new)
            for fn in ADDON_HASHES:
                ref=rid('ref',fn);build=rid('build',fn)
                if ref not in obj2 or build not in obj2:raise ValueError('NEW_OBJECT_MISSING:'+fn)
            if len(obj2)!=len(objects)+len(ADDON_HASHES)*2:raise ValueError('OBJECT_COUNT_CHANGED')
            for id,old in objects.items():
                if id not in obj2:raise ValueError('OLD_OBJECT_MISSING:'+id)
                if id not in {group['id'],phase['id']} and obj2[id]['body']!=old['body']:
                    raise ValueError('UNRELATED_OBJECT_MODIFIED:'+id)
            patched_group=obj2[group['id']];patched_phase=obj2[phase['id']]
            for fn in ADDON_HASHES:
                if rid('ref',fn) not in matching_id_list(patched_group['body'],'children'):
                    raise ValueError('SOURCE_NOT_IN_GROUP:'+fn)
                if rid('build',fn) not in matching_id_list(patched_phase['body'],'files'):
                    raise ValueError('SOURCE_NOT_IN_BUILD_PHASE:'+fn)
            # Parse both full projects using an independent OpenStep parser.
            def parsed(data):
                with tempfile.TemporaryDirectory() as tmp:
                    p=Path(tmp)/'project.pbxproj';p.write_text(data,encoding='utf-8')
                    raw=subprocess.check_output(['plutil','-convert','json','-o','-','--',str(p)])
                    return json.loads(raw)
            old_tree=parsed(text);new_tree=parsed(new)
            old_objects=old_tree['objects']
            expected=old_tree
            expected['objects'][group['id']]['children'] += [rid('ref',fn) for fn in ADDON_HASHES]
            expected['objects'][phase['id']]['files'] += [rid('build',fn) for fn in ADDON_HASHES]
