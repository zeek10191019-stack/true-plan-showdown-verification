            with tarfile.open(fileobj=io.BytesIO(raw),mode='r:xz') as t:
                members=t.getmembers(); assert len(members)==len(expected)
                seen=set(); contents={}
                for x in members:
                    p=PurePosixPath(x.name)
                    assert x.isfile() and not p.is_absolute() and '..' not in p.parts and '\\' not in x.name and ':' not in x.name
                    assert x.name in expected and x.name not in seen and 0<=x.size<=5_000_000
                    b=t.extractfile(x).read(); assert sha(b)==expected[x.name]
                    seen.add(x.name);contents[x.name]=b
                assert seen==set(expected)
                for k,b in contents.items():
                    path=dest.joinpath(*PurePosixPath(k).parts);path.parent.mkdir(parents=True,exist_ok=True)
                    if path.exists(): assert allow_replace and path.is_file() and not path.is_symlink()
                    path.write_bytes(b)
