        // R1009-C11: best-effort, non-authoritative, bounded capture receipts.
        // This tap observes already-persisted RAW and completed OCR. It never owns or
        // stops ReplayKit/ScreenCaptureKit, disk recording, ZIP export, or voice.
        // No screen/name/turn may be certified from this tap.
        import Foundation

        public final class R1009C11LiveCaptureTap: @unchecked Sendable {
            public static let shared = R1009C11LiveCaptureTap()
            private let queue = DispatchQueue(label: "trueplan.r1009.c11.live-receipts", qos: .utility)
            private let pendingLock = NSLock()
            private let adapter: R1007CaptureIntegrationAdapter
            private var pending = 0
            private let maxPending = 96
            private var identity: (session: String, epoch: Int)?
            private var lastEpoch = 0
            private var lastSession = ""
            private var stoppedTokens = Set<String>()
            // Monotonic capture generations prevent a retired stream from re-arming.
            // Keep a bounded old-session registry; these are diagnostics only.
            private var closedOrder = [String]()

            public init(adapter: R1007CaptureIntegrationAdapter = R1007CaptureIntegrationAdapter()) {
                self.adapter = adapter
            }
            // Validate actual ASCII hex before mutating the current capture identity.
            private static func validSHA(_ value: String) -> Bool {
                value.utf8.count == 64 && value.utf8.allSatisfy {
                    (48...57).contains($0) || (65...70).contains($0) || (97...102).contains($0)
                }
            }
            private func submit(_ work: @escaping @Sendable () -> Void) {
                pendingLock.lock()
                guard pending < maxPending else { pendingLock.unlock(); return }
                pending += 1
                pendingLock.unlock()
                queue.async { [self] in
                    defer {
                        pendingLock.lock()
                        pending -= 1
                        pendingLock.unlock()
                    }
                    work()
                }
            }
            // Invoke ONLY after the existing recorder returned .stored for the exact
            // full-resolution rawPNG. Do not count preview cache or attempted writes.
            public func rawPersisted(session: String, epoch: Int64, frame: Int64,
                                     sha256: String, observedMS: Int64) {
                guard !session.isEmpty, session.utf8.count <= 128,
                      epoch > 0, epoch <= Int64(Int.max),
                      frame > 0, frame <= Int64(Int.max),
                      observedMS >= 0, Self.validSHA(sha256) else { return }
                submit { [self] in
                    let e = Int(epoch)
                    guard e >= lastEpoch, !stoppedTokens.contains(session) else { return }
                    // A different session cannot reuse an already-seen generation.
                    // Retired callbacks from a disconnected stream must not re-arm it.
                    guard e > lastEpoch || lastSession.isEmpty || lastSession == session else { return }
                    if let i = identity {
                        guard e > i.epoch || (e == i.epoch && i.session == session) else { return }
                        if e != i.epoch || session != i.session {
                            adapter.recordingStopped()
                            identity = nil
                        }
                    }
                    if identity == nil {
                        guard adapter.recordingStarted(sessionID: session, epoch: e) else { return }
                        identity = (session, e)
                        lastEpoch = e
                        lastSession = session
                    }
                    _ = adapter.preservedFrame(sessionID: session, epoch: e,
                        frameID: Int(frame), originalRawSHA256: sha256,
                        captureUptimeMS: observedMS, sceneHint: "unknown")
                }
            }
            // Invoke on the quick OCR publication path only. An OCR error or nickname
            // mismatch cannot stop capture, and is never promoted to current authority.
            public func ocrCompleted(session: String, epoch: Int64, frame: Int64,
                                     sha256: String, values: [String:Int64]) {
                guard !session.isEmpty, session.utf8.count <= 128, epoch > 0, epoch <= Int64(Int.max),
                      frame > 0, frame <= Int64(Int.max), Self.validSHA(sha256),
                      values.count <= 4096 else { return }
                // This represents numeric quick OCR candidates, NOT a game turn.
                let bounded = Dictionary(uniqueKeysWithValues:
                    values.keys.sorted().prefix(128).compactMap { key -> (String,String)? in
                        guard key.utf8.count <= 96, let v = values[key] else { return nil }
                        return ("quick." + key, String(v))
                    })
                submit { [self] in
                    guard let i = identity, i.session == session, i.epoch == Int(epoch) else { return }
                    _ = adapter.ocrCompleted(sessionID: session, epoch: Int(epoch),
                        frameID: Int(frame), originalRawSHA256: sha256, candidates: bounded)
                }
            }
            public func captureStopped(session: String) {
                guard !session.isEmpty, session.utf8.count <= 128 else { return }
                // Stop invalidation is never dropped due to OCR backpressure.
                queue.async { [self] in
                    if let i = identity, i.session == session {
                        adapter.recordingStopped()
                        identity = nil
                    }
                    if !stoppedTokens.contains(session) {
                        stoppedTokens.insert(session)
                        closedOrder.append(session)
                        if closedOrder.count > 64 {
                            let old = closedOrder.removeFirst()
                            stoppedTokens.remove(old)
                        }
                    }
                }
            }
            // Read-only diagnostics. Never enable audio or claim device certification.
            public func debugSnapshot(nowMS: Int64) -> [String:Any] {
                queue.sync { adapter.previewStatus(monotonicMS: nowMS) }
            }
        }
