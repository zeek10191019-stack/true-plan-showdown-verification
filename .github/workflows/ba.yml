      - name: Test integrity and iPhoneOS native build
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=.
          python3 -m unittest discover -s tests -p 'test_r605_*.py' -v
          python3 -m unittest discover -s tests -p 'test_r607_*.py' -v
          swiftc -parse-as-library \
            tests/R605StandaloneStub.swift \
            app/ios/ChampionsOnDevice/R605ExactFrameBinding.swift \
            app/ios/ChampionsOnDevice/R607FrameProvenanceAudit.swift \
            tests/R607ProvenanceHarness.swift \
            -o "$RUNNER_TEMP/r607"
          "$RUNNER_TEMP/r607"
          swiftc -frontend -parse app/ios/ChampionsOnDevice/*.swift
          python3 tools/run_r571_native.py || {
            for f in reports/xcode_iphoneos_build.log \
                     reports/r574_png_replay_compile.log; do
              test ! -f "$f" || grep -nE 'error:|BUILD FAILED' "$f" | tail -n 55 || true
            done
            exit 1
          }
          echo 'R607_NATIVE_TEST_PASS_NOT_OWNER_OR_MEGA_CERTIFIED'
