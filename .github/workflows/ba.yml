name: R607 Auto - Recheck Frame PNG Provenance (No IPA)
"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/ba.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trueplan-r607-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.repository ==
      'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
      && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 55
    env:
      PYTHONOPTIMIZE: "0"
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
    steps:
      - name: Restore SHA pinned R606, repair parent tests, apply R607
