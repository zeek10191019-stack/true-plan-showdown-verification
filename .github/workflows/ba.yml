               'cfad0be678ef000c5144ae1cf67d84a552d93c0b/'
               '.github/workflows/az.yml')
          parent=urllib.request.urlopen(url,timeout=90).read()
          assert len(parent)==6195,'R606_SIZE_DRIFT'
          digest=hashlib.sha256(parent).hexdigest()
          assert digest=='e4c2b6bdeea1e7576b2599897291956c9843b4ce451ffc60574838a73949ec08','R606_HASH_DRIFT'
          text=parent.decode('utf-8')
          for label in ['R606_REPLAY','R606_FIX']:
              expr=(r"python3 - <<'"+label+r"'\n(.*?)\n\s+"
                    +label+r"(?=\n|$)")
              matches=list(re.finditer(expr,text,re.S))
              assert len(matches)==1,('PARENT_BLOCK_COUNT',label,len(matches))
              source=textwrap.dedent(matches[0].group(1))
              exec(compile(source,label,'exec'),{'__name__':'__main__'})
          directory=Path('app/ios/ChampionsOnDevice')
