    - name: R815 independent source integrity and noncertification evidence
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PYR815VERIFY''

        from pathlib import Path

        import hashlib,json

        sha=lambda b:hashlib.sha256(b).hexdigest()

        root=Path(''source'');m=json.loads((root/''source_manifest.json'').read_text())

        f={str(p.relative_to(root)):p for p in root.rglob(''*'') if p.is_file() and not any(x in p.parts
        for x in (''.build'',''.swiftpm'',''__pycache__''))}

        assert len(f)==594 and set(f)==set(m)|{''source_manifest.json''}

        assert all(sha(f[n].read_bytes())==h for n,h in m.items())

        tree=sha(''''.join(n+''\t''+sha(f[n].read_bytes())+''\n'' for n in sorted(f)).encode())

        assert tree==''54d632a56fa170c143d042d65e370cda2592627454efe5ea0847b8080c7a6331''

        assert tree==Path(''R815Proof/SOURCE_TREE_SHA256.txt'').read_text().strip()

        e=json.loads(Path(''R815Proof/SOURCE_INTEGRITY.json'').read_text())

        assert e[''source_tree_sha256'']==tree and e[''source_file_count'']==594

        assert e[''device_ocr_continuity_certified''] is False and e[''device_79_fields_certified'']==0

        assert e[''ipa_created''] is False and e[''physical_vision_worker_force_cancellation''] is False

        print(''R815_SOURCE_EVIDENCE_594_FILES_VERIFIED_ZERO_DEVICE_CERTIFICATION'')

        PYR815VERIFY'
