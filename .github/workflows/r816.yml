name: R816 D76 Retire Queued OCR Work Before Physical Pool Admission NO IPA
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/r816.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: r816-d76-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private
      == false
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: macos-26
          lane: real-apple-vision
        - runner: xcode-27
          lane: iphoneos-compile
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
    - name: Checkout proven R793 only (NO IPA)
      uses: actions/checkout@v4
      with:
        ref: 37b3e26851c71fcabd65da3299356c1e38c53869
        fetch-depth: 1
        persist-credentials: false
        sparse-checkout: '.github/workflows/d30.b64

          .github/workflows/r793.yml

          '
        sparse-checkout-cone-mode: false
    - name: Reconstruct exact R793 via original hash-gated D53 source steps
      shell: bash
      run: "set -euo pipefail\nmkdir -p R793Proof R796Proof\npython3 - <<'PY'\nfrom pathlib import Path\n\
        import subprocess, re, os, json, hashlib\nsha=lambda b:hashlib.sha256(b).hexdigest()\nactual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()\n\
        assert actual=='37b3e26851c71fcabd65da3299356c1e38c53869'\noriginal=Path('.github/workflows/r793.yml').read_text()\n\
        blocks=re.split(r'(?=^    - name: )',original,flags=re.M)\nparsed={}\nfor block in blocks:\n \
        \   m=re.match(r'    - name: (.+)\\n',block)\n    if not m or '      run: |\\n' not in block:continue\n\
        \    body=block.split('      run: |\\n',1)[1]\n    lines=body.splitlines(keepends=True)\n    assert\
        \ all(x.startswith('        ') or not x.strip() for x in lines)\n    parsed[m.group(1)]=''.join(x[8:]\
        \ if x.startswith('        ') else x for x in lines)\nnames=[\n    'Restore independent SHA verified\
        \ source NO IPA',\n    'Apply pinned R773 cumulative source delta with SHA checks',\n    'Apply\
        \ R774 source-only delta with strict SHA checks',\n    'Apply R775 source-only delta with strict\
        \ SHA checks',\n    'Apply R776 quick lane freshness delta with strict SHA checks',\n    'Apply\
        \ R777 through R780 cumulative delta with SHA checks',\n    'Apply SHA verified R781 through R793\
        \ source fixes NO IPA',\n]\nfor n in names:\n    assert n in parsed,n\n    with open('R796Proof/Restore.log','a')\
        \ as out:\n        out.write('BEGIN '+n+'\\n');out.flush()\n        r=subprocess.run(['bash','-e','-o','pipefail','-c',parsed[n]],\n\
        \            stdout=out,stderr=subprocess.STDOUT,env=os.environ.copy(),timeout=360)\n        out.write('END\
        \ '+n+' '+str(r.returncode)+'\\n')\n    assert r.returncode==0,('R793_ORIGINAL_STEP_FAILED',n)\n\
        root=Path('source')\nmanifest=json.loads((root/'source_manifest.json').read_text())\ndisk={str(p.relative_to(root)):p\
        \ for p in root.rglob('*') if p.is_file()\n    and '__pycache__' not in p.parts}\nassert set(disk)==set(manifest)|{'source_manifest.json'}\n\
        assert len(disk)==566 and all(sha(disk[k].read_bytes())==v\n    for k,v in manifest.items())\n\
        digest=sha(''.join(n+'\\t'+sha(disk[n].read_bytes())+'\\n'\n    for n in sorted(disk)).encode())\n\
        assert digest=='b1f01daec74002cec9dd2ab3a79b9e7e0621d8a76d010f64e34068d10f414ff2',digest\nPath('R796Proof/R793_PINNED_SOURCE_SHA.txt').write_text(digest+'\\\
        n')\nprint('R793 pinned original complete',len(disk),digest)\nPY\n"
