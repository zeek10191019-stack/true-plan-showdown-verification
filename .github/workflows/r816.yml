    - name: R808 genuine Apple Vision on synthetic video with zero oracle input NO IPA
      if: matrix.lane == 'real-apple-vision'
      shell: bash
      run: "set -euo pipefail\nmkdir -p R808Proof\nif ! command -v ffmpeg >/dev/null 2>&1 || ! command\
        \ -v ffprobe >/dev/null 2>&1; then\n  HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1\
        \ brew install ffmpeg\nfi\nswiftc source/tools/r808_apple_vision_cli.swift -o \"$RUNNER_TEMP/r808_vision\"\
        \   > R808Proof/SwiftHelperCompile.log 2>&1 || {\n   tail -120 R808Proof/SwiftHelperCompile.log;\
        \ exit 1;\n  }\npython3 -m unittest discover -s source/tools/tests -p 'test_r808_blind_stream_replay.py'\
        \   > R808Proof/PythonBlindReplay.log 2>&1 || {\n   tail -120 R808Proof/PythonBlindReplay.log;\
        \ exit 1;\n  }\ngrep -F 'Ran 9 tests' R808Proof/PythonBlindReplay.log\npython3 - \"$RUNNER_TEMP/r808_vision\"\
        \ <<'PYR808MAC'\nfrom pathlib import Path\nimport hashlib, json, subprocess, sys, zipfile, importlib\n\
        root=Path('R808Proof')\nhelper=Path(sys.argv[1]).resolve()\nsys.path.insert(0,str(Path('source/tools').resolve()))\n\
        import r808_blind_stream_replay as replay\nmovie=root/'synthetic_test_only.mov'\ncmd=['ffmpeg','-nostdin','-v','error','-f','lavfi','-i',\n\
        \ 'testsrc=size=320x240:rate=5:duration=2','-c:v','mpeg4','-y',str(movie)]\nsubprocess.run(cmd,check=True,capture_output=True)\n\
        zpath=root/'synthetic_test_only_one_tap.zip'\nwith zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED)\
        \ as z:\n z.write(movie,'continuous/screen.mov')\n z.writestr('continuous/session.json',json.dumps({\n\
        \  'movie_name':'screen.mov','session_id':'R808_SYNTHETIC_NO_REAL_GAME'}))\n z.writestr('continuous/live_ocr.jsonl','POISON_LABEL_NEVER_READ_BY_PREDICTOR')\n\
        r=replay.run_blind(zpath,root/'synthetic_apple_vision_evidence',helper,\n fps=2,max_frames=100,pace_1x=False,test_only=True)\n\
        assert r['status']=='TEST_MEDIA_ONLY_NOT_REAL_GAME_CERTIFIED'\nassert r['completion_verified']\
        \ and r['frames_journaled']>=3\nassert r['battle_state_fields_certified_count']==0\nassert r['ground_truth_available_to_predictor']\
        \ is False\njournal=(root/'synthetic_apple_vision_evidence/raw_vision_predictions.jsonl').read_text()\n\
        assert 'POISON_LABEL_NEVER_READ_BY_PREDICTOR' not in journal\np={'schema':'trueplan.r808.mac-smoke.v1',\n\
        \ 'synthetic_test_media_apple_vision_ocr':'PASS',\n 'synthetic_test_video_frames':r['frames_journaled'],\n\
        \ 'real_game_original_movie_accessible':False,\n 'real_saved_mov_blind_replay':'NOT_EXECUTED_NO_ORIGINAL_MEDIA',\n\
        \ 'pokemon_field_accuracy_measured':False,'mega_81_accuracy_measured':False,\n 'live_79_field_certified':False,'ipa_created':False}\n\
        (root/'BLIND_REPLAY_SMOKE.json').write_text(json.dumps(p,indent=2)+'\\n')\nprint(json.dumps(p))\n\
        PYR808MAC\n"
