    - name: R807 audit all 81 Mega catalog entries and honest blind video availability (NO IPA)
      shell: bash
      run: "set -euo pipefail\nmkdir -p R807Proof\npython3 - <<'PYR807'\nfrom pathlib import Path\nimport\
        \ json,re,hashlib\nroot=Path('source')\nsrc=(root/'app/ios/ChampionsOnDevice/R649MegaRegistryAudit.swift').read_text()\n\
        block=re.search(r'private static let source = \"\"\"\\n(.*?)\\n\"\"\"',src,re.S)\nassert block\
        \ is not None,'MEGA_CATALOG_BLOCK_MISSING'\nrows=[line.split('|') for line in block.group(1).splitlines()\
