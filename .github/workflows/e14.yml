       print('R752_DIFF_ONLY_SHA_PASS',len(changed))
       PYTHON
    - name: Upload source and diagnostics only NO IPA
      uses: actions/upload-artifact@v4
      with:
        name: R752-hp-bar-link-NO-IPA
