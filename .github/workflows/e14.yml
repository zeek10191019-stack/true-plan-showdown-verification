        ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
        -derivedDataPath "$RUNNER_TEMP/r752" build \
        > R752Proof/iPhoneOS.log 2>&1 || {
         grep -E 'error:|BUILD FAILED' R752Proof/iPhoneOS.log || true
