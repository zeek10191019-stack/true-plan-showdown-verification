name: R1045 C45 secure foreground product candidate and legacy regression (NO IPA)
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/c45.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    name: ${{ matrix.job }}
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
        - job: macos-source
          os: xcode-27
        - job: windows-cli
          os: windows-2025
        - job: windows-receiver
          os: windows-2025
        - job: macos-sender
          os: xcode-27
        - job: windows-hud
          os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
    - name: Run pinned C38 and C39 HTTP and cancellation regression
      shell: bash
      env:
        C33_JOB: ${{ matrix.job }}
        GH_TOKEN: ${{ github.token }}
        PYTHONUTF8: '1'
      run: |
        set -Eeuo pipefail
        if [[ "$RUNNER_OS" == Windows ]]; then PY=python; else PY=python3; fi
        "$PY" - <<'C39_PY'
        import hashlib,urllib.request,pathlib,os,base64,zlib
        url='https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/85c100b1f00de1ee834e70523f727bb707ea6ec9/.github/workflows/c38.yml'
        with urllib.request.urlopen(url,timeout=60) as r: raw=r.read(50000)
        assert hashlib.sha256(raw).hexdigest()=='053484efd027e24f9f38543e3380ca67fa3df21edfb99ca7b22abf8fa7e77670'
        body=raw.decode().split("        \"$PY\" - <<'C38_PY'\n",1)[1].split('\n        C38_PY',1)[0]
        code='\n'.join(l[8:] for l in body.splitlines())+'\n'
        assert hashlib.sha256(code.encode()).hexdigest()=='0dbdaba92e7dae347775ce89aebdab896c27ce8dfbb5e8b40c1b9027d26001b6'
        patch=zlib.decompress(base64.b64decode(''));assert hashlib.sha256(patch).hexdigest()=='93d5ea0c1fbecc9f23368dffc3a19f259d61e3c2c3b0bcf86c0c28e4b838141e'
        (pathlib.Path(os.environ['RUNNER_TEMP'])/'c39_patch.py').write_bytes(patch)
        cancel=zlib.decompress(base64.b64decode(''));assert hashlib.sha256(cancel).hexdigest()=='4f3e2af5efcb6f71fc548ac31882655bf4236c903ec56995b259af0b3ec02243'
        (pathlib.Path(os.environ['RUNNER_TEMP'])/'c39_cancel_patch.py').write_bytes(cancel)
        marker="exec(compile(code,'pinned-c37-bootstrap','exec'))";assert code.count(marker)==1
        code=code.replace(marker,'anchor="exec(compile(code,\'pinned-c35-bootstrap\',\'exec\'))";assert code.count(anchor)==1\ncode=code.replace(anchor,\'marker="runner=tmp/\\\'c35-runner.py\\\'";assert code.count(marker)==1\\ncode=code.replace(marker,\\\'anchor="    f=root/(\\\\\\\'c33-step-\\\\\\\'";assert code.count(anchor)==1\\\\ncode=code.replace(anchor,\\\\\\\'    if job in (\\\\\\\\\\\\\\\'windows-receiver\\\\\\\\\\\\\\\',\\\\\\\\\\\\\\\'macos-sender\\\\\\\\\\\\\\\') and i==0:\\\\\\\\n        mark=(\\\\\\\\\\\\\\\'python\\\\\\\\\\\\\\\' if shell==\\\\\\\\\\\\\\\'pwsh\\\\\\\\\\\\\\\' else \\\\\\\\\\\\\\\'python3\\\\\\\\\\\\\\\')+\\\\\\\\\\\\\\\' -m unittest -v test_transfer_receiver test_recover_r714 test_resume_r714 test_finalize test_c32 test_c33\\\\\\\\\\\\\\\'\\\\\\\\n        assert run.count(mark)==1\\\\\\\\n        prefix="& python (Join-Path $env:RUNNER_TEMP \\\\\\\\\\\\\\\'c39_patch.py\\\\\\\\\\\\\\\')\\\\\\\\\\\\\\\\nif ($LASTEXITCODE -ne 0) { throw \\\\\\\\\\\\\\\'C39_CONNECTION_REGRESSION_FAILED\\\\\\\\\\\\\\\' }\\\\\\\\\\\\\\\\n" if shell==\\\\\\\\\\\\\\\'pwsh\\\\\\\\\\\\\\\' else \\\\\\\\\\\\\\\'python3 "$RUNNER_TEMP/c39_patch.py"\\\\\\\\\\\\\\\\n\\\\\\\\\\\\\\\'\\\\\\\\n        run=run.replace(mark,prefix+mark)\\\\\\\\n\\\\\\\'+anchor)\\\\n\\\'+marker)\\nf=pathlib.Path(os.environ[\\\'RUNNER_TEMP\\\'])/\\\'c37.py\\\'\\ncombined=f.read_bytes();assert combined==patch+extra38\\ntext=extra38.decode();mark=\\\'assert all(h(newfiles[n])==v[1] for n,v in encoded.items())\\\';assert text.count(mark)==1\\ninjection="\\\\nif mode==\\\'sender\\\':\\\\n    ns={}\\\\n    exec(compile((pathlib.Path(os.environ[\\\'RUNNER_TEMP\\\'])/\\\'c39_cancel_patch.py\\\').read_bytes(),\\\'c39-cancel-patch\\\',\\\'exec\\\'),ns)\\\\n    ns[\\\'apply_files\\\'](newfiles)"\\ntext=text.replace(mark,mark+injection);compile(text,\\\'c39-c38-helper\\\',\\\'exec\\\')\\nf.write_bytes(patch+text.encode())\\n\'+anchor)\n'+marker)
        exec(compile(code,'pinned-c38-bootstrap','exec'))
        C39_PY
    - name: C40 durable background journal and process recovery; no device claim
      if: matrix.job == 'macos-sender'
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 - <<'C40_PY'
        import base64,hashlib,pathlib,zlib,os,subprocess,sys
        root=pathlib.Path(os.environ['RUNNER_TEMP'])/'c40-journal'
        root.mkdir(exist_ok=False)
        encoded={'R1040BackgroundJournal.swift': ('', '096b740f3b6112d0133cd535d03c46c5f78b479762dea9323f14932577743179'), 'journal_probe.swift': ('', 'ee91daffb10db04576a5e5e78bf02eb089973310298c9285203368e93ca8d5c3'), 'journal_crash_probe.swift': ('', 'cd32a99def7ae0c1bca3567729060d0d3cb14ca9b4b09e137ad612774de48cd5'), 'run_c40_tests.py': ('', '1e9f5b596903b59bb9feb586eb2b6510fc140995761e55e29b8f0d3cd409fece')}
        for name,(payload,digest) in encoded.items():
            assert pathlib.PurePosixPath(name).name==name
            data=zlib.decompress(base64.b64decode(payload))
            assert hashlib.sha256(data).hexdigest()==digest,name
            (root/name).write_bytes(data)
        subprocess.run([sys.executable,str(root/'run_c40_tests.py')],check=True)
        C40_PY
    - name: C41 HTTPS adapter, mock peer recovery and iPhoneOS typecheck (experimental)
      if: matrix.job == 'macos-sender'
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 - <<'C41_PY'
        import base64,hashlib,pathlib,zlib,os,subprocess,sys
        root=pathlib.Path(os.environ['RUNNER_TEMP'])/'c41-adapter'
        root.mkdir(exist_ok=False)
        encoded={'R1040BackgroundJournal.swift': ('', '096b740f3b6112d0133cd535d03c46c5f78b479762dea9323f14932577743179'), 'R1041BackgroundAdapter.swift': ('', '4a97d6b99c61d2fceea3b35a830c34a007a9a315e39a87f058b9c4429b82e861'), 'R1041PairKeychain.swift': ('', '97d389ae47bf3b0d2588440900aeaf06a452caa8a58dcc8e0ad1cd073e08802f'), 'adapter_probe.swift': ('', '475fbea5e2b6f4f3b5e8e2874e92ce260309429dcbcaf3c44ea8a7ab2fe9b3ef'), 'run_c41_tests.py': ('', 'a36f0a5085c924e5c1c643b27244ef346979d863e1afee64994f99f2b94eb667'), 'r1041_tls_receiver.py': ('', '570570486294a0ac57d000855c031d0380b00fd2b6cdc074197572eb8bfbe2a6'), 'tls_probe.py': ('', '733dbd2a21de5de853f4676eebc069dd3c4c7ec1b7ab7ba6e14f7210446a00a8'), 'tls_existing_receiver_probe.py': ('', '0c99be65db4749559427929daf3c3e65bd33a9fb5ef55d86cfdfd5da73345af4')}
        for name,(payload,digest) in encoded.items():
            assert pathlib.PurePosixPath(name).name==name
            data=zlib.decompress(base64.b64decode(payload));assert hashlib.sha256(data).hexdigest()==digest,name
            (root/name).write_bytes(data)
        subprocess.run([sys.executable,str(root/'run_c41_tests.py')],check=True)
        subprocess.run([sys.executable,str(root/'tls_probe.py')],check=True)
        subprocess.run([sys.executable,str(root/'tls_existing_receiver_probe.py'),str(pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'c32-source')],check=True)
        C41_PY
    - name: C42 secure pairing, small and 530MB HTTPS archive recovery with preserved receiver
      if: matrix.job == 'macos-sender' || matrix.job == 'windows-receiver'
      shell: bash
      run: |
        set -Eeuo pipefail
        if [[ "$RUNNER_OS" == Windows ]]; then PY=python; else PY=python3; fi
        "$PY" - <<'C42_PY'
        import base64,hashlib,os,pathlib,subprocess,sys,zlib
        root=pathlib.Path(os.environ['RUNNER_TEMP'])/'c42-pairing'
        root.mkdir(exist_ok=False)
        payload={'r1041_tls_receiver.py': ('', '570570486294a0ac57d000855c031d0380b00fd2b6cdc074197572eb8bfbe2a6'), 'r1042_pairing.py': ('', '752081962ea3c64f3ae15c9d566ec20cf16077eda80f04a5257982ea7a47556e'), 'pair_probe.py': ('', 'e67861331c06008a5448a56969bc8544ac343719087c1e39f1db6adb0da4c03e'), 'tls_archive_probe.py': ('', '49d1adb7d05b0da9006cac16b7221d2b0af7c780e58afd939a900932c2b7f76b'), 'tls_probe.py': ('', '733dbd2a21de5de853f4676eebc069dd3c4c7ec1b7ab7ba6e14f7210446a00a8'), 'large_https_probe.py': ('', '2045cc620a7eef1c444c2c084f0682be8e0e5c5b38315ee2f5eb7a96d964f3c0')}
        for name,(encoded,digest) in payload.items():
            assert pathlib.PurePosixPath(name).name==name
            data=zlib.decompress(base64.b64decode(encoded));assert hashlib.sha256(data).hexdigest()==digest,name
            (root/name).write_bytes(data)
        source=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'c32-source'
        assert (source/'transfer_receiver.py').is_file() and (source/'recover_r714.py').is_file()
        subprocess.run([sys.executable,str(root/'pair_probe.py')],check=True)
        subprocess.run([sys.executable,str(root/'tls_archive_probe.py'),str(source)],check=True)
        subprocess.run([sys.executable,str(root/'large_https_probe.py'),str(source)],check=True)
        print('C42_PAIRING_AND_HTTPS_ARCHIVE_PASS_RUNNER_ONLY_NO_IOS_BACKGROUND_OR_IPA',flush=True)
        C42_PY
    - name: C43 durable secure launcher and independent pair approval
      if: matrix.job == 'macos-sender' || matrix.job == 'windows-receiver'
      shell: bash
      run: |
        set -Eeuo pipefail
        if [[ "$RUNNER_OS" == Windows ]]; then PY=python; else PY=python3; fi
        "$PY" - <<'C43_PY'
        import pathlib,os,sys,zlib,base64,hashlib,subprocess
        root=pathlib.Path(os.environ['RUNNER_TEMP'])/'c43';root.mkdir(exist_ok=False)
        payload={'r1043_launcher.py': ('', '3e8e60011dfabc54762885a3fb86e73a949d0df1407f92a9b101d39f1e884cf6'), 'START_SECURE_RECEIVER.cmd': ('eNptzMEKwjAQhOH7PsVQEPRgba1n8U0kJBsiLNmwaZRe+uxW8KaXOX3z39gnhcZIlWdR74R8wCmg262hDB29EhujLLjmJjh/lh4RbKYm/GTBiD1hE3PSDBuHy3QX17Lfjn1Z6ACWyl+D4/SP/BSLa5XpDXn5Mec=', '2d04b5a167c32ae9f2ea45a21e321e0b3c3f3a0d14e077b70ca6b98a34478ca6'), 'launcher_probe.py': ('', '7cf4cc0eb00f082b37c91bfb2106471889bb2887c6ddb9e65266ea2f3bdd8862'), 'R1043PairApproval.swift': ('', '0ae2b338cc72d8873aec8dd71752a81e9b71849221c0d01147a59ee54fadee97'), 'approval_probe.swift': ('', 'df8792448b5da7dcedf43b1bf8fe902aab838e8316cdf03b58a0df7711e835ca'), 'R1040BackgroundJournal.swift': ('', '096b740f3b6112d0133cd535d03c46c5f78b479762dea9323f14932577743179'), 'R1041BackgroundAdapter.swift': ('', '4a97d6b99c61d2fceea3b35a830c34a007a9a315e39a87f058b9c4429b82e861'), 'R1041PairKeychain.swift': ('', '97d389ae47bf3b0d2588440900aeaf06a452caa8a58dcc8e0ad1cd073e08802f'), 'r1041_tls_receiver.py': ('', '570570486294a0ac57d000855c031d0380b00fd2b6cdc074197572eb8bfbe2a6'), 'r1042_pairing.py': ('', '752081962ea3c64f3ae15c9d566ec20cf16077eda80f04a5257982ea7a47556e')}
        for name,(encoded,digest) in payload.items():
            assert pathlib.PurePosixPath(name).name==name
            raw=zlib.decompress(base64.b64decode(encoded));assert hashlib.sha256(raw).hexdigest()==digest,name
            (root/name).write_bytes(raw)
        source=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'c32-source'
        assert (source/'transfer_receiver.py').is_file() and (source/'recover_r714.py').is_file()
        subprocess.run([sys.executable,str(root/'launcher_probe.py'),str(source)],check=True)
        print('C43_PC_LAUNCHER_LOGIC_PASS_11_NOT_GUI_NOT_PHYSICAL',flush=True)
        if os.environ.get('RUNNER_OS')=='macOS':
            sources=[str(root/n) for n in ('R1040BackgroundJournal.swift','R1041BackgroundAdapter.swift','R1041PairKeychain.swift','R1043PairApproval.swift')]
            exe=root/'approval';subprocess.run(['swiftc','-swift-version','6',*sources,str(root/'approval_probe.swift'),'-o',str(exe)],check=True)
            p=subprocess.run([str(exe)],check=True,text=True,capture_output=True);print(p.stdout,flush=True);assert 'C43_PAIR_APPROVAL_PASS 11/11' in p.stdout and p.stdout.count('PASS ')==12
            sdk=subprocess.check_output(['xcrun','--sdk','iphoneos','--show-sdk-path'],text=True).strip()
            subprocess.run(['xcrun','--sdk','iphoneos','swiftc','-swift-version','6','-typecheck','-target','arm64-apple-ios18.0','-sdk',sdk,*sources],check=True)
            print('C43_IOS_PAIR_APPROVAL_TYPECHECK_PASS_NOT_WIRED_NOT_DEVICE',flush=True)
        print('C43_EXPERIMENTAL_LAUNCHER_AND_PAIRING_PASS_NO_PRODUCT_ENABLE_NO_IPA',flush=True)
        C43_PY
    - name: C44 wake lifecycle negative control and pinned foreground candidate
      if: matrix.job == 'macos-sender'
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 - <<'C44_PY'
        import pathlib,os,sys,zlib,base64,hashlib,subprocess
        root=pathlib.Path(os.environ['RUNNER_TEMP'])/'c44';root.mkdir(exist_ok=False)
        payload={'R1040BackgroundJournal.swift': ('', '096b740f3b6112d0133cd535d03c46c5f78b479762dea9323f14932577743179'), 'R1044BackgroundAdapter.swift': ('', '86c49da627db1dc62d075bdeb34da5b2602ac2edf8b2923388df2a4030dc6458'), 'R1044WakeDrain.swift': ('', '9d7b891e75ce59a33a0dc8f84e3af239f73de87eec6d368c43d831ac59a02d03'), 'R1044ForegroundSecureTransfer.swift': ('', 'ff70cc2e19c2f8cd9a3a01a92af20f75255d2b642e930d186cba5ed5678b8d4e'), 'R1041PairKeychain.swift': ('', '97d389ae47bf3b0d2588440900aeaf06a452caa8a58dcc8e0ad1cd073e08802f'), 'R1043PairApproval.swift': ('', '0ae2b338cc72d8873aec8dd71752a81e9b71849221c0d01147a59ee54fadee97'), 'c44_probe.swift': ('', '4199bc48b6cd869e4112b8f5acba59a6e01d8cd0cd059cd0833be66ca00cc242')}
        for name,(encoded,digest) in payload.items():
            assert pathlib.PurePosixPath(name).name==name
            raw=zlib.decompress(base64.b64decode(encoded));assert hashlib.sha256(raw).hexdigest()==digest,name
            (root/name).write_bytes(raw)
        sources=[str(root/n) for n in ('R1040BackgroundJournal.swift','R1044BackgroundAdapter.swift','R1044WakeDrain.swift','R1044ForegroundSecureTransfer.swift','R1041PairKeychain.swift','R1043PairApproval.swift')]
        negative=root/'NegativeWake.swift';s=(root/'R1044WakeDrain.swift').read_text();assert s.count('handlers.append(completion)')==1;negative.write_text(s.replace('handlers.append(completion)','handlers = [completion]'))
        old=[str(negative) if n.endswith('R1044WakeDrain.swift') else n for n in sources]
        exe=root/'negative';subprocess.run(['swiftc','-swift-version','6',*old,str(root/'c44_probe.swift'),'-o',str(exe)],check=True)
        p=subprocess.run([str(exe)],text=True,capture_output=True);print(p.stdout,flush=True);assert p.returncode==1 and 'FAIL multiple callbacks retained' in p.stdout
        exe=root/'probe';subprocess.run(['swiftc','-swift-version','6',*sources,str(root/'c44_probe.swift'),'-o',str(exe)],check=True)
        p=subprocess.run([str(exe)],check=True,text=True,capture_output=True);print(p.stdout,flush=True);assert 'C44_PASS 19/19 MODEL_NOT_DEVICE' in p.stdout and p.stdout.count('PASS ')==20
        sdk=subprocess.check_output(['xcrun','--sdk','iphoneos','--show-sdk-path'],text=True).strip()
        subprocess.run(['xcrun','--sdk','iphoneos','swiftc','-swift-version','6','-typecheck','-target','arm64-apple-ios18.0','-sdk',sdk,*sources],check=True)
        print('C44_WAKE_AND_FOREGROUND_TYPECHECK_PASS_NOT_WIRED_BACKGROUND_UPLOAD_DISABLED_NO_IPA',flush=True)
        C44_PY
    - name: C45 secure foreground store integration, legacy real loopback and actual unsigned product build
      if: matrix.job == 'macos-sender' || matrix.job == 'macos-source'
      env:
        C45_JOB: ${{ matrix.job }}
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 - <<'C45_PY'
        import pathlib,os,sys,zlib,base64,hashlib,subprocess,json
        root=pathlib.Path(os.environ['RUNNER_TEMP'])/'c45';root.mkdir(exist_ok=False)
        sha=lambda b:hashlib.sha256(b).hexdigest()
        payload={'R1029TransferClient.swift': ('', '09e9532d96e2fd36d29900e44d6969dbf97a2945127eceecee9753b018265155'), 'R1032TransferStage.swift': ('', '1a13b9fdd10e42434a2dba3131624bfaa7719e890d51c119558dc33193fa1aa7'), 'R1036TransferJobStore.swift': ('', '73a9273f4c1a7ff0e33fadffddab626986553c1d41ba5802fba52459585ac064'), 'R1036TransferPanel.swift': ('', '0df6619f5b4f57f2d668f051b579b2a40440d2f9312d6c9a995fcfba0d1b7b67'), 'R1040BackgroundJournal.swift': ('', '096b740f3b6112d0133cd535d03c46c5f78b479762dea9323f14932577743179'), 'R1041PairKeychain.swift': ('', '97d389ae47bf3b0d2588440900aeaf06a452caa8a58dcc8e0ad1cd073e08802f'), 'R1043PairApproval.swift': ('', '52cdae3e41bb0a39f1d77bc3bc03e994450b9e6af9511056ef862130525a6784'), 'R1044ForegroundSecureTransfer.swift': ('', 'ff70cc2e19c2f8cd9a3a01a92af20f75255d2b642e930d186cba5ed5678b8d4e'), 'R1045SecureWire.swift': ('', 'f6142de25a1172b76a97d865c3e2b93981b9152c9b6ba9593df4c9300cd643f6'), 'R1045TransferLease.swift': ('', 'bf927f217d05b0e60683532aebe26cad069c442e823349ae02a7420b751125bb'), 'c45_probe.swift': ('', '9644d780e5d51a4b473964685d0c0fcbaaad1174e332d8d6bb84b9385d37fc7e'), 'c45_fixture.py': ('', 'd6ec50e83b593b1c9a168aca550b9246c356d376df7c3f2e220bb7d5039f8e7e'), 'c45_legacy_e2e.py': ('', 'f859eea33daa4ec682e02301a8e9b85f0baeaacc4d79c5836f201c0a70a94510'), 'cancel_probe.swift': ('', '02f9e8e93f6bca163410e27c1e8cef1cb5cec924160d2d177ed587d0a1267cca'), 'cancel_test.py': ('', 'a19a0e53c266826b9ab19188860714d1c03ef02eb04198ab6d713c5f3c5e6bdf'), 'job_probe.swift': ('', 'e6a88096a1f79b941c6fac2490c431c3cd72d1cb635d87e32fbefcf132c3ae7f')}
        for name,(encoded,digest) in payload.items():
            assert pathlib.PurePosixPath(name).name==name
            raw=zlib.decompress(base64.b64decode(encoded));assert sha(raw)==digest,name
            (root/name).write_bytes(raw)
        source_names=[n for n in payload if n.endswith('.swift') and n not in ('c45_probe.swift','job_probe.swift','cancel_probe.swift')]
        sources=[str(root/n) for n in source_names]
        if os.environ['C45_JOB']=='macos-sender':
            old=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'c32-source'
            for name,digest in {'R1029TransferClient.swift': '09e9532d96e2fd36d29900e44d6969dbf97a2945127eceecee9753b018265155', 'R1032TransferStage.swift': '1a13b9fdd10e42434a2dba3131624bfaa7719e890d51c119558dc33193fa1aa7', 'R1036TransferJobStore.swift': 'c3265dbe2b1c017872bd1a0d089fa7563d432f372e5202f65637025f7b50e8a3', 'R1036TransferPanel.swift': '2fed80d08545a81cb05f64598270af1bab194f490a91a90c6d4a356f5a511bd3'}.items():assert sha((old/name).read_bytes())==digest,name
            # Counterfactual: disabling the shared per-job lease must reproduce the cross-store bug.
            p=root/'R1036TransferJobStore.swift';s=p.read_text();needle='        let lease=try R1045TransferLease(directory:folder(jobID));defer{withExtendedLifetime(lease){}}\n';assert s.count(needle)==2
            neg=root/'NegativeStore.swift';neg.write_text(s.replace(needle,''))
            old_sources=[str(neg) if n.endswith('R1036TransferJobStore.swift') else n for n in sources]
            def compile_run(files,probe,exe,script,args=(),negative=False):
                subprocess.run(['swiftc','-swift-version','6',*files,str(root/probe),'-o',str(root/exe)],check=True)
                p=subprocess.run([sys.executable,str(root/script),*args,str(root/exe)],text=True,capture_output=True,timeout=180)
                print(p.stdout,p.stderr,flush=True)
                if negative:assert p.returncode==1 and 'FAIL cross store excludes secure duplicate' in p.stdout
                else:assert p.returncode==0
                return p.stdout
            compile_run(old_sources,'c45_probe.swift','negative','c45_fixture.py',negative=True)
            result=compile_run(sources,'c45_probe.swift','probe','c45_fixture.py');assert 'C45_PASS 19/19 STORE_INTEGRATION_MOCK_TRANSPORT_NOT_DEVICE' in result and result.count('PASS ')==20
            result=compile_run(sources,'job_probe.swift','legacy','c45_legacy_e2e.py',(str(old),));assert 'C45_LEGACY_HTTP_REAL_LOOPBACK_PASS 12 SHA_MATCH' in result
            result=compile_run(sources,'cancel_probe.swift','cancel','cancel_test.py');assert 'C38_FAILURES=0 TOTAL=11' in result and result.count('PASS ')==11
            sdk=subprocess.check_output(['xcrun','--sdk','iphoneos','--show-sdk-path'],text=True).strip()
            subprocess.run(['xcrun','--sdk','iphoneos','swiftc','-swift-version','6','-typecheck','-target','arm64-apple-ios18.0','-sdk',sdk,*sources],check=True)
            print('C45_STORE_INTEGRATION_AND_LEGACY_REGRESSION_PASS_NOT_DEVICE',flush=True)
        elif os.environ['C45_JOB']=='macos-source':
            # The C38 native source remains in the same runner after the original C44/C38 product build.
            # Check all manifest-listed sources; prior xcodebuild may have generated extra build products.
            product=pathlib.Path(os.environ['RUNNER_TEMP'])/'c6-objects/pinned-r793/source'
            manifest=product/'source_manifest.json';before=json.loads(manifest.read_bytes())
            assert isinstance(before,dict) and before
            def actual():
                result={}
                for name in before:
                    path=product/name
                    assert path.resolve().is_relative_to(product.resolve()) and path.is_file(),name
                    result[name]=sha(path.read_bytes())
                return result
            assert actual()==before,'C45_EXISTING_PRODUCT_MANIFEST_MISMATCH'
            rel='app/ios/ChampionsOnDevice/R1032TransferStage.swift';p=product/rel
            assert before[rel]=='156a926c49877b770a977a4b91cb8ce3dee31af98258a21dc918b3e905285c5a'
            view=(product/'app/ios/ChampionsOnDevice/ChampionsOnDeviceApp.swift').read_text()
            assert view.count('R1036TransferPanel(index:capture.r714IndexURL,canPrepare:')==1
            # R1029TransferClient is already compiled by the C38 product, do not duplicate it.
            new=b'\n'.join((root/n).read_bytes() for n in source_names if n!='R1029TransferClient.swift')
            assert b'R1045.SecureTransfer' in new and b'R1041IOSBackgroundDriver' not in new
            p.write_bytes(new);expected=dict(before);expected[rel]=sha(new)
            assert actual()==expected;manifest.write_text(json.dumps(expected,sort_keys=True,indent=2)+'\n')
            subprocess.run(['swiftc','-frontend','-parse',str(p)],check=True)
            print('C45_NATIVE_SECURE_FOREGROUND_UI_PATCHED',sha(new),'NO_BACKGROUND_ENABLE',flush=True)
            log=root/'c45-native-build.log'
            with log.open('wb') as f:
                result=subprocess.run(['xcodebuild','-project',str(product/'app/ios/ChampionsOnDeviceResearch.xcodeproj'),'-target','ChampionsOnDeviceResearch','-configuration','Debug','-sdk','iphoneos','-arch','arm64','CODE_SIGNING_ALLOWED=NO','SYMROOT='+str(root/'build'),'build'],stdout=f,stderr=subprocess.STDOUT)
            text=log.read_text(errors='replace')
            if result.returncode or '** BUILD SUCCEEDED **' not in text:
                print('\n'.join(line for line in text.splitlines() if 'error:' in line or 'BUILD FAILED' in line or 'warning:' in line)[-20000:],flush=True);raise SystemExit(1)
            assert actual()==expected
            print('C45_NATIVE_IPHONEOS_ARM64_SECURE_FOREGROUND_PRODUCT_BUILD_PASS_NOT_DEVICE_NO_IPA',flush=True)
        else:raise AssertionError('unexpected job')
        C45_PY
  gate:
    needs:
    - verify
    if: always() && github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
    - name: 'Gate: every automated job must pass; no IPA or physical certification'
      shell: bash
      run: |
        set -Eeuo pipefail
        [[ '${{ needs.verify.result }}' == success ]]
        echo C45_AUTOMATED_GATE_PASS_IOS_REDIRECT_UI_PHYSICAL_IPA_HOLD
