          import argparse
          import hashlib
          import json
          import os
          from pathlib import Path
          import plistlib
          import stat
          import sys
          import zipfile
          
          APP_NAME = 'ChampionsOnDeviceResearch.app'
          BUNDLE_ID = 'com.zeek10191019.championsresearch'
          IPA_FILENAME = 'R27_419_Unsigned_ChampionsResearch.ipa'
