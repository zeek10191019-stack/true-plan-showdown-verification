              (output_dir/(IPA_FILENAME+'.sha256')).write_text(digest+'  '+IPA_FILENAME+'\n', encoding='utf8')
              audit={'release':'R27.419','kind':'UNSIGNED_RESEARCH_IPA','sha256':digest,'ipa_bytes':ipa.stat().st_size,
