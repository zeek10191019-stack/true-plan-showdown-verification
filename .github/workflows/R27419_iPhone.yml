          def inspect_app(app: Path):
              if not app.is_dir() or app.is_symlink() or app.name != APP_NAME:
                  raise ValueError('unexpected app directory')
              plist_path = app / 'Info.plist'
              if not plist_path.is_file():
                  raise ValueError('missing Info.plist')
              with plist_path.open('rb') as stream:
                  data = plistlib.load(stream)
              if data.get('CFBundleIdentifier') != BUNDLE_ID:
                  raise ValueError('unexpected CFBundleIdentifier')
              if data.get('CFBundleExecutable') != 'ChampionsOnDeviceResearch':
                  raise ValueError('unexpected CFBundleExecutable')
              if data.get('CFBundlePackageType') != 'APPL':
                  raise ValueError('CFBundlePackageType not APPL')
              if 'screen-capture' not in data.get('UIBackgroundModes', []):
                  raise ValueError('screen-capture background mode not present')
              if not str(data.get('NSScreenCaptureUsageDescription', '')).strip():
                  raise ValueError('missing capture consent description')
              ios_min = str(data.get('MinimumOSVersion', ''))
              if not ios_min or int(ios_min.split('.')[0]) != 27:
                  raise ValueError('unexpected MinimumOSVersion')
              if data.get('CFBundleVersion') != '419':
                  raise ValueError('unexpected app version')
              exe = app / data['CFBundleExecutable']
              if not exe.is_file() or exe.is_symlink() or exe.stat().st_size < 4:
                  raise ValueError('missing app executable')
              with exe.open('rb') as f:
                  if f.read(4) not in MACHO_MAGICS:
                      raise ValueError('executable is not Mach-O')
              if (app/'embedded.mobileprovision').exists():
                  raise ValueError('unexpected mobile provisioning profile')
              if (app/'_CodeSignature').exists():
                  raise ValueError('unexpected signature')
              return data
          
          
          def package_app(app: Path, output_dir: Path):
              data = inspect_app(app)
              if not output_dir.is_dir():
                  raise ValueError('output_dir must exist')
              ipa = output_dir / IPA_FILENAME
              if ipa.exists():
                  ipa.unlink()
              files = sorted(p for p in app.rglob('*') if p.is_file())
              if not files:
                  raise ValueError('no files in app')
              with zipfile.ZipFile(ipa, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
                  for p in files:
                      if p.is_symlink():
                          raise ValueError('refusing symlink in app')
                      name = 'Payload/' + APP_NAME + '/' + p.relative_to(app).as_posix()
                      if any(part in ('..', '') for part in Path(name).parts):
                          raise ValueError('unsafe member name')
                      info = zipfile.ZipInfo(name, date_time=(2020, 1, 1, 0, 0, 0))
                      info.compress_type = zipfile.ZIP_DEFLATED
                      info.external_attr = (p.stat().st_mode & 0xffff) << 16
                      archive.writestr(info, p.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=6)
              with zipfile.ZipFile(ipa) as archive:
                  if archive.testzip() is not None:
                      raise ValueError('IPA zip CRC failure')
                  names=set(archive.namelist())
                  if 'Payload/'+APP_NAME+'/Info.plist' not in names or 'Payload/'+APP_NAME+'/ChampionsOnDeviceResearch' not in names:
                      raise ValueError('missing mandatory IPA members')
                  embedded=plistlib.loads(archive.read('Payload/'+APP_NAME+'/Info.plist'))
                  if embedded.get('CFBundleIdentifier') != BUNDLE_ID:
