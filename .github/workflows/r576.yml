name: R576 On-Device Offline PNG Import and Mega OCR Probe (No IPA)
"on":
  push:
    branches: [main]
    paths: [.github/workflows/r576.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: xcode-27
            role: IOS27_NATIVE
          - runner: macos-26-intel
            role: PORTABLE_OCR
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      SCREEN_READ_CI_ROLE: ${{ matrix.role }}
      PYTHONOPTIMIZE: "0"
    steps:
      - name: Rebuild pinned R575 (itself R574 plus fix), apply R576 SHA-bound source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'RESTORE_R576'
          import ast,base64,hashlib,json,lzma,re,textwrap,urllib.request,subprocess
          from pathlib import Path
          sha=lambda b:hashlib.sha256(b).hexdigest()
          source_url='https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/fa0e84b59ba4c136a57171b870426c7aa23a1d07/.github/workflows/r575.yml'
          raw=urllib.request.urlopen(source_url,timeout=90).read()
          assert len(raw)==5207 and sha(raw)=='a86b4860d4dbd5e424f88ba33c7298da8c5e95d1112ad8250b3fd079f20dbbeb','R575_PIN_CHANGED'
          m=re.search(r"python3 - <<'RESTORE_R575'\n(.*?)\n\s+RESTORE_R575",raw.decode(),re.S)
          assert m,'R575_REPLAY_SCRIPT_MISSING'
          code=textwrap.dedent(m.group(1));ast.parse(code)
          exec(compile(code,'R575_SHA_PINNED_REPLAY','exec'))
          blob=''
          patches=json.loads(lzma.decompress(base64.b64decode(blob,validate=True)))
          assert len(patches)==5
          for name,entry in sorted(patches.items()):
              assert name in ['app/ios/ChampionsOnDevice/R576OfflinePNGImportGate.swift','app/ios/ChampionsOnDevice/R576OfflinePNGInspector.swift','app/ios/ChampionsOnDevice/ChampionsOnDeviceApp.swift','tests/R576OfflinePNGImportGateHarness.swift','app/ios/ChampionsOnDevice/Info.plist']
              p=Path(name)
              if entry['old_sha256'] is None:
                  assert not p.exists(),'R576_UNEXPECTED_EXISTING_FILE'
                  p.parent.mkdir(parents=True,exist_ok=True)
              else:assert sha(p.read_bytes())==entry['old_sha256'],'R576_SOURCE_PARENT_MISMATCH'
              data=base64.b64decode(entry['data'],validate=True)
              assert len(data)==entry['bytes'] and sha(data)==entry['new_sha256'],'R576_PATCH_HASH_FAIL'
              p.write_bytes(data)
          assert len(list(Path('app/ios/ChampionsOnDevice').glob('*.swift')))==119
          assert 'fileImporter(isPresented:$showOfflinePNGPicker' in Path('app/ios/ChampionsOnDevice/ChampionsOnDeviceApp.swift').read_text()
          assert 'R548MegaSceneProbe.inspect(png' in Path('app/ios/ChampionsOnDevice/R576OfflinePNGInspector.swift').read_text()
          assert 'R558FullFrameOCR.inspect(decoded:decoded' in Path('app/ios/ChampionsOnDevice/R576OfflinePNGInspector.swift').read_text()
          print('PASS_R576_EXACT_REPLAY_119_SWIFT_SOURCE_AND_UI_WIRING')
          RESTORE_R576
      - name: R576 offline PNG gate native test and all Swift syntax
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse app/ios/ChampionsOnDevice/*.swift
          swiftc app/ios/ChampionsOnDevice/R576OfflinePNGImportGate.swift tests/R576OfflinePNGImportGateHarness.swift -o "$RUNNER_TEMP/r576_offline_gate"
          "$RUNNER_TEMP/r576_offline_gate"
      - name: Existing R575 full native Apple OCR tests and iPhoneOS SDK build
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/run_r571_native.py
      - name: Separate unverified game-screen status
        if: always()
        shell: bash
        run: |
          echo 'R576: sources patched; app UI wired; no IPA; no live owner/mega form certification; no private PNG sent to CI'
