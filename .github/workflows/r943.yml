      - name: Test OCR capacity, journal and display isolation
        shell: bash
        run: |
          set -euo pipefail
          cd pinned-r793/source
          python3 tools/r745_read_path_gate.py
          python3 tools/r852_preflight_wiring.py
          python3 -m unittest discover -s tools/tests -p 'test_r875_native_capture_audit.py'
          python3 -m unittest discover -s tools/tests -p 'test_r76?_*.py'
          node tools/tests/test_r920_pc_display.mjs
      - name: Compile the iOS target on the pinned toolchain
        if: matrix.suite == 'iphoneos'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project pinned-r793/source/app/ios/ChampionsOnDeviceResearch.xcodeproj -scheme ChampionsOnDeviceResearch -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO -derivedDataPath "$RUNNER_TEMP/r943_device" build > "$RUNNER_TEMP/native.log" 2>&1 || { grep -E -B2 -A2 'error:|BUILD FAILED' "$RUNNER_TEMP/native.log"; exit 1; }
          grep -F 'BUILD SUCCEEDED' "$RUNNER_TEMP/native.log"
          app="$RUNNER_TEMP/r943_device/Build/Products/Release-iphoneos/ChampionsOnDeviceResearch.app"
          test "$(lipo -archs "$app/ChampionsOnDeviceResearch")" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Info.plist")" = 942
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist")" = 0.9.42
          echo R943_IPHONEOS_SOURCE_BUILDS
      - name: Check the existing portable capacity policy
        if: matrix.suite == 'portable'
        shell: bash
        run: |
          set -euo pipefail
          swift test -c release --jobs 3 --package-path pinned-r793/source/R720_PORTABLE_TESTS --filter R761AggregatePNGBudgetTests
