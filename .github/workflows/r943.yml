name: R943 OCR continuity at PNG capacity
on:
  push:
    branches: [r938-export-recovery]
    paths: [.github/workflows/r943.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: R943 ${{ matrix.suite }}
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: iphoneos
            runner: xcode-27
          - suite: portable
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: .github/workflows/r943.yml
      - name: Restore the pinned R942 app and verify the targeted patch
        shell: bash
        run: |
          set -euo pipefail
          git show 6a1aa7ef4244649f1c91ce661128e60515e29113:.github/workflows/r942.yml > "$RUNNER_TEMP/r942.yml"
          for step in 1 2; do
            ruby -ryaml -e 'puts YAML.load_file(ARGV[0], aliases: true).fetch("jobs").fetch("verify").fetch("steps").fetch(ARGV[1].to_i).fetch("run")' "$RUNNER_TEMP/r942.yml" "$step" > "$RUNNER_TEMP/r942-restore.sh"
            bash "$RUNNER_TEMP/r942-restore.sh"
