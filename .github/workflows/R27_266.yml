          const {UnsupportedState, isFainted} = require('./battle_api.cjs');
          const VERSION = 'r27.266.public-tactical.v1';
          const MAX_ACTIONS=36;
          const MOVE_STATS=new Set(['Physical','Special','Status']);
          function finite(x){return Number.isFinite(x);}
          function clamp(x,lo,hi){return Math.max(lo,Math.min(hi,x));}
          function speciesName(mon){return typeof mon?.details==='string'?mon.details.split(',')[0].trim():'';}
