# R27.265 — public, manual-only, self-contained MOCK contract verification.
# This workflow NEVER checks out, fetches or publishes the private Battle AI body.
name: R27.266 Public Tactical Policy and Runtime Intake Regression
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-intake-contract:
    if: ${{ github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Public repository check-out (no private source)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set pinned Node.js 22.18.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Verify pinned-source adapter and mock contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .r27_265_audit
          cd .r27_265_audit
          cat > battle_api.cjs <<'R27_265_SOURCE_0_EOF'
          'use strict';
          /**
           * R27.259 portable and deliberately conservative single-battle contract.
           * Not the original private Battle AI, not a Pokémon Champions physics oracle.
           * Zero dependencies; operates only on the owning side's Showdown request and
           * an explicit PUBLIC opponent observation. Unsupported states fail closed.
           */
          const crypto = require('node:crypto');
          const VERSION = 'r27.259.portable.v2';
          
          class UnsupportedState extends Error {
            constructor(code, details='') { super(`${code}${details ? ': '+details : ''}`); this.name='UnsupportedState'; this.code=code; }
          }
          const isFainted = p => /(?:^|\s)fnt(?:\s|$)/i.test(String(p.condition ?? ''));
          const sanit = x => String(x ?? '');
          const ownMon = m => ({
            ident:sanit(m.ident),details:sanit(m.details),condition:sanit(m.condition),active:!!m.active,
            moves:Array.isArray(m.moves)?m.moves.map(sanit):[],item:sanit(m.item),
            baseAbility:sanit(m.baseAbility),reviving:!!m.reviving
          });
          function observe(ownRequest, explicitPublicFoe={}) {
            if (ownRequest?.wait) return {v:VERSION,phase:'wait',own:[],active:null,foe:{species:null},forceSwitch:null,maxChosenTeamSize:null};
            if (!ownRequest || typeof ownRequest!=='object' || !Array.isArray(ownRequest.side?.pokemon))
              throw new UnsupportedState('NO_OWN_REQUEST');
            const phase=ownRequest.teamPreview?'preview':Array.isArray(ownRequest.forceSwitch)?'switch':
              Array.isArray(ownRequest.active)?'move':null;
            if (!phase) throw new UnsupportedState('UNKNOWN_PHASE');
            const o={v:VERSION,phase,own:ownRequest.side.pokemon.map(ownMon),
              active:Array.isArray(ownRequest.active)?ownRequest.active.map(a=>a?({
                moves:Array.isArray(a.moves)?a.moves.map(m=>({id:sanit(m.id),pp:Number.isFinite(m.pp)?m.pp:null,
                  disabled:!!m.disabled})):[],
                trapped:!!a.trapped,maybeTrapped:!!a.maybeTrapped,maybeDisabled:!!a.maybeDisabled,
                canMegaEvo:!!a.canMegaEvo,canMegaEvoX:!!a.canMegaEvoX,canMegaEvoY:!!a.canMegaEvoY,
                canTerastallize:!!a.canTerastallize,canDynamax:!!a.canDynamax
              }):null):null,
              foe:{species:typeof explicitPublicFoe?.species==='string'?explicitPublicFoe.species:null},
              forceSwitch:Array.isArray(ownRequest.forceSwitch)?ownRequest.forceSwitch.map(Boolean):null,
              maxChosenTeamSize:Number.isInteger(ownRequest.maxChosenTeamSize)?ownRequest.maxChosenTeamSize:null};
            if (o.own.length>6) throw new UnsupportedState('TEAM_OVER_SIX');
            return o;
          }
          function teamPreview(obs,selectionScores){
            if(obs.phase!=='preview'||obs.maxChosenTeamSize!==3||obs.own.length!==6)
              throw new UnsupportedState('NON_6V3_PREVIEW');
            if(!Array.isArray(selectionScores)||selectionScores.length!==6||!selectionScores.every(Number.isFinite))
              throw new UnsupportedState('INVALID_SELECTION_SCORES');
            const ranking=[0,1,2,3,4,5].sort((a,b)=>selectionScores[b]-selectionScores[a]||a-b);
            const indices=ranking.slice(0,3);
            return {command:'team '+indices.map(i=>i+1).join(''),indices,source:'external_score_provider'};
          }
          function legalCandidates(obs,selectionScores){
            if(obs.phase==='wait') return [{command:'',kind:'wait'}];
            if(obs.phase==='preview') return [{...teamPreview(obs,selectionScores),kind:'preview'}];
            if(!Array.isArray(obs.own)||obs.own.length===0)throw new UnsupportedState('NO_ROSTER');
            if(obs.phase==='switch'){
              if(obs.forceSwitch?.length!==1 || !obs.forceSwitch[0]) throw new UnsupportedState('ASYMMETRIC_SWITCH_WAIT');
              const revivalActors=obs.own.filter(m=>m.reviving);
              if(revivalActors.length>1 || (revivalActors.length===1 && !revivalActors[0].active))
                throw new UnsupportedState('AMBIGUOUS_REVIVAL_REQUEST');
              const reviving=revivalActors.length===1;
              const output=obs.own.map((m,i)=>(reviving ? isFainted(m) : (!m.active && !isFainted(m)))?
                {command:`switch ${i+1}`,kind:reviving?'revival_target':'switch',index:i}:null).filter(Boolean);
              if(output.length===0)throw new UnsupportedState('NO_SWITCH_TARGET');
              return output;
            }
            if(obs.phase!=='move')throw new UnsupportedState('UNKNOWN_PHASE');
            if(!Array.isArray(obs.active)||obs.active.length!==1||!obs.active[0])throw new UnsupportedState('NOT_SINGLE_ACTIVE');
            const a=obs.active[0];
            const output=[];
            a.moves.forEach((m,i)=>{
              if(m.disabled || m.pp!==null && m.pp<=0)return;
              output.push({command:`move ${i+1}`,kind:'move',index:i});
              if(a.canMegaEvo)output.push({command:`move ${i+1} mega`,kind:'mega_move',index:i});
              if(a.canMegaEvoX)output.push({command:`move ${i+1} megax`,kind:'mega_x_move',index:i});
              if(a.canMegaEvoY)output.push({command:`move ${i+1} megay`,kind:'mega_y_move',index:i});
            });
            if(!a.trapped&&!a.maybeTrapped){
              obs.own.forEach((m,i)=>{if(!m.active&&!isFainted(m))output.push({command:`switch ${i+1}`,kind:'switch',index:i});});
            }
            if(output.length===0)throw new UnsupportedState('NO_SAFE_ACTION_OR_STRUGGLE');
            return output;
          }
          function selectDecision(obs,candidates,dex){
            if(!Array.isArray(candidates)||!candidates.length)throw new UnsupportedState('EMPTY_CANDIDATES');
            if(obs.phase!=='move')return {command:candidates[0].command,kind:candidates[0].kind,policy:'baseline_v1'};
            const foe=obs.foe.species?dex?.species?.get(obs.foe.species):null;
            const rated=candidates.map((c,seq)=>{
              if(!['move','mega_move','mega_x_move','mega_y_move'].includes(c.kind))return {...c,score:-1e6,seq};
              const moveId=obs.active[0].moves[c.index]?.id;
              const m=dex?.moves?.get(moveId);
              if(!m?.exists) return {...c,score:-1000,seq};
              const typeEffect=foe?.exists?dex.getEffectiveness(m,foe):0;
              const scale=Math.pow(2,typeEffect);
              const damageProxy=(m.basePower||0)*scale+(m.priority||0)*5;
              return {...c,score:damageProxy+(c.kind==='mega_move'?0.5:0),seq};
            });
            rated.sort((a,b)=>b.score-a.score||a.seq-b.seq);
            return {command:rated[0].command,kind:rated[0].kind,policy:'baseline_v1',score:rated[0].score};
          }
          function decision(ownRequest,publicFoe,selectionScores,dex){
            const obs=observe(ownRequest,publicFoe),candidateList=legalCandidates(obs,selectionScores);
            const selected=selectDecision(obs,candidateList,dex);
            if(!candidateList.some(c=>c.command===selected.command))throw new UnsupportedState('ILLEGAL_POLICY_ACTION');
            return {v:VERSION,observation:obs,legal:candidateList.map(c=>c.command),choice:selected.command,
              policy:selected.policy,scope:'conservative_showdown_request',
              observationHash:crypto.createHash('sha256').update(JSON.stringify(obs)).digest('hex')};
          }
          /** Explicit two-side battle stepping. `publicFoe` is injected by caller, never taken from foe set. */
          function step(battle,teamScores,publicFoeProvider){
            if(battle.ended) return {ended:true};
            if(!Array.isArray(teamScores)||teamScores.length!==2||typeof publicFoeProvider!=='function')
              throw new UnsupportedState('BAD_STEP_INPUT');
            const before=battle.turn,phase=battle.requestState;
            const decisions=battle.sides.map((side,i)=>decision(side.activeRequest,
              publicFoeProvider(i),teamScores[i],battle.dex));
            battle.makeChoices(...decisions.map(d=>d.choice));
            return {v:VERSION,phase,before,after:battle.turn,choices:decisions.map(d=>d.choice),
              observationHashes:decisions.map(d=>d.observationHash),ended:battle.ended};
          }
          module.exports={VERSION,UnsupportedState,observe,isFainted,teamPreview,legalCandidates,selectDecision,decision,step};
          R27_265_SOURCE_0_EOF
          cat > private_policy_bridge.cjs <<'R27_265_SOURCE_1_EOF'
          'use strict';
          /* R27.261 optional PRIVATE policy adapter. NO private source in this public module.
           * Adapts a private policy to R27.259/260 request-based simulator contract.
           * It does not claim compatibility with unavailable private v0.76 runtime.
           */
          const crypto = require('node:crypto');
          const { VERSION: CORE_VERSION, UnsupportedState, observe, legalCandidates, selectDecision } = require('./battle_api.cjs');
          const BRIDGE_VERSION = 'r27.261.policy-bridge.v1';
          const HASH = v => crypto.createHash('sha256').update(JSON.stringify(v)).digest('hex');
          function cloneFreeze(value) {
            if (value === undefined) throw new UnsupportedState('UNDEFINED_POLICY_INPUT');
            const copy = JSON.parse(JSON.stringify(value));
            function freeze(o) {
              if (o && typeof o === 'object') {
                Object.values(o).forEach(freeze);
                Object.freeze(o);
              }
              return o;
            }
            return freeze(copy);
          }
          function ensurePlugin(plugin) {
            if (plugin === undefined || plugin === null) return null;
            if (typeof plugin !== 'object' || typeof plugin.decide !== 'function') throw new UnsupportedState('POLICY_INTERFACE_MISSING');
            return plugin;
          }
          function resolveScores(plugin,obs,explicitScores) {
            if (obs.phase !== 'preview') return explicitScores;
            if (explicitScores !== undefined && explicitScores !== null) return explicitScores;
            if (typeof plugin?.scorePreview !== 'function') throw new UnsupportedState('PREVIEW_POLICY_UNAVAILABLE');
            let scores;
            try { scores = plugin.scorePreview(cloneFreeze(obs)); } catch(e) {throw new UnsupportedState('PREVIEW_POLICY_ERROR',String(e?.message||e));}
            if (scores && typeof scores.then === 'function') throw new UnsupportedState('ASYNC_PREVIEW_NOT_SUPPORTED');
            return scores;
          }
          /**
           * Only the own side request + explicitly declared PUBLIC foe species may enter.
           * Plugin sees serializable frozen {observation, legalActions, context}; neither
           * dex nor battle nor opponent hidden team reaches the plugin.
           * Invalid plugin decisions fail closed; never silently substitute a baseline.
           */
          function propose({ownRequest,publicFoe={},selectionScores=null,dex=null,plugin=null,context=null}) {
            plugin = ensurePlugin(plugin);
            const obs = observe(ownRequest, publicFoe);
            if (obs.v !== CORE_VERSION) throw new UnsupportedState('CORE_VERSION_MISMATCH');
            const scores = resolveScores(plugin,obs,selectionScores);
            const candidates = legalCandidates(obs,scores);
            const legal=candidates.map(c=>c.command);
            if (new Set(legal).size!==legal.length)throw new UnsupportedState('DUPLICATE_LEGAL_CANDIDATES');
            let choice,policy;
            if (plugin) {
              const safeContext={traceId:typeof context?.traceId==='string'?context.traceId:null};
              // Explicitly no candidates' policy score, battle source, dex, or metadata.
              let response;
              try {response=plugin.decide(cloneFreeze(obs),cloneFreeze(legal),cloneFreeze(safeContext));}
              catch(e){throw new UnsupportedState('POLICY_RUNTIME_ERROR',String(e?.message||e));}
              if(response && typeof response.then==='function') throw new UnsupportedState('ASYNC_POLICY_NOT_SUPPORTED');
              choice=typeof response==='string'?response:response?.command;
              policy=typeof plugin.id==='string' && plugin.id.trim()?plugin.id:'external_private_policy';
            } else {
              const decision=selectDecision(obs,candidates,dex);
              choice=decision.command;
              policy=decision.policy;
            }
            if(typeof choice!=='string'||!legal.includes(choice)) throw new UnsupportedState('POLICY_ILLEGAL_ACTION');
            return Object.freeze({bridgeVersion:BRIDGE_VERSION,coreVersion:CORE_VERSION,phase:obs.phase,
              choice,legal:Object.freeze([...legal]),policy,observationHash:HASH(obs),
              // Not a private engine's result or live Champions legal-action oracle.
              scope:'pinned_showdown_adapter'});
          }
          /** Public wrapper to feed private policy an explicit own-side request. */
          function makeController({plugin=null,selectionScores=null,dex=null}={}) {
            ensurePlugin(plugin);
            return Object.freeze({
              decide(ownRequest,publicFoe={},context=null) {
                return propose({ownRequest,publicFoe,selectionScores,dex,plugin,context});
              },
            });
          }
          /** Minimal handoff: caller must supply explicit public observations for each side.
           * The policy doesn't receive battle access; caller owns the engine.
           */
          function stepWithControllers(battle,{p1,p2},publicFoeBySide) {
            if (!battle||!Array.isArray(battle.sides)||battle.sides.length!==2||typeof battle.makeChoices!=='function')
              throw new UnsupportedState('BAD_BATTLE_ADAPTER');
            if(typeof publicFoeBySide!=='function') throw new UnsupportedState('NO_PUBLIC_FOE_PROVIDER');
            if (battle.ended) return {ended:true};
            if(!p1||!p2||typeof p1.decide!=='function'||typeof p2.decide!=='function')
              throw new UnsupportedState('CONTROLLER_INTERFACE_MISSING');
            const d1=p1.decide(battle.sides[0].activeRequest,publicFoeBySide(0));
            const d2=p2.decide(battle.sides[1].activeRequest,publicFoeBySide(1));
            // Commit only after BOTH decisions are checked. If either policy fails, no mutation.
            const before=battle.turn;
            battle.makeChoices(d1.choice,d2.choice);
            return {bridgeVersion:BRIDGE_VERSION,before,after:battle.turn,
              phase:d1.phase,choices:[d1.choice,d2.choice],observationHashes:[d1.observationHash,d2.observationHash],
              ended:!!battle.ended};
          }
          module.exports={BRIDGE_VERSION,propose,makeController,stepWithControllers};
          R27_265_SOURCE_1_EOF
          cat > public_protocol_projection.cjs <<'R27_265_SOURCE_2_EOF'
          'use strict';
          /**
           * R27.263 / PUBLIC_PROTOCOL_PROJECTION: obtain opponent visible species from
           * an explicit player-facing *public* event stream; never inspect opposing side,
           * team, ability, item, RNG, or engine internal battle state.
           *
           * WARNING: Caller must supply a genuine player-facing stream. Passing an
           * engine's internal log does not prove provenance. This module fails closed
           * on known private/side-update markers and never forwards raw lines to policy.
           */
          const crypto = require('node:crypto');
          const {UnsupportedState} = require('./battle_api.cjs');
          const VERSION = 'r27.263.public-protocol.v1';
          const sha256 = x => crypto.createHash('sha256').update(JSON.stringify(x)).digest('hex');
          const BLOCKED = new Set(['split', 'request', 'sideupdate', 'error', 'raw', 'html', 'uhtml', 'uhtmlchange', 'debug']);
          const APPEAR = new Set(['switch', 'drag', 'replace', 'detailschange', 'poke']);
          const CHANGE = new Set(['-formechange']);
          const faintType = 'faint';
          const SPECIES = /^[a-zA-Z0-9 .:'’%♀♂\-]{1,80}$/;
          
          function validSide(id) {
            if(id!=='p1' && id!=='p2') throw new UnsupportedState('INVALID_VIEWER_SIDE');
            return id;
          }
          function extractActor(token) {
            const m = /^(p[12])a: (.+)$/.exec(token || '');
            if (!m) return null;
            return {side:m[1],nickname:m[2]};
          }
          function speciesFromDetails(details) {
            const value=String(details||'').split(',')[0].trim();
            if(!SPECIES.test(value)) throw new UnsupportedState('MALFORMED_PUBLIC_SPECIES');
            return value;
          }
          function interpret(lines, viewer) {
            validSide(viewer);
            if (!Array.isArray(lines) || lines.length>100000 || lines.some(x=>typeof x!=='string'||x.length>8192)) {
              throw new UnsupportedState('INVALID_PUBLIC_STREAM');
            }
            const foeId=viewer==='p1'?'p2':'p1';
            let species=null, revealed=false, fainted=false, changeCount=0;
            for(const line of lines) {
              if(!line.startsWith('|')) throw new UnsupportedState('NON_PROTOCOL_PUBLIC_EVENT');
              if(line.includes('\n')||line.includes('\r')) throw new UnsupportedState('MULTILINE_PUBLIC_EVENT');
              const fields=line.split('|');
              const type=fields[1];
              if(BLOCKED.has(type)) throw new UnsupportedState('PRIVATE_OR_UNTRUSTED_PROTOCOL_EVENT');
              if(!APPEAR.has(type) && !CHANGE.has(type) && type!==faintType) continue;
              // Team preview |poke|p1|species is public, but is not evidence of ACTIVE species.
              if(type==='poke') continue;
              const actor=extractActor(fields[2]);
              if(!actor || actor.side!==foeId) continue;
              if(type===faintType) {species=null;fainted=true;changeCount++;continue;}
              // Pokemon species comes from a public switch/forme field, never nickname.
              const details=fields[3];
              if(!details)throw new UnsupportedState('MISSING_PUBLIC_SPECIES');
              species=speciesFromDetails(details);
              revealed=true;fainted=false;changeCount++;
            }
            return Object.freeze({projectionVersion:VERSION,species,foeId,
              // Boolean values only: no raw event texts or unknown opponent attributes.
              revealed,fainted,changeCount});
          }
          function publicProjection({viewer,events,source}) {
            if(source!=='PUBLIC_CLIENT_PROTOCOL')throw new UnsupportedState('UNVERIFIED_PROTOCOL_SOURCE');
            const r=interpret(events,viewer);
            return Object.freeze({species:r.species});
          }
          function publicObservationDigest({viewer,events,source}) {
            const foe=publicProjection({viewer,events,source});
            return sha256({viewer,foe});
          }
          function publicFoeBySideFromStreams(streams) {
            if(!streams || typeof streams!=='object') throw new UnsupportedState('MISSING_PUBLIC_STREAMS');
            // Explicit independent inputs for each perspective, no fallthrough to engine state.
            const result=Object.freeze([
              publicProjection({viewer:'p1',...streams.p1}),
              publicProjection({viewer:'p2',...streams.p2}),
            ]);
            return index => {
              if(index!==0&&index!==1)throw new UnsupportedState('INVALID_PLAYER_INDEX');
              return result[index];
            };
          }
          module.exports={VERSION,publicProjection,publicObservationDigest,publicFoeBySideFromStreams,interpret};
          R27_265_SOURCE_2_EOF
          cat > private_runtime_intake.cjs <<'R27_265_SOURCE_3_EOF'
          'use strict';
          /**
           * R27.265 — hash-pinned, explicit-trust ingestion of a candidate CJS policy.
           * No private code is included in this module.  A matching caller-provided hash
           * proves byte identity only; it does NOT prove source provenance or quality.
           * Do not call activate() on untrusted files: CommonJS requires arbitrary code.
           */
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const Module = require('node:module');
          const {UnsupportedState} = require('./battle_api.cjs');
          const {makeController} = require('./private_policy_bridge.cjs');
          const VERSION = 'r27.265.runtime-intake.v1';
          const MAX_SOURCE_BYTES = 25 * 1024 * 1024;
          const SHA_PATTERN = /^[a-f0-9]{64}$/;
          const SOURCE_KINDS = new Set(['fixture', 'external_candidate']);
          const requireFail = (reason) => { throw new UnsupportedState(reason); };
          const sha256 = value => crypto.createHash('sha256').update(value).digest('hex');
          function assertDeclaredManifest(manifest) {
            if (!manifest || typeof manifest !== 'object' || Array.isArray(manifest)) requireFail('MISSING_SOURCE_MANIFEST');
            if (manifest.schema !== 'TRUE_PLAN_RUNTIME_INTAKE_V1') requireFail('INVALID_MANIFEST_SCHEMA');
            if (!SOURCE_KINDS.has(manifest.source_kind)) requireFail('UNCLASSIFIED_RUNTIME_SOURCE');
            if (typeof manifest.sha256 !== 'string' || !SHA_PATTERN.test(manifest.sha256)) requireFail('EXPECTED_SHA_REQUIRED');
            if (typeof manifest.source_file !== 'string' || !/^[a-zA-Z0-9_.-]+\.cjs$/.test(manifest.source_file)) requireFail('INVALID_SOURCE_BASENAME');
            if (!Number.isInteger(manifest.size_bytes) || manifest.size_bytes<1 || manifest.size_bytes>MAX_SOURCE_BYTES)
              requireFail('INVALID_SOURCE_SIZE');
            if (typeof manifest.decide_export !== 'string' || !/^[a-zA-Z_$][\w$]{0,63}$/.test(manifest.decide_export))
              requireFail('INVALID_POLICY_EXPORT_NAME');
            if (manifest.preview_export !== null && manifest.preview_export !== undefined &&
                (typeof manifest.preview_export !== 'string' || !/^[a-zA-Z_$][\w$]{0,63}$/.test(manifest.preview_export)))
              requireFail('INVALID_PREVIEW_EXPORT_NAME');
          }
          function inspect({privateRoot,manifest}) {
            assertDeclaredManifest(manifest);
            if (typeof privateRoot !== 'string' || !path.isAbsolute(privateRoot)) requireFail('ABSOLUTE_PRIVATE_ROOT_REQUIRED');
            let rootStat, fileStat, realRoot, realFile, contents;
            try {
              rootStat=fs.lstatSync(privateRoot);
              if (!rootStat.isDirectory() || rootStat.isSymbolicLink()) requireFail('UNSAFE_PRIVATE_ROOT');
              realRoot=fs.realpathSync(privateRoot);
              const filename=path.join(privateRoot,manifest.source_file);
              fileStat=fs.lstatSync(filename);
              if (!fileStat.isFile() || fileStat.isSymbolicLink()) requireFail('UNSAFE_POLICY_FILE');
              realFile=fs.realpathSync(filename);
              if (path.dirname(realFile)!==realRoot) requireFail('SOURCE_OUTSIDE_PRIVATE_ROOT');
              if (fileStat.size !== manifest.size_bytes || fileStat.size > MAX_SOURCE_BYTES) requireFail('SOURCE_SIZE_MISMATCH');
              contents=fs.readFileSync(filename);
            } catch(e) {
              if(e instanceof UnsupportedState) throw e;
              if(e?.code==='ENOENT' || e?.code==='ENOTDIR') requireFail('PRIVATE_RUNTIME_NOT_FOUND');
              throw new UnsupportedState('RUNTIME_FILE_IO_FAILURE',String(e?.code||e?.message||e));
            }
            const actual=sha256(contents);
            if(actual !== manifest.sha256) requireFail('SOURCE_SHA_MISMATCH');
            return Object.freeze({intakeVersion:VERSION,sourceKind:manifest.source_kind,sha256:actual,
              sizeBytes:contents.byteLength,sourceFile:manifest.source_file,realFile,
              status:'PINNED_BYTES_ONLY_NOT_EXECUTED',
              privateRuntimeCertified:false,
              explanation:'Caller supplied hash verifies byte identity; original provenance not independently verified.'});
          }
          /** Explicit execution of trusted CommonJS source only after preflight. */
          function activate({privateRoot,manifest,trustedCodeExecution=false}) {
            const provenance=inspect({privateRoot,manifest});
            if (trustedCodeExecution !== true) requireFail('EXPLICIT_TRUST_TO_EXECUTE_REQUIRED');
            let moduleExports;
            try {
              // Compile EXACTLY the bytes rehashed at this boundary. Never verify a path
              // then require potentially changed bytes from that path (TOCTOU).
              const pinnedBytes=fs.readFileSync(provenance.realFile);
              if(pinnedBytes.length!==provenance.sizeBytes || sha256(pinnedBytes)!==provenance.sha256)
                requireFail('SOURCE_CHANGED_BEFORE_EXECUTION');
              const loaded=new Module(provenance.realFile,module);
              loaded.filename=provenance.realFile;
              loaded.paths=Module._nodeModulePaths(path.dirname(provenance.realFile));
              loaded._compile(pinnedBytes.toString('utf8'),provenance.realFile);
              moduleExports=loaded.exports;
            } catch(e) {
              if(e instanceof UnsupportedState) throw e;
              throw new UnsupportedState('CANDIDATE_MODULE_LOAD_FAILED',String(e?.message||e));
            }
            if(!moduleExports || !Object.prototype.hasOwnProperty.call(moduleExports,manifest.decide_export) ||
               typeof moduleExports[manifest.decide_export]!=='function') requireFail('CANDIDATE_POLICY_EXPORT_MISSING');
            if(manifest.preview_export && (!Object.prototype.hasOwnProperty.call(moduleExports,manifest.preview_export) ||
               typeof moduleExports[manifest.preview_export]!=='function')) requireFail('CANDIDATE_PREVIEW_EXPORT_MISSING');
            const plugin={id:`r27.265.${provenance.sourceKind}.${provenance.sha256.slice(0,12)}`,
              decide:(observation,legal,context)=>moduleExports[manifest.decide_export](observation,legal,context)};
