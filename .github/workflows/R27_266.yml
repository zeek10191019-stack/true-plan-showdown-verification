          'use strict';
          /**
           * R27.266: deterministic, bounded heuristic policy for PUBLIC Showdown requests.
           * Source of types, base stats, moves and interactions must be PUBLIC dex metadata.
           * No access to battle/opponent sets or previous future RNG. NOT strength certified.
           * Preview uses full 20-combination 6->3 optimization, NOT an old six.
