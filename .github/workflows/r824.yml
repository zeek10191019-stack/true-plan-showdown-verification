name: R824 D84 Trace Real OCR Field Owner Turn Evidence Wiring NO IPA
'on':
  push:
    branches:
      - main
    paths:
      - .github/workflows/r824.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: r824-d84-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  trace:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - name: Checkout pinned R823 source reconstruction recipe
        uses: actions/checkout@v4
        with:
          ref: 4cc925234f9101a8875744e75049f06e96ce4d90
          fetch-depth: 1
          persist-credentials: false
          path: pinned-r823
          sparse-checkout: .github/workflows/r823.yml
          sparse-checkout-cone-mode: false
      - name: Checkout pinned R821 source patch recipe
        uses: actions/checkout@v4
        with:
          ref: 641a9ee8701484fabaf9344db5a0eaab31c422c3
          fetch-depth: 1
          persist-credentials: false
          path: pinned-r821
          sparse-checkout: .github/workflows/r821.yml
          sparse-checkout-cone-mode: false
      - name: Checkout pinned R819 exact 69-step recipe
        uses: actions/checkout@v4
        with:
          ref: 46b607b88ddb5569fff0fc042dfdb5f0fb6e06f6
          fetch-depth: 1
          persist-credentials: false
          path: pinned-r819
          sparse-checkout: .github/workflows/r819.yml
          sparse-checkout-cone-mode: false
      - name: Checkout pinned R793 original bootstrap
        uses: actions/checkout@v4
        with:
          ref: 37b3e26851c71fcabd65da3299356c1e38c53869
          fetch-depth: 1
          persist-credentials: false
          path: pinned-r793
          sparse-checkout: |
            .github/workflows/d30.b64
            .github/workflows/r793.yml
          sparse-checkout-cone-mode: false
      - name: Reconstruct full source from pinned D83 recipe only
        shell: bash
        env:
          R823_LANE: real-apple-vision
        run: |
          set -euo pipefail
          ruby -ryaml -rjson -e 'recipe=YAML.load_file(ARGV.fetch(0)); puts JSON.generate(recipe.fetch("jobs").fetch("verify").fetch("steps"))' \
            pinned-r823/.github/workflows/r823.yml > r824_r823_steps.json
          python3 - <<'R824_BOOT_PY'
          from pathlib import Path
          import hashlib,json,os,subprocess,sys
          steps=json.loads(Path('r824_r823_steps.json').read_text())
          assert len(steps)==9,'R824_R823_STEP_COUNT_DRIFT'
          assert steps[3]['name'].startswith('Reconstruct R821 full pinned production source')
          assert steps[4]['name'].startswith('R823 repair ordering of two legacy QUICK tests')
          cwd=Path.cwd()
          for i in (3,4):
              s=steps[i]
              workdir=cwd/s.get('working-directory','.')
              script=s['run']
              assert chr(36)+'{{' not in script,('UNEXPECTED_EXPRESSION',i)
              print('R824_EXACT_REPLAY',i,s['name'],flush=True)
              with (cwd/f'R824_replay_step_{i}.log').open('wb') as out:
                  p=subprocess.run(['bash','--noprofile','--norc','-e','-o','pipefail','-c',script],cwd=workdir,env=os.environ.copy(),stdout=out,stderr=subprocess.STDOUT,timeout=1800)
              tail=(cwd/f'R824_replay_step_{i}.log').read_text(errors='replace')[-4500:]
              print(tail,flush=True)
              if p.returncode:sys.exit(p.returncode)
          root=cwd/'pinned-r793/source'
          m=json.loads((root/'source_manifest.json').read_text())
          excluded={'.build','__pycache__','.swiftpm'}
          fs={str(p.relative_to(root)):p for p in root.rglob('*') if p.is_file() and not excluded.intersection(p.parts)}
          sha=lambda x:hashlib.sha256(x).hexdigest()
          assert len(fs)==596 and set(fs)==set(m)|{'source_manifest.json'},'R824_SOURCE_INVENTORY_DRIFT'
          assert all(sha(fs[n].read_bytes())==h for n,h in m.items()),'R824_MANIFEST_HASH_DRIFT'
          t=sha(''.join(n+'\t'+sha(fs[n].read_bytes())+'\n' for n in sorted(fs)).encode())
          expected=(cwd/'pinned-r793/R823Proof/SOURCE_TREE_SHA256.txt').read_text().strip()
          assert t==expected,'R824_R823_TREE_SHA_MISMATCH'
          print('R824_SHA_VERIFIED_SOURCE_RESTORED',len(fs),t,flush=True)
          R824_BOOT_PY
      - name: Audit OCR to 79-field owner turn evidence interfaces without assumptions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'R824_TRACE_PY'
          from pathlib import Path
          import re,json,hashlib
          root=Path('pinned-r793/source')
          out=Path('R824Proof');out.mkdir(exist_ok=True)
          manifest=json.loads((root/'source_manifest.json').read_text())
          sha=lambda b:hashlib.sha256(b).hexdigest()
          ignored={'.build','__pycache__','.swiftpm'}
          disk={str(p.relative_to(root)):p for p in root.rglob('*') if p.is_file() and not ignored.intersection(p.parts)}
          assert len(disk)==596 and set(disk)==set(manifest)|{'source_manifest.json'}
          assert all(sha(disk[n].read_bytes())==h for n,h in manifest.items())
          tree=sha(''.join(n+'\t'+sha(disk[n].read_bytes())+'\n' for n in sorted(disk)).encode())
          assert tree==Path('pinned-r793/R823Proof/SOURCE_TREE_SHA256.txt').read_text().strip()
          keys={
            'field_contract':r'79[_ -]?FIELDS|79\s*(?:fields|items)|field(?:Id|ID|_id|Name|Key|Value|Status)',
            'owner_side':r'owner|opponent|playerSide|opponentSide|selfSide|battleSide|subjectSide|自分|相手',
            'turn_identity':r'turn(?:Id|ID|Index|Number|Count|_id|_index)|ターン',
            'frame_identity':r'frame(?:Id|ID|Index|Number|_id)|sourceFrame|capturedFrame',
            'evidence_lineage':r'evidence|provenance|lineage|imageSha|imageSHA|image_sha|sourceSha|source_sha|origin',
            'vision_ocr':r'AppleVision|VNRecognize|Vision|OCR|recogniz(?:e|ed|er|ing)',
            'mega_form':r'Mega|mega|メガ|forme|formId|form_id',
            'record_archive':r'Recording|Archive|Journal|Export|Bundle|OneButton|保存|録画'
          }
          rx={k:re.compile(v,re.IGNORECASE) for k,v in keys.items()}
          rows=[]
          for path,p in sorted(disk.items()):
              if p.suffix.lower() not in {'.swift','.py','.json','.md','.txt'} or path=='source_manifest.json':continue
              try:s=p.read_text('utf-8')
              except UnicodeDecodeError:continue
              counts={k:len(r.findall(s)) for k,r in rx.items()}
              if not any(counts.values()):continue
              lines=s.splitlines()
              anchors=[]
              for i,line in enumerate(lines,1):
                  found=[k for k,r in rx.items() if r.search(line)]
                  if found and len(anchors)<25:
                      anchors.append({'line':i,'categories':found,'sample':line.strip()[:200]})
              rows.append({'path':path,'sha256':sha(p.read_bytes()),'size_bytes':p.stat().st_size,
                           'categories':counts,'anchors':anchors})
          rows.sort(key=lambda x:(-sum(bool(x['categories'][k]) for k in ('field_contract','owner_side','turn_identity','frame_identity','evidence_lineage','vision_ocr')),-sum(x['categories'].values()),x['path']))
          field_files=[r['path'] for r in rows if r['categories']['field_contract']]
          complete_candidates=[r['path'] for r in rows if all(r['categories'][k] for k in ('field_contract','owner_side','turn_identity','frame_identity','evidence_lineage'))]
          catalog_files=[n for n in disk if re.search(r'(79|field|schema|contract)',Path(n).stem,re.I) and Path(n).suffix.lower() in {'.json','.swift','.py'}]
          report={
            'revision':'R824','base_revision':'R823','source_files_verified':596,'source_tree_sha256':tree,
            'source_files_modified':0,'ipa_created':False,
            'static_token_presence_not_runtime_proof':True,
            'live_device_79_fields_certified':0,
            'actual_battle_video_original_MOV_replay_certified':False,
            'mega_81_forms_device_image_certified':False,
            'owner_turn_field_evidence_runtime_join_certified':False,
            'field_contract_file_candidates':sorted(catalog_files),
            'field_relevant_files':field_files,
            'static_full_join_candidate_paths':complete_candidates,
            'source_wiring_scan':rows
          }
          (out/'R824_79_FIELD_TRACE_INVENTORY.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n')
          summary={k:v for k,v in report.items() if k!='source_wiring_scan'}
          (out/'R824_GATE_SUMMARY.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False)+'\n')
          md=['# R824 verification notes','',
              '596 files verified against the full source manifest and R823 SHA-256 tree.',
              'This is a static source routing audit, not device recognition or turn-identity certification.','',
              f'Field contract candidate files: {len(catalog_files)}',
              f'Static full-join candidate files: {len(complete_candidates)}',
              '','## Highest-priority source files to inspect before the next runtime patch']
          for row in rows[:35]:
              md.append('- `'+row['path']+'` — '+', '.join(k for k,v in row['categories'].items() if v))
          md.extend(['','## Required next gates','',
                     '- Prove actual QUICK/DETAIL result enters one typed field state, with evidence identity.',
                     '- Prove player/opponent, turn, frame, recording, and form IDs do not cross.',
                     '- Prove invalid, stale and missing OCR are unknown, not certified observations.',
                     '- Verify each of 79 named fields with original game video and live iPhone capture.',
                     '- Do not treat this static report as a field certification or an IPA release.',''])
          (out/'R824_NEXT_IMPLEMENTATION_TARGETS.md').write_text('\n'.join(md))
          print('R824_SOURCE_SHA_PASS',tree)
          print('R824_FIELD_CONTRACT_CANDIDATE_COUNT',len(catalog_files))
          print('R824_STATIC_FULL_JOIN_CANDIDATE_COUNT',len(complete_candidates))
          for row in rows[:20]:print('R824_PRIORITY_PATH',row['path'],row['categories'])
          print('R824_STATIC_ONLY_DEVICE_FIELD_CERTIFIED_0_NO_IPA')
          R824_TRACE_PY
      - name: Upload source trace evidence NO IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R824-79-Field-Owner-Turn-Lineage-Audit-NO-IPA
          path: |
            R824Proof/
            R824_replay_step_3.log
            R824_replay_step_4.log
          if-no-files-found: warn
          retention-days: 7
      - name: Fail closed on incomplete integrity or missing summary
        shell: bash
        run: |
          set -euo pipefail
          test -s R824Proof/R824_79_FIELD_TRACE_INVENTORY.json
          test -s R824Proof/R824_GATE_SUMMARY.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('R824Proof/R824_GATE_SUMMARY.json').read_text())
          assert r['source_files_verified']==596
          assert r['source_files_modified']==0
          assert r['live_device_79_fields_certified']==0
          assert not r['ipa_created']
          print('R824_D84_SOURCE_ROUTING_AUDIT_SUCCESS_79_DEVICE_CERTIFIED_ZERO_NO_IPA')
          PY
