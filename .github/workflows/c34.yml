name: R1034 C34 pinned integrated regression (NO IPA)
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/c34.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  verify:
    name: ${{ matrix.job }}
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
        - job: macos-source
          os: xcode-27
          shell: python3 {0}
        - job: windows-cli
          os: windows-2025
          shell: python {0}
        - job: windows-receiver
          os: windows-2025
          shell: python {0}
        - job: macos-sender
          os: xcode-27
          shell: python3 {0}
        - job: windows-hud
          os: windows-latest
          shell: python {0}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
    - name: Run every pinned C32 step with C33 receiver and C34 product OCR patch
      shell: ${{ matrix.shell }}
      env:
        C33_JOB: ${{ matrix.job }}
        GH_TOKEN: ${{ github.token }}
        PYTHONUTF8: '1'
      run: |
        import os,sys,subprocess,pathlib,hashlib,json,zlib,base64
        root=pathlib.Path(os.environ['RUNNER_TEMP']);repo=root/'c33-pinned';repo.mkdir()
        assert os.environ['GITHUB_REPOSITORY']=='zeek10191019-stack/true-plan-showdown-verification'
        pin='355d47c980992f4273f62f84ef4b570e55539080'
        subprocess.run(['git','init','-q',str(repo)],check=True)
        subprocess.run(['git','-C',str(repo),'fetch','--no-tags','--filter=blob:none','--depth=1','https://github.com/'+os.environ['GITHUB_REPOSITORY']+'.git',pin],check=True)
        assert subprocess.check_output(['git','-C',str(repo),'rev-parse','FETCH_HEAD'],text=True).strip()==pin
        raw=subprocess.check_output(['git','-C',str(repo),'show',pin+':.github/workflows/c32.yml'])
        h=lambda b:hashlib.sha256(b).hexdigest()
        assert h(raw)=='5d230d671c866da315f85ab6d01578b509e63aeda04beecd01a8ad6d295eae58'
        def parse_steps(raw,job):
            lines=raw.decode('utf-8').splitlines()
            start=lines.index('  '+job+':')+1
            end=next((i for i in range(start,len(lines)) if lines[i].startswith('  ') and not lines[i].startswith('   ') and lines[i].endswith(':')),len(lines))
            rows=[];i=start
            while i<end:
                if not lines[i].startswith('    - name: '): i+=1;continue
                name=lines[i][12:];i+=1
                assert lines[i].startswith('      shell: ');shell=lines[i][13:];i+=1
                env={}
                if lines[i]=='      env:':
                    i+=1
                    while lines[i].startswith('        '):
                        k,v=lines[i].strip().split(': ',1);env[k]=v;i+=1
                mode=lines[i];assert mode in ('      run: |','      run: |-'),mode;i+=1
                body=[]
                while i<end and (not lines[i] or lines[i].startswith('        ')):
                    body.append(lines[i][8:] if lines[i] else '');i+=1
                run='\n'.join(body)+('\n' if mode.endswith('|') else '')
                rows.append((name,shell,env,run))
            return rows
        expected={'macos-source': ['60ccf1ba95908cbc442009b0bcac9c53cee16baf212970f2ee631d4689a012ca', '52042ea1ee5309375119ff3b04e01e7477f07cc33d7024e19650caf331523d7f', '453e98db60edb7982c641a5c1555d9da3f3f405e566edea64c2bdd793352462c', '0fe3c18a1a6357fa8b673074ba9237feaa72659fba598c301d485a61249210b5', 'de1816e7ec3a582e609a2b15f63cf0967768ebfdc79c0ef9fa5997ea37cb82c9', 'd6d33f1706273d92fd75cbfcc29c6805321ddf49aaef1362dbd2e2a18aefa692', '0808b22ee0bda48f47a48c1f177e2456e4d405f35923f24e969a38c0bf0484ed', '18cf95cbe1e55ec03a29eeaca851cee98dbcdfd3e65234e3bc4975f872f0696b', '43313bc4838750b3453530597896c75444eff23db725fb9d503ddd108327ef5f', '79534296b985e93c8f8222f4cbcb9f2c1083b16c0ae597ce1f07984aa6449495', 'e1eee13c6710b3f89ad6675336ac3421200ea43eb3f1fb5737a7eca826d09e9e', '7a5ed41f3eec645f54081e2f5ef07021da9dfe0f6b7efb00b58d22c4482368c8', '5bca257163369eec824377be11a82ea877eb4dcbfe06f6d5a36d390d33ffcfba', '578dcbb017ece49fe85963eaff4054607fcb1990af240fb5ba8158c313d59ec6', 'd580538e3117517c13ed5bb4174c8f6f942670b70292fef63e3589f2348242bc'], 'windows-cli': ['03f2464e04fa251b1d00879fe4d1d8d5a359ceb6fd9e3f906d2a07cefa675642', 'be6dce3b042c4799f7cc23c4a01725ec040d8f836a88d9e5eea043055db16e91'], 'windows-receiver': ['503e72be2b0b75c88d35bfc65cdd8ccb42b4189794f74e0b90ff30a23fa05a11'], 'macos-sender': ['4e0455511288649fb843d90db26369f0a4c51409941eb5abae61e71c2e5c0a87'], 'windows-hud': ['f5d7427beb774441db8eff5f5d0a7a81902953aea59365bde57ea2f2bbba0815']}
        job=os.environ['C33_JOB'];rows=parse_steps(raw,job)
        assert [h(r[3].encode()) for r in rows]==expected[job]
        patch=zlib.decompress(base64.b64decode(''));assert h(patch)=='d55fd7398d3402dadec31ea88bc24f99cd82918bab803e0fe96431cec182c703';(root/'c33-patch.py').write_bytes(patch)
        native_patch=zlib.decompress(base64.b64decode(''));assert h(native_patch)=='a160a93a790e1fa2113644c6a98effe39965dfc28d6a421566bb539ce3686f55';(root/'c34-native.py').write_bytes(native_patch)
        for i,(name,shell,extra,run) in enumerate(rows):
            print('C33_STEP',job,i,name,flush=True)
            run=run.replace('$'+'{{ github.event.repository.private }}','false')
            assert '$'+'{{' not in run
            env=os.environ.copy();env['PYTHONUTF8']='1';env['PYTHONIOENCODING']='utf-8:backslashreplace'
            for k,v in extra.items():
                env[k]=os.environ['GH_TOKEN'] if v=='$'+'{{ github.token }}' else v
            if 'GH_TOKEN' not in extra:env.pop('GH_TOKEN',None)
            if job in ('windows-receiver','macos-sender'):
                old=' print(r.stdout,r.stderr)';assert run.count(old)==1
                run=run.replace(old," print((r.stdout+r.stderr).encode('ascii','backslashreplace').decode('ascii'))")
                old=('python' if shell=='pwsh' else 'python3')+' -m unittest -v test_transfer_receiver test_recover_r714 test_resume_r714 test_finalize test_c32'
                assert run.count(old)==1
                cmd="& python (Join-Path $env:RUNNER_TEMP 'c33-patch.py')\nif ($LASTEXITCODE -ne 0) { throw 'C33_PATCH_FAILED' }\n" if shell=='pwsh' else 'python3 "$RUNNER_TEMP/c33-patch.py"\n'
                run=run.replace(old,cmd+old+' test_c33')
            if job=='macos-source' and i==13:
                assert name.startswith('C11 compile real unsigned iPhoneOS')
                run='set -Eeuo pipefail\npython3 "$RUNNER_TEMP/c34-native.py" "$RUNNER_TEMP/c6-objects/pinned-r793/source" "$RUNNER_TEMP"\n'+run
            f=root/('c33-step-'+str(i)+('.ps1' if shell=='pwsh' else '.sh'));f.write_text(run,encoding='utf-8',newline='\n')
            cmd=['pwsh','-NoLogo','-NoProfile','-NonInteractive','-Command',"$ErrorActionPreference='Stop'; & $args[0]; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }",str(f)] if shell=='pwsh' else ['bash','--noprofile','--norc','-e','-o','pipefail',str(f)]
            # The PowerShell child uses -File with the original script's own error policy.
            if shell=='pwsh':cmd=['pwsh','-NoLogo','-NoProfile','-NonInteractive','-File',str(f)]
            subprocess.run(cmd,env=env,cwd=os.environ['GITHUB_WORKSPACE'],check=True)
            print('C33_STEP_PASS',job,i,flush=True)
        print('C33_PINNED_JOB_PASS',job,flush=True)
  gate:
    needs:
    - verify
    if: always() && github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
    - name: 'Gate: every automated job must pass; no IPA or physical certification'
      shell: bash
      run: |
        set -Eeuo pipefail
        [[ '${{ needs.verify.result }}' == success ]]
        echo C34_AUTOMATED_GATE_PASS_UI_BACKGROUND_PHYSICAL_IPA_HOLD
