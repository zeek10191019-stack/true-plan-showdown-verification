name: R566 OCR Source Text-Role Strict Fence (No IPA)
"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/v566.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: xcode-27
            role: IOS27_BUILD
          - runner: macos-26-intel
            role: MACOS26_OCR
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      SCREEN_READ_R566_ROLE: ${{ matrix.role }}
    steps:
      - name: Replay pinned R565 and apply R566 source with SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY566'
          
          import base64,hashlib,json,lzma,urllib.request,re,textwrap,ast,subprocess,plistlib
          from pathlib import Path
          sha=lambda x:hashlib.sha256(x).hexdigest()
          url='https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/1daaf4227d879499dfb98fae6479a1e01e280f64/.github/workflows/v565.yml'
          raw=urllib.request.urlopen(url,timeout=60).read()
          assert len(raw)==25584 and sha(raw)=='8c8da263d8da068dbd7228ccb36b55277215dd0d1362eb62aa85cddb288eaa46','R566_PARENT_V565_PIN_CHANGED'
          text=raw.decode()
          m=re.search(r"python3 - <<'PY565'\n(.*?)\n\s+PY565",text,re.S)
          assert m,'R566_PINNED_PARENT_BUILDER_MISSING'
          parent=textwrap.dedent(m.group(1));ast.parse(parent)
          exec(compile(parent,'R565_PINNED_BUILDER','exec'))
