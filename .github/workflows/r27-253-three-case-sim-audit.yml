# R27.253: public-only, manual-trigger, free standard GitHub-hosted runner.
# Runs against pinned Showdown source, NOT real Champions production certification.
name: R27.253 M-C three-case source-simulator audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  three-case-audit:
    if: ${{ github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pinned public Pokemon Showdown
        uses: actions/checkout@v4
        with:
          repository: smogon/pokemon-showdown
          ref: aa17ca0fac8bc5605df673bd8774c2d0e91efa43
          fetch-depth: 1
          persist-credentials: false
          path: pokemon-showdown
      - name: Use pinned Node.js 22.18.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Verify immutable source and build
        working-directory: pokemon-showdown
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'aa17ca0fac8bc5605df673bd8774c2d0e91efa43'
          test "$(git rev-parse HEAD^{tree})" = '98c9038b81fa5ed7f1e9818736b701918920501e'
          test "$(node -v)" = 'v22.18.0'
          npm ci --no-audit --no-fund
          npm run build
          echo 'PASS PINNED_BUILD'
      - name: Run integration cases (source-model only)
        working-directory: pokemon-showdown
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          'use strict';
          // R27.253 - public-only reproducible source-model integration probes.
          // This is NOT live Pokemon Champions game certification.
          const assert = require('node:assert/strict');
          const {Battle, Dex} = require('./dist/sim');
          const PIN = 'aa17ca0fac8bc5605df673bd8774c2d0e91efa43';
          const FORMAT = '[Gen 9 Champions] BSS Reg M-C';
          const reports = [];
          const species = (name, moves, item = '', ability = '') => ({
            name,
            species: name,
            item,
            ability: ability || ({
              Gyarados: 'Intimidate', Pawmot: 'Volt Absorb', Basculegion: 'Adaptability',
              Annihilape: 'Vital Spirit', Magikarp: 'Swift Swim', Banette: 'Insomnia',
              Snorlax: 'Immunity', Pikachu: 'Static', Eevee: 'Run Away', Bulbasaur: 'Overgrow',
              Ivysaur: 'Overgrow', Venusaur: 'Overgrow', Caterpie: 'Shield Dust',
              Charizard: 'Blaze', Garchomp: 'Rough Skin', Wartortle: 'Torrent',
            })[name] || 'No Ability',
            nature: 'Hardy', level: 50, moves,
            evs: {hp: 0, atk: 0, def: 0, spa: 0, spd: 0, spe: 0},
          });
          const fillers = [
            species('Pikachu', ['thunderbolt']),
            species('Eevee', ['tackle']),
            species('Bulbasaur', ['tackle']),
          ];
          const enemyFillers = [
            species('Ivysaur', ['tackle']),
            species('Venusaur', ['tackle']),
            species('Caterpie', ['tackle']),
          ];
          function battleFor(p1, p2) {
            const f = Dex.formats.get(FORMAT);
            assert.equal(f.exists, true, 'pinned M-C format must exist');
            assert.equal(f.mod, 'champions');
            const b = new Battle({formatid: f.id, strictChoices: true, seed: [1, 2, 3, 4],
              p1: {name: 'R27-p1', team: [...p1, ...fillers]},
              p2: {name: 'R27-p2', team: [...p2, ...enemyFillers]},
            });
            assert.equal(b.requestState, 'teampreview', 'expected 6-to-3 team preview');
            b.makeChoices('team 123', 'team 123');
            assert.equal(b.requestState, 'move');
            assert.equal(b.gameType, 'singles');
            return b;
          }
          const pick = (b, player, name) => {
            const mon = b[player].pokemon.find(x => x.name === name);
            assert.ok(mon, `missing ${player}:${name}`);
            return mon;
          };
          const slot = mon => String(mon.position + 1);
          function turn(b, p1, p2) {
            assert.equal(b.requestState, 'move', `expected move before ${p1} / ${p2}`);
            b.makeChoices(p1, p2);
          }
          function afterDoubleFaint(b) {
            const gyara = pick(b, 'p1', 'Gyarados');
            const attacker = pick(b, 'p2', 'Annihilape');
            assert.ok(gyara.fainted && attacker.fainted, 'both Pokemon should faint after Final Gambit');
            assert.equal(b.p1.totalFainted, 1);
            assert.equal(b.requestState, 'switch');
            b.makeChoices(`switch ${slot(pick(b, 'p1', 'Pawmot'))}`,
              `switch ${slot(pick(b, 'p2', 'Magikarp'))}`);
            assert.equal(b.p1.active[0].name, 'Pawmot');
            assert.equal(b.p2.active[0].name, 'Magikarp');
            assert.equal(b.requestState, 'move');
            return gyara;
          }
          function reviveGyara(b) {
            const gyara = pick(b, 'p1', 'Gyarados');
            turn(b, 'move 1', 'move 1'); // Revival Blessing vs Splash
            assert.equal(b.requestState, 'switch', 'Revival Blessing should prompt a fainted selection');
            assert.equal(b.choose('p1', `switch ${slot(gyara)}`), true);
            assert.equal(gyara.fainted, false);
            assert.ok(gyara.hp > 0 && gyara.hp <= Math.ceil(gyara.maxhp / 2), 'revive to approximately 50% HP');
            assert.equal(b.p1.totalFainted, 1, 'historical faint count must not decrease');
            return gyara;
          }
          function megaRevival() {
            const b = battleFor([
              species('Gyarados', ['dragondance'], 'Gyaradosite'),
              species('Pawmot', ['revivalblessing']),
              species('Basculegion', ['lastrespects']),
            ], [
              species('Annihilape', ['finalgambit']),
              species('Magikarp', ['splash']),
              species('Snorlax', ['crunch', 'protect']),
            ]);
            try {
              turn(b, 'move 1 mega', 'move 1');
              const gyara = afterDoubleFaint(b);
              assert.equal(gyara.species.name, 'Gyarados-Mega', 'mega forme lost on faint');
              reviveGyara(b);
              assert.equal(gyara.species.name, 'Gyarados-Mega', 'mega forme lost upon Revival Blessing');
              turn(b, `switch ${slot(gyara)}`, 'move 1');
              assert.equal(b.p1.active[0], gyara);
              assert.equal(gyara.species.name, 'Gyarados-Mega', 'mega forme lost on switch-in after revival');
              assert.equal(gyara.fainted, false);
              return {form:gyara.species.name, revived_hp:gyara.hp, faint_count:b.p1.totalFainted};
            } finally { b.destroy(); }
          }
          function lastRespectsAfterRevival() {
            const b = battleFor([
              species('Gyarados', ['dragondance'], 'Gyaradosite'),
              species('Pawmot', ['revivalblessing']),
              species('Basculegion', ['lastrespects']),
            ], [
              species('Annihilape', ['finalgambit']),
              species('Magikarp', ['splash']),
              species('Snorlax', ['crunch','protect']),
            ]);
            try {
              turn(b, 'move 1 mega', 'move 1');
              afterDoubleFaint(b);
              reviveGyara(b);
              const basculegion = pick(b,'p1','Basculegion');
              turn(b, `switch ${slot(basculegion)}`, 'move 1');
              assert.equal(b.p1.active[0], basculegion);
              const move = b.dex.moves.get('lastrespects');
              assert.equal(typeof move.basePowerCallback, 'function');
              const bp = move.basePowerCallback.call(b, basculegion, b.p2.active[0], move);
              assert.equal(bp, 100, '1 historical faint => BP 100 after revival');
              const enemy = b.p2.active[0];
              const oldhp = enemy.hp;
              turn(b, 'move 1', 'move 1');
              assert.ok(enemy.hp < oldhp, 'Last Respects should inflict damage');
              return {historical_faints:b.p1.totalFainted, base_power:bp, damage:oldhp-enemy.hp};
            } finally { b.destroy(); }
          }
          function destinySetup() {
            const b = battleFor([
              species('Banette', ['destinybond','shadowsneak'], 'Banettite'),
              species('Garchomp', ['tackle']),
              species('Pawmot', ['revivalblessing']),
            ], [
              species('Snorlax', ['crunch','protect']),
              species('Magikarp', ['splash']),
              species('Annihilape', ['finalgambit']),
            ]);
            // Deterministic combat fixture: force a guaranteed knockout from Crunch.
            // No change to turn order, move handlers or faint handling.
            b.p1.active[0].hp = 1;
            return b;
          }
          function destinyBondTiming() {
            const active = destinySetup();
            let positive;
            try {
              turn(active, 'move 1 mega','move 1');
              assert.ok(pick(active,'p1','Banette').fainted, 'Banette should faint to Crunch');
              assert.ok(pick(active,'p2','Snorlax').fainted, 'Destiny Bond should bring down attacker in same turn');
              assert.ok(active.log.some(line => line.includes('move: Destiny Bond')), 'activation log absent');
              positive = {banette_fainted:true, attacker_fainted:true};
            } finally {active.destroy();}
            const expired = destinySetup();
            try {
              turn(expired, 'move 1 mega', 'move 2'); // DB activation, opponent Protect
              assert.equal(pick(expired,'p1','Banette').fainted, false);
              turn(expired, 'move 2', 'move 1'); // Shadow Sneak consumes DB before Crunch
              assert.ok(pick(expired,'p1','Banette').fainted, 'Banette should faint on next turn');
              assert.equal(pick(expired,'p2','Snorlax').fainted, false,
                'Destiny Bond should no longer apply after Banette next acts');
              return {same_turn:positive, after_next_action:{banette_fainted:true, attacker_fainted:false}};
            } finally {expired.destroy();}
          }
          const cases = [
            ['MEGA_REVIVAL_FORM', megaRevival],
            ['LAST_RESPECTS_REVIVAL_COUNT', lastRespectsAfterRevival],
            ['DESTINY_BOND_TIMING', destinyBondTiming],
          ];
          for (const [id, run] of cases) {
            try {
              const evidence = run();
              const result = {id, status:'PASS', evidence};
              reports.push(result);
              console.log('R27_253_CASE '+JSON.stringify(result));
            } catch (error) {
              const result={id, status:'FAIL', error:String(error?.stack || error)};
              reports.push(result);
              console.error('R27_253_CASE '+JSON.stringify(result));
              process.exitCode=1;
            }
          }
          const summary={revision:'R27.253', pin:PIN, source:'Showdown pinned Champions Mod',
            scope:'simulator-only; not real Champions game verification',
            pass:reports.filter(x=>x.status==='PASS').length, total:reports.length,
            results:reports.map(x=>({id:x.id,status:x.status}))};
          console.log('R27_253_SUMMARY '+JSON.stringify(summary));
          console.log('CERTIFICATION_GATE Native33=0/33 Exact34=0/34 Acceptance=0/8 Stage1.5=560/3500 FORMAL=DENY');
          NODE
