                   'real_champions_screenshot_pixels':0,
                   'real_field_ocr_accuracy':'NOT_MEASURED_IN_PUBLIC_CI',
                   'sealed_holdout':'NOT_MEASURED',
                   'action_suggestions':'WITHHELD',
                   'native33':'0/33','exact34':'0/34','actual_game':'0/30','formal':'DENY',
                   'sha256':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths}}
          pathlib.Path('r2737-public-receipt.json').write_text(json.dumps(summary,sort_keys=True,indent=2))
          print('R2737_RECEIPT_PASS')
