      - name: Install pinned open-source image dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet numpy==2.3.5 opencv-python-headless==4.13.0.92 pillow==12.3.0
      - name: Execute R27.36 false-positive repair and R27.37 synthetic ROI tests
        shell: bash
        run: |
          set -euo pipefail
          cd r2737-public
          python -m unittest -v test_r2736_public test_r2737_public 2>&1 | tee public-test.log
          grep -Fq 'Ran 32 tests' public-test.log
          grep -Eq '^OK$' public-test.log
          python - <<'R2737_RED_GUARD'
          import io
          from PIL import Image
          from r2736_layout_observer import observe_frame
          from r2737_field_reader import read_fields
          count=0
          for color in ('black','white','red','blue','green'):
              b=io.BytesIO();Image.new('RGB',(1536,709),color).save(b,'JPEG')
              o=observe_frame(b.getvalue())
              assert o['phase_candidate']=='unknown' and o['recommendation']=='WITHHELD'
              assert o['legal_action_request'] is None
              count+=1
          print('R2737_OPEN_SET_UNIFORM_FRAME_GUARD_PASS',count)
          R2737_RED_GUARD
      - name: Write public synthetic receipt and SHA256 manifest
        shell: bash
        run: |
          set -euo pipefail
          cd r2737-public
          python - <<'R2737_RECEIPT'
          import hashlib,json,pathlib
          paths=['r2736_layout_observer.py', 'test_r2736_public.py', 'r2737_field_reader.py', 'test_r2737_public.py', 'public-test.log']
          summary={'schema':'R2737_SYNTHETIC_RESEARCH_RECEIPT_V1',
                   'environment':'PUBLIC_RESEARCH_ONLY',
                   'uniform_frame_open_set_guard':'PASS',
                   'synthetic_field_tests':'PASS',
