name: R27.19 public mixed-action 30-turn proof
'on':
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r2719-public-mixed-actions-manual
  cancel-in-progress: false
jobs:
  research_only:
    name: Synthetic M-C damage status switches and deterministic replay
    if: ${{ github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Fetch exact pinned public Showdown and build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/showdown"
          cd "$RUNNER_TEMP/showdown"
          git init -q
          git remote add origin https://github.com/smogon/pokemon-showdown.git
          git fetch --depth 1 origin aa17ca0fac8bc5605df673bd8774c2d0e91efa43
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = aa17ca0fac8bc5605df673bd8774c2d0e91efa43
          test "$(git rev-parse 'HEAD^{tree}')" = 98c9038b81fa5ed7f1e9818736b701918920501e
          test "$(node --version)" = v22.18.0
          npm ci --no-audit --no-fund
          npm run build
      - name: Verify deterministic pinned distribution
        shell: bash
        working-directory: ${{ runner.temp }}/showdown
        run: |
          set -euo pipefail
          python3 - <<'PY_DIST'
          import pathlib,hashlib
          dist=pathlib.Path('dist')
          items=list(dist.rglob('*'))
          assert not any(p.is_symlink() for p in items)
          files=sorted([p for p in items if p.is_file()],key=lambda p:p.relative_to(dist).as_posix())
          assert len(files)==1094,len(files)
          h=hashlib.sha256()
          for p in files:
              n=p.relative_to(dist).as_posix().encode()
              h.update(len(n).to_bytes(8,'big'))
              h.update(n)
              h.update(hashlib.sha256(p.read_bytes()).digest())
          assert h.hexdigest()=='3697be28e9736b691f005bc5ad7b56789523fbf4ef04d838fcc91f6cfae9c3df'
          print('R2719_PINNED_DIST_VERIFIED',len(files),h.hexdigest())
          PY_DIST
      - name: Synthetic M-C 30-turn mixed actions and archived replay
        shell: bash
        working-directory: ${{ runner.temp }}/showdown
        run: |
          set -euo pipefail
          cat > ./r2719-mixed-action-evidence.cjs <<'R2719_JS_SOURCE'
          #!/usr/bin/env node
          'use strict';
          /** R27.19: PUBLIC Showdown-only synthetic attack/status/switch research. */
          const assert=require('node:assert/strict');
          const crypto=require('node:crypto');
          const fs=require('node:fs');
          const path=require('node:path');
          const {Battle,extractChannelMessages}=require('./dist/sim/battle');
          const {Dex}=require('./dist/sim/dex');
          const {State}=require('./dist/sim/state');
          const {TeamValidator}=require('./dist/sim/team-validator');
          const PIN='aa17ca0fac8bc5605df673bd8774c2d0e91efa43';
          function stable(x){
            if(Array.isArray(x))return x.map(stable);
            if(x&&typeof x==='object')return Object.fromEntries(Object.keys(x).sort().map(k=>[k,stable(x[k])]));
            return x;
          }
          function digest(x){return crypto.createHash('sha256').update(JSON.stringify(stable(x))).digest('hex');}
          function snap(b){return JSON.parse(JSON.stringify(b.toJSON()));}
          function normalizeState(state){return State.normalize(JSON.parse(JSON.stringify(state)));}
          function normalizeTrace(t){
            const states=t.states.map(e=>({index:e.index,turn:e.turn,state:normalizeState(e.state)}));
            return {format:t.format,seed:t.seed,species:t.species,
              states,actions:t.actions.map((e,i)=>({...e,
                visible:{p1:State.normalizeLog(e.visible.p1),p2:State.normalizeLog(e.visible.p2)},
                pre_digest:digest(states[i].state),post_digest:digest(states[i+1].state)})),
              omniscient:State.normalizeLog(t.omniscient),
              viewers:{p1:State.normalizeLog(t.viewers.p1),p2:State.normalizeLog(t.viewers.p2)}};
          }
          function firstDifference(a,b,p='root'){
            if(Object.is(a,b))return null;
            if(a===null||b===null||typeof a!=='object'||typeof b!=='object')
              return {path:p,left:String(a).slice(0,160),right:String(b).slice(0,160)};
            for(const k of new Set([...Object.keys(a),...Object.keys(b)])){
              if(!(k in a)||!(k in b))return {path:p+'.'+k,left:k in a,right:k in b};
              const d=firstDifference(a[k],b[k],p+'['+JSON.stringify(k)+']');if(d)return d;
            }
            return null;
          }
          const mv=(id)=>({kind:'move',id});
          const sw=(n)=>({kind:'switch',nickname:'Horiz'+n});
          const plan=[
            [mv('thunderwave'),mv('yawn')],  // Gyarados vs Snorlax
            [mv('bite'),mv('bite')],
            [sw(5),mv('protect')],
            [mv('yawn'),sw(6)],             // Snorlax vs Azumarill, deferred sleep
            [mv('bite'),mv('waterfall')],
            [mv('protect'),mv('waterfall')],
            [sw(6),mv('protect')],
            [mv('waterfall'),mv('charm')],
            [mv('charm'),mv('waterfall')],
            [mv('protect'),mv('protect')],
            [mv('waterfall'),mv('waterfall')],
            [mv('protect'),mv('charm')],
            [mv('charm'),mv('protect')],
            [sw(4),mv('waterfall')],
            [mv('thunderwave'),mv('protect')],
            [mv('bite'),mv('waterfall')],
            [mv('protect'),mv('charm')],
            [mv('bite'),sw(4)],
            [mv('thunderwave'),mv('protect')],
            [mv('protect'),mv('bite')],
            [mv('bite'),mv('bite')],
            [mv('endure'),mv('protect')],
            [mv('bite'),sw(5)],
            [mv('protect'),mv('bite')],
            [mv('bite'),mv('yawn')],
            [mv('bite'),mv('protect')],
            [sw(5),mv('bite')],
            [mv('yawn'),mv('bite')],
            [mv('protect'),mv('bite')],
            [mv('bite'),mv('endure')]
          ];
          assert.equal(plan.length,30);
          const SPECIES=['Venusaur','Charizard','Blastoise','Gyarados','Snorlax','Azumarill'];
          const SET_MOVES=[
            ['protect','endure','rest'],['protect','endure','rest'],['protect','endure','rest'],
            ['bite','thunderwave','protect','endure'],
            ['bite','yawn','protect','endure'],
            ['waterfall','charm','protect','endure']
          ];
          function buildTeam(modDex){return SPECIES.map((species,i)=>{
            const info=modDex.species.get(species);
            assert(info.exists&&info.abilities['0'],'missing pokemon '+species);
            for(const m of SET_MOVES[i])assert(modDex.moves.get(m).exists,'missing move '+m);
            return {species,name:'Horiz'+(i+1),level:50,ability:info.abilities['0'],item:'',nature:'Hardy',
              moves:SET_MOVES[i],evs:{hp:0,atk:0,def:0,spa:0,spd:0,spe:0}};
          });}
          function getAction(b,who,target){
            const side=b.getSide(who),request=side.activeRequest?.active?.[0];
            assert.equal(side.requestState,'move','unexpected request '+who);
            assert(Array.isArray(request?.moves),'missing move request '+who);
            const active=side.active[0];assert(active&&!active.fainted,'fainted active');
            if(target.kind==='switch'){
              const pos=side.pokemon.findIndex(p=>p.name===target.nickname);
              assert(pos>=0,'missing switch target '+target.nickname);
              assert(!side.pokemon[pos].fainted,'fainted switch target');
              assert.notEqual(side.pokemon[pos].name,active.name,'switch equals active');
              // Team preview selects 3 members; switch must be within the three active roster slots.
              assert(pos<3,'switch target not among 3 selections: '+target.nickname+' position='+pos);
              return {choice:'switch '+(pos+1),kind:'switch',actor:who,nickname:target.nickname};
            }
            const index=request.moves.findIndex(m=>m.id===target.id&&m.pp>0&&!m.disabled);
            assert(index>=0,'requested move unavailable: '+who+' '+target.id+' '+JSON.stringify(request.moves));
            return {choice:'move '+(index+1),kind:'move',actor:who,nickname:active.name,
              move:target.id,slot:index,pre_pp:request.moves[index].pp};
          }
          function runOnce(){
            assert.equal(typeof extractChannelMessages,'function');
            const f=Dex.formats.get('gen9championsbssregmc');
            assert(f.exists&&f.mod==='champions','M-C pinned format missing');
            const validator=TeamValidator.get(f),modDex=Dex.forFormat(f);
            assert(validator.ruleTable.has('speciesclause'),'species clause missing');
            const dup=buildTeam(modDex);dup[1]={...dup[0],name:'Horiz2'};
            const neg=validator.validateTeam(dup);
            assert(Array.isArray(neg)&&neg.some(s=>/Species Clause/i.test(s)),'duplicate species negative control');
            for(let i=0;i<2;i++)assert.equal(validator.validateTeam(buildTeam(modDex)),null,'invalid M-C team '+i);
            const seed='1,2,3,4', b=new Battle({formatid:f.id,seed,strictChoices:true,
              p1:{name:'Public-P1',team:buildTeam(modDex)},p2:{name:'Public-P2',team:buildTeam(modDex)}});
            assert.equal(b.requestState,'teampreview');
            b.makeChoices('team 456','team 546');
            assert.equal(b.requestState,'move');
            assert.equal(b.p1.active[0].name,'Horiz4','p1 lead mismatch');
            assert.equal(b.p2.active[0].name,'Horiz5','p2 lead mismatch');
            const states=[{index:0,turn:b.turn,state:snap(b)}],actions=[];
            const counters={planned_moves:0,planned_switches:0,executed_moves:0,visible_switches:0,
              damage_events:0,status_events:0,boost_events:0,cant_events:0};
            for(let i=0;i<30;i++){
              assert(!b.ended,'battle ended before 30 '+i);
              assert.equal(b.requestState,'move','not move request turn '+i);
              const prevTurn=b.turn;
              const before=extractChannelMessages(b.log.join('\n'),[1,2]);
              assert(Array.isArray(before[1])&&Array.isArray(before[2]));
              const left=getAction(b,'p1',plan[i][0]),right=getAction(b,'p2',plan[i][1]);
              const prior=snap(b),norm=JSON.stringify(stable(normalizeState(prior)));
              const restored=Battle.fromJSON(JSON.stringify(prior));
              assert.equal(JSON.stringify(stable(normalizeState(snap(restored)))),norm,'roundtrip pre mismatch '+i);
              restored.makeChoices(left.choice,right.choice);
              assert.equal(JSON.stringify(stable(normalizeState(snap(b)))),norm,'clone mutated parent '+i);
              b.makeChoices(left.choice,right.choice);
              assert.equal(JSON.stringify(stable(normalizeState(snap(restored)))),JSON.stringify(stable(normalizeState(snap(b)))),
                'immediate clone replay mismatch '+i);
              assert.equal(b.turn,prevTurn+1,'turn counter mismatch '+i);
              const after=extractChannelMessages(b.log.join('\n'),[1,2]);
              const visible={p1:after[1].slice(before[1].length),p2:after[2].slice(before[2].length)};
              for(const viewer of ['p1','p2']){
                assert.equal(visible[viewer].filter(x=>x==='|turn|'+b.turn).length,1,'missing turn announcement');
              }
              const witnessed={};
              for(const a of [left,right]){
                const prefix=a.kind==='switch'?'|switch|'+a.actor+'a: '+a.nickname+'|':'|move|'+a.actor+'a: '+a.nickname+'|';
                const hits=visible.p1.filter(s=>s.startsWith(prefix));
                assert.deepEqual(hits,visible.p2.filter(s=>s.startsWith(prefix)),'viewers disagree on public action');
                if(a.kind==='switch'){
                  assert.equal(hits.length,1,'switch not witnessed '+i);
                  assert.equal(b.getSide(a.actor).active[0].name,a.nickname,'wrong switch-in '+i);
                  counters.visible_switches++;
                }else{
                  assert(hits.length<=1,'duplicate move announcement');
                  if(hits.length){assert(hits[0].includes('|'+modDex.moves.get(a.move).name+'|'),
                    'incorrect move '+hits[0]+' expected '+a.move);counters.executed_moves++;}
                }
                counters[a.kind==='switch'?'planned_switches':'planned_moves']++;
                witnessed[a.actor]={kind:a.kind,announced:hits.length>0};
              }
              // Both views are public protocol channels; count effects only once using p1.
              for(const line of visible.p1){
                if(/^\|-damage\|/.test(line))counters.damage_events++;
                if(/^\|-status\|/.test(line))counters.status_events++;
                if(/^\|-(unboost|boost)\|/.test(line))counters.boost_events++;
                if(/^\|cant\|/.test(line))counters.cant_events++;
              }
              const post=snap(b);
              states.push({index:i+1,turn:b.turn,state:post});
              actions.push({index:i+1,turn_before:prevTurn,turn_after:b.turn,
                choices:{p1:left.choice,p2:right.choice},requested:{p1:plan[i][0],p2:plan[i][1]},
                witnessed,visible,pre_digest:digest(prior),post_digest:digest(post)});
            }
            assert.equal(states.length,31);assert.equal(actions.length,30);
            assert(!b.ended,'early termination');
            assert(counters.executed_moves>=15,'not enough executed moves '+JSON.stringify(counters));
            assert(counters.visible_switches>=5,'not enough switches');
            assert(counters.damage_events>=3,'damage not observed');
            assert(counters.status_events>=1,'status effects not observed');
            assert(counters.boost_events>=1,'stat changes not observed');
            const omniscient=b.log.join('\n'),channels=extractChannelMessages(omniscient,[1,2]);
            return {format:f.name,seed,species:SPECIES,counters,states,actions,omniscient,
              viewers:{p1:channels[1],p2:channels[2]}};
          }
          function main(){
            const a=runOnce(),b=runOnce(),normA=normalizeTrace(a),normB=normalizeTrace(b);
            const hA=digest(normA),hB=digest(normB);
            if(hA!==hB){
              console.error('FIRST_NON_TIMESTAMP_DIFFERENCE',JSON.stringify(firstDifference(normA,normB)));
              throw Error('DETERMINISTIC_MIXED_TRACE_MISMATCH');
            }
            for(let i=0;i<30;i++){
              const prev=a.states[i],post=a.states[i+1],record=a.actions[i];
              assert.equal(record.pre_digest,digest(prev.state));
              assert.equal(record.post_digest,digest(post.state));
              const clone=Battle.fromJSON(JSON.stringify(prev.state));
              clone.makeChoices(record.choices.p1,record.choices.p2);
              assert.equal(JSON.stringify(stable(normalizeState(snap(clone)))),
                JSON.stringify(stable(normalizeState(post.state))),'archived turn replay mismatch '+i);
            }
            const out=path.resolve(process.argv[2]||'r2719-evidence');
            fs.mkdirSync(out,{recursive:true});
            const put=(file,content)=>fs.writeFileSync(path.join(out,file),content,'utf8');
            const lines=x=>x.map(y=>JSON.stringify(y)).join('\n')+'\n';
            put('all-31-states.jsonl',lines(a.states));
            put('all-30-mixed-actions.jsonl',lines(a.actions));
            put('omniscient-protocol.log',a.omniscient+'\n');
            put('public-p1-events.log',a.viewers.p1.join('\n')+'\n');
            put('public-p2-events.log',a.viewers.p2.join('\n')+'\n');
            const receipt={schema:'TRUE_PLAN_R2719_MIXED_ACTION_REPLAY_V1',status:'PASS_PUBLIC_SYNTHETIC_ONLY',
              pinned_showdown_commit:PIN,format:a.format,seed:a.seed,turns:30,states:31,
              verified_checks:['legal six','species clause negative control','mixed actions','30 turn replay',
                'two independent same seed runs','dual-viewer protocol','raw evidence checksums'],
              witnessed:a.counters,normalized_hash_a:hA,normalized_hash_b:hB,
              raw_hash_a:digest(a),raw_hash_b:digest(b),
              certification:{native33:'0/33',exact34:'0/34',actual_game:'0/30',
                stage15_formal_increment:0,gate:'DENY_FORMAL_CERTIFICATION'},
              note:'Public pinned Showdown synthetic M-C research only. Omniscient state must never be a player observation.'};
            put('r2719-receipt.json',JSON.stringify(receipt,null,2)+'\n');
            console.log('R2719_MIXED_ACTION_PUBLIC_RECEIPT '+JSON.stringify(receipt));
          }
          if(require.main===module)main();
          module.exports={normalizeTrace,firstDifference,plan,runOnce};
          R2719_JS_SOURCE
          printf '%s  %s\n' 'e3148e6a4eecded08fb53d42fea1be7f4318ac000251f821a2afc1ba70d22543' ./r2719-mixed-action-evidence.cjs | sha256sum -c -
          node --check ./r2719-mixed-action-evidence.cjs
          node ./r2719-mixed-action-evidence.cjs ./r2719-evidence | tee ./r2719-console-receipt.json
          cp ./r2719-mixed-action-evidence.cjs ./r2719-evidence/
      - name: Audit receipt, file count, SHA-256, and byte cap
        shell: bash
        working-directory: ${{ runner.temp }}/showdown
        run: |
          set -euo pipefail
          python3 - <<'PY_AUDIT'
          import hashlib,json,pathlib
          p=pathlib.Path('r2719-evidence')
          files={'r2719-mixed-action-evidence.cjs','all-31-states.jsonl',
          'all-30-mixed-actions.jsonl','omniscient-protocol.log',
          'public-p1-events.log','public-p2-events.log','r2719-receipt.json'}
          assert {f.name for f in p.iterdir()}==files
          total=sum(f.stat().st_size for f in p.iterdir())
          assert 0<total<=8*1024*1024,('TOO_LARGE',total)
          receipt=json.loads((p/'r2719-receipt.json').read_text())
          states=[json.loads(x) for x in (p/'all-31-states.jsonl').read_text().splitlines()]
          turns=[json.loads(x) for x in (p/'all-30-mixed-actions.jsonl').read_text().splitlines()]
          assert receipt['status']=='PASS_PUBLIC_SYNTHETIC_ONLY'
          assert len(states)==31 and [x['index'] for x in states]==list(range(31))
          assert len(turns)==30 and [x['index'] for x in turns]==list(range(1,31))
          assert receipt['normalized_hash_a']==receipt['normalized_hash_b']
          assert receipt['witnessed']['damage_events']>=3
          assert receipt['witnessed']['status_events']>=1
          assert receipt['witnessed']['boost_events']>=1
          assert receipt['witnessed']['visible_switches']>=5
          assert receipt['certification']=={'native33':'0/33','exact34':'0/34',
          'actual_game':'0/30','stage15_formal_increment':0,'gate':'DENY_FORMAL_CERTIFICATION'}
          assert hashlib.sha256((p/'r2719-mixed-action-evidence.cjs').read_bytes()).hexdigest()=='e3148e6a4eecded08fb53d42fea1be7f4318ac000251f821a2afc1ba70d22543'
          print('R2719_EVIDENCE_VERIFIED',len(states),len(turns),total)
          PY_AUDIT
          (cd ./r2719-evidence && sha256sum *.cjs *.json *.jsonl *.log > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Preserve public synthetic proof for seven days
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: r2719-public-mixed-action-30turn-proof
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/showdown/r2719-evidence/
