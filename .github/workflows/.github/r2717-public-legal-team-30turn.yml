
name: R27.17 pinned public validated legal six 30 turn probe
'on':
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r2717-legal-team-public-probe
  cancel-in-progress: false
jobs:
  research_only:
    name: Public M-C validated legal six dual-viewer 30 turn proof
    if: ${{ github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Retrieve and build exact pinned Showdown
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/showdown"
          cd "$RUNNER_TEMP/showdown"
          git init -q
          git remote add origin https://github.com/smogon/pokemon-showdown.git
          git fetch --depth 1 origin aa17ca0fac8bc5605df673bd8774c2d0e91efa43
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = aa17ca0fac8bc5605df673bd8774c2d0e91efa43
          test "$(git rev-parse 'HEAD^{tree}')" = 98c9038b81fa5ed7f1e9818736b701918920501e
          test "$(node --version)" = v22.18.0
          npm ci --no-audit --no-fund
          npm run build
      - name: Reconfirm complete public dist digest
        shell: bash
        working-directory: ${{ runner.temp }}/showdown
        run: |
          set -euo pipefail
          python3 - <<'PY_PUBLIC_DIGEST'
          import hashlib,pathlib
          dist=pathlib.Path('dist')
          paths=list(dist.rglob('*'))
          assert not any(p.is_symlink() for p in paths)
          files=sorted((p for p in paths if p.is_file()),key=lambda p:p.relative_to(dist).as_posix())
          assert len(files)==1094,len(files)
          h=hashlib.sha256()
          for p in files:
              name=p.relative_to(dist).as_posix().encode('utf-8')
              h.update(len(name).to_bytes(8,'big'))
              h.update(name)
              h.update(hashlib.sha256(p.read_bytes()).digest())
          assert h.hexdigest()=='3697be28e9736b691f005bc5ad7b56789523fbf4ef04d838fcc91f6cfae9c3df'
          print('PUBLIC_DIST_VERIFIED_1094',h.hexdigest())
          PY_PUBLIC_DIGEST
      - name: Run validator-checked six-species 30 turn public research proof
        shell: bash
        working-directory: ${{ runner.temp }}/showdown
        run: |
          set -euo pipefail
          cat > ./r2717-public-legal-team-30turn.cjs <<'R2717_PROBE'
          #!/usr/bin/env node
          'use strict';
          /** R27.17 validated six-distinct-species Showdown-only 30-turn research witness.
           * Exact frozen M-C validator accepts the full teams before any battle construction.
           * NO private parent/teams/models. Real Champions game parity NOT established.
           * Can only claim native public simulator research after executing with pinned dist.
           */
          const assert=require('node:assert/strict');
          const crypto=require('node:crypto');

          function verifyVisibleAction(events,player,witness){
            assert(player==='p1'||player==='p2','invalid viewer');
            assert(Array.isArray(events),'missing viewer-specific events');
            assert(events.every(x=>typeof x==='string'&&!/[\r\n]/.test(x)),'invalid protocol event');
            const wantedTurn='|turn|'+witness.nextTurn;
            assert.equal(events.filter(x=>x===wantedTurn).length,1,'turn not publicly observed once');
            assert(/^[A-Za-z0-9-]{1,18}$/.test(witness.name),'unsafe battle nickname');
            const ownActor=witness.actor;
            assert(ownActor==='p1'||ownActor==='p2','bad acting player');
            if(witness.kind==='switch'){
              const prefix='|switch|'+ownActor+'a: '+witness.name+'|';
              assert.equal(events.filter(x=>x.startsWith(prefix)).length,1,'actual switch not publicly witnessed');
            }else if(witness.kind==='move'){
              assert(['Protect','Endure','Rest'].includes(witness.move),'unexpected move');
              const prefix='|move|'+ownActor+'a: '+witness.name+'|'+witness.move+'|';
              assert.equal(events.filter(x=>x.startsWith(prefix)).length,1,'actual move not publicly witnessed');
            }else throw Error('unsupported witness kind');
            return true;
          }
          function canonical(x){
            if(Array.isArray(x))return x.map(canonical);
            if(x&&typeof x==='object')return Object.fromEntries(Object.keys(x).sort().map(k=>[k,canonical(x[k])]));
            return x;
          }
          function hash(x){return crypto.createHash('sha256').update(JSON.stringify(x)).digest('hex');}
          function run({Battle,Dex,State,extractChannelMessages,TeamValidator}){
            assert.equal(typeof extractChannelMessages,'function','pinned channel extractor unavailable');
            const f=Dex.formats.get('gen9championsbssregmc');
            assert(f.exists && f.mod==='champions','pinned M-C format unavailable');
            assert(TeamValidator && typeof TeamValidator.get==='function');
            const validator=TeamValidator.get(f);
            const modDex=Dex.forFormat(f);
            assert(validator.ruleTable.has('speciesclause'),'Species Clause not enabled');
            const speciesNames=['Venusaur','Charizard','Blastoise','Gyarados','Snorlax','Azumarill'];
            assert.equal(new Set(speciesNames.map(x=>x.toLowerCase())).size,6);
            const createTeam=()=>speciesNames.map((name,i)=>{
              const species=modDex.species.get(name);
              assert(species.exists,'missing species '+name);
              assert(species.abilities['0'],'missing first ability '+name);
              return {species:name,name:'Horiz'+(i+1),level:50,
                ability:species.abilities['0'],item:'',nature:'Serious',
                moves:['protect','endure','rest'],
                evs:{hp:0,atk:0,def:0,spa:0,spd:0,spe:0}};
            });
            const duplicated=createTeam();
            duplicated[1]={...duplicated[0],name:'Horiz2',moves:[...duplicated[0].moves],evs:{...duplicated[0].evs}};
            const duplicateErrors=validator.validateTeam(duplicated);
            assert(Array.isArray(duplicateErrors)&&duplicateErrors.some(e=>/Species Clause/i.test(e)),
              'negative control: duplicate must be rejected explicitly by Species Clause');
            function verifiedTeam(label){
              const team=createTeam();
              const errors=validator.validateTeam(team);
              assert.equal(errors,null,label+' team invalid: '+JSON.stringify(errors));
              assert.equal(new Set(team.map(x=>modDex.species.get(x.species).baseSpecies)).size,6);
              return team;
            }
            const b=new Battle({formatid:f.id,seed:'1,2,3,4',strictChoices:true,
              p1:{name:'Synthetic-P1',team:verifiedTeam('p1')},
              p2:{name:'Synthetic-P2',team:verifiedTeam('p2')}});
            assert.equal(b.requestState,'teampreview');
            b.makeChoices('team 123','team 123');
            assert.equal(b.requestState,'move');
            const normalize=x=>JSON.stringify(canonical(State.normalize(JSON.parse(JSON.stringify(x.toJSON())))));
            const counters={p1:{protect:0,endure:0,rest:0,switch:0},p2:{protect:0,endure:0,rest:0,switch:0}};
            const chain=[];
            const players=['p1','p2'];
            for(let i=0;i<30;i++){
              assert.equal(b.ended,false,'early battle termination '+i);
              assert.equal(b.requestState,'move','wrong turn request '+i);
              const priorTurn=b.turn;
              const baseline=extractChannelMessages(b.log.join('\n'),[1,2]);
              assert(Array.isArray(baseline[1])&&Array.isArray(baseline[2]),'missing viewer channel');
              const lengths={p1:baseline[1].length,p2:baseline[2].length};
              const before={},joint={};
              for(const p of players){
                const side=b.getSide(p), req=side.activeRequest?.active?.[0];
                assert.equal(side.requestState,'move','side not active '+i+' '+p);
                assert(Array.isArray(req?.moves),'request move list missing '+i+' '+p);
                const switching=(p==='p1'&&i===3)||(p==='p2'&&i===9);
                // Always select a move with PP: Champions changes base and maximum PP.
                const preferred=i%3;
                const options=[preferred,(preferred+1)%3,(preferred+2)%3];
                const slot=switching?null:options.find(s=>req.moves[s]?.pp>0);
                assert(switching||Number.isInteger(slot),'ALL_MOVE_PP_EXHAUSTED '+i+' '+p);
                const choice=switching?'switch 2':`move ${slot+1}`;
                const own=side.active[0];
                assert(own&&/^[A-Za-z0-9-]{1,18}$/.test(own.name),'bad active nickname');
                before[p]={name:own.name,target:side.pokemon[1]?.name,slot,
                  pp:slot===null?null:req.moves[slot]?.pp};
                if(slot!==null){
                  assert.equal(req.moves[slot].id,['protect','endure','rest'][slot]);
                  assert(Number.isInteger(before[p].pp)&&before[p].pp>0,'PP exhausted '+i+' '+p);
                }else{
                  assert(side.pokemon[1]&&!side.pokemon[1].fainted,'invalid switch target');
                  assert.notEqual(own.name,before[p].target,'switch target equals active');
                }
                joint[p]=choice;
              }
              const snapshot=JSON.stringify(b.toJSON());
              const replica=Battle.fromJSON(snapshot);
              b.makeChoices(joint.p1,joint.p2);
              replica.makeChoices(joint.p1,joint.p2);
              assert.equal(normalize(b),normalize(replica),'roundtrip divergence '+i);
              assert.equal(b.turn,priorTurn+1,'turn counter mismatch '+i);
              const updated=extractChannelMessages(b.log.join('\n'),[1,2]);
              const deltas={p1:updated[1].slice(lengths.p1),p2:updated[2].slice(lengths.p2)};
              // A publicly announced action MUST appear in the filtered VIEW OF EACH SIDE.
              // The omniscient battle log is never treated as a player-visible proof.
              for(const actor of players){
                const side=b.getSide(actor),w=before[actor];
                const switchAction=w.slot===null;
                if(switchAction){
                  assert.equal(side.active[0].name,w.target,'switch did not apply '+i+' '+actor);
                  counters[actor].switch++;
                }else{
                  assert.equal(side.active[0].name,w.name,'wrong active after move '+i+' '+actor);
                  const request=side.activeRequest?.active?.[0];
                  assert(Array.isArray(request?.moves),'post-action request absent');
                  assert.equal(request.moves[w.slot].pp,w.pp-1,'PP not consumed '+i+' '+actor);
                  counters[actor][['protect','endure','rest'][w.slot]]++;
                }
                const proof={actor,kind:switchAction?'switch':'move',
                  name:switchAction?w.target:w.name,
                  move:switchAction?null:['Protect','Endure','Rest'][w.slot],nextTurn:b.turn};
                for(const viewer of players)verifyVisibleAction(deltas[viewer],viewer,proof);
              }
              chain.push(hash({turn:b.turn,choices:joint,channels:{
                p1:hash(deltas.p1),p2:hash(deltas.p2)},
                state_sha256:hash(canonical(State.normalize(JSON.parse(JSON.stringify(b.toJSON())))))}));
            }
            assert.equal(counters.p1.switch,1);assert.equal(counters.p2.switch,1);
            assert.equal(b.ended,false);
            return {schema:'TRUE_PLAN_R27_17_VALIDATED_SPECIES_CLAUSE_PUBLIC_30_TURN_RECEIPT_V1',
              status:'PASS_PUBLIC_PINNED_VALIDATED_TEAM_SYNTHETIC_NONCERTIFYING',
              pinned_commit:'aa17ca0fac8bc5605df673bd8774c2d0e91efa43',
              format:f.name,turns:30,viewer_channels:['p1','p2'],
              species_clause_enabled:true,valid_team_species:speciesNames,
              duplicate_species_negative_control:'REJECTED',action_counters:counters,
              transition_chain_sha256:hash(chain),
              native33:'0/33',exact34:'0/34',actual_game:'0/30',formal_increment:0,
              gate:'DENY_FORMAL_CERTIFICATION',
              scope:'VALIDATED_PUBLIC_SHOWDOWN_SYNTHETIC_ONLY__NOT_PRIVATE_R21_OR_REAL_GAME'};
          }
          function main(){
            const simulator=require('./dist/sim/battle');
            const {Dex}=require('./dist/sim/dex');
            const {State}=require('./dist/sim/state');
            const {TeamValidator}=require('./dist/sim/team-validator');
            console.log(JSON.stringify(run({...simulator,Dex,State,TeamValidator})));
          }
          if(require.main===module)main();
          module.exports={verifyVisibleAction,run};
          R2717_PROBE
          node --check ./r2717-public-legal-team-30turn.cjs
          node ./r2717-public-legal-team-30turn.cjs
