        ''.join(packed.split()))))
       old={p.relative_to(root).as_posix():p.read_bytes()
        for p in root.rglob('*') if p.is_file()}
       assert len(old)==412 and tree(old)==delta['before_tree']
       for entry in delta['patches']:
        n=entry['path'];data=entry['contents'].encode()
        assert n in old and sha(old[n])==entry['before']
        assert sha(data)==entry['after']
        (root/n).write_bytes(data)
       for entry in delta['additions']:
        n=entry['path'];data=entry['contents'].encode()
        assert n not in old and sha(data)==entry['sha256']
        path=root/n;path.parent.mkdir(parents=True,exist_ok=True)
        assert not path.exists();path.write_bytes(data)
       h={p.relative_to(root).as_posix():sha(p.read_bytes())
        for p in root.rglob('*') if p.is_file()
        and p.name!='source_manifest.json'}
       manifest=root/'source_manifest.json'
       manifest.write_text(json.dumps(h,sort_keys=True,indent=2,
        ensure_ascii=False)+'\n')
       assert sha(manifest.read_bytes())==delta['manifest_sha256']
       current={p.relative_to(root).as_posix():p.read_bytes()
        for p in root.rglob('*') if p.is_file()}
       assert set(old)<=set(current)
       assert len(current)==delta['final_count']==416
       assert tree(current)==delta['after_tree']
       (pathlib.Path('R755Proof')/'SOURCE_HASHES.json').write_text(
        json.dumps({n:sha(b) for n,b in current.items()},sort_keys=True))
       print('R755_416_FILES_SHA_PASS_ZERO_DELETIONS')
       PYTHON
    - name: Swift XCTest and iPhoneOS build NO IPA
      shell: bash
      run: |
       set -euo pipefail
       (cd source/R720_PORTABLE_TESTS && swift test -j 2) \
        > R755Proof/Swift.log 2>&1 || {
         tail -n 70 R755Proof/Swift.log;exit 1;
        }
       grep -Fq 'Executed 321 tests, with 0 failures' \
        R755Proof/Swift.log
       python3 source/tools/r748_capture_path_gate.py
       python3 source/tools/r745_read_path_gate.py \
        > R755Proof/ReadPath.log
       python3 source/tools/r742_live_path_audit.py
       python3 source/tools/r743_macos_compat_audit.py
       swiftc -frontend -parse source/app/ios/ChampionsOnDevice/*.swift
       python3 source/tools/generate_xcode_project.py
       xcodebuild -project source/app/ios/ChampionsOnDeviceResearch.xcodeproj \
        -scheme ChampionsOnDeviceResearch -configuration Debug \
        -sdk iphoneos -destination 'generic/platform=iOS' \
        ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
        -derivedDataPath "$RUNNER_TEMP/r755" build \
        > R755Proof/iPhoneOS.log 2>&1 || {
         grep -E 'error:|BUILD FAILED' R755Proof/iPhoneOS.log || true
         exit 1;
        }
       grep -Fq 'BUILD SUCCEEDED' R755Proof/iPhoneOS.log
    - name: Package R755 minimal changes and audit only NO IPA
      shell: bash
      run: |
       set -euo pipefail
       python3 - <<'PYTHON'
       import pathlib,zipfile,hashlib,json
       root=pathlib.Path('source');out=pathlib.Path('R755Proof')
       changed=[
        'R720_PORTABLE_TESTS/Sources/R719Core/R737LiveFieldBridge.swift',
        'R720_PORTABLE_TESTS/Sources/R719Core/R752HPTextBarLink.swift',
        'R720_PORTABLE_TESTS/Sources/R719Core/R755HPFieldCorrelationAudit.swift',
        'R720_PORTABLE_TESTS/Tests/R719CoreTests/R737LiveFieldBridgeTests.swift',
        'R720_PORTABLE_TESTS/Tests/R719CoreTests/R752HPTextBarLinkTests.swift',
        'R720_PORTABLE_TESTS/Tests/R719CoreTests/R755HPFieldCorrelationAuditTests.swift',
        'R755_CHANGELOG.md',
        'app/ios/ChampionsOnDevice/R714CaptureAudit.swift',
        'app/ios/ChampionsOnDevice/R737LiveFieldBridge.swift',
        'app/ios/ChampionsOnDevice/R752HPTextBarLink.swift',
        'app/ios/ChampionsOnDevice/R755HPFieldCorrelationAudit.swift',
        'source_manifest.json',
       ]
       expected=json.loads((out/'SOURCE_HASHES.json').read_text())
       assert len(expected)==416
       zpath=out/'R755_CHANGESET_ONLY.zip'
       with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED) as z:
        for n in changed:
         b=(root/n).read_bytes()
         assert hashlib.sha256(b).hexdigest()==expected[n]
         z.writestr(n,b)
       with zipfile.ZipFile(zpath) as z:
        assert z.testzip() is None and len(z.namelist())==len(changed)
       (out/'STATUS.txt').write_text(
        'R755 Mac Swift/Xcode build and regression ONLY.\n'
        'NO IPA. Real image calibration remains unverified.\n')
       print('R755_DIFF_ONLY_SHA_PASS',len(changed))
       PYTHON
    - name: Upload source and diagnostics only NO IPA
      uses: actions/upload-artifact@v4
      with:
        name: R755-hp-correlation-NO-IPA
        path: R755Proof/
        retention-days: 3
        if-no-files-found: error
