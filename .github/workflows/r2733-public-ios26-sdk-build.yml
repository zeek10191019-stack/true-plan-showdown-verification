    - name: Apple iOS26 SDK unsigned simulator build and R27.32 transport regression
      shell: bash
      run: 'set -euo pipefail

        cd "$R2733_ROOT"

        bash ./macos_sdk_proof.sh'
    - name: Independently audit receipt and artifact hash manifest
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY_AUDIT'\nimport json,hashlib,os,pathlib\np=pathlib.Path(os.environ['R2733_PROOF_OUT'])\n\
        r=json.loads((p/'r2733-receipt.json').read_text())\nm=json.loads((p/'SHA256SUMS.json').read_text())\nassert r['schema']=='TRUE_PLAN_R2733_NO_MAC_IOS26_SIMULATOR_COMPILE_V1'\n\
        assert r['status']=='PASS_UNSIGNED_SIMULATOR_APP_AND_EXTENSION_BUILD_ONLY'\nassert r['real_ios_device_capture']==False\
        \ and r['signed_installable_ipa']==False\nassert r['real_champions_ocr']==False and r['game_action_recommendations']==0\n\
        assert r['certification']=={'native33':'0/33','exact34':'0/34','actual_game':'0/30','gate':'DENY'}\nassert len(r['source_files_sha256'])>=12\n\
        for fn,h in m.items():\n    assert (p/fn).is_file() and hashlib.sha256((p/fn).read_bytes()).hexdigest()==h,fn\nassert\
        \ len(m)>=6\nassert '** BUILD SUCCEEDED **' in (p/'xcode-sdk-build.log').read_text()\nassert 'R2732_TEST_PASS' in\
        \ (p/'parent-transport-checks.log').read_text()\nassert 'R2732_R2731_INHERITED_FAIL_CLOSED_PASS' in (p/'parent-fail-closed-checks.log').read_text()\n\
        print('R2733_PUBLIC_IOS26_SDK_AUDIT_PASS',len(m),len(r['source_files_sha256']))\nPY_AUDIT"
    - name: Upload unsigned public-only research evidence
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: r2733-public-ios26-unsigned-sdk-proof
        path: ${{ runner.temp }}/r2733-proof
        retention-days: 7
        if-no-files-found: error
