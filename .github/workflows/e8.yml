       CpZYMZhZzYc/cZuF8sZqUg/TtZ7N+pWCCYu9T8mMkzFQWLGtK/ZYtawTqBK3hwUF
       ZY4ztGK0rMznh1yCzPkaj8ZDlJ+xV4pyX8kFH9zIAQy/WSjaTds05snSEyGoNj01
       pXyWSx/kdU7643Nh/cu4bMgZrcqCTwcIKT8DQ9Fk0TL8jzIkGlm6StjJUeHPXwmM
       GZfQ/prHfdfj1DJJq4sXbvamZHBGTOCm2fezrCGFTkQ6CIHjSuWF6POz+wvUweBo
       eDrqw/Vw/aMNCWWLdkGofNZPO5EiOpXTLqaC4zn3HaMunqjadOgez6++CVYNQbD8
       /JFL98z0dnsDsLOEuEdu6dnlQihtMrSsk1VBnGdhdhq4ZmcQCKExBZTvoKZoACOH
       Hf+PPPteeeOjDRKGJoIYpL++0K4a2ilQdMdZCIFW+OcnU3LrhvW7Uatoc5mJb+id
       evlryJKxwYUOkfvD9R9c6JQAiUO0WU2CrsC4gLHFdz7xM4mwTvXPKKakpSJyWfk2
       xrdQcLRK7MxQ/IdTXtCWXm59ZM0FoBhuxVDI3DfqQxFUntD1xF+dzzIQS9oTuJf/
       df9FmLjivOlwHg3a8NE6Hc9RDPyHuqYzywIE7PlkgTykyzl6m2jn+zOU6YED3htM
       Stci8+r0/R33gPsTixQh/DUIQxfsUk1UyxgGV8WIppKw3m5bl0LdJMK8WwmfaEdy
       IqOCEmklKe/669SwFvrBUt7SHqIyC/vWVILu2l3Co7cRWjuAd1S5Ds8vaMYt6H8e
       E+1boyqALCp6sC1doBYnheXuhwBVqphrkd+dyQABsBSMLgAAg5Sj2bHEZ/sCAAAA
       AARZWg==
       '''
       d=json.loads(lzma.decompress(base64.b64decode(
        ''.join(packed.split()))))
       assert d['schema']=='R746-VISUAL-TIMELINE-48-NO-IPA'
       assert len(before)==d['baseline_count']
       assert tree(before)==d['base_tree']
       for n,b in before.items():
        p=pathlib.PurePosixPath(n)
        assert p.parts and '..' not in p.parts and not p.is_absolute()
        f=root/n;f.parent.mkdir(parents=True,exist_ok=True)
        f.write_bytes(b)
       for item in d['patches']:
        n=item['path'];f=root/n
        assert n in before and sha(before[n])==item['before']
        lines=f.read_text().splitlines(keepends=True)
        end=0;new=[]
        for lo,hi,part in item['hunks']:
         assert end<=lo<=hi<=len(lines)
         new.extend(lines[end:lo]);new.append(part);end=hi
        new.extend(lines[end:]);b=''.join(new).encode()
        assert sha(b)==item['after']
        f.write_bytes(b)
       for item in d['additions']:
        n=item['path'];f=root/n;b=item['contents'].encode()
        assert n not in before and not f.exists()
        assert sha(b)==item['sha256']
        f.parent.mkdir(parents=True,exist_ok=True)
        f.write_bytes(b)
       h={p.relative_to(root).as_posix():sha(p.read_bytes())
        for p in root.rglob('*') if p.is_file()
        and p.name!='source_manifest.json'}
       m=root/'source_manifest.json'
       m.write_text(json.dumps(h,sort_keys=True,indent=2,
        ensure_ascii=False)+'\n')
       assert sha(m.read_bytes())==d['manifest_sha256']
       now={p.relative_to(root).as_posix():p.read_bytes()
        for p in root.rglob('*') if p.is_file()}
       assert len(now)==d['final_count']==374
       assert set(before)<=set(now) and tree(now)==d['after_tree']
       (pathlib.Path('R746Proof')/'SOURCE_HASHES.json').write_text(
        json.dumps({n:sha(b) for n,b in now.items()},sort_keys=True))
       print('R746_RESTORE_374_SHA_PASS_ZERO_DELETION')
       PYTHON
    - name: XCTest iPhoneOS and 48-frame regression NO IPA
      shell: bash
      run: |
       set -euo pipefail
       (cd source/R720_PORTABLE_TESTS && swift test -j 2) \
        > R746Proof/Swift.log 2>&1 || {
         tail -n 45 R746Proof/Swift.log;exit 1;
        }
       grep -Fq 'Executed 226 tests, with 0 failures' \
        R746Proof/Swift.log
       cp source/tests/R746FrameBudgetTests.swift \
        "$RUNNER_TEMP/main.swift"
       swiftc \
        source/app/ios/ChampionsOnDevice/R593VisualChangeEvidence.swift \
        source/app/ios/ChampionsOnDevice/R594ActorAppearance.swift \
        source/app/ios/ChampionsOnDevice/R595FormReferenceMatcher.swift \
        source/app/ios/ChampionsOnDevice/R680MegaReferenceSeeds.swift \
        "$RUNNER_TEMP/main.swift" -o "$RUNNER_TEMP/r746check"
       "$RUNNER_TEMP/r746check" > R746Proof/Frame48.log
       grep -Fq 'R746_FRAME_BUDGET_48_AND_SAFE_HOLD_PASS' \
        R746Proof/Frame48.log
       python3 source/tools/r745_read_path_gate.py \
        > R746Proof/ReadPath.log
       python3 source/tools/r742_live_path_audit.py
       python3 source/tools/r743_macos_compat_audit.py
       swiftc -frontend -parse source/app/ios/ChampionsOnDevice/*.swift
       python3 source/tools/generate_xcode_project.py
       xcodebuild -project source/app/ios/ChampionsOnDeviceResearch.xcodeproj \
        -scheme ChampionsOnDeviceResearch -configuration Debug \
        -sdk iphoneos -destination 'generic/platform=iOS' \
        ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
        -derivedDataPath "$RUNNER_TEMP/r746" build \
        > R746Proof/iPhoneOS.log 2>&1 || {
         grep -E 'error:|BUILD FAILED' R746Proof/iPhoneOS.log || true
         exit 1;
        }
       grep -Fq 'BUILD SUCCEEDED' R746Proof/iPhoneOS.log
       python3 - <<'PYTHON'
       import json,hashlib,pathlib,zipfile
       root=pathlib.Path('source');out=pathlib.Path('R746Proof')
       h=json.loads((out/'SOURCE_HASHES.json').read_text())
       assert len(h)==374
       zpath=out/'R746_ALL_EDITABLE_SOURCE_RECOVERY.zip'
       with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED) as z:
        for n in sorted(h):
         b=(root/n).read_bytes()
         assert hashlib.sha256(b).hexdigest()==h[n]
         z.writestr(n,b)
       with zipfile.ZipFile(zpath) as z:
        assert z.testzip() is None and len(z.namelist())==374
       (out/'STATUS.txt').write_text(
        'R746 Mac and iPhoneOS compile only. NO IPA.\n'
        '79 gameplay fields and Mega recognition uncertified.\n')
       assert sum(f.stat().st_size for f in out.rglob('*')
        if f.is_file())<16_000_000
       print('R746_NO_IPA_SOURCE_ONLY_SUCCESS')
       PYTHON
    - name: Upload R746 source and diagnostics NO IPA
      uses: actions/upload-artifact@v4
      with:
        name: R746-48-frame-source-gate-NO-IPA
        path: R746Proof/
        retention-days: 3
        if-no-files-found: error
