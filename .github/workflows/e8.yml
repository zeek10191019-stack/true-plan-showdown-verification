name: R746 48 Frame Evidence Compile Gate - NO IPA
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/e8.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  check:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
    - name: Restore pinned R745 and R746 lossless changes
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
       set -euo pipefail
       mkdir -p source R746Proof
       url='https://api.github.com/repos/'
       url+='zeek10191019-stack/'
       url+='true-plan-showdown-verification/'
       url+='actions/artifacts/13769570656/zip'
       curl -fLsS --retry 2 \
        -H "Authorization: Bearer $GH_TOKEN" \
        -H 'Accept: application/vnd.github+json' \
        "$url" -o /tmp/r745.zip
       python3 - <<'PYTHON'
       import pathlib,hashlib,zipfile,io,json,base64,lzma
       root=pathlib.Path('source')
       sha=lambda b:hashlib.sha256(b).hexdigest()
       def tree(d):
        s=''.join(n+'\t'+sha(d[n])+'\n' for n in sorted(d))
        return sha(s.encode())
       with zipfile.ZipFile('/tmp/r745.zip') as z:
        assert z.testzip() is None
        raw=z.read('R745_ALL_EDITABLE_SOURCE_RECOVERY.zip')
       with zipfile.ZipFile(io.BytesIO(raw)) as z:
        assert z.testzip() is None
        before={n:z.read(n) for n in z.namelist()}
       assert len(before)==372
       packed='''
       /Td6WFoAAATm1rRGAgAhARwAAAAQz1jM4BcLChRdAD2IiCaMv+S5PfoHFjKJRHPG
