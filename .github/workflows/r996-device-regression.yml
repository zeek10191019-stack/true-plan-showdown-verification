name: R996 recorded selection regression and verified iPhone IPA
'on':
  push:
    branches:
    - r987-ocr-pc-regression
    paths:
    - .github/workflows/r996-device-regression.yml
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: r996-verified-device-ipa
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  GH_TOKEN: ${{ github.token }}
jobs:
  verify:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && !github.event.repository.private
      && github.ref == 'refs/heads/r987-ocr-pc-regression'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: .github/workflows/r996-device-regression.yml
    - name: Restore verified R995 and apply the R996 patch
      shell: bash
      run: |
        set -euo pipefail
        work="$RUNNER_TEMP/r996"
        mkdir -p "$work"
        prior="$work/r995.yml"
        git show '5eebfff8d8d43c3cc7432aafbb39dd0724fc3c3c:.github/workflows/r995-device-readout-regression.yml' > "$prior"
        echo '1dd7ad209b3dedb78d8f94ac1367608be42bbfea1f11700def141bb87e5de9e5  r995.yml' |
          (cd "$work" && shasum -a 256 -c -)
        ruby -ryaml -e '
          steps = YAML.load_file(ARGV[0], aliases: true).fetch("jobs").fetch("verify").fetch("steps")
          puts steps.find { |step| step.fetch("name","").start_with?("Restore the verified R993") }.fetch("run")
        ' "$prior" > "$work/restore.sh"
        bash "$work/restore.sh"
        root=pinned-r793/source
        echo '427e7315d7ab29f79f9e43fecb610db43ac61c6ba41d1e03b02fc7821dbd2cac  source_manifest.json' | (cd "$root" && shasum -a 256 -c -)
        python3 - "$work" <<'PAYLOAD'
        import base64, hashlib, sys
        from pathlib import Path

        directory = Path(sys.argv[1])
        files = {'r996-readout.patch': ['382fb2026ae7c73502916a61fe22274e424718aa8513dd9dad846d6faef54c4b', ''], 'R996SelectionRetentionTests.swift': ['d9417e3ab6d5ddb788abde1ac9c8e57701a990ec289b2d778bcfee840698a970', ''], 'r995-selection-fixture.json': ['72e24e4d7ce296024131d8bae3f2eb6caf082ac48903d5a4b7b36e76e1dd089d', '']}
        for name, (expected, encoded) in files.items():
            data = base64.b64decode(encoded, validate=True)
            assert hashlib.sha256(data).hexdigest() == expected, name
            (directory / name).write_bytes(data)
        PAYLOAD
        cp "$root/R720_PORTABLE_TESTS/Sources/R719Core/R987BattleReadout.swift" "$work/R995BattleReadout.swift"
        patch -s -p1 -F 0 -N -t -d "$root" < "$work/r996-readout.patch"
        python3 - "$root" <<'MANIFEST'
        import hashlib, json, sys
        from pathlib import Path

        root = Path(sys.argv[1])
        manifest = root / "source_manifest.json"
        before = json.loads(manifest.read_bytes())
        after = {p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob("*") if p.is_file() and p != manifest}
        expected = {'app/ios/ChampionsOnDevice/CaptureCoordinator.swift': '3605b4e8ffc659063be5b02e183027f897f2ddb1acfc252ffe90020a10d67c58', 'app/ios/ChampionsOnDevice/R987BattleReadout.swift': '16ebe29cc137e4c5782c4a3a04c9a1d1c4f12820fd312d38989dc7692b7f1fec', 'R720_PORTABLE_TESTS/Sources/R719Core/R987BattleReadout.swift': '16ebe29cc137e4c5782c4a3a04c9a1d1c4f12820fd312d38989dc7692b7f1fec'}
        assert before.keys() == after.keys()
        assert {k:after[k] for k in before if before[k] != after[k]} == expected
        manifest.write_text(json.dumps(after,sort_keys=True,indent=2)+"\n")
        print("R996_SOURCE_AND_TEST_MIRROR_VERIFIED",len(after))
        MANIFEST
    - name: Replay Apple Vision and archive, Swift and browser regressions
      shell: bash
      run: |
        set -euo pipefail
        prior="$RUNNER_TEMP/r994/r993-pinned.yml"
        ruby -ryaml -e '
          doc = YAML.load_file(ARGV[0], aliases: true)
          steps = doc.fetch("jobs").fetch(ARGV[1]).fetch("steps")
          puts steps.find { |step| step["name"] == ARGV[2] }.fetch("run")
        ' "$prior" vision 'Replay Apple Vision on macOS 26' > "$RUNNER_TEMP/r994/vision.sh"
        bash "$RUNNER_TEMP/r994/vision.sh"
        ruby -ryaml -e '
          doc = YAML.load_file(ARGV[0], aliases: true)
          steps = doc.fetch("jobs").fetch(ARGV[1]).fetch("steps")
          puts steps.find { |step| step["name"] == ARGV[2] }.fetch("run")
        ' "$prior" verify 'Run Swift, archive and browser regressions' > "$RUNNER_TEMP/r994/legacy.sh"
        bash "$RUNNER_TEMP/r994/legacy.sh"
    - name: Verify the existing recorded turn-one, history and coverage regressions
      shell: bash
      run: |
        set -euo pipefail
        root=pinned-r793/source
        focused="$RUNNER_TEMP/r966-test/R720_PORTABLE_TESTS"
        artifact="$RUNNER_TEMP/r994"
        core=Sources/R719Core/R987BattleReadout.swift
        test=Tests/R719CoreTests/R994RecordedReadoutTests.swift
        cp "$artifact/R994RecordedReadoutTests.swift" "$focused/$test"
        cp "$artifact/R995ReadoutCoverageTests.swift" "$focused/Tests/R719CoreTests/R995ReadoutCoverageTests.swift"
        cp "$root/R720_PORTABLE_TESTS/Sources/R719Core/R936OCRDiagnostics.swift" "$focused/Sources/R719Core/R936OCRDiagnostics.swift"
        export R993_REPLAY_FIXTURE="$artifact/r993-recorded-observations.jsonl"
        restore_fixed() { cp "$root/R720_PORTABLE_TESTS/$core" "$focused/$core"; }
        trap restore_fixed EXIT
        cp "$artifact/R993BattleReadout.swift" "$focused/$core"
        R993_EXPECT_BASELINE=1 swift test --package-path "$focused" --jobs 2   --filter R994RecordedReadoutTests 2>&1 | tee "$artifact/baseline.log"
        grep -Eq 'Executed 1 test, with 0 failures' "$artifact/baseline.log"
        restore_fixed
        swift test --package-path "$focused" --jobs 2   --filter 'R994RecordedReadoutTests|R991NameIndependentReadoutTests|R995ReadoutCoverageTests' 2>&1 | tee "$artifact/fixed.log"
        grep -E 'testR993RecordedTurnOneThroughHistory.*passed' "$artifact/fixed.log"
        grep -E 'testAmbiguousOwnSlotIsNotGuessedAndSwitchDropsFormerHP.*passed' "$artifact/fixed.log"
        grep -E 'testNextCommandDropsPreviousHPAndResumesWithKnownRosterSlot.*passed' "$artifact/fixed.log"
        grep -E 'testWitnessedProjectedAndUnseenEventsStayDistinct.*passed' "$artifact/fixed.log"
        echo R995_RECORDED_REPLAY_AND_DIAGNOSTIC_REGRESSION_PASS
    - name: Replay the R995 six-slot regression against baseline and fixed source
      shell: bash
      run: |
        set -euo pipefail
        root=pinned-r793/source
        work="$RUNNER_TEMP/r996"
        focused="$RUNNER_TEMP/r966-test/R720_PORTABLE_TESTS"
        source="$focused/Sources/R719Core/R987BattleReadout.swift"
        cp "$work/R996SelectionRetentionTests.swift" "$focused/Tests/R719CoreTests/R996SelectionRetentionTests.swift"
        export R995_SELECTION_FIXTURE="$work/r995-selection-fixture.json"
        restore_fixed() { cp "$root/R720_PORTABLE_TESTS/Sources/R719Core/R987BattleReadout.swift" "$source"; }
        trap restore_fixed EXIT
        cp "$work/R995BattleReadout.swift" "$source"
        R996_EXPECT_BASELINE=1 swift test --package-path "$focused" --jobs 2 \
          --filter R996SelectionRetentionTests 2>&1 | tee "$work/baseline.log"
        restore_fixed
        swift test --package-path "$focused" --jobs 2 --filter R996SelectionRetentionTests 2>&1 |
          tee "$work/fixed.log"
        for check in baseline fixed; do
          grep -E 'Test Case .*testRecordedR995PreviewKeepsAllSixThroughPreparation.*passed' "$work/$check.log"
          grep -E 'Executed 1 test, with 0 failures' "$work/$check.log"
        done
  package:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && !github.event.repository.private
      && github.ref == 'refs/heads/r987-ocr-pc-regression'
    needs: verify
    runs-on: xcode-27
    timeout-minutes: 24
    permissions:
      contents: write
    env:
      RELEASE_TAG: r996-verified-device-test
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: .github/workflows/r996-device-regression.yml
    - name: Restore the exact R996 source that passed
      shell: bash
      run: |
        set -euo pipefail
        work="$RUNNER_TEMP/r996"
        mkdir -p "$work"
        prior="$work/r995.yml"
        git show '5eebfff8d8d43c3cc7432aafbb39dd0724fc3c3c:.github/workflows/r995-device-readout-regression.yml' > "$prior"
        echo '1dd7ad209b3dedb78d8f94ac1367608be42bbfea1f11700def141bb87e5de9e5  r995.yml' |
          (cd "$work" && shasum -a 256 -c -)
        ruby -ryaml -e '
          steps = YAML.load_file(ARGV[0], aliases: true).fetch("jobs").fetch("verify").fetch("steps")
          puts steps.find { |step| step.fetch("name","").start_with?("Restore the verified R993") }.fetch("run")
        ' "$prior" > "$work/restore.sh"
        bash "$work/restore.sh"
        root=pinned-r793/source
        echo '427e7315d7ab29f79f9e43fecb610db43ac61c6ba41d1e03b02fc7821dbd2cac  source_manifest.json' | (cd "$root" && shasum -a 256 -c -)
        python3 - "$work" <<'PAYLOAD'
        import base64, hashlib, sys
        from pathlib import Path

        directory = Path(sys.argv[1])
        files = {'r996-readout.patch': ['382fb2026ae7c73502916a61fe22274e424718aa8513dd9dad846d6faef54c4b', ''], 'R996SelectionRetentionTests.swift': ['d9417e3ab6d5ddb788abde1ac9c8e57701a990ec289b2d778bcfee840698a970', ''], 'r995-selection-fixture.json': ['72e24e4d7ce296024131d8bae3f2eb6caf082ac48903d5a4b7b36e76e1dd089d', '']}
        for name, (expected, encoded) in files.items():
            data = base64.b64decode(encoded, validate=True)
            assert hashlib.sha256(data).hexdigest() == expected, name
            (directory / name).write_bytes(data)
        PAYLOAD
        cp "$root/R720_PORTABLE_TESTS/Sources/R719Core/R987BattleReadout.swift" "$work/R995BattleReadout.swift"
        patch -s -p1 -F 0 -N -t -d "$root" < "$work/r996-readout.patch"
        python3 - "$root" <<'MANIFEST'
        import hashlib, json, sys
        from pathlib import Path

        root = Path(sys.argv[1])
        manifest = root / "source_manifest.json"
        before = json.loads(manifest.read_bytes())
        after = {p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob("*") if p.is_file() and p != manifest}
        expected = {'app/ios/ChampionsOnDevice/CaptureCoordinator.swift': '3605b4e8ffc659063be5b02e183027f897f2ddb1acfc252ffe90020a10d67c58', 'app/ios/ChampionsOnDevice/R987BattleReadout.swift': '16ebe29cc137e4c5782c4a3a04c9a1d1c4f12820fd312d38989dc7692b7f1fec', 'R720_PORTABLE_TESTS/Sources/R719Core/R987BattleReadout.swift': '16ebe29cc137e4c5782c4a3a04c9a1d1c4f12820fd312d38989dc7692b7f1fec'}
        assert before.keys() == after.keys()
        assert {k:after[k] for k in before if before[k] != after[k]} == expected
        manifest.write_text(json.dumps(after,sort_keys=True,indent=2)+"\n")
        print("R996_SOURCE_AND_TEST_MIRROR_VERIFIED",len(after))
        MANIFEST
    - name: Build the iPhoneOS 27 arm64 target
      shell: bash
      run: |
        set -euo pipefail
        xcodebuild -version | tee "$RUNNER_TEMP/xcode-version.log"
        grep -Eq '^Xcode 27([.[:space:]]|$)' "$RUNNER_TEMP/xcode-version.log"
        sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
        [[ "${sdk%%.*}" == 27 ]]
        set -euo pipefail
        root=pinned-r793/source
        xcodebuild -project "$root/app/ios/ChampionsOnDeviceResearch.xcodeproj"   -scheme ChampionsOnDeviceResearch -configuration Release -sdk iphoneos   -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/r996/build"   ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/r996/native.log"
        grep -F 'BUILD SUCCEEDED' "$RUNNER_TEMP/r996/native.log"
        app="$RUNNER_TEMP/r996/build/Build/Products/Release-iphoneos/ChampionsOnDeviceResearch.app"
        test "$(lipo -archs "$app/ChampionsOnDeviceResearch")" = arm64
    - name: Validate and publish the unsigned IPA
      shell: bash
      run: |
        set -euo pipefail
        export VERIFIED_SHA="$GITHUB_SHA" VERIFIED_RUN="$GITHUB_RUN_ID" BUILD_RUN="$GITHUB_RUN_ID"
        work="$RUNNER_TEMP/r996-package"
        app="$RUNNER_TEMP/r996/build/Build/Products/Release-iphoneos/ChampionsOnDeviceResearch.app"
        bundle="$work/Payload/ChampionsOnDeviceResearch.app"
        mkdir -p "$work/Payload" "$work/draft-readback" "$work/public-readback"
        ditto "$app" "$bundle"
        cd "$work"
        /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 996' "$bundle/Info.plist"
        /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 0.9.96' "$bundle/Info.plist"
        zip -qry R996_Unsigned_DeviceTest.ipa Payload

        python3 - "$app" <<'PY'
        import hashlib, json, os, plistlib, struct, sys, zipfile
        from pathlib import Path

        original = Path(sys.argv[1])
        bundle = Path("Payload/ChampionsOnDeviceResearch.app")
        ipa = Path("R996_Unsigned_DeviceTest.ipa")
        packaged = {p.relative_to(bundle):p for p in bundle.rglob("*") if p.is_file()}
        built = {p.relative_to(original):p for p in original.rglob("*") if p.is_file()}
        assert built.keys() == packaged.keys()
        for name in built:
            if name != Path("Info.plist"):
                assert built[name].read_bytes() == packaged[name].read_bytes(), name
        info = plistlib.loads((bundle / "Info.plist").read_bytes())
        original_info = plistlib.loads((original / "Info.plist").read_bytes())
        assert {k for k in info.keys() | original_info.keys() if info.get(k) != original_info.get(k)} == {
            "CFBundleVersion", "CFBundleShortVersionString"
        }
        assert (info["CFBundleIdentifier"], info["CFBundleVersion"], info["CFBundleShortVersionString"],
                info["MinimumOSVersion"], info["DTPlatformName"]) == (
                "com.zeek10191019.championsresearch", "996", "0.9.96", "27.0", "iphoneos")
        assert info["NSLocalNetworkUsageDescription"] and "screen-capture" in info["UIBackgroundModes"]
        assert not (bundle / "embedded.mobileprovision").exists()
        assert not (bundle / "_CodeSignature").exists()
        with zipfile.ZipFile(ipa) as archive:
            assert archive.testzip() is None
            names = [entry.filename for entry in archive.infolist() if not entry.is_dir()]
            files = {p.as_posix():p for p in packaged.values()}
            assert len(names) == len(set(names)) and set(names) == set(files)
            assert all(archive.read(name) == files[name].read_bytes() for name in names)

        for binary in [bundle / info["CFBundleExecutable"], *bundle.glob("*.dylib")]:
            data = binary.read_bytes()
            magic, cpu, _, kind, commands, command_bytes, *_ = struct.unpack_from("<8I", data)
            assert magic == 0xfeedfacf and cpu == 0x0100000c and kind in (2, 6), binary
            offset, platforms = 32, []
            for _ in range(commands):
                command, size = struct.unpack_from("<2I", data, offset)
                assert size >= 8 and offset + size <= len(data) and command != 29, binary
                if command == 50:
                    platforms.append(struct.unpack_from("<I", data, offset + 8)[0])
                offset += size
            assert offset == 32 + command_bytes and platforms == [2], binary

        sha = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
        source = Path(os.environ["GITHUB_WORKSPACE"]) / "pinned-r793/source/source_manifest.json"
        report = {
            "build": 996, "version": "0.9.96", "signed": False, "min_ios": "27.0",
            "ipa": {"name": ipa.name, "bytes": ipa.stat().st_size, "sha256": sha(ipa)},
            "source_workflow_commit": os.environ["VERIFIED_SHA"],
            "source_manifest_sha256": sha(source),
            "passed_regression_run": int(os.environ["VERIFIED_RUN"]),
            "passed_native_build_run": int(os.environ["BUILD_RUN"]),
            "packaging_workflow_commit": os.environ["GITHUB_SHA"],
            "packaging_run": int(os.environ["GITHUB_RUN_ID"]),
            "physical_retest_status": "PENDING",
        }
        Path("VERIFICATION_R996.json").write_text(json.dumps(report, indent=2) + "\n")
        print("R996_IPA_VERIFIED", json.dumps(report))
        PY

        assets=(R996_Unsigned_DeviceTest.ipa VERIFICATION_R996.json)
        if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish > existing.json 2>/dev/null; then
          jq -e --arg commit "$GITHUB_SHA" '.isDraft and .targetCommitish == $commit' existing.json
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
        else
          gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease \
            --title 'R996 iPhone実機試験 0.9.96' \
            --notes 'Windows PCにダウンロードする未署名のiPhoneOS 27.0以降・arm64用IPA。実機ログの再生と既存の回帰試験に合格したR996を収録。導入前に署名してください。'
        fi
        for asset in "${assets[@]}"; do
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir draft-readback
          cmp "$asset" "draft-readback/$asset"
        done

        gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
        for asset in "${assets[@]}"; do
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$asset"
          curl --fail -sSL --retry 4 --retry-all-errors "$url" -o "public-readback/$asset"
          cmp "$asset" "public-readback/$asset"
          printf 'R996_PUBLIC_READBACK_VERIFIED %s\n' "$url"
        done
