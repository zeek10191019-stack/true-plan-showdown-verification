        for f in root.rglob('*')
        if f.is_file() and '.build' not in f.parts
        and f.name!='source_manifest.json'
       }
       m=root/'source_manifest.json'
       m.write_text(json.dumps(manifest,indent=2,sort_keys=True,
                      ensure_ascii=False)+'\n')
       assert digest(m.read_bytes())==patch['manifest_sha256']
       files=sorted(p for p in root.rglob('*') if p.is_file()
                    and '.build' not in p.parts)
       names=[p.relative_to(root).as_posix() for p in files]
       assert len(files)==341 and len(set(names))==341
       sha={n:digest(p.read_bytes()) for n,p in zip(names,files)}
       tree=''.join(n+'\t'+sha[n]+'\n' for n in names).encode()
       assert digest(tree)==patch['final_tree_sha256']
       dest=pathlib.Path('R739Artifacts/R739_SOURCE_HASHES.json')
       dest.write_text(json.dumps(sha,sort_keys=True,indent=2)+'\n')
       print('R739_SOURCE_341_SHA_PASS_NO_DELETE')
       PYTHON
    - name: Swift regression and iPhoneOS build
      shell: bash
      run: |
       set -euo pipefail
       (cd source/R720_PORTABLE_TESTS && swift test -j 2) \
        > R739Artifacts/SwiftTests.log 2>&1 || {
         tail -n 90 R739Artifacts/SwiftTests.log;exit 1;
        }
       grep -Fq 'Executed 192 tests, with 0 failures' \
        R739Artifacts/SwiftTests.log
       swiftc -frontend -parse source/app/ios/ChampionsOnDevice/*.swift
       python3 source/tools/generate_xcode_project.py
       xcodebuild -project source/app/ios/ChampionsOnDeviceResearch.xcodeproj \
        -scheme ChampionsOnDeviceResearch -configuration Debug \
        -sdk iphoneos -destination 'generic/platform=iOS' \
        ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
        -derivedDataPath "$RUNNER_TEMP/r739-app" build \
        > R739Artifacts/iPhoneOS.log 2>&1 || {
         grep -E 'error:|BUILD FAILED' R739Artifacts/iPhoneOS.log || true
         exit 1;
        }
       grep -Fq 'BUILD SUCCEEDED' R739Artifacts/iPhoneOS.log
       python3 - <<'PYTHON'
       import pathlib,hashlib,json,zipfile,plistlib,os
       root=pathlib.Path('source');out=pathlib.Path('R739Artifacts')
       sha=json.loads((out/'R739_SOURCE_HASHES.json').read_text())
       assert len(sha)==341
       for n,digest in sha.items():
        assert hashlib.sha256((root/n).read_bytes()).hexdigest()==digest
       zipout=out/'R739_ALL_EDITABLE_SOURCE_RECOVERY.zip'
       with zipfile.ZipFile(zipout,'w',compression=zipfile.ZIP_DEFLATED) as z:
        for n in sorted(sha):z.write(root/n,n)
       with zipfile.ZipFile(zipout) as z:
        assert z.testzip() is None and len(z.namelist())==341
        for n,digest in sha.items():
         assert hashlib.sha256(z.read(n)).hexdigest()==digest
       derived=pathlib.Path(os.environ['RUNNER_TEMP']) / \
        'r739-app/Build/Products/Debug-iphoneos'
       app=derived/'ChampionsOnDeviceResearch.app'
       assert (app/'ChampionsOnDeviceResearch').is_file()
       plist=plistlib.loads((app/'Info.plist').read_bytes())
       assert plist['CFBundleVersion']=='739'
       assert plist['CFBundleShortVersionString']=='0.7.39'
       ipa=out/'R739_Unsigned_Research.ipa'
       with zipfile.ZipFile(ipa,'w',compression=zipfile.ZIP_DEFLATED) as z:
        for file in sorted(app.rglob('*')):
         assert not file.is_symlink()
         if file.is_file():
          arc='Payload/'+app.name+'/'
          arc+=file.relative_to(app).as_posix()
          z.write(file,arc)
       with zipfile.ZipFile(ipa) as z:assert z.testzip() is None
       assert ipa.stat().st_size<16_000_000
       (out/'CERTIFICATION.txt').write_text(
         'CI compilation does not certify device recognition.\n'
         '79 fields and OCR below 1 second remain unverified.\n')
       print('R739_IPHONEOS_SOURCE_AND_UNSIGNED_IPA_PASS')
       PYTHON
    - name: Public artifact budget and no paid overage guard
      shell: bash
      run: |
       python3 - <<'PYTHON'
       import pathlib
       root=pathlib.Path('R739Artifacts')
       size=sum(p.stat().st_size for p in root.rglob('*') if p.is_file())
       assert size<16_000_000,('R739_ARTIFACT_SIZE_HOLD',size)
       print('R739_PUBLIC_ARTIFACT_BUDGET_PASS',size)
       PYTHON
