       assert patch['base_file_count']==324
       for name,info in patch['replace'].items():
        path=root/name
        old=path.read_bytes()
        assert digest(old)==info['original_sha256']
        content=old.decode('utf8')
        for start,end,replacement in reversed(info['edits']):
         content=content[:start]+replacement+content[end:]
        result=content.encode('utf8')
        assert digest(result)==info['final_sha256']
        path.write_bytes(result)
