       set -euo pipefail
       url='https://api.github.com/repos/'
       url+='zeek10191019-stack/'
       url+='true-plan-showdown-verification/'
       url+='actions/artifacts/13734755873/zip'
       curl -fLsS --retry 2 -H "Authorization: Bearer $GH_TOKEN" \
        -H 'Accept: application/vnd.github+json' \
        "$url" -o /tmp/r739-base.zip
       mkdir -p source R739Artifacts
       python3 - <<'PYTHON'
       import hashlib,json,pathlib,zipfile,io,base64,lzma
       root=pathlib.Path('source')
       digest=lambda b:hashlib.sha256(b).hexdigest()
       with zipfile.ZipFile('/tmp/r739-base.zip') as outer:
        assert outer.testzip() is None
        data=outer.read('R737_ALL_EDITABLE_SOURCE_RECOVERY.zip')
