  push:
    branches: [main]
    paths: ['.github/workflows/d9.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
    - name: Restore immutable R737 and apply full R739 delta
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
