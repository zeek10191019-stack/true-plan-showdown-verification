    - name: Apply R798 original CGImage DETAIL source correction with strict preimage SHA (NO IPA)
      id: patch798
      shell: bash
      run: "set -euo pipefail\nmkdir -p R798Proof\npython3 - <<'PYR798SOURCE'\nfrom pathlib import Path\nimport hashlib,json,re\n\
        root=Path('source')\nmanifest_path=root/'source_manifest.json'\nmanifest=json.loads(manifest_path.read_text())\nsha=lambda\
        \ b:hashlib.sha256(b).hexdigest()\nexpected={\n 'app/ios/ChampionsOnDevice/R560VisionExecutor.swift':'527621037735b113e92267259cdd5ff2cd0ad41a66752e76c3157d70fb9bb1a0',\n\
        \ 'app/ios/ChampionsOnDevice/R558FullFrameOCR.swift':'d6ef525877deb8f188bbc3173834ddd487a1d8ec2b9351976e6ad9da38b89350',\n\
        \ 'R720_PORTABLE_TESTS/Tests/R719CoreTests/R792AutomaticVisionInputTests.swift':'c5ff3020ed59052a18272c105d4c8253ef1eb2d0bf842340475d8919c9b0d5f3',\n\
        }\nfor path,original in expected.items():\n data=(root/path).read_bytes()\n assert sha(data)==original,(path,'UNEXPECTED_BASE_SOURCE_VERSION',sha(data))\n\
        \ assert manifest[path]==original,(path,'MANIFEST_PRECHECK_FAILED')\n\n# Keep manual and QUICK mode unchanged. Only\
        \ bounded automatic accurate detail\n# takes the same original CGImage that was already decoded and SHA-bound.\np='app/ios/ChampionsOnDevice/R560VisionExecutor.swift'\n\
        t=(root/p).read_text()\npattern='work: R551EvidenceWork?=nil, deadlineMs:Int?=nil,'\nassert t.count(pattern)==1,'EXECUTOR_SIGNATURE_CHANGED'\n\
        t=t.replace(pattern,'work: R551EvidenceWork?=nil, nativeOriginalImage: CGImage?=nil, deadlineMs:Int?=nil,',1)\nanchor='\
        \            configuration.performed=true\\n'\nassert t.count(anchor)==1,'EXECUTOR_HANDLER_ANCHOR_CHANGED'\ninputbinding='''\
        \            // R798: pixel-verified original image for bounded automatic DETAIL.\n            // QUICK and manual\
        \ modes continue to use the pre-existing CVPixelBuffer.\n            // Never change or reschedule the physical OCR\
        \ worker on this path.\n            let r798Handler: VNImageRequestHandler\n            if let original=nativeOriginalImage\
        \ {\n                guard original.width==CVPixelBufferGetWidth(input.buffer),\n                      original.height==CVPixelBufferGetHeight(input.buffer)\n\
        \                else {throw NSError(domain:\"R798_VISION_GEOMETRY_MISMATCH\",code:1)}\n                r798Handler=VNImageRequestHandler(cgImage:original,\n\
        \                    orientation:.up,options:options)\n            } else {\n                r798Handler=VNImageRequestHandler(cvPixelBuffer:input.buffer,\n\
        \                    orientation:.up,options:options)\n            }\n'''\nt=t.replace(anchor,anchor+inputbinding,1)\n\
        handler=r'try VNImageRequestHandler\\(cvPixelBuffer:input\\.buffer,\\s*orientation:\\.up,options:options\\)\\.perform\\\
        (\\[request\\]\\)'\nt,n=re.subn(handler,'try r798Handler.perform([request])',t)\nassert n==2,('EXECUTOR_OCR_CALL_COUNT_CHANGED',n)\n\
        (root/p).write_text(t)\n\np='app/ios/ChampionsOnDevice/R558FullFrameOCR.swift'\nt=(root/p).read_text()\nanchor='let\
        \ execution=try R560VisionExecutor.recognize(input,template:request,work:work,\\n'\nassert t.count(anchor)==1,'R558_EXACT_CALL_ANCHOR_CHANGED'\n\
        new='''let execution=try R560VisionExecutor.recognize(input,template:request,work:work,\n            nativeOriginalImage:\
        \ (!speedPriority && deadlineMs != nil) ? visionRaster : nil,\n'''\nt=t.replace(anchor,new,1)\n(root/p).write_text(t)\n\
        \np='R720_PORTABLE_TESTS/Tests/R719CoreTests/R792AutomaticVisionInputTests.swift'\nt=(root/p).read_text()\nneedle='try\
        \ VNImageRequestHandler(cvPixelBuffer:prepared.buffer,orientation:.up,options:[:]).perform([request])'\nassert t.count(needle)==1,'R792_TEST_INPUT_ANCHOR_CHANGED'\n\
        replacement='''// Match the R798 bounded automatic DETAIL CGImage input, without altering\n            // the existing\
        \ six-name, four-PP, three-move and HP assertions.\n            let handler=useOriginal ? VNImageRequestHandler(cgImage:detailRaster,\n\
        \                orientation:.up,options:[:]) : VNImageRequestHandler(cvPixelBuffer:prepared.buffer,\n           \
        \     orientation:.up,options:[:])\n            try handler.perform([request])'''\nt=t.replace(needle,replacement,1)\n\
        (root/p).write_text(t)\n\n# Recompute source_manifest.json (self-excluding); exact path inventory retained.\nfor p\
        \ in expected:\n manifest[p]=sha((root/p).read_bytes())\nmanifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2,sort_keys=True)+'\\\
