        \ .up, options: [:]).perform([request])\n    let ms = (ProcessInfo.processInfo.systemUptime - start) * 1000\n    let\
        \ observed: [[String: Any]] = (request.results ?? []).map { row in\n        let candidates = row.topCandidates(3).map\
        \ { item -> [String:Any] in\n            [\"text\":item.string, \"confidence\":Double(item.confidence)]\n        }\n\
        \        return [\"text_candidates\":candidates,\n                \"bbox_normalized\":[Double(row.boundingBox.minX),Double(row.boundingBox.minY),\n\
