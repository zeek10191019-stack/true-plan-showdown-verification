    - name: R807 audit all 81 Mega catalog entries and honest blind video availability (NO IPA)
      shell: bash
      run: "set -euo pipefail\nmkdir -p R807Proof\npython3 - <<'PYR807'\nfrom pathlib import Path\nimport json,re,hashlib\n\
        root=Path('source')\nsrc=(root/'app/ios/ChampionsOnDevice/R649MegaRegistryAudit.swift').read_text()\nblock=re.search(r'private\
        \ static let source = \"\"\"\\n(.*?)\\n\"\"\"',src,re.S)\nassert block is not None,'MEGA_CATALOG_BLOCK_MISSING'\n\
        rows=[line.split('|') for line in block.group(1).splitlines() if line.strip()]\nassert len(rows)==81,'MEGA_CATALOG_COUNT_UNEXPECTED'\n\
        assert all(len(r)==4 for r in rows),'MEGA_CATALOG_SCHEMA_BROKEN'\ncounts={phase:sum(r[3]==phase for r in rows) for\
        \ phase in ('M-A','M-B','M-C')}\nassert counts=={'M-A':59,'M-B':16,'M-C':6},'MEGA_PHASE_COVERAGE_CHANGED'\nkeys=[(r[0],r[2])\
        \ for r in rows]\nassert len(set(keys))==81,'MEGA_FORM_DUPLICATES'\nassert '\"mega_form_certified\":false' in src,'UNVERIFIED_MEGA_GATE_REMOVED'\n\
        assert '\"actual_game_image_accuracy\":\"NOT_MEASURED\"' in src,'MEGA_CERTIFICATION_INVENTED'\n\n# The actual saved\
        \ R718 ONE-tap MOV was forensically examined in R757.\n# It is NOT embedded in this public CI repository. No synthetic\
        \ video or\n# known labels can be passed as a \"blind real-video replay\".\nmovie_files=sorted(str(p.relative_to(root))\
        \ for p in root.rglob('*')\n                   if p.is_file() and p.suffix.lower() in {'.mov','.mp4','.m4v'})\nreviewed_reference_files=sorted(str(p.relative_to(root))\
        \ for p in root.rglob('R595FormReferenceCatalog.json')\n                                if p.is_file())\nreal_pngs=sorted(str(p.relative_to(root))\
        \ for p in root.rglob('r761_real_*.png') if p.is_file())\nassert len(real_pngs)>=2,'REAL_GAME_PNG_FIXTURES_MISSING'\n\
