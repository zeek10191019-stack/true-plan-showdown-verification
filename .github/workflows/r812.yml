    - name: R811 original R689 ZIP reject four byte/manifest/session mutations NO IPA
      if: matrix.lane == 'real-apple-vision'
      shell: bash
      run: "set -euo pipefail\nmkdir -p R811Proof\nR811_PRODUCTION_ARCHIVE=\"$RUNNER_TEMP/r810_export_original_production_writer.zip\"\
        \ \\\n python3 - <<'PYR811NEG' > R811Proof/ProductionArchiveTamperNegatives.log\n#!/usr/bin/env python3\n\"\"\"Non-shipping\
        \ R811 CI integration negative tests on real R689-written synthetic archive.\n\nNo user video or gameplay values.\
        \ Exits nonzero unless tampering is rejected.\n\"\"\"\nimport hashlib, io, json, os, pathlib, sys, tempfile, warnings,\
        \ zipfile\nsys.path.insert(0, str(pathlib.Path('source/tools').resolve()))\nimport r810_evidence_export_audit as checker\n\
        \narchive = pathlib.Path(os.environ['R811_PRODUCTION_ARCHIVE'])\noriginal = checker.audit(archive, verify_movie=False,\
        \ simulated=True)\nassert original['status'] == 'PACKAGE_BYTES_VERIFIED_NOT_DEVICE_CERTIFIED'\nassert original['synthetic_test_media']\
        \ is True\nassert original['frame_journal']['frame_deliveries'] == 422\nwith zipfile.ZipFile(archive) as zin:\n  \
        \  entries = {name: zin.read(name) for name in zin.namelist()}\n    assert len(entries) == len(zin.namelist())\n\n\
        with tempfile.TemporaryDirectory(prefix='r811_neg_') as td:\n    def emit(name, data, *, duplicate=False):\n     \
        \   out = pathlib.Path(td) / (name + '.zip')\n        with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_STORED)\
        \ as z:\n            for k, content in data.items(): z.writestr(k, content)\n            if duplicate:\n         \
        \       with warnings.catch_warnings():\n                    warnings.simplefilter('ignore', UserWarning)\n      \
        \              z.writestr('continuous/screen.mov',data['continuous/screen.mov'])\n        return out\n    def require_reject(tag,\
        \ data, reason, **kw):\n        path = emit(tag, data, **kw)\n        try:\n            checker.audit(path, simulated=True)\n\
        \        except checker.ArchiveAuditError as e:\n            assert reason in str(e), (tag, repr(e), reason)\n   \
        \         print('R811_REJECT_PASS',tag,str(e))\n        else:\n            raise AssertionError(('R811_UNSAFE_ARCHIVE_ACCEPTED',tag))\n\
        \n    broken = entries.copy()\n    mov = broken['continuous/screen.mov']\n    broken['continuous/screen.mov'] = (b'X'\
        \ if mov[:1] != b'X' else b'Z') + mov[1:]\n    require_reject('changed_movie_without_manifest',broken,'MANIFEST_SHA_OR_BYTES_MISMATCH')\n\
        \n    missing = entries.copy()\n    del missing['continuous/live_ocr.jsonl']\n    require_reject('dropped_ocr_sidecar',missing,'REQUIRED_EVIDENCE_MISSING')\n\
        \n    require_reject('duplicate_movie_name',entries,'ZIP_UNSAFE_DUPLICATE_OR_NOT_STORE',duplicate=True)\n\n    foreign\
        \ = entries.copy()\n    journal = [json.loads(s) for s in foreign['continuous/live_ocr.jsonl'].splitlines()]\n   \
        \ assert len(journal)>400\n    journal[-1]['session_id']='11111111-2222-4333-8444-555555555555'\n    foreign['continuous/live_ocr.jsonl']\
        \ = b''.join((json.dumps(row,sort_keys=True,separators=(',',':'))+'\\n').encode() for row in journal)\n    integrity\
        \ = json.loads(foreign['continuous/file_integrity.json'])\n    for row in integrity['files']:\n        if row['name']=='continuous/live_ocr.jsonl':\n\
        \            row['bytes']=len(foreign['continuous/live_ocr.jsonl'])\n            row['sha256']=hashlib.sha256(foreign['continuous/live_ocr.jsonl']).hexdigest()\n\
        \    foreign['continuous/file_integrity.json']=json.dumps(integrity,sort_keys=True,separators=(',',':')).encode()\n\
        \    require_reject('foreign_ocr_with_matching_sha_manifest',foreign,'CROSS_RECORDING_JOURNAL_TOKEN')\n\nprint('R811_PRODUCTION_ARCHIVE_MUTATION_NEGATIVE_4_OF_4_PASS_NO_DEVICE_CERTIFICATION')\n\
        \nPYR811NEG\ncat R811Proof/ProductionArchiveTamperNegatives.log\ngrep -F 'R811_PRODUCTION_ARCHIVE_MUTATION_NEGATIVE_4_OF_4_PASS_NO_DEVICE_CERTIFICATION'\
        \ R811Proof/ProductionArchiveTamperNegatives.log\n"
