          python3 pinned-r793/source/tools/generate_xcode_project.py
          python3 - <<'VERIFY'
          from pathlib import Path
          import hashlib,json
          root=Path('pinned-r793/source')
          ignore={'.build','.swiftpm','__pycache__'}
          files={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file() and not set(p.relative_to(root).parts)&ignore}
          assert {k:v for k,v in files.items() if k!='source_manifest.json'}==json.loads((root/'source_manifest.json').read_text())
          digest=hashlib.sha256(''.join(k+'\t'+files[k]+'\n' for k in sorted(files)).encode()).hexdigest()
          assert len(files)==691 and digest=='bbea4791801114eac158077d046f46166b0e081e57c061f43f1a68110e8aebf3',(len(files),digest)
          print('R947_SOURCE_VERIFIED',len(files),digest)
          VERIFY
      - name: Replay real status, inspection and animation evidence
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_26.3.app/Contents/Developer ]]; then
            export DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
          fi
          xcodebuild -version
          cd pinned-r793/source
          source_package="$PWD/R720_PORTABLE_TESTS"
          focused="$RUNNER_TEMP/r947-vision/R720_PORTABLE_TESTS"
          mkdir -p "$focused/Tests/R719CoreTests" "$RUNNER_TEMP/r947-vision/tests"
          cp "$source_package/Package.swift" "$focused/"
          cp -R "$source_package/Sources" "$focused/"
          cp -R tests/fixtures "$RUNNER_TEMP/r947-vision/tests/"
          for name in R893BattleStatusPanelTests R883InspectionPanelTests R761RealImageRegressionTests; do
            cp "$source_package/Tests/R719CoreTests/$name.swift" "$focused/Tests/R719CoreTests/"
          done
          swift test -c release --jobs 4 --package-path "$focused" --filter 'testPhoneStatusFromActualSelectedScreenshotRegions|testRetainedBuild715InspectionAndNonSelectedTransition|testScaledAndRotatedInspectionKeepAllSelectedNumbersBoundToSource|testActualAppleVisionReadsOpponentSandStreamFromRetainedCapture|testActualAppleVisionKnockOffOwnItemHistoryNeedsMatchingOwnCard' 2>&1 | tee "$RUNNER_TEMP/r947-vision.log"
          grep -F "testPhoneStatusFromActualSelectedScreenshotRegions]' passed" "$RUNNER_TEMP/r947-vision.log"

          grep -F "R947_RETAINED_ABILITY_TAB_FIELDS_REACH_JOURNAL" "$RUNNER_TEMP/r947-vision.log"
  publish:
    name: Publish and verify the tested IPA
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    needs: [verify, vision]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: r947-ipa
          path: R947Delivery
      - name: Publish and verify the download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd R947Delivery
          python3 - <<'VERIFY'
          import hashlib,json,os
          from pathlib import Path
          p=Path('R947_Unsigned_DeviceTest.ipa')
          r=json.loads(Path('VERIFICATION_R947.json').read_text())
          assert r['source_commit']==os.environ['GITHUB_SHA'] and r['build']==947
          assert r['ipa_bytes']==p.stat().st_size
          assert r['ipa_sha256']==hashlib.sha256(p.read_bytes()).hexdigest()
          VERIFY
          tag=r947-device-test
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft > existing.json 2>/dev/null; then
            test "$(jq -r .isDraft existing.json)" = true
            gh release upload "$tag" R947_Unsigned_DeviceTest.ipa VERIFICATION_R947.json --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" R947_Unsigned_DeviceTest.ipa VERIFICATION_R947.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title 'R947 iPhone 実機テスト 0.9.47' --notes '保存済みの実画像とログを使い、選択したポケモンのHP・特性・技・PPと、メガシンカ・持ち物・特性発動の証拠を修正。回収方式と保存データ管理はR946と同じです。79項目のiPhone実機認証は未完了です。'
          fi
          mkdir readback
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.ipa' --dir readback
          cmp R947_Unsigned_DeviceTest.ipa readback/R947_Unsigned_DeviceTest.ipa
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/R947_Unsigned_DeviceTest.ipa"
          curl --fail -sSL --retry 4 --retry-all-errors "$url" -o readback/published.ipa
          cmp R947_Unsigned_DeviceTest.ipa readback/published.ipa
          echo "R947_PUBLIC_READBACK_VERIFIED $url"
