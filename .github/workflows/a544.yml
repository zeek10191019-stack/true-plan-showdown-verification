name: R544 OCR Geometry Recovery and Field Evidence IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
      && github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - name: Verify pinned sources, fix R543 file-count bug, add R544 diagnostics, build IPA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY544'
          import urllib.request,hashlib,re,textwrap,ast,base64,lzma,json
          url='https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/33f612b03a90ff39a9d0087f07ee3c831b54b9f1/.github/workflows/a543.yml'
          with urllib.request.urlopen(url,timeout=60) as f: raw=f.read(12000)
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='f9648a70bbc223c939c6006cbb8e703f59b8e792','R543_WORKFLOW_CHANGED'
          m=re.search(rb"          python3 - <<'PY543'\n([\s\S]*?)\n          PY543",raw)
          assert m,'R543_BUILDER_LOADER_MISSING'
          source=textwrap.dedent(m.group(1).decode())
          marker="exec(compile(builder,'R543_BUILDER','exec'))"
          assert source.count(marker)==1,'R543_CAPTURE_ANCHOR_CHANGED'
          source=source.replace(marker,'__capture(builder)',1)
          builders=[]
          exec(compile(source,'R544_PINNED_PARENT_REPLAY','exec'),{'__capture':builders.append})
          assert len(builders)==1,'R543_PARENT_SCRIPT_NOT_CAPTURED'
          original=builders[0]
          assert hashlib.sha256(original.encode()).hexdigest()=='446406075e3e9ffeb0076db666f9282d6aacc5f508f6b0e54dc163f49a00a1c4','R543_PARENT_SHA_CHANGED'
