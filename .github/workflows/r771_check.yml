    - name: Source preservation and static capture gates
      id: checks
      if: >-
        always() && steps.patch.outcome == 'success'
        && matrix.lane == 'iphoneos-compile'
      shell: bash
      run: |
        set -euo pipefail
        for script in r761_preflight r742_live_path_audit \
          r743_macos_compat_audit r745_read_path_gate \
          r748_capture_path_gate; do
          python3 "source/tools/$script.py" \
            > "R771Proof/$script.log" 2>&1 || {
              cat "R771Proof/$script.log"; exit 1;
            }
        done
        python3 - <<'PYTIMER'
        from pathlib import Path
        p=Path('source/app/ios/ChampionsOnDevice/CaptureCoordinator.swift')
        matches=[line.strip() for line in p.read_text().splitlines()
                 if 'timer.schedule(deadline:' in line]
        assert len(matches)==1, matches
        probe=('import Foundation\nimport Dispatch\n'
               'func check() {\n'
               'let timer = DispatchSource.makeTimerSource()\n'
               +matches[0]+'\n}\n')
        Path('R771Proof/TimerTypecheck.swift').write_text(probe)
        PYTIMER
        swiftc -typecheck R771Proof/TimerTypecheck.swift \
          > R771Proof/TimerTypecheck.log 2>&1 || {
            cat R771Proof/TimerTypecheck.log; exit 1;
          }
        python3 - <<'PYGATE'
        from pathlib import Path
        app=Path('source/app/ios/ChampionsOnDevice')
        core=Path('source/R720_PORTABLE_TESTS/Sources/R719Core')
        for stem in ('R767QuickEpochExecutionPool',
                     'R766OCRWorkerLivenessLedger',
                     'R765OCRSourceLaneScheduler',
                     'R764CaptureLivenessLedger',
                     'R763CaptureGapLedger',
                     'R762SingleFrameConflictFence'):
         a=(app/(stem+'.swift')).read_bytes()
         b=(core/(stem+'.swift')).read_bytes()
         assert a==b,stem
        capture=(app/'CaptureCoordinator.swift').read_text()
        markers=(
         'r767QuickEpochPool.submit(epoch:quickEpoch',
         'R767_QUICK_RETIRED_BEFORE_VISION',
         'self.r766OCRWorkers.poll(nowMs:nowMs)',
         'r766OCRWorkers.deadline(lane:.quick',
         'r766OCRWorkers.deadline(lane:.detail',
         'r765SourceLanes.submitQuick {',
         'r765SourceLanes.submitDetail {',
         'r765SourceLanes.drainBeforeFinalizing()',
         'r764Liveness.observe(sessionToken:',
         'startR764Watchdog(token:',
         'r764Liveness.poll(sessionToken:',
         'r763GapLedger.observe(epoch:generation',
         'recognition/r763_callback_time_gaps.json')
        for m in markers:assert m in capture,m
        for m in ('recognition/r767_quick_epoch_workers.json',
                  'recognition/r766_physical_vision_workers.json',
                  'recognition/r764_callback_liveness.json'):
         assert capture.count(m)==2,(m,capture.count(m))
        assert 'R762SingleFrameConflictFence.filter(findings)' in (
         app/'R716SpatialFieldProjection.swift').read_text()
        assert 'r762_same_frame_conflicting_candidates_held' in (
         app/'R714CaptureAudit.swift').read_text()
        PYGATE
        python3 - <<'PYR769'
        from pathlib import Path
        app=Path('source/app/ios/ChampionsOnDevice')
        core=Path('source/R720_PORTABLE_TESTS/Sources/R719Core')
        stem='R769SplitHUDValueFusion.swift'
        assert (app/stem).read_bytes()==(core/stem).read_bytes()
        for folder in (app,core):
         p=(folder/'R716SpatialFieldProjection.swift').read_text()
         assert 'R769SplitHUDValueFusion.project(' in p
         assert 'R762SingleFrameConflictFence.filter(findings)' in p
        for folder in (app,core):
         p=(folder/'R761FieldSafetyContract.swift').read_text()
         assert 'R769SplitHUDValueFusion' in p
        for folder in (app,core):
         p=(folder/'R716SpatialFieldProjection.swift').read_text()
         assert 'R770: R716' in p
         assert 'let unique=moveGated.candidates.filter' in p
        assert (Path('source/tests/fixtures')/
                'r770_d33_apple_vision_rows.json').is_file()
        for folder in (app,core):
         r716=(folder/'R716SpatialFieldProjection.swift').read_text()
         r771=(folder/'R771MovePanelSlotGate.swift').read_text()
         assert 'R771MovePanelSlotGate.project(' in r716
         assert 'RIGHT_MOVE_PANEL_TEXT_UNVERIFIED' not in r716
         assert 'PP_CORROBORATED_MOVE_ROW_UNVERIFIED' in r771
         assert 'let unique=moveGated.candidates.filter' in r716
        assert (app/'R771MovePanelSlotGate.swift').read_bytes()==(
          core/'R771MovePanelSlotGate.swift').read_bytes()
        PYR769
        python3 - <<'PYDETAIL' 
        from pathlib import Path
        app=Path('source/app/ios/ChampionsOnDevice')
        core=Path('source/R720_PORTABLE_TESTS/Sources/R719Core')
        for stem in ('R768DetailEpochExecutionPool',
                     'R768EpochReadWorkSlots','R766OCRWorkerLivenessLedger'):
         assert (app/(stem+'.swift')).read_bytes()==(
          core/(stem+'.swift')).read_bytes()
        source=(app/'CaptureCoordinator.swift').read_text()
        for marker in ('R768_DETAIL_RETIRED_BEFORE_VISION',
                       'R768_DETAIL_CAPACITY_HELD_NO_VISION',
                       'r768DetailEpochPool.submit(epoch:Int64(ep)',
                       'liveReadWorkSlot.rollover(epoch:generation)'):
         assert marker in source,marker
        assert source.count('recognition/r768_detail_epoch_workers.json')==2
        assert 'let capacity=2' in (
         app/'R766OCRWorkerLivenessLedger.swift').read_text()
        PYDETAIL
        python3 -m unittest discover -s source/tools/tests -v \
          > R771Proof/Python.log 2>&1 || {
            tail -n 70 R771Proof/Python.log; exit 1;
          }
        swiftc -frontend -parse \
          source/app/ios/ChampionsOnDevice/*.swift \
          > R771Proof/Parse.log 2>&1
    - name: Mac XCTest and actual real PNG Apple Vision
      id: swift
      if: >-
        always() && steps.patch.outcome == 'success'
        && matrix.lane == 'real-apple-vision'
      shell: bash
      run: |
        set -euo pipefail
        test "$(uname -s)" = Darwin
        export R761_FIELD_AUDIT_OUTPUT="$GITHUB_WORKSPACE/"
        R761_FIELD_AUDIT_OUTPUT+="R771Proof/FieldSafety.json"
        export R761_APPLE_VISION_OUTPUT="$GITHUB_WORKSPACE/"
        R761_APPLE_VISION_OUTPUT+="R771Proof/RealAppleVision.json"
        swift test --package-path source/R720_PORTABLE_TESTS \
          --jobs 4 --scratch-path "$RUNNER_TEMP/r761-tests" \
          > R771Proof/Swift.log 2>&1 || {
            tail -n 90 R771Proof/Swift.log; exit 1;
          }
        python3 - <<'PYTHON'
        from pathlib import Path
        import re
        text=Path('R771Proof/Swift.log').read_text()
        for name in ['testHP187SplitAcrossTwoVisionRowsReconstructsUnverifiedCandidates',
                     'testPPFragmentsRecoverAllFourSlotsWithoutInventingMoveOrOwner',
                     'testContradictoryMaximumHeldInsteadOfSelectingConvenientFraction']:
         assert re.search(name+r'.*passed',text),name
        for name in ['testActualAppleVisionOnRealHPAndPPPanel',
                     'testActualAppleVisionOnRealSelectionSix']:
         assert re.search(name+r'.*passed',text),name
        assert re.search(
         'testActualProjectorCannotAdmitTwoDifferentPPValuesForOneSlot'
                         +r'.*passed',text)
        assert re.search(
         'testFifteenSecondDeliveryGapCapturedWithoutInventingFrames'
                         +r'.*passed',text)
        assert re.search(
         'testWithoutAnyFurtherCallbackTimerRecordsBothSilences'
                         +r'.*passed',text)
        assert re.search('testOldSessionCannotResetNewOrStopItsTimer'
                         +r'.*passed',text)
        for name in ['testActualD33AppleVisionRowsYieldExactlyFourUniqueSlots',
                     'testSameValueDecodedByTwoRoutesEmitsOneSlot',
                     'testContradictorySlotValuesAreHeldBeforeDeduplication',
                     'testDistinctSlotsWithIdenticalValuesRemainDistinct']:
         assert re.search(name+r'.*passed',text),name
        for name in ['testActualD33VisionRowsProduceFourPPAnchoredMoveNames',
                     'testEffectivenessNotesNeverBecomeMoveNames',
                     'testMissingPPAndContradictoryPPDoNotProduceNames',
                     'testAmbiguousSameSlotNamesHeldRatherThanGuessed',
                     'testLineageMismatchAndNonMovePanelHeld',
                     'testMustMatchTightNameRowNotEffectivenessRow']:
         assert re.search(name+r'.*passed',text),name
        for name in ['testDetailSourceStallDoesNotStarveQuickLane',
                     'testQuickSourceStallDoesNotStarveDetailLane',
                     'testQuickLaneRemainsSerial',
                     'testDrainWaitsForBothPendingSourceWrites']:
         assert re.search(name+r'.*passed',text),name
        for name in ['testQuickStallRaisedExactlyOnceEvenWithoutCallbacks',
                     'testDetailTimeOutNotMistakenForPhysicalExit',
                     'testOldSessionCannotReleaseNewSessionOrOccupiedLane',
                     'testIndependentLaneStillTracksWhenOtherOneStuck',
                     'testBoundedEventsPreserveOverflowCounter']:
         assert re.search(name+r'.*passed',text),name
        for name in ['testNewEpochCanRunWhileOldEpochIsPhysicallyStalled',
                     'testThirdUnreturnedPhysicalWorkerIsHeldNotSpawned',
                     'testLedgerTracksTwoQuickEpochsWithoutConfusingLate'
                     + 'Return',
                     'testLateOldQuickReturnCannotReleaseNewLogicalGate']:
         assert re.search(name+r'.*passed',text),name
        for name in ['testOldDetailWorkerDoesNotBlockNextEpochButThirdIsHeld',
                     'testOneDetailWorkerPerEpochAndCompletionIsPhysical',
                     'testLogicalTicketsSurviveRolloverAndIgnoreOldCompletion',
                     'testTimeoutNotReleasingLedgerAndOldSessionDoesNotClearNew']:
         assert re.search(name+r'.*passed',text),name
        assert re.search(r'Executed [0-9]+ tests, with 0 failures',text)
        PYTHON
    - name: Production archive integrity and negative cases on Mac
      id: archive
      if: >-
        always() && steps.patch.outcome == 'success'
        && matrix.lane == 'iphoneos-compile'
      shell: bash
      run: |
        set -euo pipefail
        app=source/app/ios/ChampionsOnDevice
        sources=(
          "$app/R548ResearchArchive.swift"
          "$app/R551EvidenceIntegrity.swift"
          "$app/R555StoredZIPReadback.swift"
          "$app/R689StreamingZIP.swift"
          "$app/R731ArchiveCapacity.swift"
          source/tests/R710ArchiveIntegrationTests.swift
        )
        swiftc "${sources[@]}" -o "$RUNNER_TEMP/r761-archive" \
          > R771Proof/Archive.log 2>&1
        "$RUNNER_TEMP/r761-archive" >> R771Proof/Archive.log 2>&1
    - name: iPhoneOS compile without IPA creation
      id: phone
      if: >-
        always() && steps.patch.outcome == 'success'
        && matrix.lane == 'iphoneos-compile'
      shell: bash
      run: |
        set -euo pipefail
        python3 source/tools/generate_xcode_project.py
        project=source/app/ios/ChampionsOnDeviceResearch.xcodeproj
        xcodebuild -project "$project" \
          -scheme ChampionsOnDeviceResearch -configuration Debug \
          -sdk iphoneos -destination 'generic/platform=iOS' \
          ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
          -derivedDataPath "$RUNNER_TEMP/r761" build \
          > R771Proof/iPhoneOS.log 2>&1 || {
            grep -E 'error:|BUILD FAILED' R771Proof/iPhoneOS.log || true
            exit 1;
          }
        grep -F 'BUILD SUCCEEDED' R771Proof/iPhoneOS.log
    - name: Preserve complete source and honest gate status
      if: always() && steps.patch.outcome == 'success'
      shell: bash
      env:
        MAC_RESULT: ${{ steps.swift.outcome }}
        LANE: ${{ matrix.lane }}
        RUNNER: ${{ matrix.runner }}
        IOS_RESULT: ${{ steps.phone.outcome }}
        SOURCE_RESULT: ${{ steps.checks.outcome }}
        ARCHIVE_RESULT: ${{ steps.archive.outcome }}
      run: |
        python3 - <<'PYTHON'
        import os,pathlib,zipfile,json
        root=pathlib.Path('source');out=pathlib.Path('R771Proof')
        names=list(json.loads((root/'source_manifest.json').read_text()))
        names+=['source_manifest.json']
        with zipfile.ZipFile(out/'R771_COMPLETE_SOURCE.zip','w',
         zipfile.ZIP_DEFLATED) as z:
         for name in sorted(names):z.write(root/name,name)
        status={
         'candidate':'R771-488-FILES',
         'lane':os.environ['LANE'],
         'runner':os.environ['RUNNER'],
         'source_checks':os.environ['SOURCE_RESULT'],
         'mac_xctest_and_real_vision':os.environ['MAC_RESULT'],
         'mac_accurate_vision':os.environ['MAC_RESULT'],
         'iphoneos_compile':os.environ['IOS_RESULT'],
         'production_archive_test':os.environ['ARCHIVE_RESULT'],
         'device_certified_fields':0,'ipa_created':False,
         'ipa_allowed':False,'duration_gate_required':True,
         'remaining':'79 fields, real iPhone 3-min capture, root cause, OCR'}
        (out/'GATE.json').write_text(json.dumps(status,indent=2))
        PYTHON
    - name: Upload diagnostics even on failure NO IPA
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: R771-${{ matrix.lane }}-NO-IPA
        path: R771Proof/
        retention-days: 3
        if-no-files-found: error
