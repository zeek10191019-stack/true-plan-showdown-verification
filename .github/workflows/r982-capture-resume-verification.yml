name: R982 split retry and capture journal ordering
'on':
  push:
    branches: [r975-device-regression]
    paths: [.github/workflows/r982-capture-resume-verification.yml]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: r982-unsigned-device-test
  cancel-in-progress: false
jobs:
  verify:
    name: Swift, browser, PC and iPhoneOS regression
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && !github.event.repository.private && github.ref == 'refs/heads/r975-device-regression'
    runs-on: xcode-27
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RELEASE_TAG: r982-unsigned-device-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: .github/workflows/r982-capture-resume-verification.yml
      - name: Restore verified R981 and apply the R982 corrections
        shell: bash
        run: &restore |
          set -euo pipefail
          git show fd21911bfeb208c8d54103b2445cb87f277ef417:.github/workflows/r981-split-resume-verification.yml > "$RUNNER_TEMP/r981-baseline.yml"
          echo '5c8bb6296089e61b6328fcdfd1e167dc32687eb164cdb2d339d87e232194f84a  r981-baseline.yml' | (cd "$RUNNER_TEMP" && shasum -a 256 -c -)
          ruby -ryaml -e '
            steps = YAML.load_file(ARGV.fetch(0), aliases: true).fetch("jobs").fetch("verify").fetch("steps")
            puts steps.find { |step| step["name"] == "Restore verified R980 and apply the R981 corrections" }.fetch("run")
          ' "$RUNNER_TEMP/r981-baseline.yml" > "$RUNNER_TEMP/r981-restore.sh"
          bash "$RUNNER_TEMP/r981-restore.sh"
          cp "pinned-r793/source/app/ios/ChampionsOnDevice/R852JournalQueue.swift" "$RUNNER_TEMP/r981-ocr-queue.swift"
