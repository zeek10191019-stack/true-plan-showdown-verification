      - name: Install deterministic image-science dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet numpy==2.3.5 opencv-python-headless==4.13.0.92 pillow==12.3.0
      - name: Run no-user-image layout regression and fail-closed checks
        shell: bash
        run: |
          set -euo pipefail
          cd r2736-public
          python -m unittest -v test_r2736_public 2>&1 | tee public-synthetic-tests.log
          python - <<'R2736_PIXEL_SAFE'
          import hashlib,io
          from PIL import Image
          from r2736_layout_observer import observe_frame, R2736Rejected
          def jpeg(size,color):
              b=io.BytesIO();Image.new('RGB',size,color).save(b,format='JPEG');return b.getvalue()
          for c in ('black','white','red','blue'):
              x=observe_frame(jpeg((1536,709),c))
              assert x['phase_candidate']=='unknown',c
              assert x['recommendation']=='WITHHELD',c
              assert x['legal_action_request'] is None,c
          try:
              observe_frame(jpeg((1536,709),'black'),expected_sha256='0'*64)
              raise AssertionError('MUST_REJECT_MISMATCH')
          except R2736Rejected as e:
              assert str(e)=='FRAME_HASH_MISMATCH'
          try:
              observe_frame(jpeg((709,1536),'black'))
              raise AssertionError('MUST_REJECT_PORTRAIT')
          except R2736Rejected as e:
              assert str(e)=='NOT_EXPECTED_CHAMPIONS_LANDSCAPE'
          print('R2736_SYNTHETIC_PIXEL_GUARDS_PASS',{'colors':4,'reject_cases':2,'real_game_images':0,'legal_action_decisions':0})
          R2736_PIXEL_SAFE
      - name: Generate public-only receipt and hashes
        shell: bash
        run: |
          set -euo pipefail
          cd r2736-public
          python - <<'R2736_RECEIPT'
          import hashlib,json,pathlib
          base=pathlib.Path('.')
          src=['r2736_layout_observer.py','test_r2736_public.py','public-synthetic-tests.log']
          digests={x:hashlib.sha256((base/x).read_bytes()).hexdigest() for x in src}
          proof={'schema':'R2736_PUBLIC_SYNTHETIC_ONLY_RECEIPT_V1','origin':'SYNTHETIC_FEATURES_NO_USER_IMAGES','phase_rule_checks':'PASS','real_champions_pixel_precision':'NOT_CERTIFIED','holdout_accuracy':'NOT_MEASURED','actual_game':'0/30','native33':'0/33','exact34':'0/34','formal':'DENY','sha256':digests}
          (base/'public_receipt.json').write_text(json.dumps(proof,sort_keys=True,indent=2))
          print('R2736_PUBLIC_PROOF_PASS')
          R2736_RECEIPT
      - name: Upload synthetic proof only
        uses: actions/upload-artifact@v4
        with:
          name: r2736-public-synthetic-layout-safety-proof
          path: |
            r2736-public/public_receipt.json
            r2736-public/public-synthetic-tests.log
          retention-days: 7
