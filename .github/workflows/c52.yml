name: R1052 C52 journal contract and 79-field execution leads (NO IPA)
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/c52.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    name: ${{ matrix.job }}
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
        - job: macos-source
          os: xcode-27
        - job: windows-cli
          os: windows-2025
        - job: windows-receiver
          os: windows-2025
        - job: macos-sender
          os: xcode-27
        - job: windows-hud
          os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
    - name: Prepare SHA-pinned C46 steps and exact C47 tests
      shell: bash
      run: |
        set -Eeuo pipefail
        if [[ "$RUNNER_OS" == Windows ]]; then PY=python; else PY=python3; fi
        "$PY" - <<'C47_LITE_PY'
        import pathlib,os,hashlib,urllib.request,base64,zlib,json
        sha=lambda b:hashlib.sha256(b).hexdigest()
        url='https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/7a7cde052e6f5e7a18d5399a9a0ff483734768c3/.github/workflows/c46.yml'
        with urllib.request.urlopen(url,timeout=60) as response: raw=response.read(200000)
        assert len(raw)==169037 and sha(raw)=='875f6a669c27803722b869a423fdd4c959091164f9788c76731a7345fdd23987', 'C46_PIN_MISMATCH'
        root=pathlib.Path(os.environ['RUNNER_TEMP'])/'c47-pinned-c46';root.mkdir(exist_ok=False)
