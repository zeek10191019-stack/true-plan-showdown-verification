        def run(name,args=(),negative=False,count=None,marker=None,external=False):
            env=dict(os.environ);env['PYTHONUTF8']='1';env['TRUEPLAN_GUI_PROBE_MODULE']='r1049_launcher'
            env['C51_WRAPPER']='r1050_tls_receiver' if negative else 'r1051_tls_receiver'
            env['PYTHONPATH']=os.pathsep.join(map(str,[root,base/'c49',base/'c43',base/'c47',source]))
            # Copy GUI test to the candidate directory to avoid accidental source precedence.
            if external:shutil.copyfile(base/'c49'/name,root/name)
            p=subprocess.run([sys.executable,str(root/name),*map(str,args)],env=env,text=True,capture_output=True,timeout=600)
            print(p.stdout,flush=True);print(p.stderr,flush=True)
            if negative:assert p.returncode!=0 and 'AssertionError: absolute deadline releases all trickling clients' in p.stderr
            else:
                assert p.returncode==0
                if count is not None:assert p.stdout.count('PASS ')==count
                if marker is not None:assert marker in p.stdout
        run('c51_header_deadline_probe.py',negative=True)
        run('c51_header_deadline_probe.py',count=9,marker='C51_REAL_TLS_ABSOLUTE_HEADER_DEADLINE_PASS_NOT_DEVICE')
        run('c50_shutdown_probe.py',count=9,marker='C50_REAL_TLS_PENDING_DRAIN_PASS_NOT_DEVICE')
        run('c50_active_put_probe.py',count=9,marker='C50_ACTIVE_PUT_DRAIN_AND_RESTORE_PASS_NOT_DEVICE')
        run('c50_tls_archive_probe.py',(source,),marker='C42_HTTPS_RESTORE_PASS')
        run('c50_large_https_probe.py',(source,),marker='C42_LARGE_HTTPS_RESTORE_PASS')
        run('c49_gui_probe.py',count=24,marker='C49_GUI_REAL_TK_LOOPBACK_PASS_NOT_PHYSICAL_DEVICE',external=True)
        print('C51_ALL_PRIOR_STEPS_RETAINED_AND_TLS_REGRESSION_PASS_NOT_DEVICE',flush=True)
