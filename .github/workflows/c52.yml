        # Actual Tk + TLS on the hosted Windows runner; no physical Lenovo claim.
        # C49 tests have separate 150 s startup allowance for Windows ACL calls; no performance certification.
        def run(module,negative=False):
            e=dict(env);e['TRUEPLAN_GUI_PROBE_MODULE']=module
            p=subprocess.run([sys.executable,str(root/'c49_gui_probe.py')],env=e,text=True,capture_output=True,timeout=570)
            print(p.stdout,flush=True);print(p.stderr,flush=True)
            if negative:assert p.returncode!=0 and 'AssertionError: automatic own pairing clipboard clear on stop' in p.stderr
