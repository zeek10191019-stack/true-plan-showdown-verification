       assert hashlib.sha256(raw).hexdigest()==expected_sha,'R729_PATCH_SHA_MISMATCH'
       obj=json.loads(raw)
       assert obj['schema']=='trueplan.r729.transport-599mb-patch.v1'
       assert len(obj['files'])==7 and len(obj['previous_sha'])==4 and len(obj['new_files'])==3
       root=pathlib.Path('R727Source')
       before={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
               for p in root.rglob('*') if p.is_file()}
       assert len(before)==294,('R728_SOURCE_INPUT_COUNT',len(before))
       assert not set(obj['new_files']).intersection(before)
       for name,data in obj['files'].items():
        p=pathlib.PurePosixPath(name)
        assert not p.is_absolute() and '..' not in p.parts and str(p)==name
        existing=root/name
        if name in obj['previous_sha']:
         assert before[name]==obj['previous_sha'][name],('R729_SOURCE_PREIMAGE_MISMATCH',name)
        else:
         assert name in obj['new_files'] and not existing.exists()
        existing.parent.mkdir(parents=True,exist_ok=True)
        existing.write_text(data,encoding='utf8')
        assert hashlib.sha256(existing.read_bytes()).hexdigest()==hashlib.sha256(data.encode()).hexdigest()
       after={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()}
       assert len(after)==297 and set(before)<=set(after)
       assert {name for name in before if before[name]!=after[name]}==set(obj['previous_sha'])
       assert set(after)-set(before)==set(obj['new_files'])
       print('R729_297_SOURCES_PRESERVED_7_CHANGES_SHA_PASS')
       PY
    - name: Run 84 Swift regression tests and parse all 232 app sources
      shell: bash
      run: |
       set -euo pipefail
       mkdir -p R729Artifacts
       (cd R727Source/R720_PORTABLE_TESTS && swift test -j 2) > R729Artifacts/R729_SWIFT_74_TESTS.log 2>&1 || {
         tail -n 100 R729Artifacts/R729_SWIFT_74_TESTS.log; exit 1;
       }
       grep -Fq 'Executed 84 tests, with 0 failures' R729Artifacts/R729_SWIFT_74_TESTS.log
       python3 - <<'PY'
       import pathlib
       files=list(pathlib.Path('R727Source/app/ios/ChampionsOnDevice').glob('*.swift'))
       assert len(files)==232,len(files)
       print('R729_APP_SOURCE_COUNT_PASS',len(files))
       PY
       swiftc -frontend -parse R727Source/app/ios/ChampionsOnDevice/*.swift
       echo R729_SWIFT_84_PASS_232_APP_SWIFT_PARSE_PASS
    - name: Export full 297-file editable source with per-file SHA and ZIP CRC
      shell: bash
      run: |
       set -euo pipefail
       python3 - <<'PY'
       import pathlib,hashlib,zipfile,json
       src=pathlib.Path('R727Source');out=pathlib.Path('R729Artifacts');out.mkdir(exist_ok=True)
       files=sorted(p for p in src.rglob('*') if p.is_file() and '.build' not in p.relative_to(src).parts)
       assert len(files)==297,('R729_SOURCES_MISSING',len(files))
       zip_path=out/'R729_ALL_EDITABLE_SOURCE_RECOVERY.zip'
       with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
        for p in files:z.write(p,p.relative_to(src).as_posix())
       with zipfile.ZipFile(zip_path) as z:
        assert z.testzip() is None and len(z.namelist())==297
       checksums={p.relative_to(src).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in files}
       (out/'R729_ALL_SOURCE_HASHES.json').write_text(json.dumps(checksums,indent=2,sort_keys=True))
       (out/'R729_SOURCE_RECEIPT.json').write_text(json.dumps({
        'files':297,'swift_app_files':232,'tests':'84/84 PASS',
        'source_sha_count':len(checksums),'archive_bytes':zip_path.stat().st_size,
        'source_zip_sha256':hashlib.sha256(zip_path.read_bytes()).hexdigest(),
        'zip_crc':'PASS','original_source':'R727_CI_SHA_PINNED_SUCCESS',
        'iPhone_device_test':'NOT_RUN','certified_79_fields':0},indent=2))
       print('R729_COMPLETE_SOURCE_ZIP_CRC_PASS',len(files))
       PY
    - name: Compile R729 FULL unsigned iPhoneOS app and package IPA
      shell: bash
      run: |
       set -euo pipefail
       python3 R727Source/tools/generate_xcode_project.py
       xcodebuild -project R727Source/app/ios/ChampionsOnDeviceResearch.xcodeproj \
        -scheme ChampionsOnDeviceResearch -configuration Debug \
        -sdk iphoneos -destination 'generic/platform=iOS' \
        ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
        -derivedDataPath "$RUNNER_TEMP/r729-derived" build \
        > R729Artifacts/R729_IPHONEOS_XCODEBUILD.log 2>&1 || {
        grep -E 'error:|BUILD FAILED' R729Artifacts/R729_IPHONEOS_XCODEBUILD.log | tail -n 100 || true
        exit 1
       }
       grep -Fq 'BUILD SUCCEEDED' R729Artifacts/R729_IPHONEOS_XCODEBUILD.log
       python3 - <<'PY'
       import os,pathlib,plistlib,zipfile,json,hashlib
       log=pathlib.Path('R729Artifacts/R729_IPHONEOS_XCODEBUILD.log').read_text(errors='replace')
       for name in ('CaptureCoordinator.swift','R710ContinuousRecorder.swift',
                    'R727AnalysisPNGPack.swift','R726LiveOCRClosure.swift','R729EvidenceTransportPolicy.swift'):
        assert name in log,('R729_INPUT_NOT_COMPILED',name)
       app=pathlib.Path(os.environ['RUNNER_TEMP'])/'r729-derived/Build/Products/Debug-iphoneos/ChampionsOnDeviceResearch.app'
       assert app.is_dir()
       info=plistlib.loads((app/'Info.plist').read_bytes())
       assert info['CFBundleVersion']=='729' and info['CFBundleShortVersionString']=='0.7.29'
       assert not (app/'embedded.mobileprovision').exists()
       ipa=pathlib.Path('R729Artifacts/R729_Unsigned_Research.ipa')
       with zipfile.ZipFile(ipa,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
        for p in sorted(app.rglob('*')):
         assert not p.is_symlink()
         if p.is_file():z.write(p,arcname='Payload/'+app.name+'/'+p.relative_to(app).as_posix())
       with zipfile.ZipFile(ipa) as z:assert z.testzip() is None
       assert ipa.stat().st_size<9_000_000
       pathlib.Path('R729Artifacts/R729_COMPILE_RECEIPT.json').write_text(json.dumps({
        'iphoneos_unsigned_build':'PASS','app_build':'729','swift_tests':'84/84 PASS',
        'source_files':297,'device_certified_fields':0,'actual_png_pack_test':'NOT_RUN',
        'owner_turn_certified':False,'screen_to_movie_alignment_certified':False},indent=2))
       print('R729_FULL_IPHONEOS_BUILD_PASS_NOT_DEVICE_CERTIFIED')
       PY
    - name: Guard public artifact storage (no paid overage)
      id: budget
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
       set -euo pipefail
       python3 - <<'PY'
       import pathlib,os,urllib.request,json
       root=pathlib.Path('R729Artifacts')
       size=sum(p.stat().st_size for p in root.rglob('*') if p.is_file())
       assert 0<size<16_000_000,('R729_ARTIFACT_SIZE_HOLD',size)
       used=0
       for page in range(1,11):
        url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/artifacts?per_page=100&page='+str(page)
        req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
         'Accept':'application/vnd.github+json','User-Agent':'TruePlan-R729-FreeGuard'})
        with urllib.request.urlopen(req,timeout=30) as response:items=json.load(response).get('artifacts',[])
        used+=sum(x['size_in_bytes'] for x in items if not x.get('expired'))
        if len(items)<100:break
       else:raise RuntimeError('R729_STORAGE_INVENTORY_INCOMPLETE')
       assert used+size<400_000_000,('R729_STORAGE_BUDGET_HOLD',used,size)
       with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('allowed=true\n')
       print('R729_PUBLIC_ARTIFACT_BUDGET_PASS',used,size)
       PY
    - uses: actions/upload-artifact@v4
      if: always() && steps.budget.outputs.allowed == 'true'
      with:
        name: R729-strict-ocr-png-evidence-audit
        path: R729Artifacts/
        if-no-files-found: error
    - name: Explicit device certification boundary
      if: always()
      shell: bash
      run: |
       set -euo pipefail
       {
        echo '## R728: strict OCR to PNG lifecycle evidence (not gameplay proof)'
        echo 'R727 full 294 files retained; 4 SHA-gated file revisions.'
        echo 'A SHA-less OCR completion, missing submission or duplicate PNG fails closed.'
        echo 'Test and full iPhoneOS build results are valid only when each step succeeds.'
        echo 'Original 3-minute iPhone recording and 79-field device performance NOT measured.'
        echo 'Device-certified fields remain 0/79.'
       } >> "$GITHUB_STEP_SUMMARY"
