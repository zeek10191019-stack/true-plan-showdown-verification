name: R977 retained capture and reshare
'on':
  push:
    branches: [r975-device-regression]
    paths: [.github/workflows/r977-retained-verification.yml]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: r977-unsigned-device-test
  cancel-in-progress: false
jobs:
  verify:
    name: Swift, browser, PC and iPhoneOS regression
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && !github.event.repository.private && github.ref == 'refs/heads/r975-device-regression'
    runs-on: xcode-27
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RELEASE_TAG: r977-unsigned-device-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: .github/workflows/r977-retained-verification.yml
      - name: Restore verified R976 and apply the R977 corrections
        shell: bash
        run: &restore |
          set -euo pipefail
          git show 8c7fdddbcd0bc6123a8489abf07de96346bbc4ff:.github/workflows/r976-recovery-verification.yml > "$RUNNER_TEMP/r976-baseline.yml"
          echo '33b5a496fc0a0a7cdd605e840fd2ca890cbf6fed74e38f04f50115606d8764bb  r976-baseline.yml' | (cd "$RUNNER_TEMP" && shasum -a 256 -c -)
          ruby -ryaml -e '
            steps = YAML.load_file(ARGV.fetch(0), aliases: true).fetch("jobs").fetch("verify").fetch("steps")
            puts steps.find { |step| step["name"] == "Restore verified R975 and apply the R976 corrections" }.fetch("run")
          ' "$RUNNER_TEMP/r976-baseline.yml" > "$RUNNER_TEMP/r976-restore.sh"
          bash "$RUNNER_TEMP/r976-restore.sh"
