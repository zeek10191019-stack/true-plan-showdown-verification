name: R570 Live OCR Receipt Retirement (No IPA)
"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/r570.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: xcode-27
            role: IOS27_BUILD
          - runner: macos-26-intel
            role: MACOS26_OCR
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      SCREEN_READ_ROLE: ${{ matrix.role }}
    steps:
      - name: Pinned R569 code replay and R570 receipt retirement checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY570'
          import base64,hashlib,json,plistlib,subprocess,sys,zlib,re,textwrap,ast
          from pathlib import Path
          sha=lambda b:hashlib.sha256(b).hexdigest()
          parent=zlib.decompress(base64.b64decode("""""",validate=True))
          assert len(parent)==14498 and sha(parent)=='19505351c27bf6d329a756cc826720b1031abcb69535f3a5763276d737f6c94c','R570_PARENT_WORKFLOW_HASH_MISMATCH'
          content=parent.decode()
          match=re.search(r"python3 - <<'PY569'\n(.*?)\n\s+PY569",content,re.S)
          assert match,'R570_PARENT_PYTHON_MISSING'
          parent_py=textwrap.dedent(match.group(1));ast.parse(parent_py)
          subprocess.run([sys.executable,'-c',parent_py],check=True)
          patch=json.loads(zlib.decompress(base64.b64decode("""""",validate=True)))
          assert set(patch)==set(['app/ios/ChampionsOnDevice/CaptureCoordinator.swift', 'app/ios/ChampionsOnDevice/Info.plist', 'app/ios/ChampionsOnDevice/R554CandidateLease.swift', 'tests/R570LeaseRetirementHarness.swift', 'tests/test_candidate_lease.py', 'tools/verify_candidate_lease.py']),'R570_CHANGED_FILE_SET'
          for name,change in sorted(patch.items()):
              dest=Path(name)
              assert not dest.is_absolute() and '..' not in dest.parts,'R570_UNSAFE_PATH'
              assert name.startswith(('app/ios/ChampionsOnDevice/','tests/','tools/')),'R570_UNEXPECTED_PATH'
              old=dest.read_bytes() if dest.is_file() else None
              assert (sha(old) if old is not None else None)==change['before'],('R570_BASE_SOURCE_MISMATCH',name)
              if old is None:
                  newer=base64.b64decode(change['content'],validate=True)
              else:
                  newer=old
                  for i,j,payload in reversed(change['edits']):
                      assert 0<=i<=j<=len(old),'R570_PATCH_BOUNDS'
                      newer=newer[:i]+base64.b64decode(payload,validate=True)+newer[j:]
              assert sha(newer)==change['after'],('R570_PATCH_HASH_MISMATCH',name)
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(newer)
          files=sorted(Path('app/ios/ChampionsOnDevice').glob('*.swift'))
          assert len(files)==117,'R570_SWIFT_COUNT'
          full_tree=sha(''.join(f.name+':'+sha(f.read_bytes())+'\n' for f in files).encode())
          assert full_tree=='2c2a58e6d0f8f39c6f8bee02de487d6a4c5c25c16e1ade03d7a0e453e70bc151','R570_SWIFT_TREE'
          assert plistlib.loads(Path('app/ios/ChampionsOnDevice/Info.plist').read_bytes())['CFBundleVersion']=='570'
          subprocess.run(['swiftc','-frontend','-parse',*[str(f) for f in files]],check=True)
          swift_source=Path('app/ios/ChampionsOnDevice')/'R554CandidateLease.swift'
          new_test=Path('tests/R570LeaseRetirementHarness.swift')
          out=Path('/tmp/r570_lease_retirement')
          subprocess.run(['swiftc','-O','-parse-as-library',str(swift_source),str(new_test),'-o',str(out)],check=True)
          result=subprocess.run([str(out)],capture_output=True,text=True,check=True)
          assert 'PASS_R570_ALL_34_LEASE_RETIREMENT_CHECKS' in result.stdout,result.stdout
          print('R570_SWIFT_NATIVE_LEASE_RETIREMENT_34_PASS',flush=True)
          subprocess.run([sys.executable,'-m','unittest','discover','-s','tests','-p','test_candidate_lease.py','-q'],check=True)
          print('R570_PYTHON_LEASE_VERIFIER_PASS',flush=True)
          Path('R570_CI_REPORT.json').write_text(json.dumps({
           'revision':'R570','parent':'R569','parent_ci_success_confirmed':False,
           'source_hash':full_tree,'swift_count':len(files),'new_swift_tests':34,
           'python_lease_tests':'PASS','live_expiry_on_new_request':True,
           'apple_iOS27_build':'NOT_YET_RUN','macOS26_Vision':'NOT_YET_RUN',
           'iPhone_game_screen_accuracy_certified':False,'owner_certified':False,
           'final_ipa_created':False},indent=2))
          print('PASS_R570_PATCHED_PARENT_117_SWIFT_34_TESTS',full_tree,flush=True)
          PY570
      - name: Apple iPhoneOS27 build or macOS26 native Vision OCR
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SCREEN_READ_ROLE" = 'IOS27_BUILD' ]; then
            python3 tools/generate_xcode_project.py
            xcodebuild -project app/ios/ChampionsOnDeviceResearch.xcodeproj \
              -target ChampionsOnDeviceResearch -configuration Debug -sdk iphoneos \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
              CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/r570-build" \
              OBJROOT="$RUNNER_TEMP/r570-objects" SYMROOT="$RUNNER_TEMP/r570-symbols" build
            test -f "$RUNNER_TEMP/r570-build/ChampionsOnDeviceResearch.app/PrivacyInfo.xcprivacy"
            echo 'PASS_R570_IOS27_BUILD_ONLY_NO_IPA'
          elif [ "$SCREEN_READ_ROLE" = 'MACOS26_OCR' ]; then
            python3 tools/run_r564_mac_ocr.py
            echo 'PASS_R570_MACOS26_VISION_SYNTHETIC_NOT_GAME_CERTIFIED'
          else
            echo 'R570_INVALID_ROLE'; exit 2
          fi
      - name: Upload bounded verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R570_SCREEN_READ_REPORT_${{ matrix.role }}
          path: R570_CI_REPORT.json
          if-no-files-found: warn
          retention-days: 3
