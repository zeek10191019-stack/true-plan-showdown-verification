jobs:
  audit:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            1e63efa4db514cc122f2940a39623d9bc65c554c
      - name: Audit journal-to-ZIP source
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os,base64,lzma,hashlib
          raw=lzma.decompress(base64.b64decode(
            os.environ['R7071_PKG']),
            format=lzma.FORMAT_ALONE)
          assert hashlib.sha256(raw).hexdigest()==(
            'c1fcc0e33a4b3fd933a6d2423eddf84a'
            '17482f5c8e72ecbebffe50ea3cc34d62'
          )
          exec(compile(raw,'R7071_Audit','exec'),{})
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R7071-journal-source-audit
          path: dist/R707_journal_audit/
          if-no-files-found: warn
          retention-days: 7
