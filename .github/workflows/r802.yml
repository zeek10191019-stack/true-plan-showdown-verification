name: R802 D62 Same-Frame Owner Turn Pixel OCR Evidence Join NO IPA
'on':
  push:
    branches: [main]
    paths:
      - .github/workflows/r802.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: r802-d62-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            lane: real-apple-vision
          - runner: xcode-27
            lane: iphoneos-compile
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Checkout proven R793 only (NO IPA)
        uses: actions/checkout@v4
        with:
          ref: 37b3e26851c71fcabd65da3299356c1e38c53869
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/d30.b64
            .github/workflows/r793.yml
          sparse-checkout-cone-mode: false

      - name: Reconstruct exact R793 via original hash-gated D53 source steps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p R793Proof R796Proof
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, re, os, json, hashlib
          sha=lambda b:hashlib.sha256(b).hexdigest()
          actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert actual=='37b3e26851c71fcabd65da3299356c1e38c53869'
          original=Path('.github/workflows/r793.yml').read_text()
          blocks=re.split(r'(?=^    - name: )',original,flags=re.M)
          parsed={}
          for block in blocks:
              m=re.match(r'    - name: (.+)\n',block)
              if not m or '      run: |\n' not in block:continue
              body=block.split('      run: |\n',1)[1]
              lines=body.splitlines(keepends=True)
              assert all(x.startswith('        ') or not x.strip() for x in lines)
              parsed[m.group(1)]=''.join(x[8:] if x.startswith('        ') else x for x in lines)
          names=[
              'Restore independent SHA verified source NO IPA',
              'Apply pinned R773 cumulative source delta with SHA checks',
              'Apply R774 source-only delta with strict SHA checks',
              'Apply R775 source-only delta with strict SHA checks',
              'Apply R776 quick lane freshness delta with strict SHA checks',
              'Apply R777 through R780 cumulative delta with SHA checks',
              'Apply SHA verified R781 through R793 source fixes NO IPA',
          ]
          for n in names:
              assert n in parsed,n
              with open('R796Proof/Restore.log','a') as out:
                  out.write('BEGIN '+n+'\n');out.flush()
                  r=subprocess.run(['bash','-e','-o','pipefail','-c',parsed[n]],
                      stdout=out,stderr=subprocess.STDOUT,env=os.environ.copy(),timeout=360)
                  out.write('END '+n+' '+str(r.returncode)+'\n')
              assert r.returncode==0,('R793_ORIGINAL_STEP_FAILED',n)
          root=Path('source')
          manifest=json.loads((root/'source_manifest.json').read_text())
          disk={str(p.relative_to(root)):p for p in root.rglob('*') if p.is_file()
              and '__pycache__' not in p.parts}
          assert set(disk)==set(manifest)|{'source_manifest.json'}
          assert len(disk)==566 and all(sha(disk[k].read_bytes())==v
              for k,v in manifest.items())
          digest=sha(''.join(n+'\t'+sha(disk[n].read_bytes())+'\n'
              for n in sorted(disk)).encode())
          assert digest=='b1f01daec74002cec9dd2ab3a79b9e7e0621d8a76d010f64e34068d10f414ff2',digest
          Path('R796Proof/R793_PINNED_SOURCE_SHA.txt').write_text(digest+'\n')
          print('R793 pinned original complete',len(disk),digest)
          PY

