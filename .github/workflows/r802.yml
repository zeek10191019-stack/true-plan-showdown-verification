          assert all(sha(files[n].read_bytes())==v for n,v in m.items())
          tree=sha(''.join(n+'\t'+sha(files[n].read_bytes())+'\n' for n in sorted(files)).encode())
          assert tree=='ff6ccad4f581499eb2726b4e2f7ea76e1c9e0b356809a553bdcab301502ffa05',('BASE_R801_SOURCE_DRIFT',tree)
          for op in ops['operations']:
              p=root/op['path']
              old=p.read_bytes() if p.exists() else None
              assert (sha(old) if old is not None else None)==op['old_sha256'],op['path']
              new=base64.b64decode(op['new_base64'])
              assert sha(new)==op['new_sha256'],op['path']
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(new)
              m[op['path']]=op['new_sha256']
          (root/'source_manifest.json').write_bytes(json.dumps(m,ensure_ascii=False,indent=2).encode())
          files={str(p.relative_to(root)):p for p in root.rglob('*') if p.is_file() and '__pycache__' not in p.parts and '.build' not in p.parts}
          assert len(files)==576 and set(files)==set(m)|{'source_manifest.json'}
          assert all(sha(files[n].read_bytes())==v for n,v in m.items())
          tree=sha(''.join(n+'\t'+sha(files[n].read_bytes())+'\n' for n in sorted(files)).encode())
          assert tree=='b0b0b4ce89a320230e62efb68e5b047a717f620bfda824053e9edb684cc27d43',('R802_TREE_DRIFT',tree)
          assert files['app/ios/ChampionsOnDevice/R802SameFrameEvidenceJoin.swift'].read_bytes()==files['R720_PORTABLE_TESTS/Sources/R719Core/R802SameFrameEvidenceJoin.swift'].read_bytes()
          assert files['app/ios/ChampionsOnDevice/R714CaptureAudit.swift'].read_bytes()==files['R720_PORTABLE_TESTS/Sources/R719Core/R714CaptureAudit.swift'].read_bytes()
          proof=Path('R802Proof');proof.mkdir(exist_ok=True)
          (proof/'SOURCE_TREE_SHA256.txt').write_text(tree+'\n')
          (proof/'SOURCE_INTEGRITY.json').write_text(json.dumps({
            'revision':'R802','source_tree_sha256':tree,'source_files':576,
            'base_tree_sha256':'ff6ccad4f581499eb2726b4e2f7ea76e1c9e0b356809a553bdcab301502ffa05',
            'changed_paths':[op['path'] for op in ops['operations']],
            'no_ipa':True,'game_certified_fields':0,
            'owner_turn_certified':False,'battle_advice_authorized':False
          },indent=2))
          print('R802_SOURCE_SHA256_PASS',tree)
          PYR802SOURCE

      - name: Native original-resolution tile geometry and actual PNG Apple Vision
        if: matrix.lane == 'real-apple-vision'
        shell: bash
        run: |
          set -euo pipefail
          export R794_DIAGNOSTIC_DIR="$GITHUB_WORKSPACE/R796Proof"
          cd source/R720_PORTABLE_TESTS
          swift test --filter R794SourceTileDiagnosticsTests > "$GITHUB_WORKSPACE/R796Proof/TileSwift.log" 2>&1 || {
            tail -120 "$GITHUB_WORKSPACE/R796Proof/TileSwift.log"
            exit 1
          }
          cd ../..
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('R796Proof')
          for n in ('R794TileMoveVision.json','R794TileSelectionVision.json'):
              q=json.loads((p/n).read_text())
              assert q['tile_count']==2
              assert q['source_width']==2796 and q['source_height']==1290
              assert q['source_png_unchanged'] and not q['real_device_capture_certified']
              assert q['device_certified_fields']==0
              assert not q['auto_production_tile_ocr_enabled']
              assert len(q['rows'])==len(q['alternatives'])
              assert all(t['pixel_count']<=2_000_000 for t in q['tile_metrics'])
              assert all(t['language_correction']==False for t in q['tile_metrics'])
          m=json.loads((p/'R794TileMoveVision.json').read_text())
          s=json.loads((p/'R794TileSelectionVision.json').read_text())
          comparison={'baseline_revision':'R793','diagnostic_revision':'R794',
              'baseline_full_raster_projected_move_exact':1,
              'baseline_full_raster_selection_exact':4,
              'tile_projected_move_exact':m['projected_move_names_exact'],
