          assert sha(raw)=='d9e5153243f6563438644a276071c106e8dc2cd4dfd8bf3de8517132bc6bdf8f','R802_RAW_SHA'
          ops=json.loads(raw)
          assert ops['base_tree_sha256']=='ff6ccad4f581499eb2726b4e2f7ea76e1c9e0b356809a553bdcab301502ffa05'
          assert ops['output_tree_sha256']=='b0b0b4ce89a320230e62efb68e5b047a717f620bfda824053e9edb684cc27d43'
