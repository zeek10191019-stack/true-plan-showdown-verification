      - name: R800 enforce proof generation order and exact source SHA before OCR
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYR800_ORDER'
          from pathlib import Path
          import json,hashlib
          sha=lambda b:hashlib.sha256(b).hexdigest()
          root=Path('source')
          expected_r798='d093cb367d17a18b17bab8f4bb32b0fd6e83914d86b1e5e4f3e340444fce034a'
          expected_r799='0f37db5e291ea795cb40f9c1fcfda246bab7d1c5132a39197302a06f2c969142'
          a=Path('R798Proof/SOURCE_TREE_SHA256.txt')
          b=Path('R799Proof/SOURCE_TREE_SHA256.txt')
          assert a.is_file() and b.is_file(), 'R800_UPSTREAM_PROOF_NOT_PRODUCED'
          assert a.read_text().strip()==expected_r798,'R798_TREE_MISMATCH'
          assert b.read_text().strip()==expected_r799,'R799_TREE_MISMATCH'
          p798=json.loads(Path('R798Proof/SOURCE_INTEGRITY.json').read_text())
          p799=json.loads(Path('R799Proof/SOURCE_INTEGRITY.json').read_text())
          assert p798['revision']=='R798' and p799['revision']=='R799'
          assert p799['base_revision']=='R798' and p799['source_tree_sha256']==expected_r799
          manifest=json.loads((root/'source_manifest.json').read_text())
          files={str(p.relative_to(root)):p for p in root.rglob('*') if p.is_file()
            and '__pycache__' not in p.parts and '.build' not in p.parts}
          assert len(files)==571 and set(files)==set(manifest)|{'source_manifest.json'}
          assert all(sha(files[n].read_bytes())==h for n,h in manifest.items())
          actual=sha(''.join(n+'\t'+sha(files[n].read_bytes())+'\n'
            for n in sorted(files)).encode())
          assert actual==expected_r799,('R800_CURRENT_TREE_MISMATCH',actual)
          assert p799['application_code_changed'] is False
          print('R800 D60 SOURCE_ORDER_AND_HASH_GATE_PASS',actual)
          PYR800_ORDER

