          for op in payload['operations']:
              name=op['path']
              path=root/name
              prior=path.read_bytes() if path.exists() else None
              assert (sha(prior) if prior is not None else None)==op['old_sha256'],name
              new=base64.b64decode(op['new_base64'])
              assert sha(new)==op['new_sha256'],name
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(new)
              manifest[name]=op['new_sha256']
          (root/'source_manifest.json').write_bytes(json.dumps(manifest,ensure_ascii=False,indent=2).encode())
          files={str(p.relative_to(root)):p for p in root.rglob('*')
                 if p.is_file() and '__pycache__' not in p.parts and '.build' not in p.parts}
          assert len(files)==572 and set(files)==set(manifest)|{'source_manifest.json'}
          assert all(sha(files[n].read_bytes())==v for n,v in manifest.items())
          tree=sha(''.join(n+'\t'+sha(files[n].read_bytes())+'\n'
                      for n in sorted(files)).encode())
          assert tree=='ff6ccad4f581499eb2726b4e2f7ea76e1c9e0b356809a553bdcab301502ffa05',('R801_OUTPUT_TREE_DRIFT',tree)
          assert (root/'app/ios/ChampionsOnDevice/R749OwnerTurnBindingAudit.swift').read_bytes()==(root/'R720_PORTABLE_TESTS/Sources/R719Core/R749OwnerTurnBindingAudit.swift').read_bytes()
          proof=Path('R801Proof');proof.mkdir(exist_ok=True)
          (proof/'SOURCE_TREE_SHA256.txt').write_text(tree+'\n')
          (proof/'SOURCE_INTEGRITY.json').write_text(json.dumps({
            'revision':'R801','source_files':572,'source_tree_sha256':tree,
            'base_tree_sha256':'0f37db5e291ea795cb40f9c1fcfda246bab7d1c5132a39197302a06f2c969142',
            'changed_paths':[o['path'] for o in payload['operations']],
            'device_certified_fields':0,'ipa_created':False,
            'owner_turn_gameplay_certified':False
          },indent=2))
          print('R801_SHA256_BOUND_SOURCE_PASS',tree)
          PYR801SOURCE

