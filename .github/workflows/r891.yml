      - name: iPhoneOS production build version 891
        shell: bash
        run: |
          set -euo pipefail
          python3 pinned-r793/source/tools/generate_xcode_project.py
          xcodebuild -project pinned-r793/source/app/ios/ChampionsOnDeviceResearch.xcodeproj -scheme ChampionsOnDeviceResearch -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO -derivedDataPath "$RUNNER_TEMP/r891_device" build > R834Proof/iPhoneOS.log 2>&1 || { grep -E 'error:|BUILD FAILED' R834Proof/iPhoneOS.log; exit 1; }
          grep -F 'BUILD SUCCEEDED' R834Proof/iPhoneOS.log
          python3 - <<'PY'
          import plistlib,os
