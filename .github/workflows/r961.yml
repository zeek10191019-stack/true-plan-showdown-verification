          assert len(files)==702 and digest=='785eb000e55d4e31dec44ea4d2e0d87b7644e9a8c64b42d72708e729a5602b1d',(len(files),digest)
          print('R961_SOURCE_VERIFIED',len(files),digest)
          VERIFY
      - name: Replay real status, inspection and animation evidence
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_26.3.app/Contents/Developer ]]; then
            export DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
          fi
          xcodebuild -version
          cd pinned-r793/source
          source_package="$PWD/R720_PORTABLE_TESTS"
          focused="$RUNNER_TEMP/r961-vision/R720_PORTABLE_TESTS"
          mkdir -p "$focused/Tests/R719CoreTests" "$RUNNER_TEMP/r961-vision/tests"
          cp "$source_package/Package.swift" "$focused/"
          cp -R "$source_package/Sources" "$focused/"
          cp -R tests/fixtures "$RUNNER_TEMP/r961-vision/tests/"
          for name in R893BattleStatusPanelTests R883InspectionPanelTests R761RealImageRegressionTests R858NumericHUDOCRTests R855FastLosslessPNGTests; do
            cp "$source_package/Tests/R719CoreTests/$name.swift" "$focused/Tests/R719CoreTests/"
          done
          swift test -c release --jobs 4 --package-path "$focused" --filter 'testPhoneStatusFromActualSelectedScreenshotRegions|testRetainedBuild715InspectionAndNonSelectedTransition|testSelectedMovePPStillRecordedWhenNameIsUnreadable|testUnknownSelectedSpeciesKeepsHPAndPPWithoutActiveIdentity|testSelectedCardKeepsExactItemWhenOtherFieldsAreUnread|testSelectedPPFractionNeedsDistinctMatchingContrastReadsAndExistingDigits|testAlternateLiteralRequiresExactSameSlotAndValidPP|testScaledAndRotatedInspectionKeepAllSelectedNumbersBoundToSource|testActualAppleVisionReadsOpponentSandStreamFromRetainedCapture|testActualAppleVisionKnockOffOwnItemHistoryNeedsMatchingOwnCard|testR955RetryTimeoutPreservesFrame3402FirstPassOnly|testR961PreservesConfirmedOwnPairsAndLimitsOptionalRetryOnR959Frames|testFallbackDoesNotSilentlyReplaceADifferentHPReading|R855FastLosslessPNGTests|testR956ActualSelectionAndDualHUDStayOutOfSingleCardRoute' 2>&1 | tee "$RUNNER_TEMP/r961-vision.log"


          grep -F "testPhoneStatusFromActualSelectedScreenshotRegions]' passed" "$RUNNER_TEMP/r961-vision.log"
          grep -F "testRetainedBuild715InspectionAndNonSelectedTransition]' passed" "$RUNNER_TEMP/r961-vision.log"
          grep -F "testSelectedMovePPStillRecordedWhenNameIsUnreadable]' passed" "$RUNNER_TEMP/r961-vision.log"
          grep -F "testUnknownSelectedSpeciesKeepsHPAndPPWithoutActiveIdentity]' passed" "$RUNNER_TEMP/r961-vision.log"
          grep -F "testAlternateLiteralRequiresExactSameSlotAndValidPP]' passed" "$RUNNER_TEMP/r961-vision.log"
          grep -F "testScaledAndRotatedInspectionKeepAllSelectedNumbersBoundToSource]' passed" "$RUNNER_TEMP/r961-vision.log"
          grep -F "testActualAppleVisionReadsOpponentSandStreamFromRetainedCapture]' passed" "$RUNNER_TEMP/r961-vision.log"
          grep -F "testActualAppleVisionKnockOffOwnItemHistoryNeedsMatchingOwnCard]' passed" "$RUNNER_TEMP/r961-vision.log"

          grep -F "testSelectedCardKeepsExactItemWhenOtherFieldsAreUnread]' passed" "$RUNNER_TEMP/r961-vision.log"

          grep -F "testSelectedPPFractionNeedsDistinctMatchingContrastReadsAndExistingDigits]' passed" "$RUNNER_TEMP/r961-vision.log"

          grep -F "testR955RetryTimeoutPreservesFrame3402FirstPassOnly]' passed" "$RUNNER_TEMP/r961-vision.log"
          grep -F 'R855_FAST_PNG_ICC_ALPHA_STRIDE_IMAGEIO_READBACK_PASS' "$RUNNER_TEMP/r961-vision.log"

          grep -F "testR956ActualSelectionAndDualHUDStayOutOfSingleCardRoute]' passed" "$RUNNER_TEMP/r961-vision.log"

          grep -F "testR961PreservesConfirmedOwnPairsAndLimitsOptionalRetryOnR959Frames]' passed" "$RUNNER_TEMP/r961-vision.log"
  publish:
    name: Publish and verify the tested IPA
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    needs: [verify, vision]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: r961-ipa
          path: R961Delivery
      - name: Publish and verify the download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd R961Delivery
          python3 - <<'VERIFY'
          import hashlib,json,os
          from pathlib import Path
          p=Path('R961_Unsigned_DeviceTest.ipa')
          r=json.loads(Path('VERIFICATION_R961.json').read_text())
          assert r['source_commit']==os.environ['GITHUB_SHA'] and r['build']==961
          assert r['ipa_bytes']==p.stat().st_size
          assert r['ipa_sha256']==hashlib.sha256(p.read_bytes()).hexdigest()
          VERIFY
          tag=r961-final-device-test
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft > existing.json 2>/dev/null; then
            test "$(jq -r .isDraft existing.json)" = true
            gh release upload "$tag" R961_Unsigned_DeviceTest.ipa VERIFICATION_R961.json restore_capture.py R961_PC_Capture_Tools.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" R961_Unsigned_DeviceTest.ipa VERIFICATION_R961.json restore_capture.py R961_PC_Capture_Tools.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title 'R961 iPhone 実機テスト 0.9.61' --notes '実機で読めていた自分HPの表示を追加読取の待ちから保護。相手HP追加読取に取得から750 msの共通期限を適用。確認した相手の技は履歴と判明技の両方に記録。'
          fi
          mkdir readback
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.ipa' --dir readback
          cmp R961_Unsigned_DeviceTest.ipa readback/R961_Unsigned_DeviceTest.ipa
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/R961_Unsigned_DeviceTest.ipa"
          curl --fail -sSL --retry 4 --retry-all-errors "$url" -o readback/published.ipa
          cmp R961_Unsigned_DeviceTest.ipa readback/published.ipa
          echo "R961_PUBLIC_READBACK_VERIFIED $url"

          curl --fail -sSL --retry 4 --retry-all-errors "${url%/*}/restore_capture.py" -o readback/restore_capture.py
          cmp restore_capture.py readback/restore_capture.py

          curl --fail -sSL --retry 4 --retry-all-errors "${url%/*}/R961_PC_Capture_Tools.zip" -o readback/R961_PC_Capture_Tools.zip
          cmp R961_PC_Capture_Tools.zip readback/R961_PC_Capture_Tools.zip
