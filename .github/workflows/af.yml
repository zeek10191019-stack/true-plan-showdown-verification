name: R591 Connected HP Color Shape (No IPA)
"on":
  push:
    paths: [.github/workflows/af.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
      PYTHONOPTIMIZE: "0"
    steps:
      - name: Replay SHA-pinned R590 and R591 exact two-file delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'R591_REPLAY'
          import ast,base64,hashlib,json,lzma,re,textwrap,urllib.request
          from pathlib import Path
          H=lambda b:hashlib.sha256(b).hexdigest()
          url="https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/bd5c458fb248d9f2862553575a02bf2fd92ec036/.github/workflows/ae.yml"
          raw=urllib.request.urlopen(url,timeout=90).read()
          gitblob=hashlib.sha1(b"blob "+str(len(raw)).encode()+bytes([0])+raw).hexdigest()
          assert len(raw)==14638 and gitblob=="9d301ffe80a08a479ac7d3bb787a4dedda4dc100","R591_PARENT_AE_WORKFLOW_MISMATCH"
          m=re.search(r"python3 - <<'R590_REPLAY'\n(.*?)\n\s+R590_REPLAY",raw.decode(),re.S)
          assert m,"R591_PARENT_REPLAY_NOT_FOUND"
          ancestor=textwrap.dedent(m.group(1));ast.parse(ancestor)
          exec(compile(ancestor,"PINNED_R590_REPLAY","exec"))
          # R591_PATCH_BEGIN
          rows=json.loads(lzma.decompress(base64.b64decode("")))
          assert len(rows)==2 and sorted(r['path'] for r in rows)==sorted(['app/ios/ChampionsOnDevice/R590ColorHUDCorroboration.swift','tests/R590ColorHUDCorroborationHarness.swift'])
          updates=[]
          for row in rows:
           p=Path(row['path']);old=p.read_bytes()
           assert H(old)==row['old_sha256'] and len(old)==row['old_bytes'],('WRONG_R590_PARENT',str(p))
           data=old
           for s in reversed(row['spans']):
            i=s['offset'];n=s['remove']
            assert 0<=i<=i+n<=len(data)
            data=data[:i]+base64.b64decode(s['insert'],validate=True)+data[i+n:]
           assert H(data)==row['new_sha256'] and len(data)==row['new_bytes'],('R591_SHA_MISMATCH',str(p))
           updates.append((p,data))
          for p,data in updates:p.write_bytes(data)
          assert len(list(Path('app/ios/ChampionsOnDevice').glob('*.swift')))==132
          print('R591_REPLAY_AND_SHA_TWO_OF_TWO_PASS')
          # R591_PATCH_END
          R591_REPLAY
      - name: Swift parse, geometry regression and Apple native build
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse app/ios/ChampionsOnDevice/*.swift
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R590ColorHUDCorroboration.swift tests/R590ColorHUDCorroborationHarness.swift -o "$RUNNER_TEMP/r591-test"
          "$RUNNER_TEMP/r591-test"
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R589PixelHUDProbe.swift tests/R589PixelHUDProbeHarness.swift -o "$RUNNER_TEMP/r589-test"
          "$RUNNER_TEMP/r589-test"
          python3 tools/run_r571_native.py || { for f in reports/xcode_iphoneos_build.log reports/r574_png_replay_compile.log; do [ ! -f "$f" ] || grep -nE 'error:|fatal error|BUILD FAILED' "$f" | tail -n 65 || true; done; exit 1; }
          echo 'R591_APPLE_BUILD_CHECK_ONLY; real image HP accuracy, owner, Mega remain UNVERIFIED; NO IPA'
