           assert.equal(norm(original),norm(reproduced),'same prefix+seed must replay identically');
           const prefix=sha(JSON.stringify(original.inputLog));
           const restored=Battle.fromJSON(original.toJSON());
           assert.equal(norm(original),norm(restored),'snapshot restore differs');
           assert.equal(sha(JSON.stringify(restored.inputLog)),prefix,'prefix changed on restore');
           const snapA=Battle.fromJSON(original.toJSON());
           const snapB=Battle.fromJSON(original.toJSON());
           const snapC=Battle.fromJSON(original.toJSON());
           // Set future RNG *only*, never resetRNG (which logs a message), no prefix replay.
           snapA.prng.setSeed('111,222,333,444');
           snapB.prng.setSeed('111,222,333,444');
           snapC.prng.setSeed('555,666,777,888');
           assert.equal(sha(JSON.stringify(snapA.inputLog)),prefix,'future seed modified history');
           assert.equal(sha(JSON.stringify(snapC.inputLog)),prefix,'alternate future seed modified history');
           const futureA=Array.from({length:12},()=>snapA.random());
           const futureB=Array.from({length:12},()=>snapB.random());
           const futureC=Array.from({length:12},()=>snapC.random());
           assert.deepEqual(futureA,futureB,'same future seed not deterministic');
           assert.notDeepEqual(futureA,futureC,'different future seeds produce same draw sequence');
           assert.equal(JSON.stringify(original.toJSON()),frozenJSON,'clones mutated original');
           // Verify branch A and B have identical deterministic in-battle continuation after
           // setting the *same* future seed again. Reusing arrays above consumed the streams.
           snapA.prng.setSeed('111,222,333,444');
           snapB.prng.setSeed('111,222,333,444');
           assert.equal(snapA.requestState,'move');
           snapA.makeChoices('move 1','move 1');
           snapB.makeChoices('move 1','move 1');
           assert.equal(norm(snapA),norm(snapB),'identical branch continuation diverged');
           assert.equal(JSON.stringify(original.toJSON()),frozenJSON,'branch continued into original');
           const origReplay=Battle.fromJSON(original.toJSON());
           const snapReplay=Battle.fromJSON(original.toJSON());
           origReplay.makeChoices('move 1','move 1');
           snapReplay.makeChoices('move 1','move 1');
           assert.equal(norm(origReplay),norm(snapReplay),'prefix replay vs snapshot continuation mismatch');
           status.status='PASS_PUBLIC_NATIVE_NONCERTIFYING';
           status.prefix_sha256=prefix;
           status.initial_snapshot_sha256=sha(norm(original));
           status.same_seed_future_stream_sha256=sha(JSON.stringify(futureA));
           status.alternate_seed_stream_sha256=sha(JSON.stringify(futureC));
           status.checks=['pinned_source_tree','M-C mod','prefix_deterministic','snapshot_roundtrip',
            'history_immutable_on_future_seed','same_future_seed_equal','different_future_seed_diverges',
            'clone_isolation','continued_battle_same_seed','prefix_vs_snapshot_continuation'];
           status.limits='Cannot prove exact M-C stochastic distribution, actual game parity, 33/34 physics cases, or full private provider wiring.';
          } catch(e){fail(e.stack||e.message||e);}
          if(OUT){fs.mkdirSync(path.dirname(OUT),{recursive:true});fs.writeFileSync(OUT,JSON.stringify(status,null,2)+'\n');}
          console.log(JSON.stringify(status,null,2));
          if(status.status!=='PASS_PUBLIC_NATIVE_NONCERTIFYING')process.exitCode=1;
          R27_VERIFIER_PAYLOAD_EOF
          cat > tools/t025_receipt_check.py <<'R27_VERIFIER_PAYLOAD_EOF'
          #!/usr/bin/env python3
          """R25 T025 native probe receipt gate: evidence never self-certifies Champions mechanics."""
          import argparse, json, pathlib, re
          EXPECTED={'schema':'TRUE_PLAN_T025_MC_NATIVE_PROBE_V1','status':'PASS_PUBLIC_NATIVE_NONCERTIFYING',
              'pinned_commit':'aa17ca0fac8bc5605df673bd8774c2d0e91efa43',
              'tree':'98c9038b81fa5ed7f1e9818736b701918920501e','node':'v22.18.0',
              'native33':'0/33','exact34':'0/34','formal_battles_increment':0,'mod':'champions'}
          REQUIRED={'pinned_source_tree','M-C mod','prefix_deterministic','snapshot_roundtrip',
              'history_immutable_on_future_seed','same_future_seed_equal','different_future_seed_diverges',
              'clone_isolation','continued_battle_same_seed','prefix_vs_snapshot_continuation'}
          HEX=re.compile(r'[0-9a-f]{64}\Z')
          def check(r):
              if not isinstance(r,dict):return 'INVALID_RECEIPT'
              if any(r.get(k)!=v for k,v in EXPECTED.items()):return 'INVALID_RECEIPT'
              if not isinstance(r.get('checks'),list) or set(r['checks'])!=REQUIRED:return 'INVALID_RECEIPT'
              if any(not isinstance(r.get(k),str) or not HEX.fullmatch(r[k]) for k in (
                      'prefix_sha256','initial_snapshot_sha256','same_seed_future_stream_sha256','alternate_seed_stream_sha256')):
                  return 'INVALID_RECEIPT'
              if r['same_seed_future_stream_sha256']==r['alternate_seed_stream_sha256']:
                  return 'INVALID_RECEIPT'
              return 'NATIVE_PROBE_CLAIM_REQUIRES_INDEPENDENT_LOG_REVIEW'
          if __name__=='__main__':
              ap=argparse.ArgumentParser();ap.add_argument('receipt');ap.add_argument('--out',required=True);a=ap.parse_args()
              try:s=check(json.loads(pathlib.Path(a.receipt).read_text()))
              except (OSError,ValueError):s='INVALID_RECEIPT'
              pathlib.Path(a.out).write_text(json.dumps({'status':s,'native33':'0/33','exact34':'0/34'},indent=2)+'\n')
              print(s);raise SystemExit(0 if s.startswith('NATIVE_PROBE_CLAIM') else 2)
          R27_VERIFIER_PAYLOAD_EOF
      - name: Pin Node 22.18.0
        uses: actions/setup-node@v4
        with:
