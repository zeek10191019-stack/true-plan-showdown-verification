  compare:
    name: R27 corroborate two public runner jobs
    if: ${{ github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false }}
    needs: [build_a, build_b]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: R27 materialize public-only pinned verifier (no repo files required)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools
          cat > tools/t008_verify_jobs_v2.py <<'R27_VERIFIER_PAYLOAD_EOF'
          #!/usr/bin/env python3
          """R26 T008 job metadata crosscheck with official GitHub Actions jobs API.
          Use only in public GitHub Actions verification repository. No artificial PASS on errors.
          """
          import json
          import os
          import re
          import sys
          import urllib.request
          
          REPO = 'zeek10191019-stack/true-plan-showdown-verification'
          SHA = re.compile(r'^[0-9a-f]{64}$')
          SHA40 = re.compile(r'^[0-9a-f]{40}$')
          
          
          def verify(a, b, api, repo, run_id, attempt, head_sha):
              required = {'dist_root_sha256', 'lock_sha256', 'package_sha256', 'champions_scripts_sha256'}
              for lane in (a, b):
                  if not required.issubset(lane) or any(not SHA.fullmatch(str(lane.get(k, ''))) for k in required):
                      return 'INVALID_DIGEST_OUTPUTS'
                  if not isinstance(lane.get('dist_file_count'), int) or lane['dist_file_count'] <= 0:
                      return 'INVALID_DIGEST_OUTPUTS'
                  if lane.get('verifier_sha') != head_sha or lane.get('run_id') != run_id or lane.get('run_attempt') != attempt:
                      return 'CROSS_RUN_OR_ATTEMPT_EVIDENCE'
              if any(a[k] != b[k] for k in required | {'dist_file_count'}):
                  return 'DIST_OR_SOURCE_MISMATCH'
              if repo != REPO or not isinstance(run_id, int) or run_id <= 0 or not isinstance(attempt, int) or attempt <= 0:
                  return 'INVALID_GITHUB_IDENTITY'
              if not SHA40.fullmatch(head_sha):
                  return 'INVALID_GITHUB_IDENTITY'
              if not isinstance(api, dict) or not isinstance(api.get('jobs'), list):
                  return 'INVALID_GITHUB_JOB_API'
              jobs = api['jobs']
              # API names match the two uniquely named, separate jobs below.
              selected = []
              for name in ('R27 pinned build A', 'R27 pinned build B'):
                  matches = [j for j in jobs if j.get('name') == name]
                  if len(matches) != 1:
                      return 'JOB_MISSING_OR_DUPLICATE'
                  j = matches[0]
                  if j.get('run_id') != run_id or j.get('head_sha') != head_sha:
                      return 'JOB_WRONG_RUN_OR_SHA'
                  if j.get('status') != 'completed' or j.get('conclusion') != 'success':
                      return 'JOB_NOT_SUCCESS'
                  if not isinstance(j.get('id'), int) or j['id'] <= 0 or not isinstance(j.get('runner_id'), int) or j['runner_id'] <= 0:
                      return 'JOB_OR_RUNNER_ID_MISSING'
                  if 'ubuntu-24.04' not in j.get('labels', []):
                      return 'NONSTANDARD_RUNNER_OR_MISSING_LABEL'
                  selected.append(j)
              if selected[0]['id'] == selected[1]['id'] or selected[0]['runner_id'] == selected[1]['runner_id']:
                  return 'RUNNER_INDEPENDENCE_NOT_ESTABLISHED'
              return 'DUAL_BUILD_VERIFIED_PUBLIC_CI_ONLY'
          
          
          def evidence_from_env(prefix):
              return dict(dist_root_sha256=os.environ[prefix + '_DIST'],
                          dist_file_count=int(os.environ[prefix + '_COUNT']),
                          lock_sha256=os.environ[prefix + '_LOCK'],
                          package_sha256=os.environ[prefix + '_PACKAGE'],
                          champions_scripts_sha256=os.environ[prefix + '_SCRIPT'],
                          verifier_sha=os.environ[prefix + '_SHA'],
                          run_id=int(os.environ[prefix + '_RUN']),
                          run_attempt=int(os.environ[prefix + '_ATTEMPT']))
          
          
          def run():
              try:
                  repo = os.environ['GITHUB_REPOSITORY']
                  run_id = int(os.environ['GITHUB_RUN_ID'])
                  attempt = int(os.environ['GITHUB_RUN_ATTEMPT'])
                  head_sha = os.environ['GITHUB_SHA']
                  if repo != REPO:
                      raise ValueError('only whitelisted public verifier repo permitted')
                  url = 'https://api.github.com/repos/' + repo + '/actions/runs/' + str(run_id) + '/jobs?filter=latest&per_page=100'
                  headers = {'Accept':'application/vnd.github+json', 'User-Agent':'true-plan-R26-public-verifier'}
                  token = os.environ.get('GITHUB_TOKEN', '')
                  if token:
                      headers['Authorization'] = 'Bearer ' + token
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=20) as response:
                      api = json.load(response)
                  result = verify(evidence_from_env('A'), evidence_from_env('B'), api, repo, run_id, attempt, head_sha)
              except Exception as exc:
                  result = 'INDEPENDENT_JOB_PROVENANCE_UNAVAILABLE'
                  print('R26 evidence verification error:', type(exc).__name__, str(exc)[:250], file=sys.stderr)
              print('R27 T008:', result)
              print('Native33=0/33 Exact34=0/34 FormalIncrement=0')
              print('T025 requires independent Native/per-game parity inspection.')
              return 0 if result == 'DUAL_BUILD_VERIFIED_PUBLIC_CI_ONLY' else 2
          
          
          if __name__ == '__main__':
              sys.exit(run())
          R27_VERIFIER_PAYLOAD_EOF
      - name: Verify dist/source digests and independent GitHub job IDs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          A_DIST: ${{ needs.build_a.outputs.dist }}
          A_COUNT: ${{ needs.build_a.outputs.count }}
          A_LOCK: ${{ needs.build_a.outputs.lock }}
          A_PACKAGE: ${{ needs.build_a.outputs.package }}
          A_SCRIPT: ${{ needs.build_a.outputs.script }}
          A_SHA: ${{ needs.build_a.outputs.sha }}
          A_RUN: ${{ needs.build_a.outputs.run }}
          A_ATTEMPT: ${{ needs.build_a.outputs.attempt }}
          B_DIST: ${{ needs.build_b.outputs.dist }}
          B_COUNT: ${{ needs.build_b.outputs.count }}
          B_LOCK: ${{ needs.build_b.outputs.lock }}
          B_PACKAGE: ${{ needs.build_b.outputs.package }}
          B_SCRIPT: ${{ needs.build_b.outputs.script }}
          B_SHA: ${{ needs.build_b.outputs.sha }}
          B_RUN: ${{ needs.build_b.outputs.run }}
          B_ATTEMPT: ${{ needs.build_b.outputs.attempt }}
        run: |
          set -euo pipefail
          python3 tools/t008_verify_jobs_v2.py
          echo 'Source consistency is independent of actual Champions-game parity.'
