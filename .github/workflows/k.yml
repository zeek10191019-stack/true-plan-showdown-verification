jobs:
  build:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            1e63efa4db514cc122f2940a39623d9bc65c554c
      - name: Verify R692 and build IPA
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os,re,base64,lzma,hashlib
          import pathlib,urllib.request,ast
          url=('https://raw.githubusercontent.com/'
            'zeek10191019-stack/'
            'true-plan-showdown-verification/'
            '0b28ecff453d9e1650f6dd196083f165'
            '586a5f52/.github/workflows/j.yml')
          req=urllib.request.Request(url,headers={
            'User-Agent':'R692-Pinned-Builder'})
          with urllib.request.urlopen(
            req,timeout=40) as res:
            j=res.read(10000)
          assert len(j)==8786
          assert hashlib.sha256(j).hexdigest()==(
            'a86a29c26c00727e330228e0e6a0addac'
            '13c1b79891761a539ff4e681278da38')
          m=re.search(rb'(?m)^  R691_PKG: >-\n'
             rb'((?:    [^\n]*\n)+)',j)
          assert m,'R691_PINNED_PACKAGE_MISSING'
          os.environ['R691_PKG']=b''.join(
            m[1].split()).decode('ascii')
          raw=lzma.decompress(base64.b64decode(
            os.environ['R692_PKG']),
            format=lzma.FORMAT_ALONE)
          assert hashlib.sha256(raw).hexdigest()==(
            'c4add045a8521ea01033c15003bd81b7'
            '3752d923f437be3d0d856fb7cd97cf6c')
          names=['R692StructuredReadout.swift',
            'R692Patch.py','R692MakeBuild.py',
            'R692StandaloneStub.swift',
            'R692ReadoutSmoke.swift']
          sizes=[6877, 1890, 2199, 146, 3013]
          assert sum(sizes)==len(raw)
          pos=0
          for name,size in zip(names,sizes):
            isTest=name.endswith('Smoke.swift')
            if 'StandaloneStub' in name:
              isTest=True
            folder='tests' if isTest else 'tools'
            p=pathlib.Path(folder)/name
            p.parent.mkdir(
              parents=True,exist_ok=True)
            p.write_bytes(raw[pos:pos+size])
            pos+=size
          print('R692_SOURCE_SHA_PASS',flush=True)
          text=j.decode('utf-8')
          marker="          python3 - <<'PYCODE'\n"
          start=text.index(marker)+len(marker)
          end=text.index('\n          PYCODE',start)
          block=text[start:end]
          body='\n'.join(line[10:] for line in
            block.splitlines())
          needle=("['python3','tools/"+
            "R691MakeBuild.py']")
          assert body.count(needle)==1
          body=body.replace(needle,
            "['python3','tools/R692MakeBuild.py']")
          ast.parse(body)
          exec(compile(body,'r691','exec'),{})
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: R692-unsigned-iLoader-IPA
          path: dist/R692*
          if-no-files-found: error
          retention-days: 7
