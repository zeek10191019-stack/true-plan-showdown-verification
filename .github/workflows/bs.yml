      - name: 79-field Swift regression
        shell: bash
        run: |
          set -euo pipefail
          cd app/ios/ChampionsOnDevice
          swiftc -parse-as-library \
            R581ReadabilityCoverage.swift \
            R634FieldEvidenceRouting.swift \
            ../../../tests/R634FieldRoutingHarness.swift \
            -o "$RUNNER_TEMP/r634"
          "$RUNNER_TEMP/r634"
          swiftc -parse-as-library \
            R581ReadabilityCoverage.swift \
            ../../../tests/R581CoverageHarness.swift \
            -o "$RUNNER_TEMP/r581"
          "$RUNNER_TEMP/r581"
          swiftc -frontend -parse *.swift
      - name: Native iPhoneOS build
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/run_r571_native.py
      - name: Commit on isolated branch only
        shell: bash
        run: |
          set -euo pipefail
          branch=r634-field-routing
          if git ls-remote --exit-code --heads origin \
              "refs/heads/$branch" >/dev/null 2>&1; then
            echo 'Branch already exists; refusing overwrite' >&2
            exit 1
          fi
          git checkout -b "$branch"
          git add -- \
            app/ios/ChampionsOnDevice/R634FieldEvidenceRouting.swift \
            app/ios/ChampionsOnDevice/CaptureCoordinator.swift \
            app/ios/ChampionsOnDevice/R576OfflinePNGInspector.swift \
            tests/R634FieldRoutingHarness.swift
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'R634: register 79 evidence reader routes'
          git push origin "HEAD:refs/heads/$branch"
