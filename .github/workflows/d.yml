jobs:
  verify:
    if: >-
      github.repository ==
      'zeek10191019-stack/true-plan-showdown-verification'
      && github.ref == 'refs/heads/main'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      PYTHONOPTIMIZE: '0'
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 58fdd39269d30994d841cd177fcebff5a19ee8c4
        persist-credentials: true
    - name: R662 typed tracking CI and research save
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os,base64,lzma,hashlib
        from pathlib import Path
        raw=lzma.decompress(base64.b85decode(''.join(
          os.environ['PACK'].split())))
        assert len(raw)==24981
        assert hashlib.sha256(raw).hexdigest()==(
          'cb0f8a814ae03da00e21f7695eacac3d' +
          'd83b1782c7be574e59af06ff3aaa78e7')
        names=[
          'app/ios/ChampionsOnDevice/' +
          'R662TrackingEvidenceGate.swift',
          'app/ios/ChampionsOnDevice/' +
          'R662VisionRegionTracking.swift',
          'tests/R662TrackingEvidenceHarness.swift',
          'tests/R662NativeTrackingHarness.swift',
          'tools/r662_patch.py',
          'research/R662_README.md',
          '__TEMP__/r662-run.sh',
        ]
        sizes=[
          4620,
          6293,
          4153,
          3514,
          1406,
          2444,
          2551,
        ]
        pos=0
        for name,size in zip(names,sizes):
          block=raw[pos:pos+size]
          pos+=size
          assert len(block)==size
          path=(Path(os.environ['RUNNER_TEMP'])/
            name.split('/')[-1]) if name.startswith(
            '__TEMP__/') else Path(name)
          assert not path.exists(),name
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_bytes(block)
        assert pos==len(raw)
        PY
        bash "$RUNNER_TEMP/r662-run.sh"
