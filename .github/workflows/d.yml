jobs:
  build:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            1e63efa4db514cc122f2940a39623d9bc65c554c
      - name: Build protected capture IPA
        shell: bash
        run: |
          python3 - <<'PY'
          import os,base64,lzma,hashlib,pathlib
          blob=lzma.decompress(base64.b64decode(
              os.environ['R687_PKG']),
              format=lzma.FORMAT_ALONE)
          want=(
            'da96c99102a120327c23460cb38699e5'
            '433a05985850c6ad566de6e3ef62d115'
          )
          assert hashlib.sha256(blob).hexdigest()==(
            want)
          files=[
            'tools/R686Build.py',
            'tools/R686Patch.py',
            'app/ios/ChampionsOnDevice/' +
            'R686JournalCore.swift',
            'app/ios/ChampionsOnDevice/' +
            'R686FrameJournal.swift',
            'tests/R686ScorecardRegression.swift',
            'tools/R687Build.py',
            'tools/R687Patch.py',
            'tests/R687RetentionTests.swift',
          ]
          sizes=[
            4070,
            5921,
            5740,
            7711,
            2595,
            2902,
            4051,
            1684,
          ]
          assert len(files)==len(sizes)
          assert sum(sizes)==len(blob)
          cursor=0
          for name,size in zip(files,sizes):
            path=pathlib.Path(name)
            assert not path.exists(),name
            path.parent.mkdir(
              parents=True,exist_ok=True)
            path.write_bytes(
              blob[cursor:cursor+size])
            cursor+=size
          assert cursor==len(blob)
          print('R687_PACKED_SOURCES_SHA_PASS')
          PY
          python3 tools/R687Build.py
      - uses: actions/upload-artifact@v4
        with:
          name: R687-protected-iLoader-IPA
          path: dist/R687*
          if-no-files-found: error
          retention-days: 7
