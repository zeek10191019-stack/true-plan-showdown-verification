name: R595 Visual Form Reference Candidate Audit (No IPA)
"on":
  push:
    paths: [.github/workflows/ak.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
      PYTHONOPTIMIZE: "0"
    steps:
      - name: Replay SHA-pinned R594 from aj.yml and apply R595 delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'R595_REPLAY'
          import ast,base64,hashlib,json,lzma,re,textwrap,urllib.request
          from pathlib import Path
          H=lambda b:hashlib.sha256(b).hexdigest()
          url="https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/d2b1995856aeb3fe07697a5b4cc13b1dd4126d67/.github/workflows/aj.yml"
          raw=urllib.request.urlopen(url,timeout=90).read()
          blob=hashlib.sha1(b"blob "+str(len(raw)).encode()+bytes([0])+raw).hexdigest()
          assert len(raw)==14577 and blob=="ee6a687f4ce43ae0fea08ab49e247799da727d92","R595_PARENT_PIN_INVALID"
          match=re.search(r"python3 - <<'R594_REPLAY'\n(.*?)\n\s+R594_REPLAY",raw.decode(),re.S)
          assert match,"R595_PARENT_REPLAY_NOT_FOUND"
          parent=textwrap.dedent(match.group(1));ast.parse(parent)
          exec(compile(parent,'R594_PINNED_REPLAY','exec'))
          delta=json.loads(lzma.decompress(base64.b64decode("")))
          assert delta['schema']=='trueplan.r595.delta.v1' and delta['parent']=='R594'
          assert len(delta['files'])==3
          updates=[]
          for r in delta['files']:
           path=Path(r['path']);before=path.read_bytes() if path.exists() else None
           assert (H(before) if before is not None else None)==r['old_sha256'],('R595_PARENT_SHA_INVALID',r['path'])
           assert (len(before) if before is not None else None)==r['old_bytes']
           if r['mode']=='new_file':
            assert before is None;data=base64.b64decode(r['data_b64'],validate=True)
           else:
            assert r['mode']=='multi_spans' and before is not None
            data=before
            for e in reversed(r['edits']):
             k=e['start'];n=e['remove'];assert 0<=k<=k+n<=len(before)
             data=data[:k]+base64.b64decode(e['data_b64'],validate=True)+data[k+n:]
           assert len(data)==r['new_bytes'] and H(data)==r['new_sha256'],('R595_FILE_SHA_MISMATCH',r['path'])
           updates.append((path,data))
          for path,data in updates:
           path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data)
          assert len(list(Path('app/ios/ChampionsOnDevice').glob('*.swift')))==136
          print('R595_PINNED_3_FILE_PATCH_PASS')
          R595_REPLAY
      - name: R595 match/hold tests, Swift parse and existing native Apple build
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse app/ios/ChampionsOnDevice/*.swift
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R594ActorAppearance.swift app/ios/ChampionsOnDevice/R595FormReferenceMatcher.swift tests/R595FormReferenceMatcherHarness.swift -o "$RUNNER_TEMP/r595"
          "$RUNNER_TEMP/r595"
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R594ActorAppearance.swift tests/R594ActorAppearanceHarness.swift -o "$RUNNER_TEMP/r594"
          "$RUNNER_TEMP/r594"
          python3 tools/run_r571_native.py || { for f in reports/xcode_iphoneos_build.log reports/r574_png_replay_compile.log; do [ ! -f "$f" ] || grep -nE 'error:|fatal error|BUILD FAILED' "$f" | tail -n 65 || true; done; exit 1; }
          echo 'R595 Apple build tested; no registered form references, no certified Mega/side/species/real-game accuracy; no IPA.'
