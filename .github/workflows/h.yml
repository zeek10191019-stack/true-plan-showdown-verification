jobs:
  verify:
    if: >-
      github.repository ==
      'zeek10191019-stack/true-plan-showdown-verification'
      && github.ref == 'refs/heads/main'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      PYTHONOPTIMIZE: '0'
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
    steps:
    - uses: actions/checkout@v4
      with:
        ref: e4be83b2bac606522e153ccd5328b1f2c8a16b29
        persist-credentials: true
    - name: R665 corrected fixture and Apple CI
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os,base64,lzma,hashlib
        from pathlib import Path
        raw=lzma.decompress(base64.b85decode(''.join(
          os.environ['PACK'].split())))
        assert len(raw)==28062
        assert hashlib.sha256(raw).hexdigest()==(
          '4ace5d0119fe54e7b27ae30c617196fb' +
          '507db940d4f2c42ad3984b1347d86eb5')
        names=[
          'app/ios/ChampionsOnDevice/' +
          'R665EvidenceTraceAudit.swift',
          'tests/R665EvidenceTraceHarness.swift',
          'tools/r665_patch.py',
          'research/R665_README.md',
          '__TEMP__/r665-run.sh',
        ]
        sizes=[
          12329,
          10670,
          1326,
          2075,
          1662,
        ]
        pos=0
        for name,size in zip(names,sizes):
          chunk=raw[pos:pos+size]
          pos+=size
          assert len(chunk)==size
          p=(Path(os.environ["RUNNER_TEMP"])/
             name.split('/')[-1]) if name.startswith(
             '__TEMP__/') else Path(name)
          assert not p.exists(),name
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_bytes(chunk)
        assert pos==len(raw)
        PY
        bash "$RUNNER_TEMP/r665-run.sh"
