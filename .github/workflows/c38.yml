name: R1038 C38 cancellable transfer staging and C37 regression (NO IPA)
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/c38.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    name: ${{ matrix.job }}
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
        - job: macos-source
          os: xcode-27
        - job: windows-cli
          os: windows-2025
        - job: windows-receiver
          os: windows-2025
        - job: macos-sender
          os: xcode-27
        - job: windows-hud
          os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
    - name: Run pinned C37 and C38 cancellation regression
      shell: bash
      env:
        C33_JOB: ${{ matrix.job }}
        GH_TOKEN: ${{ github.token }}
        PYTHONUTF8: '1'
      run: |
        set -Eeuo pipefail
        if [[ "$RUNNER_OS" == Windows ]]; then PY=python; else PY=python3; fi
        "$PY" - <<'C38_PY'
        import hashlib,urllib.request,pathlib,base64,zlib
        url='https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/8d0f9924357fa541e4fd329152531f94f55d8605/.github/workflows/c37.yml'
        with urllib.request.urlopen(url,timeout=60) as r: raw=r.read(50000)
        assert hashlib.sha256(raw).hexdigest()=='0ff14f8e95796969e8739c406d9e9dae9486585e2c8578f275c2da2a5499991a'
        body=raw.decode().split("        \"$PY\" - <<'C37_PY'\n",1)[1].split('\n        C37_PY',1)[0]
        code='\n'.join(l[8:] for l in body.splitlines())+'\n'
        assert hashlib.sha256(code.encode()).hexdigest()=='38ee4b036a3a0ab0f6bb867aab1e8e144cee3ae0f45283293fe284afda8b0a5b'
        anchor="(pathlib.Path(os.environ['RUNNER_TEMP'])/'c37.py').write_bytes(patch)";assert code.count(anchor)==1
        code=code.replace(anchor,anchor+"\nextra38=zlib.decompress(base64.b64decode(''));assert hashlib.sha256(extra38).hexdigest()=='04863753dd755521c786080625fadbd758a95c661f81c961996b6cb57a271ef1'\nassert patch.endswith(b'\\n')\n(pathlib.Path(os.environ['RUNNER_TEMP'])/'c37.py').write_bytes(patch+extra38)\n")
        exec(compile(code,'pinned-c37-bootstrap','exec'))
        C38_PY
  gate:
    needs:
    - verify
    if: always() && github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
    - name: 'Gate: every automated job must pass; no IPA or physical certification'
      shell: bash
      run: |
        set -Eeuo pipefail
        [[ '${{ needs.verify.result }}' == success ]]
        echo C38_AUTOMATED_GATE_PASS_UI_BACKGROUND_PHYSICAL_IPA_HOLD
