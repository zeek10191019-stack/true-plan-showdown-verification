    - name: Verify frozen source packet
      shell: bash
      run: |
        python3 - <<'PY'
        import os,base64,lzma,json,hashlib,pathlib
        raw=lzma.decompress(base64.b64decode((pathlib.Path(os.environ['RUNNER_TEMP'])/'r710-payload.b64').read_bytes()))
        assert len(raw)==1887088
        assert hashlib.sha256(raw).hexdigest()=='09e6d0a8f395807d700b42ff9c7d1be182c9283f1f0f646b3b47e15a61ac7e5a'
        root=pathlib.Path('.r710-build');root.mkdir(exist_ok=True)
        for name,source in json.loads(raw).items():
            p=pathlib.PurePosixPath(name)
            assert not p.is_absolute() and '..' not in p.parts
            target=root/name;target.parent.mkdir(parents=True,exist_ok=True)
            target.write_bytes(source.encode('utf-8'))
        print('R710_FROZEN_SOURCE_RESTORE_SHA_PASS')
        PY
    - name: Run production tests and iPhoneOS compile
      shell: bash
      run: |
        set -euo pipefail
        python3 .r710-build/tools/build_r710.py
    - name: Bound artifact storage within existing free scope
      id: budget
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 - <<'PY'
        import pathlib,os,json,urllib.request
        root=pathlib.Path('.r710-build/dist')
        size=sum(p.stat().st_size for p in root.rglob('*') if p.is_file()) if root.exists() else 0
        assert 0<size<16000000,('ARTIFACT_LOCAL_SIZE_HOLD',size)
        active=0
        for page in range(1,11):
            url=('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+
                 '/actions/artifacts?per_page=100&page='+str(page))
            req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                 'Accept':'application/vnd.github+json','User-Agent':'TruePlan-R710-Free-Guard'})
            with urllib.request.urlopen(req,timeout=30) as response: data=json.load(response)
            rows=data.get('artifacts',[])
            active+=sum(x['size_in_bytes'] for x in rows if not x.get('expired'))
            if len(rows)<100: break
        else: raise RuntimeError('ARTIFACT_INVENTORY_INCOMPLETE_HOLD')
        assert active+size<400000000,('FREE_SCOPE_STORAGE_HOLD',active,size)
        with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('allowed=true\n')
        print('R710_REPOSITORY_ARTIFACT_STORAGE_BOUND',active,size)
        PY
    - uses: actions/upload-artifact@v4
      if: always() && steps.budget.outputs.allowed == 'true'
      with:
        name: R710-audit-build
        path: .r710-build/dist/*
        if-no-files-found: error
        retention-days: 1
