name: R582 Auto Frame Coverage & Corrected R581 Replay (No IPA)
"on":
  push:
    branches: [main]
    paths: [.github/workflows/r582.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
      PYTHONOPTIMIZE: "0"
    steps:
      - name: Reconstruct R579 and R581 by immutable commits and exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'R582_REPLAY'
          import ast,base64,hashlib,json,lzma,re,textwrap,urllib.request
          from pathlib import Path
          sha=lambda b:hashlib.sha256(b).hexdigest()
          repo='https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/'
          parent=urllib.request.urlopen(repo+'8241f2285e644af7796cadb47cd2ba6912bec5ec/.github/workflows/r579.yml',timeout=90).read().decode()
          m=re.search(r"python3 - <<'R579_REPLAY'\n(.*?)\n\s+R579_REPLAY",parent,re.S)
          assert m,'R582_R579_MISSING'
          source=textwrap.dedent(m.group(1));ast.parse(source)
          exec(compile(source,'R579_PINNED_SCRIPT','exec'))
          print('R582_R579_PARENT_REPLAY_PASS')
          r581=urllib.request.urlopen(repo+'1749b26185431048c4067a4ee056207305c3a0c4/.github/workflows/r581.yml',timeout=90).read().decode()
          m=re.search(r"python3 - <<'R581_REPLAY'\n(.*?)\n\s+R581_REPLAY",r581,re.S)
          assert m,'R582_R581_MISSING'
          r581source=textwrap.dedent(m.group(1))
          ix=r581source.index('rows=json.loads(')
          r581patch=r581source[ix:]
          ast.parse(r581patch)
          exec(compile(r581patch,'R581_SOURCE_ONLY_WITH_PARENT_SHA','exec'))
          print('R582_R581_PARENT_REPLAY_PASS')
          rows582=json.loads(lzma.decompress(base64.b64decode("")))
          assert len(rows582)==3
          for r in rows582:
           p=Path(r['path']);old=p.read_bytes() if p.exists() else b''
           assert (sha(old) if old else None)==r['old_sha'],('R582_WRONG_R581_PARENT',r['path'])
          for r in rows582:
           p=Path(r['path']);old=p.read_bytes() if p.exists() else b''
           lines=old.splitlines(keepends=True)
           for h in reversed(r['hunks']):
            lines[h['start']:h['start']+h['delete']]=base64.b64decode(h['insert']).splitlines(keepends=True)
           data=b''.join(lines)
           assert len(data)==r['len'] and sha(data)==r['new_sha'],('R582_PATCH_SHA_MISMATCH',r['path'])
           p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          assert len(list(Path('app/ios/ChampionsOnDevice').glob('*.swift')))==124
          print('R582_ALL_SOURCE_SHA_PASS')
          R582_REPLAY
      - name: R581 coverage plus R582 automatic frame ledger native Swift tests
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse app/ios/ChampionsOnDevice/*.swift
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R581ReadabilityCoverage.swift tests/R581CoverageHarness.swift -o "$RUNNER_TEMP/r581-test"
          "$RUNNER_TEMP/r581-test"
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R582AutoCaptureCoverage.swift tests/R582AutoCaptureCoverageHarness.swift -o "$RUNNER_TEMP/r582-test"
          "$RUNNER_TEMP/r582-test"
      - name: Full Apple iPhoneOS build and Vision regressions without IPA
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 tools/run_r571_native.py; then
            echo 'R582_APPLE_BUILD_OR_OCR_FAILED'
            for log in reports/xcode_iphoneos_build.log reports/r574_png_replay_compile.log; do
              if [ -f "$log" ]; then
                grep -nE 'error:|fatal error|BUILD FAILED' "$log" | tail -n 65 || true
                tail -n 30 "$log" || true
              fi
            done
            exit 1
          fi
      - name: Certification limits
        if: always()
        run: echo 'Automatic frame metadata only, bounded snapshots, no full video archive, no real-screen 79/79 certification, no IPA.'
