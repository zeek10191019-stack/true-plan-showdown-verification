          '18590df860508eb751f771584144958b')
        ios='app/ios/ChampionsOnDevice/'
        names=[
          'research/R651_MEGA_CHAMPIONS_ASSET_INDEX.json',
          'research/r651_asset_guard.py',
          'research/r651_selftest.py',
          'research/R651_README.md',
          ios+'R652MegaReferenceInstaller.swift',
          ios+'R652MegaReferenceImportPanel.swift',
          'tests/R652MegaReferenceInstallerHarness.swift',
          'research/R652_README.md',
        ]
        sizes=[256701, 3985, 1932, 4028, 2905, 1424, 3759, 2844]
        p=0
        for name,size in zip(names,sizes):
          content=raw[p:p+size];p+=size
          assert len(content)==size
          dest=Path(name)
          assert not dest.exists(),name
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_bytes(content)
        assert p==len(raw)
        app=Path(ios+'ChampionsOnDeviceApp.swift')
        s=app.read_text(encoding='utf-8')
        anchor=('                    Section('
