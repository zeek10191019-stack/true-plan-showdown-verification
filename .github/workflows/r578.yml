          R578_REPLAY
      - name: Swift parse and R578 negative cases against synthetic PNG
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse app/ios/ChampionsOnDevice/*.swift
          python3 - <<'MAKE_PNG'
          from pathlib import Path
          import struct,zlib
          def block(tag,data):
            return struct.pack('>I',len(data))+tag+data+struct.pack('>I',zlib.crc32(tag+data)&0xffffffff)
          width,height=20,10
          raw=b''.join(b'\x00'+b'\xff'*width*3 for _ in range(height))
          encoded=b'\x89PNG\r\n\x1a\n'+block(b'IHDR',struct.pack('>2I5B',width,height,8,2,0,0,0))+block(b'IDAT',zlib.compress(raw))+block(b'IEND',b'')
          Path('/tmp/r578_test.png').write_bytes(encoded)
          MAKE_PNG
          swiftc -swift-version 5 -parse-as-library app/ios/ChampionsOnDevice/R576OfflinePNGImportGate.swift app/ios/ChampionsOnDevice/R577OfflineEvidenceReport.swift app/ios/ChampionsOnDevice/R578OfflineBundlePolicy.swift tests/R578OfflineBundlePolicyHarness.swift -o "$RUNNER_TEMP/r578-policy"
          "$RUNNER_TEMP/r578-policy" /tmp/r578_test.png
      - name: Apple native regression, Vision checks and iPhoneOS build
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 tools/run_r571_native.py; then
            echo 'R578 Apple native verification failed; printing direct compiler diagnostics without retry or new billing operation'
            for log in reports/xcode_iphoneos_build.log reports/r574_png_replay_compile.log; do
              if [ -f "$log" ]; then
                echo "FAILED_NATIVE_LOG: $log"
                grep -nE 'error:|fatal error|BUILD FAILED|SwiftCompile' "$log" | tail -n 45 || true
                tail -n 35 "$log" || true
              fi
            done
            exit 1
          fi
      - name: Certification scope
        if: always()
        run: |
          echo 'No IPA. Historical PNG and OCR matched. Live owner, Mega visual, turn and real-game accuracy NOT certified.'
