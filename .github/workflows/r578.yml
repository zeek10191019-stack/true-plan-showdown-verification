name: R578 Exact PNG and Diagnostic ZIP Pairing (No IPA)
"on":
  push:
    branches: [main]
    paths: [.github/workflows/r578.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: xcode-27
            role: IOS27_NATIVE
          - runner: macos-26-intel
            role: PORTABLE_OCR
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      SCREEN_READ_CI_ROLE: ${{ matrix.role }}
      PYTHONOPTIMIZE: "0"
    steps:
      - name: Restore pinned R577 and verify all R578 overlay bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'R578_REPLAY'
