          from pathlib import Path
          sha=lambda b:hashlib.sha256(b).hexdigest()
          url='https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/b63e1f04ebd64917ae4cd773ab6bc64e9b92c099/.github/workflows/r577.yml'
          parent=urllib.request.urlopen(url,timeout=120).read()
          assert len(parent)==10474 and sha(parent)=='fc203612e6de3791536953cf6434f9985e588bd6c1631272d9f61c41c62d95c0','R578_R577_PIN_CHANGED'
          script=re.search(r"python3 - <<'RESTORE_R577'\n(.*?)\n\s+RESTORE_R577",parent.decode(),re.S)
          assert script,'R578_R577_SCRIPT_MISSING'
          code=textwrap.dedent(script.group(1));ast.parse(code)
          exec(compile(code,'EXACT_R577_REPLAY','exec'))
