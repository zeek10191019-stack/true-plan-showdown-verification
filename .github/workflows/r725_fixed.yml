          -scheme ChampionsOnDeviceResearch -configuration Debug \
          -sdk iphoneos -destination 'generic/platform=iOS' \
          ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
          -derivedDataPath "$RUNNER_TEMP/r725-derived" build \
          > R725Artifacts/R725_IPHONEOS_XCODEBUILD.log 2>&1 || {
          grep -E 'error:|BUILD FAILED' R725Artifacts/R725_IPHONEOS_XCODEBUILD.log | tail -n 45 || true
          exit 1
        }
        grep -Fq 'BUILD SUCCEEDED' R725Artifacts/R725_IPHONEOS_XCODEBUILD.log
        python3 - <<'PYCODE'
        from pathlib import Path
        import json
        log=Path('R725Artifacts/R725_IPHONEOS_XCODEBUILD.log').read_text(errors='replace')
        for name in ('CaptureCoordinator.swift','R725LivePixelEvidence.swift',
                     'R719Core.swift','R720CaptureAudit.swift'):
