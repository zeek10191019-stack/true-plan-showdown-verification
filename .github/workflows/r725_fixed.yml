        receipt=Path('R725Artifacts/R725_RUNTIME_HOOK_RECEIPT.json')
        obj=json.loads(receipt.read_text());obj['iphoneos_build']='PASS_UNSIGNED_ONLY'
        receipt.write_text(json.dumps(obj,indent=2))
        import plistlib,zipfile,subprocess,os
        app=Path(os.environ['RUNNER_TEMP'])/'r725-derived/Build/Products/Debug-iphoneos/ChampionsOnDeviceResearch.app'
        assert app.is_dir(),'R725_COMPILED_APP_MISSING'
        info=plistlib.loads((app/'Info.plist').read_bytes())
        assert info['CFBundleVersion']=='725' and info['CFBundleShortVersionString']=='0.7.25'
        assert not (app/'embedded.mobileprovision').exists(),'R725_UNEXPECTED_SIGNED_APP'
        ipa=Path('R725Artifacts/R725_Unsigned_Research.ipa')
        with zipfile.ZipFile(ipa,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
            for p in sorted(app.rglob('*')):
                assert not p.is_symlink()
                if p.is_file():z.write(p,arcname='Payload/'+app.name+'/'+p.relative_to(app).as_posix())
        with zipfile.ZipFile(ipa) as z:
            assert z.testzip() is None,'R725_IPA_CRC_FAIL'
        assert ipa.stat().st_size<9_000_000,'R725_IPA_SIZE_HOLD'
        print('R725_FULL_APP_IPHONEOS_SWIFT_COMPILE_PASS_UNVERIFIED_RUNTIME',ipa.stat().st_size)
        PYCODE
    - name: Guard public free-scope artifact storage
      id: budget
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python3 - <<'PYCODE'
        from pathlib import Path
        import os,json,urllib.request
        root=Path('R725Artifacts')
        size=sum(p.stat().st_size for p in root.rglob('*') if p.is_file())
        assert 0<size<16_000_000,('R725_ARTIFACT_LOCAL_SIZE_HOLD',size)
        active=0
        for page in range(1,11):
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/artifacts?per_page=100&page='+str(page)
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                'Accept':'application/vnd.github+json','User-Agent':'TruePlan-R725-FreeGuard'})
          with urllib.request.urlopen(req,timeout=30) as res:rows=json.load(res).get('artifacts',[])
          active+=sum(x['size_in_bytes'] for x in rows if not x.get('expired'))
          if len(rows)<100:break
        else:raise RuntimeError('ARTIFACT_INVENTORY_INCOMPLETE_HOLD')
        assert active+size<400_000_000,('R725_FREE_SCOPE_STORAGE_HOLD',active,size)
        with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('allowed=true\n')
        print('R725_FREE_SCOPE_ARTIFACT_STORAGE_PASS',active,size)
        PYCODE
    - uses: actions/upload-artifact@v4
      if: always() && steps.budget.outputs.allowed == 'true'
      with:
        name: R725-full-runtime-source-and-ios-audit
        path: R725Artifacts/
        if-no-files-found: error
    - name: Strict device certification boundary
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        {
          echo '## R725 live CaptureCoordinator hook: CI source/compile only'
          echo 'R718 272 source paths preserved; CaptureCoordinator + Info.plist updated.'
          echo 'R719/R720 4 Swift files plus R725LivePixelEvidence.swift attached.'
          echo 'Pixel ROI SHA evidence appended to continuous/live_ocr.jsonl only for matching session.'
          echo 'No verified HUD calibration, owner, turn or game field. 0/79 device certified.'
          echo 'R715 original device recording not reanalyzed. No signed IPA generated.'
        } >> "$GITHUB_STEP_SUMMARY"
