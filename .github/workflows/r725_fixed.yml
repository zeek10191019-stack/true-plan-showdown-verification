                if p.is_file() and '.build' not in p.parts:
                    z.write(p,arcname='R720_PORTABLE_TESTS/'+p.relative_to('.r720-core').as_posix())
        with zipfile.ZipFile(archive) as z:
            assert z.testzip() is None,'R725_ARCHIVE_CRC_ERROR'
            names=set(z.namelist())
            for name in ['app/ios/ChampionsOnDevice/CaptureCoordinator.swift',
