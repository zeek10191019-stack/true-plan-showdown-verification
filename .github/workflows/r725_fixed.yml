                'file_count':len(names),'zip_size_bytes':archive.stat().st_size,
                'zip_sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),
                'crc':'PASS','r718_base_files':272,'additive_swift_files':5,
                'coordinator_modified':True,'runtime_target':'OCR_COMPLETED_TO_CONTINUOUS_LIVE_OCR_JSONL',
                'full_app_compilation':'REQUIRES_LATER_XCODEBUILD_STEP',
                'device_certified_fields':0}
        (out/'R725_SOURCE_EXPORT_RECEIPT.json').write_text(json.dumps(report,indent=2))
        print('R725_FULL_EDITABLE_RECOVERY_CRC_PASS',len(names),archive.stat().st_size)
