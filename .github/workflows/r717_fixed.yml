# R717 source-bound timeline evidence build; R716 is unchanged.
# A push changing this YAML starts this workflow; no Drive or external API billing.
name: R717 Battle Timeline Source-Bound Evidence (Expression Fixed)
'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/r717_fixed.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r717fixed-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
