    - name: Verify frozen R717 source and unpack
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os,base64,lzma,json,hashlib,pathlib
        packed=(pathlib.Path(os.environ['RUNNER_TEMP'])/'r717-payload.b85').read_bytes()
        packed=packed.replace(b'TP717',bytes((36,123,123)))
        raw=lzma.decompress(base64.b85decode(b''.join(packed.split())))
        assert len(raw)==2081645
        assert hashlib.sha256(raw).hexdigest()=='4d22e4328e031c0ee3d98d4c6de7c967397601044dfeba9f40f78ec0efe76e96'
        out=pathlib.Path('.r717-build');out.mkdir(exist_ok=True)
        for name,source in json.loads(raw).items():
            item=pathlib.PurePosixPath(name)
            assert not item.is_absolute() and '..' not in item.parts
            path=out/name;path.parent.mkdir(parents=True,exist_ok=True)
            path.write_bytes(source.encode('utf8'))
        print('R717_FROZEN_SOURCE_RESTORE_SHA_PASS')
        PY
    - name: R717 regressions and Apple iPhoneOS compile
      shell: bash
      run: |
        set -euo pipefail
        python3 .r717-build/tools/build_r717.py
    - name: Bound artifact storage within existing free scope
      id: budget
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 - <<'PY'
        import pathlib,os,json,urllib.request
        root=pathlib.Path('.r717-build/dist')
        size=sum(p.stat().st_size for p in root.rglob('*') if p.is_file()) if root.exists() else 0
        assert 0<size<16000000,('ARTIFACT_LOCAL_SIZE_HOLD',size)
        active=0
        for page in range(1,11):
            url=('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+
                 '/actions/artifacts?per_page=100&page='+str(page))
            req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                 'Accept':'application/vnd.github+json','User-Agent':'TruePlan-R717-Free-Guard'})
            with urllib.request.urlopen(req,timeout=30) as response: data=json.load(response)
            rows=data.get('artifacts',[])
            active+=sum(x['size_in_bytes'] for x in rows if not x.get('expired'))
            if len(rows)<100: break
        else: raise RuntimeError('ARTIFACT_INVENTORY_INCOMPLETE_HOLD')
        assert active+size<400000000,('FREE_SCOPE_STORAGE_HOLD',active,size)
        with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('allowed=true\n')
        print('R717_REPOSITORY_ARTIFACT_STORAGE_BOUND',active,size)
        PY
    - uses: actions/upload-artifact@v4
      if: always() && steps.budget.outputs.allowed == 'true'
      with:
        name: R717-audit-build
        path: .r717-build/dist/*
        if-no-files-found: error
        retention-days: 1
