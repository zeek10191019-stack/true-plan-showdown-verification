name: R547 Mega Form Manual Evidence IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
      && github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - name: Pinned R545 and R547 manual Mega UI source validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY547'
          import urllib.request,re,textwrap,hashlib,ast
          url='https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/859d055ce11173ee288e318797277a4091a9086d/.github/workflows/a545.yml'
          with urllib.request.urlopen(url,timeout=60) as f: raw=f.read(10000)
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='120c5c9a731ad290eb3de007480b6e223b5e30b0','R545_PIN_CHANGED'
          m=re.search(rb"          python3 - <<'PY545'\n([\s\S]*?)\n          PY545",raw)
          assert m,'R545_SOURCE_NOT_FOUND'
          source=textwrap.dedent(m.group(1).decode())
          assert hashlib.sha256(source.encode()).hexdigest()=='11c80886d8473374e51602aa4ce2574a29aca3b3ef2059826d0d046e4c4c298c'
          endpoint="exec(compile(builder,'R545_PINNED_BUILD','exec'))"
          assert source.count(endpoint)==1
          source=source.replace(endpoint,'__capture(builder)',1)
          cap=[]
          exec(compile(source,'R547_CAPTURER','exec'),{'__capture':cap.append})
          assert len(cap)==1
          builder=cap[0]
          assert hashlib.sha256(builder.encode()).hexdigest()=='11873c72bf427061cb76a9807f1685875b59e0c1f25ba142c7234435aa940292'
