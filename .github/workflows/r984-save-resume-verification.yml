name: R984 verified save resume
'on':
  push:
    branches: [r975-device-regression]
    paths: [.github/workflows/r984-save-resume-verification.yml]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: r984-unsigned-device-test
  cancel-in-progress: true
jobs:
  verify:
    name: Swift, browser, PC and iPhoneOS regression
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && !github.event.repository.private && github.ref == 'refs/heads/r975-device-regression'
    runs-on: xcode-27
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RELEASE_TAG: r984-unsigned-device-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: .github/workflows/r984-save-resume-verification.yml
      - name: Restore verified R983 and apply the R984 corrections
        shell: bash
        run: &restore |
          set -euo pipefail
          git show 3cb00d42b7a020d65aa6552ecbbc7c224ca9b1dd:.github/workflows/r983-archive-identity-verification.yml > "$RUNNER_TEMP/r983-baseline.yml"
          echo '33b4bef6d746f6f78a5862dbc8c55dc0db67a38b802a32f8ca46f7432a082a70  r983-baseline.yml' | (cd "$RUNNER_TEMP" && shasum -a 256 -c -)
          ruby -ryaml -e '
            steps = YAML.load_file(ARGV.fetch(0), aliases: true).fetch("jobs").fetch("verify").fetch("steps")
            puts steps.find { |step| step["name"] == "Restore verified R982 and apply the R983 corrections" }.fetch("run")
          ' "$RUNNER_TEMP/r983-baseline.yml" > "$RUNNER_TEMP/r983-restore.sh"
          bash "$RUNNER_TEMP/r983-restore.sh"
          cp pinned-r793/source/app/ios/ChampionsOnDevice/CaptureCoordinator.swift "$RUNNER_TEMP/r983-CaptureCoordinator.swift"
          python3 - "$RUNNER_TEMP/r984.patch" <<'PAYLOAD'
