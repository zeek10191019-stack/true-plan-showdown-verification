          data = (json.dumps(files, sort_keys=True, indent=2) + '\n').encode()
          assert hashlib.sha256(data).hexdigest() == '7d46587bd7ba408e0b28fff18956eebcd380a8ed20a9ab1e00a8f4413f87f20d'
