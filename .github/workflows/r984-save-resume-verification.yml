name: R984 verified save resume
'on':
  push:
    branches: [r975-device-regression]
    paths: [.github/workflows/r984-save-resume-verification.yml]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: r984-unsigned-device-test
  cancel-in-progress: true
jobs:
  verify:
    name: Swift, browser, PC and iPhoneOS regression
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && !github.event.repository.private && github.ref == 'refs/heads/r975-device-regression'
    runs-on: xcode-27
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RELEASE_TAG: r984-unsigned-device-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: .github/workflows/r984-save-resume-verification.yml
      - name: Restore verified R983 and apply the R984 corrections
        shell: bash
        run: &restore |
          set -euo pipefail
          git show 3cb00d42b7a020d65aa6552ecbbc7c224ca9b1dd:.github/workflows/r983-archive-identity-verification.yml > "$RUNNER_TEMP/r983-baseline.yml"
