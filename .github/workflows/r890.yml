      - name: Audit and publish unsigned device test IPA
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p R890Delivery
          R890_APP="$RUNNER_TEMP/r890_device/Build/Products/Debug-iphoneos/ChampionsOnDeviceResearch.app"
          export R890_APP
          lipo -archs "$R890_APP/ChampionsOnDeviceResearch" > R890Delivery/architectures.txt
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,plistlib,os
          s=Path('pinned-r793/source');m=json.loads((s/'source_manifest.json').read_text());sha=lambda b:hashlib.sha256(b).hexdigest()
          # The project file is derived by the exact verified generator. All other verified
          # source inputs must remain byte-identical through the native build.
          derived='app/ios/ChampionsOnDeviceResearch.xcodeproj/project.pbxproj'
          assert all(sha((s/n).read_bytes())==h for n,h in m.items() if n!=derived)
          app=Path(os.environ['R890_APP']);d=plistlib.loads((app/'Info.plist').read_bytes())
          assert d['CFBundleVersion']=='890' and d['CFBundleShortVersionString']=='0.8.90'
          assert d['CFBundleIdentifier']=='com.zeek10191019.championsresearch' and d['MinimumOSVersion']=='27.0'
          assert Path('R890Delivery/architectures.txt').read_text().strip()=='arm64'
          # Debug builds may use a small launcher plus NAME.debug.dylib; inspect both
          # native images and every packaged app member, never infer code from file size.
          import struct,subprocess
          exe=app/'ChampionsOnDeviceResearch';images=[exe]+sorted(app.glob('*.dylib'))
          for image in images:
           b=image.read_bytes();assert len(b)>=32 and image.stat().st_mode & 0o111
           magic,cpu,subtype,kind,ncmds,cmdbytes,flags,reserved=struct.unpack('<8I',b[:32])
           assert magic==0xfeedfacf and cpu==0x0100000c
           assert kind==(2 if image==exe else 6)
           pos=32;platforms=[]
           for _ in range(ncmds):
            cmd,size=struct.unpack_from('<2I',b,pos);assert size>=8 and pos+size<=len(b)
            if cmd==0x32:platforms.append(struct.unpack_from('<I',b,pos+8)[0])
            pos+=size
           assert pos==32+cmdbytes and platforms==[2]
           assert subprocess.check_output(['lipo','-archs',str(image)],text=True).strip()=='arm64'
           print('R890_NATIVE_IMAGE_VERIFIED',image.name,len(b),kind,platforms)
          if exe.stat().st_size<100000:
           debug=app/'ChampionsOnDeviceResearch.debug.dylib'
           assert debug in images and debug.stat().st_size>100000
           assert debug.name in subprocess.check_output(['otool','-L',str(exe)],text=True)
          assert d['DTPlatformName']=='iphoneos'
          members={str(p.relative_to(app)):{'bytes':p.stat().st_size,'sha256':sha(p.read_bytes())} for p in sorted(app.rglob('*')) if p.is_file()}
          Path('R890Delivery/app_members.json').write_text(json.dumps(members,sort_keys=True,indent=2)+'\n')
          assert list(app.glob('*.xcprivacy'))
          Path('R890Delivery/generated_project_sha256.txt').write_text(sha((s/derived).read_bytes())+'\n')
          print('R890_BUILT_APP_IDENTITY_INPUTS_ARM64_PRIVACY_VERIFIED',d['CFBundleVersion'],d['CFBundleIdentifier'])
          PY
          mkdir -p "$RUNNER_TEMP/r890_payload/Payload"
          ditto "$R890_APP" "$RUNNER_TEMP/r890_payload/Payload/ChampionsOnDeviceResearch.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/r890_payload/Payload" R890Delivery/R890_Unsigned_DeviceTest.ipa
          python3 - <<'PY'
          from pathlib import Path
          import json,zipfile,hashlib,plistlib,os,datetime,base64,lzma
          out=Path('R890Delivery');ipa=out/'R890_Unsigned_DeviceTest.ipa';sha=lambda b:hashlib.sha256(b).hexdigest();app=Path(os.environ['R890_APP'])
          assert 100000<ipa.stat().st_size<300000000
          with zipfile.ZipFile(ipa) as z:
           assert z.testzip() is None
           prefix='Payload/ChampionsOnDeviceResearch.app/'
           assert all(not n.startswith('/') and '..' not in Path(n).parts for n in z.namelist())
           info=plistlib.loads(z.read(prefix+'Info.plist'));assert info['CFBundleVersion']=='890'
          members=json.loads((out/'app_members.json').read_text())
          with zipfile.ZipFile(ipa) as z:
           for name,meta in members.items():
            data=z.read(prefix+name);assert len(data)==meta['bytes'] and sha(data)==meta['sha256']
          receipt={
              'schema':'trueplan.device-test-ipa.v1',
              'created_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'version':'0.8.90','build':890,'revision':'R890','diagnostic':'D150',
              'source_commit':os.environ['GITHUB_SHA'],'source_files':675,
              'source_tree_sha256':Path('R834Proof/SOURCE_TREE_SHA256.txt').read_text().strip(),
              'ci':os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],
              'architecture':'arm64','sdk_platform':'iphoneos','signed_for_installation':False,
              'ipa_filename':ipa.name,'ipa_bytes':ipa.stat().st_size,'ipa_sha256':sha(ipa.read_bytes()),
              'packaged_app_members':len(members),'zip_crc_passed':True,
              'device_accuracy_certified':False,'device_verified_fields':0,
          }
          (out/'VERIFICATION_R890.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          (out/'SHA256SUMS.txt').write_text(receipt['ipa_sha256']+'  '+ipa.name+'\n')
          print('R890_IPA_ARCHIVE_VERIFIED',json.dumps(receipt,sort_keys=True))
          PY
          cat > R890Delivery/DEVICE_TEST_R890.md <<'EOF'
          # R890 iPhone 16 Plus 実機試験
          
          1. PCのiLoaderで未署名IPAを更新導入し、0.8.90／build890を確認します。既存アプリは削除しません。
          2. アプリで「画面共有の収集を開始」を押し、選出画面から対戦を収集します。48.4秒以降も取得が続くか確認します。
          3. 可能な範囲で、交代、自分と相手のメガ、様子を見る、能力ランクと場の詳細、明示ターン、画面の回転、バックグラウンドから復帰直後を収集します。
          4. 「収集終了・全情報を保存」。遅着分の反映を待ち、「保存済みの証拠を共有」。分割時は索引と全パートを使用します。
          
          この公開は実機試験の開始判定です。iPhone上の連続取得、実表示1秒未満、79項目の実機精度は実機証拠から判定します。映っていない情報は不明、推定と矛盾は別々に保持します。
          EOF
          tag=r890-device-test
          readback="$RUNNER_TEMP/r890_release_readback"
          mkdir -p "$readback"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish > R890Delivery/existing.json 2>/dev/null; then
            gh release create "$tag" R890Delivery/R890_Unsigned_DeviceTest.ipa R890Delivery/VERIFICATION_R890.json R890Delivery/SHA256SUMS.txt R890Delivery/DEVICE_TEST_R890.md --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'R890 iPhone 16 Plus device test 0.8.90' --draft --prerelease --notes-file R890Delivery/DEVICE_TEST_R890.md
          else
            jq -e --arg sha "$GITHUB_SHA" '.isDraft and .targetCommitish == $sha' R890Delivery/existing.json > /dev/null
            gh release upload "$tag" R890Delivery/R890_Unsigned_DeviceTest.ipa R890Delivery/VERIFICATION_R890.json R890Delivery/SHA256SUMS.txt R890Delivery/DEVICE_TEST_R890.md --repo "$GITHUB_REPOSITORY" --clobber
          fi
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'R890_Unsigned_DeviceTest.ipa' --dir "$readback"
          export R890_READBACK="$readback/R890_Unsigned_DeviceTest.ipa"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,zipfile
          receipt=json.loads(Path('R890Delivery/VERIFICATION_R890.json').read_text())
          ipa=Path(os.environ['R890_READBACK'])
          assert ipa.stat().st_size==receipt['ipa_bytes']
          assert hashlib.sha256(ipa.read_bytes()).hexdigest()==receipt['ipa_sha256']
          with zipfile.ZipFile(ipa) as archive: assert archive.testzip() is None
          print('R890_RELEASE_IPA_FRESH_DOWNLOAD_SHA_CRC_PASS',ipa.stat().st_size,receipt['ipa_sha256'])
          PY
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > R890Delivery/published_release.json
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          out=Path('R890Delivery')
          release=json.loads((out/'published_release.json').read_text())
          receipt=json.loads((out/'VERIFICATION_R890.json').read_text())
          assert release['draft'] is False and release['prerelease'] is True
          assert release['target_commitish']==os.environ['GITHUB_SHA']
          assets={item['name']:item for item in release['assets']}
          assert set(assets)=={'R890_Unsigned_DeviceTest.ipa','VERIFICATION_R890.json','SHA256SUMS.txt','DEVICE_TEST_R890.md'}
          ipa=assets['R890_Unsigned_DeviceTest.ipa']
          assert ipa['state']=='uploaded' and ipa['size']==receipt['ipa_bytes']
          if ipa.get('digest'): assert ipa['digest']=='sha256:'+receipt['ipa_sha256']
          print('R890_PUBLISHED_RELEASE_VERIFIED',release['html_url'])
          print('R890_IPA_DOWNLOAD',ipa['browser_download_url'])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              print('### R890 iPhone 16 Plus unsigned device test',file=summary)
              print(ipa['browser_download_url'],file=summary)
              print(receipt['ipa_sha256'],file=summary)
          PY
