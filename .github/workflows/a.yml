jobs:
  verify:
    if: >-
      github.repository ==
      'zeek10191019-stack/true-plan-showdown-verification'
      && github.ref == 'refs/heads/main'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 27e58008ecc61a0478a376746357df7ced416efd
        persist-credentials: true
    - name: R661 tests and retained code
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os,base64,lzma,hashlib
        from pathlib import Path
        s=''.join(os.environ['PACK'].split())
        raw=lzma.decompress(base64.b85decode(s))
        assert len(raw)==18441
        assert hashlib.sha256(raw).hexdigest()==(
          '51b2b68a43f3e6acbd8776d9b19bc13e'+
          'cb12699b9a430b2018c6f5928dc47497')
        root='app/ios/ChampionsOnDevice/'
        names=[root+'R661CrossModalEvidenceGate.swift',
          'tests/R661CrossModalEvidenceHarness.swift',
          'tools/r661_patch.py',
          'research/R661_README.md',
          '__TEMP__/r661-run.sh']
        sizes=[8343,5843,1535,1608,1112]
        offset=0
        for name,size in zip(names,sizes):
          b=raw[offset:offset+size]
          offset+=size
          assert len(b)==size
          p=(Path(os.environ['RUNNER_TEMP'])/
            name.split('/')[-1]) if name.startswith(
            '__TEMP__/') else Path(name)
          assert not p.exists()
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_bytes(b)
        assert offset==len(raw)
        PY
        bash "$RUNNER_TEMP/r661-run.sh"
