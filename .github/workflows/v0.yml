jobs:
  build:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            1e63efa4db514cc122f2940a39623d9bc65c554c
      - name: Verify R696 and build IPA
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os,re,base64,lzma,hashlib
          import pathlib,urllib.request,ast
          url=('https://raw.githubusercontent.com/'
            'zeek10191019-stack/'
            'true-plan-showdown-verification/'
            'main/.github/workflows/w2.yml')
          req=urllib.request.Request(url,headers={
            'User-Agent':'R696-Pinned-Builder'})
          with urllib.request.urlopen(
            req,timeout=40) as res:
            old=res.read(25000)
          assert len(old)==10385
          assert hashlib.sha256(old).hexdigest()==(
            'b350dc79a46916b98c22077a1ac033b0'
            '9b5e72274060f6e74b1ad862d5e0f5c9')
          m=re.search(rb'(?m)^  R695_PKG: >-\n'
            rb'((?:    [^\n]*\n)+)',old)
          assert m,'R695_PINNED_PACKAGE_MISSING'
          os.environ['R695_PKG']=b''.join(
            m[1].split()).decode('ascii')
          raw=lzma.decompress(base64.b64decode(
            os.environ['R696_PKG']),
            format=lzma.FORMAT_ALONE)
          assert hashlib.sha256(raw).hexdigest()==(
            '311113447bf1bbc079e4f49b4a387370'
            '52a6d94823b37c2368bea7838594fe46')
          names=['R696PreviewSequenceEvidence.swift',
            'R696Patch.py','R696MakeBuild.py',
            'R696Smoke.swift']
          sizes=[7271, 1668, 2751, 5837]
          assert sum(sizes)==len(raw)
          pos=0
          for name,size in zip(names,sizes):
            folder='tests' if name.endswith(
              'Smoke.swift') else 'tools'
            p=pathlib.Path(folder)/name
            p.parent.mkdir(parents=True,
              exist_ok=True)
            p.write_bytes(raw[pos:pos+size])
            pos+=size
          print('R696_SOURCE_SHA_PASS',flush=True)
          text=old.decode('utf-8')
          marker="          python3 - <<'PYCODE'\n"
          start=text.index(marker)+len(marker)
          end=text.index('\n          PYCODE',start)
          block=text[start:end]
          body='\n'.join(line[10:] for line in
            block.splitlines())
          needle=("['python3','tools/"+
            "R695MakeBuild.py']")
          assert body.count(needle)==1
          body=body.replace(needle,
            "['python3','tools/R696MakeBuild.py']")
          ast.parse(body)
          exec(compile(body,'r695','exec'),{})
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: R696-unsigned-iLoader-IPA
          path: dist/R696*
          if-no-files-found: error
          retention-days: 7
