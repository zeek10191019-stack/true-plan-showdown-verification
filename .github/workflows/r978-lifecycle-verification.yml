name: R978 capture lifecycle and retained selection
'on':
  push:
    branches: [r975-device-regression]
    paths: [.github/workflows/r978-lifecycle-verification.yml]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: r978-unsigned-device-test
  cancel-in-progress: false
jobs:
  verify:
    name: Swift, browser, PC and iPhoneOS regression
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && !github.event.repository.private && github.ref == 'refs/heads/r975-device-regression'
    runs-on: xcode-27
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RELEASE_TAG: r978-unsigned-device-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: .github/workflows/r978-lifecycle-verification.yml
      - name: Restore verified R977 and apply the R978 corrections
        shell: bash
        run: &restore |
          set -euo pipefail
          git show 31d4c9b492ef2e1c43b3d33fcfbd6443fc5a6e6c:.github/workflows/r977-retained-verification.yml > "$RUNNER_TEMP/r977-baseline.yml"
          echo 'dbabf6aa3543cea2d98f749ccc0841b75ddbe98538777d657ef8ad34e1731710  r977-baseline.yml' | (cd "$RUNNER_TEMP" && shasum -a 256 -c -)
          ruby -ryaml -e '
            steps = YAML.load_file(ARGV.fetch(0), aliases: true).fetch("jobs").fetch("verify").fetch("steps")
            puts steps.find { |step| step["name"] == "Restore verified R976 and apply the R977 corrections" }.fetch("run")
          ' "$RUNNER_TEMP/r977-baseline.yml" > "$RUNNER_TEMP/r977-restore.sh"
