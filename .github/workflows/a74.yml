name: R734 Exact OCR Stop Safety CI (Not Device Certified)
'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/a74.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r734-source-pinned-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
    - name: Recover exact R733 full-source archive from SHA-pinned CI artifact
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
       set -euo pipefail
       mkdir -p R734Artifacts R727Source
       curl --fail --silent --show-error --location --retry 3 \
        --header "Authorization: Bearer $GH_TOKEN" \
        --header 'Accept: application/vnd.github+json' \
        --header 'X-GitHub-Api-Version: 2022-11-28' \
        'https://api.github.com/repos/zeek10191019-stack/'\
        'true-plan-showdown-verification/actions/artifacts/'\
        '13691475761/zip' \
        -o R734Artifacts/R733_ARTIFACT_PINNED.zip
       python3 - <<'PY'
       import hashlib,io,zipfile,pathlib
       p=pathlib.Path('R734Artifacts/R733_ARTIFACT_PINNED.zip')
       with zipfile.ZipFile(p) as outer:
        assert outer.testzip() is None
        data=outer.read('R733_ALL_EDITABLE_SOURCE_RECOVERY.zip')
       expected=(
        '74eee33722aba475f2a84c2329461b9d77af34e136d588aafd45ca167c0541b4'
       )
       assert hashlib.sha256(data).hexdigest()==expected,(
        'R733_BASE_SOURCE_HASH_MISMATCH'
       )
       root=pathlib.Path('R727Source')
       with zipfile.ZipFile(io.BytesIO(data)) as archive:
        assert archive.testzip() is None
        names=archive.namelist()
        assert len(names)==312 and len(set(names))==312
        for name in names:
         rel=pathlib.PurePosixPath(name)
         assert not rel.is_absolute() and '..' not in rel.parts
         target=root.joinpath(*rel.parts)
         target.parent.mkdir(parents=True,exist_ok=True)
         target.write_bytes(archive.read(name))
       print('R734_R733_PINNED_SOURCE_312_RESTORED')
       PY
