        p=root/name
        old=p.read_bytes() if name in prior else b''
        if row['a']:
         assert hashlib.sha256(old).hexdigest()==row['a']
        lines=old.decode('utf-8').splitlines(keepends=True)
        for start,stop,change in reversed(row['d']):
         assert 0<=start<=stop<=len(lines)
         lines[start:stop]=[change]
        new=''.join(lines).encode('utf-8')
        assert hashlib.sha256(new).hexdigest()==row['b'],name
        p.parent.mkdir(parents=True,exist_ok=True)
        p.write_bytes(new)
       now={p.relative_to(root).as_posix()
            for p in root.rglob('*') if p.is_file()}
       assert prior.issubset(now) and len(now)==316
       print('R734_ALL_316_SOURCE_SHA_PASS')
       PY
    - name: Run all Swift tests and app Swift syntax checks
      shell: bash
      run: |
       set -euo pipefail
       (cd R727Source/R720_PORTABLE_TESTS && \
        swift test -j 2) > R734Artifacts/R734_SWIFT_TESTS.log 2>&1 || {
        tail -n 120 R734Artifacts/R734_SWIFT_TESTS.log; exit 1;
       }
       msg='Executed 147 tests, with 0 failures'
       grep -Fq "$msg" R734Artifacts/R734_SWIFT_TESTS.log
       swiftc -frontend -parse R727Source/app/ios/ChampionsOnDevice/*.swift \
         > R734Artifacts/R734_SWIFT_PARSE.log 2>&1
       echo R734_147_SWIFT_TESTS_AND_238_SYNTAX_PASS
    - name: Build unsigned full iPhoneOS app with R734 source
      shell: bash
      run: |
       set -euo pipefail
       python3 R727Source/tools/generate_xcode_project.py
       project=R727Source/app/ios/ChampionsOnDeviceResearch.xcodeproj
       xcodebuild -project "$project" \
        -scheme ChampionsOnDeviceResearch -configuration Debug \
        -sdk iphoneos -destination 'generic/platform=iOS' \
        -derivedDataPath "$RUNNER_TEMP/r734-derived" \
        ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build \
        > R734Artifacts/R734_IPHONEOS_XCODEBUILD.log 2>&1 || {
         grep -E 'error:|BUILD FAILED' \
          R734Artifacts/R734_IPHONEOS_XCODEBUILD.log | tail -n 100 || true
         exit 1;
        }
       grep -Fq 'BUILD SUCCEEDED' R734Artifacts/R734_IPHONEOS_XCODEBUILD.log
       python3 - <<'PY'
       import os,pathlib,zipfile,json,plistlib
       base=(pathlib.Path(os.environ['RUNNER_TEMP']) /
             'r734-derived/Build/Products/Debug-iphoneos')
       app=base/'ChampionsOnDeviceResearch.app'
       assert app.is_dir() and (app/'ChampionsOnDeviceResearch').is_file()
       info=plistlib.loads((app/'Info.plist').read_bytes())
       assert info['CFBundleVersion']=='734'
       assert info['CFBundleShortVersionString']=='0.7.34'
       log=(pathlib.Path('R734Artifacts/R734_IPHONEOS_XCODEBUILD.log')
            .read_text(errors='replace'))
       for name in (
        'R734RecordingFinishPolicy.swift','R733QuickTextSampler.swift',
        'CaptureCoordinator.swift','R710ContinuousRecorder.swift'
       ):
        assert name in log,('R734_CHANGED_SOURCE_NOT_COMPILED',name)
       ipa=pathlib.Path('R734Artifacts/R734_Unsigned_Research.ipa')
       with zipfile.ZipFile(
        ipa,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6
       ) as z:
        for p in sorted(app.rglob('*')):
         if p.is_file():z.write(p,arcname='Payload/'+str(p.relative_to(base)))
       with zipfile.ZipFile(ipa) as z:assert z.testzip() is None
       assert ipa.stat().st_size<12_000_000
       receipt=pathlib.Path('R734Artifacts/R734_COMPILE_RECEIPT.json')
       receipt.write_text(json.dumps({
        'full_unsigned_iphoneos_compile':'PASS', 'build':'734',
        'swift_tests':'147/147 PASS', 'source_files':316,
        'device_certified_79_fields':0,
        'under_one_second_on_device':'NOT_MEASURED',
        'manual_stop_on_device':'NOT_TESTED',
        'no_regression_on_device':'NOT_CERTIFIED'},indent=2))
       print('R734_FULL_IPHONEOS_BUILD_PASS_NOT_DEVICE_CERTIFIED')
       PY
    - name: Export byte-perfect 316-file full source recovery ZIP
      shell: bash
      run: |
       set -euo pipefail
       python3 - <<'PY'
       import hashlib,json,pathlib,zipfile
       src=pathlib.Path('R727Source');out=pathlib.Path('R734Artifacts')
       files=sorted(p for p in src.rglob('*')
                    if p.is_file() and '.build' not in p.parts)
       assert len(files)==316
       archive=out/'R734_ALL_EDITABLE_SOURCE_RECOVERY.zip'
       with zipfile.ZipFile(
        archive,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9
       ) as z:
        for p in files:z.write(p,str(p.relative_to(src)))
       with zipfile.ZipFile(archive) as z:
        assert z.testzip() is None and len(z.namelist())==316
        for p in files:
         rel=p.relative_to(src).as_posix()
         assert hashlib.sha256(z.read(rel)).digest()==(
          hashlib.sha256(p.read_bytes()).digest())
       print('R734_RECOVERY_ZIP_CRC_AND_SHA_PASS',archive.stat().st_size)
       PY
    - name: Public-only artifact and billing guard
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
       set -euo pipefail
       python3 - <<'PY'
       import pathlib
       size=sum(p.stat().st_size
                for p in pathlib.Path('R734Artifacts').rglob('*')
                if p.is_file())
       assert size<16_000_000,('R734_ARTIFACT_TOO_LARGE',size)
