jobs:
  build:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            1e63efa4db514cc122f2940a39623d9bc65c554c
      - name: Verify R706 and build IPA
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import pathlib,os,re,hashlib,base64,lzma,ast
          import urllib.request
          root=('https://raw.githubusercontent.com/'
            'zeek10191019-stack/'
            'true-plan-showdown-verification/'
            'main/.github/workflows/')
          def pinned(name,size,expected):
            req=urllib.request.Request(root+name,
              headers={'User-Agent':'R706-Pinned'})
            with urllib.request.urlopen(
              req,timeout=40) as r:
              data=r.read(30000)
            assert len(data)==size,(name,'SIZE_DRIFT')
            assert hashlib.sha256(data).hexdigest()==(
              expected), (name,'SHA_DRIFT')
            return data
          y1=pinned('y1.yml',9945,
            '6983307d31a1f6247915e5a7723b4621'
            '23ac562f17237bc5faa50f6fd425038d')
          z9=pinned('z9.yml',20253,
            '2439737fbfc4a6960898453e0d92b4c9'
            'e922749f26c59c5e76f4204425b8ac3e')
          for key,data in (
            ('R705_PKG',y1),('R705_RUNNER_PKG',y1),
            ('R703_PKG',z9),('R704_PKG',z9)):
            pat=(rb'(?m)^  '+key.encode()+
              rb': >-\n((?:    [^\n]*\n)+)')
            match=re.search(pat,data)
            assert match,key+'_MISSING'
            os.environ[key]=b''.join(
              match[1].split()).decode('ascii')
          binary=lzma.decompress(base64.b64decode(
            os.environ['R706_PKG']),
            format=lzma.FORMAT_ALONE)
          assert hashlib.sha256(binary).hexdigest()==(
            '9bc2b1e1168e7fd801165f21e22f060e'
            'fa492a8602accc782563ae9564a70614')
          names=['R706Patch.py',
            'R706BuildModify.py','R706Smoke.swift']
          sizes=[6491, 1129, 4121]
          assert sum(sizes)==len(binary)
          off=0
          for name,size in zip(names,sizes):
            d=('tests' if name.endswith('.swift')
              else 'tools')
            p=pathlib.Path(d)/name
            p.parent.mkdir(parents=True,exist_ok=True)
            p.write_bytes(binary[off:off+size])
            off+=size
          ast.parse(pathlib.Path(
            'tools/R706Patch.py').read_text())
          ast.parse(pathlib.Path(
            'tools/R706BuildModify.py').read_text())
          old=lzma.decompress(base64.b64decode(
            os.environ['R705_RUNNER_PKG']),
            format=lzma.FORMAT_ALONE)
          assert hashlib.sha256(old).hexdigest()==(
            '02e5b6c6a5262be5ff2c6e8975762e22'
            '722ecf139e424b3bc5c822fe1ed8aeb9')
          s=old.decode('utf-8')
          needle='path.write_text(fixed)'
          assert s.count(needle)==1
          update=(
            "exec(compile(pathlib.Path("+
            "'tools/R706BuildModify.py').read_text(),"+
            "'R706BuildModify','exec'),globals())\n"+
            "fixed=upgrade_r705_builder(fixed)\n"+
            "path.write_text(fixed)")
          s=s.replace(needle,update,1)
          ast.parse(s)
          print('R706_PINNED_PACKAGE_PASS',flush=True)
          exec(compile(s,'R706Rebuild','exec'),{})
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: R706-unsigned-iLoader-IPA
          path: dist/R706*
          if-no-files-found: error
          retention-days: 7
