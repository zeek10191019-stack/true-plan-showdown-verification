        with urllib.request.urlopen(url,timeout=60) as response: raw=response.read(200000)
        assert len(raw)==169037 and sha(raw)=='875f6a669c27803722b869a423fdd4c959091164f9788c76731a7345fdd23987', 'C46_PIN_MISMATCH'
