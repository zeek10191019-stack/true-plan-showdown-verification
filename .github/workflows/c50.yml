        run('r1048_launcher',True);run('r1049_launcher')
        print('C49_WINDOWS_TK_GUI_24_PASS_OLD_VERSION_NEGATIVE_NOT_LENOVO_PHYSICAL',flush=True)
        C49_PY
    - name: C49 pinned existing portable Swift full test suite; evidence not physical
      if: matrix.job == 'macos-source'
      shell: bash
      run: |
        set -Eeuo pipefail
        product="$RUNNER_TEMP/c6-objects/pinned-r793/source"
        package="$product/R720_PORTABLE_TESTS"
        test -f "$package/Package.swift"
        log="$RUNNER_TEMP/c49-portable-swift-test.log"
        swift test --package-path "$package" --scratch-path "$RUNNER_TEMP/c49-portable-build" 2>&1 | tee "$log"
        python3 - "$log" <<'C49_TEST_PY'
        import pathlib,re,sys
        s=pathlib.Path(sys.argv[1]).read_text(errors='replace')
        # XCTest final summary. Require actual positive executed count, no failing tests.
        # Skips are retained in the log and do not certify any real-image field.
        rows=re.findall(r'Executed (\d+) tests?, with (?:(\d+) tests? skipped(?: and |, with |, ))?(\d+) failures? \(\d+ unexpected\)',s)
        assert rows,'C49_NO_XCTEST_EXECUTION_SUMMARY'
        assert all(int(f)==0 for n,k,f in rows),rows
        n,k,f=max(rows,key=lambda row:int(row[0]));assert int(n)>int(k or 0)
        print('C49_EXISTING_PORTABLE_SWIFT_SUITE_EXECUTED',n,'skipped',k or '0','failures',f,'NOT_PHYSICAL_OR_79_FIELD_CERTIFICATION')
        C49_TEST_PY
