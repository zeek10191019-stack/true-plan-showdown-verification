    - name: Mac XCTest and actual real PNG Apple Vision
      id: swift
      if: always() && steps.patch780.outcome == 'success' && matrix.lane == 'real-apple-vision'
      shell: bash
      run: |
        set -euo pipefail
        test "$(uname -s)" = Darwin
        export R761_FIELD_AUDIT_OUTPUT="$GITHUB_WORKSPACE/"
        R761_FIELD_AUDIT_OUTPUT+="R780Proof/FieldSafety.json"
        export R761_APPLE_VISION_OUTPUT="$GITHUB_WORKSPACE/"
        R761_APPLE_VISION_OUTPUT+="R780Proof/RealAppleVision.json"
        export R779_RETAINED_VISION_REPLAY_OUTPUT="$GITHUB_WORKSPACE/"
        R779_RETAINED_VISION_REPLAY_OUTPUT+="R780Proof/RetainedRealVisionReplay.json"
        swift test --package-path source/R720_PORTABLE_TESTS \
          --jobs 4 --scratch-path "$RUNNER_TEMP/r761-tests" \
          > R780Proof/Swift.log 2>&1 || {
            tail -n 90 R780Proof/Swift.log; exit 1;
          }
        python3 - <<'PYTHON'
