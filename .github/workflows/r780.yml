    - name: Source preservation and static capture gates
      id: checks
      if: always() && steps.patch780.outcome == 'success' && matrix.lane == 'iphoneos-compile'
      shell: bash
      run: "set -euo pipefail\nfor script in r761_preflight r742_live_path_audit \\\n  r743_macos_compat_audit\
        \ r745_read_path_gate \\\n  r748_capture_path_gate r780_project_source_parity; do\n\
        \  python3 \"source/tools/$script.py\" \\\n    > \"R780Proof/$script.log\" 2>&1 ||\
        \ {\n      cat \"R780Proof/$script.log\"; exit 1;\n    }\ndone\npython3 - <<'PYTIMER'\n\
        from pathlib import Path\np=Path('source/app/ios/ChampionsOnDevice/CaptureCoordinator.swift')\n\
        matches=[line.strip() for line in p.read_text().splitlines()\n         if 'timer.schedule(deadline:'\
        \ in line]\nassert len(matches)==1, matches\nprobe=('import Foundation\\nimport Dispatch\\\
        n'\n       'func check() {\\n'\n       'let timer = DispatchSource.makeTimerSource()\\\
        n'\n       +matches[0]+'\\n}\\n')\nPath('R780Proof/TimerTypecheck.swift').write_text(probe)\n\
        PYTIMER\nswiftc -typecheck R780Proof/TimerTypecheck.swift \\\n  > R780Proof/TimerTypecheck.log\
        \ 2>&1 || {\n    cat R780Proof/TimerTypecheck.log; exit 1;\n  }\npython3 - <<'PYGATE'\n\
        from pathlib import Path\napp=Path('source/app/ios/ChampionsOnDevice')\ncore=Path('source/R720_PORTABLE_TESTS/Sources/R719Core')\n\
        for stem in ('R767QuickEpochExecutionPool',\n             'R766OCRWorkerLivenessLedger',\n\
        \             'R765OCRSourceLaneScheduler',\n             'R764CaptureLivenessLedger',\n\
        \             'R763CaptureGapLedger',\n             'R762SingleFrameConflictFence'):\n\
        \ a=(app/(stem+'.swift')).read_bytes()\n b=(core/(stem+'.swift')).read_bytes()\n assert\
        \ a==b,stem\ncapture=(app/'CaptureCoordinator.swift').read_text()\nmarkers=(\n 'r767QuickEpochPool.submit(epoch:quickEpoch',\n\
