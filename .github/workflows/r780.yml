    - name: iPhoneOS compile without IPA creation
      id: phone
      if: always() && steps.patch780.outcome == 'success' && matrix.lane == 'iphoneos-compile'
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYR780PROJECT'
        from pathlib import Path
        import json,hashlib,subprocess,sys
        root=Path('source')
        def verified_tree():
         manifest=json.loads((root/'source_manifest.json').read_text())
         names=set(manifest)|{'source_manifest.json'}
         actual={str(p.relative_to(root)) for p in root.rglob('*')
                 if p.is_file() and '__pycache__' not in p.parts}
         assert actual==names,'R780_EXTRA_OR_MISSING_SOURCE'
         sha=lambda b:hashlib.sha256(b).hexdigest()
         assert all(sha((root/n).read_bytes())==h for n,h in manifest.items())
         return sha(''.join(n+'\t'+sha((root/n).read_bytes())+'\n'
          for n in sorted(names)).encode())
        expected='4735ff539ce47bee3367e9a966d503940e59cbf035bfa0855452438c7f672907'
        assert verified_tree()==expected,'R780_PRE_BUILD_SOURCE_DRIFT'
        subprocess.run([sys.executable,'source/tools/generate_xcode_project.py'],check=True)
        assert verified_tree()==expected,'R780_GENERATOR_MUTATED_SOURCE'
        Path('R780Proof/PROJECT_SOURCE_STABLE.txt').write_text(expected+'\n')
        PYR780PROJECT
        project=source/app/ios/ChampionsOnDeviceResearch.xcodeproj
        xcodebuild -project "$project" \
          -scheme ChampionsOnDeviceResearch -configuration Debug \
          -sdk iphoneos -destination 'generic/platform=iOS' \
          ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
          -derivedDataPath "$RUNNER_TEMP/r761" build \
          > R780Proof/iPhoneOS.log 2>&1 || {
            grep -E 'error:|BUILD FAILED' R780Proof/iPhoneOS.log || true
            exit 1;
          }
        grep -F 'BUILD SUCCEEDED' R780Proof/iPhoneOS.log
    - name: Preserve delta-only evidence and honest gate status
      if: always() && steps.patch780.outcome == 'success'
      shell: bash
      env:
        MAC_RESULT: ${{ steps.swift.outcome }}
        LANE: ${{ matrix.lane }}
        RUNNER: ${{ matrix.runner }}
        IOS_RESULT: ${{ steps.phone.outcome }}
        SOURCE_RESULT: ${{ steps.checks.outcome }}
        ARCHIVE_RESULT: ${{ steps.archive.outcome }}
      run: |
        python3 - <<'PYTHON'
        import os,pathlib,json,hashlib
        root=pathlib.Path('source');out=pathlib.Path('R780Proof')
        manifest=json.loads((root/'source_manifest.json').read_text())
        names=sorted(list(manifest)+['source_manifest.json'])
        sha=lambda b:hashlib.sha256(b).hexdigest()
        tree=sha(''.join(n+'\t'+sha((root/n).read_bytes())+'\n'
                    for n in names).encode())
        (out/'SOURCE_INTEGRITY.json').write_text(json.dumps({
         'revision':'R780','source_file_count':len(names),
         'source_tree_sha256':tree,'base':'D30 + R773 through R780',
         'source_zip_generated':False,'ipa_generated':False
        },indent=2))
        status={
         'candidate':'R780-517-FILES',
         'lane':os.environ['LANE'],
         'runner':os.environ['RUNNER'],
         'source_checks':os.environ['SOURCE_RESULT'],
         'mac_xctest_and_real_vision':os.environ['MAC_RESULT'],
         'mac_accurate_vision':os.environ['MAC_RESULT'],
         'iphoneos_compile':os.environ['IOS_RESULT'],
         'production_archive_test':os.environ['ARCHIVE_RESULT'],
         'device_certified_fields':0,'ipa_created':False,
         'ipa_allowed':False,'duration_gate_required':True,
         'remaining':'79 fields, real iPhone 3-min capture, root cause, OCR'}
