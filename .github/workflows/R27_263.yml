# R27.263: Reuses R27.262 tests intact + adds a strict public protocol projection guard.
# Source-tagged public events are caller-supplied; internal logs/live Champions not certified.
name: R27.263 Policy Bridge Public-Protocol Source Guard
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  bridge-recovery:
    if: ${{ github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private
      == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Checkout immutable public Showdown
      uses: actions/checkout@v4
      with:
        repository: smogon/pokemon-showdown
        ref: aa17ca0fac8bc5605df673bd8774c2d0e91efa43
        fetch-depth: 1
        persist-credentials: false
        path: pokemon-showdown
    - name: Set Node.js pinned version
      uses: actions/setup-node@v4
      with:
        node-version: 22.18.0
    - name: Verify pinned commit and compile
      shell: bash
      working-directory: pokemon-showdown
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = ''aa17ca0fac8bc5605df673bd8774c2d0e91efa43''

        test "$(git rev-parse HEAD^{tree})" = ''98c9038b81fa5ed7f1e9818736b701918920501e''

        test "$(node -v)" = ''v22.18.0''

        npm ci --no-audit --no-fund

        npm run build

        echo ''R27_263_PINNED_BUILD PASS''

        '
    - name: Run portable unit and pinned simulator contract
      shell: bash
      working-directory: pokemon-showdown
      run: "set -euo pipefail\ncat > battle_api.cjs <<'R27_262_FILE_battle_api_cjs'\n'use strict';\n/**\n * R27.259\
        \ portable and deliberately conservative single-battle contract.\n * Not the original private Battle AI,\
