name: R985 PC evidence readback
'on':
  push:
    branches: [r975-device-regression]
    paths: [.github/workflows/r985-pc-readback-verification.yml]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: r985-pc-readback
  cancel-in-progress: true
jobs:
  readback_linux:
    name: Readback regression on Ubuntu
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && !github.event.repository.private && github.ref == 'refs/heads/r975-device-regression'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
