      - name: Reproduce six defects in R984 and run the full PC regression set
        shell: bash
        run: &pc_regression |
          set -euo pipefail
          python - <<'REPLAY'
          import hashlib, re, subprocess, sys
          from pathlib import Path
          from zipfile import ZipFile
          root = Path('r985-probe')
          package = root / 'R985_PC_Readback_Tools.zip'
          assert hashlib.sha256(package.read_bytes()).hexdigest() == '16dceef0a3d9b0febdc288a3961fdd810b5ece5a56c3c46c30b883e796354834'
          with ZipFile(package) as archive:
              assert archive.testzip() is None
              assert all(archive.read(name) == (root / 'candidate/tools' / name).read_bytes()
                         for name in archive.namelist())
          for name, expected in {'restore_capture.py': '43dfd8c1112ec95a12dc8ddb8f4e792c7de05e657cb4e1e6ce6d4dd9daae6752', 'verify_collection.py': 'f0b124aafca777733296740eb74586b0529ae461906b094a4b04998484eaf916', 'r810_evidence_export_audit.py': '190d7ef6c7bd55ace60f8ae5ec484bd25f9cfc302ac0d9bdae62d826cbe7d36d', 'r875_native_capture_audit.py': 'f8171fcce34d6fdc96ef2c3f7cbead2eca5aeb2db47581f90057be849da13966'}.items():
              assert hashlib.sha256((root / 'baseline/tools' / name).read_bytes()).hexdigest() == expected
          baseline = subprocess.run([
              sys.executable, 'r985-probe/baseline/tools/tests/test_r985_pc_readback.py', '-v',
          ], encoding='utf-8', capture_output=True)
          print(baseline.stdout + baseline.stderr)
          assert baseline.returncode == 1
          cases = set(re.findall(r'^(?:FAIL|ERROR): (test_[a-z_]+)', baseline.stderr, re.M))
          assert cases == {
              'test_audit_holds_if_outer_zip_changes_during_readback',
              'test_browser_combined_suffix_restores_original_bytes',
              'test_reassembly_failure_keeps_final_name_available_for_retry',
              'test_report_cannot_overwrite_input_or_unrelated_files',
              'test_reshare_requires_a_distinct_set_even_in_same_download_folder',
              'test_single_zip_checksum_and_audit_share_unchanged_file',
          }, cases
          print('R984_PC_READBACK_DEFECTS_REPRODUCED_6')
          subprocess.run([
              sys.executable, '-m', 'unittest', 'discover', '-s', 'r985-probe/candidate/tools/tests', '-v',
          ], check=True)
          print('R985_PC_READBACK_REGRESSIONS_PASS_34')
          REPLAY
      - uses: actions/upload-artifact@v4
        with:
          name: r985-verified-pc-tools
          path: r985-probe
          if-no-files-found: error
          retention-days: 2
  readback_windows:
    name: Readback regression on Windows
    needs: readback_linux
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: r985-verified-pc-tools
          path: r985-probe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce six defects in R984 and run the full PC regression set
        shell: bash
        run: *pc_regression
  publish:
    name: Publish and verify the PC package
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && !github.event.repository.private && github.ref == 'refs/heads/r975-device-regression'
    needs: [readback_linux, readback_windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: r985-pc-readback
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: r985-verified-pc-tools
          path: r985-publication
      - name: Verify the package and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd r985-publication
          python3 - <<'REPORT'
          import hashlib, json, os
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path("R985_PC_Readback_Tools.zip")
          sha = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert sha == "16dceef0a3d9b0febdc288a3961fdd810b5ece5a56c3c46c30b883e796354834"
          with ZipFile(archive) as contents:
              assert contents.testzip() is None
              assert set(contents.namelist()) == {
                  'README.md', 'verify_collection.py', 'restore_capture.py',
                  'r810_evidence_export_audit.py', 'r875_native_capture_audit.py',
              }
          info = {
              "version": "R985",
              "component": "PC evidence readback",
              "archive": {"name": archive.name, "bytes": archive.stat().st_size, "sha256": sha},
              "installed_app_reference": {"build": 984, "version": "0.9.84",
                  "ipa_sha256": "4271dde9b4aa9be11d3adfd6e7745cb9ac3a8134e15f6624a83ab9747bc79195"},
              "workflow_commit": os.environ["GITHUB_SHA"],
              "passed_run": int(os.environ["GITHUB_RUN_ID"]),
              "runner_matrix": ["ubuntu-24.04", "windows-2022"],
              "baseline_reproductions": 6, "pc_regressions_per_platform": 34,
              "local_replay_of_existing_real_sample": {'archive_sha256': '54931874974544ad213a04eed5ca59cde55b88540774de089f67588292be6c9b', 'original_bytes': 1048059719, 'part_count': 4, 'member_crc_checks': 35, 'decoded_movie_frames': 3939, 'recording_build': '974', 'report_status': 'HOLD_REVIEW_REQUIRED'},
              "r984_physical_end_to_end_status": "UNVERIFIED",
          }
          Path("VERIFICATION_R985.json").write_text(json.dumps(info, indent=2) + "\n")
          print("R985_PACKAGE_VERIFIED", json.dumps(info))
          REPORT
          packages=(R985_PC_Readback_Tools.zip VERIFICATION_R985.json)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish > existing.json 2>/dev/null; then
            jq -e --arg commit "$GITHUB_SHA" '.isDraft and .targetCommitish == $commit' existing.json
            gh release upload "$RELEASE_TAG" "${packages[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "${packages[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease               --title 'R985 PC読み戻しツール'               --notes 'iPhoneから受け取った証拠のPC側照合用。重複ダウンロード名、再共有の独立したパート、失敗時の復元ZIPとレポートの保存を修正。iPhone側は実機試験用R984を使用します。'
          fi
          for package in "${packages[@]}"; do
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$package" --dir draft-readback
            cmp "$package" "draft-readback/$package"
          done
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          for package in "${packages[@]}"; do
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$package"
            curl -fsSL --retry 3 "$url" -o "published-$package"
            cmp "$package" "published-$package"
            printf 'R985_PUBLIC_READBACK_VERIFIED %s\n' "$url"
          done
