jobs:
  b:
    if: >-
      github.repository ==
      'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        ref: d558f9148a11befe00f4a94f81fae04676524c10
    - run: |
        python3 - <<'PY'
        import os,base64,lzma,hashlib,pathlib
        b=lzma.decompress(base64.b85decode(
          ''.join(os.environ['P'].split())),
          format=lzma.FORMAT_ALONE)
        assert hashlib.sha256(b).hexdigest() == (
          'efdd1aaf43fa1453eacd4194aa98dd14' +
          '423ea17d81487673e4ccb699ec737871')
        names=[
          'app/ios/ChampionsOnDevice/' +
          'R672PixelHPFillReader.swift',
          'tests/R672HPFillSmoke.swift',
          'tools/r672_patch.py',
          '/tmp/R672CI.sh']
        sizes=[8133, 3039, 2134, 1256]
        i=0
        for n,z in zip(names,sizes):
          p=pathlib.Path(n)
          p.parent.mkdir(parents=True,exist_ok=True)
          assert not p.exists(),n
          p.write_bytes(b[i:i+z]);i+=z
        assert i==len(b)
        PY
        bash /tmp/R672CI.sh
