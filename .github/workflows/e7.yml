       set -euo pipefail
       mkdir -p source R745Proof
       url='https://api.github.com/repos/'
       url+='zeek10191019-stack/'
       url+='true-plan-showdown-verification/'
       url+='actions/artifacts/13764944064/zip'
       curl -fLsS --retry 2 \
        -H "Authorization: Bearer $GH_TOKEN" \
        -H 'Accept: application/vnd.github+json' \
        "$url" -o /tmp/r744.zip
       python3 - <<'PYTHON'
