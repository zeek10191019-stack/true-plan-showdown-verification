name: R745 Proven Compact Mac Source Gate - NO IPA
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/e7.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  check:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
    - name: Restore pinned R744 source and apply R745 diff
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
