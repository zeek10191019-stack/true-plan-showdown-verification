      - name: "Verify all diagnostic inputs before writing"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'RESTORE_IOS_PROBE'
          import base64,hashlib,json,lzma
          from pathlib import Path
          folder=Path('.r561_runtime_payload');parts=[f'part_{i:04d}' for i in range(3)]
          assert sorted(p.name for p in folder.iterdir())==parts,'IOS_PROBE_PART_SET'
          compressed=base64.b64decode(b''.join((folder/p).read_bytes() for p in parts),validate=True)
          decoder=lzma.LZMADecompressor();data=decoder.decompress(compressed,max_length=1000001)
          assert len(data)==70620 and decoder.eof and not decoder.unused_data,'IOS_PROBE_PAYLOAD_BOUND'
          assert hashlib.sha256(data).hexdigest()=='388cbfcba9894f6c213ca0c0ea35fb4de10d0fc8a7e321218db13e722291e1c3','IOS_PROBE_PAYLOAD_SHA'
          inputs=json.loads(data);assert sorted(inputs)==['R560PlatformHarness.swift', 'bounded_ci_process.py', 'fixed_hp.png', 'r561_reference_source.py', 'run_ios_runtime_probe_r561.py', 'run_platform_probe.py', 'run_runtime_diagnostic.py', 'runtime_reference_source.py', 'source_guard_payload.py', 'verify_bound_evidence.py', 'verify_platform_probe.py'],'IOS_PROBE_INPUT_SET'
          prepared={}
          for name,item in inputs.items():
              value=item['utf8'].encode('utf-8') if 'utf8' in item else base64.b64decode(item['base64'],validate=True)
              assert len(value)==item['bytes'] and len(value)<200000 and hashlib.sha256(value).hexdigest()==item['sha256'],'IOS_PROBE_INPUT_SHA'
              prepared[name]=value
          own=Path('diagnostics');own.mkdir(exist_ok=False)
          for name,value in prepared.items():
              with (own/name).open('xb') as stream:stream.write(value)
          reports=own/'reports';reports.mkdir()
          (reports/'R561D_INPUTS.json').write_text(json.dumps({'scope':'R561_NEWEST_INSTALLED_IOS_RUNTIME_DIAGNOSTIC_ONLY',
           'native_CI_certified':False,'files':{n:{'sha256':v['sha256'],'bytes':v['bytes']} for n,v in inputs.items()}},indent=2)+'\n')
          print('R561_PUBLIC_DIAGNOSTIC_INPUTS_VERIFIED; NO_FULL_APP_CERTIFICATION')
          RESTORE_IOS_PROBE
      - name: "Run R561 shared engine on newest compatible installed iOS27 runtime"
        shell: bash
        run: |
          python3 diagnostics/run_ios_runtime_probe_r561.py
      - name: "Return evidence even after failure; no artifacts/cache"
        if: always()
        shell: bash
        run: |
          python3 - <<'RETURN_IOS_PROBE'
          from pathlib import Path
          import base64,hashlib,io,zipfile
          buffer=io.BytesIO()
          with zipfile.ZipFile(buffer,'w',compression=zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(Path('diagnostics/reports').glob('*')):
                  if path.suffix in ('.json','.log') and path.stat().st_size<2000000:archive.write(path,path.name)
          data=buffer.getvalue();encoded=base64.b85encode(data).decode()
          print('R561D_REPORT_B85_BEGIN',hashlib.sha256(data).hexdigest(),len(data))
          for i in range(0,len(encoded),500):print('R561D_REPORT_B85',encoded[i:i+500])
          print('R561D_REPORT_B85_END')
          print('DIAGNOSTIC_ONLY; PHONE_MODEL_MAY_DIFFER; GAME_AND_DEVICE_UNCERTIFIED; NO_IPA')
          RETURN_IOS_PROBE
