        shell: bash
        run: |
          set -euo pipefail
          mkdir -p R859Delivery
          # Verify the already completed preflight instead of trusting a branch label.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/43880966197" > R859Delivery/preflight_run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/43880966197/jobs" > R859Delivery/preflight_jobs.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('R859Delivery/preflight_run.json').read_text());j=json.loads(Path('R859Delivery/preflight_jobs.json').read_text())['jobs']
          assert r['head_sha']=='4237051c12961070a892917b0a8fde9a709172f9' and r['path']=='.github/workflows/r859.yml'
          assert r['status']=='completed' and r['conclusion']=='success'
          assert {(x['id'],x['conclusion']) for x in j}=={(133346430213,'success'),(133346430659,'success')}
          print('R860_PREFLIGHT_RUN_AND_BOTH_JOBS_VERIFIED',r['html_url'])
          PY
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request,os,re
          class LogRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,req,fp,code,msg,headers,newurl):
            if not newurl.startswith('https://'):raise ValueError('non-TLS log redirect')
            follow=super().redirect_request(req,fp,code,msg,headers,newurl)
            if follow is not None:follow.remove_header('Authorization')
            return follow
          opener=urllib.request.build_opener(LogRedirect())
          for job,label in [(133346430213,'mac'),(133346430659,'iphoneos')]:
           req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/jobs/'+str(job)+'/logs',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
           with opener.open(req,timeout=60) as response:data=response.read().decode('utf-8-sig')
           data=re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]','',data)
           data=''.join(c for c in data if c in '\r\n\t' or ord(c)>=32)
           Path('R859Delivery/preflight_'+label+'.log').write_text(data)
           print('PREFLIGHT_LOG_SAVED_WITH_CONTROL_CHARACTERS_REMOVED',job,len(data))
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          mac=Path('R859Delivery/preflight_mac.log').read_text();native=Path('R859Delivery/preflight_iphoneos.log').read_text()
          assert 'Executed 681 tests, with 0 failures' in mac
          assert 'R845_REAL_299MB_SPLIT_READBACK_PASS source=299000137 parts=[299000539, 678]' in mac
          assert 'R689_STREAMING_ZIP_Smoke_PASS' in mac and 'R845_79_ROUTE_SCOPE 22 0' in mac
          assert 'R845_TEN_PARTS_READBACK_ELEVEN_REJECT_CORRUPTION_HOLD_SOURCE_PRESERVED_PASS' in mac
          assert 'R859_BUILT_IDENTITY_VERIFIED 859 0.8.59' in native
          source='R859_SOURCE_655_VERIFIED 75506d42e381e86bfc544d09f579a75c747c1bb14c439274c0e6d138d164529d'
          assert source in mac and source in native
          ms=[int(x) for x in re.findall(r'R839_ORIGINAL_PNG_SOURCE_FSYNC_PIXEL_OCR_MAIN_PUBLICATION_MS ([0-9]+)',mac)]
          assert len(ms)==1 and 0<ms[0]<1000
          capture=re.findall(r'R852_CVPIXELBUFFER_PNG_FSYNC_PIXEL_OCR_STATE_MAIN_MS ([0-9]+) png_ms=([0-9]+) portrait=(true|false)',mac)
          assert len(capture)==2 and {x[2] for x in capture}=={'true','false'}
          assert all(0<int(x[0])<1000 for x in capture)
          capture_ms={('portrait' if x[2]=='true' else 'landscape'):int(x[0]) for x in capture}
          assert 'R854_LOSSLESS_PNG_REUSED_IMAGE_EXACT_PIXEL_READBACK_PASS' in mac
