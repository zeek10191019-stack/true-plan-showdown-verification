          print('R860_EXACT_PASSING_R859_SOURCE_VERIFIED',len(fs),tree)
          PY
          python3 pinned-r793/source/tools/generate_xcode_project.py
          xcodebuild -project pinned-r793/source/app/ios/ChampionsOnDeviceResearch.xcodeproj -scheme ChampionsOnDeviceResearch -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO -derivedDataPath "$RUNNER_TEMP/r859_device_test" build > R859Delivery/iphoneos_package.log 2>&1 || { grep -E 'error:|BUILD FAILED' R859Delivery/iphoneos_package.log; exit 1; }
