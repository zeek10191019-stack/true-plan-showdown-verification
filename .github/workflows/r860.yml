          48.4秒停止のOS根本原因、iPhone実表示1秒未満、自分メガ、79項目完全認識は未認証です。22項目は棚卸し上の直接読取経路が未登録です。現在ターンは証明が無ければ不明、姿はバンギラス通常・メガの限定的な推定です。
          
