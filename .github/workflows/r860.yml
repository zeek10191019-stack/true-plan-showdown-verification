          print('R860_PREFLIGHT_LOGS_VERIFIED',ms[0])
          PY
          ruby -ryaml -e 'puts YAML.load_file(ARGV[0]).fetch("jobs").fetch("verify").fetch("steps").fetch(17).fetch("run")' pinned-r859/.github/workflows/r859.yml > "$RUNNER_TEMP/restore_r859.sh"
          bash "$RUNNER_TEMP/restore_r859.sh"
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          s=Path('pinned-r793/source');sha=lambda b:hashlib.sha256(b).hexdigest()
          fs={str(p.relative_to(s)):p for p in s.rglob('*') if p.is_file() and not {'.build','.swiftpm','__pycache__'}.intersection(p.parts)}
          tree=sha(''.join(n+'\t'+sha(fs[n].read_bytes())+'\n' for n in sorted(fs)).encode());assert len(fs)==655 and tree=='75506d42e381e86bfc544d09f579a75c747c1bb14c439274c0e6d138d164529d'
          m=json.loads((s/'source_manifest.json').read_text());assert set(fs)==set(m)|{'source_manifest.json'} and all(sha(fs[n].read_bytes())==h for n,h in m.items())
