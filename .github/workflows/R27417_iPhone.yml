        run: |
          set -euo pipefail
          cat > /tmp/r27403-package_ipa.py <<'R27403_PACKAGER'
          #!/usr/bin/env python3
          """R27.417: fail-closed unsigned iOS app -> IPA packaging; no Apple credentials."""
          import argparse
          import hashlib
          import json
          import os
          from pathlib import Path
          import plistlib
          import stat
          import sys
          import zipfile
          
          APP_NAME = 'ChampionsOnDeviceResearch.app'
          BUNDLE_ID = 'com.zeek10191019.championsresearch'
          IPA_FILENAME = 'R27_417_Unsigned_ChampionsResearch.ipa'
          MACHO_MAGICS = (b'\xcf\xfa\xed\xfe', b'\xfe\xed\xfa\xcf', b'\xca\xfe\xba\xbe', b'\xbe\xba\xfe\xca', b'\xca\xfe\xba\xbf', b'\xbf\xba\xfe\xca')
          
          
          def inspect_app(app: Path):
              if not app.is_dir() or app.is_symlink() or app.name != APP_NAME:
                  raise ValueError('unexpected app directory')
              plist_path = app / 'Info.plist'
              if not plist_path.is_file():
                  raise ValueError('missing Info.plist')
              with plist_path.open('rb') as stream:
                  data = plistlib.load(stream)
              if data.get('CFBundleIdentifier') != BUNDLE_ID:
                  raise ValueError('unexpected CFBundleIdentifier')
              if data.get('CFBundleExecutable') != 'ChampionsOnDeviceResearch':
                  raise ValueError('unexpected CFBundleExecutable')
              if data.get('CFBundlePackageType') != 'APPL':
                  raise ValueError('CFBundlePackageType not APPL')
              if 'screen-capture' not in data.get('UIBackgroundModes', []):
                  raise ValueError('screen-capture background mode not present')
              if not str(data.get('NSScreenCaptureUsageDescription', '')).strip():
                  raise ValueError('missing capture consent description')
              ios_min = str(data.get('MinimumOSVersion', ''))
              if not ios_min or int(ios_min.split('.')[0]) != 27:
                  raise ValueError('unexpected MinimumOSVersion')
              if data.get('CFBundleVersion') != '417':
                  raise ValueError('unexpected app version')
              exe = app / data['CFBundleExecutable']
              if not exe.is_file() or exe.is_symlink() or exe.stat().st_size < 4:
                  raise ValueError('missing app executable')
              with exe.open('rb') as f:
                  if f.read(4) not in MACHO_MAGICS:
                      raise ValueError('executable is not Mach-O')
              if (app/'embedded.mobileprovision').exists():
                  raise ValueError('unexpected mobile provisioning profile')
              if (app/'_CodeSignature').exists():
                  raise ValueError('unexpected signature')
              return data
          
          
          def package_app(app: Path, output_dir: Path):
              data = inspect_app(app)
              if not output_dir.is_dir():
                  raise ValueError('output_dir must exist')
              ipa = output_dir / IPA_FILENAME
              if ipa.exists():
                  ipa.unlink()
              files = sorted(p for p in app.rglob('*') if p.is_file())
              if not files:
                  raise ValueError('no files in app')
              with zipfile.ZipFile(ipa, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
                  for p in files:
                      if p.is_symlink():
                          raise ValueError('refusing symlink in app')
                      name = 'Payload/' + APP_NAME + '/' + p.relative_to(app).as_posix()
                      if any(part in ('..', '') for part in Path(name).parts):
                          raise ValueError('unsafe member name')
                      info = zipfile.ZipInfo(name, date_time=(2020, 1, 1, 0, 0, 0))
                      info.compress_type = zipfile.ZIP_DEFLATED
                      info.external_attr = (p.stat().st_mode & 0xffff) << 16
                      archive.writestr(info, p.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=6)
              with zipfile.ZipFile(ipa) as archive:
                  if archive.testzip() is not None:
                      raise ValueError('IPA zip CRC failure')
                  names=set(archive.namelist())
                  if 'Payload/'+APP_NAME+'/Info.plist' not in names or 'Payload/'+APP_NAME+'/ChampionsOnDeviceResearch' not in names:
                      raise ValueError('missing mandatory IPA members')
                  embedded=plistlib.loads(archive.read('Payload/'+APP_NAME+'/Info.plist'))
                  if embedded.get('CFBundleIdentifier') != BUNDLE_ID:
                      raise ValueError('IPA plist mismatch')
              digest=hashlib.sha256(ipa.read_bytes()).hexdigest()
              (output_dir/(IPA_FILENAME+'.sha256')).write_text(digest+'  '+IPA_FILENAME+'\n', encoding='utf8')
              audit={'release':'R27.417','kind':'UNSIGNED_RESEARCH_IPA','sha256':digest,'ipa_bytes':ipa.stat().st_size,
                     'bundle_id':data['CFBundleIdentifier'],'version':data['CFBundleVersion'],
                     'minimum_ios':data['MinimumOSVersion'],'background_modes':data['UIBackgroundModes'],
                     'code_signed':False,'apple_id_included':False,'iPhone_installed':False,
                     'background_capture_certified':False,'battle_recommendation_certified':False,
                     'source_public_research_only':True}
              (output_dir/'R27_417_IPA_AUDIT.json').write_text(json.dumps(audit,ensure_ascii=False,sort_keys=True,indent=2)+'\n',encoding='utf8')
              print('UNSIGNED_IPA_STRUCTURE=PASS')
              print('UNSIGNED_IPA_SHA256='+digest)
              print('UNSIGNED_IPA_BYTES='+str(ipa.stat().st_size))
              print('NO_APPLE_ID_NO_SIGNING_NO_DEVICE_INSTALL')
              return audit
          
          if __name__=='__main__':
              parser=argparse.ArgumentParser()
              parser.add_argument('app',type=Path)
              parser.add_argument('output_dir',type=Path)
              a=parser.parse_args()
              try:
                  package_app(a.app,a.output_dir)
              except Exception as e:
                  print('FAIL_CLOSED:',e,file=sys.stderr)
                  sys.exit(1)
          R27403_PACKAGER
          echo '2bc56ae007ee095666debf7fc8061b7f1aafdc51f605da440df16b4bb0c6eb5d  /tmp/r27403-package_ipa.py' | shasum -a 256 -c -
      - name: Package only research app into unsigned IPA and validate manifest
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/r27403-derived/Build/Products/Debug-iphoneos/ChampionsOnDeviceResearch.app"
          test -d "$app"
          mkdir -p r27417-dist
          python3 /tmp/r27403-package_ipa.py "$app" r27417-dist
          test "$(find r27417-dist -maxdepth 1 -name '*.ipa' -type f | wc -l | tr -d ' ')" = 1
          test "$(stat -f%z r27417-dist/R27_417_Unsigned_ChampionsResearch.ipa)" -lt 20000000
          (cd r27417-dist && shasum -a 256 -c R27_417_Unsigned_ChampionsResearch.ipa.sha256)
          echo 'IPA_SIGNING=NOT_PERFORMED; DEVICE_INSTALL=NOT_TESTED; NO_APPLE_CREDENTIALS'
      - name: Upload one short-retention public research artifact
        uses: actions/upload-artifact@v4
        with:
          name: r27417-unsigned-iphone-ocr-diagnostic-ipa
          path: r27417-dist/
          if-no-files-found: error
          retention-days: 1
      - name: Certification boundary
        run: |
          echo 'R27.417 UNSIGNED RESEARCH ONLY; GAME OCR ACCURACY=UNTESTED; E2E=NOT_CERTIFIED; STAGE_UNCHANGED'
