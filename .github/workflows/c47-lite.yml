name: R1047 C47 lite pinned full regression (NO IPA)
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/c47-lite.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    name: ${{ matrix.job }}
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
        - job: macos-source
          os: xcode-27
        - job: windows-cli
          os: windows-2025
        - job: windows-receiver
          os: windows-2025
        - job: macos-sender
          os: xcode-27
        - job: windows-hud
          os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
    - name: Prepare SHA-pinned C46 steps and exact C47 tests
      shell: bash
      run: |
        set -Eeuo pipefail
        if [[ "$RUNNER_OS" == Windows ]]; then PY=python; else PY=python3; fi
        "$PY" - <<'C47_LITE_PY'
        import pathlib,os,hashlib,urllib.request,base64,zlib,json
        sha=lambda b:hashlib.sha256(b).hexdigest()
        url='https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/7a7cde052e6f5e7a18d5399a9a0ff483734768c3/.github/workflows/c46.yml'
        with urllib.request.urlopen(url,timeout=60) as response: raw=response.read(200000)
        assert len(raw)==169037 and sha(raw)=='875f6a669c27803722b869a423fdd4c959091164f9788c76731a7345fdd23987', 'C46_PIN_MISMATCH'
        root=pathlib.Path(os.environ['RUNNER_TEMP'])/'c47-pinned-c46';root.mkdir(exist_ok=False)
        manifest=[(999, 7284, '9a63555c6b7fba22f883468be5c92f1cdfc1761209f81ffcd7d19f196c37c112'), (8434, 9535, '6566a0d94cf9dd0a532e8dd8c4594004a3cc154a121330a42317a19a0dca95f9'), (18127, 22139, '55225cc7546e40e1f3361e4b74f61ddac62c2544043cc42b87ab90e44994b46c'), (40467, 15975, '3cab02afa347345b8c44c3729ec6dc2e1879bfd0c2a740c6ec7d256dc37bede0'), (56618, 28634, 'a91bc9a81660eed0d8faf6177c9ea7d21bf391ce85ab958944462e0a8e9de099'), (85402, 22438, 'fefb46acfbd2841a002a31d024179eb7a4702cccaf7524c89dbd66f1bec7df50'), (108096, 46879, '5f8e880e5bccdf6df16fa684b32e63c81bbed31c1f791e24eb7a3c9730d93bcd'), (155214, 13348, 'd13fd3d1681656727115656d7a64405be049ff3051422482e3eef19ba780b6bc')]
