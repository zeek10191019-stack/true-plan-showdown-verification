       Zc2JF5xb5wEAAbklkWIAAJuvHrmxxGf7AgAAAAAEWVo=
       '''
       pkt=json.loads(lzma.decompress(base64.b64decode(
        ''.join(packed.split()))))
       assert pkt['schema']=='trueplan.r744.e1-locked-source-patch.v1'
       prior={p.relative_to(root).as_posix():digest(p.read_bytes())
        for p in root.rglob('*') if p.is_file()}
       assert len(prior)==pkt['baseline_count']==365
       tree=''.join(n+'\t'+prior[n]+'\n' for n in sorted(prior))
       assert digest(tree.encode())==pkt['baseline_tree_sha256']
       for item in pkt['patches']:
        for name in item['paths']:
         f=root/name
         assert f.is_file() and prior[name]==item['prior_sha256']
         lines=f.read_text(encoding='utf-8').splitlines(keepends=True)
         out=[];last=0
         for lo,hi,rep in item['hunks']:
          assert last<=lo<=hi<=len(lines)
          out.extend(lines[last:lo]);out.append(rep);last=hi
         out.extend(lines[last:]);blob=''.join(out).encode('utf-8')
         assert digest(blob)==item['sha256']
         f.write_bytes(blob)
       for item in pkt['additions']:
        blob=item['content'].encode('utf-8')
        assert digest(blob)==item['sha256']
        for name in item['paths']:
         f=root/name
         assert not f.exists()
         f.parent.mkdir(parents=True,exist_ok=True)
         f.write_bytes(blob)
       manifest={p.relative_to(root).as_posix():digest(p.read_bytes())
        for p in root.rglob('*') if p.is_file()
        and p.name!='source_manifest.json'}
       m=root/'source_manifest.json'
       m.write_text(json.dumps(manifest,indent=2,sort_keys=True,
        ensure_ascii=False)+'\n')
       files={p.relative_to(root).as_posix():digest(p.read_bytes())
        for p in root.rglob('*') if p.is_file()}
       assert len(files)==pkt['final_count']==369
       assert set(prior)<=set(files)
       tree=''.join(n+'\t'+files[n]+'\n' for n in sorted(files))
       assert digest(tree.encode())==pkt['tree_sha256']
       assert digest(m.read_bytes())==pkt['manifest_sha256']
       pathlib.Path('R744Artifacts/SOURCE_HASHES.json').write_text(
        json.dumps(files,indent=2,sort_keys=True)+'\n')
       print('R744_SHA_369_NO_DELETION_RESTORED')
       PYTHON
    - name: Mac Swift XCTest and iPhoneOS compile gate NO IPA
      shell: bash
      run: |
       set -euo pipefail
       (cd source/R720_PORTABLE_TESTS && swift test -j 2) \
        > R744Artifacts/SwiftTests.log 2>&1 || {
         tail -n 70 R744Artifacts/SwiftTests.log; exit 1;
        }
       grep -Fq 'Executed 226 tests, with 0 failures' \
        R744Artifacts/SwiftTests.log
       swiftc -frontend -parse source/app/ios/ChampionsOnDevice/*.swift
       python3 source/tools/r742_live_path_audit.py
       python3 source/tools/r743_macos_compat_audit.py
       python3 source/tools/generate_xcode_project.py
       xcodebuild -project source/app/ios/ChampionsOnDeviceResearch.xcodeproj \
        -scheme ChampionsOnDeviceResearch -configuration Debug \
        -sdk iphoneos -destination 'generic/platform=iOS' \
        ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
        -derivedDataPath "$RUNNER_TEMP/r744-compile" build \
        > R744Artifacts/iPhoneOSCompile.log 2>&1 || {
         grep -E 'error:|BUILD FAILED' \
          R744Artifacts/iPhoneOSCompile.log || true
         exit 1;
        }
       grep -Fq 'BUILD SUCCEEDED' R744Artifacts/iPhoneOSCompile.log
       grep -Fq 'R744SceneAnchorFusion.swift' \
        R744Artifacts/iPhoneOSCompile.log
       python3 - <<'PYTHON'
       import json,hashlib,pathlib,zipfile
       root=pathlib.Path('source');out=pathlib.Path('R744Artifacts')
       hashes=json.loads((out/'SOURCE_HASHES.json').read_text())
       assert len(hashes)==369
       for name,expected in hashes.items():
        got=hashlib.sha256((root/name).read_bytes()).hexdigest()
        assert got==expected
       archive=out/'R744_ALL_EDITABLE_SOURCE_RECOVERY.zip'
       with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED) as z:
        for name in sorted(hashes):z.write(root/name,name)
       with zipfile.ZipFile(archive) as z:
        assert z.testzip() is None and len(z.namelist())==369
       (out/'STATUS.txt').write_text(
        'Mac XCTest/iPhoneOS compile gate only. NO IPA.\n'
        '79-field game-value recognition is NOT certified.\n')
       size=sum(p.stat().st_size for p in out.rglob('*') if p.is_file())
       assert size<16_000_000
       print('R744_MAC_COMPILE_PASS_NO_IPA_GENERATED')
       PYTHON
    - name: Upload source and diagnostics only NO IPA
      uses: actions/upload-artifact@v4
      with:
        name: R744-read-path-audit-no-ipa
        path: R744Artifacts/
        retention-days: 3
        if-no-files-found: error
