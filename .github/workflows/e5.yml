name: R744 E5 Proven Compact Mac Read-Path Gate - No IPA
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/e5.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
    - name: Reuse pinned proven e3 restore only
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
       set -euo pipefail
       url='https://api.github.com/repos/'
       url+='zeek10191019-stack/'
       url+='true-plan-showdown-verification/'
       url+='contents/.github/workflows/e3.yml?ref=main'
       args=('-fLsS' '--retry' '2')
       args+=('-H' "Authorization: Bearer $GH_TOKEN")
       args+=('-H' 'Accept: application/vnd.github.raw+json')
       curl "${args[@]}" "$url" -o /tmp/e3_raw.yml
       sha='1c7e7a5e489b7cec516ea18f7f8581521e59d2cd5019ae92174d02f9907a3433'
       printf '%s  %s\n'  "$sha" /tmp/e3_raw.yml | sha256sum -c -
       python3 - <<'PYTHON'
       import pathlib,subprocess
       s=pathlib.Path('/tmp/e3_raw.yml').read_text()
       a=s.index('    - name: Restore pinned R741')
       a=s.index('      run: |\n',a)+len('      run: |\n')
       b=s.index('    - name: Run Swift tests',a)
       lines=s[a:b].splitlines()
       assert lines and all(x.startswith('       ') for x in lines if x)
       run='\n'.join(x[7:] for x in lines)+'\n'
       pathlib.Path('/tmp/r743_restore_e3.sh').write_text(run)
       subprocess.run(['bash','-n','/tmp/r743_restore_e3.sh'],check=True)
       print('E3_RESTORE_EXACT_SHA_PIN_PASS')
       PYTHON
       bash /tmp/r743_restore_e3.sh
       mkdir -p R744Artifacts
