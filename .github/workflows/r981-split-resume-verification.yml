name: R981 split ZIP retry
'on':
  push:
    branches: [r975-device-regression]
    paths: [.github/workflows/r981-split-resume-verification.yml]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: r981-unsigned-device-test
  cancel-in-progress: false
jobs:
  verify:
    name: Swift, browser, PC and iPhoneOS regression
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && !github.event.repository.private && github.ref == 'refs/heads/r975-device-regression'
    runs-on: xcode-27
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RELEASE_TAG: r981-unsigned-device-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: .github/workflows/r981-split-resume-verification.yml
      - name: Restore verified R980 and apply the R981 corrections
        shell: bash
        run: &restore |
          set -euo pipefail
          git show b48f4086d1df0333612f4a574da0f7bbc86b5340:.github/workflows/r980-display-verification.yml > "$RUNNER_TEMP/r980-baseline.yml"
          echo 'd8d7914b5352097b3ff8756207cfa74f8c31056b1ee64cc5c5a8552970e9404f  r980-baseline.yml' | (cd "$RUNNER_TEMP" && shasum -a 256 -c -)
          ruby -ryaml -e '
            steps = YAML.load_file(ARGV.fetch(0), aliases: true).fetch("jobs").fetch("verify").fetch("steps")
            puts steps.find { |step| step["name"] == "Restore verified R979 and apply the R980 corrections" }.fetch("run")
          ' "$RUNNER_TEMP/r980-baseline.yml" > "$RUNNER_TEMP/r980-restore.sh"
          bash "$RUNNER_TEMP/r980-restore.sh"
          cp "pinned-r793/source/app/ios/ChampionsOnDevice/R714ChunkedEvidence.swift" "$RUNNER_TEMP/r980-chunked.swift"
          python3 - "$RUNNER_TEMP/r981.patch" <<'PAYLOAD'
