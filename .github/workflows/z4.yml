jobs:
  build:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            1e63efa4db514cc122f2940a39623d9bc65c554c
      - name: Verify R700 and build IPA
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os,re,base64,lzma,hashlib
          import pathlib,urllib.request,ast
          url=('https://raw.githubusercontent.com/'
            'zeek10191019-stack/'
            'true-plan-showdown-verification/'
            'main/.github/workflows/z3.yml')
          req=urllib.request.Request(url,headers={
            'User-Agent':'R700-Pinned-Builder'})
          with urllib.request.urlopen(
            req,timeout=40) as res:
            old=res.read(25000)
          assert len(old)==10432
          assert hashlib.sha256(old).hexdigest()==(
            '30e97f7cc34f07d185635569b286c692'
            'b791e5e36f4a86033bd63da6a0a48cf3')
          m=re.search(rb'(?m)^  R699_PKG: >-\n'
            rb'((?:    [^\n]*\n)+)',old)
          assert m,'R699_PINNED_PACKAGE_MISSING'
          os.environ['R699_PKG']=b''.join(
            m[1].split()).decode('ascii')
          raw=lzma.decompress(base64.b64decode(
            os.environ['R700_PKG']),
            format=lzma.FORMAT_ALONE)
          assert hashlib.sha256(raw).hexdigest()==(
            '4a5e5ef6d5a0233e33a39d2edc198532'
            '904fabcd9e4588ac4b2eca07a22bc283')
          names=['R700FieldEvidenceMatrix.swift',
            'R700Patch.py','R700MakeBuild.py',
            'R700StandaloneStub.swift',
            'R700Smoke.swift']
          sizes=[8285, 1483, 1925, 251, 7907]
          assert sum(sizes)==len(raw)
          pos=0
          for name,size in zip(names,sizes):
            isTest=('Smoke.swift' in name or
              'StandaloneStub.swift' in name)
            folder='tests' if isTest else 'tools'
            p=pathlib.Path(folder)/name
            p.parent.mkdir(parents=True,
              exist_ok=True)
            p.write_bytes(raw[pos:pos+size])
            pos+=size
          print('R700_SOURCE_SHA_PASS',flush=True)
          text=old.decode('utf-8')
          marker="          python3 - <<'PYCODE'\n"
          start=text.index(marker)+len(marker)
          end=text.index('\n          PYCODE',start)
          block=text[start:end]
          body='\n'.join(line[10:] for line in
            block.splitlines())
          needle=("['python3','tools/"+
            "R699MakeBuild.py']")
          assert body.count(needle)==1
          body=body.replace(needle,
            "['python3','tools/R700MakeBuild.py']")
          ast.parse(body)
          exec(compile(body,'r699','exec'),{})
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: R700-unsigned-iLoader-IPA
          path: dist/R700*
          if-no-files-found: error
          retention-days: 7
