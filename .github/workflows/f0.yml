jobs:
  build:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            1e63efa4db514cc122f2940a39623d9bc65c554c
      - name: Verify R690 and build IPA
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os,re,base64,lzma,hashlib
          import pathlib,urllib.request,ast
          url=('https://raw.githubusercontent.com/'
            'zeek10191019-stack/'
            'true-plan-showdown-verification/'
            '077d6a5a6a9883eeb6a7be0c37004c'
            'ff4774f058/.github/workflows/b9.yml')
          req=urllib.request.Request(url,headers={
            'User-Agent':'R690-Pinned'})
          with urllib.request.urlopen(
            req,timeout=40) as res:
            b9=res.read(20000)
          assert len(b9)==16776
          assert hashlib.sha256(b9).hexdigest()==(
            'd8dd2d79b7d665a094352224b052603e1ad50'
            'a4091745c6367699a71c0a5736c')
          m=re.search(rb'(?m)^  R689_PKG: >-\n'
             rb'((?:    [^\n]*\n)+)',b9)
          assert m,'R689_PINNED_PACKAGE_MISSING'
          os.environ['R689_PKG']=b''.join(
            m[1].split()).decode('ascii')
          raw=lzma.decompress(base64.b64decode(
            os.environ['R690_PKG']),
            format=lzma.FORMAT_ALONE)
          assert hashlib.sha256(raw).hexdigest()==(
            '234c18097497ab261a3a9ad07ffcdad3'
            'ba6050c8251641e8adcc69eac550c50e')
          names=['R690HistoricalEvidence.swift',
            'R690HistoricalVision.swift',
            'R690Patch.py','R690MakeBuild.py',
            'R690CanonicalSmoke.swift']
          sizes=[4142, 6807, 3839, 3292, 2393]
          assert sum(sizes)==len(raw)
          pos=0
          for n,size in zip(names,sizes):
            isTest=n.endswith('Smoke.swift')
            folder='tests' if isTest else 'tools'
            out=pathlib.Path(folder)/n
            out.parent.mkdir(
              parents=True,exist_ok=True)
            out.write_bytes(raw[pos:pos+size])
            pos+=size
          print('R690_SOURCE_SHA_PASS',flush=True)
          text=b9.decode('utf-8')
          marker="          python3 - <<'PYCODE'\n"
          start=text.index(marker)+len(marker)
          end=text.index('\n          PYCODE',start)
          block=text[start:end]
          body='\n'.join(
            line[10:] for line in
            block.splitlines())
          needle=("['python3','tools/"+
            "R689MakeBuild.py']")
          assert body.count(needle)==1
          body=body.replace(needle,
            "['python3','tools/R690MakeBuild.py']")
          ast.parse(body)
          exec(compile(body,'r689','exec'),{})
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: R690-unsigned-iLoader-IPA
          path: dist/R690*
          if-no-files-found: error
          retention-days: 7
