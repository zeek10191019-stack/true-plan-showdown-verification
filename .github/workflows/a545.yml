name: R545 Four-Source Evidence Readiness IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
      && github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - name: Verify pinned R544 and compile R545
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY545'
          import urllib.request,re,hashlib,ast,textwrap
          url='https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/97ee90dcdbe8ff25c7a39ad54becf2e7043700d3/.github/workflows/c544.yml'
          with urllib.request.urlopen(url,timeout=60) as f: raw=f.read(10000)
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='b150945a544f67fbd4843ec4647d7bac9634a7d0','R544_WORKFLOW_CHANGED'
          m=re.search(rb"          python3 - <<'PYFIX'\n([\s\S]*?)\n          PYFIX",raw)
          assert m,'R544_WRAPPER_MISSING'
          code=textwrap.dedent(m.group(1).decode())
          endpoint="exec(compile(fixed,'R544_FIXED_VERIFIED_BUILDER','exec'))"
          assert code.count(endpoint)==1,'R544_SCRIPT_ANCHOR_CHANGED'
          code=code.replace(endpoint,'__capture(fixed)',1)
          captured=[]
          exec(compile(code,'R544_WRAPPER_CAPTURE','exec'),{'__capture':captured.append})
          assert len(captured)==1,'R544_BUILDER_MISSING'
          builder=captured[0]
          assert hashlib.sha256(builder.encode()).hexdigest()=='717cffdcae42a10be0b8412e651f0ee06d9dc34e00cba4b6dc15b4d06dda4751','R544_BUILDER_CHANGED'
