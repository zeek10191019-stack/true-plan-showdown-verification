ift\')))==89,\'R545_SWIFT_COUNT_CHANGED\'\\nassert _tree544()==\'52b205ca9343c512b021f41099fd9dba54282bd1d46b9aa1be59afe74fbcbdd0\',\'R545_SOURCE_TREE_CHANGED\'\\nfor _n545,_d545 in {\'CaptureCoordinator.swift\': \'4a1ac3e3c551830a5d54889fea981c6679bcf3ee97210002bd2f2864c3dc059e\', \'R545EvidenceReadiness.swift\': \'1a27fa6dc16854e285aae273d4b9fcb1386015028e7dad237d32ae594e15d43d\'}.items():\\n    assert _h545.sha256((files/_n545).read_bytes()).hexdigest()==_d545,\'R545_FILE_SHA_MISMATCH_\'+_n545\\nprint(\'PASS_R545_89_SOURCE_FILES_AND_METRICS_READINESS\',flush=True)\\n"'+"\n"+anchor,1)
          changes=[("target=Path('dist/R544.ipa')", "target=Path('dist/R545.ipa')"), ("info['CFBundleVersion']='544';info['CFBundleShortVersionString']='0.5.44'", "info['CFBundleVersion']='545';info['CFBundleShortVersionString']='0.5.45'"), ("record={'release':'R544'", "record={'release':'R545'"), ("'source_tree_sha256':'c5a81798f32296e52ce96da2ad84c06aa9c1a07ccde791d12211130e58e1a433'", "'source_tree_sha256':'52b205ca9343c512b021f41099fd9dba54282bd1d46b9aa1be59afe74fbcbdd0'"), ("Path('dist/R544_BUILD_AUDIT.json')", "Path('dist/R545_BUILD_AUDIT.json')"), ("print('PASS_R544_UNSIGNED_IPA_BUILD'", "print('PASS_R545_UNSIGNED_IPA_BUILD'"), ("assert len(swift)==88,'R544_SWIFT_COUNT'", "assert len(swift)==89,'R545_SWIFT_COUNT'"), ("'source_count':88", "'source_count':89")]
          for old,new in changes:
              assert builder.count(old)==1,('R545_PATCH_ANCHOR_CHANGED',old)
              builder=builder.replace(old,new,1)
          oldhash="assert hashlib.sha256(source.encode()).hexdigest()=='c9dd7e29cd0fb7023289194dd8f7ef79a64d6c629c30fa679ebc36d6f2d706de','R544_BUILD_SOURCE_CHANGED'"
          assert builder.count(oldhash)==1,'R545_PREVIOUS_HASH_GUARD_CHANGED'
          builder=builder.replace(oldhash,"assert hashlib.sha256(source.encode()).hexdigest()=="+repr('9a5cb51955f863e8c7d6c74f75a4fa52d5e21ae2d03740ae88dcd4598c6ac163')+",'R545_BUILD_SOURCE_CHANGED'",1)
