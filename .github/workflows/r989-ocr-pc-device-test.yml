name: R989 OCR and PC device verification
'on':
  push:
    branches:
    - r987-ocr-pc-regression
    paths:
    - .github/workflows/r989-ocr-pc-device-test.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    name: Swift, browser, PC and iPhoneOS regression
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && !github.event.repository.private && github.ref == 'refs/heads/r987-ocr-pc-regression'
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RELEASE_TAG: r989-unsigned-device-test
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: .github/workflows/r989-ocr-pc-device-test.yml
    - name: Restore fixed R988 and apply R989
      shell: bash
      run: |
        set -euo pipefail
        git show ce8bfe118fe84d9cf3e707c5cbe86c0266e5c330:.github/workflows/r988-ocr-pc-device-test.yml > "$RUNNER_TEMP/r988-baseline.yml"
        echo 'b7acd1c7b9c8611870147d5878d6da896aaad4d3a6791db21f45f0193e17073d  r988-baseline.yml' | (cd "$RUNNER_TEMP" && shasum -a 256 -c -)
        ruby -ryaml -e '
          steps = YAML.load_file(ARGV.fetch(0), aliases: true).fetch("jobs").fetch("verify").fetch("steps")
          puts steps.find { |step| step["name"] == "Restore fixed R987 and apply R988" }.fetch("run")
        ' "$RUNNER_TEMP/r988-baseline.yml" > "$RUNNER_TEMP/r988-restore.sh"
        bash "$RUNNER_TEMP/r988-restore.sh"
        python3 - "$RUNNER_TEMP/r989.patch" <<'PAYLOAD'
        import base64, hashlib, sys, zlib
