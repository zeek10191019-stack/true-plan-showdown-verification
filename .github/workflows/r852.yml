name: R852 D112 Save first lifecycle retention and raw buffer latency preflight NO IPA
on:
  push:
    branches: [main]
    paths: [.github/workflows/r852.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            lane: real-apple-vision
          - runner: xcode-27
            lane: iphoneos-compile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4cc925234f9101a8875744e75049f06e96ce4d90
          path: pinned-r823
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/r823.yml
      - uses: actions/checkout@v4
        with:
          ref: 641a9ee8701484fabaf9344db5a0eaab31c422c3
          path: pinned-r821
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/r821.yml
      - uses: actions/checkout@v4
        with:
          ref: 46b607b88ddb5569fff0fc042dfdb5f0fb6e06f6
          path: pinned-r819
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/r819.yml
      - uses: actions/checkout@v4
        with:
          ref: 37b3e26851c71fcabd65da3299356c1e38c53869
          path: pinned-r793
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/r793.yml
            .github/workflows/d30.b64
      - uses: actions/checkout@v4
        with:
          ref: b783a785f97d0b74c9a1d48780dcee9626aef12c
          path: pinned-r833
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/r833.yml
      - uses: actions/checkout@v4
        with:
          ref: 73b62dff5e71b7889e90b7be1e1ba311e6205ec2
          path: pinned-r843
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/r843.yml
      - uses: actions/checkout@v4
        with:
          ref: 2529b32878004b846bcbfc7c3a62aa73df6302d4
          path: pinned-r844
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/r844.yml
      - uses: actions/checkout@v4
        with:
          ref: d09e35c616f7d8056b967d51a6936f13b1d11ef7
          path: pinned-r845
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/r845.yml
      - uses: actions/checkout@v4
        with:
          ref: ee9255ad4179d01dadc595a5b5d380125f427851
          path: pinned-r846
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: .github/workflows/r846.yml
      - uses: actions/checkout@v4
        with:
          ref: e8e28eb774bd790f1b08c7ff7e9d5defa837f469
          path: pinned-r847
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/r847.yml
      - uses: actions/checkout@v4
        with:
          ref: b2e09fa3a86ba9488ea514382bd10cc0b98d8c92
          path: pinned-r848
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/r848.yml
      - name: Restore exact R848 and apply audited R852 production delta
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e 'puts YAML.load_file(ARGV[0]).fetch("jobs").fetch("verify").fetch("steps").fetch(10).fetch("run")' pinned-r848/.github/workflows/r848.yml > "$RUNNER_TEMP/restore_r848.sh"
          bash "$RUNNER_TEMP/restore_r848.sh"
          python3 - <<'PYCODE'
          from pathlib import Path
          import json,hashlib,base64,lzma
          s=Path('pinned-r793/source');sha=lambda b:hashlib.sha256(b).hexdigest()
          def disk():return {str(p.relative_to(s)):p for p in s.rglob('*') if p.is_file() and not {'.build','.swiftpm','__pycache__'}.intersection(p.parts)}
          def tree(fs):return sha(''.join(n+'\t'+sha(fs[n].read_bytes())+'\n' for n in sorted(fs)).encode())
          fs=disk();assert len(fs)==631 and tree(fs)=='632146e311b937376e2a65b7722d3ccc2bdcae3193ba1f791466ff092c94385c'
          m=json.loads((s/'source_manifest.json').read_text());assert all(sha(fs[n].read_bytes())==h for n,h in m.items())
          d=json.loads(lzma.decompress(base64.b64decode('')))
          for n,v in sorted(d.items(),key=lambda item:'copy' in item[1]):
           p=s/n;assert not Path(n).is_absolute() and '..' not in Path(n).parts
           if v['old'] is None:
            assert not p.exists()
            if 'copy' in v:
             original=s/v['copy'];assert not Path(v['copy']).is_absolute() and '..' not in Path(v['copy']).parts
             assert sha(original.read_bytes())==v['source_sha']
             b=v['prefix'].encode()+original.read_bytes()+v['suffix'].encode()
            else:b=v['text'].encode()
           else:
            assert sha(p.read_bytes())==v['old']==m[n]
            lines=p.read_text().splitlines(keepends=True)
            for i,j,t in reversed(v['edits']):lines[i:j]=[t]
            b=''.join(lines).encode()
           assert sha(b)==v['new'];p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b);m[n]=v['new']
          (s/'source_manifest.json').write_text(json.dumps(m,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          fs=disk();assert len(fs)==646 and set(fs)==set(m)|{'source_manifest.json'}
          assert all(sha(fs[n].read_bytes())==h for n,h in m.items())
          assert tree(fs)=='bfb7b2a6f69a343dd1af1503fc9fdd98551e955a07eafc8e3c94981b3ebe3c21'
          Path('R834Proof/SOURCE_TREE_SHA256.txt').write_text(tree(fs)+'\n')
          print('R852_SOURCE_646_VERIFIED',tree(fs))
          PYCODE
          python3 pinned-r793/source/tools/r852_preflight_wiring.py
      - name: Full 669 Swift regressions raw buffer latency and production archive readback
        if: matrix.lane == 'real-apple-vision'
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e 'puts YAML.load_file(ARGV[0]).fetch("jobs").fetch("verify").fetch("steps").fetch(8).fetch("run").gsub("652 tests","669 tests")' pinned-r845/.github/workflows/r845.yml > "$RUNNER_TEMP/r852_swift.sh"
          bash "$RUNNER_TEMP/r852_swift.sh"
          
          grep -F "R852_CVPIXELBUFFER_PNG_FSYNC_PIXEL_OCR_STATE_MAIN_MS" R834Proof/Swift.log
          grep -F "R852_31_RETAINED_FRAMES_RELAUNCH_ZIP_READBACK_NO_OCR_PASS" R834Proof/Swift.log
      - name: iPhoneOS production build version 852 NO IPA
        if: matrix.lane == 'iphoneos-compile'
        shell: bash
        run: |
          set -euo pipefail
          python3 pinned-r793/source/tools/generate_xcode_project.py
          xcodebuild -project pinned-r793/source/app/ios/ChampionsOnDeviceResearch.xcodeproj -scheme ChampionsOnDeviceResearch -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO -derivedDataPath "$RUNNER_TEMP/r852_device" build > R834Proof/iPhoneOS.log 2>&1 || { grep -E 'error:|BUILD FAILED' R834Proof/iPhoneOS.log; exit 1; }
          grep -F 'BUILD SUCCEEDED' R834Proof/iPhoneOS.log
          python3 - <<'PY'
          import plistlib,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'r852_device/Build/Products/Debug-iphoneos/ChampionsOnDeviceResearch.app/Info.plist'
          d=plistlib.loads(p.read_bytes());assert d['CFBundleVersion']=='852' and d['CFBundleShortVersionString']=='0.8.52'
          print('R852_BUILT_IDENTITY_VERIFIED',d['CFBundleVersion'],d['CFBundleShortVersionString'])
          PY
      - name: Scope and source receipt
        if: always()
        shell: bash
        run: |
          if [ -f R834Proof/SOURCE_TREE_SHA256.txt ]; then cat R834Proof/SOURCE_TREE_SHA256.txt; fi
          echo 'NO IPA until both lanes pass. Actual iPhone continuity and LCD latency remain unverified.' >> "$GITHUB_STEP_SUMMARY"
