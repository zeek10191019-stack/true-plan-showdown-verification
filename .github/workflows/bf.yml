name: R610 Auto - Cross Validate Archived PNG, OCR And HUD Proximity (No IPA)
"on":
  push:
    branches: [main]
    paths: [.github/workflows/bf.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trueplan-r610-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
      && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 55
    env:
      PYTHONOPTIMIZE: "0"
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
    steps:
      - name: Restore SHA pinned R609 plus R610 source and exact production ZIP seam
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'R610_REPLAY'
          import hashlib,base64,lzma,urllib.request,textwrap
          from pathlib import Path
          url=(
            'https://raw.githubusercontent.com/'
            'zeek10191019-stack/true-plan-showdown-verification/'
            '4557c61580c2693620709cfaee6ca5df6653a35f/'
            '.github/workflows/be.yml'
          )
          raw=urllib.request.urlopen(url,timeout=90).read()
          assert len(raw)==14435,'R609_PARENT_SIZE_DRIFT'
          assert hashlib.sha256(raw).hexdigest() == (
              'bb1a81d260c3452037bea4ca328568ccec35b8f314611108b83975b0ebf574bf'
          ),'R609_PARENT_HASH_DRIFT'
          source=raw.decode('utf-8')
          begin="          python3 - <<'R609_REPLAY'\n"
          end="\n          R609_REPLAY"
          assert source.count(begin)==1 and source.count(end)==1,'R609_REPLAY_MARKER_DRIFT'
          code=textwrap.dedent(source.split(begin,1)[1].split(end,1)[0])
          exec(compile(code,'PINNED_R609_REPLAY','exec'),{'__name__':'__main__'})
