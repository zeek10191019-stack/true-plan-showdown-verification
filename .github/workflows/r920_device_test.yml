          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREFLIGHT_RUN" > "$RUNNER_TEMP/r920-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREFLIGHT_RUN/jobs" > "$RUNNER_TEMP/r920-jobs.json"
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          temp=Path(os.environ['RUNNER_TEMP'])
          run=json.loads((temp/'r920-run.json').read_text())
          jobs=json.loads((temp/'r920-jobs.json').read_text())['jobs']
          sha=os.environ['SOURCE_COMMIT']
          assert run['head_sha']==sha and run['head_branch']=='r905-preflight'
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['path']=='.github/workflows/r920.yml'
          assert len(jobs)==3 and all(job['head_sha']==sha and job['conclusion']=='success' for job in jobs)
          assert {job['name'] for job in jobs}=={'R920 full','R920 replay','R920 iphoneos'}
          print('R920_PINNED_PREFLIGHT_PASS',run['id'],sha)
