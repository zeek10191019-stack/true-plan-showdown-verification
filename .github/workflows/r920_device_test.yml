      - name: Restore and build the exact source that passed preflight
        shell: bash
        run: |
          set -euo pipefail
          for name in 'Restore the exact R918 tree and apply the bounded R919 patch' 'Decode the R920 source patch' 'Apply R920 changes and verify every source file' 'Build the iPhoneOS arm64 production target'; do
            ruby -ryaml -e 'steps=YAML.load_file(ARGV[0]).fetch("jobs").fetch("preflight").fetch("steps"); puts steps.find { |step| step["name"] == ARGV[1] }.fetch("run")' pinned-r920/.github/workflows/r920.yml "$name" > "$RUNNER_TEMP/r920-pinned-build.sh"
            bash "$RUNNER_TEMP/r920-pinned-build.sh"
            expected='1973d7f185fcfb0305318c846c83801e48e3c2a3feedb21fc2cc70269cb49ec8'
            case "$name" in
              'Restore the exact R918 tree and apply the bounded R919 patch'|'Decode the R920 source patch') expected='aa14b3d45738fc31a1b2836cf46f9602ae19466870c2b9a71b2e833d49050237';;
            esac
            test "$(cat R834Proof/SOURCE_TREE_SHA256.txt)" = "$expected"
          done
      - name: Audit and publish unsigned device test IPA
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p R920Delivery
          R920_APP="$RUNNER_TEMP/r920_device/Build/Products/Release-iphoneos/ChampionsOnDeviceResearch.app"
          export R920_APP
          lipo -archs "$R920_APP/ChampionsOnDeviceResearch" > R920Delivery/architectures.txt
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,plistlib,os
          s=Path('pinned-r793/source');m=json.loads((s/'source_manifest.json').read_text());sha=lambda b:hashlib.sha256(b).hexdigest()
          # The project file is derived by the exact verified generator. All other verified
          # source inputs must remain byte-identical through the native build.
          derived='app/ios/ChampionsOnDeviceResearch.xcodeproj/project.pbxproj'
          assert all(sha((s/n).read_bytes())==h for n,h in m.items() if n!=derived)
          app=Path(os.environ['R920_APP']);d=plistlib.loads((app/'Info.plist').read_bytes())
          assert d['CFBundleVersion']=='920' and d['CFBundleShortVersionString']=='0.9.20'
          assert d['CFBundleIdentifier']=='com.zeek10191019.championsresearch' and d['MinimumOSVersion']=='27.0'
          assert d['NSLocalNetworkUsageDescription'] and 'screen-capture' in d['UIBackgroundModes']
          assert Path('R920Delivery/architectures.txt').read_text().strip()=='arm64'
          # Debug builds may use a small launcher plus NAME.debug.dylib; inspect both
          # native images and every packaged app member, never infer code from file size.
          import struct,subprocess
          exe=app/'ChampionsOnDeviceResearch';images=[exe]+sorted(app.glob('*.dylib'))
          for image in images:
           b=image.read_bytes();assert len(b)>=32 and image.stat().st_mode & 0o111
           magic,cpu,subtype,kind,ncmds,cmdbytes,flags,reserved=struct.unpack('<8I',b[:32])
           assert magic==0xfeedfacf and cpu==0x0100000c
           assert kind==(2 if image==exe else 6)
           pos=32;platforms=[]
           for _ in range(ncmds):
            cmd,size=struct.unpack_from('<2I',b,pos);assert size>=8 and pos+size<=len(b)
            assert cmd!=0x1d, f"Unexpected code signature in {image.name}"
            if cmd==0x32:platforms.append(struct.unpack_from('<I',b,pos+8)[0])
            pos+=size
           assert pos==32+cmdbytes and platforms==[2]
           assert subprocess.check_output(['lipo','-archs',str(image)],text=True).strip()=='arm64'
           print('R920_NATIVE_IMAGE_VERIFIED',image.name,len(b),kind,platforms)
          if exe.stat().st_size<100000:
           debug=app/'ChampionsOnDeviceResearch.debug.dylib'
           assert debug in images and debug.stat().st_size>100000
           assert debug.name in subprocess.check_output(['otool','-L',str(exe)],text=True)
          assert d['DTPlatformName']=='iphoneos'
          members={str(p.relative_to(app)):{'bytes':p.stat().st_size,'sha256':sha(p.read_bytes())} for p in sorted(app.rglob('*')) if p.is_file()}
          Path('R920Delivery/app_members.json').write_text(json.dumps(members,sort_keys=True,indent=2)+'\n')
          assert list(app.glob('*.xcprivacy'))
          Path('R920Delivery/generated_project_sha256.txt').write_text(sha((s/derived).read_bytes())+'\n')
          print('R920_BUILT_APP_IDENTITY_INPUTS_ARM64_PRIVACY_VERIFIED',d['CFBundleVersion'],d['CFBundleIdentifier'])
          PY
          mkdir -p "$RUNNER_TEMP/r920_payload/Payload"
          ditto "$R920_APP" "$RUNNER_TEMP/r920_payload/Payload/ChampionsOnDeviceResearch.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/r920_payload/Payload" R920Delivery/R920_Unsigned_DeviceTest.ipa
          python3 - <<'PY'
          from pathlib import Path
          import json,zipfile,hashlib,plistlib,os,datetime,base64,lzma
          out=Path('R920Delivery');ipa=out/'R920_Unsigned_DeviceTest.ipa';sha=lambda b:hashlib.sha256(b).hexdigest();app=Path(os.environ['R920_APP'])
          assert 100000<ipa.stat().st_size<300000000
          with zipfile.ZipFile(ipa) as z:
           assert z.testzip() is None
           prefix='Payload/ChampionsOnDeviceResearch.app/'
           assert all(not n.startswith('/') and '..' not in Path(n).parts for n in z.namelist())
           info=plistlib.loads(z.read(prefix+'Info.plist'));assert info['CFBundleVersion']=='920'
          members=json.loads((out/'app_members.json').read_text())
          with zipfile.ZipFile(ipa) as z:
           actual={entry.filename[len(prefix):] for entry in z.infolist() if not entry.is_dir() and entry.filename.startswith(prefix)}
           assert actual==set(members), (sorted(actual),sorted(members))
           for name,meta in members.items():
            data=z.read(prefix+name);assert len(data)==meta['bytes'] and sha(data)==meta['sha256']
          receipt={
              'schema':'trueplan.device-test-ipa.v1',
              'created_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'version':'0.9.20','build':920,'revision':'R920','diagnostic':'D207',
              'source_commit':os.environ['SOURCE_COMMIT'],'source_files':681,
              'source_tree_sha256':Path('R834Proof/SOURCE_TREE_SHA256.txt').read_text().strip(),
              'ci':os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],
              'preflight_ci':os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['PREFLIGHT_RUN'],
              'focused_vision_ci':os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['FOCUSED_VISION_RUN'],
              'architecture':'arm64','swift_optimization':'-O','configuration':'Release','sdk_platform':'iphoneos','signed_for_installation':False,
              'ipa_filename':ipa.name,'ipa_bytes':ipa.stat().st_size,'ipa_sha256':sha(ipa.read_bytes()),
              'packaged_app_members':len(members),'zip_crc_passed':True,
              'device_accuracy_certified':False,'device_verified_fields':0,
          }
          (out/'VERIFICATION_R920.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          (out/'SHA256SUMS.txt').write_text(receipt['ipa_sha256']+'  '+ipa.name+'\n')
          print('R920_IPA_ARCHIVE_VERIFIED',json.dumps(receipt,sort_keys=True))
          PY
          cat > R920Delivery/DEVICE_TEST_R920.md <<'EOF'
          # R920 iPhone 16 Plus 最終実機試験

          1. PCのiLoaderで未署名IPAを上書き導入し、0.9.20／build920を確認する。既存アプリは削除せず、開始前に前回の証拠が表示できることを確認する。
          2. PCで表示時間を測る場合は、iPhoneとPCを同じWi-Fiに接続し、iPhoneで「PCで表示時間を計測」を押す。表示されたURLをPCのブラウザーに入力して手前に表示する。PCに表示するのはHP・ターンの候補と照合用フレーム番号。試験後に「PC計測を停止」を押す。
          3. iPhone 16 Plusを横向きにして選出前に「画面共有の収集を開始」。選出から対戦終了まで収集し、過去の48.4秒を超えても録画とOCRが継続することを確認する。許可後にゲームへ戻る場面、アプリへの復帰と再度ゲームへ戻る場面、横向きの左右を切り替えた前後を含める。
          4. 対戦中は「様子を見る」で自分と相手のステータス、HP分数・相手HP％・4技とPPを表示する。メガ前後の姿、交代、瀕死、能力変化、状態異常、天候や場の変化、効果発動、アイテムや特性の表示を試験中に発生した分だけ確認する。79項目のうち今回出なかった項目は他の証拠と照合し、出現確認が取れない項目は未検証と記録する。
          5. 実表示の1秒未満を確認するには、別のカメラでiPhoneのゲーム画面とPC表示を同じ映像に収める。HP等が変わった時刻から、対応する値がPCに表示された時刻までをフレーム単位で照合する。ブラウザーの描画確認応答はソフトウェア上の別計測で、実表示には外部映像を使う。1,000msちょうどは期限外。
          6. 「収集終了・全情報を保存」。保存を待ち、共有を一度キャンセルして再度開けることを確認する。新規の画面共有許可をキャンセルした後も、同じ保存済み証拠を再共有できることを確認する。遅着OCRの反映中は前回の証拠を保持する。分割時は各300,000,000バイト未満・最大10パートになり、索引と全パートから完全ZIPを復元できることを確認する。
          7. 照合する証拠は取得原本、フレーム・セッション・元画像のSHA、結果・表示ID、終了理由、失敗・タイムアウト・遅着ログ。PREVIEW・TURNの入力を再構成し、自他・個体・ターンの取り違え、画面に出ていない事実の確定、前対戦の値の再利用がないことを確認する。

          R920は事前検証済みの未署名IPA。iPhone 16 Plus実機の連続取得・表示時間・79項目・共有は、この試験の取得証拠で判定する。
          EOF
          tag=r920-device-test
          readback="$RUNNER_TEMP/r920_release_readback"
          mkdir -p "$readback"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish > R920Delivery/existing.json 2>/dev/null; then
            gh release create "$tag" R920Delivery/R920_Unsigned_DeviceTest.ipa R920Delivery/VERIFICATION_R920.json R920Delivery/SHA256SUMS.txt R920Delivery/DEVICE_TEST_R920.md --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" --title 'R920 iPhone 16 Plus device test 0.9.20' --draft --prerelease --notes-file R920Delivery/DEVICE_TEST_R920.md
          else
            jq -e --arg sha "$SOURCE_COMMIT" '.isDraft and .targetCommitish == $sha' R920Delivery/existing.json > /dev/null
            gh release upload "$tag" R920Delivery/R920_Unsigned_DeviceTest.ipa R920Delivery/VERIFICATION_R920.json R920Delivery/SHA256SUMS.txt R920Delivery/DEVICE_TEST_R920.md --repo "$GITHUB_REPOSITORY" --clobber
          fi
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'R920_Unsigned_DeviceTest.ipa' --dir "$readback"
          export R920_READBACK="$readback/R920_Unsigned_DeviceTest.ipa"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,zipfile
          receipt=json.loads(Path('R920Delivery/VERIFICATION_R920.json').read_text())
          ipa=Path(os.environ['R920_READBACK'])
          assert ipa.stat().st_size==receipt['ipa_bytes']
          assert hashlib.sha256(ipa.read_bytes()).hexdigest()==receipt['ipa_sha256']
          with zipfile.ZipFile(ipa) as archive: assert archive.testzip() is None
          print('R920_RELEASE_IPA_FRESH_DOWNLOAD_SHA_CRC_PASS',ipa.stat().st_size,receipt['ipa_sha256'])
          PY
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          public_readback="$RUNNER_TEMP/r920_published_readback"
          mkdir -p "$public_readback"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --max-time 60 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/R920_Unsigned_DeviceTest.ipa" -o "$public_readback/R920_Unsigned_DeviceTest.ipa"
          cmp "$R920_READBACK" "$public_readback/R920_Unsigned_DeviceTest.ipa"
          echo R920_PUBLISHED_IPA_BYTE_IDENTICAL_TO_SHA_CRC_VERIFIED_READBACK
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > R920Delivery/published_release.json
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          out=Path('R920Delivery')
          release=json.loads((out/'published_release.json').read_text())
          receipt=json.loads((out/'VERIFICATION_R920.json').read_text())
          assert release['draft'] is False and release['prerelease'] is True
          assert release['target_commitish']==os.environ['SOURCE_COMMIT']
          assets={item['name']:item for item in release['assets']}
          assert set(assets)=={'R920_Unsigned_DeviceTest.ipa','VERIFICATION_R920.json','SHA256SUMS.txt','DEVICE_TEST_R920.md'}
          ipa=assets['R920_Unsigned_DeviceTest.ipa']
          assert ipa['state']=='uploaded' and ipa['size']==receipt['ipa_bytes']
          if ipa.get('digest'): assert ipa['digest']=='sha256:'+receipt['ipa_sha256']
          print('R920_PUBLISHED_RELEASE_VERIFIED',release['html_url'])
          print('R920_IPA_DOWNLOAD',ipa['browser_download_url'])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              print('### R920 iPhone 16 Plus unsigned device test',file=summary)
              print(ipa['browser_download_url'],file=summary)
              print(receipt['ipa_sha256'],file=summary)
          PY
