# R727 exact PNG source preservation; based on SHA-frozen R726 self-contained Git blob.
# No checkout, no Drive, no new paid API. Public-only hosted runner is user-triggered.
name: R727 Exact OCR PNG Source Preservation - Not Device Certified
'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/r727_fixed.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r727-source-pinned-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
    - name: Fetch immutable R726 source blob and restore all 291 files
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
       set -euo pipefail
       python3 - <<'PY'
       import pathlib,os,urllib.request,json,base64,hashlib,lzma,re
       repo='zeek10191019-stack/true-plan-showdown-verification'
       blob_sha='ec9de9645aae19aaa6ae8ae1b151809f9aba3e1e'
       url='https://api.github.com/repos/'+repo+'/git/blobs/'+blob_sha
       request=urllib.request.Request(url,headers={
        'Authorization':'Bearer '+os.environ['GH_TOKEN'],
        'Accept':'application/vnd.github+json','User-Agent':'TruePlan-R727-SHA-Pinned'})
       with urllib.request.urlopen(request,timeout=60) as response:doc=json.load(response)
       assert doc.get('sha')==blob_sha and doc.get('encoding')=='base64'
       legacy=base64.b64decode(doc['content'])
       assert len(legacy)==499669,'R726_BLOB_BYTE_COUNT_HOLD'
       assert hashlib.sha1(b'blob '+str(len(legacy)).encode()+b'\0'+legacy).hexdigest()==blob_sha
       text=legacy.decode('utf8')
       m=re.search("packed="+chr(39)*3+r"\s*\n(.*?)\n[ \t]*"+chr(39)*3,text,re.S)
       assert m is not None,'R726_SOURCE_LITERAL_NOT_FOUND'
       blob=''.join(m.group(1).split()).replace('TP726SAFE',chr(36)+chr(123)+chr(123))
       raw=lzma.decompress(base64.b85decode(blob))
       assert hashlib.sha256(raw).hexdigest()=='67fbb3058807f29f867478569532e98540595b11a48924282830fcf18d2c260b'
       original=json.loads(raw)
       assert original['version']=='R726' and len(original['files'])==291
       root=pathlib.Path('R727Source')
       for name,content in original['files'].items():
        path=pathlib.PurePosixPath(name)
        assert not path.is_absolute() and '..' not in path.parts and name==str(path)
        p=root/name;p.parent.mkdir(parents=True,exist_ok=True)
        p.write_text(content,encoding='utf8')
       print('R727_PINNED_R726_SOURCE_291_RECOVERED_SHA_PASS')
       PY
