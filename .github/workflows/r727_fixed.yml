       p=json.loads(raw)
       assert p['version']=='R727' and p['base_sha256']=='67fbb3058807f29f867478569532e98540595b11a48924282830fcf18d2c260b'
       root=pathlib.Path('R727Source')
       assert len(p['base_file_sha256'])==3 and len(p['patch_files'])==6
       for name,sha in p['base_file_sha256'].items():
        assert hashlib.sha256((root/name).read_bytes()).hexdigest()==sha,('BASE_SHA_CHANGED',name)
       for name,content in p['patch_files'].items():
        path=pathlib.PurePosixPath(name)
        assert name==str(path) and '..' not in path.parts and not path.is_absolute()
        file=root/name;file.parent.mkdir(parents=True,exist_ok=True)
        file.write_text(content,encoding='utf8')
       assert len([x for x in root.rglob('*') if x.is_file()])==294
       app=root/'app/ios/ChampionsOnDevice'
       assert len(list(app.glob('*.swift')))==231
       assert 'R727AnalysisPNGPack.append(' in (app/'R710ContinuousRecorder.swift').read_text()
       assert 'appendAnalysisPNG(' in (app/'CaptureCoordinator.swift').read_text()
       assert '<string>727</string>' in (app/'Info.plist').read_text()
       manifest=json.loads((root/'source_manifest.json').read_text())
       assert len(manifest)==271
       allowed={'app/ios/ChampionsOnDevice/CaptureCoordinator.swift',
        'app/ios/ChampionsOnDevice/R710ContinuousRecorder.swift',
        'app/ios/ChampionsOnDevice/Info.plist'}
       for name,sha in manifest.items():
        if name not in allowed:
         assert hashlib.sha256((root/name).read_bytes()).hexdigest()==sha,('R718_REGRESSION',name)
       print('R727_FULL_294_SOURCE_PRESERVATION_AND_HOOK_PASS')
       PY
    - name: Run 63 portable Swift tests and parse 231 app sources
      shell: bash
      run: |
       set -euo pipefail
       mkdir -p R727Artifacts
       (
        cd R727Source/R720_PORTABLE_TESTS
        swift test -j 2 > ../../R727Artifacts/R727_SWIFT_63_TESTS.log 2>&1 || {
         tail -n 100 ../../R727Artifacts/R727_SWIFT_63_TESTS.log;exit 1;
        }
       )
       grep -Fq 'Executed 63 tests, with 0 failures' R727Artifacts/R727_SWIFT_63_TESTS.log
       swiftc -frontend -parse R727Source/app/ios/ChampionsOnDevice/*.swift
       echo R727_SWIFT_63_PASS_231_APP_SWIFT_PARSE_PASS
    - name: Export complete editable 294-file source ZIP
      shell: bash
      run: |
       set -euo pipefail
       python3 - <<'PY'
       import pathlib,hashlib,zipfile,json
       source=pathlib.Path('R727Source');out=pathlib.Path('R727Artifacts');out.mkdir(exist_ok=True)
       files=sorted(x for x in source.rglob('*') if x.is_file() and '.build' not in x.relative_to(source).parts)
       assert len(files)==294,len(files)
       archive=out/'R727_ALL_EDITABLE_SOURCE_RECOVERY.zip'
       with zipfile.ZipFile(archive,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
        for p in files:z.write(p,p.relative_to(source).as_posix())
       with zipfile.ZipFile(archive) as z:assert z.testzip() is None and len(z.namelist())==294
       hashes={p.relative_to(source).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in files}
       (out/'R727_ALL_SOURCE_HASHES.json').write_text(json.dumps(hashes,sort_keys=True,indent=2))
       (out/'R727_SOURCE_RECEIPT.json').write_text(json.dumps({
        'files':294,'swift_app_files':231,'baseline':'R726_CI_SUCCESS',
        'source_zip_bytes':archive.stat().st_size,
        'source_zip_sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),
        'zip_crc':'PASS','device_certified_fields':0,
        'original_png_pack_live_device_test':'NOT_RUN'},indent=2))
       print('R727_EDITABLE_294_SOURCE_ZIP_PASS')
       PY
    - name: Compile and package full unsigned iPhoneOS app
      shell: bash
      run: |
       set -euo pipefail
       python3 R727Source/tools/generate_xcode_project.py
       xcodebuild -project R727Source/app/ios/ChampionsOnDeviceResearch.xcodeproj \
        -scheme ChampionsOnDeviceResearch -configuration Debug \
        -sdk iphoneos -destination 'generic/platform=iOS' \
        ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
        -derivedDataPath "$RUNNER_TEMP/r727-derived" build \
        > R727Artifacts/R727_IPHONEOS_XCODEBUILD.log 2>&1 || {
        grep -E 'error:|BUILD FAILED' R727Artifacts/R727_IPHONEOS_XCODEBUILD.log | tail -n 80 || true
        exit 1
       }
       grep -Fq 'BUILD SUCCEEDED' R727Artifacts/R727_IPHONEOS_XCODEBUILD.log
       python3 - <<'PY'
       import os,pathlib,plistlib,zipfile,json,hashlib
       log=pathlib.Path('R727Artifacts/R727_IPHONEOS_XCODEBUILD.log').read_text(errors='replace')
       for name in ('CaptureCoordinator.swift','R710ContinuousRecorder.swift',
                    'R727AnalysisPNGPack.swift','R726LiveOCRClosure.swift'):
        assert name in log,('NEW_SOURCE_NOT_IN_APP_BUILD',name)
       app=pathlib.Path(os.environ['RUNNER_TEMP'])/'r727-derived/Build/Products/Debug-iphoneos/ChampionsOnDeviceResearch.app'
       assert app.is_dir()
       info=plistlib.loads((app/'Info.plist').read_bytes())
       assert info['CFBundleVersion']=='727' and info['CFBundleShortVersionString']=='0.7.27'
       assert not (app/'embedded.mobileprovision').exists()
       ipa=pathlib.Path('R727Artifacts/R727_Unsigned_Research.ipa')
       with zipfile.ZipFile(ipa,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
        for p in sorted(app.rglob('*')):
         assert not p.is_symlink()
         if p.is_file():z.write(p,arcname='Payload/'+app.name+'/'+p.relative_to(app).as_posix())
       with zipfile.ZipFile(ipa) as z:assert z.testzip() is None
       assert ipa.stat().st_size<9_000_000
       pathlib.Path('R727Artifacts/R727_COMPILE_RECEIPT.json').write_text(json.dumps({
        'iphoneos_unsigned_build':'PASS','build':'727','swift_unit_tests':'63_PASS',
        'source_files':294,'device_certified_fields':0,'live_png_pack_test':'NOT_RUN',
        'movie_frame_alignment_certified':False},indent=2))
       print('R727_FULL_IPHONEOS_COMPILE_PASS_NOT_DEVICE_CERTIFIED')
       PY
    - name: Guard public artifact storage quota
      id: budget
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
       set -euo pipefail
       python3 - <<'PY'
       import pathlib,os,urllib.request,json
       p=pathlib.Path('R727Artifacts');n=sum(x.stat().st_size for x in p.rglob('*') if x.is_file())
       assert 0<n<16_000_000,('ARTIFACT_SIZE_HOLD',n)
       total=0
       for page in range(1,11):
        url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/artifacts?per_page=100&page='+str(page)
        req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
        'Accept':'application/vnd.github+json','User-Agent':'TruePlan-R727-FreeGuard'})
        with urllib.request.urlopen(req,timeout=30) as response:records=json.load(response).get('artifacts',[])
        total+=sum(x['size_in_bytes'] for x in records if not x.get('expired'))
        if len(records)<100:break
       else:raise RuntimeError('ARTIFACT_STORAGE_INVENTORY_INCOMPLETE')
       assert total+n<400_000_000,('FREE_STORAGE_BUDGET_HOLD',total,n)
       with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('allowed=true\n')
       print('R727_STORAGE_PASS',total,n)
       PY
    - uses: actions/upload-artifact@v4
      if: always() && steps.budget.outputs.allowed == 'true'
      with:
        name: R727-source-png-preservation-audit
        path: R727Artifacts/
        if-no-files-found: error
    - name: Certification boundary
      if: always()
      shell: bash
      run: |
       set -euo pipefail
       {
        echo '## R727 original OCR PNG pack - byte replayability only'
        echo 'R726 291-source SHA-pinned Git blob was fetched without repository checkout.'
        echo 'New Vision-input PNG pack is append-only, indexed by epoch/frame and SHA.'
        echo 'Session ZIP adds continuous/ocr_analysis_png.pack and r727_png_pack_audit.json.'
        echo '63 portable Swift tests; complete unsigned iPhoneOS app build tested.'
        echo 'Source PNG archive size may increase; quota failure is visible and fail-closed.'
        echo 'Screen owner, turn, movie alignment, and all 79 fields NOT device certified.'
       } >> "$GITHUB_STEP_SUMMARY"
