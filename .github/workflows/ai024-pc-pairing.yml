        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: .github/workflows/ai024-pc-pairing.yml
      - name: Restore the verified R998 source
        shell: bash
        run: |
          export GH_TOKEN="${{ github.token }}"
          set -euo pipefail
          workflow="$RUNNER_TEMP/r998-base.yml"
          git show "$R998_COMMIT:.github/workflows/r998.yml" > "$workflow"
          [[ "$(git hash-object "$workflow")" == "$R998_WORKFLOW_BLOB" ]]
          ruby -ryaml -e '
            baseline=YAML.load_file(ARGV.fetch(0), aliases: true)
            puts baseline.fetch("jobs").fetch("verify").fetch("steps").find { |s|
              s.fetch("name", "") == "Restore R997 and apply the verified R998 difference"
            }.fetch("run")
          ' "$workflow" > "$RUNNER_TEMP/restore-r998.sh"
          bash "$RUNNER_TEMP/restore-r998.sh"
