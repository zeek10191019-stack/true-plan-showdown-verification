      - name: Recheck capture, archive and Vision
        shell: bash
        run: |
          export GH_TOKEN="${{ github.token }}"
          set -euo pipefail
          tmp="$RUNNER_TEMP/r998"
          for index in 2 3; do
            ruby -ryaml -e '
              doc=YAML.load_file(ARGV[0],aliases:true)
              steps=doc.fetch("jobs").fetch("verify").fetch("steps")
              puts steps.fetch(Integer(ARGV[1])).fetch("run")
            ' "$tmp/r997.yml" "$index" > "$tmp/legacy.sh"
            bash "$tmp/legacy.sh"
          done
      - name: Replay the recorded battle and refresh the legacy PC browser
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/r998"
          src=pinned-r793/source
          app="$src/app/ios/ChampionsOnDevice"
          tests="$src/R720_PORTABLE_TESTS/Tests/R719CoreTests"
          export R997_CAPTURE_FIXTURE="$tmp/capture.json"
          export R997_PP_CROPS="$tmp/pp-crops.json"
          export R997_BROWSER_PACKETS="$tmp/packets.json"
          test_name=R997RecordedBrowserTests.swift
          test ! -e "$tests/$test_name"
          trap 'rm -f "$tests/$test_name"' EXIT
          cp "$tmp/$test_name" "$tests/"
          swift test --package-path "$src/R720_PORTABLE_TESTS" \
            --scratch-path "$RUNNER_TEMP/ai014-swift-tests" --jobs 2 \
            --filter R997RecordedBrowserTests 2>&1 | tee "$tmp/r998.log"
          grep -F "Test Suite 'R997RecordedBrowserTests' passed" "$tmp/r998.log"
          test -s "$R997_BROWSER_PACKETS"
          node "$tmp/browser.cjs" "$app/R920QuickPCDisplay.swift" \
            "$R997_BROWSER_PACKETS"
          swiftc -frontend -parse "$app/CaptureCoordinator.swift" \
            "$app/R987BattleReadout.swift" "$app/R920QuickPCDisplay.swift"
          node "$src/tools/tests/test_r920_pc_display.mjs"
      - name: Verify Swift and Python pairing wire compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/ai024-pairing.swift" <<'PAIRING_TEST'
          from pathlib import Path
          import sys
          swift = Path('pinned-r793/source/app/ios/ChampionsOnDevice/R920QuickPCDisplay.swift').read_text()
          pair = swift[swift.index('private struct R920PCPairing {'):]
          Path(sys.argv[1]).write_text('import Foundation\nimport CryptoKit\nimport Security\n' + pair + r"""
          do {
              let id = "0123456789abcdef0123456789abcdef"
              let endpoint = "192.168.3.2:37255"
              let manual = "7538C06F-ED84-41CE-8B59-C7A03FDACF43"
              let nonce = "e1d2f3d4c5b6a7988a9b0c1d2e3f4567"
              var server = R920PCPairing(device: id, key: Data(repeating: 123, count: 32))
              let path = "/pc-pair/v1/connect/" + nonce + "/"
                         + "8bd46e155d8e81aa91c41da314cb386e6fa8f3e5084b47b15e179b608d24eddd"
              let wrong = server.response(path: path[...], endpoint: "192.168.3.3:37255", manualToken: manual)
              precondition(wrong == nil, "proof must bind the iPhone endpoint")
              let result = server.response(path: path[...], endpoint: endpoint, manualToken: manual)!
              let output: [String: String] = ["body": String(decoding: result, as: UTF8.self),
                                               "token": server.displayToken!]
              print(String(decoding: try JSONSerialization.data(withJSONObject: output), as: UTF8.self))
          }
          """)
          PAIRING_TEST
          swift "$RUNNER_TEMP/ai024-pairing.swift" > "$RUNNER_TEMP/ai024-pairing.json"
          python3 - "$RUNNER_TEMP/ai024-pairing.json" <<'CHECK_PAIRING'
          import hmac, json, sys, uuid
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_bytes())
          body = json.loads(result['body'])
          device = '0123456789abcdef0123456789abcdef'
          key = bytes([123]) * 32
          def mac(*parts):
              return hmac.digest(key, '\n'.join(('champions-pc-pair-v1', *parts)).encode('ascii'), 'sha256')
          assert body['device'] == device
          assert hmac.compare_digest(body['proof'], mac('connect-response', device,
              'e1d2f3d4c5b6a7988a9b0c1d2e3f4567', '192.168.3.2:37255', body['generation']).hex())
          assert result['token'] == str(uuid.UUID(bytes=mac('read', body['generation'])[:16], version=4)).upper()
          print("AI024_SWIFT_PAIRING_WIRE_PASSED")
          CHECK_PAIRING
      - name: Build and inspect the arm64 iPhone IPA
        shell: bash
        run: |
          test "$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)" = 27
          set -euo pipefail
          root="$PWD/pinned-r793/source"
          build="$RUNNER_TEMP/ai014-build"
          package="$RUNNER_TEMP/ai014-package"
          python3 - "$root" <<'VERIFY_SOURCE'
          import hashlib,json,sys
          from pathlib import Path

          root=Path(sys.argv[1])
          manifest=root/'source_manifest.json'
          files={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file() and p!=manifest}
          assert files==json.loads(manifest.read_bytes()), 'source modified after verification'
          VERIFY_SOURCE
          xcodebuild -project "$root/app/ios/ChampionsOnDeviceResearch.xcodeproj" \
            -scheme ChampionsOnDeviceResearch -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath "$build" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build 2>&1 |
            tee "$RUNNER_TEMP/ai014-native.log"
          grep -F 'BUILD SUCCEEDED' "$RUNNER_TEMP/ai014-native.log"
          app="$build/Build/Products/Release-iphoneos/ChampionsOnDeviceResearch.app"
          mkdir -p "$package/Payload" "$package/readback"
          ditto "$app" "$package/Payload/ChampionsOnDeviceResearch.app"
          cd "$package"
          zip -qry R999_AI024_Unsigned_DeviceTest.ipa Payload
          python3 - "$root/source_manifest.json" <<'PY'
          import hashlib, json, os, plistlib, struct, sys, zipfile
          from pathlib import Path

          app=Path('Payload/ChampionsOnDeviceResearch.app')
          plen=app/'Info.plist'
          params=plistlib.loads(plen.read_bytes())
          assert (params['TPIntegrationBuild'],params['CFBundleIdentifier'],params['CFBundleVersion'],
                  params['CFBundleShortVersionString'],params['MinimumOSVersion'],params['DTPlatformName'])==(
                  'AI014','com.zeek10191019.championsresearch','999','0.9.99','27.0','iphoneos')
          assert params['NSLocalNetworkUsageDescription'] and 'screen-capture' in params['UIBackgroundModes']
          assert params['NSBonjourServices'] == ['_champions-pc._tcp']
          assert not (app/'embedded.mobileprovision').exists() and not (app/'_CodeSignature').exists()
          for binary in [app/params['CFBundleExecutable'], *app.glob('*.dylib')]:
              data=binary.read_bytes()
              magic,cpu,_,kind,commands,command_bytes,*_=struct.unpack_from('<8I',data)
              assert magic==0xfeedfacf and cpu==0x0100000c and kind in (2,6),binary
              offset,platforms=32,[]
              for _ in range(commands):
                  command,size=struct.unpack_from('<2I',data,offset)
                  assert size>=8 and offset+size<=len(data) and command!=29,binary
                  if command==50:
                      platforms.append(struct.unpack_from('<I',data,offset+8)[0])
                  offset+=size
              assert offset==32+command_bytes and platforms==[2],binary

          ipa=Path('R999_AI024_Unsigned_DeviceTest.ipa')
          with zipfile.ZipFile(ipa) as z:
              assert z.testzip() is None
              members=[i.filename for i in z.infolist() if not i.is_dir()]
              expected={str(p):p for p in app.rglob('*') if p.is_file()}
              assert len(members)==len(expected) and set(members)==set(expected)
              assert all(z.read(name)==p.read_bytes() for name,p in expected.items())
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          record={'integration':'AI014','app_build':999,'app_version':'0.9.99','signed':False,
                  'native_build':'PASS','apple_regression':'PASS','physical_retest':'PENDING',
                  'ipa':{'name':ipa.name,'bytes':ipa.stat().st_size,'sha256':sha(ipa)},
                  'source_manifest_sha256':sha(Path(sys.argv[1])),'base_sha':os.environ['R998_COMMIT'],
                  'workflow_commit':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID'])}
          Path('VERIFICATION_R999_IPA.json').write_text(json.dumps(record,indent=2)+'\n')
          print('AI024_R999_UNSIGNED_IPA_VERIFIED',record)
          PY
      - name: Publish and independently download the tested unsigned IPA
        shell: bash
        run: |
          export GH_TOKEN="${{ github.token }}"
          set -euo pipefail
          cd "$RUNNER_TEMP/ai014-package"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish |
              jq -e --arg sha "$GITHUB_SHA" '.isDraft and .targetCommitish == $sha'
            gh release upload "$RELEASE_TAG" R999_AI024_Unsigned_DeviceTest.ipa VERIFICATION_R999_IPA.json \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" R999_AI024_Unsigned_DeviceTest.ipa VERIFICATION_R999_IPA.json \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease \
              --title 'R999 AI024 iPhone・Lenovo自動接続 実機試験' --notes 'iPhoneOS 27以降・arm64用の未署名IPA。AI024 Lenovo版のペア登録に対応。実機接続試験は未実施です。'
          fi
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir readback
          for name in R999_AI024_Unsigned_DeviceTest.ipa VERIFICATION_R999_IPA.json; do
            cmp "$name" "readback/$name"
          done
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          for name in R999_AI024_Unsigned_DeviceTest.ipa VERIFICATION_R999_IPA.json; do
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$name"
            curl -fsSL --retry 4 --retry-all-errors "$url" -o "readback/public-$name"
            cmp "$name" "readback/public-$name"
            printf 'R999_PUBLIC_READBACK_VERIFIED %s\n' "$url"
          done
