      - name: Local contract tests native build and regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=.
          python3 -m unittest discover -s tests -p 'test_r602_patch.py' -v
          swiftc -frontend -parse app/ios/ChampionsOnDevice/*.swift
          swiftc -parse-as-library \
            app/ios/ChampionsOnDevice/R596FormCatalog.swift \
            app/ios/ChampionsOnDevice/R597FormEvidenceBridge.swift \
            app/ios/ChampionsOnDevice/R598OneButtonFormAttachment.swift \
            app/ios/ChampionsOnDevice/R599BoundOneButton.swift \
            app/ios/ChampionsOnDevice/R600CollectorHandshake.swift \
            app/ios/ChampionsOnDevice/R602OneTapFormArchive.swift \
            tests/R602OneTapFormArchiveHarness.swift \
            -o "$RUNNER_TEMP/r602"
          "$RUNNER_TEMP/r602"
          python3 -m unittest discover -s tests -p 'test_r600_*.py' -v
          python3 - <<'R602_REGRESS'
          import subprocess
          from pathlib import Path
          source = Path('app/ios/ChampionsOnDevice')
          names = [
              'R596FormCatalog.swift',
              'R597FormEvidenceBridge.swift',
              'R598OneButtonFormAttachment.swift',
              'R599BoundOneButton.swift',
              'R600CollectorHandshake.swift',
          ]
          for i,n in enumerate(range(596,601),1):
              harness = Path('tests') / ('R' + str(n) + {
                  596: 'FormCatalogHarness.swift',
                  597: 'FormEvidenceBridgeHarness.swift',
                  598: 'OneButtonFormAttachmentHarness.swift',
                  599: 'BoundOneButtonHarness.swift',
                  600: 'CollectorHandshakeHarness.swift',
              }[n])
              executable = Path('/tmp') / ('r602_old_' + str(n))
              inputs = [str(source / name) for name in names[:i]]
              subprocess.run(
                  ['swiftc','-parse-as-library'] + inputs +
                  [str(harness),'-o',str(executable)],check=True
              )
              subprocess.run([str(executable)],check=True)
          print('R602_R596_TO_R600_INDEPENDENT_SWIFT_REGRESSIONS_PASS')
          R602_REGRESS
          python3 - <<'R602_PYREG'
          import subprocess
          for pattern in (
              'test_r596_catalog_import.py',
              'test_r597_catalog_audit.py',
              'test_r598_research_audit.py',
              'test_r599_source_audit.py',
          ):
              subprocess.run([
                  'python3','-m','unittest','discover',
                  '-s','tests','-p',pattern,'-v'
              ], check=True)
          R602_PYREG
          python3 tools/run_r571_native.py || {
            for f in reports/xcode_iphoneos_build.log \
                     reports/r574_png_replay_compile.log; do
              test ! -f "$f" || grep -nE 'error:|BUILD FAILED' "$f" | tail -n 60 || true
            done
            exit 1
          }
          echo 'R602_CALLSITE_PATCHED_NOT_LIVE_CERTIFIED'
