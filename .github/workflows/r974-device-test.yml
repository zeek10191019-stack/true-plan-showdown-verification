    - name: Replay retained Apple Vision images
      shell: bash
      run: |
        set -euo pipefail
        ruby -ryaml -e '
          steps = YAML.load_file(ARGV.fetch(0), aliases: true).fetch("jobs").fetch(ARGV.fetch(1)).fetch("steps")
          puts steps.find { |step| step["name"] == ARGV.fetch(2) }.fetch("run")
        ' "$RUNNER_TEMP/r972.yml" vision 'Replay the retained image fixtures' > "$RUNNER_TEMP/r973-vision.sh"
        bash "$RUNNER_TEMP/r973-vision.sh"
