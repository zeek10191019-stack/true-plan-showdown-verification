    - name: Inspect and package the unsigned IPA
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/r974-ipa/Payload"
        tar -xzf "$RUNNER_TEMP/r974-verified-app/r974-verified-app.tar.gz" -C "$RUNNER_TEMP/r974-ipa/Payload/"
        cd "$RUNNER_TEMP/r974-ipa"
        zip -qry "$GITHUB_WORKSPACE/R974Delivery/R974_Unsigned_DeviceTest.ipa" Payload
        python3 - <<'IPA'
        import hashlib, json, os, plistlib, struct, zipfile
        from pathlib import Path

        app = Path("Payload/ChampionsOnDeviceResearch.app")
        out = Path(os.environ["GITHUB_WORKSPACE"]) / "R974Delivery"
        ipa = out / "R974_Unsigned_DeviceTest.ipa"
        with zipfile.ZipFile(ipa) as archive:
            assert archive.testzip() is None
            names = [entry.filename for entry in archive.infolist() if not entry.is_dir()]
            expected = {path.as_posix(): path for path in app.rglob("*") if path.is_file()}
            assert len(names) == len(set(names)) and set(names) == set(expected)
            assert all(archive.read(name) == path.read_bytes() for name, path in expected.items())
            info = plistlib.loads(archive.read((app / "Info.plist").as_posix()))
        assert (info["CFBundleShortVersionString"], info["CFBundleVersion"],
                info["MinimumOSVersion"], info["DTPlatformName"]) == ("0.9.74", "974", "27.0", "iphoneos")
        assert info["CFBundleIdentifier"] == "com.zeek10191019.championsresearch"
        assert info["NSLocalNetworkUsageDescription"] and "screen-capture" in info["UIBackgroundModes"]
        for binary in [app / info["CFBundleExecutable"], *app.glob("*.dylib")]:
            data = binary.read_bytes()
            magic, cpu, subtype, kind, commands, command_bytes, *_ = struct.unpack_from("<8I", data)
            assert magic == 0xfeedfacf and cpu == 0x0100000c and kind in (2, 6)
            offset, platforms = 32, []
            for _ in range(commands):
                cmd, size = struct.unpack_from("<II", data, offset)
                assert size >= 8 and offset + size <= len(data) and cmd != 29
                if cmd == 50:
                    platforms.append(struct.unpack_from("<I", data, offset + 8)[0])
                offset += size
            assert offset == 32 + command_bytes and platforms == [2]
        assets = {
            file.name: {"bytes": file.stat().st_size, "sha256": hashlib.sha256(file.read_bytes()).hexdigest()}
            for file in (ipa, out / "R974_PC_Capture_Tools.zip",
                         out / "R974_T023_CAPTURE_COMPATIBILITY.patch", out / "restore_capture.py")
        }
        report = {
            "build": 974, "version": "0.9.74", "signed": False, "assets": assets,
            "source_tree_sha256": "0055b5d2cfab02f07c38ff149bb7238bfc88b3b0bbd941282510013347948bdc",
            "source_workflow_commit": os.environ["GITHUB_SHA"],
            "passed_source_run": int(os.environ["GITHUB_RUN_ID"]), "packaging_run": int(os.environ["GITHUB_RUN_ID"]),
            "packaging_commit": os.environ["GITHUB_SHA"],
            "device_certified_fields": 0, "r974_physical_end_to_end_status": "UNVERIFIED",
        }
        (out / "VERIFICATION_R974.json").write_text(json.dumps(report, indent=2) + "\n")
        print("R974_IPA_VERIFIED", json.dumps(report))
        IPA
    - uses: actions/upload-artifact@v4
      with:
        name: r974-device-test
        path: R974Delivery/*
        if-no-files-found: error
        retention-days: 2
  publish:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && !github.event.repository.private && github.ref
      == 'refs/heads/r938-export-recovery'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: r974-device-test
        path: R974Delivery
    - name: Publish a prerequisite-checked test release and verify all public downloads
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        cd R974Delivery
        python3 - <<'VERIFY'
        import hashlib, json, os
        from pathlib import Path

        report = json.loads(Path("VERIFICATION_R974.json").read_text())
        assert report["build"] == 974 and report["signed"] is False
        assert report["packaging_commit"] == os.environ["GITHUB_SHA"]
        assert report["packaging_run"] == int(os.environ["GITHUB_RUN_ID"])
        names = {"R974_Unsigned_DeviceTest.ipa", "R974_PC_Capture_Tools.zip", "R974_T023_CAPTURE_COMPATIBILITY.patch", "restore_capture.py"}
        assert set(report["assets"]) == names
        for name, expected in report["assets"].items():
            payload = Path(name).read_bytes()
            assert len(payload) == expected["bytes"]
            assert hashlib.sha256(payload).hexdigest() == expected["sha256"]
        VERIFY
        tag=r974-unsigned-device-test
        assets=(R974_Unsigned_DeviceTest.ipa R974_PC_Capture_Tools.zip R974_T023_CAPTURE_COMPATIBILITY.patch restore_capture.py VERIFICATION_R974.json)
        if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish > "$RUNNER_TEMP/release.json" 2>/dev/null; then
          jq -e --arg commit "$GITHUB_SHA" '.isDraft and .targetCommitish == $commit' "$RUNNER_TEMP/release.json"
          gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
        else
          gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease \
            --title 'R974 iPhone実機試験 0.9.74' \
            --notes '未署名IPA。バックグラウンド期限と保存完了の競合を修正。PCツールは診断ログ末尾が欠けても完全な記録を集計。実機での録画保存・再共有、PC表示と79項目の認証は未完了。'
        fi
        mkdir draft-readback public-readback
        for asset in "${assets[@]}"; do
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir draft-readback
          cmp "$asset" "draft-readback/$asset"
        done
        gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
        for asset in "${assets[@]}"; do
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/$asset"
          curl --fail -sSL --retry 4 --retry-all-errors "$url" -o "public-readback/$asset"
          cmp "$asset" "public-readback/$asset"
          printf 'R974_PUBLIC_READBACK_VERIFIED %s\n' "$url"
        done
