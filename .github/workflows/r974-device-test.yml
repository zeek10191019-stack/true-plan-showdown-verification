name: R974 Verify and publish the iPhone device test
'on':
  push:
    branches:
    - r938-export-recovery
    paths:
    - .github/workflows/r974-device-test.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: r974-device-release
  cancel-in-progress: false
