name: R1043 C43 secure PC launcher and explicit pair approval with C42 regressions (NO IPA)
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/c43.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    name: ${{ matrix.job }}
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
        - job: macos-source
          os: xcode-27
        - job: windows-cli
          os: windows-2025
        - job: windows-receiver
          os: windows-2025
        - job: macos-sender
          os: xcode-27
        - job: windows-hud
          os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
    - name: Run pinned C38 and C39 HTTP and cancellation regression
      shell: bash
      env:
        C33_JOB: ${{ matrix.job }}
        GH_TOKEN: ${{ github.token }}
        PYTHONUTF8: '1'
      run: |
        set -Eeuo pipefail
        if [[ "$RUNNER_OS" == Windows ]]; then PY=python; else PY=python3; fi
        "$PY" - <<'C39_PY'
        import hashlib,urllib.request,pathlib,os,base64,zlib
        url='https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/85c100b1f00de1ee834e70523f727bb707ea6ec9/.github/workflows/c38.yml'
        with urllib.request.urlopen(url,timeout=60) as r: raw=r.read(50000)
        assert hashlib.sha256(raw).hexdigest()=='053484efd027e24f9f38543e3380ca67fa3df21edfb99ca7b22abf8fa7e77670'
        body=raw.decode().split("        \"$PY\" - <<'C38_PY'\n",1)[1].split('\n        C38_PY',1)[0]
        code='\n'.join(l[8:] for l in body.splitlines())+'\n'
        assert hashlib.sha256(code.encode()).hexdigest()=='0dbdaba92e7dae347775ce89aebdab896c27ce8dfbb5e8b40c1b9027d26001b6'
        patch=zlib.decompress(base64.b64decode(''));assert hashlib.sha256(patch).hexdigest()=='93d5ea0c1fbecc9f23368dffc3a19f259d61e3c2c3b0bcf86c0c28e4b838141e'
        (pathlib.Path(os.environ['RUNNER_TEMP'])/'c39_patch.py').write_bytes(patch)
        cancel=zlib.decompress(base64.b64decode(''));assert hashlib.sha256(cancel).hexdigest()=='4f3e2af5efcb6f71fc548ac31882655bf4236c903ec56995b259af0b3ec02243'
        (pathlib.Path(os.environ['RUNNER_TEMP'])/'c39_cancel_patch.py').write_bytes(cancel)
        marker="exec(compile(code,'pinned-c37-bootstrap','exec'))";assert code.count(marker)==1
        code=code.replace(marker,'anchor="exec(compile(code,\'pinned-c35-bootstrap\',\'exec\'))";assert code.count(anchor)==1\ncode=code.replace(anchor,\'marker="runner=tmp/\\\'c35-runner.py\\\'";assert code.count(marker)==1\\ncode=code.replace(marker,\\\'anchor="    f=root/(\\\\\\\'c33-step-\\\\\\\'";assert code.count(anchor)==1\\\\ncode=code.replace(anchor,\\\\\\\'    if job in (\\\\\\\\\\\\\\\'windows-receiver\\\\\\\\\\\\\\\',\\\\\\\\\\\\\\\'macos-sender\\\\\\\\\\\\\\\') and i==0:\\\\\\\\n        mark=(\\\\\\\\\\\\\\\'python\\\\\\\\\\\\\\\' if shell==\\\\\\\\\\\\\\\'pwsh\\\\\\\\\\\\\\\' else \\\\\\\\\\\\\\\'python3\\\\\\\\\\\\\\\')+\\\\\\\\\\\\\\\' -m unittest -v test_transfer_receiver test_recover_r714 test_resume_r714 test_finalize test_c32 test_c33\\\\\\\\\\\\\\\'\\\\\\\\n        assert run.count(mark)==1\\\\\\\\n        prefix="& python (Join-Path $env:RUNNER_TEMP \\\\\\\\\\\\\\\'c39_patch.py\\\\\\\\\\\\\\\')\\\\\\\\\\\\\\\\nif ($LASTEXITCODE -ne 0) { throw \\\\\\\\\\\\\\\'C39_CONNECTION_REGRESSION_FAILED\\\\\\\\\\\\\\\' }\\\\\\\\\\\\\\\\n" if shell==\\\\\\\\\\\\\\\'pwsh\\\\\\\\\\\\\\\' else \\\\\\\\\\\\\\\'python3 "$RUNNER_TEMP/c39_patch.py"\\\\\\\\\\\\\\\\n\\\\\\\\\\\\\\\'\\\\\\\\n        run=run.replace(mark,prefix+mark)\\\\\\\\n\\\\\\\'+anchor)\\\\n\\\'+marker)\\nf=pathlib.Path(os.environ[\\\'RUNNER_TEMP\\\'])/\\\'c37.py\\\'\\ncombined=f.read_bytes();assert combined==patch+extra38\\ntext=extra38.decode();mark=\\\'assert all(h(newfiles[n])==v[1] for n,v in encoded.items())\\\';assert text.count(mark)==1\\ninjection="\\\\nif mode==\\\'sender\\\':\\\\n    ns={}\\\\n    exec(compile((pathlib.Path(os.environ[\\\'RUNNER_TEMP\\\'])/\\\'c39_cancel_patch.py\\\').read_bytes(),\\\'c39-cancel-patch\\\',\\\'exec\\\'),ns)\\\\n    ns[\\\'apply_files\\\'](newfiles)"\\ntext=text.replace(mark,mark+injection);compile(text,\\\'c39-c38-helper\\\',\\\'exec\\\')\\nf.write_bytes(patch+text.encode())\\n\'+anchor)\n'+marker)
        exec(compile(code,'pinned-c38-bootstrap','exec'))
        C39_PY
    - name: C40 durable background journal and process recovery; no device claim
      if: matrix.job == 'macos-sender'
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 - <<'C40_PY'
        import base64,hashlib,pathlib,zlib,os,subprocess,sys
        root=pathlib.Path(os.environ['RUNNER_TEMP'])/'c40-journal'
        root.mkdir(exist_ok=False)
        encoded={'R1040BackgroundJournal.swift': ('', '096b740f3b6112d0133cd535d03c46c5f78b479762dea9323f14932577743179'), 'journal_probe.swift': ('', 'ee91daffb10db04576a5e5e78bf02eb089973310298c9285203368e93ca8d5c3'), 'journal_crash_probe.swift': ('', 'cd32a99def7ae0c1bca3567729060d0d3cb14ca9b4b09e137ad612774de48cd5'), 'run_c40_tests.py': ('', '1e9f5b596903b59bb9feb586eb2b6510fc140995761e55e29b8f0d3cd409fece')}
        for name,(payload,digest) in encoded.items():
            assert pathlib.PurePosixPath(name).name==name
            data=zlib.decompress(base64.b64decode(payload))
            assert hashlib.sha256(data).hexdigest()==digest,name
            (root/name).write_bytes(data)
        subprocess.run([sys.executable,str(root/'run_c40_tests.py')],check=True)
        C40_PY
    - name: C41 HTTPS adapter, mock peer recovery and iPhoneOS typecheck (experimental)
      if: matrix.job == 'macos-sender'
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 - <<'C41_PY'
        import base64,hashlib,pathlib,zlib,os,subprocess,sys
        root=pathlib.Path(os.environ['RUNNER_TEMP'])/'c41-adapter'
        root.mkdir(exist_ok=False)
        encoded={'R1040BackgroundJournal.swift': ('', '096b740f3b6112d0133cd535d03c46c5f78b479762dea9323f14932577743179'), 'R1041BackgroundAdapter.swift': ('', '4a97d6b99c61d2fceea3b35a830c34a007a9a315e39a87f058b9c4429b82e861'), 'R1041PairKeychain.swift': ('', '97d389ae47bf3b0d2588440900aeaf06a452caa8a58dcc8e0ad1cd073e08802f'), 'adapter_probe.swift': ('', '475fbea5e2b6f4f3b5e8e2874e92ce260309429dcbcaf3c44ea8a7ab2fe9b3ef'), 'run_c41_tests.py': ('', 'a36f0a5085c924e5c1c643b27244ef346979d863e1afee64994f99f2b94eb667'), 'r1041_tls_receiver.py': ('', '570570486294a0ac57d000855c031d0380b00fd2b6cdc074197572eb8bfbe2a6'), 'tls_probe.py': ('', '733dbd2a21de5de853f4676eebc069dd3c4c7ec1b7ab7ba6e14f7210446a00a8'), 'tls_existing_receiver_probe.py': ('', '0c99be65db4749559427929daf3c3e65bd33a9fb5ef55d86cfdfd5da73345af4')}
        for name,(payload,digest) in encoded.items():
            assert pathlib.PurePosixPath(name).name==name
            data=zlib.decompress(base64.b64decode(payload));assert hashlib.sha256(data).hexdigest()==digest,name
            (root/name).write_bytes(data)
        subprocess.run([sys.executable,str(root/'run_c41_tests.py')],check=True)
        subprocess.run([sys.executable,str(root/'tls_probe.py')],check=True)
        subprocess.run([sys.executable,str(root/'tls_existing_receiver_probe.py'),str(pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'c32-source')],check=True)
        C41_PY
    - name: C42 secure pairing, small and 530MB HTTPS archive recovery with preserved receiver
      if: matrix.job == 'macos-sender' || matrix.job == 'windows-receiver'
      shell: bash
      run: |
        set -Eeuo pipefail
        if [[ "$RUNNER_OS" == Windows ]]; then PY=python; else PY=python3; fi
        "$PY" - <<'C42_PY'
        import base64,hashlib,os,pathlib,subprocess,sys,zlib
        root=pathlib.Path(os.environ['RUNNER_TEMP'])/'c42-pairing'
        root.mkdir(exist_ok=False)
        payload={'r1041_tls_receiver.py': ('', '570570486294a0ac57d000855c031d0380b00fd2b6cdc074197572eb8bfbe2a6'), 'r1042_pairing.py': ('', '752081962ea3c64f3ae15c9d566ec20cf16077eda80f04a5257982ea7a47556e'), 'pair_probe.py': ('', 'e67861331c06008a5448a56969bc8544ac343719087c1e39f1db6adb0da4c03e'), 'tls_archive_probe.py': ('', '49d1adb7d05b0da9006cac16b7221d2b0af7c780e58afd939a900932c2b7f76b'), 'tls_probe.py': ('', '733dbd2a21de5de853f4676eebc069dd3c4c7ec1b7ab7ba6e14f7210446a00a8'), 'large_https_probe.py': ('', '2045cc620a7eef1c444c2c084f0682be8e0e5c5b38315ee2f5eb7a96d964f3c0')}
        for name,(encoded,digest) in payload.items():
            assert pathlib.PurePosixPath(name).name==name
            data=zlib.decompress(base64.b64decode(encoded));assert hashlib.sha256(data).hexdigest()==digest,name
            (root/name).write_bytes(data)
        source=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'c32-source'
        assert (source/'transfer_receiver.py').is_file() and (source/'recover_r714.py').is_file()
        subprocess.run([sys.executable,str(root/'pair_probe.py')],check=True)
        subprocess.run([sys.executable,str(root/'tls_archive_probe.py'),str(source)],check=True)
        subprocess.run([sys.executable,str(root/'large_https_probe.py'),str(source)],check=True)
        print('C42_PAIRING_AND_HTTPS_ARCHIVE_PASS_RUNNER_ONLY_NO_IOS_BACKGROUND_OR_IPA',flush=True)
        C42_PY
    - name: C43 durable secure launcher and independent pair approval
      if: matrix.job == 'macos-sender' || matrix.job == 'windows-receiver'
      shell: bash
      run: |
        set -Eeuo pipefail
        if [[ "$RUNNER_OS" == Windows ]]; then PY=python; else PY=python3; fi
        "$PY" - <<'C43_PY'
        import pathlib,os,sys,zlib,base64,hashlib,subprocess
        root=pathlib.Path(os.environ['RUNNER_TEMP'])/'c43';root.mkdir(exist_ok=False)
        payload={'r1043_launcher.py': ('', '3e8e60011dfabc54762885a3fb86e73a949d0df1407f92a9b101d39f1e884cf6'), 'START_SECURE_RECEIVER.cmd': ('eNptzMEKwjAQhOH7PsVQEPRgba1n8U0kJBsiLNmwaZRe+uxW8KaXOX3z39gnhcZIlWdR74R8wCmg262hDB29EhujLLjmJjh/lh4RbKYm/GTBiD1hE3PSDBuHy3QX17Lfjn1Z6ACWyl+D4/SP/BSLa5XpDXn5Mec=', '2d04b5a167c32ae9f2ea45a21e321e0b3c3f3a0d14e077b70ca6b98a34478ca6'), 'launcher_probe.py': ('', '7cf4cc0eb00f082b37c91bfb2106471889bb2887c6ddb9e65266ea2f3bdd8862'), 'R1043PairApproval.swift': ('', '0ae2b338cc72d8873aec8dd71752a81e9b71849221c0d01147a59ee54fadee97'), 'approval_probe.swift': ('', 'df8792448b5da7dcedf43b1bf8fe902aab838e8316cdf03b58a0df7711e835ca'), 'R1040BackgroundJournal.swift': ('', '096b740f3b6112d0133cd535d03c46c5f78b479762dea9323f14932577743179'), 'R1041BackgroundAdapter.swift': ('', '4a97d6b99c61d2fceea3b35a830c34a007a9a315e39a87f058b9c4429b82e861'), 'R1041PairKeychain.swift': ('', '97d389ae47bf3b0d2588440900aeaf06a452caa8a58dcc8e0ad1cd073e08802f'), 'r1041_tls_receiver.py': ('', '570570486294a0ac57d000855c031d0380b00fd2b6cdc074197572eb8bfbe2a6'), 'r1042_pairing.py': ('', '752081962ea3c64f3ae15c9d566ec20cf16077eda80f04a5257982ea7a47556e')}
        for name,(encoded,digest) in payload.items():
            assert pathlib.PurePosixPath(name).name==name
            raw=zlib.decompress(base64.b64decode(encoded));assert hashlib.sha256(raw).hexdigest()==digest,name
            (root/name).write_bytes(raw)
        source=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'c32-source'
        assert (source/'transfer_receiver.py').is_file() and (source/'recover_r714.py').is_file()
        subprocess.run([sys.executable,str(root/'launcher_probe.py'),str(source)],check=True)
        print('C43_PC_LAUNCHER_LOGIC_PASS_11_NOT_GUI_NOT_PHYSICAL',flush=True)
        if os.environ.get('RUNNER_OS')=='macOS':
            sources=[str(root/n) for n in ('R1040BackgroundJournal.swift','R1041BackgroundAdapter.swift','R1041PairKeychain.swift','R1043PairApproval.swift')]
            exe=root/'approval';subprocess.run(['swiftc','-swift-version','6',*sources,str(root/'approval_probe.swift'),'-o',str(exe)],check=True)
            p=subprocess.run([str(exe)],check=True,text=True,capture_output=True);print(p.stdout,flush=True);assert 'C43_PAIR_APPROVAL_PASS 11/11' in p.stdout and p.stdout.count('PASS ')==12
            sdk=subprocess.check_output(['xcrun','--sdk','iphoneos','--show-sdk-path'],text=True).strip()
            subprocess.run(['xcrun','--sdk','iphoneos','swiftc','-swift-version','6','-typecheck','-target','arm64-apple-ios18.0','-sdk',sdk,*sources],check=True)
            print('C43_IOS_PAIR_APPROVAL_TYPECHECK_PASS_NOT_WIRED_NOT_DEVICE',flush=True)
        print('C43_EXPERIMENTAL_LAUNCHER_AND_PAIRING_PASS_NO_PRODUCT_ENABLE_NO_IPA',flush=True)
        C43_PY
  gate:
    needs:
    - verify
    if: always() && github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
    - name: 'Gate: every automated job must pass; no IPA or physical certification'
      shell: bash
      run: |
        set -Eeuo pipefail
        [[ '${{ needs.verify.result }}' == success ]]
        echo C43_AUTOMATED_GATE_PASS_IOS_REDIRECT_UI_PHYSICAL_IPA_HOLD
