jobs:
  b:
    if: >-
      github.repository ==
      'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        ref: e6d81f91514039e0ca11a3ad267f0429a9fe62ba
    - run: |
        python3 - <<'PY'
        import os,base64,lzma,hashlib,pathlib
        b=lzma.decompress(base64.b85decode(
          ''.join(os.environ['P'].split())),
          format=lzma.FORMAT_ALONE)
        assert hashlib.sha256(b).hexdigest() == (
          '38f6b8ce48a91130b328b8f7ede4f409' +
          '40ab9ab971055541c1243f73b3714dd1')
        names=[
          'app/ios/ChampionsOnDevice/' +
          'R675PixelOCRHPAgreement.swift',
          'tests/R675Smoke.swift',
          'tools/r675_patch.py','/tmp/R675CI.sh']
        sizes=[5790, 4388, 1253, 1102]
        i=0
        for n,z in zip(names,sizes):
          p=pathlib.Path(n)
          p.parent.mkdir(parents=True,exist_ok=True)
          assert not p.exists(),n
          p.write_bytes(b[i:i+z]);i+=z
        assert i==len(b)
        PY
        bash /tmp/R675CI.sh
