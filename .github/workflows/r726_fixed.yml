       assert len(raw)==2263524
       assert hashlib.sha256(raw).hexdigest()=='67fbb3058807f29f867478569532e98540595b11a48924282830fcf18d2c260b'
       obj=json.loads(raw)
       items=obj['files']
       assert obj['version']=='R726' and len(items)==291
       root=pathlib.Path('.r726-source')
       for name,data in items.items():
        p=pathlib.PurePosixPath(name)
        assert not p.is_absolute() and '..' not in p.parts and name==str(p)
        assert isinstance(data,str) and len(data.encode('utf8'))<5_000_000
        q=root/name;q.parent.mkdir(parents=True,exist_ok=True);q.write_text(data,encoding='utf8')
       orig=json.loads((root/'source_manifest.json').read_text())
       assert len(orig)==271 and set(orig).issubset(set(items))
       changed=set([
         'app/ios/ChampionsOnDevice/CaptureCoordinator.swift',
        'app/ios/ChampionsOnDevice/Info.plist',
        'app/ios/ChampionsOnDevice/R710ContinuousRecorder.swift',
       ])
       for name,sha in orig.items():
        if name not in changed:assert hashlib.sha256(items[name].encode()).hexdigest()==sha,('R718_BASE_MUTATION',name)
       app=root/'app/ios/ChampionsOnDevice'
       assert len(list(app.glob('*.swift')))==230
       assert '<string>726</string>' in (app/'Info.plist').read_text()
       assert 'R726LiveOCRClosure.inspect(' in (app/'R710ContinuousRecorder.swift').read_text()
       assert 'appendRecognition(r725Audit)' in (app/'CaptureCoordinator.swift').read_text()
       assert 'certified_79_fields":0' in (app/'R725LivePixelEvidence.swift').read_text()
       print('R726_FULL_SELF_CONTAINED_291_SOURCE_SHA_PASS')
       PY
    - name: Run 53 Swift tests and parse 230 app Swift files
      shell: bash
      run: |
       set -euo pipefail
       mkdir -p R726Artifacts
       cd .r726-source/R720_PORTABLE_TESTS
       swift test -j 2 > ../../R726Artifacts/R726_SWIFT_53_TESTS.log 2>&1 || {
        tail -n 65 ../../R726Artifacts/R726_SWIFT_53_TESTS.log;exit 1;
       }
       grep -Fq 'Executed 53 tests, with 0 failures' ../../R726Artifacts/R726_SWIFT_53_TESTS.log
       cd ../..
       swiftc -frontend -parse .r726-source/app/ios/ChampionsOnDevice/*.swift
       printf 'R726_53_PORTABLE_TESTS_AND_230_APP_SWIFT_PARSE_PASS\n'
    - name: Export exact full-source ZIP before Apple build
      shell: bash
      run: |
       set -euo pipefail
       python3 - <<'PY'
       import pathlib,zipfile,hashlib,json
       src=pathlib.Path('.r726-source');dest=pathlib.Path('R726Artifacts');dest.mkdir(exist_ok=True)
       files=sorted(p for p in src.rglob('*') if p.is_file() and '.build' not in p.relative_to(src).parts)
       assert len(files)==291,len(files)
       out=dest/'R726_FULL_EDITABLE_SOURCE_RECOVERY.zip'
       with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
        for p in files:z.write(p,p.relative_to(src).as_posix())
       with zipfile.ZipFile(out) as z:
        assert z.testzip() is None and len(z.namelist())==291
       manifest={p.relative_to(src).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in files}
       (dest/'R726_ALL_SOURCE_HASHES.json').write_text(json.dumps(manifest,sort_keys=True,indent=2))
       (dest/'R726_SOURCE_EXPORT_RECEIPT.json').write_text(json.dumps({'source_files':291,
        'archive_bytes':out.stat().st_size,'archive_sha256':hashlib.sha256(out.read_bytes()).hexdigest(),
        'crc':'PASS','r718_original_files_maintained':272,'swift_files':230,
        'app_build':'726','device_certified_fields':0,'real_device_test':'NOT_RUN'},indent=2))
       print('R726_FULL_291_FILE_ZIP_CRC_PASS',out.stat().st_size)
       PY
    - name: Compile and package full unsigned iPhoneOS app
      shell: bash
      run: |
       set -euo pipefail
       python3 .r726-source/tools/generate_xcode_project.py
       xcodebuild -project .r726-source/app/ios/ChampionsOnDeviceResearch.xcodeproj \
        -scheme ChampionsOnDeviceResearch -configuration Debug \
        -sdk iphoneos -destination 'generic/platform=iOS' \
        ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
        -derivedDataPath "$RUNNER_TEMP/r726-derived" build \
        > R726Artifacts/R726_IPHONEOS_XCODEBUILD.log 2>&1 || {
        grep -E 'error:|BUILD FAILED' R726Artifacts/R726_IPHONEOS_XCODEBUILD.log | tail -n 55 || true
        exit 1
       }
       grep -Fq 'BUILD SUCCEEDED' R726Artifacts/R726_IPHONEOS_XCODEBUILD.log
       python3 - <<'PY'
       import os,pathlib,plistlib,zipfile,json,hashlib
       log=pathlib.Path('R726Artifacts/R726_IPHONEOS_XCODEBUILD.log').read_text(errors='replace')
       for name in ('CaptureCoordinator.swift','R725LivePixelEvidence.swift','R710ContinuousRecorder.swift','R726LiveOCRClosure.swift'):
        assert name in log,('APP_COMPILER_INPUT_MISSING',name)
       app=pathlib.Path(os.environ['RUNNER_TEMP'])/'r726-derived/Build/Products/Debug-iphoneos/ChampionsOnDeviceResearch.app'
       assert app.is_dir()
       info=plistlib.loads((app/'Info.plist').read_bytes())
       assert info['CFBundleVersion']=='726' and info['CFBundleShortVersionString']=='0.7.26'
       assert not (app/'embedded.mobileprovision').exists(),'UNEXPECTED_SIGNED_APP'
       ipa=pathlib.Path('R726Artifacts/R726_Unsigned_Research.ipa')
       with zipfile.ZipFile(ipa,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
        for p in sorted(app.rglob('*')):
         assert not p.is_symlink()
         if p.is_file():z.write(p,arcname='Payload/'+app.name+'/'+p.relative_to(app).as_posix())
       with zipfile.ZipFile(ipa) as z:assert z.testzip() is None
       assert ipa.stat().st_size<9_000_000,'UNSIGNED_IPA_BOUND_HOLD'
       pathlib.Path('R726Artifacts/R726_COMPILE_RECEIPT.json').write_text(json.dumps({
        'ios_build':'PASS_UNSIGNED_ONLY','build':'726','unit_tests':'53_PASS',
        'source_bundle_files':291,'device_certified_fields':0,
        'capture_to_movie_frame_alignment_certified':False,
        'owner_turn_hud_calibration_certified':False},indent=2))
       print('R726_COMPLETE_APP_IPHONEOS_BUILD_PASS_NOT_DEVICE_CERTIFIED',ipa.stat().st_size)
       PY
    - name: Guard repository free-scope artifact storage
      id: budget
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
       set -euo pipefail
       python3 - <<'PY'
       import pathlib,os,urllib.request,json
       p=pathlib.Path('R726Artifacts')
       n=sum(x.stat().st_size for x in p.rglob('*') if x.is_file())
       assert 0<n<16_000_000,('LOCAL_ARTIFACT_SIZE_HOLD',n)
       total=0
       for page in range(1,11):
        url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/artifacts?per_page=100&page='+str(page)
        req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
        'Accept':'application/vnd.github+json','User-Agent':'TruePlan-R726-Free-Guard'})
        with urllib.request.urlopen(req,timeout=30) as response:records=json.load(response).get('artifacts',[])
        total+=sum(x['size_in_bytes'] for x in records if not x.get('expired'))
        if len(records)<100:break
       else:raise RuntimeError('ARTIFACT_INVENTORY_INCOMPLETE_HOLD')
       assert total+n<400_000_000,('FREE_STORAGE_BUDGET_HOLD',total,n)
       with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('allowed=true\n')
       print('R726_FREE_SCOPE_STORAGE_PASS',total,n)
       PY
    - uses: actions/upload-artifact@v4
      if: always() && steps.budget.outputs.allowed == 'true'
      with:
        name: R726-full-source-ocr-closure-audit
        path: R726Artifacts/
        if-no-files-found: error
    - name: Strict real-device certification boundary
      if: always()
      shell: bash
      run: |
       set -euo pipefail
       {
        echo '## R726 full-source, source-bound OCR evidence completeness audit'
        echo 'All 291 source files are included in this YAML; GitHub checkout and immutable blob fetch are not required.'
        echo '53 Swift unit tests plus full iPhoneOS compile are run on CI.'
        echo 'New continuous/r726_ocr_pairing_audit.json lists missing, duplicate or mismatched R725 OCR lifecycle events.'
        echo 'Original recording app build is retained when older sessions are exported.'
        echo 'Actual game HUD owners, turns and all 79 values remain NOT DEVICE CERTIFIED.'
        echo 'Un-signed test IPA must not be treated as a device-signed package.'
       } >> "$GITHUB_STEP_SUMMARY"
