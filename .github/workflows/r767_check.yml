name: R767 D30 Bounded Quick OCR Epoch Recovery NO IPA
'on':
  push:
    branches: [main]
    paths:
    - '.github/workflows/r767_check.yml'
    - '.github/workflows/d30.b64'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r767-d30-${{ github.repository }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: macos-26
          lane: real-apple-vision
        - runner: xcode-27
          lane: iphoneos-compile
    if: >-
      github.repository == 'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
    - name: Read current commit source payload only
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        persist-credentials: false
        sparse-checkout: .github/workflows/d30.b64
        sparse-checkout-cone-mode: false
    - name: Create diagnostics before source restoration
      if: always()
      shell: bash
      run: |
        mkdir -p R767Proof
        printf '%s%s\n' \
          'NO IPA; R767 bounded QUICK epoch recovery; ' \
          'DETAIL remains fail-closed; no IPA' \
          > R767Proof/STARTED.txt
        echo 'Runner: ${{ matrix.runner }}' >> R767Proof/STARTED.txt
        echo 'Lane: ${{ matrix.lane }}' >> R767Proof/STARTED.txt
        xcodebuild -version > R767Proof/Environment.log
        swift --version >> R767Proof/Environment.log
    - name: Restore independent SHA verified source NO IPA
      id: restore
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYTHON'
        import pathlib,json,lzma,base64,hashlib
        sha=lambda b:hashlib.sha256(b).hexdigest()
        encoded=pathlib.Path('.github/workflows/d30.b64').read_text()
        packed=base64.b64decode(''.join(encoded.split()),validate=True)
        expected=(
          'ad2d0bb9c9b9c91bf4f488cf220deabb'
          '2fe5064c1a9024add1c4627c1b226d37')
        assert sha(packed)==expected,'SOURCE_PAYLOAD_SHA_MISMATCH'
        unpack=lzma.LZMADecompressor()
        decoded=unpack.decompress(packed,max_length=64_000_000)
        assert unpack.eof and not unpack.unused_data
        data=json.loads(decoded)
        files={n:s.encode('utf8') for n,s in data['text'].items()}
        for n,s in data['binary'].items():
         assert n not in files
         files[n]=base64.b64decode(s,validate=True)
        root=pathlib.Path('source')
        root.mkdir(exist_ok=False)
        for n,b in files.items():
         p=pathlib.PurePosixPath(n)
         assert not p.is_absolute() and '..' not in p.parts
         assert chr(92) not in n and ':' not in n
         target=root/n
         target.parent.mkdir(parents=True,exist_ok=True)
         target.write_bytes(b)
        manifest=json.loads(files['source_manifest.json'])
        assert set(manifest)==set(files)-{'source_manifest.json'}
        assert all(sha(files[n])==h for n,h in manifest.items())
        tree=sha(''.join(n+'\t'+sha(files[n])+'\n'
         for n in sorted(files)).encode())
        expected=(
         'b442d73d44089d28c96f22779cde2fe9'
         'cf72b3390685feba0c155c4f5b0a44f6')
        assert tree==expected,'RESTORED_TREE_SHA_MISMATCH'
        assert len(files)==469
        pathlib.Path('R767Proof/HASHES.json').write_text(
         json.dumps({n:sha(b) for n,b in files.items()},sort_keys=True))
        print('R767 restored SHA PASS',len(files),tree)
        PYTHON
    - name: Source preservation and static capture gates
      id: checks
      if: >-
        always() && steps.restore.outcome == 'success'
        && matrix.lane == 'iphoneos-compile'
      shell: bash
      run: |
        set -euo pipefail
        for script in r761_preflight r742_live_path_audit \
          r743_macos_compat_audit r745_read_path_gate \
          r748_capture_path_gate; do
          python3 "source/tools/$script.py" \
            > "R767Proof/$script.log" 2>&1 || {
              cat "R767Proof/$script.log"; exit 1;
            }
        done
        python3 - <<'PYTIMER'
        from pathlib import Path
        p=Path('source/app/ios/ChampionsOnDevice/CaptureCoordinator.swift')
        matches=[line.strip() for line in p.read_text().splitlines()
                 if 'timer.schedule(deadline:' in line]
        assert len(matches)==1, matches
        probe=('import Foundation\nimport Dispatch\n'
               'func check() {\n'
               'let timer = DispatchSource.makeTimerSource()\n'
               +matches[0]+'\n}\n')
        Path('R767Proof/TimerTypecheck.swift').write_text(probe)
        PYTIMER
        swiftc -typecheck R767Proof/TimerTypecheck.swift \
          > R767Proof/TimerTypecheck.log 2>&1 || {
            cat R767Proof/TimerTypecheck.log; exit 1;
          }
        python3 - <<'PYGATE'
        from pathlib import Path
        app=Path('source/app/ios/ChampionsOnDevice')
        core=Path('source/R720_PORTABLE_TESTS/Sources/R719Core')
        for stem in ('R767QuickEpochExecutionPool',
                     'R766OCRWorkerLivenessLedger',
                     'R765OCRSourceLaneScheduler',
                     'R764CaptureLivenessLedger',
                     'R763CaptureGapLedger',
                     'R762SingleFrameConflictFence'):
         a=(app/(stem+'.swift')).read_bytes()
         b=(core/(stem+'.swift')).read_bytes()
         assert a==b,stem
        capture=(app/'CaptureCoordinator.swift').read_text()
        markers=(
         'r767QuickEpochPool.submit(epoch:quickEpoch',
         'R767_QUICK_RETIRED_BEFORE_VISION',
         'self.r766OCRWorkers.poll(nowMs:nowMs)',
         'r766OCRWorkers.deadline(lane:.quick',
         'r766OCRWorkers.deadline(lane:.detail',
         'r765SourceLanes.submitQuick {',
         'r765SourceLanes.submitDetail {',
         'r765SourceLanes.drainBeforeFinalizing()',
         'r764Liveness.observe(sessionToken:',
         'startR764Watchdog(token:',
         'r764Liveness.poll(sessionToken:',
         'r763GapLedger.observe(epoch:generation',
         'recognition/r763_callback_time_gaps.json')
        for m in markers:assert m in capture,m
        for m in ('recognition/r767_quick_epoch_workers.json',
                  'recognition/r766_physical_vision_workers.json',
                  'recognition/r764_callback_liveness.json'):
         assert capture.count(m)==2,(m,capture.count(m))
        assert 'R762SingleFrameConflictFence.filter(findings)' in (app/'R716SpatialFieldProjection.swift').read_text()
        assert 'r762_same_frame_conflicting_candidates_held' in (app/'R714CaptureAudit.swift').read_text()
        PYGATE
        python3 -m unittest discover -s source/tools/tests -v \
          > R767Proof/Python.log 2>&1 || {
            tail -n 70 R767Proof/Python.log; exit 1;
          }
        swiftc -frontend -parse \
          source/app/ios/ChampionsOnDevice/*.swift \
          > R767Proof/Parse.log 2>&1
    - name: Mac XCTest and actual real PNG Apple Vision
      id: swift
      if: >-
        always() && steps.restore.outcome == 'success'
        && matrix.lane == 'real-apple-vision'
      shell: bash
      run: |
        set -euo pipefail
        test "$(uname -s)" = Darwin
        export R761_FIELD_AUDIT_OUTPUT="$GITHUB_WORKSPACE/"
        R761_FIELD_AUDIT_OUTPUT+="R767Proof/FieldSafety.json"
        export R761_APPLE_VISION_OUTPUT="$GITHUB_WORKSPACE/"
        R761_APPLE_VISION_OUTPUT+="R767Proof/RealAppleVision.json"
        swift test --package-path source/R720_PORTABLE_TESTS \
          --jobs 4 --scratch-path "$RUNNER_TEMP/r761-tests" \
          > R767Proof/Swift.log 2>&1 || {
            tail -n 90 R767Proof/Swift.log; exit 1;
          }
        python3 - <<'PYTHON'
        from pathlib import Path
        import re
        text=Path('R767Proof/Swift.log').read_text()
        for name in ['testActualAppleVisionOnRealHPAndPPPanel',
                     'testActualAppleVisionOnRealSelectionSix']:
         assert re.search(name+r'.*passed',text),name
        assert re.search('testActualProjectorCannotAdmitTwoDifferentPPValuesForOneSlot'
                         +r'.*passed',text)
        assert re.search('testFifteenSecondDeliveryGapCapturedWithoutInventingFrames'
                         +r'.*passed',text)
        assert re.search('testWithoutAnyFurtherCallbackTimerRecordsBothSilences'
                         +r'.*passed',text)
        assert re.search('testOldSessionCannotResetNewOrStopItsTimer'
                         +r'.*passed',text)
        for name in ['testDetailSourceStallDoesNotStarveQuickLane',
                     'testQuickSourceStallDoesNotStarveDetailLane',
                     'testQuickLaneRemainsSerial',
                     'testDrainWaitsForBothPendingSourceWrites']:
         assert re.search(name+r'.*passed',text),name
        for name in ['testQuickStallRaisedExactlyOnceEvenWithoutCallbacks',
                     'testDetailTimeOutNotMistakenForPhysicalExit',
                     'testOldSessionCannotReleaseNewSessionOrOccupiedLane',
                     'testIndependentLaneStillTracksWhenOtherOneStuck',
                     'testBoundedEventsPreserveOverflowCounter']:
         assert re.search(name+r'.*passed',text),name
        for name in ['testNewEpochCanRunWhileOldEpochIsPhysicallyStalled',
                     'testThirdUnreturnedPhysicalWorkerIsHeldNotSpawned',
                     'testLedgerTracksTwoQuickEpochsWithoutConfusingLateReturn',
                     'testLateOldQuickReturnCannotReleaseNewLogicalGate']:
         assert re.search(name+r'.*passed',text),name
        assert re.search(r'Executed [0-9]+ tests, with 0 failures',text)
        PYTHON
    - name: Production archive integrity and negative cases on Mac
      id: archive
      if: >-
        always() && steps.restore.outcome == 'success'
        && matrix.lane == 'iphoneos-compile'
      shell: bash
      run: |
        set -euo pipefail
        app=source/app/ios/ChampionsOnDevice
        sources=(
          "$app/R548ResearchArchive.swift"
          "$app/R551EvidenceIntegrity.swift"
          "$app/R555StoredZIPReadback.swift"
          "$app/R689StreamingZIP.swift"
          "$app/R731ArchiveCapacity.swift"
          source/tests/R710ArchiveIntegrationTests.swift
        )
        swiftc "${sources[@]}" -o "$RUNNER_TEMP/r761-archive" \
          > R767Proof/Archive.log 2>&1
        "$RUNNER_TEMP/r761-archive" >> R767Proof/Archive.log 2>&1
    - name: iPhoneOS compile without IPA creation
      id: phone
      if: >-
        always() && steps.restore.outcome == 'success'
        && matrix.lane == 'iphoneos-compile'
      shell: bash
      run: |
        set -euo pipefail
        python3 source/tools/generate_xcode_project.py
        project=source/app/ios/ChampionsOnDeviceResearch.xcodeproj
        xcodebuild -project "$project" \
          -scheme ChampionsOnDeviceResearch -configuration Debug \
          -sdk iphoneos -destination 'generic/platform=iOS' \
          ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
          -derivedDataPath "$RUNNER_TEMP/r761" build \
          > R767Proof/iPhoneOS.log 2>&1 || {
            grep -E 'error:|BUILD FAILED' R767Proof/iPhoneOS.log || true
            exit 1;
          }
        grep -F 'BUILD SUCCEEDED' R767Proof/iPhoneOS.log
    - name: Preserve complete source and honest gate status
      if: always() && steps.restore.outcome == 'success'
      shell: bash
      env:
        MAC_RESULT: ${{ steps.swift.outcome }}
        LANE: ${{ matrix.lane }}
        RUNNER: ${{ matrix.runner }}
        IOS_RESULT: ${{ steps.phone.outcome }}
        SOURCE_RESULT: ${{ steps.checks.outcome }}
        ARCHIVE_RESULT: ${{ steps.archive.outcome }}
      run: |
        python3 - <<'PYTHON'
        import os,pathlib,zipfile,json
        root=pathlib.Path('source');out=pathlib.Path('R767Proof')
        names=list(json.loads((root/'source_manifest.json').read_text()))
        names+=['source_manifest.json']
        with zipfile.ZipFile(out/'R767_COMPLETE_SOURCE.zip','w',
         zipfile.ZIP_DEFLATED) as z:
         for name in sorted(names):z.write(root/name,name)
        status={
         'lane':os.environ['LANE'],
         'runner':os.environ['RUNNER'],
         'source_checks':os.environ['SOURCE_RESULT'],
         'mac_xctest_and_real_vision':os.environ['MAC_RESULT'],
         'mac_accurate_vision':os.environ['MAC_RESULT'],
         'iphoneos_compile':os.environ['IOS_RESULT'],
         'production_archive_test':os.environ['ARCHIVE_RESULT'],
         'device_certified_fields':0,'ipa_created':False,
         'ipa_allowed':False,'duration_gate_required':False,
         'remaining':'79 fields, real iPhone 3-min capture, root cause, OCR'}
        (out/'GATE.json').write_text(json.dumps(status,indent=2))
        PYTHON
    - name: Upload diagnostics even on failure NO IPA
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: R767-${{ matrix.lane }}-NO-IPA
        path: R767Proof/
        retention-days: 3
        if-no-files-found: error
