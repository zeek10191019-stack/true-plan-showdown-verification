name: R589 Pixel HUD Green-Run Source Integration
"on":
  push:
    paths: [.github/workflows/ad.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      PYTHONOPTIMIZE: "0"
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
    steps:
      - name: Restore pinned R588 and apply R589 exact pixel-scanner delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'R589_REPLAY'
          import urllib.request,hashlib,re,textwrap,ast,json,lzma,base64
          from pathlib import Path
          H=lambda d:hashlib.sha256(d).hexdigest()
          u="https://raw.githubusercontent.com/zeek10191019-stack/true-plan-showdown-verification/fcf3949b13a16d9d6992afea3ebafa87b33e565e/.github/workflows/ac.yml"
          a=urllib.request.urlopen(u,timeout=90).read()
          assert len(a)==11976 and H(a)=='4c2c111fb370bf1f0a67bc4cc8005edfdbad0006a2e681416d4201eccbba0bcb','R589_PINNED_R588_YAML_MISMATCH'
          m=re.search(r"python3 - <<'PY'\n(.*?)\n\s+PY",a.decode(),re.S)
          assert m,'R589_PINNED_R588_REPLAY_MISSING'
          exec(compile(textwrap.dedent(m.group(1)),'PINNED_R588_FROM_AC','exec'))
          changes=json.loads(lzma.decompress(base64.b64decode('')))
          assert len(changes)==4
          updates=[]
          for row in changes:
           p=Path(row['path']); old=p.read_bytes() if p.exists() else b''
           assert (H(old) if old else None)==row['old_sha'],('R589_WRONG_PARENT',row['path'])
           d=old
           for span in reversed(row['spans']):
            i=span['offset'];n=span['remove']
            assert 0<=i<=i+n<=len(d)
            d=d[:i]+base64.b64decode(span['insert'])+d[i+n:]
           assert H(d)==row['new_sha'] and len(d)==row['new_len'],('R589_PATCH_MISMATCH',row['path'])
           updates.append((p,d))
          for p,d in updates:
           p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(d)
          assert len(list(Path('app/ios/ChampionsOnDevice').glob('*.swift')))==131
          assert 'maximumMembers = 32' in Path('app/ios/ChampionsOnDevice/R548ResearchArchive.swift').read_text()
          assert 'historical_hud_pixel_runs.json' in Path('app/ios/ChampionsOnDevice/CaptureCoordinator.swift').read_text()
          print('R589_EXACT_SOURCE_AND_PIXEL_PROBE_4_PATCHES_PASS')
          R589_REPLAY
          swiftc -frontend -parse app/ios/ChampionsOnDevice/*.swift
          swiftc -parse-as-library app/ios/ChampionsOnDevice/R589PixelHUDProbe.swift tests/R589PixelHUDProbeHarness.swift -o "$RUNNER_TEMP/r589-probe"
          "$RUNNER_TEMP/r589-probe"
          python3 tools/run_r571_native.py || { for f in reports/xcode_iphoneos_build.log reports/r574_png_replay_compile.log; do [ ! -f "$f" ] || grep -nE 'error:|fatal error|BUILD FAILED' "$f" | tail -n 50 || true; done; exit 1; }
          echo 'R589 APPLE BUILD PASS only; owner/HP/MEGA/game accuracy NOT certified; no IPA'
