        data = lzma.decompress(base64.b64decode(''.join(encoded.split())))
        for name, item in json.loads(data).items():
            assert Path(name).name == name
            value = base64.b64decode(item['base64'], validate=True)
            assert hashlib.sha256(value).hexdigest() == item['sha256']
            (target/name).write_bytes(value)
        PYCODE
        python3 "$build/apply.py" pinned-r793/source "$build" "$NEXT_HASH"
    - name: Re-run earlier Vision, save, export and PC regressions
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        build="$RUNNER_TEMP/opening"
        ruby -ryaml -e '
          steps=YAML.load_file(ARGV[0],aliases:true)
                    .fetch("jobs").fetch("verify").fetch("steps")
          puts steps.fetch(2).fetch("run")
        ' "$build/r998.yml" > "$build/legacy.sh"
        bash "$build/legacy.sh"
    - name: Replay the captured opening and check Lenovo browser output
      id: replay
      shell: bash
      run: |
        set -euo pipefail
        build="$RUNNER_TEMP/opening"
        fixtures="$RUNNER_TEMP/r998"
        src=pinned-r793/source
        app="$src/app/ios/ChampionsOnDevice"
        tests="$src/R720_PORTABLE_TESTS/Tests/R719CoreTests"
        test="$tests/R997RecordedBrowserTests.swift"
        test ! -e "$test"
        trap 'rm -f "$test"' EXIT
        cp "$build/opening-test.swift" "$test"
        export R997_CAPTURE_FIXTURE="$fixtures/capture.json"
        export R997_PP_CROPS="$fixtures/pp-crops.json"
        export R997_BROWSER_PACKETS="$build/actions.json"
        export R998_OPENING_NUMERIC_PACKET="$build/numeric.json"
        swift test --package-path "$src/R720_PORTABLE_TESTS" \
          --scratch-path "$RUNNER_TEMP/opening-swift" --jobs 2 \
          --filter 'R997RecordedBrowserTests|R991NameIndependentReadoutTests'
        node "$build/opening-browser.cjs" "$app/R920QuickPCDisplay.swift" \
          "$R997_BROWSER_PACKETS" "$R998_OPENING_NUMERIC_PACKET"
        swiftc -frontend -parse "$app/CaptureCoordinator.swift" \
          "$app/R987BattleReadout.swift" "$app/R920QuickPCDisplay.swift"
        rm "$test"
        hash="$(shasum -a 256 "$src/source_manifest.json" | cut -d' ' -f1)"
        printf 'manifest=%s\n' "$hash" >> "$GITHUB_OUTPUT"
  package:
    if: >-
      github.repository_owner == 'zeek10191019-stack' &&
      github.event.repository.name == 'true-plan-showdown-verification' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/r998-opening-quick'
    needs: verify
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
    - *checkout
    - *restore
    - name: Build checked iPhoneOS 27 arm64 source
      env:
        TESTED_MANIFEST: ${{ needs.verify.outputs.manifest }}
      shell: bash
      run: |
        set -euo pipefail
        src=pinned-r793/source
        sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
        [[ "${sdk%%.*}" == 27 ]]
        hash="$(shasum -a 256 "$src/source_manifest.json" | cut -d' ' -f1)"
        [[ "$hash" == "$TESTED_MANIFEST" ]]
        bash "$RUNNER_TEMP/opening/package.sh"
    - name: Publish and download the verified IPA
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: bash "$RUNNER_TEMP/opening/release.sh"
