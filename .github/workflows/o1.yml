jobs:
  verify:
    if: >-
      github.repository_owner == 'zeek10191019-stack' &&
      github.event.repository.name == 'true-plan-showdown-verification' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/r998-opening-quick'
    runs-on: macos-26
    timeout-minutes: 42
    outputs:
      manifest: ${{ steps.replay.outputs.manifest }}
    steps:
    - &checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: .github/workflows/o1.yml
    - &restore
      name: Restore exact published R998 and apply the opening change
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        build="$RUNNER_TEMP/opening"
        mkdir -p "$build"
        git show "$R998_COMMIT:$R998_FILE" > "$build/r998.yml"
        printf '%s  r998.yml\n' "$R998_HASH" |
          (cd "$build" && shasum -a 256 -c -)
        ruby -ryaml -e '
          steps=YAML.load_file(ARGV[0],aliases:true)
                    .fetch("jobs").fetch("verify").fetch("steps")
          puts steps.fetch(1).fetch("run")
        ' "$build/r998.yml" > "$build/restore.sh"
