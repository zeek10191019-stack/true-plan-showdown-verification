    - name: Run all inherited and R629 Python/Swift tests
      shell: bash
      run: |
        set -euo pipefail
        export PYTHONPATH=.
        for v in r605 r607 r608 r609 r610 r611batch r613batch r617batch r621batch r625batch r629batch; do
          python3 -m unittest discover -s tests -p "test_${v}_*.py" -v
        done
        swiftc -parse-as-library \
          app/ios/ChampionsOnDevice/R610CrossEvidenceCandidate.swift \
          app/ios/ChampionsOnDevice/R611TemporalHUDReview.swift \
          app/ios/ChampionsOnDevice/R612ArchiveEvidenceClosure.swift \
          app/ios/ChampionsOnDevice/R613R616IntegratedReadiness.swift \
          tests/R613BatchHarness.swift -o "$RUNNER_TEMP/r616"
        "$RUNNER_TEMP/r616"
        swiftc -parse-as-library \
          app/ios/ChampionsOnDevice/R617R620RotationReadout.swift \
          tests/R617Harness.swift -o "$RUNNER_TEMP/r620"
        "$RUNNER_TEMP/r620"
        swiftc -parse-as-library \
          app/ios/ChampionsOnDevice/R617R620RotationReadout.swift \
          app/ios/ChampionsOnDevice/R621R624VisualCandidates.swift \
          tests/R621Harness.swift -o "$RUNNER_TEMP/r624"
        "$RUNNER_TEMP/r624"
        swiftc -parse-as-library \
          app/ios/ChampionsOnDevice/R617R620RotationReadout.swift \
          app/ios/ChampionsOnDevice/R621R624VisualCandidates.swift \
          app/ios/ChampionsOnDevice/R625R628PixelHUDAndSprite.swift \
          app/ios/ChampionsOnDevice/R629R632SlotEvidence.swift \
          tests/R625Harness.swift -o "$RUNNER_TEMP/r628"
        "$RUNNER_TEMP/r628"
        swiftc -parse-as-library \
          app/ios/ChampionsOnDevice/R629R632SlotEvidence.swift \
          tests/R629Harness.swift -o "$RUNNER_TEMP/r632"
        "$RUNNER_TEMP/r632"
        echo 'R629_R632_REGRESSION_PASS_NOT_OWNER_OR_GAME_CERTIFIED'
    - name: Parse all Swift and build iPhoneOS native target
      shell: bash
      run: |
        set -euo pipefail
        swiftc -frontend -parse app/ios/ChampionsOnDevice/*.swift
        python3 tools/run_r571_native.py || {
          for f in reports/xcode_iphoneos_build.log reports/r574_png_replay_compile.log; do
            test ! -f "$f" || grep -nE 'error:|BUILD FAILED' "$f" | tail -n 65 || true
          done
          exit 1
        }
        echo 'R629_R632_APPLE_NATIVE_PASS_NOT_79_FIELDS_OR_MEGA_CERTIFIED'
    - name: Manifest restored source tree (no certification claims)
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYMANIFEST'
        import hashlib,json
        from pathlib import Path
        base=Path('.')
        folders=['app/ios/ChampionsOnDevice','tests','tools']
        files=[]
        for folder in folders:
            for p in sorted(Path(folder).rglob('*')):
                if (p.is_file() and not p.is_symlink() and '__pycache__' not in p.parts
                        and p.suffix not in ('.pyc','.pyo')):
                    b=p.read_bytes()
                    files.append({'path':p.as_posix(),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
        assert len([x for x in files if x['path'].endswith('.swift') and x['path'].startswith('app/')])>=155
        assert len(files)>=185
        assert len({x['path'] for x in files})==len(files)
        record={'schema':'trueplan.r633.recovered-source-manifest.v1',
                'source':'R629 source replay from SHA pinned R628 / bm.yml and bn bundle',
                'status':'source_build_verified_not_game_hud_certified',
                'r633_regression_gate':'PASS_before_manifest',
                'verified_79_fields':0,
                'owner_hp_mega_certified':False,'files':files}
        out=Path('reports/r633/source_manifest.json')
        out.parent.mkdir(parents=True,exist_ok=True)
        out.write_text(json.dumps(record,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
        print('R633_SOURCE_MANIFEST_CREATED',len(files),'records',out.stat().st_size,'bytes')
        with open('/dev/null','w') as _:
            pass
        PYMANIFEST
    - name: Prepare recovered source tree only on explicit publish request
      if: github.event_name == 'workflow_dispatch' && inputs.publish_sources == true
      uses: actions/upload-artifact@v4
      with:
        name: r633-recovered-source-tree
        path: 'app/ios/ChampionsOnDevice/

          tests/

          tools/

          reports/r633/source_manifest.json'
        if-no-files-found: error
        retention-days: 1
        include-hidden-files: false
    permissions:
      contents: read
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_sources == true
    needs:
    - verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    - name: Checkout repository only for isolated recovery branch
      uses: actions/checkout@v4
      with:
        path: published
        persist-credentials: true
        fetch-depth: 1
    - name: Read CI-verified recovered sources
      uses: actions/download-artifact@v4
      with:
        name: r633-recovered-source-tree
        path: recovered
    - name: Create new recovery branch without touching main
      shell: bash
      run: |
        set -euo pipefail
        branch='r633-recovered-source'
        cd published
        if git ls-remote --heads origin "refs/heads/$branch" | grep -q .; then
          echo 'FAIL: recovery branch exists; overwrite forbidden' >&2
          exit 1
        fi
        cd ..
        test -f recovered/reports/r633/source_manifest.json
        python3 - <<'PYVERIFY'
        import hashlib,json
        from pathlib import Path
        p=Path('recovered/reports/r633/source_manifest.json')
        manifest=json.loads(p.read_text())
        assert manifest['status']=='source_build_verified_not_game_hud_certified'
        for record in manifest['files']:
            rel=record['path']; file=Path('recovered')/rel
            assert not file.is_symlink() and file.is_file(),rel
            b=file.read_bytes()
            assert len(b)==record['bytes'] and hashlib.sha256(b).hexdigest()==record['sha256'],rel
        assert len([x for x in manifest['files']
                    if x['path'].startswith('app/') and x['path'].endswith('.swift')])>=155
        print('RECOVERED_SOURCE_SHA_VERIFIED',len(manifest['files']))
        PYVERIFY
        for folder in app tests tools; do
          test -d "recovered/$folder"
          mkdir -p "published/$folder"
          rsync -a --exclude='__pycache__/' --exclude='*.pyc' "recovered/$folder/" "published/$folder/"
        done
        mkdir -p published/reports/r633
        cp recovered/reports/r633/source_manifest.json published/reports/r633/source_manifest.json
        cd published
        git checkout -b "$branch"
        git add -- app tests tools reports/r633/source_manifest.json
        test "$(git diff --cached --name-only | wc -l | tr -d ' ')" -ge 185
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git commit -m 'R633: recover verified iOS sources for normal source control'
        git push --set-upstream origin "$branch"
        echo "Recovered branch: $branch" >> "$GITHUB_STEP_SUMMARY"
        echo 'Main branch was not modified.' >> "$GITHUB_STEP_SUMMARY"
