        from pathlib import Path
        url=('https://raw.githubusercontent.com/'
             'zeek10191019-stack/true-plan-showdown-verification/'
             '07493ea875cfa42fe481d89b4df91946397b4f33/'
             '.github/workflows/bm.yml')
        parent=urllib.request.urlopen(url,timeout=90).read()
        assert len(parent)==20982, 'PARENT_BM_SIZE_DRIFT'
        assert hashlib.sha256(parent).hexdigest() == (
         '10fc9a8cf82fabb8ac777bb563e0393478e70b7f81a6b29af192f5a0f8bf3ea9'), 'PARENT_BM_HASH_DRIFT'
        s=parent.decode('utf-8')
        a=re.search(r"(?m)^( +)python3 - <<'R628_REPLAY'$",s)
        assert a is not None and s.count('R628_REPLAY')==2,'PARENT_REPLAY_ANCHOR_DRIFT'
        block=textwrap.dedent(s.split(a.group(0)+'\n',1)[1].split('\n'+a.group(1)+'R628_REPLAY',1)[0])
        exec(compile(block,'R628_IMMUTABLE_PARENT','exec'),{'__name__':'__main__'})
