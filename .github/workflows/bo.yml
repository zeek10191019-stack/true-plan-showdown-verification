name: R633 Recover Source Tree - Verify First, Publish Only By Manual Opt-in
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/bo.yml
  workflow_dispatch:
    inputs:
      publish_sources:
        description: Explicitly create recovered source branch after successful CI
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: trueplan-r633-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private
      == false && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 55
    env:
      PYTHONOPTIMIZE: '0'
      SCREEN_READ_CI_ROLE: IOS27_NATIVE
    steps:
