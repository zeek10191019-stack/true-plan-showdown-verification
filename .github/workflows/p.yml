jobs:
  verify:
    if: >-
      github.repository ==
      'zeek10191019-stack/true-plan-showdown-verification'
      &&
      github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7142d0db7ed04800a88de3e1ce312edf366c4e08
      - name: Restore and test R668
        run: |
          python3 - <<'PY'
          import os,lzma,base64,hashlib
          from pathlib import Path
          data=lzma.decompress(base64.b85decode(''.join(
            os.environ['PACK'].split())),
            format=lzma.FORMAT_ALONE)
          assert len(data)==21660
          assert hashlib.sha256(data).hexdigest()==(
            '4a5a77f9a6e56625611e54e85e9c8a87' +
            '3c2b5fd9facaa24d93dd95c4814284e0')
          names=[
            ('app/ios/ChampionsOnDevice/' +
             'R668PlainHUDReader.swift'),
            'tests/R668PlainHUDSmoke.swift',
            'tools/r668_patch.py',
            'research/R668_README.md',
            '__TEMP__/R668CI.sh',
          ]
          sizes=[13851,4927,1134,888,860]
          pos=0
          for name,size in zip(names,sizes):
            content=data[pos:pos+size]
            pos+=size
            assert len(content)==size
            path=(Path(os.environ['RUNNER_TEMP'])/
              name.split('/')[-1]) if name.startswith(
              '__TEMP__/') else Path(name)
            assert not path.exists(),name
            path.parent.mkdir(parents=True,exist_ok=True)
            path.write_bytes(content)
          assert pos==len(data)
          PY
          bash "$RUNNER_TEMP/R668CI.sh"
