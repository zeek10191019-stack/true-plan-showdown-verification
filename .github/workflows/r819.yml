      run: "set -euo pipefail\nmkdir -p R819Proof\nif [ '${{ matrix.lane }}' = iphoneos-compile ]; then\n python3 - <<'PYR819XCODE'\nfrom pathlib import Path\nimport json,hashlib,subprocess,sys\nroot=Path('source');sha=lambda b:hashlib.sha256(b).hexdigest()\nexpected=Path('R819Proof/SOURCE_TREE_SHA256.txt').read_text().strip()\ndef check():\n m=json.loads((root/'source_manifest.json').read_text())\n files={str(p.relative_to(root)):p for p in root.rglob('*')\n    if p.is_file() and not any(x in p.parts for x in ('.build','__pycache__','.swiftpm'))}\n assert len(files)==595 and set(files)==set(m)|{'source_manifest.json'}\n assert all(sha(files[k].read_bytes())==v for k,v in m.items())\n return sha(''.join(k+'\\t'+sha(files[k].read_bytes())+'\\n' for k in sorted(files)).encode())\nassert check()==expected,'R819_PRE_XCODE_SOURCE_DRIFT'\nsubprocess.run([sys.executable,'source/tools/generate_xcode_project.py'],check=True)\nassert check()==expected,'R819_POST_XCODE_SOURCE_DRIFT'\nfor fn in ('R767QuickEpochExecutionPool.swift','R768DetailEpochExecutionPool.swift'):\n t=(root/'app/ios/ChampionsOnDevice'/fn).read_text()\n assert 'physical_worker_overdue_count' in t\nprint('R819_XCODE_PRODUCTION_OCR_STALL_PROOF_SOURCE_PRESERVED')\nPYR819XCODE\n xcodebuild -project source/app/ios/ChampionsOnDeviceResearch.xcodeproj \\\n   -scheme ChampionsOnDeviceResearch -configuration Debug -sdk iphoneos \\\n   -destination 'generic/platform=iOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \\\n   CODE_SIGNING_ALLOWED=NO -derivedDataPath \"$RUNNER_TEMP/r819_device\" build \\\n   > R819Proof/iPhoneOS.log 2>&1 || { grep -E 'error:|BUILD FAILED' R819Proof/iPhoneOS.log || true; exit 1; }\n grep -F 'BUILD SUCCEEDED' R819Proof/iPhoneOS.log\nfi\n"
    - name: '67: Upload R819 physical OCR livene'
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: R819-${{ matrix.lane }}-NO-IPA
        path: R819Proof/
        if-no-files-found: warn
        retention-days: 7
    - name: '68: R819 fail-closed full 598 Swift'
      shell: bash
      run: "set -euo pipefail\ntest -s R819Proof/SOURCE_TREE_SHA256.txt\ntest -s R819Proof/SOURCE_INTEGRITY.json\npython3 - <<'PYR819GATE'\nfrom pathlib import Path\nimport json\np=json.loads(Path('R819Proof/SOURCE_INTEGRITY.json').read_text())\nassert p['source_files']==595 and p['revision']=='R819'\nassert p['base_source_tree_sha256']=='02fd939897d31e0692624ce2cce61da2a83ff6bfb909616a032bce0ebed542c8'\nassert p['physical_worker_force_release'] is False\nassert p['physical_worker_watchdog_warning_ms']==15000\nassert p['live_79_fields_certified']==0 and p['ipa_created'] is False\nPYR819GATE\nif [ '${{ matrix.lane }}' = real-apple-vision ]; then\n test \"$(cat R819Proof/Swift.exit)\" = 0\n grep -F 'Executed 598 tests, with 0 failures' R819Proof/Swift.log\n for t in testR819QuickWorkerAgeIsDiagnosticOnlyAndNeverReleasesHeldSlot \\\n   testR819QuickBothSlotsOverdueStillNeverSpawnsThirdVision \\\n   testR819DetailWorkerStallReportingSurvivesEpochRetirement; do\n   grep -F \"$t\" R819Proof/Swift.log\n done\nelse\n grep -F 'BUILD SUCCEEDED' R819Proof/iPhoneOS.log\nfi\nprintf '%s\\n' 'R819_D79_SUCCESS_STALL_DIAGNOSTIC_NO_DEVICE_CERTIFICATION_NO_IPA'\n"
