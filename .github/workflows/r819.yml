    - main
    paths:
    - .github/workflows/r819.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: r819-d79-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
