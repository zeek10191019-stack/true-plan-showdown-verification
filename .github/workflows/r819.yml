      if: matrix.lane == 'iphoneos-compile'
      shell: bash
      run: "set -euo pipefail\nmkdir -p R815Proof\npython3 - <<'PYR815XCODE'\nfrom pathlib import Path\nimport hashlib,json,subprocess,sys\nroot=Path('source')\nsha=lambda b:hashlib.sha256(b).hexdigest()\ndef compute():\n m=json.loads((root/'source_manifest.json').read_text())\n f={str(p.relative_to(root)):p for p in root.rglob('*') if p.is_file() and not any(x in p.parts for x in ('.build','.swiftpm','__pycache__'))}\n assert len(f)==594 and set(f)==set(m)|{'source_manifest.json'}\n assert all(sha(f[n].read_bytes())==v for n,v in m.items())\n return sha(''.join(n+'\\t'+sha(f[n].read_bytes())+'\\n' for n in sorted(f)).encode())\nexpected=Path('R815Proof/SOURCE_TREE_SHA256.txt').read_text().strip()\nassert compute()==expected\nsubprocess.run([sys.executable,'source/tools/generate_xcode_project.py'],check=True)\nassert compute()==expected,'R815_XCODE_PROJECT_CHANGED_SOURCE_HASH'\nfor n in ['R767QuickEpochExecutionPool.swift','R768DetailEpochExecutionPool.swift']:\n t=(root/'app/ios/ChampionsOnDevice'/n).read_text()\n assert 'rejectedRetiredEpoch' in t and 'rejectedRewoundFrame' in t\nprint('R815_PRODUCTION_PHYSICAL_POOL_MONOTONIC_GATES_IN_XCODE_PROJECT')\nPYR815XCODE\nxcodebuild -project source/app/ios/ChampionsOnDeviceResearch.xcodeproj \\\n -scheme ChampionsOnDeviceResearch -configuration Debug -sdk iphoneos \\\n -destination 'generic/platform=iOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \\\n CODE_SIGNING_ALLOWED=NO -derivedDataPath \"$RUNNER_TEMP/r815_device\" build \\\n > R815Proof/iPhoneOS.log 2>&1 || {\n   grep -E 'error:|BUILD FAILED' R815Proof/iPhoneOS.log || true\n   exit 1\n }\ngrep -F 'BUILD SUCCEEDED' R815Proof/iPhoneOS.log"
