jobs:
  b:
    if: >-
      github.repository ==
      'zeek10191019-stack/true-plan-showdown-verification'
      && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        ref: c6ad18f271bca684e06aecc1e85e716a6ee698d9
    - run: |
        python3 - <<'PY'
        import os,base64,lzma,hashlib,pathlib
        b=lzma.decompress(base64.b85decode(
          ''.join(os.environ['P'].split())),
          format=lzma.FORMAT_ALONE)
        assert hashlib.sha256(b).hexdigest() == (
          '2c375ee1cff796f08da9ababec0b969a' +
          'f4634af5019f5712e71741217650f7b0')
        names=[
          'app/ios/ChampionsOnDevice/' +
          'R673OrientedSpriteReader.swift',
          'tests/R673SpriteSmoke.swift',
          'tools/r673_patch.py','/tmp/R673CI.sh']
        sizes=[5843, 3479, 2845, 1281]
        i=0
        for n,z in zip(names,sizes):
          p=pathlib.Path(n)
          p.parent.mkdir(parents=True,exist_ok=True)
          assert not p.exists(),n
          p.write_bytes(b[i:i+z]);i+=z
        assert i==len(b)
        PY
        bash /tmp/R673CI.sh
