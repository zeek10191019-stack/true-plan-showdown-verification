            assert hashlib.sha256(value).hexdigest()==record["sha256"]
            (target/name).write_bytes(value)
        PAYLOAD
        src=pinned-r793/source
        patch -s -p1 -F 0 -t -d "$src" < "$tmp/readout.patch"
        python3 - "$src" "$tmp/updated_hashes.json" <<'VERIFY'
        import hashlib,json,os,sys
        from pathlib import Path
        root=Path(sys.argv[1])
        manifest=root/'source_manifest.json'
        expected=json.loads(manifest.read_bytes())
        changed=json.loads(Path(sys.argv[2]).read_bytes())
        assert changed.keys() <= expected.keys()
        expected.update(changed)
        files={p.relative_to(root).as_posix():
               hashlib.sha256(p.read_bytes()).hexdigest()
               for p in root.rglob('*') if p.is_file() and p!=manifest}
        assert files==expected
        data=(json.dumps(expected,sort_keys=True,indent=2)+'\n').encode()
        assert hashlib.sha256(data).hexdigest()==os.environ["NEXT_HASH"]
        manifest.write_bytes(data)
        print('R998 source SHA-256',hashlib.sha256(data).hexdigest())
        VERIFY
    - name: Verify capture, archive, Vision and prior Lenovo regressions
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        tmp="$RUNNER_TEMP/r998"
        for index in 2 3; do
          ruby -ryaml -e '
            doc=YAML.load_file(ARGV[0],aliases:true)
            steps=doc.fetch("jobs").fetch("verify").fetch("steps")
            puts steps.fetch(Integer(ARGV[1])).fetch("run")
          ' "$tmp/r997.yml" "$index" > "$tmp/legacy.sh"
          bash "$tmp/legacy.sh"
        done
    - name: Replay R997 evidence into the Lenovo browser on the same source
      id: regress
      shell: bash
      run: |
        set -euo pipefail
        tmp="$RUNNER_TEMP/r998"
        src=pinned-r793/source
        app="$src/app/ios/ChampionsOnDevice"
        tests="$src/R720_PORTABLE_TESTS/Tests/R719CoreTests"
        export R997_CAPTURE_FIXTURE="$tmp/capture.json"
        export R997_PP_CROPS="$tmp/pp-crops.json"
        export R997_BROWSER_PACKETS="$tmp/packets.json"
        test_name=R997RecordedBrowserTests.swift
        test ! -e "$tests/$test_name"
        trap 'rm -f "$tests/$test_name"' EXIT
        cp "$tmp/$test_name" "$tests/"
        swift test --package-path "$src/R720_PORTABLE_TESTS" \
          --scratch-path "$RUNNER_TEMP/ai014-swift-tests" --jobs 2 \
          --filter R997RecordedBrowserTests 2>&1 | tee "$tmp/r998.log"
        grep -F "Test Suite 'R997RecordedBrowserTests' passed" "$tmp/r998.log"
        test -s "$R997_BROWSER_PACKETS"
        node "$tmp/browser.cjs" "$app/R920QuickPCDisplay.swift" \
          "$R997_BROWSER_PACKETS"
        swiftc -frontend -parse "$app/CaptureCoordinator.swift" \
          "$app/R987BattleReadout.swift" "$app/R920QuickPCDisplay.swift"
        result="$(shasum -a 256 "$src/source_manifest.json" | cut -d' ' -f1)"
        [[ "$NEXT_HASH" == "$result" ]]
        printf 'manifest=%s\n' "$result" >> "$GITHUB_OUTPUT"
  package:
    needs: verify
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
    - *checkout
    - *restore
    - name: Build the exact tested source for iPhoneOS 27 arm64
      env:
        TESTED_MANIFEST: ${{ needs.verify.outputs.manifest }}
      shell: bash
      run: |
        set -euo pipefail
        src=pinned-r793/source
        tmp="$RUNNER_TEMP/r998"
        sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
        [[ "${sdk%%.*}" == 27 ]]
        hash="$(shasum -a 256 "$src/source_manifest.json" | cut -d' ' -f1)"
        [[ "$hash" == "$TESTED_MANIFEST" ]]
        bash "$tmp/package.sh"
    - name: Publish and independently download the verified IPA
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: bash "$RUNNER_TEMP/r998/release.sh"
