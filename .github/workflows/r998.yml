name: R998 integrated display regression
'on':
  push:
    branches: [r987-ocr-pc-regression]
    paths: [.github/workflows/r998.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r998-integrated-display
  cancel-in-progress: false
env:
  BASE_SHA: c2297732ecfd90fa54c9838b0e2b6308dbe8815d
  R997_HASH: 12a360bca8327d4795deb46fba61bf3b152f359663b6ec1213d46e9ed74ed759
  NEXT_HASH: c409aa323adcb8a28ec46b13000cfd5e544f6ef7c9dfc6343af6587ae9ed0f01
  VERIFIED_SHA: 5eebfff8d8d43c3cc7432aafbb39dd0724fc3c3c
  VERIFIED_RUN: '45049580448'
  VERIFIED_JOB: '137291516691'
  R995_BUILD_COMMIT: 736cb296fef2136f41dfcdfd86ddf02005ca5952
  RELEASE_TAG: r998-integrated-device-test
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  verify:
    if: >-
      github.repository_owner == 'zeek10191019-stack'
      && github.event.repository.name == 'true-plan-showdown-verification'
      && !github.event.repository.private
      && github.ref == 'refs/heads/r987-ocr-pc-regression'
    runs-on: macos-26
    timeout-minutes: 42
    outputs:
      manifest: ${{ steps.regress.outputs.manifest }}
    steps:
    - &checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: .github/workflows/r998.yml
    - &restore
      name: Restore R997 and apply the verified R998 difference
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        tmp="$RUNNER_TEMP/r998"
        mkdir -p "$tmp"
        base_path=.github/workflows/r997-ai014-device-regression.yml
