        printf '%s  r997.yml\n' "$R997_HASH" |
          (cd "$tmp" && shasum -a 256 -c -)
        ruby -ryaml -e '
          doc=YAML.load_file(ARGV[0],aliases:true)
          puts doc.fetch("jobs").fetch("verify").fetch("steps")[1]
                  .fetch("run")
