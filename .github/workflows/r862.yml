          xcodebuild -project pinned-r793/source/app/ios/ChampionsOnDeviceResearch.xcodeproj -scheme ChampionsOnDeviceResearch -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO -derivedDataPath "$RUNNER_TEMP/r861_device_test" build > R861Delivery/iphoneos_package.log 2>&1 || { grep -E 'error:|BUILD FAILED' R861Delivery/iphoneos_package.log; exit 1; }
