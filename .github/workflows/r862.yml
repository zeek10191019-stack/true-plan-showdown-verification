          PY
          ruby -ryaml -e 'puts YAML.load_file(ARGV[0]).fetch("jobs").fetch("verify").fetch("steps").fetch(18).fetch("run")' pinned-r861/.github/workflows/r861.yml > "$RUNNER_TEMP/restore_r861.sh"
