          Swift688件・失敗0、iPhoneOS arm64、31枚保持画像の再出力・読戻し、実約299MB境界分割、10分割/11分割拒否・破損拒否が合格。実画像HP187/187・相手100%と一致。CVPixelBuffer取得後から原寸PNG・保存同期・OCR・79項目接続・メイン反映まで、Macで横597ms・縦446ms。
          
          同じ検証済みコミット eea971e2727bd02576091182de9c429cb99d5fb8 の658ファイルからIPAを作成。全アプリファイル・Mach-O arm64 iPhoneOS・ZIP CRC・SHA-256と、公開前の再取得を検証しています。SHAはVERIFICATION_R861.json / SHA256SUMS.txt、範囲と端末操作はDEVICE_TEST_R861.mdを確認してください。
          
