          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,plistlib,os
          s=Path('pinned-r793/source');m=json.loads((s/'source_manifest.json').read_text());sha=lambda b:hashlib.sha256(b).hexdigest()
          # The project file is derived by the exact verified generator. All other verified
          # source inputs must remain byte-identical through the native build.
          derived='app/ios/ChampionsOnDeviceResearch.xcodeproj/project.pbxproj'
          assert all(sha((s/n).read_bytes())==h for n,h in m.items() if n!=derived)
          app=Path(os.environ['R861_APP']);d=plistlib.loads((app/'Info.plist').read_bytes())
          assert d['CFBundleVersion']=='861' and d['CFBundleShortVersionString']=='0.8.61'
          assert d['CFBundleIdentifier']=='com.zeek10191019.championsresearch' and d['MinimumOSVersion']=='27.0'
          assert Path('R861Delivery/architectures.txt').read_text().strip()=='arm64'
          # Debug builds may use a small launcher plus NAME.debug.dylib; inspect both
          # native images and every packaged app member, never infer code from file size.
          import struct,subprocess
          exe=app/'ChampionsOnDeviceResearch';images=[exe]+sorted(app.glob('*.dylib'))
          for image in images:
           b=image.read_bytes();assert len(b)>=32 and image.stat().st_mode & 0o111
           magic,cpu,subtype,kind,ncmds,cmdbytes,flags,reserved=struct.unpack('<8I',b[:32])
           assert magic==0xfeedfacf and cpu==0x0100000c
           assert kind==(2 if image==exe else 6)
           pos=32;platforms=[]
           for _ in range(ncmds):
            cmd,size=struct.unpack_from('<2I',b,pos);assert size>=8 and pos+size<=len(b)
            if cmd==0x32:platforms.append(struct.unpack_from('<I',b,pos+8)[0])
            pos+=size
           assert pos==32+cmdbytes and platforms==[2]
           assert subprocess.check_output(['lipo','-archs',str(image)],text=True).strip()=='arm64'
           print('R862_NATIVE_IMAGE_VERIFIED',image.name,len(b),kind,platforms)
          if exe.stat().st_size<100000:
           debug=app/'ChampionsOnDeviceResearch.debug.dylib'
           assert debug in images and debug.stat().st_size>100000
           assert debug.name in subprocess.check_output(['otool','-L',str(exe)],text=True)
          assert d['DTPlatformName']=='iphoneos'
          members={str(p.relative_to(app)):{'bytes':p.stat().st_size,'sha256':sha(p.read_bytes())} for p in sorted(app.rglob('*')) if p.is_file()}
          Path('R861Delivery/app_members.json').write_text(json.dumps(members,sort_keys=True,indent=2)+'\n')
          assert list(app.glob('*.xcprivacy'))
          Path('R861Delivery/generated_project_sha256.txt').write_text(sha((s/derived).read_bytes())+'\n')
          print('R862_BUILT_APP_IDENTITY_INPUTS_ARM64_PRIVACY_VERIFIED',d['CFBundleVersion'],d['CFBundleIdentifier'])
          PY
          mkdir -p "$RUNNER_TEMP/r861_payload/Payload"
          ditto "$R861_APP" "$RUNNER_TEMP/r861_payload/Payload/ChampionsOnDeviceResearch.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/r861_payload/Payload" R861Delivery/R861_Unsigned_DeviceTest.ipa
          python3 - <<'PY'
          from pathlib import Path
          import json,zipfile,hashlib,plistlib,os,datetime,base64,lzma
          out=Path('R861Delivery');ipa=out/'R861_Unsigned_DeviceTest.ipa';sha=lambda b:hashlib.sha256(b).hexdigest();app=Path(os.environ['R861_APP'])
          assert 100000<ipa.stat().st_size<300000000
          with zipfile.ZipFile(ipa) as z:
           assert z.testzip() is None
           prefix='Payload/ChampionsOnDeviceResearch.app/'
           assert all(not n.startswith('/') and '..' not in Path(n).parts for n in z.namelist())
           info=plistlib.loads(z.read(prefix+'Info.plist'));assert info['CFBundleVersion']=='861'
          members=json.loads((out/'app_members.json').read_text())
          with zipfile.ZipFile(ipa) as z:
           for name,meta in members.items():
            data=z.read(prefix+name);assert len(data)==meta['bytes'] and sha(data)==meta['sha256']
          metrics=json.loads((out/'preflight_metrics.json').read_text())
          receipt={'schema':'trueplan.r862.test-ipa.v1','created_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'revision':'R861','diagnostic':'D121','source_commit':'eea971e2727bd02576091182de9c429cb99d5fb8','source_files':658,'source_tree_sha256':'1ba94539fa012437ef91b574a62ae0308c28c0279cbaab4aeeb54179e8117dfd','preflight_ci':'https://github.com/zeek10191019-stack/true-plan-showdown-verification/actions/runs/43898577562','packaging_ci':os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],'packaging_commit':os.environ['GITHUB_SHA'],'swift':metrics,'iphoneos_build':'PASS','build_configuration':'Debug arm64 CODE_SIGNING_ALLOWED=NO','ipa_name':ipa.name,'ipa_bytes':ipa.stat().st_size,'ipa_sha256':sha(ipa.read_bytes()),'zip_crc_and_executable_readback':'PASS','all_app_member_readback':'PASS','native_image_members':{name:meta for name,meta in members.items() if name.endswith('.dylib') or name=='ChampionsOnDeviceResearch'},'app_version':'0.8.61','app_build':'861','real_299mb_split_readback':'PASS','ten_part_scaled_readback':'PASS','eleven_part_and_corrupt_part_hold':'PASS','physical_iphone_test':'PENDING','whole_79_field_certified':False,'no_inventoried_live_decoder_count':22,'current_battle_turn':'UNKNOWN_WITHOUT_EXPLICIT_PROOF','visual_form_scope':'TYRANITAR_BASE_MEGA_LIMITED_ESTIMATED','own_real_mega_positive_tested':False,'movie_to_png_unique_alignment_certified':False,'actual_lcd_under_1000ms_certified':False}
          (out/'VERIFICATION_R861.json').write_text(json.dumps(receipt,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          (out/'SHA256SUMS.txt').write_text(receipt['ipa_sha256']+'  '+ipa.name+'\n')
          (out/'DEVICE_TEST_R861.md').write_bytes(lzma.decompress(base64.b64decode('')))
          (out/'SCOPE_R861.md').write_text('# R861 device-test scope\n\nSource and preflight: R861/D121, Swift 688/0, native iPhoneOS arm64. See DEVICE_TEST_R861.md for the audited fixes, real replay scope, measured capture-to-main times and device procedure.\n\nIncludes mandatory OCR receipt synchronization and failed-write rejection before current-state joins; save-first export without extra Vision; late-journal queue; per-capture retained JPEGs with stale-index rejection; explicit stop reasons; immutable-prefix and pending-OCR UI; source-bound full-size lossless PNG with previous-output pixel equality. All 79 fields remain in the evidence inventory.\n\nPhysical iPhone capture/display timing and continuity beyond 48 seconds remain pending. Current turn stays unknown without explicit proof. Visual forms are limited Tyranitar estimates, not own-Mega real-device certification. 22 fields lack an inventoried direct live decoder; complete 79-field recognition is unfinished. Ten-part readback uses scaled parts; the boundary test uses a real 299 MB archive. Files are below 300 MB, at most ten parts, with original evidence preserved on failure.\n')
          print('R862_IPA_ZIP_CRC_SHA_ARM64_READBACK_PASS',json.dumps(receipt,ensure_ascii=False))
          PY
          cat > R861Delivery/RELEASE_NOTES.md <<'EOF'
          R861 / D121 実機収集テスト版（0.8.61、build861、未署名）。既存iLoaderで更新インストールします。
          
