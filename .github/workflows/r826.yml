name: R826 D86 Preserve R823 600 Gates and Fence OCR Session Clock Lineage NO IPA
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/r826.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: r826-d86-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private == false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    steps:
    - name: Checkout pinned R823 source reconstruction recipe
      uses: actions/checkout@v4
      with:
        ref: 4cc925234f9101a8875744e75049f06e96ce4d90
        fetch-depth: 1
        persist-credentials: false
        path: pinned-r823
        sparse-checkout: .github/workflows/r823.yml
        sparse-checkout-cone-mode: false
    - name: Checkout pinned R821 source patch recipe
      uses: actions/checkout@v4
      with:
        ref: 641a9ee8701484fabaf9344db5a0eaab31c422c3
        fetch-depth: 1
        persist-credentials: false
        path: pinned-r821
        sparse-checkout: .github/workflows/r821.yml
        sparse-checkout-cone-mode: false
    - name: Checkout pinned R819 exact 69-step recipe
      uses: actions/checkout@v4
      with:
        ref: 46b607b88ddb5569fff0fc042dfdb5f0fb6e06f6
        fetch-depth: 1
        persist-credentials: false
        path: pinned-r819
        sparse-checkout: .github/workflows/r819.yml
        sparse-checkout-cone-mode: false
    - name: Checkout pinned R793 original bootstrap
      uses: actions/checkout@v4
      with:
        ref: 37b3e26851c71fcabd65da3299356c1e38c53869
        fetch-depth: 1
        persist-credentials: false
        path: pinned-r793
        sparse-checkout: '.github/workflows/d30.b64

          .github/workflows/r793.yml

          '
        sparse-checkout-cone-mode: false
    - name: Reconstruct full source from pinned D83 recipe only
      shell: bash
      env:
        R823_LANE: real-apple-vision
      run: "set -euo pipefail\nruby -ryaml -rjson -e 'recipe=YAML.load_file(ARGV.fetch(0)); puts JSON.generate(recipe.fetch(\"jobs\"\
        ).fetch(\"verify\").fetch(\"steps\"))' \\\n  pinned-r823/.github/workflows/r823.yml > r824_r823_steps.json\npython3 - <<'R824_BOOT_PY'\n\
        from pathlib import Path\nimport hashlib,json,os,subprocess,sys\nsteps=json.loads(Path('r824_r823_steps.json').read_text())\n\
        assert len(steps)==9,'R824_R823_STEP_COUNT_DRIFT'\nassert steps[3]['name'].startswith('Reconstruct R821 full pinned production\
        \ source')\nassert steps[4]['name'].startswith('R823 repair ordering of two legacy QUICK tests')\ncwd=Path.cwd()\nfor i in (3,4):\n\
        \    s=steps[i]\n    workdir=cwd/s.get('working-directory','.')\n    script=s['run']\n    assert chr(36)+'{{' not in script,('UNEXPECTED_EXPRESSION',i)\n\
        \    print('R824_EXACT_REPLAY',i,s['name'],flush=True)\n    with (cwd/f'R824_replay_step_{i}.log').open('wb') as out:\n    \
        \    p=subprocess.run(['bash','--noprofile','--norc','-e','-o','pipefail','-c',script],cwd=workdir,env=os.environ.copy(),stdout=out,stderr=subprocess.STDOUT,timeout=1800)\n\
        \    tail=(cwd/f'R824_replay_step_{i}.log').read_text(errors='replace')[-4500:]\n    print(tail,flush=True)\n    if p.returncode:sys.exit(p.returncode)\n\
        root=cwd/'pinned-r793/source'\nm=json.loads((root/'source_manifest.json').read_text())\nexcluded={'.build','__pycache__','.swiftpm'}\n\
        fs={str(p.relative_to(root)):p for p in root.rglob('*') if p.is_file() and not excluded.intersection(p.parts)}\nsha=lambda x:hashlib.sha256(x).hexdigest()\n\
        assert len(fs)==596 and set(fs)==set(m)|{'source_manifest.json'},'R824_SOURCE_INVENTORY_DRIFT'\nassert all(sha(fs[n].read_bytes())==h\
        \ for n,h in m.items()),'R824_MANIFEST_HASH_DRIFT'\nt=sha(''.join(n+'\\t'+sha(fs[n].read_bytes())+'\\n' for n in sorted(fs)).encode())\n\
        expected=(cwd/'pinned-r793/R823Proof/SOURCE_TREE_SHA256.txt').read_text().strip()\nassert t==expected,'R824_R823_TREE_SHA_MISMATCH'\n\
        print('R824_SHA_VERIFIED_SOURCE_RESTORED',len(fs),t,flush=True)\nR824_BOOT_PY\n"
