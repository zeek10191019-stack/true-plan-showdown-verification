    - name: Mac Swift 602-test full regression with R826 live evidence race guards
      if: matrix.lane == 'real-apple-vision'
      shell: bash
      run: 'set -uo pipefail

        export R804_CALIBRATION_DIR="$GITHUB_WORKSPACE/pinned-r793/R804Proof"

        export R794_DIAGNOSTIC_DIR="$GITHUB_WORKSPACE/pinned-r793/R796Proof"

        export R792_AUTOMATIC_OCR_DIR="$GITHUB_WORKSPACE/pinned-r793/R796Proof"

        export R761_FIELD_AUDIT_OUTPUT="$GITHUB_WORKSPACE/pinned-r793/R796Proof/FieldSafety.json"

        export R761_APPLE_VISION_OUTPUT="$GITHUB_WORKSPACE/pinned-r793/R796Proof/RealAppleVision.json"

        cd pinned-r793/source/R720_PORTABLE_TESTS

        swift test > "$GITHUB_WORKSPACE/pinned-r793/R826Proof/Swift.log" 2>&1

        status=$?

        printf ''%s\n'' "$status" > "$GITHUB_WORKSPACE/pinned-r793/R826Proof/Swift.exit"

        tail -60 "$GITHUB_WORKSPACE/pinned-r793/R826Proof/Swift.log"

        exit "$status"

        '
    - name: iPhoneOS native device SDK build of all 596 source files NO IPA
      if: matrix.lane == 'iphoneos-compile'
      shell: bash
      working-directory: pinned-r793
      run: "set -euo pipefail\npython3 - <<'R826_XCODE_PY'\nfrom pathlib import Path\nimport hashlib,json,subprocess,sys\nroot=Path('source');sha=lambda\
        \ b:hashlib.sha256(b).hexdigest()\nignore={'.build','__pycache__','.swiftpm'}\ndef source_sha():\n    manifest=json.loads((root/'source_manifest.json').read_text())\n\
        \    fs={str(p.relative_to(root)):p for p in root.rglob('*') if p.is_file() and not any(x in p.parts for x in ignore)}\n   \
        \ assert len(fs)==596 and set(fs)==set(manifest)|{'source_manifest.json'}\n    assert all(sha(fs[n].read_bytes())==h for n,h\
        \ in manifest.items())\n    return sha(''.join(n+'\\t'+sha(fs[n].read_bytes())+'\\n' for n in sorted(fs)).encode())\nexpected=Path('R826Proof/SOURCE_TREE_SHA256.txt').read_text().strip()\n\
        assert source_sha()==expected,'R826_PRE_XCODE_DRIFT'\nsubprocess.run([sys.executable,'source/tools/generate_xcode_project.py'],check=True)\n\
        assert source_sha()==expected,'R826_POST_XCODE_DRIFT'\nprint('R826_VERIFIED_DEVICE_SOURCE_596_FILES')\nR826_XCODE_PY\nxcodebuild\
        \ -project source/app/ios/ChampionsOnDeviceResearch.xcodeproj \\\n  -scheme ChampionsOnDeviceResearch -configuration Debug -sdk\
        \ iphoneos \\\n  -destination 'generic/platform=iOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \\\n  CODE_SIGNING_ALLOWED=NO -derivedDataPath\
        \ \"$RUNNER_TEMP/r826_device\" build \\\n  > R826Proof/iPhoneOS.log 2>&1 || { grep -E 'error:|BUILD FAILED' R826Proof/iPhoneOS.log\
        \ || true; exit 1; }\ngrep -F 'BUILD SUCCEEDED' R826Proof/iPhoneOS.log\n"
    - name: Upload R826 delta evidence NO IPA
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: R826-${{ matrix.lane }}-NO-IPA
        path: pinned-r793/R826Proof/
        if-no-files-found: error
        retention-days: 7
    - name: R826 fail closed on 602 tests and native build
      shell: bash
      env:
        R826_LANE: ${{ matrix.lane }}
      run: "set -euo pipefail\ncd pinned-r793\ntest -s R826Proof/R826_PATCH_REPORT.json\ntest -s R826Proof/SOURCE_TREE_SHA256.txt\n\
        python3 - <<'R826_GATE_PY'\nimport json\nfrom pathlib import Path\nr=json.loads(Path('R826Proof/R826_PATCH_REPORT.json').read_text())\n\
        assert r['source_file_count']==596\nassert r['production_files_changed']==1\nassert r['test_cases_added']==2 and r['old_test_cases_retained']\n\
        assert r['live_device_79_fields_certified']==0\nassert not r['owner_turn_certified'] and not r['ipa_created']\nprint('R826_PATCH_SCOPE_AND_HONEST_GATES_PASS')\n\
        R826_GATE_PY\nif [ \"$R826_LANE\" = real-apple-vision ]; then\n test \"$(cat R826Proof/Swift.exit)\" = 0\n grep -F 'Executed\
        \ 602 tests, with 0 failures' R826Proof/Swift.log\n grep -F 'testR826HigherFrameWithRewoundCaptureClockIsNotCurrent' R826Proof/Swift.log\n\
        \ grep -F 'testR826ExplicitForeignRecordingRowIsRejectedWithoutSuppressingValidRow' R826Proof/Swift.log\n grep -F 'testR820QuickOldReservedJobCannotStartVisionAfterCaptureRollover'\
        \ R826Proof/Swift.log\n grep -F 'testR820DetailReservedJobCannotStartVisionAfterRollover' R826Proof/Swift.log\nelse\n grep -F\
        \ 'BUILD SUCCEEDED' R826Proof/iPhoneOS.log\nfi\necho 'R826_D86_SHA_BOUND_602_FULL_REGRESSION_596_DEVICE_BUILD_NO_IPA'\n"
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: macos-26
          lane: real-apple-vision
        - runner: xcode-27
          lane: iphoneos-compile
