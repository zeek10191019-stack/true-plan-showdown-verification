        app="$RUNNER_TEMP/r973_device/Build/Products/Release-iphoneos/ChampionsOnDeviceResearch.app"
        test "$(lipo -archs "$app/ChampionsOnDeviceResearch")" = arm64
        test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Info.plist")" = 973
        test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist")" = 0.9.73
