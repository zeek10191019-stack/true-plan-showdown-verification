        grep -F "testReadyShareFinishingInBackgroundCanBeOfferedOnActivation]' passed" "$RUNNER_TEMP/r966-swift.log"
        grep -F "testAutomaticShareSkipsPreviouslyOfferedOrUnrelatedOutput]' passed" "$RUNNER_TEMP/r966-swift.log"
