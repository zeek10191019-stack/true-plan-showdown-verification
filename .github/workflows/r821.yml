    - name: R820 iPhoneOS real xcodebuild of 596-file source
      shell: bash
      run: "set -euo pipefail\nif [ '${{ matrix.lane }}' = iphoneos-compile ]; then\n cd pinned-r793\n\
        \ python3 - <<'R820_XCODE_PY'\nfrom pathlib import Path\nimport json,hashlib,subprocess,sys\n\
        root=Path('source');sha=lambda b:hashlib.sha256(b).hexdigest()\nignored={'.build','__pycache__','.swiftpm'}\n\
        def check():\n m=json.loads((root/'source_manifest.json').read_text())\n files={str(p.relative_to(root)):p\
        \ for p in root.rglob('*') if p.is_file() and not any(x in p.parts for x in ignored)}\n\
        \ assert len(files)==596 and set(files)==set(m)|{'source_manifest.json'}\n assert all(sha(files[n].read_bytes())==h\
        \ for n,h in m.items())\n return sha(''.join(n+'\\t'+sha(files[n].read_bytes())+'\\\
        n' for n in sorted(files)).encode())\nexpect=Path('R820Proof/SOURCE_TREE_SHA256.txt').read_text().strip()\n\
        assert check()==expect,'R820_PRE_XCODE_SOURCE_DRIFT'\nsubprocess.run([sys.executable,'source/tools/generate_xcode_project.py'],check=True)\n\
        assert check()==expect,'R820_POST_XCODE_SOURCE_DRIFT'\nfor fn in ('R767QuickEpochExecutionPool.swift','R768DetailEpochExecutionPool.swift'):\n\
        \ assert 'beginPhysicallyIfCurrent' in (root/'app/ios/ChampionsOnDevice'/fn).read_text()\n\
        print('R820_596_VERIFIED_XCODE_PRODUCTION_SOURCES')\nR820_XCODE_PY\n xcodebuild -project\
        \ source/app/ios/ChampionsOnDeviceResearch.xcodeproj \\\n   -scheme ChampionsOnDeviceResearch\
        \ -configuration Debug -sdk iphoneos \\\n   -destination 'generic/platform=iOS' ARCHS=arm64\
        \ ONLY_ACTIVE_ARCH=YES \\\n   CODE_SIGNING_ALLOWED=NO -derivedDataPath \"$RUNNER_TEMP/r820_device\"\
        \ build \\\n   > R820Proof/iPhoneOS.log 2>&1 || { grep -E 'error:|BUILD FAILED' R820Proof/iPhoneOS.log\
        \ || true; exit 1; }\n grep -F 'BUILD SUCCEEDED' R820Proof/iPhoneOS.log\nfi\n"
    - name: R820 upload delta evidence NO IPA
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: R820-${{ matrix.lane }}-NO-IPA
        path: pinned-r793/R820Proof/
        if-no-files-found: warn
        retention-days: 7
    - name: R820 fail closed Mac 600 and iPhoneOS source proof
      shell: bash
      run: "set -euo pipefail\ncd pinned-r793\ntest -s R820Proof/SOURCE_INTEGRITY.json\ntest\
        \ -s R820Proof/SOURCE_TREE_SHA256.txt\nif [ '${{ matrix.lane }}' = real-apple-vision\
        \ ]; then\n test \"$(cat R820Proof/Swift.exit)\" = 0\n grep -F 'Executed 600 tests,\
        \ with 0 failures' R820Proof/Swift.log\n grep -F 'testR820QuickOldReservedJobCannotStartVisionAfterCaptureRollover'\
        \ R820Proof/Swift.log\n grep -F 'testR820DetailReservedJobCannotStartVisionAfterRollover'\
        \ R820Proof/Swift.log\nelse\n grep -F 'BUILD SUCCEEDED' R820Proof/iPhoneOS.log\nfi\n\
        printf '%s\\n' 'R820_D80_SUCCESS_PHYSICAL_START_EPOCH_FENCE_NO_DEVICE_79_CERTIFICATION_NO_IPA'\n"
