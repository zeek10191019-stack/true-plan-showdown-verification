        ignored={'.build','__pycache__','.swiftpm'}\ndef files(): return {str(p.relative_to(root)):p\
        \ for p in root.rglob('*') if p.is_file() and not any(part in ignored for part in p.parts)}\n\
        fs=files()\nassert len(fs)==595 and set(fs)==set(manifest)|{'source_manifest.json'},'R820_BASE_FILE_INVENTORY_MISMATCH'\n\
        assert all(sha(fs[k].read_bytes())==v for k,v in manifest.items()),'R820_BASE_MEMBER_SHA_MISMATCH'\n\
