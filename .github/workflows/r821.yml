name: R821 D81 Fix GitHub Expression Parsing and Retain R820 OCR Epoch Fence NO IPA
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/r821.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: r821-d81-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'zeek10191019-stack/true-plan-showdown-verification' && github.event.repository.private
      == false
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: macos-26
          lane: real-apple-vision
        - runner: xcode-27
          lane: iphoneos-compile
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    steps:
    - name: Checkout immutable R819 recipe only
      uses: actions/checkout@v4
      with:
        ref: 46b607b88ddb5569fff0fc042dfdb5f0fb6e06f6
        fetch-depth: 1
        persist-credentials: false
        path: pinned-r819
        sparse-checkout: .github/workflows/r819.yml
        sparse-checkout-cone-mode: false
    - name: Checkout immutable R793 base only
      uses: actions/checkout@v4
      with:
        ref: 37b3e26851c71fcabd65da3299356c1e38c53869
        fetch-depth: 1
        persist-credentials: false
        path: pinned-r793
        sparse-checkout: '.github/workflows/d30.b64

          .github/workflows/r793.yml'
        sparse-checkout-cone-mode: false
    - name: R820 replay exact 69-step SHA pinned R819 Mac iPhoneOS baseline
      shell: bash
      run: "set -euo pipefail\ncat > r820_replay.py <<'R820_REPLAY_PY'\n#!/usr/bin/env python3\n\
        import json,os,subprocess,sys,hashlib\nfrom pathlib import Path\nlane=sys.argv[1]\n\
        assert lane in ('real-apple-vision','iphoneos-compile'), 'UNKNOWN_LANE'\nworkspace=Path.cwd()\n\
        recipe=workspace/'pinned-r819/.github/workflows/r819.yml'\nroot=workspace/'pinned-r793'\n\
        assert (root/'.git').exists(), 'R793_PINNED_CHECKOUT_MISSING'\nassert subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip()=='37b3e26851c71fcabd65da3299356c1e38c53869'\n\
        actual=hashlib.sha256(recipe.read_bytes()).hexdigest()\nassert actual=='82f6d5e96d4d67ce992c6242cab63164f7262e9b6ac4706513d1b94c2345ed25',('R819_RECIPE_SHA_MISMATCH',actual)\n\
        # Ruby Psych is included with the macOS runner. No pip/network packages are installed.\n\
        ruby=\"require 'yaml';require 'json';d=YAML.load_file(ARGV.fetch(0));puts JSON.generate(d.fetch('jobs').fetch('verify').fetch('steps'))\"\
        \nsteps=json.loads(subprocess.check_output(['ruby','-e',ruby,str(recipe)],text=True))\n\
        assert len(steps)==69,'R819_ORIGINAL_STEPS_NOT_PRESERVED'\nbase_env=os.environ.copy()\n\
        base_env['GITHUB_WORKSPACE']=str(root)\nbase_env['R820_REPLAY_LANE']=lane\n# Retain\
        \ a durable audit trail: per-stage logs of the exact R819 recipe.\nlogdir=root/'R820Proof/R819Replay';logdir.mkdir(parents=True,exist_ok=True)\n\
        for i,step in enumerate(steps):\n command=step.get('run')\n if not command:\n  continue\
        \  # The pinned recipe's actions/checkout and upload-artifact are managed outside this\
        \ shell replay.\n condition=step.get('if','')\n if \"matrix.lane == 'real-apple-vision'\"\
        \ in condition and lane!='real-apple-vision': continue\n if \"matrix.lane == 'iphoneos-compile'\"\
        \ in condition and lane!='iphoneos-compile': continue\n assert not condition or condition\
        \ in ('always()',\"matrix.lane == 'real-apple-vision'\",\"matrix.lane == 'iphoneos-compile'\"\
        ,\"always() && matrix.lane == 'real-apple-vision'\"),('UNKNOWN_R819_STEP_CONDITION',i,condition)\n\
        \ name=step.get('name','unknown')\n cmd=command.replace(chr(36)+'{{ matrix.lane }}',lane)\n\
        \ assert chr(36)+'{{' not in cmd,('UNEXPANDED_GITHUB_EXPRESSION',i)\n print(f'R820 replay {i:02d}/68\
        \ [{lane}] {name}',flush=True)\n with (logdir/f'{i:02d}.log').open('wb') as output:\n\
        \  result=subprocess.run(['bash','--noprofile','--norc','-e','-o','pipefail','-c',cmd],cwd=root,env=base_env,stdout=output,stderr=subprocess.STDOUT,timeout=1200)\n\
        \ if result.returncode:\n  print(f'R820_R819_REPLAY_STEP_FAILED {i} {name}: exit={result.returncode}',file=sys.stderr,flush=True)\n\
        \  print((logdir/f'{i:02d}.log').read_text(errors='replace')[-9000:],file=sys.stderr,flush=True)\n\
        \  raise SystemExit(result.returncode)\nassert (root/'R819Proof/SOURCE_TREE_SHA256.txt').read_text().strip()=='da7dbd52ce4a73f1054779b4da130a724f9398137ae65125d3768123deb291c9'\n\
        print('R820_ORIGINAL_R819_SOURCE_REPLAY_69_STEPS_MATCH_SHA',lane,flush=True)\nR820_REPLAY_PY\n\
        python3 r820_replay.py '${{ matrix.lane }}'\n"
    - name: R820 apply 6-member SHA bounded production QUICK DETAIL fence
      shell: bash
      working-directory: pinned-r793
      run: "set -euo pipefail\nmkdir -p R820Proof\npython3 - <<'R820_PATCH_PY'\nfrom pathlib\
        \ import Path\nimport base64,hashlib,lzma,json\nroot=Path('source');sha=lambda b:hashlib.sha256(b).hexdigest()\n\
